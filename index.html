<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reports</title>
  <style>
    :root { --h: 56px; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#0b1220; color:#e5e7eb; }
    header{
      position: sticky; top:0; z-index:10;
      height: var(--h);
      display:flex; align-items:center; gap:10px;
      padding: 10px 12px;
      background: rgba(15,23,42,.92);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; }
    button.tab{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color:#e5e7eb;
      padding:8px 10px;
      border-radius: 999px;
      font-weight: 700;
      cursor:pointer;
    }
    button.tab.active{
      background: rgba(255,255,255,.16);
      border-color: rgba(255,255,255,.28);
    }
    .spacer { flex:1; }
    button.small{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color:#e5e7eb;
      padding:8px 10px;
      border-radius: 12px;
      font-weight: 700;
      cursor:pointer;
    }
    iframe{
      width:100%;
      height: calc(100vh - var(--h));
      border:0;
      background:#fff; /* report background */
    }
  </style>
</head>
<body>
  <header>
    <div class="tabs">
      <button class="tab" data-key="a" data-src="/listening.html">Social Listening Report</button>
      <button class="tab" data-key="b" data-src="/social.html">Social Media Report</button>
    </div>
    <div class="spacer"></div>
    <button class="small" id="reload">Reload</button>
  </header>

  <iframe id="viewer" src="" loading="lazy"></iframe>

  <script>
    const tabs = [...document.querySelectorAll(".tab")];
    const viewer = document.getElementById("viewer");
    const reloadBtn = document.getElementById("reload");

    function setActive(key, src) {
      tabs.forEach(t => t.classList.toggle("active", t.dataset.key === key));

      // cache-bust so you always see the newest report after updates
      const url = new URL(src, window.location.href);
      url.searchParams.set("v", Date.now()); // avoids stale CDN caching
      viewer.src = url.toString();

      // keep state in URL hash so you can share links
      window.location.hash = key;
    }

    tabs.forEach(btn => {
      btn.addEventListener("click", () => setActive(btn.dataset.key, btn.dataset.src));
    });

    reloadBtn.addEventListener("click", () => {
      // reload same tab (also cache-bust)
      const active = tabs.find(t => t.classList.contains("active")) || tabs[0];
      setActive(active.dataset.key, active.dataset.src);
    });

    // on load: choose hash tab if present
    const hashKey = (window.location.hash || "").replace("#", "");
    const initial = tabs.find(t => t.dataset.key === hashKey) || tabs[0];
    setActive(initial.dataset.key, initial.dataset.src);
  </script>
</body>
</html>
