rgin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-09        →        2026-09-07      </span>      <span class=&quot;pill&quot;>        20 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 80,853.11</strong>        <small>          2026-08-09          to          2026-09-07        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>7,003,195</strong>        <small>          12,137,811 impressions          ·          1.73 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>531</strong>        <small>          0.87% CTR          ·          THB 0.77 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 26,951.04 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>12</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 6.66</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account spent THB 80,853.11 and generated very large reach and engagement: 12,137,811 impressions, 7,003,195 reach, 1,451,720 page engagements, 1,338,987 video views, and 31,296 likes. However, the business goal is profitable ticket sales and qualified leads, and the data shows no purchase actions, no ROAS, only 1 tracked lead, and 12 messaging conversations started. Lead volume is below the minimum_results_before_decision of 3, so lead profitability cannot be judged yet. Current spend is heavily weighted toward followers, likes, and engagement rather than sales or qualified lead generation.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate conversion objectives from follower and engagement campaigns            </h3>            <p>              <strong>Why:</strong>              Most spend is going into follower/likes/engagement campaigns, while the account recorded only 1 lead and no purchases.            </p>            <p>              <strong>Do this:</strong>              Create dedicated lead, messaging, and purchase/sales campaigns instead of expecting campaigns named Followers, Follows Likes, or Page Follow Visibility to drive ticket sales.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale New post engagement campaign for traffic/engagement            </h3>            <p>              <strong>Why:</strong>              New post engagement campaign produced 355 of 531 account inline link clicks while spending only THB 2,037.85.            </p>            <p>              <strong>Do this:</strong>              Increase budget carefully and monitor inline link click cost, post engagement cost, and downstream lead/message actions before larger scaling.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce budget from high-spend follower campaigns that are not producing business outcomes            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN and Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination together spent THB 55,076.33 but produced only 1 tracked lead, 13 messaging conversation starts, and no purchases.            </p>            <p>              <strong>Do this:</strong>              Keep a smaller always-on awareness/follower budget, but move incremental budget into lead, messaging, and purchase tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild ERROR QUARANTINED campaigns before further scaling            </h3>            <p>              <strong>Why:</strong>              Multiple campaigns include ERROR QUARANTINED in the campaign name and several have meaningful spend but weak traffic or conversion output.            </p>            <p>              <strong>Do this:</strong>              Duplicate only the useful creatives/audiences into clean campaign builds, then stop scaling the quarantined versions. Do not make performance decisions on the THB 4-7 tiny-sample campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix reporting around clicks, link clicks, leads, and purchases            </h3>            <p>              <strong>Why:</strong>              The account shows 105,020 clicks but only 531 inline link clicks, meaning most clicks are engagement/profile clicks rather than traffic. Purchase tracking is absent.            </p>            <p>              <strong>Do this:</strong>              Report traffic using inline_link_clicks or landing page views, validate pixel/CAPI purchase events, and confirm lead event deduplication before judging ticket sales performance.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best traffic-efficient campaign in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 2,037.85, generated 355 inline link clicks, 280,033 post engagements, 264,194 video views, CPM THB 2.41, and frequency 1.17.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this campaign or its creatives as the base for traffic, retargeting, and lead-generation tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 28,344.77, generated 25,575 likes, 504,778 page engagements, 479,203 post engagements, 427,643 video views, CTR 4.23%, and CPC THB 0.43.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if follower growth is a secondary KPI, but cap budget because it did not produce tracked leads, messages, or purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient awareness reach, but not useful for traffic or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 6,242.43, reached 5,634,821 people, delivered 8,827,062 impressions, CPM THB 0.71, 458,877 post engagements, but only 1 inline link click and no leads or purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if cheap reach is required. Otherwise reduce or rebuild into a clean non-quarantined awareness campaign with a separate conversion path.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Produced the only tracked lead and most messaging activity, but with very high spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 26,731.56, generated 1 lead, 9 messaging conversations started, 7 messaging conversations replied, 1,518 likes, and 129,611 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not pause solely on lead performance because lead volume is below the minimum of 3. Rebuild this into a proper lead or messaging campaign and judge after at least 3 leads or qualified conversations.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Account purchase performance            </h3>            <p>              Purchase performance cannot be evaluated.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              No purchase actions, no purchase value, and no ROAS are present in the supplied data despite the business goal including profitable ticket sales.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not optimize ticket-sale budget decisions from this data until purchase tracking is active and purchase results are recorded.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account lead performance            </h3>            <p>              Lead volume is insufficient for a decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Only 1 tracked lead was recorded from THB 80,853.11 spend, below the minimum_results_before_decision of 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Launch a dedicated lead campaign and wait until at least 3 leads before deciding whether to scale, reduce, or pause based on lead performance.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              High spend with weak traffic output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 26,731.56, generated 20,535 clicks but only 4 inline link clicks, plus only 1 tracked lead and no purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce follower/likes budget here and rebuild for leads, messages, or landing page traffic depending on the desired action.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Massive reach but almost no link traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              8,827,062 impressions and THB 6,242.43 spend produced only 1 inline link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not use this campaign for traffic, leads, or ticket sales. Use it only as low-cost awareness or rebuild it with a traffic/conversion objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Duplicate Broad Destination and ERROR QUARANTINED Follows Likes campaigns            </h3>            <p>              Budget is fragmented across many similar campaigns with repeated names.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Multiple campaigns named Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination and ERROR QUARANTINED | Aquaverse India Daily Follows Likes were active, with spend ranging from THB 4.26 to THB 26,731.56.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate duplicate campaigns into fewer clean builds so budget can exit learning fragmentation and reporting is easier to act on.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead, messaging, and purchase/sales tests              </strong>            </div>            <p>              This campaign consumed THB 28,344.77 and is strong for followers/engagement, but it generated no tracked leads, no messaging starts, and no purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Rebuilt lead or messaging campaign using the same strongest audience/creative signals              </strong>            </div>            <p>              It spent THB 26,731.56 and produced the only tracked lead and 9 messaging starts, but the objective appears follower/likes focused and produced only 4 inline link clicks.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign or a clean awareness retargeting pool              </strong>            </div>            <p>              It is efficient for reach but generated only 1 inline link click from THB 6,242.43 spend. New post engagement campaign generated 355 inline link clicks from THB 2,037.85.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate ERROR QUARANTINED Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                One consolidated clean campaign structure              </strong>            </div>            <p>              Repeated campaign names and fragmented spend make optimization harder, especially where several campaigns have 0 inline link clicks and no leads.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Dedicated lead generation test            </h3>            <p>              <strong>Setup:</strong>              Build a new lead campaign using Instant Form or website lead optimization. Use clear ticket/lead qualification questions and separate it from follower campaigns.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 leads. Track cost per lead and lead quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Use the audience/creative learnings from Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, which generated 9 messaging conversation starts, but rebuild under a messaging objective with qualifying prompts.            </p>            <p>              <strong>Success metric:</strong>              Cost per messaging conversation started, messaging replies, and qualified conversation rate after at least 3 qualified conversations.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Traffic test using New post engagement campaign creatives            </h3>            <p>              <strong>Setup:</strong>              Create a traffic or landing page view campaign using the best creative from New post engagement campaign and send users to the ticket or lead page.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, landing page views if available, and downstream leads or purchases.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot
