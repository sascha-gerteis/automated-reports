uot;>        2026-08-21        →        2026-09-19      </span>      <span class=&quot;pill&quot;>        16 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 36,762.38</strong>        <small>          2026-08-21          to          2026-09-19        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>713,137</strong>        <small>          2,046,895 impressions          ·          2.87 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>98</strong>        <small>          3.10% CTR          ·          THB 0.58 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 17.96</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account is generating strong awareness and engagement volume, but it is not aligned with the stated goal of profitable ticket sales and qualified leads. Spend was THB 36,762.38, producing 2,046,895 impressions, 713,137 reach, 500,278 page engagements, 433,175 video views, and 24,439 likes. However, only 98 link clicks were reported, only 1 messaging conversation was recorded, and no lead or purchase actions were reported. Awareness/follower performance is strongest in AQ_MU2025_Followers_IN, while traffic, lead, messaging, and purchase performance are either underdeveloped or not measurable from the supplied data.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild around sales and lead objectives            </h3>            <p>              <strong>Why:</strong>              The business goal is ticket sales and qualified leads, but the account recorded 0 leads and 0 purchases from THB 36,762.38 spend.            </p>            <p>              <strong>Do this:</strong>              Create dedicated purchase and lead campaigns once tracking is verified; do not judge current follower/engagement campaigns by purchases because they are not producing or reporting purchase data.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN but cap or carefully scale it            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN drove most of the account&amp;#039;s engagement: 422,156 page engagements, 22,399 likes, 360,127 video views, and 97 of 98 link clicks from THB 24,963.62 spend.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign active for awareness/follower growth, but do not aggressively scale until frequency is controlled because frequency is already 4.59.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce fragmented Broad Destination follower campaigns            </h3>            <p>              <strong>Why:</strong>              Several ERROR QUARANTINED Broad Destination campaigns spent meaningful budget with 0 inline link clicks and higher cost per like than AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Do this:</strong>              Reduce or rebuild the larger Broad Destination duplicates and move budget into a consolidated structure with clear objectives: one awareness/follower campaign, one lead campaign, and one purchase/traffic campaign.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix reporting and attribution before scaling sales activity            </h3>            <p>              <strong>Why:</strong>              There are 63,447 clicks but only 98 link clicks, indicating most clicks are engagement clicks rather than site visits. No purchase, lead, ROAS, or revenue data is visible.            </p>            <p>              <strong>Do this:</strong>              Audit pixel, conversion API, lead events, purchase events, UTMs, and event prioritization before making sales-performance decisions.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Do not make hard decisions from tiny samples            </h3>            <p>              <strong>Why:</strong>              Several campaigns have very small delivery, such as the 2026-08-28 Broad Destination campaigns with only THB 4.26 to THB 7.06 spend.            </p>            <p>              <strong>Do this:</strong>              Exclude tiny-delivery campaigns from performance decisions until they reach at least the supplied minimum of 3 relevant results for their objective.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best awareness/follower campaign in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 24,963.62 spend generated 1,504,075 impressions, 422,156 page engagements, 22,399 likes, 360,127 video views, 97 link clicks, CTR 3.55%, and cost per like of approximately THB 1.11.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active for awareness and retargeting audience building. Scale cautiously only if frequency and cost per like remain stable; current frequency is 4.59.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient low-cost awareness delivery, but not traffic delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 202.50 spend produced 284,015 impressions, 279,087 reach, frequency 1.02, CPM THB 0.71, 16,102 page engagements, and 15,888 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is cheap reach/video visibility. Do not use it for traffic or sales because it produced 0 inline link clicks and CTR was only 0.037%.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Promising engagement signal but insufficient delivery to scale confidently.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 153.64 spend generated 76 likes and CTR 14.34%, but only 516 impressions and 476 reach.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not scale based on this tiny delivery. Re-test with controlled budget and cleaner campaign naming if Thailand audience growth is still relevant.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              One duplicate showed the lowest cost per like among the larger Broad Destination duplicates.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign ID 120251570556340402 spent THB 352.60 and generated 88 likes, approximately THB 4.01 per like, with CTR 4.09%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              If keeping any Broad Destination follower test, use this as the reference variant, but it is still materially less efficient than AQ_MU2025_Followers_IN at approximately THB 1.11 per like.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Account-level traffic, lead, messaging, and purchase performance            </h3>            <p>              The account is not producing measurable sales or lead outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 36,762.38 spend generated 0 reported leads, 0 reported purchases, 0 ROAS data, only 98 link clicks, and only 1 messaging conversation.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not increase spend toward sales until tracking and campaign objectives are corrected. Build dedicated lead and purchase campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              High spend with no link traffic and weaker follower efficiency than the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,304.20 spend, 85,233 impressions, 762 likes, 19,292 page engagements, 0 inline link clicks, and approximately THB 5.65 per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. If the goal is follower growth, shift budget toward AQ_MU2025_Followers_IN or a consolidated follower test. If the goal is sales/leads, move budget into lead or purchase campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Duplicate campaigns are fragmenting budget and mostly failing to drive link traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign IDs 120251495841180402, 120251495843190402, and 120251495845220402 spent THB 1,487.24, THB 1,022.51, and THB 2,430.56 respectively. Combined they generated only 1 link click, with cost per like ranging from approximately THB 5.11 to THB 7.15.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate these duplicates into one clean campaign or stop funding them in favor of the stronger AQ_MU2025_Followers_IN and new lead/purchase tests.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Messaging result is too small to judge and not enough to scale.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign ID 120251495845220402 generated 1 messaging conversation, 1 first reply, and 1 link click from THB 2,430.56 spend, below the minimum_results_before_decision of 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make a hard pause/scale decision based on the single message. If messaging is a priority, rebuild as a dedicated click-to-message campaign and wait for at least 3 messaging results before judging.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data for performance decisions.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The 2026-08-28 duplicates spent only THB 7.06, THB 4.26, THB 6.55, and THB 6.64 respectively, with fewer than meaningful delivery levels.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause or scale based on this tiny sample. Exclude from conclusions or relaunch within a consolidated test structure.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead and purchase campaign structure              </strong>            </div>            <p>              This campaign spent THB 4,304.20 with 0 inline link clicks and no leads or purchases. It is not supporting the stated sales/lead goal.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination duplicates              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN for awareness plus new conversion/lead campaigns              </strong>            </div>            <p>              The three larger 2026-08-25 duplicates spent THB 4,940.31 combined and produced only 1 link click. AQ_MU2025_Followers_IN is more efficient for follower growth, while sales/lead budget needs a separate objective.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Fragmented ERROR QUARANTINED Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                One consolidated Broad Destination test              </strong>            </div>            <p>              Multiple campaigns share the same name and objective, splitting data and budget. Consolidation will produce cleaner learning and easier optimization.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Incremental budget planned for follower campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting audiences built from AQ_MU2025_Followers_IN engagements              </strong>            </div>            <p>              AQ_MU2025_Followers_IN generated 422,156 page engagements and 360,127 video views, creating a usable warm audience for ticket, lead, messaging, or traffic follow-up.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Purchase campaign tracking test            </h3>            <p>              <strong>Setup:</strong>              After verifying pixel/CAPI purchase events, launch a dedicated ticket sales campaign using purchase optimization. Use clear ticket-sale creative and URL UTMs.            </p>            <p>              <strong>Success metric:</strong>              At least 3 reported purchase events before making a decision, then evaluate cost per purchase and purchase volume.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Qualified lead form campaign            </h3>            <p>              <strong>Setup:</strong>              Launch a lead objective campaign using instant forms with qualifying questions related to visit timing, group size, and ticket interest.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads before judging; evaluate cost per lead and lead quality from the CRM or manual review.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engagement-to-sales retargeting            </h3>            <p>              <strong>Setup:</strong>              Create retargeting audiences from AQ_MU2025_Followers_IN page engagers and video viewers. Serve ticket/offer creatives rather than follower creatives.            </p>            <p>              <strong>Success metric:</strong>              Link clicks, leads, purchases, and cost per result after minimum result threshold is reached.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Click-to-message qualification test            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated messaging campaign with FAQs, ticket pricing prompts, and visit-planning CTAs. Do not mix it into follower campaigns.            </p>            <p>              <strong>Success metric:</strong>              At least 3 messaging conversations before deciding; then evaluate cost per qualified conversation.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Traffic creative test            </h3>            <p>              <strong>Setup:</strong>              Test follower/engagement creative against direct ticket CTA creative using traffic or sales objective, not engagement objective.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks an
