    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 517,179.89</strong>        <small>          2026-06-24          to          2026-07-23        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>11,180,069</strong>        <small>          38,315,759 impressions          ·          3.43 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>621,975</strong>        <small>          2.55% CTR          ·          THB 0.53 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>36</strong>        <small>          THB 14,366.11 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>7</strong>        <small>          THB 73,882.84 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 2,176.00        </strong>        <small>          0.00× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>283</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 13.50</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large reach and traffic in the period: THB 517,179.89 spend, 38,315,759 impressions, 621,975 link clicks, and 119,147 landing page views. However, bottom-funnel output is weak and tracking is questionable: only 12 leads and 7 purchases were recorded account-wide, with only THB 2,176 purchase value reported. Performance is mixed: some traffic, awareness, engagement, and messaging campaigns are working, but purchase and lead generation are not yet reliable enough to scale broadly.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the only campaign with enough purchase data            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; is the only campaign above the 3-result minimum for purchases, with 4 purchases, 8 leads, 47 messaging conversations started, and THB 2,925.04 spend.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign active and increase budget gradually by 15-20% at a time while monitoring purchases, leads, messaging starts, and recorded purchase value.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild follower campaigns            </h3>            <p>              <strong>Why:</strong>              FB Follow | Thailand | Aquaverse Lifestyle spent THB 54,432.84 for only 3 page likes, and FB Follow | Thailand | Lookalike Fans Scale spent THB 38,060.52 for only 9 page likes and just 30 link clicks.            </p>            <p>              <strong>Do this:</strong>              Move these campaigns to minimal maintenance budget or rebuild them with a clearer objective. Do not continue allocating large budget if the main goal is ticket sales and qualified leads.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix link click to landing page view leakage            </h3>            <p>              <strong>Why:</strong>              The account recorded 621,975 link clicks but only 119,147 landing page views. Several campaigns show severe drop-off, including Claude | TH | Traffic IMAGES | 18Jun with 126,769 link clicks but 11,400 LPVs, and Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-25 with 10,912 link clicks but only 363 LPVs.            </p>            <p>              <strong>Do this:</strong>              Audit landing page speed, marketplace deep links, UTMs, pixel firing, and destination URLs before scaling traffic campaigns further.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild corporate lead generation            </h3>            <p>              <strong>Why:</strong>              Corporate lead campaigns are spending but not producing recorded leads. Aquaverse Corporate Groups - Leads - Test spent THB 13,056.74 with 0 leads and only 113 LPVs. TH | B2B Corporate | Video | Leads | 2026-06-18 spent THB 23,977.60 with 0 leads and frequency 6.72.            </p>            <p>              <strong>Do this:</strong>              Reduce corporate lead spend and relaunch using high-intent instant forms or a verified lead landing page, using the best traffic creative from Claude | TH | Corporates | Thai | 2026-06-19.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Consolidate ticket traffic budget into strongest LPV campaigns            </h3>            <p>              <strong>Why:</strong>              Some ticket campaigns produce efficient landing page views while others generate clicks without page loads. Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026 produced 6,486 LPVs from THB 4,608.28 spend, while Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-25 produced only 363 LPVs from THB 8,342.60 spend.            </p>            <p>              <strong>Do this:</strong>              Shift budget away from low-LPV ticket campaigns into the Hot Weather 20 Jun and best 19 Jun variants, then retarget LPV and messaging audiences.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best bottom-funnel campaign in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,925.04 spend, 4 purchases, 8 leads, 47 messaging conversations started, 49 messaging replies, and THB 2,176 recorded purchase value.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale because it exceeds the 3-result minimum for purchase decisions.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;หมุนกันกี่รอบ...ก็สนุกไม่เปลี่ยน💦&amp;quot;            </h3>            <p>              Strong messaging response from a small spend level.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 667.10 spend, 49 messaging conversations started, 48 messaging replies, 52 messaging connections, 1 lead, and 1 purchase.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a messaging creative winner, but do not make a purchase decision yet because it has only 1 purchase.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026            </h3>            <p>              Strong traffic quality among ticket campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,608.28 spend, 19,228 link clicks, 6,486 landing page views, 13.97% CTR, and low drop-off versus many other traffic campaigns.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and use as a model for new ticket-sales traffic tests.            </div>          </div>                  <div class get-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-06-24        →        2026-07-23      </span>      <span class=&quot;pill&quot;>        95 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,675,446.41</strong>        <small>          2026-06-24          to          2026-07-23        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>89,047,018</strong>        <small>          225,219,806 impressions          ·          2.53 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>6,366,298</strong>        <small>          3.29% CTR          ·          THB 0.23 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>360</strong>        <small>          THB 4,654.02 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 837,723.21 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>3,270</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.44</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated very large reach and traffic: 225,219,806 impressions, 6,366,298 link clicks, 1,478,504 landing page views, 120 leads, 3,270 messaging conversations started, and 2 purchases from THB 1,675,446.41 spend. Lead and messaging performance is highly concentrated: &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot;, &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot; produced 87 of 120 leads from only THB 12,910.98 spend. However, a large share of spend is going to awareness, follow, video, and broad traffic campaigns that generate clicks, video views, or page engagement but very few qualified leads or purchases. Purchases are only 2 total, below the minimum_results_before_decision of 3, so purchase performance is not yet decision-ready.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead and messaging winners            </h3>            <p>              <strong>Why:</strong>              The strongest lead-producing campaigns are receiving very little spend but generating most of the measurable leads.            </p>            <p>              <strong>Do this:</strong>              Increase budget carefully on &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot;, &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot;. Scale gradually and monitor CPL, messaging conversation started, and messaging depth.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce conversion budget from high-spend low-lead persona traffic campaigns            </h3>            <p>              <strong>Why:</strong>              The 5-language and 6-language persona campaigns spent THB 786,267.67 and produced only 1 lead, despite 742,984 landing page views.            </p>            <p>              <strong>Do this:</strong>              Reduce or rebuild &amp;quot;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;quot;, &amp;quot;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;quot;, &amp;quot;Claude | IN | Families | 6 Languages | 2026-06-19&amp;quot;, &amp;quot;Claude | IN | Singles | 6 Languages | 2026-06-19&amp;quot;, and related 5-language/6-language persona campaigns if the goal is leads or ticket sales.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness, traffic, messaging, lead, and purchase budgets            </h3>            <p>              <strong>Why:</strong>              Many campaigns are optimized for engagement, follows, video views, or traffic, but the business goal is profitable ticket sales and qualified leads.            </p>            <p>              <strong>Do this:</strong>              Create separate budget pools: awareness/follow campaigns capped for reach and social proof, traffic campaigns judged by landing page view cost and landing page quality, messaging campaigns judged by conversation started and depth, lead campaigns judged by CPL, and purchase campaigns judged only after at least 3 purchases.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking and attribution before scaling purchase campaigns            </h3>            <p>              <strong>Why:</strong>              Daily reporting shows 0 impressions, 0 clicks, and 0 spend on 2026-07-17 to 2026-07-22 while leads and messaging actions are still recorded. Several campaigns also show very high link clicks but almost no landing page views.            </p>            <p>              <strong>Do this:</strong>              Check pixel/CAPI event setup, landing page view firing, URL destinations, attribution windows, and reporting timezone. Do not make purchase optimization decisions until tracking is verified and purchases exceed the minimum result threshold.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Best lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,225.76 spend, 44 leads, estimated CPL THB 118.77, 947 messaging conversations started, 1,035 total messaging connections, 41,988 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Rebuild this concept into a dedicated lead or messaging campaign while preserving the winning creative/language angle.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,196.50 spend, 26 leads, estimated CPL THB 199.87, 785 messaging conversations started, 843 total messaging connections, 42,584 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Test more Malayalam variants and retarget users who engaged or started conversations.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Very strong lead and messaging response from a small budget.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,488.72 spend, 17 leads, estimated CPL THB 146.40, 381 messaging conversations started, 559 total messaging connections, and 1 purchase. Purchase volume is below the 3-result decision threshold.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale cautiously. Duplicate into structured lead and messaging tests before increasing spend aggressively.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Efficient traffic and landing page volume for awareness/traffic objectives.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 29,911.35 spend, 1,090,261 link clicks, 260,163 landing page views, CTR 7.42%, CPC THB 0.026986.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic/remarketing pool builder, but do not judge it by purchases. Use its landing page visitors for lead and purchase retargeting.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Strong low-cost traffic source.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 18,173.76 spend, 671,737 link clicks, 147,326 landing page views, CTR 7.79%, CPC THB 0.02656.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for traffic generation and retargeting, but pair it with a conversion retargeting campaign because it has no recorded leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN | Image | Aquaverse Traffic | Test 1000INR            </h3>            <p>              High traffic volume and landing page volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 40,325.82 spend, 530,324 link clicks, 137,624 landing page views, CTR 4.58%, CPC THB 0.080194.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the goal is traffic. Retarget its landing page viewers with lead, messaging, and purchase-focused creative.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Very high spend with almost no lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 303,401.62 spend, 1 lead, estimated CPL THB 303,401.62, 1,014,558 link clicks, 213,588 landing page views, 12,995,272 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce sharply or rebuild. If kept, treat as awareness/traffic only, not as a lead or sales driver.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with no recorded leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 124,741.48 spend, 423,462 link clicks, 108,301 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild before further scaling. Test a dedicated corporate lead form or messaging offer instead of broad traffic.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Large traffic and video volume but no measurable leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 78,740.87 spend, 235,962 link clicks, 68,961 landing page views, 2,451,810 video views, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce conversion budget. Re-test families with the winning lead/message creative structure from the English India Show or Start Your Day post.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              High engagement and traffic but no lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 76,789.06 spend, 289,194 link clicks, 76,347 landing page views, 2,993,957 video views, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or move to awareness only. Do not scale for leads until a lead test proves demand.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19            </h3>            <p>              Traffic volume exists, but no leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 76,944.25 spend, 381,526 link clicks, 113,138 landing page views, 3,720,203 video views, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce if lead generation is the goal. Retarget engaged viewers and landing page visitors with a lead or messaging offer.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-28 | 4. Young Adult Travellers            </h3>            <p>              Useful for page/social engagement, weak for qualified traffic or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 27,251.28 spend, 3,603 likes, 32 link clicks, 17 messaging conversations started, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as capped awareness/follower budget. Do not fund from the lead or ticket-sales budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very broad awareness delivery but no direct traffic or lead value.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 20,257.10 spend, 27,743,913 impressions, CPM THB 0.730146, 0 link clicks, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only if reach is a specific objective. Otherwise reallocate budget to lead, messaging, and retargeting campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Automation Test Campaign            </h3>            <p>              Weak traffic quality and poor landing page tracking/output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,408.39 spend, 4,858,775 impressions, CTR 0.072652%, 1,599 link clicks, only 1 landing page view, 2 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild or stop using this setup for traffic. Verify destination URL and landing page view tracking before further spend.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | IN | English | India Show 2025 | Traffic | 2026-06-13              </strong>            </div>            <p>              Corporates 6 Languages spent THB 303,401.62 for 1 lead, while English India Show spent THB 5,225.76 for 44 leads and 947 messaging conversations started.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 5 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13              </strong>            </div>            <p>              Corporates 5 Languages spent THB 124,741.48 with 0 leads, while Malayalam generated 26 leads from THB 5,196.50.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                High-spend persona video/traffic campaigns with 0 leads: Couples, Families, Singles, Party Goers 5-language and 6-language campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;              </strong>            </div>            <p>              The Start Your Day post generated 17 leads and 381 messaging conversations started from only THB 2,488.72.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Daily Follows Likes campaigns used for conversion budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead, messaging, and retargeting campaigns              </strong>            </div>            <p>              Follows Likes campaigns mostly produce page likes, comments, and engagement with very low link-click volume; they should be capped as awareness/social proof, not funded as lead or ticket-sales drivers.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Traffic campaigns with large landing page pools              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <sp
