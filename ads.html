    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 408,641.04</strong>        <small>          2026-07-04          to          2026-08-02        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>9,324,722</strong>        <small>          26,845,780 impressions          ·          2.88 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>464,240</strong>        <small>          2.70% CTR          ·          THB 0.56 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>30</strong>        <small>          THB 13,621.37 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>8</strong>        <small>          THB 51,080.13 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 3,476.00        </strong>        <small>          0.01× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>167</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 15.22</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent 408,641.04 THB and generated very large reach, clicks, video views, and engagement, but tracked lower-funnel output is weak: 10 leads, 8 purchases, and 3,476 THB purchase value. Because cost-per-lead, cost-per-purchase, and ROAS targets are unknown, performance should be judged directionally. The account is over-weighted toward awareness, followers, engagement, and traffic campaigns, while the only campaign with enough purchase volume to make a decision is the boosted post &amp;quot;Post: \&amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...\&amp;quot;&amp;quot;, which produced 7 leads, 4 purchases, and 38 messaging conversations from only 1,964.26 THB spend.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward the only proven lead and purchase driver            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Post: \&amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...\&amp;quot;&amp;quot; generated 7 leads, 4 purchases, 38 messaging conversations, and 2,176 THB purchase value from 1,964.26 THB spend. It is the only campaign above the minimum 3-result threshold for purchases.            </p>            <p>              <strong>Do this:</strong>              Duplicate this post into a structured Messages or Leads campaign, keep the same creative/message angle, and scale budget gradually by 20-30% every few days while monitoring leads, purchases, and messaging conversation quality.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce follower and low-intent engagement spend            </h3>            <p>              <strong>Why:</strong>              &amp;quot;FB Follow | Thailand | Aquaverse Lifestyle&amp;quot; spent 50,943.12 THB for only 3 page likes and no leads or purchases; &amp;quot;FB Follow | Thailand | Lookalike Fans Scale&amp;quot; spent 35,759.59 THB for only 10 page likes and no leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce or pause these follower campaigns unless page growth is a separate priority, and reallocate budget to lead, messaging, ticket-sales, and high-quality traffic campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild lead campaigns that are not generating leads            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Aquaverse Corporate Groups - Leads - Test&amp;quot; spent 11,816.45 THB with 0 leads and only 88 landing page views; &amp;quot;TH | B2B Corporate | Video | Leads | 2026-06-18&amp;quot; spent 12,482.97 THB with 0 leads, 477 landing page views, and frequency 5.05.            </p>            <p>              <strong>Do this:</strong>              Rebuild B2B lead campaigns with a clearer lead form or Messenger CTA, stronger corporate offer, and retargeting of landing page viewers and video viewers instead of continuing current structures.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate traffic optimization from purchase optimization            </h3>            <p>              <strong>Why:</strong>              Many traffic campaigns generate cheap clicks but weak landing page or purchase volume. Account-wide, 464,240 link clicks produced only 54,393 landing page views and 8 purchases.            </p>            <p>              <strong>Do this:</strong>              Keep traffic campaigns only when landing page view quality is strong; use separate retargeting campaigns for purchases, leads, and Messenger follow-up.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              Tracked purchase value is only 3,476 THB against 408,641.04 THB spend, while many marketplace and traffic campaigns may not be capturing final sales.            </p>            <p>              <strong>Do this:</strong>              Audit Meta Pixel, Conversions API, marketplace attribution, purchase value mapping, and duplicate lead/purchase events before making final profitability decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุ     color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-04        →        2026-08-02      </span>      <span class=&quot;pill&quot;>        82 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,192,200.23</strong>        <small>          2026-07-04          to          2026-08-02        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>65,720,732</strong>        <small>          156,422,286 impressions          ·          2.38 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>4,066,925</strong>        <small>          3.10% CTR          ·          THB 0.25 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>255</strong>        <small>          THB 4,675.30 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 596,100.12 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2,081</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.62</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent 1,192,200.23 THB and generated very large reach, traffic, and engagement: 156,422,286 impressions, 4,066,925 link clicks, 1,280,545 landing page views, 85 leads, 1,432 messaging replies, and 2 purchases. Traffic volume is strong, but sales and lead efficiency are concentrated in a few campaigns. Purchase data is below the minimum decision threshold of 3 results, so purchase-level decisions should be treated as inconclusive. Account health is mixed because awareness and traffic delivery are strong, but most spend is not converting into leads or ticket sales.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reallocate budget toward proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              Lead and messaging results are highly concentrated in a small number of campaigns. Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot; generated 17 leads from 1,770.54 THB, while Claude | IN | English | India Show 2025 | Traffic | 2026-06-13 and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13 generated 23 leads each from 3,671.41 THB and 3,648.94 THB.            </p>            <p>              <strong>Do this:</strong>              Carefully scale these three campaigns and create new variants from their winning creatives, audiences, and messaging paths. Increase budget gradually while monitoring lead volume, messaging depth, and purchase tracking.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce large non-converting persona video campaigns            </h3>            <p>              <strong>Why:</strong>              Several high-spend campaigns generated large traffic or video views but no leads or purchases. Claude | IN | Corporates | 6 Languages | 2026-06-19 spent 208,511.90 THB with 657,877 link clicks and 188,027 landing page views but 0 leads and 0 purchases. Claude | IN | Corporates | 5 Languages | 2026-06-19 spent 98,612.43 THB with 314,908 link clicks and 99,389 landing page views but 0 leads and 0 purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce or pause sales/lead budget on the Corporates 6 Languages and Corporates 5 Languages campaigns. Rebuild them only if the objective is changed, the landing page path is fixed, or the audience is retested against a lead or message objective.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness, follower, traffic, messaging, lead, and purchase objectives            </h3>            <p>              <strong>Why:</strong>              The account is mixing campaigns that are good for awareness or followers with campaigns expected to drive sales and leads. This makes budget allocation inefficient for the stated goal of ticket sales and qualified leads.            </p>            <p>              <strong>Do this:</strong>              Keep awareness/follower campaigns on capped budgets, move traffic winners into a retargeting funnel, and run dedicated lead/message/sales campaigns for conversion outcomes.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate tracking and attribution issues before scaling purchase optimization            </h3>            <p>              <strong>Why:</strong>              Daily data shows actions on 2026-07-17 to 2026-07-22 despite 0 impressions, 0 clicks, and 0 spend. Several campaigns also show very low landing page views versus link clicks, such as Claude | IN | English | Water Park &amp;amp; Interview | Traffic | 2026-06-13 with 22,542 link clicks but only 76 landing page views.            </p>            <p>              <strong>Do this:</strong>              Audit pixel, Conversions API, landing page view firing, app/web purchase events, UTMs, and attribution settings before making purchase-based budget decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best lead and messaging performer, with one purchase also attributed, although purchase volume is below the minimum decision threshold.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 1,770.54 THB, 17 leads, 1 purchase, 305 messaging conversations started, 298 messaging first replies, 37 depth-5 message sends, CTR 5.18%. Cost per lead was 104.15 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Build a dedicated lead/message campaign using this post creative, test similar hooks, and retarget people who replied or reached depth 2+.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong qualified lead and messaging volume from low spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 3,671.41 THB, 23 leads, 507 messaging conversations started, 495 first replies, 115 depth-3 message sends, 30 depth-5 message sends. Cost per lead was 159.63 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Duplicate into a lead or messaging objective test and create new English variants around the same India Show angle.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging performance in Malayalam.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 3,648.94 THB, 23 leads, 590 messaging conversations started, 568 first replies, 64 depth-3 message sends, 15 depth-5 message sends. Cost per lead was 158.65 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this as the benchmark for regional-language lead generation and test Malayalam creative variations.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Efficient awareness and traffic generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 19,106.65 THB, 9,279,561 impressions, 675,731 link clicks, 238,365 landing page views, CTR 7.41%, CPM 2.06 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for upper-funnel traffic, but do not judge it by purchases. Use its landing page visitors for retargeting into lead, message, or purchase campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient traffic and landing page view campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 10,181.98 THB, 366,045 link clicks, 130,571 landing page views, CTR 7.68%, CPM 2.10 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an upper-funnel campaign if traffic quality is confirmed. Build retargeting audiences from landing page viewers.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement campaign, but not a sales or lead driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 30,590.13 THB, 22,493 page likes, 62,589 post reactions, 4,728 comments, but only 216 link clicks and no leads or purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth is a defined secondary KPI. Cap budget so it does not compete with lead and ticket-sale campaigns.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              High spend with no lead or purchase outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 208,511.90 THB, 18,518,493 impressions, 657,877 link clicks, 188,027 landing page views, 8,747,883 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause for lead/sales objectives. Rebuild with a clearer corporate offer, lead form, WhatsApp/Messenger qualification flow, or retargeting-only structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Large traffic volume but no conversion output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 98,612.43 THB, 314,908 link clicks, 99,389 landing page views, 3,920,963 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild before further scaling. Test corporate lead forms or message objective instead of broad traffic/video delivery.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              High spend and traffic with no leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 58,960.07 THB, 167,140 link clicks, 63,547 landing page views, 1,653,557 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and retest family creative using a lead or message objective. Keep only if the purpose is upper-funnel video engagement.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              High spend with no lead or purchase output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 56,309.49 THB, 202,293 link clicks, 68,559 landing page views, 2,054,897 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce spend and move budget to proven lead/message campaigns. Retest Singles only with a stronger offer and conversion objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Good for engagement but weak for traffic and leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 13,990.14 THB, 1,901,454 post engagements, 117,588 post reactions, but only 2,853 link clicks and 3 leads. CTR was 0.15%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as engagement support. Do not scale for sales or leads unless rebuilt with a stronger CTA and conversion objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-28 | 1. Broad Destination            </h3>            <p>              Follower/engagement activity is not translating into site traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 14,161.44 THB, 1,071 page likes, 100,627 page engagements, but only 15 link clicks and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce if the goal is ticket sales or qualified leads. Keep only under a separate follower-growth budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Automation Test Campaign            </h3>            <p>              Very low click engagement and no conversion signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 1,906.50 THB, 2,883,660 impressions, CTR 0.075%, 1,008 link clicks, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale. Rebuild the test with clearer creative, audience, and objective before spending more.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19 and Claude | IN | Corporates | 5 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13              </strong>            </div>            <p>              The two Corporates campaigns spent 307,124.33 THB with 0 leads and 0 purchases, while the three recommended campaigns generated 63 combined leads from 9,090.89 THB.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                High-spend persona video traffic campaigns with 0 leads, including Families 6 Languages, Singles 6 Languages, Couples 6 Languages, and Party Goers 6 Languages              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated retargeting campaigns for landing page viewers, message engagers, and video viewers              </strong>            </div>            <p>              These campaigns generated traffic and video views but no leads. Their audiences should be moved into lower-funnel retargeting rather than continuing broad prospecting spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Repeated Aquaverse India Daily Follows Likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                A capped follower budget or AQ_MU2025_Followers_IN              </strong>            </div>            <p>              Many Follows Likes campaigns generated very few link clicks and limited lead output. AQ_MU2025_Followers_IN produced 22,493 likes from 30,590.13 THB and is the clearer follower performer.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                General traffic campaigns after audience building              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Lead, message, or purchase retargeting campaigns              </strong>            </div>            <p>              Traffic campaigns generated 1,280,545 landing page views account-wide, but only 85 leads and 2 purchases. More budget should be used to convert existing warm audiences.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead objective test using winning post creative            </h3>            <p>              <strong>Setup:</strong>              Duplicate Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot; into a dedicated lead campaign. Test instant form versus website lead flow, using the same creative and audience where possible.            </p>            <p>              <strong>Success metric:</strong>              Lead volume after at least 3 leads, cost per lead, and downstream message quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Messaging objective test for India Show and Malayalam winners            </h3>            <p>              <strong>Setup:</strong>              Create a messaging campaign using the Claude | IN | English | India Show 2025 and Claude | IN | Malayalam | 04 Indian Urgent creatives. Optimize toward conversations or qualified replies.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, depth-3 and depth-5 message sends, and leads generated from conversations.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Landing page viewer retargeting            </h3>            <p>              <strong>Setup:</strong>              Build audiences from landing page viewers of IN_AWR_General_Image_Claude_2026-06-14, Claude | IN | Daily 8 IMAGES MultiLang | 15Jun, and IN | Image | Aquaverse Traffic | Test 1000INR. Retarget with ticket offer, lead form, or message CTA.            </p>            <p>              <strong>Success metric:</strong>              Leads and purchases after at least 3 results per conversion type.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Regional language expansion from winners            </h3>            <p>              <strong>Setup:</strong>              Create new variants based on Malayalam and India Show structures. Prioritize Malayalam, English, Tamil, and Kannada because Tamil and Kannada each reached the 3-lead minimum, while Marathi had only 2 leads and should not be judged yet.            </p>            <p>              <strong>Success metric:</strong>              Leads, messaging depth, and landing page view to lead rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Corporate rebuild test            </h3>            <p>              <strong>Setup:</strong>              Rebuild Corporates as a dedicated lead or message campaign with a corporate/group-booking offer instead of broad traffic/video delivery.            </p>            <p>              <strong>Success metric:</strong>              At least 3 qualified leads or meaningful messaging conversations before deciding scale.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>{&amp;quot;issue&amp;quot;:&amp;quot;Actions recorded on days with zero delivery&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;2026-07-17 to 2026-07-22 show 0 impressions, 0 reach, 0 clicks, 0 spend, but still show leads, messaging actions, and landing page views.&amp;quot;,&amp;quot;recommendation&amp;quot;:&amp;quot;Check attribution windows, delayed reporting, conversion upload timing, and whether events are being attributed after campaigns stopped.&amp;quot;}</li><li>{&amp;quot;issue&amp;quot;:&amp;quot;Landing page view tracking appears inconsistent versus link clicks&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;Claude | IN | English | Water Park &amp;amp; Interview | Traffic | 2026-06-13 had 22,542 link clicks but only 76 landing page views. Claude | IN | English | India Show 2025 | Traffic | 2026-06-13 had 27,932 link clicks but only 250 landing page views. Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13 had 35,762 link clicks but only 24 landing page views.&amp;quot;,&amp;quot;recommendation&amp;quot;:&amp;quot;Audit pixel placement, page load speed, landing page redirects, consent settings, and whether landing page view events are firing reliably.&amp;quot;}</li><li>{&amp;quot;issue&amp;quot;:&amp;quot;Purchase data is insufficient for confident optimization&amp;quot;,&am
