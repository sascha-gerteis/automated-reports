top: 4px solid #f59e0b;  }  .priority-low {    border-top: 4px solid #16a34a;  }  .finding-grid {    display: grid;    grid-template-columns: repeat(2, minmax(0, 1fr));    gap: 14px;  }  .finding {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .finding.positive {    border-left: 5px solid #16a34a;  }  .finding.negative {    border-left: 5px solid #dc2626;  }  .finding h3 {    margin: 0 0 8px;    font-size: 16px;  }  .finding p {    margin: 0 0 10px;    color: #526077;  }  .evidence,  .recommendation {    font-size: 13px;    margin-top: 7px;    color: #445168;  }  .budget-row {    display: grid;    grid-template-columns: 1fr 40px 1fr;    gap: 12px;    align-items: center;    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-10        →        2026-08-08      </span>      <span class=&quot;pill&quot;>        84 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 769,984.42</strong>        <small>          2026-07-10          to          2026-08-08        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>50,947,753</strong>        <small>          104,644,318 impressions          ·          2.05 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>2,245,248</strong>        <small>          2.67% CTR          ·          THB 0.28 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>174</strong>        <small>          THB 4,425.20 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>1</strong>        <small>          THB 769,984.42 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1,287</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.36</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated very large reach and traffic volume: THB 769,984.42 spend, 104,644,318 impressions, 50,947,753 reach, 2,245,248 link clicks, and 965,166 landing page views. However, lower-funnel output is weak relative to spend, with only 58 leads and 1 purchase recorded. Purchase data is below the minimum_results_before_decision of 3, so purchase performance cannot be judged yet. Lead and messaging performance is concentrated in a small number of campaigns, while many high-spend awareness/follow/traffic campaigns are producing clicks, engagement, or page likes without measurable lead or purchase volume.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              Most leads came from a small group of campaigns with clear lead volume, while several large-spend campaigns produced no leads.            </p>            <p>              <strong>Do this:</strong>              Carefully scale Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13, and Claude | IN | English | India Show 2025 | Traffic | 2026-06-13 by 15-25% budget increases while monitoring CPL, conversation quality, and blocks.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild high-spend traffic campaigns with no leads            </h3>            <p>              <strong>Why:</strong>              Claude | IN | Corporates | 6 Languages | 2026-06-19 spent THB 133,820.21 and Claude | IN | Corporates | 5 Languages | 2026-06-19 spent THB 63,805.40 with 0 leads and 0 purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce these campaigns substantially or rebuild them with a lead/purchase objective, clearer corporate inquiry offer, and dedicated landing page or instant form before restoring scale.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness/follower spend from lead and ticket-sales spend            </h3>            <p>              <strong>Why:</strong>              Follower and engagement campaigns are generating page likes, reactions, and video views, but they are not driving meaningful link clicks, leads, or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep a capped awareness/follower budget only if follower growth is a secondary goal. Move excess spend from duplicated Aquaverse India Daily Follows Likes campaigns into lead, messaging, and retargeting tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix tracking inconsistencies before judging purchase performance            </h3>            <p>              <strong>Why:</strong>              Daily data shows leads and messaging actions on 2026-07-17 to 2026-07-22 despite 0 spend, 0 impressions, and 0 clicks. Some campaigns also show very high link clicks with extremely low landing page views.            </p>            <p>              <strong>Do this:</strong>              Audit pixel/CAPI setup, landing page view event firing, attribution settings, and campaign/action reporting before making purchase-scale decisions.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Do not optimize account-wide against purchases yet            </h3>            <p>              <strong>Why:</strong>              Only 1 purchase was recorded across the full period, below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Use leads, qualified messaging conversations, and landing page views as interim optimization signals until at least 3 purchase events are recorded per decision segment.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best visible lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 879.16 spend, 9 leads, estimated CPL THB 97.68, 176 messaging conversations started, 140 messaging conversation replies, 1,284 link clicks, CTR 5.37%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Duplicate the creative into structured lead and messaging campaigns, but monitor the 58 messaging blocks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging volume from traffic spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,228.98 spend, 17 leads, estimated CPL THB 131.12, 408 messaging conversations started, 396 first replies, 16,699 link clicks, CTR 2.63%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Test more Malayalam creative variations and a lead-optimized version using the same angle.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong qualified action volume compared with spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,262.12 spend, 14 leads, estimated CPL THB 161.58, 279 messaging conversations started, 251 messaging conversation replies, 16,320 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale cautiously. Use this as a core English-language messaging/lead creative, but watch the high 135 messaging blocks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Efficient awareness and traffic campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 9,958.57 spend, 4,685,749 impressions, 345,157 link clicks, 178,847 landing page views, CTR 7.50%, reported CPC THB 0.028.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for top-of-funnel traffic and retargeting pool growth, but do not scale it as a lead campaign unless downstream leads improve.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Very efficient traffic and landing page view generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,369.58 spend, 190,979 link clicks, 99,058 landing page views, CTR 7.78%, reported CPC THB 0.028.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic source for retargeting. Add retargeting exclusions and test lead objective versions.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Works for follower/page-like growth, not for lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 26,548.13 spend, 21,781 page likes, 503,268 page engagements, 481,487 post engagements, but only 204 link clicks and no leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth is a defined secondary KPI. Otherwise reduce and reallocate to lead/messaging campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Works for engagement volume, with limited lead value.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 10,545.81 spend, 1,418,703 post engagements, 1,328,374 video views, and 3 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as engagement/retargeting support. Do not scale for lead generation unless rebuilt with a lead or messaging objective.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Large budget is not translating into leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 133,820.21 spend, 410,739 link clicks, 157,286 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause for rebuild. Relaunch with a corporate-specific lead form, clearer offer, and conversion objective before scaling again.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with no measurable lower-funnel result.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 63,805.40 spend, 199,614 link clicks, 81,953 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Test a dedicated B2B/corporate inquiry funnel rather than continuing broad traffic spend.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Traffic volume exists, but no lead or purchase output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 34,686.24 spend, 93,382 link clicks, 48,149 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and retest with lead objective or new family-specific offer before further scaling.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              High traffic volume without measurable lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 32,902.14 spend, 115,117 link clicks, 52,633 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and use remaining traffic only for retargeting unless a lead-focused version proves results.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19            </h3>            <p>              Strong CTR and clicks, but no leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 32,613.88 spend, CTR 6.60%, 156,640 link clicks, 75,955 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not judge it as a purchase campaign yet, but reduce direct prospecting budget and test a lead/purchase objective version.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient reach but not useful for traffic, leads, or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,453.98 spend, 24,661,628 impressions, CPM THB 0.667, but only 2 link clicks, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only if the goal is ultra-low-cost visibility. Otherwise reduce and shift budget to lead or retargeting campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Follower/engagement spend is not producing site traffic or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 17,352.05 spend, 2,173 likes, 2 link clicks, 0 leads, 0 purchases, CPM THB 53.12.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce if the business goal is ticket sales and qualified leads. Rebuild as lead, messaging, or retargeting campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | English | Water Park &amp;amp; Interview | Traffic | 2026-06-13            </h3>            <p>              Lead volume is below decision threshold and landing page view tracking looks abnormal.            </p>            <div class=&quot;evidence&quot;>
