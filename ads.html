ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-17        →        2026-09-15      </span>      <span class=&quot;pill&quot;>        16 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 40,249.98</strong>        <small>          2026-08-17          to          2026-09-15        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>2,876,781</strong>        <small>          4,824,481 impressions          ·          1.68 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>115</strong>        <small>          1.39% CTR          ·          THB 0.60 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 8.34</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement delivery are strong, with 4,824,481 impressions, 2,876,781 reach, 664,747 page engagements, 592,166 video views, and THB 40,249.98 spend. However, the business goal is ticket sales and qualified leads, and the data shows no lead or purchase actions. Traffic quality is also weak: the account generated 67,152 total clicks but only 115 inline link clicks. Current spend is heavily concentrated in follower/page engagement activity rather than measurable sales or lead generation.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Build proper lead and purchase campaigns            </h3>            <p>              <strong>Why:</strong>              There are no reported leads or purchases, so the current setup cannot prove contribution to profitable ticket sales or qualified leads.            </p>            <p>              <strong>Do this:</strong>              Launch dedicated lead, messaging, or purchase campaigns optimized to the correct lower-funnel event instead of relying mainly on follower and engagement campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce fragmented Broad Destination follower campaigns            </h3>            <p>              <strong>Why:</strong>              The duplicated ERROR QUARANTINED Broad Destination campaigns spent meaningful budget but produced no meaningful link traffic and higher engagement costs than the main efficient campaigns.            </p>            <p>              <strong>Do this:</strong>              Consolidate the duplicated Broad Destination campaigns into one clean campaign or rebuild them with distinct audiences, creatives, and naming.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN but do not aggressively scale            </h3>            <p>              <strong>Why:</strong>              This campaign is the main engagement and follower driver, but it already has frequency of 4.47 and consumed THB 25,257.76, about 63% of account spend.            </p>            <p>              <strong>Do this:</strong>              Keep running for follower and engagement objectives, refresh creatives, monitor frequency, and shift some budget toward lower-funnel tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate tracking and attribution gaps            </h3>            <p>              <strong>Why:</strong>              The account reports 67,152 clicks but only 115 inline link clicks, no leads, no purchases, and one campaign shows messaging actions despite zero spend and zero impressions.            </p>            <p>              <strong>Do this:</strong>              Audit pixel/CAPI, lead event setup, purchase event setup, URL tracking, campaign objectives, and action attribution before judging sales performance.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best campaign for follower, engagement, and interaction volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 25,257.76 spend generated 22,660 page likes, 411,423 post engagements, 434,083 page engagements, 369,404 video views, 3,193 comments, and 1,000 saves. CTR was 3.80% and CPC was THB 0.46.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active for follower and engagement objectives, but refresh creatives and avoid large budget increases because frequency is already 4.47.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Strong low-cost awareness and video distribution.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,169.50 spend delivered 3,103,718 impressions, 2,506,315 reach, CPM of THB 0.70, frequency of 1.24, 166,561 post engagements, and 164,421 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is awareness or low-cost reach. Do not judge it by purchases because no purchase data is reported.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              This campaign generated follower actions and very high CTR, but with expensive delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,383.00 spend produced 691 page likes, 737 clicks, and CTR of 13.50%, but CPM was THB 253.39 and page engagements cost about THB 0.60 each.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only at a reduced test budget if Thailand follower growth is important; otherwise rebuild for cheaper reach.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              High spend with weak traffic and relatively expensive follower results.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,304.20 spend generated 3,163 clicks but 0 inline link clicks. It produced 762 page likes, about THB 5.65 per page like, and 18,530 post engagements, about THB 0.23 per post engagement.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. If the goal is leads or ticket sales, move this budget into a lower-funnel lead, messaging, or purchase test.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Duplicated campaigns are fragmenting spend and not producing meaningful site traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Three campaigns with this same name spent THB 4,940.31 combined, generated 4,601 total clicks, but only 1 inline link click and 1 messaging connection. Combined page likes were 762, about THB 6.48 per page like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate into one clean campaign or rebuild with separate audiences and creatives. Do not continue running multiple duplicated versions without a clear test structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient delivery to make a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Four campaigns with this same name spent only THB 24.51 combined and each had fewer than 60 impressions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on this tiny sample. Either allocate enough budget for a valid test or consolidate them into a cleaner structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              No delivery, but actions are reported.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              0 impressions, 0 reach, 0 clicks, and THB 0 spend, but 2 messaging welcome message views are reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Check attribution, campaign status, and action reporting. Do not evaluate performance until it has actual delivery.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide lead and purchase performance            </h3>            <p>              No measurable lead or purchase performance is available.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The supplied actions contain no lead events, no purchase events, no ROAS, and only 1 messaging conversation started across THB 40,249.98 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Set up and launch campaigns optimized for leads, messaging conversations, or purchases before making profitability decisions.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicated ERROR QUARANTINED | Aquaverse India Daily Follows Likes Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead, messaging, or purchase test campaigns              </strong>            </div>            <p>              These duplicated Broad Destination campaigns spent about THB 11,442.62 combined but produced almost no inline link traffic and no reported leads or purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN or a new lower-funnel test              </strong>            </div>            <p>              The 2026-08-23 campaign spent THB 4,304.20 with 0 inline link clicks, while AQ_MU2025_Followers_IN is stronger for follower volume and engagement efficiency.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Rebuilt Thailand campaign or lower-funnel test              </strong>            </div>            <p>              Thailand Daily has high CPM of THB 253.39 and higher page engagement cost than the main India campaigns, despite strong CTR.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Additional scale budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <p>              This campaign is efficient for awareness only, with THB 0.70 CPM, 2,506,315 reach, and 164,421 video views from THB 2,169.50 spend.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead generation campaign test            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated lead campaign using Meta instant forms or website lead events. Use clear ticket enquiry or group booking lead copy and separate audiences from follower campaigns.            </p>            <p>              <strong>Success metric:</strong>              Qualified leads generated. Wait for at least 3 lead results before making a scale, reduce, or pause decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Purchase or ticket landing page traffic test            </h3>            <p>              <strong>Setup:</strong>              Create a campaign optimized for purchase or landing page views if purchase tracking is active. Use ticket-focused creatives and URLs with UTMs.            </p>            <p>              <strong>Success metric:</strong>              Purchases, cost per purchase, and link click quality. Do not judge against CPA or ROAS targets because target values are unknown.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Run a click-to-message campaign with preset questions for date, ticket quantity, and visitor type. Separate it from engagement campaigns.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started and qualified replies. Current account has only 1 conversation started, below the minimum 3-result decision threshold.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Creative refresh for AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong>              Add new creatives to the existing follower campaign and compare against current winners without changing the objective.            </p>            <p>              <strong>Success metric:</strong>              Page likes, post engagements, saves, comments, CPC, and frequency. Watch whether frequency decreases from the current 4.47.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Clean consolidated Broad Destination test            </h3>            <p>              <strong>Setup:</strong>              Replace the duplicated Broad Destination campaigns with one structured campaign using clear ad set labels and non-overlapping audiences.            </p>            <p>              <strong>Success metric:</strong>              Cost per page like, cost per post engagement, inline link clicks, and any lead or messaging results after at least 3 results.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No lead or purchase actions are reported, so sales and lead profitability cannot be evaluated.</li><li>The account shows 67,152 total clicks but only 115 inline link clicks, indicating most clicks are engagement clicks rather than website traffic.</li><li>New post engagement campaign has 0 impressions, 0 clicks, and THB 0 spend but reports 2 messaging welcome message views.</li><li>Multiple campaigns have identical names, especially ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination and ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination, making clean analysis difficult.</li><li>Campaign names contain ERROR QUARANTINED, which should be reviewed for setup, delivery, or naming process issues.</li><li>Messaging data is too limited: only 1 messaging conversation started and 1 first reply are reported, below the minimum 3-result decision threshold.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep AQ_MU2025_Followers_IN for follower and engagement volume, keep ERROR QUARANTINED | Aquaverse India Dai
