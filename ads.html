0 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 122,675.50</strong>        <small>          2026-10-23          to          2026-11-21        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>2,830,671</strong>        <small>          5,668,574 impressions          ·          2.00 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Impressions</span>        <strong>5,668,574</strong>        <small>Total ad displays in this reporting period</small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>311,078</strong>        <small>          5.49% Link CTR          ·          THB 0.39 Link CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 21.64</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>    <section class=&quot;section&quot; aria-label=&quot;Data quality check&quot;>    <div class=&quot;dq-panel dq-pass&quot;>      <div class=&quot;dq-heading&quot;>        <span class=&quot;dq-label&quot;>DATA QUALITY CHECK</span>        <span class=&quot;dq-status&quot;>Checks passed</span>      </div>      <p class=&quot;dq-overview&quot;>No anomalies detected by the selected checks. This does not verify Meta attribution accuracy.</p>      <details class=&quot;dq-details&quot;>        <summary>Review checks (12 passed, 0 warnings, 0 critical) · 10 campaigns · 30 daily rows</summary>        <ul class=&quot;dq-checks&quot;><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Report date range</strong><small>2026-10-23 to 2026-11-21 (30 calendar days).</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Account summary response</strong><small>Account spend and impressions are present and numeric.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Campaign response</strong><small>10 campaign rows received.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Campaign pagination</strong><small>No additional campaign page is indicated in this response.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Daily trend response</strong><small>30 daily rows received. Days without delivery may not have a row.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Daily pagination</strong><small>No additional daily page is indicated.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Duplicate campaign identifiers</strong><small>No duplicate non-empty campaign IDs in returned campaign rows.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Metric value integrity</strong><small>No invalid/negative core metrics or obvious reach/click inconsistencies found.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Daily date integrity<
