    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-10-01        →        2026-10-30      </span>      <span class=&quot;pill&quot;>        6 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 18,305.59</strong>        <small>          2026-10-01          to          2026-10-30        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,254,511</strong>        <small>          2,420,175 impressions          ·          1.93 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>15,103</strong>        <small>          2.18% CTR          ·          THB 0.35 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>8</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.56</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated strong reach, engagement, video views, link clicks, and 5,000 landing page views from 18,305.59 THB spend, but there are no reported purchases, ROAS, or lead events despite the business goal being ticket sales and qualified leads. Traffic quality improved sharply from 2026-10-25 to 2026-10-30, mainly supported by the campaign India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy, while several follower/likes campaigns are consuming budget without meaningful landing page or sales data.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Scale the strongest traffic campaign carefully            </h3>            <p>              <strong>Why:</strong>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy produced 4,100 landing page views from 899.09 THB spend, with 6,648 link clicks, 10.66% CTR, and 0.22 THB cost per landing page view.            </p>            <p>              <strong>Do this:</strong>              Increase budget on India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy gradually while monitoring landing page view quality and downstream ticket or lead tracking.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Stop judging follower campaigns by sales until tracking exists            </h3>            <p>              <strong>Why:</strong>              Follower/engagement campaigns are generating page engagement, likes, and video views, but no purchase or lead events are reported anywhere in the account.            </p>            <p>              <strong>Do this:</strong>              Separate reporting by objective: awareness/engagement campaigns should be judged on page engagement, likes, video views, and reach; traffic campaigns on landing page views; lead and purchase campaigns require proper conversion tracking before decisions.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce inefficient follower/likes campaigns            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination and its Copy have very high CPMs of 88.00 THB and 86.79 THB and almost no link traffic, with 0 and 1 inline link clicks respectively.            </p>            <p>              <strong>Do this:</strong>              Move budget away from both Broad Destination follower/likes campaigns into the stronger traffic campaign and the more efficient engagement campaign AQ Operator CBO | IN | Instagram Followers.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix conversion tracking for ticket sales and qualified leads            </h3>            <p>              <strong>Why:</strong>              The account reports 15,103 link clicks and 5,000 landing page views but no purchases, no leads, no cost per purchase, and no ROAS.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI setup, purchase event firing, lead event firing, landing page URL tagging, and event deduplication before scaling spend for ticket sales.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              Best traffic performer by a large margin.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              899.09 THB spend generated 6,648 link clicks, 4,100 landing page views, 10.66% CTR, 0.14 THB CPC, and approximately 0.22 THB per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use it as the current traffic control campaign, but validate that landing page views are real qualified visits because no purchase or lead events are reported.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Strong awareness and engagement efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              6,277.82 THB spend generated 186,550 post engagements, 178,388 video views, 862 landing page views, 1,268,118 impressions, and the lowest campaign CPM at 4.95 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for awareness/engagement. If budget is increased, do it cautiously and monitor whether landing page views or messaging quality improve, not just video views.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Efficient for follower/engagement outcomes, not traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,107.18 THB spend generated 59,858 page engagements, 5,588 likes, 9,102 post reactions, 813 comments, and 43,283 video views, but only 16 inline link clicks and 1 landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is follower growth or engagement. Do not use this campaign as a traffic, lead, or ticket-sales driver.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Large spend with weak landing page quality and limited engagement efficiency compared with other campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              5,503.24 THB spend generated 3,379 link clicks but only 37 landing page views, a very low landing page view to link click ratio. It also produced 425 messaging blocks and only 3 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild the campaign if traffic or qualified messaging is the goal. Test new audiences and creatives instead of continuing to scale this version.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              High media cost and no link traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              432.72 THB spend, 88.00 THB CPM, 1.04 THB CPC, 415 clicks, 0 inline link clicks, and 0 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause if the goal is anything beyond page likes. Rebuild with lower-cost placements/audiences if follower growth remains required.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy            </h3>            <p>              Inefficient follower/likes copy with poor traffic output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,085.54 THB spend, 86.79 THB CPM, 0.96 THB CPC, 1 inline link click, 0 landing page views, and 1,012 likes.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause this copy and move budget to stronger campaigns. If kept, treat it only as a page-like campaign, not a sales or traffic campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide messaging performance            </h3>            <p>              Messaging outcomes are weak and include many blocks.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across the account there were only 8 messaging conversations started, 7 first replies, 11 total messaging connections, and 1,220 messaging blocks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale messaging until message intent, audience targeting, and welcome flow are reviewed. Exclude low-quality audiences if blocks continue.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide purchase and lead performance            </h3>            <p>              No purchase, lead, ROAS, cost per purchase, or cost per lead data is available.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Reported actions include link clicks, landing page views, engagement, video views, and messaging events, but no purchase or lead events.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make profitability decisions from this dataset. Fix tracking and launch dedicated lead or purchase campaigns before judging ticket-sales performance.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy              </strong>            </div>            <p>              The Instagram Followers campaign spent 5,503.24 THB for only 37 landing page views, while World&amp;#039;s Beauties generated 4,100 landing page views from 899.09 THB.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination and Broad Destination - Copy              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              The Broad Destination campaigns have very high CPMs above 86 THB and almost no link traffic, while AQ Operator CBO delivered 186,550 post engagements, 178,388 video views, and the lowest CPM at 4.95 THB.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                General follower/likes spend              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated traffic, lead, or purchase campaigns              </strong>            </div>            <p>              The business goal is ticket sales and qualified leads, but current spend is concentrated in follower/engagement campaigns with no reported purchase or lead outcomes.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Traffic scale test using World&amp;#039;s Beauties creative            </h3>            <p>              <strong>Setup:</strong>              Duplicate India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy into a controlled test with a modest budget increase and the same landing page destination.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, and verified downstream lead or purchase events once tracking is fixed.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Lead objective campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated lead campaign using instant forms or website lead events with ticket-interest qualifying questions.            </p>            <p>              <strong>Success metric:</strong>              Qualified leads generated after reaching at least 3 lead results, plus cost per qualified lead once targets are defined.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Purchase tracking validation campaign            </h3>            <p>              <strong>Setup:</strong>              Run a small conversion campaign optimized for purchase only after Pixel/CAPI purchase events are confirmed firing correctly.            </p>            <p>              <strong>Success metric:</strong>              Tracked purchases, cost per purchase, and ROAS after reaching at least 3 purchase results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging quality test            </h3>            <p>              <strong>Setup:</strong>              Test a revised messaging campaign with clearer intent in the ad copy, preset questions, and a faster qualification flow.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, total messaging connections, and reduced messaging blocks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Engagement creative refresh            </h3>            <p>              <strong>Setup:</strong>              Use the best-performing engagement learnings from AQ Operator CBO | IN | Instagram Followers and test new creative variants against the current winner.            </p>            <p>              <strong>Success metric:</strong>              Cost per page engagement, cost per video view, reach, frequency, and landing page views if traffic is included.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events are reported, so ticket-sales performance and ROAS cannot be evaluated.</li><li>No lead events are reported, so qualified lead performance cannot be evaluated.</li><li>There are 15,103 link clicks but only 5,000 landing page views account-wide, so landing page load quality or event setup should be reviewed.</li><li>India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy reports 6,648 link clicks and 6,586 clicks, which should be checked for reporting consistency.</li><li>Messaging blocks are very high at 1,220 compared with only 8 messaging conversations started, indicating possible audience, placement, or message-flow quality issues.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep AQ Operator CBO | IN | Instagram Followers for efficient awareness and engagement, keep AQ_MU2025_Followers_IN only for follower/engagement objectives, carefully scale Indi
