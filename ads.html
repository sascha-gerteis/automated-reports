grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-28        →        2026-09-26      </span>      <span class=&quot;pill&quot;>        14 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 24,619.83</strong>        <small>          2026-08-28          to          2026-09-26        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>346,633</strong>        <small>          1,379,252 impressions          ·          3.98 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>74</strong>        <small>          3.51% CTR          ·          THB 0.51 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>0</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 17.85</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account generated strong awareness and engagement volume but is not currently structured to prove profitable ticket sales or qualified leads. Spend was THB 24,619.83, producing 1,379,252 impressions, 346,633 reach, 365,204 page engagements, 20,001 page likes, and 311,087 video views. However, only 74 inline link clicks were recorded, with no lead, purchase, revenue, or ROAS data. AQ_MU2025_Followers_IN is clearly the main working awareness/follower campaign, while the duplicated ERROR QUARANTINED campaigns are less efficient and should not continue receiving meaningful budget.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from duplicated ERROR QUARANTINED campaigns            </h3>            <p>              <strong>Why:</strong>              The ERROR QUARANTINED campaigns spent THB 3,524.53, produced 0 inline link clicks, and were much less efficient than AQ_MU2025_Followers_IN for engagement and page likes.            </p>            <p>              <strong>Do this:</strong>              Reduce or pause the non-tiny ERROR QUARANTINED campaigns with meaningful spend, especially the 2026-08-23, 2026-08-25, and 2026-08-30 variants. Do not make performance decisions on the tiny 2026-08-28 variants with only 29-58 impressions and THB 4.26-7.06 spend.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN but do not scale it as a sales campaign            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN produced 19,372 page likes at THB 1.09 per like, 344,125 page engagements at THB 0.06 per engagement, and 291,516 video views at THB 0.07 per view, but only 74 inline link clicks and no lead or purchase data.            </p>            <p>              <strong>Do this:</strong>              Keep AQ_MU2025_Followers_IN as the awareness/follower engine. Maintain or cautiously scale only if the objective is followers, engagement, or retargeting pool growth. Do not treat it as the primary ticket-sales or lead-generation campaign.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Launch dedicated lead and ticket-sales campaigns            </h3>            <p>              <strong>Why:</strong>              The business goal is profitable ticket sales and qualified leads, but the supplied data contains no lead, purchase, ROAS, or revenue results.            </p>            <p>              <strong>Do this:</strong>              Create separate campaigns for leads and ticket sales instead of relying on followers/likes campaigns. Use budget released from ERROR QUARANTINED campaigns first.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix measurement before judging sales performance            </h3>            <p>              <strong>Why:</strong>              There are 48,402 total clicks but only 74 inline link clicks, and no lead or purchase actions are present. This makes sales and lead performance impossible to evaluate.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI, purchase event, lead event, landing page URL tracking, and UTM tagging. Confirm that ticket purchases and qualified leads are being passed back to Meta before scaling lower-funnel campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              This is the strongest awareness, engagement, and follower campaign in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 21,095.30; 1,289,415 impressions; 292,261 reach; 19,372 page likes at THB 1.09 per like; 344,125 page engagements at THB 0.06 per page engagement; 291,516 video views at THB 0.07 per video view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active for audience building. Use it to build retargeting pools, but avoid increasing budget aggressively until ticket-sale or lead campaigns are live and tracked.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              It captures almost all meaningful follower growth efficiently.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              It used 85.7% of account spend but generated 19,372 of 20,001 total page likes, equal to 96.9% of all page likes.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Prioritize this campaign over the duplicated ERROR QUARANTINED follower campaigns if the objective remains page growth.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Account-level engagement pool            </h3>            <p>              The account has built a sizeable retargeting audience for future lead and ticket-sale campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              365,204 page engagements, 311,087 video views, 20,001 page likes, 2,652 comments, and 867 saves were recorded during the period.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Create retargeting campaigns for recent engagers, video viewers, page followers, commenters, and savers with lead or ticket-sale calls to action.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              This campaign is inefficient versus AQ_MU2025_Followers_IN and produced no link traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 289.23; 6,115 impressions; 33 page likes at THB 8.76 per like; 1,427 page engagements at THB 0.20 each; 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or reduce to zero if it is still active, and move budget to AQ_MU2025_Followers_IN or new lead/ticket-sale tests.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              The duplicated 2026-08-25 variants are fragmented and less efficient than the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The three meaningful 2026-08-25 variants spent THB 1,037.19 combined, generated 156 page likes, and produced 0 inline link clicks. Cost per like ranged from THB 6.33 to THB 7.64, compared with THB 1.09 in AQ_MU2025_Followers_IN.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate or pause the meaningful-spend duplicates. Do not continue splitting budget across multiple identical ERROR QUARANTINED campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              The duplicated 2026-08-30 variants delivered engagement but at weaker efficiency than the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The five 2026-08-30 variants spent THB 2,173.60, generated 430 page likes, and produced 0 inline link clicks. Cost per like ranged from THB 4.01 to THB 6.07, materially higher than AQ_MU2025_Followers_IN at THB 1.09.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause these duplicates and reallocate the spend to a controlled lead or ticket-sales test.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              It is not proving ticket-sales or lead-generation performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Despite THB 21,095.30 spend and strong engagement volume, it produced only 74 inline link clicks and no reported leads, purchases, revenue, or ROAS.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep it for awareness/followers only. Build separate campaigns optimized for leads, messaging, traffic, or purchases depending on tracking readiness.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead-generation and ticket-sales test campaigns              </strong>            </div>            <p>              The ERROR QUARANTINED campaigns spent THB 3,524.53 with 0 inline link clicks and weaker page-like efficiency than AQ_MU2025_Followers_IN.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicated follower/likes campaign structure              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Consolidated AQ_MU2025_Followers_IN plus lower-funnel campaigns              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is the clear awareness winner, while duplicated campaigns fragment delivery and increase cost per like.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Any incremental budget planned for follower growth              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaigns using page engagers, video viewers, page likes, comments, and saves              </strong>            </div>            <p>              The account has 365,204 page engagements and 311,087 video views available for warmer-audience lead or ticket-sale follow-up.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Instant lead form test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated lead campaign using Meta instant forms. Test at least two forms: one short form for volume and one higher-intent form with qualifying questions.            </p>            <p>              <strong>Success metric:</strong>              Cost per qualified lead and number of qualified leads. Do not judge until at least 3 leads are recorded, per the supplied minimum_results_before_decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket-sales traffic or conversion test            </h3>            <p>              <strong>Setup:</strong>              Create a separate campaign driving users to the ticket page. If purchase tracking is verified, optimize for purchase. If not, start with landing page views or link clicks while tracking is fixed.            </p>            <p>              <strong>Success metric:</strong>              Purchases and cost per purchase if purchase tracking is active; otherwise inline link clicks and landing page activity as interim metrics.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engager retargeting test            </h3>            <p>              <strong>Setup:</strong>              Retarget page engagers, video viewers, page likes, commenters, and savers from the awareness activity. Use direct ticket-sale and lead-generation creative.            </p>            <p>              <strong>Success metric:</strong>              Leads, purchases, or qualified message conversations. Do not judge any ad set until it has at least 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging lead test            </h3>            <p>              <strong>Setup:</strong>              Run a click-to-message campaign for users asking about tickets, packages, timings, or group visits. Use FAQ-style creative and quick replies to qualify intent.            </p>            <p>              <strong>Success metric:</strong>              Qualified conversations and cost per qualified conversation.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative CTA split test            </h3>            <p>              <strong>Setup:</strong>              Test follower-style creative against direct-response creative that clearly asks users to buy tickets, enquire, or message now.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, leads, purchases, or qualified messages depending on the campaign objective.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution c
