  grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-29        →        2026-09-27      </span>      <span class=&quot;pill&quot;>        12 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 23,083.02</strong>        <small>          2026-08-29          to          2026-09-27        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>353,270</strong>        <small>          1,348,069 impressions          ·          3.82 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>180</strong>        <small>          3.46% CTR          ·          THB 0.49 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>0</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 17.12</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement delivery is strong: THB 23,083.02 generated 1,348,069 impressions, 353,270 reach, 346,500 page engagements, 293,572 video views, and 19,476 likes. However, the business goal is ticket sales and qualified leads, and the data shows no purchases, no leads, and only 1 landing page view from 180 link clicks. Current spend is heavily concentrated in follower/like campaigns, so sales and lead performance cannot be judged yet.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix conversion and landing page tracking before judging sales performance            </h3>            <p>              <strong>Why:</strong>              The account spent THB 23,083.02 but recorded 0 purchases, 0 leads, and only 1 landing page view from 180 link clicks. This prevents evaluation against ticket sales or qualified lead goals.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, purchase event, lead event, landing page view event, UTMs, and destination URLs. Confirm events fire correctly before shifting major budget to ticket-sale or lead campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or pause the underperforming ERROR QUARANTINED 2026-08-30 follower campaigns            </h3>            <p>              <strong>Why:</strong>              The five 2026-08-30 ERROR QUARANTINED campaigns spent THB 2,173.60 with CPMs of THB 35.51-39.38 and cost per like of approximately THB 4.01-6.07, materially weaker than AQ_MU2025_Followers_IN at THB 1.09 per like and THB 16.47 CPM.            </p>            <p>              <strong>Do this:</strong>              Pause or rebuild the 2026-08-30 ERROR QUARANTINED variants and reallocate spend into AQ_MU2025_Followers_IN, the 2026-09-27 Instagram Followers test, and new lead/purchase tests after tracking is fixed.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN but do not scale aggressively            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN is the strongest awareness/follower campaign, generating 18,927 likes, 332,883 page engagements, and 281,355 video views from THB 20,542.60. However, it already has frequency 4.33 and produced only 69 link clicks.            </p>            <p>              <strong>Do this:</strong>              Keep live for awareness and follower growth, refresh creatives, and scale only cautiously. Do not use this campaign as proof of ticket sales performance because it is not producing measurable purchase or lead data.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Use the 2026-09-27 Instagram Followers campaign as a traffic/tracking diagnostic            </h3>            <p>              <strong>Why:</strong>              Aquaverse India | Instagram Followers | 2026-09-27 generated 119 of the account&amp;#039;s 180 link clicks from only THB 177.89 spend, but recorded only 1 landing page view and 37 messaging_block actions.            </p>            <p>              <strong>Do this:</strong>              Check destination URL, mobile load speed, LPV tracking, and message settings. Keep spend limited until landing page views and downstream actions are confirmed.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best campaign for awareness, followers, and engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 20,542.60 and delivered 1,247,077 impressions, 288,124 reach, 332,883 page engagements, 313,956 post engagements, 18,927 likes, and 281,355 video views. Approximate cost per like was THB 1.09 and cost per page engagement was THB 0.06.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as the main awareness/follower campaign, but refresh creative and monitor frequency because frequency is 4.33.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Most efficient source of recorded link clicks.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 177.89 and generated 119 link clicks at approximately THB 1.49 per link click, with a very low CPM of THB 4.40.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Continue as a small controlled test only after checking why 119 link clicks produced just 1 landing page view.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Strong engagement rate from a small sample.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 170.63, generated 180 clicks, 110 likes, 525 page engagements, and CTR of 9.69%. Approximate cost per like was THB 1.55.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep testing at modest budget. Do not scale heavily yet because total spend and delivery volume are still small versus AQ_MU2025_Followers_IN.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Underperforming versus the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Five variants spent a combined THB 2,173.60. Individual CPMs were THB 35.51-39.38 and cost per like was approximately THB 4.01-6.07, while AQ_MU2025_Followers_IN had THB 16.47 CPM and approximately THB 1.09 cost per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce, pause, or rebuild these variants because they have enough like volume to make a decision and are less efficient for the follower/engagement objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong for awareness but weak for traffic and not measurable for sales or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Despite THB 20,542.60 spend, the campaign generated only 69 link clicks and no recorded purchases or leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep for awareness only. Build separate lead and purchase campaigns once tracking is verified.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality or tracking is questionable.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 119 link clicks but only 1 landing page view. It also recorded 37 onsite_conversion.messaging_block actions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit the landing page, URL, event setup, and message destination before increasing budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data for a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The tiny 2026-08-28 variants spent only THB 3.58-6.00 each, with 19-36 impressions and 1-4 likes where likes were recorded.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make a performance-based pause decision from this sample. Clean up naming and prevent accidental spend, but do not use this data to judge performance.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN and controlled new lead/purchase tests              </strong>            </div>            <p>              The five 2026-08-30 ERROR QUARANTINED variants spent THB 2,173.60 at weaker efficiency than AQ_MU2025_Followers_IN for likes, CPM, and page engagement.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN current heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Verified ticket purchase and lead campaigns after tracking is fixed              </strong>            </div>            <p>              AQ_MU2025_Followers_IN consumed THB 20,542.60 of THB 23,083.02 spend, but the business goal is ticket sales and qualified leads, and no purchase or lead actions are recorded.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Tiny ERROR QUARANTINED 2026-08-28 variants              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                No additional budget              </strong>            </div>            <p>              Each spent only THB 3.58-6.00, so the sample is too small for a performance decision, but they should not receive incremental budget while cleaner campaigns exist.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Unstructured follower/like campaign duplication              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Consolidated campaign structure by objective: awareness/followers, traffic, leads, purchase              </strong>            </div>            <p>              Duplicate ERROR QUARANTINED campaign names make analysis harder and current spend does not clearly separate business outcomes.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Ticket purchase conversion test            </h3>            <p>              <strong>Setup:</strong>              After Pixel/CAPI and purchase event validation, launch a dedicated purchase campaign with ticket-sale creative and destination URLs using UTMs. Separate it from follower campaigns.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 purchases are recorded. Judge by cost per purchase and ROAS once values are available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Qualified lead generation test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated lead campaign using either Meta instant forms or website lead forms. Use qualifying questions relevant to ticket interest or group enquiries.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 leads are recorded. Judge by cost per qualified lead and lead quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engagement retargeting to ticket CTA            </h3>            <p>              <strong>Setup:</strong>              Create a retargeting audience from page engagers, video viewers, likes, comments, and saves generated by AQ_MU2025_Followers_IN. Serve ticket or enquiry ads instead of follower ads.            </p>            <p>              <strong>Success metric:</strong>              Measure landing page views, leads, and purchases. Do not decide until at least 3 downstream results are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Instagram Followers traffic validation            </h3>            <p>              <strong>Setup:</strong>              Run Aquaverse India | Instagram Followers | 2026-09-27 at limited budget with corrected URL tracking and compare link clicks to landing page views.            </p>            <p>              <strong>Success metric:</strong>              Success requires landing page views to be recorded consistently from link clicks; current result is only 1 landing page view from 119 link clicks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative refresh for AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong
