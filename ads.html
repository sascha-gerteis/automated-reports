    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 478,622.13</strong>        <small>          2026-06-30          to          2026-07-29        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>10,873,493</strong>        <small>          33,777,243 impressions          ·          3.11 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>552,586</strong>        <small>          2.57% CTR          ·          THB 0.55 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>33</strong>        <small>          THB 14,503.70 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>7</strong>        <small>          THB 68,374.59 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 3,476.00        </strong>        <small>          0.01× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>219</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 14.17</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated very large reach and cheap top-funnel volume: 33,777,243 impressions, 552,586 link clicks, 84,485 landing page views, and THB 478,622.13 spend. However, bottom-funnel output is weak relative to spend: 11 leads, 7 purchases, THB 3,476 purchase value, cost per lead of THB 43,511.10, cost per purchase of THB 68,374.59, and reported ROAS of 0.007. Only one campaign has enough purchase volume to make a purchase-level decision: Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; with 4 purchases and 8 leads.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Scale the only campaign with sufficient purchase and lead data            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; is the only campaign above the minimum_results_before_decision threshold for purchases, with 4 purchases and 8 leads.            </p>            <p>              <strong>Do this:</strong>              Keep active and carefully increase budget by 20-30% at a time; duplicate the winning post into a controlled sales or lead test rather than making large budget jumps.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild high-spend campaigns with no leads or purchases            </h3>            <p>              <strong>Why:</strong>              Several campaigns spent meaningful budget without producing leads or purchases, especially corporate lead campaigns and follower campaigns.            </p>            <p>              <strong>Do this:</strong>              Reduce spend on Aquaverse Corporate Groups - Leads - Test, TH | B2B Corporate | Video | Leads | 2026-06-18, FB Follow | Thailand | Aquaverse Lifestyle, and FB Follow | Thailand | Lookalike Fans Scale; rebuild them with clearer objectives before adding budget back.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix traffic quality and tracking before scaling link-click campaigns            </h3>            <p>              <strong>Why:</strong>              The account generated 552,586 link clicks but only 84,485 landing page views, a 15.3% link-click-to-LPV rate. Several campaigns show extremely poor LPV follow-through.            </p>            <p>              <strong>Do this:</strong>              Audit landing page load speed, UTMs, pixel/CAPI events, destination URLs, and marketplace redirects; optimize traffic campaigns for landing page views instead of link clicks where possible.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate awareness, traffic, messaging, lead, and purchase budgets            </h3>            <p>              <strong>Why:</strong>              Many campaigns are being judged by the same end goal despite different objectives. Awareness campaigns are producing reach/video views, while traffic campaigns are producing clicks but not purchases.            </p>            <p>              <strong>Do this:</strong>              Create separate budget pools: awareness for reach/video views, traffic for LPVs, messaging for conversations, lead gen for qualified corporate leads, and purchase campaigns for ticket sales.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best purchase, lead, and messaging performer in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,332.65 spend, 4 purchases, THB 2,176 purchase value, 8 leads, 43 messaging conversations started, cost per purchase THB 583.16, cost per lead THB 291.58, cost per messaging conversation started THB 54.25.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and scale carefully. Build new sales, lead, and messaging tests around this post angle and creative.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Conversions Shopee | 12Jun            </h3>            <p>              Strong traffic quality for a Shopee-focused campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,899.78 spend, 5,248 link clicks, 3,000 landing page views, cost per LPV THB 1.30, CTR 8.22%, and 57.2% link-click-to-LPV rate.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic-quality winner and test incremental budget, but do not judge by purchases unless marketplace purchase tracking is confirmed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026            </h3>            <p>              Very efficient traffic generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,591.67 spend, 10,197 link clicks, 2,896 landing page views, CTR 13.30%, cost per LPV THB 0.89.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic creative winner. Rebuild into a purchase or landing-page-view optimized test to see if the traffic can convert.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Corporates | Thai | 2026-06-19            </h3>            <p>              Good landing-page-view efficiency for corporate traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,228.17 spend, 7,093 link clicks, 3,514 landing page views, CTR 8.05%, cost per LPV THB 1.49.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use this creative/audience as the basis for a corporate lead-form test because it gets users to the page efficiently.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Indian Market : Awareness            </h3>            <p>              Highly efficient awareness delivery eta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-06-30        →        2026-07-29      </span>      <span class=&quot;pill&quot;>        85 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,444,050.67</strong>        <small>          2026-06-30          to          2026-07-29        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>72,818,052</strong>        <small>          182,782,818 impressions          ·          2.51 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>5,109,146</strong>        <small>          3.30% CTR          ·          THB 0.24 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>294</strong>        <small>          THB 4,911.74 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 722,025.34 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2,538</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.90</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account delivery is very strong, with 182,782,818 impressions, 5,109,146 link clicks, THB 1,444,050.67 spend, CPC THB 0.24, and CTR 3.30%. However, business-result efficiency is mixed: only 98 leads and 2 purchases were recorded. The best lead and messaging results came from a small number of campaigns, while a large share of spend went to traffic, follower, and engagement campaigns that generated volume but little or no lead/purchase output.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Move budget toward proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              The strongest lead campaigns are producing materially more leads at much lower observed CPL than the account average of THB 14,735.21 per lead.            </p>            <p>              <strong>Do this:</strong>              Carefully scale Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13 by reallocating budget from high-spend campaigns with 0 leads.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce high-spend traffic campaigns that are not producing leads            </h3>            <p>              <strong>Why:</strong>              Several campaigns spent significant budget and generated large click/LPV volume but recorded 0 leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce budgets on Claude | IN | Corporates | 6 Languages | 2026-06-19, Claude | IN | Corporates | 5 Languages | 2026-06-19, Claude | IN | Families | 6 Languages | 2026-06-19, Claude | IN | Singles | 6 Languages | 2026-06-19, and Claude | IN | Couples | 6 Languages | 2026-06-19 unless their only role is awareness.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness/follower activity from lead and ticket sales activity            </h3>            <p>              <strong>Why:</strong>              Follower and engagement campaigns generated reach, reactions, likes, and video views, but most did not generate meaningful lead or purchase volume.            </p>            <p>              <strong>Do this:</strong>              Keep follower/page-like campaigns on a capped awareness budget only, and create separate lead/messaging campaigns using the best-performing creative assets.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate attribution and reporting anomalies            </h3>            <p>              <strong>Why:</strong>              Daily data shows actions on 2026-07-17 to 2026-07-22 despite 0 impressions, 0 clicks, and 0 spend, and some campaigns show link-click/LPV mismatches.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, attribution window reporting, lead event deduplication, and Meta API export logic before making purchase-level decisions.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Do not make purchase optimization decisions yet            </h3>            <p>              <strong>Why:</strong>              Only 2 purchases were recorded account-wide, below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Use leads, messaging conversations, and landing page views for near-term optimization while collecting more purchase data.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best observed lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,285.56 spend, 17 leads, observed CPL THB 134.44, 367 messaging conversations started, 358 first replies, 544 total messaging connections, and 1 purchase. Purchase volume is below the 3-result decision threshold.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale in small budget increments while monitoring lead quality and message depth.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong lead volume and deep messaging engagement from low spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,383.55 spend, 30 leads, observed CPL THB 146.12, 34,479 link clicks, 672 messaging conversations started, 563 replied conversations, and 40 depth-5 message sends.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully; use this creative/angle as a core lead-generation asset.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging performance from a language-specific campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,358.05 spend, 25 leads, observed CPL THB 174.32, 35,200 link clicks, 659 messaging conversations started, and 637 first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and test more Malayalam variants using the same offer/message structure.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13            </h3>            <p>              Met the minimum decision threshold for leads with efficient traffic volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,968.00 spend, 3 leads, observed CPL THB 989.33, 46,404 link clicks, CTR 2.38%, and CPC THB 0.06.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a secondary test; scale only after confirming lead quality and improving landing page view tracking.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Strong awareness/traffic efficiency, but not a lead driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 23,913.23 spend, 856,668 link clicks, 248,405 landing page views, CTR 7.36%, CPC THB 0.03, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is low-cost reach/traffic; do not treat it as a lead or sales campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient traffic generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 13,388.62 spend, 489,038 link clicks, 137,508 landing page views, CTR 7.69%, CPC THB 0.03, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use for top-of-funnel traffic or retargeting pool building, but pair with lead retargeting instead of scaling for direct sales.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Very high spend with no recorded leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 257,345.03 spend, 839,000 link clicks, 201,085 landing page views, 11,112,053 video views, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget significantly or rebuild with a lead/messaging objective and stronger qualification/offer.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Large traffic volume but no business-result output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 113,140.98 spend, 370,093 link clicks, 104,017 landing page views, 4,573,966 video views, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and retest corporates with a dedicated lead form or message flow instead of broad traffic delivery.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              High spend with no lead or purchase result.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 69,307.80 spend, 201,020 link clicks, 65,952 landing page views, 2,026,017 video views, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce; rebuild as a lead/messaging campaign if families are a priority audience.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              High traffic and video views but no conversion output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 66,330.73 spend, 243,777 link clicks, 72,040 landing page views, 2,554,868 video views, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and use the audience only for retargeting or creative testing until leads appear.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19            </h3>            <p>              High spend with no recorded leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 67,028.09 spend, 331,428 link clicks, 106,763 landing page views, 3,200,319 video views, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and test the couple angle through the winning lead/messaging structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient reach but not useful for sales or lead generation in this data.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,544.70 spend, 23,718,158 impressions, CPM THB 0.70, 0 inline link clicks, 0 leads, and 5 total messaging connections.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as a capped awareness layer; do not allocate sales/lead budget here.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Good follower/page engagement volume but no lead or purchase output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 33,121.25 spend, 24,578 likes, 638,642 page engagements, frequency 3.56, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only if follower growth is a separate goal; reduce if the budget is meant to drive ticket sales or qualified leads.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19 and Claude | IN | Corporates | 5 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>
