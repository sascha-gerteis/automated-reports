    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 505,636.08</strong>        <small>          2026-06-27          to          2026-07-26        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>11,107,611</strong>        <small>          36,462,157 impressions          ·          3.28 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>582,364</strong>        <small>          2.52% CTR          ·          THB 0.55 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>36</strong>        <small>          THB 14,045.45 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>8</strong>        <small>          THB 63,204.51 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 3,476.00        </strong>        <small>          0.01× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>253</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 13.87</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large reach and traffic volume, but the account is not yet translating spend into tracked sales or qualified leads. Total spend was 505,636.08 THB for 36,462,157 impressions, 582,364 link clicks, 99,039 landing page views, 12 leads, and 8 purchases with 3,476 THB purchase value. Purchase and lead volume is concentrated in a small number of boosted post-style campaigns, while several high-spend follower, corporate lead, and ticket sales campaigns produced no tracked leads or purchases. Because targets are unknown and many campaigns have fewer than 3 sales/leads, recommendations focus on reallocating budget toward campaigns with proven results or strong landing-page traffic, reducing high-spend low-output campaigns, and fixing tracking gaps.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reallocate budget away from high-spend follower campaigns            </h3>            <p>              <strong>Why:</strong>              FB Follow | Thailand | Aquaverse Lifestyle spent 60,537.91 THB for only 3 page likes, 1 landing page view, and 1 messaging conversation; FB Follow | Thailand | Lookalike Fans Scale spent 42,527.92 THB for only 13 page likes and 34 link clicks.            </p>            <p>              <strong>Do this:</strong>              Reduce or pause both FB Follow campaigns and move budget into campaigns generating purchases, leads, or low-cost landing page views.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the only campaign with enough purchase and lead data            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; produced 8 leads and 4 purchases from 2,665.82 THB spend, exceeding the minimum 3-result decision threshold.            </p>            <p>              <strong>Do this:</strong>              Keep active and increase budget gradually while monitoring lead quality, purchase count, and purchase value.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild corporate lead generation campaigns            </h3>            <p>              <strong>Why:</strong>              Aquaverse Corporate Groups - Leads - Test spent 13,058.99 THB with 0 leads; TH | B2B Corporate | Video | Leads | 2026-06-18 spent 20,101.57 THB with 0 leads and frequency 6.22.            </p>            <p>              <strong>Do this:</strong>              Stop scaling the current corporate lead setup; rebuild with a lead form or clearer conversion path, new creative, and separate retargeting of landing page visitors.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit purchase and marketplace tracking            </h3>            <p>              <strong>Why:</strong>              The account spent 505,636.08 THB but tracked only 8 purchases and 3,476 THB purchase value. Several traffic and marketplace campaigns generated thousands of clicks and landing page views but no purchases.            </p>            <p>              <strong>Do this:</strong>              Verify pixel/CAPI purchase events, marketplace attribution for Lazada/Shopee, purchase value passing, and whether onsite/app/web purchase events are being duplicated or misclassified.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate traffic winners from sales winners            </h3>            <p>              <strong>Why:</strong>              Campaigns such as Claude | TH | Traffic IMAGES | 18Jun and Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026 generated efficient landing page traffic but no tracked purchases.            </p>            <p>              <strong>Do this:</strong>              Keep best traffic campaigns for retargeting pools, but do not judge them as sales campaigns until purchase tracking and conversion optimization are validated.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best tracked purchase, lead, and messaging performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 2,665.82 THB; 8 leads; 4 purchases; 2,176 THB purchase value; 47 messaging conversations started; 48 messaging replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this post’s offer, format, copy angle, and audience as the base for new conversion and messaging tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Traffic IMAGES | 18Jun            </h3>            <p>              Strong traffic volume at efficient cost.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 24,899.84 THB; 126,769 link clicks; 11,400 landing page views; CTR 5.37%; CPC 0.176 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic/audience-building campaign and retarget its landing page visitors with purchase or message campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026            </h3>            <p>              Efficient landing page traffic for ticket interest.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 3,595.68 THB; 14,385 link clicks; 4,632 landing page views; CTR 13.25%; CPC 0.190 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for traffic testing, but rebuild a separate purchase-optimized version because this campaign did not track purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket lid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-06-27        →        2026-07-26      </span>      <span class=&quot;pill&quot;>        87 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,591,634.76</strong>        <small>          2026-06-27          to          2026-07-26        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>83,326,101</strong>        <small>          209,966,954 impressions          ·          2.52 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>5,790,091</strong>        <small>          3.23% CTR          ·          THB 0.23 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>327</strong>        <small>          THB 4,867.38 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 795,817.38 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2,969</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.58</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent 1,591,634.76 THB and generated very large reach and traffic: 209,966,954 impressions, 5,790,091 link clicks, 1,427,522 landing page views, 109 leads, 2 purchases, and 2,969 messaging conversations started. Account health is mixed: traffic and awareness volume is strong, but most spend is not tied to qualified leads or purchases. Purchase data is insufficient because only 2 purchases were recorded, below the minimum_results_before_decision of 3.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reallocate budget from broad traffic/video campaigns into proven lead and messaging winners            </h3>            <p>              <strong>Why:</strong>              Several high-spend traffic/video campaigns generated large click and landing page volume but no leads, while a few low-spend campaigns generated most leads and messaging activity.            </p>            <p>              <strong>Do this:</strong>              Reduce spend on high-spend zero-lead campaigns such as Claude | IN | Corporates | 6 Languages | 2026-06-19 and Claude | IN | Corporates | 5 Languages | 2026-06-19. Carefully scale Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix click-to-landing-page-view tracking and traffic quality issues            </h3>            <p>              <strong>Why:</strong>              Multiple campaigns show very high link clicks but extremely low landing page views, which makes optimization decisions unreliable.            </p>            <p>              <strong>Do this:</strong>              Audit pixel, landing page load speed, URL redirects, UTM consistency, and Meta event setup before scaling traffic campaigns. Prioritize campaigns with major gaps such as Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13, Claude | IN | Marathi | 06 Urgent IN | Traffic | 2026-06-13, and Claude | IN | English | Water Park &amp;amp; Interview | Traffic | 2026-06-13.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild the lead engine around the best creative and language segments            </h3>            <p>              <strong>Why:</strong>              Lead volume is concentrated in a few campaigns: Claude | IN | English | India Show 2025 generated 38 leads, Claude | IN | Malayalam generated 25 leads, and Post: &amp;quot;💦 Start your day...&amp;quot; generated 17 leads.            </p>            <p>              <strong>Do this:</strong>              Create a dedicated lead or messaging campaign using the winning creatives and languages. Separate English India Show, Malayalam, and the Post: &amp;quot;💦 Start your day...&amp;quot; creative into their own ad sets with controlled budgets.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Consolidate daily follows/likes campaigns            </h3>            <p>              <strong>Why:</strong>              There are many duplicated daily follows/likes campaigns with overlapping audiences and inconsistent efficiency.            </p>            <p>              <strong>Do this:</strong>              Keep the better follow/engagement performers such as AQ_MU2025_Followers_IN and the stronger Special Interest Mix/Families variants. Reduce or consolidate Broad Destination variants that show higher cost per like and very low link intent.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Do not make purchase optimization decisions yet            </h3>            <p>              <strong>Why:</strong>              Only 2 purchases were recorded account-wide, below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Track purchases, revenue, and ROAS for more volume before judging purchase profitability. Do not pause or scale campaigns based on purchase CPA yet.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best combined lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 2,488.72 THB, 17 leads, 381 messaging conversations started, 372 messaging first replies, and 1 purchase. Cost per lead was 146.40 THB and cost per conversation started was 6.53 THB. Purchase count is only 1, so purchase performance is not yet decision-ready.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Duplicate into a dedicated lead/messaging campaign and increase budget gradually while monitoring CPL and conversation quality.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strongest campaign for lead volume and messaging depth.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 4,846.61 THB, 38 leads, 827 messaging conversations started, 811 messaging first replies, 298 depth-2 sends, 178 depth-3 sends, and 42 depth-5 sends. Cost per lead was 127.54 THB and cost per conversation started was 5.86 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this as the primary creative/message angle for lead and messaging campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong language-market performer for leads and messaging.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 4,817.11 THB, 25 leads, 721 messaging conversations started, 697 first replies, 91 depth-3 sends, and 18 depth-5 sends. Cost per lead was 192.68 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Test additional Malayalam creative variations and a dedicated lead objective.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Efficient awareness/traffic generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 26,912.61 THB, 13,412,283 impressions, 972,145 link clicks, 254,485 landing page views, CTR 7.37%, and cost per landing page view of about 0.11 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for awareness or traffic, but do not scale for leads until downstream conversion tracking and lead intent are improved.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Very efficient traffic campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 15,808.19 THB, 579,967 link clicks, 142,609 landing page views, CTR 7.74%, and cost per landing page view of about 0.11 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic prospecting source. Retarget landing page viewers and test the same image style in lead/messaging campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower/page engagement campaign relative to other follows/likes campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 40,452.42 THB, 29,684 likes, 6,101 comments, 680,492 post engagements, and cost per like of about 1.36 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if follower/page growth remains a strategic objective. Monitor frequency, which is 3.64, and refresh creative before fatigue increases.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Very high spend with no recorded leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 291,438.73 THB, 965,134 link clicks, 209,692 landing page views, 12,558,469 video views, 0 leads, 0 purchases, and only 6 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce significantly or rebuild. If corporates are important, relaunch with a lead or messaging objective and corporate-specific offer instead of continuing broad traffic/video delivery.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with no lead outcome.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 120,698.30 THB, 403,661 link clicks, 106,621 landing page views, 0 leads, 0 purchases, and only 2 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild. Test a separate corporate lead form or WhatsApp/Messenger qualification flow before adding budget back.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Traffic volume is present but no qualified lead signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 74,554.18 THB, 220,039 link clicks, 67,564 landing page views, 0 leads, and only 3 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce. Retest Families using the proven Post: &amp;quot;💦 Start your day...&amp;quot; or India Show style creative with a lead/messaging objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              Large traffic spend without leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 72,504.42 THB, 270,269 link clicks, 74,514 landing page views, 0 leads, and only 3 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce. Rebuild with stronger conversion intent or use this audience only for retargeting if landing page viewer quality is verified.
