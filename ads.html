cy units, 2% of account spend).</small></span>  </li><li class=&quot;dq-check dq-check-info&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>i</span>    <span><strong>Conversion metric coverage</strong><small>Of 6 campaigns with spend: lead actions available for 0, purchase actions for 0, and purchase value for 0. Missing conversion actions are not proof of zero sales.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>AI analysis structure</strong><small>AI recommendations were parsed, but must still be verified against Meta data.</small></span>  </li></ul>      </details>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse&amp;#039;s account spent 41,353.34 THB generating 19,466 landing page views and 804,972 video views across 8,914,983 impressions. Account strategy is heavily skewed toward top-of-funnel follower and engagement campaigns with zero lower-funnel conversion tracking (purchases or leads). A single campaign, &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039;, generated 98% of all site traffic (19,083 LPVs at 0.12 THB CPC), whereas &amp;#039;AQ_MU2025_Followers_IN&amp;#039; suffered from heavy frequency saturation (4.19 frequency, 18.58 THB CPM). Additionally, campaign &amp;#039;party&amp;#039; yielded 37,062 inline link clicks with 0 landing page views, indicating a tracking or destination issue.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Implement Conversion Event Tracking            </h3>            <p>              <strong>Why:</strong>              The account currently tracks no standard conversion events (Purchase, AddToCart, Lead) despite business goals focused on ticket sales and qualified leads.            </p>            <p>              <strong>Do this:</strong>              Set up Meta Pixel and Conversion API standard events for Purchases and Leads on ticket booking checkout confirmation pages.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit Destination &amp;amp; Pixel for &amp;#039;party&amp;#039; Campaign            </h3>            <p>              <strong>Why:</strong>              The &amp;#039;party&amp;#039; campaign produced 37,062 inline link clicks but recorded 0 landing page views, signaling broken pixel triggers or URL redirects.            </p>            <p>              <strong>Do this:</strong>              Verify landing page URL, site loading performance, and Meta Pixel installation on the campaign destination URL.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reallocate Budget to High-Performing Traffic Campaign            </h3>            <p>              <strong>Why:</strong>              &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; delivers landing page views at an ultra-low cost (~0.20 THB/LPV), but receives only 9% of total spend.            </p>            <p>              <strong>Do this:</strong>              Shift daily spend away from follower/engagement campaigns into the Miss Universe traffic campaign.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Reduce Ad Saturation on &amp;#039;AQ_MU2025_Followers_IN&amp;#039;            </h3>            <p>              <strong>Why:</strong>              Campaign frequency reached 4.19 with a high CPM of 18.58 THB and generated only 64 inline link clicks across 17,116.87 THB spend.            </p>            <p>              <strong>Do this:</strong>              Cap campaign budget, refresh creative assets, or expand targeting to lower frequency.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              Highly efficient website traffic generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 19,083 landing page views (98% of total account LPVs) from 28,983 inline link clicks, with a 9.85% CTR, 0.12 THB CPC, and 11.99 THB CPM on a 3,736.14 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Maintain active delivery and carefully scale budget while monitoring landing page engagement.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              High budget consumption with severe audience fatigue and low traffic yield.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 17,116.87 THB (41.4% of account spend) with a 4.19 frequency and 18.58 THB CPM, delivering only 64 inline link clicks and 4 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget, refresh creatives, and shift objective from follower retention to traffic/conversions.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy            </h3>            <p>              Excessively high CPM and minimal traffic output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CPM reached 81.99 THB on 1,052.17 THB spend, yielding only 1 inline link click and 0 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause campaign and reallocate funds to conversion or traffic objectives.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              party            </h3>            <p>              Severe conversion loss between link clicks and landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 37,062 inline link clicks on 6,195.30 THB spend (CPM 1.40 THB), but recorded 0 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause spending until landing page tracking and URL redirect issues are resolved.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              High incidence of user messaging blocks relative to connections.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Recorded 1,168 messaging blocks against only 9 messaging connections on 10,277.04 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Review messaging prompt creative and audience targeting to prevent negative user actions.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy              </strong>            </div>            <p>              Shift funds from an over-saturated campaign ( aterpark interest audiences using top-performing Miss Universe creative assets.            </p>            <p>              <strong>Success metric:</strong>              Cost per Purchase and ROAS tracking once Meta Pixel events are active.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Meta Instant Lead Forms vs Website Form Test            </h3>            <p>              <strong>Setup:</strong>              Run an A/B test comparing On-Facebook Instant Lead Forms against landing page lead capture forms for group ticket inquiries.            </p>            <p>              <strong>Success metric:</strong>              Cost per Qualified Lead and Form Completion Rate.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>Zero lower-funnel conversion tracking: No Purchase, AddToCart, or Lead events are tracked in Meta Ads Manager.</li><li>Click-to-landing-page drop-off in &amp;#039;party&amp;#039;: 37,062 inline link clicks resulted in 0 recorded landing page views.</li><li>Abnormally high messaging blocks: 1,496 account-wide messaging blocks vs 23 total messaging connections suggest improper ad placement or misleading engagement hooks.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Immediately establish Meta Pixel standard event tracking for Purchases and Leads, and fix the destination tracking issue on campaign &amp;#039;party&amp;#039;. Reallocate daily budget from saturated, high-CPM engagement campaigns (&
