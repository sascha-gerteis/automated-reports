      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-23        →        2026-09-21      </span>      <span class=&quot;pill&quot;>        14 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 35,829.48</strong>        <small>          2026-08-23          to          2026-09-21        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>447,979</strong>        <small>          1,776,475 impressions          ·          3.97 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>91</strong>        <small>          3.49% CTR          ·          THB 0.58 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 20.17</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement are strong, led by AQ_MU2025_Followers_IN, which produced most reach, video views, page engagement, and follows at the lowest in-account cost. However, the account is not currently proving progress toward profitable ticket sales or qualified leads: no lead or purchase actions are reported, messaging produced only 1 conversation, and only 91 inline link clicks were recorded from THB 35,829.48 spend. A large share of spend is going to duplicated ERROR QUARANTINED follower/like campaigns that are materially less efficient than the main follower campaign.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild or reduce duplicated ERROR QUARANTINED campaigns            </h3>            <p>              <strong>Why:</strong>              ERROR QUARANTINED campaigns spent approximately THB 11,442.62, about 31.9% of total spend, but produced only 1 inline link click and 1 messaging conversation. Their cost per like is much worse than AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Do this:</strong>              Move budget away from the ERROR QUARANTINED campaigns with meaningful spend, especially the 2026-08-23, 2026-08-25, and 2026-08-30 variants, and rebuild them into a clean campaign structure with clear objectives and non-duplicated ad sets.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Do not judge the account by purchases until purchase tracking exists            </h3>            <p>              <strong>Why:</strong>              No purchase actions, purchase value, ROAS, or lead actions are reported in the supplied data, despite the business goal being ticket sales and qualified leads.            </p>            <p>              <strong>Do this:</strong>              Confirm Meta Pixel/CAPI and lead or purchase events before scaling conversion spend. Launch dedicated lead or purchase campaigns only after tracking is verified.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN for awareness and follower growth, but do not treat it as a sales campaign            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN generated 410,587 page engagements, 22,019 likes, and 350,459 video views from THB 24,386.86 spend, but only 90 inline link clicks and no reported leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign active for follower, engagement, and awareness goals. Scale carefully only if those are priority outcomes; otherwise cap its budget and redirect incremental spend to lead or purchase tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix the traffic quality gap            </h3>            <p>              <strong>Why:</strong>              The account shows 62,016 total clicks but only 91 inline link clicks, meaning most clicks are likely engagement clicks rather than website traffic.            </p>            <p>              <strong>Do this:</strong>              For traffic or ticket-sales activity, optimize to landing page views, leads, or purchases instead of engagement/follows, and use UTMs to verify sessions from Meta.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Treat messaging performance as insufficient data            </h3>            <p>              <strong>Why:</strong>              Only 1 messaging conversation was reported, below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Do not pause or scale based on messaging results yet. Run a dedicated messaging or lead test until at least 3 qualified conversations or leads are generated.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best-performing campaign for awareness, engagement, video views, and follower growth.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 24,386.86 and generated 1,518,186 impressions, 323,397 reach, 410,587 page engagements, 388,568 post engagements, 22,019 likes, and 350,459 video views. Cost per like was approximately THB 1.11, much lower than the ERROR QUARANTINED campaigns.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active for awareness/follower objectives. If scaling, increase cautiously and monitor frequency, which is already 4.69.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Lowest media cost profile among campaigns with meaningful spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CPC was THB 0.47 and CPM was THB 16.06, both lower than the main ERROR QUARANTINED campaigns such as 2026-08-23 at THB 1.36 CPC and THB 50.50 CPM.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use this campaign as the benchmark for engagement efficiency, but separate it from lead or purchase objectives.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Inefficient versus the main follower campaign and produced no inline link clicks.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 4,304.20 with 85,233 impressions, 762 likes, 19,292 page engagements, 17,520 video views, 0 inline link clicks, THB 1.36 CPC, and THB 50.50 CPM. Approximate cost per like was THB 5.65 versus THB 1.11 for AQ_MU2025_Followers_IN.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild this campaign rather than continuing it in its current quarantined structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Multiple duplicated variants are spending with weak follower efficiency and little traffic or messaging output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The 2026-08-25 variants spent THB 4,940.31 combined. Campaign ID 120251495841180402 had 0 inline link clicks from THB 1,487.24 spend; campaign ID 120251495843190402 had 0 inline link clicks from THB 1,022.51 spend; campaign ID 120251495845220402 had only 1 inline link click and 1 messaging conversation from THB 2,430.56 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate these duplicates into one clean test or move budget to stronger awareness and new lead/purchase tests.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Duplicated 2026-08-30 campaigns are not producing website traffic and are less efficient than AQ_MU2025_Followers_IN for likes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The five 2026-08-30 variants spent THB 2,173.60 combined, generated 430 likes and 0 inline link clicks. Approximate combined cost per like was THB 5.05 versus THB 1.11 for AQ_MU2025_Followers_IN.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce current spend and rebuild into a controlled test with one objective and clearer budget allocation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account traffic performance            </h3>            <p>              Traffic output is weak relative to spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Account spend was THB 35,829.48 with 62,016 total clicks but only 91 inline link clicks, giving an approximate cost per inline link click of THB 393.73.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              If website visits or ticket sales are required, stop relying on follower/engagement campaigns and launch traffic, lead, or purchase campaigns with verified tracking.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account lead, messaging, and purchase performance            </h3>            <p>              No reliable lead or purchase performance can be assessed.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              No lead actions and no purchase actions are reported. Messaging produced only 1 conversation, below the minimum_results_before_decision of 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make lead or purchase scaling decisions yet. First verify tracking and collect at least 3 results per decision point.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN or a new lead/purchase test              </strong>            </div>            <p>              This campaign spent THB 4,304.20 with 0 inline link clicks and an approximate THB 5.65 cost per like, while AQ_MU2025_Followers_IN delivered likes at approximately THB 1.11.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                A rebuilt campaign structure with one controlled test per objective              </strong>            </div>            <p>              The 2026-08-25 duplicated variants spent THB 4,940.31 combined but produced only 1 inline link click and 1 messaging conversation.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead, messaging, or purchase campaign tests after tracking verification              </strong>            </div>            <p>              The five 2026-08-30 variants spent THB 2,173.60 with 0 inline link clicks and weaker follower efficiency than AQ_MU2025_Followers_IN.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated conversion-path testing              </strong>            </div>            <p>              The account is generating engagement at scale but has no reported leads or purchases, so incremental budget should be used to test qualified lead or ticket-sale paths rather than more duplicate follower campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead generation test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated lead campaign using either Meta instant forms or a tracked website lead form. Keep it separate from follower and engagement campaigns.            </p>            <p>              <strong>Success metric:</strong>              Qualified leads and cost per qualified lead after at least 3 lead results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket purchase tracking test            </h3>            <p>              <strong>Setup:</strong>              Set up and verify purchase tracking through Meta Pixel and/or CAPI, then run a small purchase-optimized campaign once the event is firing correctly.            </p>            <p>              <strong>Success metric:</strong>              Reported purchases and cost per purchase after at least 3 purchase results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engaged-audience retargeting test            </h3>            <p>              <strong>Setup:</strong>              Create retargeting audiences from the account’s 407,484 video views and 472,368 page engagements, then test lead or ticket-sale messaging against them.            </p>            <p>              <strong>Success metric:</strong>              Qualified leads, messaging conversations, or purchases after at least 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Clean follower campaign versus AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong>              Rebuild one non-quarantined follower campaign using the best-performing creative and compare it directly with AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Success metric:</strong>              Cost per like, cost per page engagement, and frequency compared with AQ_MU2025_Followers_IN.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated messaging campaign with clear qualification prompts for ticket enquiries instead of relying on follower campaigns to generate messages.            </p>            <p>              <strong>Success metric:</strong>              Qualified conversations after at least 3 messaging results.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No lead actions are reported, so cost per lead cannot be evaluated.</li><li>No purchase actions, purchase value, or ROAS are reported, so ticket-sale profitability cannot be evaluated.</li><li>There is a major gap between 62,016 total clicks and 91 inline link clicks, indicating most clicks are engagement clicks rather than website traffic.</li><li>Only 1 messaging conversation is reported, which is below the minimum_results_before_decision of 3.</li><li>Repeated identical ERROR QUARANTINED campaign names make campaign-level diagnosis harder; campaign IDs should be used for cleanup.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot
