priority-badge&quot;>                high              </span>            </div>            <h3>              Pause &amp;#039;party&amp;#039; Campaign Pending URL Audit            </h3>            <p>              <strong>Why:</strong>              &amp;#039;party&amp;#039; generated 23,149 link clicks and spent 3,979.91 THB but logged 0 landing page views, showing severe traffic drop-off or missing pixel tracking on the destination URL.            </p>            <p>              <strong>Do this:</strong>              Pause &amp;#039;party&amp;#039; until destination landing page routing and pixel firing are verified.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Pause High-CPM Copy Campaign            </h3>            <p>              <strong>Why:</strong>              &amp;#039;Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy&amp;#039; has an exorbitant CPM of 83.92 THB and CPC of 0.96 THB, yielding only 1 inline link click on 1,241.62 THB spend.            </p>            <p>              <strong>Do this:</strong>              Pause campaign 120252479965590402 immediately.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Manage Ad Fatigue on Main Follower Campaign            </h3>            <p>              <strong>Why:</strong>              &amp;#039;AQ_MU2025_Followers_IN&amp;#039; spent 12,917.99 THB (37.9% of account budget) with high frequency (3.70), indicating audience saturation despite strong 5.66% CTR.            </p>            <p>              <strong>Do this:</strong>              Refresh creative assets or broaden audience targeting to reduce frequency below 2.5.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              Primary driver of high-intent website traffic and landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 14,309 landing page views, 22,252 link clicks, 9.56% CTR, and 0.12 THB CPC on 2,882.98 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Maintain as core traffic driver and carefully scale daily budget.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong social proof and engagement generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Delivered 216,928 page engagements, 15,474 page likes, 24,879 reactions, and 5.66% CTR on 12,917.99 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Maintain for brand building, but introduce fresh creatives to address the 3.70 frequency.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;f
