}  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-26        →        2026-10-25      </span>      <span class=&quot;pill&quot;>        6 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 17,956.56</strong>        <small>          2026-09-26          to          2026-10-25        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,152,845</strong>        <small>          2,183,422 impressions          ·          1.89 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>9,750</strong>        <small>          2.19% CTR          ·          THB 0.37 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>6</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 8.22</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated strong reach and engagement at 17,956.56 THB spend, with 2,183,422 impressions, 1,152,845 reach, 47,921 clicks, 9,750 link clicks, and 1,484 landing page views. However, the stated business goal is profitable ticket sales and qualified leads, and the data shows no reported purchases, no reported leads, and only 6 messaging conversations started. Current spend is heavily weighted toward follower, likes, engagement, and traffic activity rather than measurable sales or lead outcomes.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from follower-only activity toward traffic, lead, and purchase testing            </h3>            <p>              <strong>Why:</strong>              Most campaigns are follower or likes campaigns, while the account has 0 reported purchases and 0 reported leads. The strongest site traffic signals are coming from &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; and &amp;#039;AQ Operator CBO | IN | Instagram Followers&amp;#039;.            </p>            <p>              <strong>Do this:</strong>              Reduce nonessential budget in weaker follower/likes campaigns and reallocate to landing-page-view, lead, messaging qualification, or purchase-optimized tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039;            </h3>            <p>              <strong>Why:</strong>              This campaign produced 1,259 link clicks and 660 landing page views from only 179.77 THB spend, with very low cost per landing page view of about 0.27 THB. Sample spend is small, so it should not be scaled aggressively yet.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually and monitor whether landing page view volume and cost efficiency hold after additional spend. Do not make a final scale decision until performance remains stable over a larger spend base.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep &amp;#039;AQ Operator CBO | IN | Instagram Followers&amp;#039; as the main proven traffic and awareness base            </h3>            <p>              <strong>Why:</strong>              It generated 772 landing page views, 4,153 link clicks, 121,897 video views, 128,257 post engagements, low CPM of 5.52 THB, and cost per landing page view of about 6.37 THB.            </p>            <p>              <strong>Do this:</strong>              Maintain this campaign, then test a new version optimized for landing page views, leads, or purchases instead of follower growth.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild &amp;#039;Aquaverse India | Instagram Followers | 2026-09-27&amp;#039;            </h3>            <p>              <strong>Why:</strong>              It spent the most at 6,545.40 THB but produced only 59 landing page views from 4,321 link clicks, a landing-page-view rate of about 1.4%, and 526 messaging blocks. It did produce 3 messaging conversations started, but at about 2,181.80 THB per conversation started.            </p>            <p>              <strong>Do this:</strong>              Reduce spend and rebuild with clearer destination, stronger landing page alignment, and a qualified CTA. Exclude users who block messages if available and test a lead or purchase objective instead of follower optimization.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix measurement before judging ticket sales profitability            </h3>            <p>              <strong>Why:</strong>              No purchases, no leads, no ROAS, and no revenue are reported. Targets are unknown, so profitability cannot be evaluated from this dataset.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI purchase events, lead events, ticket checkout events, UTMs, and event priority. Confirm whether purchases and leads are absent or simply not tracked.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              Best traffic-quality signal in the account, but from a very small spend base.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              179.77 THB spend, 1,259 link clicks, 660 landing page views, 10.31% CTR, 0.14 THB CPC, and about 0.27 THB per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale in small budget steps and validate tracking because inline link clicks exceed total clicks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Strongest broader campaign for awareness, video engagement, and usable landing page volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,921.14 THB spend, 891,432 impressions, 464,135 reach, 4,153 link clicks, 772 landing page views, 121,897 video views, 128,257 post engagements, 5.52 THB CPM, and about 6.37 THB per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and use it as the base for a conversion/lead objective test using the best-performing creative and audience signals.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Efficient for follower/social proof and engagement, not for site traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,881.71 THB spend, 5,920 likes, 62,182 page engagements, 56,262 post engagements, 9.03% CTR, and about 0.82 THB per like. However, it generated only 17 link clicks and 1 landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth and page social proof are a priority. Do not rely on it for ticket sales or leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Awareness efficiency is strong versus the rest of the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              It delivered the largest video volume with 121,897 video views and a low CPM of 5.52 THB while frequency stayed moderate at 1.92.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use engaged video viewers and page engagers from this campaign for retargeting tests.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Poor traffic quality and weak messaging quality relative to spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              6,545.40 THB spend, 4,321 link clicks, only 59 landing page views, 3 messaging conversations started, 526 messaging blocks, and about 110.94 THB per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild the campaign around landing page views, leads, or purchases with clearer creative-to-destination alignment.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Less efficient follower/likes campaign than &amp;#039;AQ_MU2025_Followers_IN&amp;#039;.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,242.41 THB spend, 897 likes, 3,628 page engagements, 0 inline link clicks, 98.16 THB CPM, and about 1.38 THB per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or consolidate into the more efficient follower setup unless this campaign has a separate non-sales purpose.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy            </h3>            <p>              Small sample, but early efficiency is weaker than the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              186.13 THB spend, 188 likes, 623 page engagements, 0 inline link clicks, 97.25 THB CPM, and about 0.99 THB per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause solely from this tiny sample. Keep capped or merge learnings into the stronger follower campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account overall            </h3>            <p>              Business-goal measurement is missing.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across 17,956.56 THB spend, the data reports 0 purchases, 0 leads, 6 messaging conversations started, and no revenue or ROAS.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not judge profitability until purchase, lead, and ticket checkout tracking is verified.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers and new lead/purchase test              </strong>            </div>            <p>              The Instagram Followers campaign spent 6,545.40 THB but produced only 59 landing page views and 526 messaging blocks, while AQ Operator CBO produced 772 landing page views and 121,897 video views from 4,921.14 THB.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <p>              Both appear follower/likes oriented, but AQ_MU2025_Followers_IN has lower cost per like at about 0.82 THB versus about 1.38 THB and much stronger engagement volume.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                General follower-only budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy              </strong>            </div>            <p>              This campaign delivered the strongest landing page efficiency with 660 landing page views from only 179.77 THB spend, but should be scaled carefully due to limited spend history and a click-count anomaly.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current traffic without conversion tracking              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated ticket-sales or lead campaign              </strong>            </div>            <p>              The business goal is ticket sales and qualified leads, but the account has no reported purchase or lead outcomes to optimize against.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Ticket sales conversion campaign            </h3>            <p>              <strong>Setup:</strong>              Create a new campaign optimized for purchase or ticket checkout event using the best creatives from &amp;#039;AQ Operator CBO | IN | Instagram Followers&amp;#039; and &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039;.            </p>            <p>              <strong>Success metric:</strong>              Judge only after at least 3 purchase results are recorded; compare cost per purchase and purchase volume across ad sets because target CPA is unknown.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Lead capture campaign            </h3>            <p>              <strong>Setup:</strong>              Run a lead form or landing page lead campaign with qualifying questions for visit date, number of tickets, and contact details.            </p>            <p>              <strong>Success metric:</strong>              Judge only after at least 3 leads; compare cost per qualified lead and lead quality from CRM or manual review.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Retargeting from engaged audiences            </h3>            <p>              <strong>Setup:</strong>              Build retargeting audiences from landing page viewers, video viewers, page engagers, and Instagram engagers from &amp;#039;AQ Operator CBO | IN | Instagram Followers&amp;#039; and &amp;#039;AQ_MU2025_Followers_IN&amp;#039;. Serve ticket offer or lead CTA ads.            </p>            <p>              <strong>Success metric:</strong>              Purchases, leads, or qualified messaging conversations after at least 3 results per ad set.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Landing page view versus link click optimization            </h3>            <p>              <strong>
