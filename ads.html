0 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 118,036.76</strong>        <small>          2026-10-24          to          2026-11-22        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>2,767,577</strong>        <small>          5,484,879 impressions          ·          1.98 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Impressions</span>        <strong>5,484,879</strong>        <small>Total ad displays in this reporting period</small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>295,066</strong>        <small>          5.38% Link CTR          ·          THB 0.40 Link CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 21.52</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>    <section class=&quot;section&quot; aria-label=&quot;Data quality check&quot;>    <div class=&quot;dq-panel dq-pass&quot;>      <div class=&quot;dq-heading&quot;>        <span class=&quot;dq-label&quot;>DATA QUALITY CHECK</span>        <span class=&quot;dq-status&quot;>Checks passed</span>      </div>      <p class=&quot;dq-overview&quot;>No anomalies detected by the selected checks. This does not verify Meta attribution accuracy.</p>      <details class=&quot;dq-details&quot;>        <summary>Review checks (12 passed, 0 warnings, 0 critical) · 10 campaigns · 30 daily rows</summary>        <ul class=&quot;dq-checks&quot;><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Report date range</strong><small>2026-10-24 to 2026-11-22 (30 calendar days).</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Account summary response</strong><small>Account spend and impressions are present and numeric.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Campaign response</strong><small>10 campaign rows received.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Campaign pagination</strong><small>No additional campaign page is indicated in this response.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Daily trend response</strong><small>30 daily rows received. Days without delivery may not have a row.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Daily pagination</strong><small>No additional daily page is indicated.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Duplicate campaign identifiers</strong><small>No duplicate non-empty campaign IDs in returned campaign rows.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Metric value integrity</strong><small>No invalid/negative core metrics or obvious reach/click inconsistencies found.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Daily date integrity< trong><small>AI recommendations were parsed, but must still be verified against Meta data.</small></span>  </li></ul>      </details>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Between Oct 24 and Nov 22, 2026, the India Ad Account spent 39,394.06 THB across 6 campaigns, reaching 3,747,207 users and generating 71,812 link clicks and 18,422 landing page views. Overall performance shows strong engagement and traffic generation, but the account suffers from tracking gaps (0 purchase/lead conversion events recorded despite ticket sales goals) and budget inefficiencies where high-cost/high-frequency follower campaigns outspend top-performing traffic drivers.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix Meta Pixel &amp;amp; Event Tracking for Ticket Sales            </h3>            <p>              <strong>Why:</strong>              The account spent 39,394.06 THB with the goal of driving ticket sales and qualified leads, but zero purchase or lead events are being tracked in Meta Ads Manager.            </p>            <p>              <strong>Do this:</strong>              Implement and verify Meta Pixel standard purchase and lead event tracking on the website checkout flow.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Resolve Tracking Discrepancy on Campaign &amp;#039;party&amp;#039;            </h3>            <p>              <strong>Why:</strong>              &amp;#039;party&amp;#039; generated 33,185 inline link clicks for 5,550.24 THB spend but recorded 0 landing page views.            </p>            <p>              <strong>Do this:</strong>              Audit destination URL, URL parameters, and landing page pixel implementation for campaign &amp;#039;party&amp;#039; to resolve drop-off tracking.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reallocate Budget to High-Performing Traffic Campaign            </h3>            <p>              <strong>Why:</strong>              &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; delivered 17,984 landing page views (97.6% of account total) at 0.123 THB CPC, but received only 3,598.58 THB (9.1% of budget).            </p>            <p>              <strong>Do this:</strong>              Scale daily budget on &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; by reducing budget from inefficient follower campaigns.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Reduce Budget on Saturation-Prone Follower Campaign            </h3>            <p>              <strong>Why:</strong>              &amp;#039;AQ_MU2025_Followers_IN&amp;#039; consumed 15,877.20 THB (40.3% of spend) with a frequency of 4.06 and CPM of 19.37 THB, indicating ad fatigue.            </p>            <p>              <strong>Do this:</strong>              Cap budget on &amp;#039;AQ_MU2025_Followers_IN&amp;#039; and expand audience targeting to lower frequency.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              Exceptional traffic generation efficiency and high click-through rate.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 27,787 inline link clicks and 17,984 landing page views from 298,562 impressions. Achieved a 9.78% CTR, 0.123 THB CPC, and ~0.20 THB Cost per Landing Page View on a 3,598.58 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale budget by 20-30% increments while maintaining audience targeting and creative set.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Broad brand reach and video engagement at very low CPM.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Delivered 2,712,217 impressions and 419,897 video views with a CPM of 3.74 THB and 435,232 post engagements on 10,140.11 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep campaign active for brand awareness and retargeting audience building.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy            </h3>            <p>              Extremely high CPM and poor link click output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 1,241.62 THB yielding a CPM of 83.92 THB and CPC of 0.960 THB, producing only 1 inline link click across 14,795 impressions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild this campaign due to prohibitive delivery costs relative to traffic output.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              High audience frequency and elevated delivery cost.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Frequency reached 4.06 across 201,945 reach, generating a CPM of 19.37 THB (highest among active follower campaigns) and spending 15,877.20 THB with only 60 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce spend and refresh ad creatives to alleviate audience saturation.            </div>          </div> sions recorded for ticket sales or qualified leads across 39,394.06 THB account spend.</li><li>Tracking breakdown on campaign &amp;#039;party&amp;#039;: 33,185 inline link clicks registered with 0 landing page views tracked, indicating missing pixel or broken destination URL.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Immediately install and verify Meta Pixel conversion tracking for ticket purchases and lead forms. Scale budget into &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; (17,984 LPVs at 0.123 THB CPC), reduce spend on high-frequency campaign &amp;#039;AQ_MU2025_Followers_IN&amp;#039;, pause &amp;#039;Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy&amp;#039;, and resolve tracking on &amp;#039;party&amp;#039; before increasing spend.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout campaigns    </h2>    <div class=&quot;insights&quot;>                <div class=&quot;insight&quot;>            <span>Highest link CTR</span>            <strong>9.31% · India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy</strong>          </div>                  <div class=&quot;insight&quot;>            <span>Lowest link CPC</span>            <strong>THB 0.13 · India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy</strong>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Daily spend trend    </h2>    <div class=&quot;panel&quot;>            <div class=&quot;trend-row&quot;>        <div class=&quot;trend-date&quot;>          2026-10-24        </div>        <div class=&quot;trend-track&quot;>          <div
