grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-27        →        2026-09-25      </span>      <span class=&quot;pill&quot;>        14 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 29,188.61</strong>        <small>          2026-08-27          to          2026-09-25        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>407,951</strong>        <small>          1,515,146 impressions          ·          3.71 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>75</strong>        <small>          3.52% CTR          ·          THB 0.55 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 19.26</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account delivery is strong for awareness and engagement, but weakly aligned to the stated goal of profitable ticket sales and qualified leads. The account spent THB 29,188.61, generated 1,515,146 impressions, 407,951 reach, 400,138 page engagements, 21,058 likes, and 343,391 video views, but only 75 inline link clicks, 1 messaging conversation, and no reported purchases or leads. AQ_MU2025_Followers_IN is the clear engagement winner, while the ERROR QUARANTINED campaigns are materially less efficient and should not continue receiving meaningful budget.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from ERROR QUARANTINED campaigns            </h3>            <p>              <strong>Why:</strong>              The ERROR QUARANTINED campaigns spent THB 7,554.12 and generated only 1 inline link click, while also delivering weaker efficiency than AQ_MU2025_Followers_IN on CPC, CPM, page engagement cost, and cost per like.            </p>            <p>              <strong>Do this:</strong>              Pause or materially reduce all ERROR QUARANTINED campaigns with meaningful spend, excluding the tiny 2026-08-28 variants from performance judgement due to insufficient sample.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild campaigns around ticket sales and qualified leads            </h3>            <p>              <strong>Why:</strong>              Current activity is mainly follower/like engagement. There are no reported purchases or leads, and only 1 messaging conversation, which is below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Create separate purchase, lead, and messaging campaigns instead of expecting follower/like campaigns to drive sales or qualified enquiries.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix or validate conversion tracking before scaling sales objectives            </h3>            <p>              <strong>Why:</strong>              The account goal is ticket sales and qualified leads, but the data contains no purchase events, no lead events, no ROAS, and only 1 messaging conversation.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI, purchase event firing, lead event firing, ticket checkout attribution, and CRM/offline lead capture before judging profitability.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN, but do not scale aggressively            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN drove most efficient awareness and engagement, but frequency is already 4.45 and the campaign generated only 74 inline link clicks from 1,330,806 impressions.            </p>            <p>              <strong>Do this:</strong>              Keep it for awareness/follower growth, refresh creatives, monitor frequency, and only scale carefully by 10-15% if engagement efficiency holds.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best campaign for awareness and engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 21,634.49 and produced 1,330,806 impressions, 355,153 page engagements, 335,364 post engagements, 19,789 likes, and 301,553 video views. Cost per page engagement was about THB 0.061 and cost per like was about THB 1.09.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active for follower/engagement objectives, but separate it from sales/lead expectations.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Most efficient large-scale delivery in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CPM was THB 16.26 and CPC was THB 0.47 versus the ERROR QUARANTINED aggregate at approximately THB 40.98 CPM and THB 1.04 CPC.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use this as the benchmark for awareness efficiency and reallocate awareness budget away from weaker duplicate campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Delivered nearly all reported link-click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 74 of the account&amp;#039;s 75 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              If traffic remains a secondary goal, test traffic-specific creatives and landing page CTAs inside a separate traffic or sales campaign.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Inefficient versus the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,469.17 with 31,498 impressions, THB 46.64 CPM, THB 1.18 CPC, 239 likes, and 0 inline link clicks. Cost per like was about THB 6.15.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or reduce. Move budget to AQ_MU2025_Followers_IN or to a new sales/lead test.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Duplicate campaigns are fragmented and less efficient than AQ_MU2025_Followers_IN.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The three 2026-08-25 variants spent THB 3,886.84 combined and generated only 1 inline link click. Individual CPMs were THB 29.04, THB 47.16, and THB 64.91, all higher than AQ_MU2025_Followers_IN at THB 16.26.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate or pause these variants. Do not continue duplicated ERROR QUARANTINED structures.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Multiple duplicated campaigns produced engagement but poor efficiency relative to the main campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The five 2026-08-30 variants spent THB 2,173.60 combined, generated 0 inline link clicks, and had CPMs from THB 35.51 to THB 39.38 versus THB 16.26 for AQ_MU2025_Followers_IN.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or reduce these campaigns and rebuild as one clean campaign only if follower acquisition remains a priority.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient sample for a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The 2026-08-28 variants spent only THB 24.51 combined and had fewer than 60 impressions each.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not judge performance from this sample. Keep excluded from scaling decisions and clean up only for account hygiene.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              All campaigns            </h3>            <p>              Traffic, lead, messaging, and purchase outcomes are not strong enough to support sales decisions.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Account generated 53,270 total clicks but only 75 inline link clicks, 1 messaging conversation, no reported leads, and no reported purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Stop evaluating these campaigns as sales campaigns. Build dedicated purchase, lead, and messaging campaigns with correct tracking.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New ticket sales and qualified lead campaigns              </strong>            </div>            <p>              These campaigns spent THB 7,554.12 with only 1 inline link click and no reported purchases or leads. Redirect the next-period equivalent budget into campaigns optimized for purchase, lead, or messaging outcomes.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <p>              If awareness/follower growth remains required, AQ_MU2025_Followers_IN is much more efficient, with THB 16.26 CPM, THB 0.47 CPC, and about THB 1.09 cost per like.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current engagement-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting pool built from page engagements and video viewers              </strong>            </div>            <p>              The account has 400,138 page engagements and 343,391 video views that can be used for warmer ticket or lead retargeting instead of continuing only broad follower campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Purchase campaign for ticket sales            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated sales campaign optimized for purchase once purchase tracking is confirmed. Use ticket-focused creative, clear pricing or offer messaging, and landing page/checkout destination.            </p>            <p>              <strong>Success metric:</strong>              Evaluate cost per purchase only after at least 3 purchases, respecting the minimum_results_before_decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Qualified lead campaign            </h3>            <p>              <strong>Setup:</strong>              Run an Instant Form or website lead campaign with qualifying questions such as visit date, group size, and contact details.            </p>            <p>              <strong>Success metric:</strong>              Cost per qualified lead and lead quality after at least 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Messaging campaign for enquiries            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated messaging campaign with pre-filled questions for ticket availability, pricing, group bookings, and travel dates.            </p>            <p>              <strong>Success metric:</strong>              Cost per messaging conversation and qualified conversation rate after at least 3 messaging conversations.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Warm retargeting from engagers and video viewers            </h3>            <p>              <strong>Setup:</strong>              Create audiences from page engagers, post engagers, and video viewers generated during this period, then serve ticket/lead CTAs.            </p>            <p>              <strong>Success metric:</strong>              Purchases, leads, or messaging conversations, not post engagement.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative CTA test            </h3>            <p>              <strong>Setup:</strong>              Test follower-style creative against ticket-sale creative with stronger CTAs such as book tickets, plan your visit, or enquire now.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, leads, messaging conversations, or purchases depending on campaign objective.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&
