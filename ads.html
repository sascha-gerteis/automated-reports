    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-08        →        2026-09-06      </span>      <span class=&quot;pill&quot;>        22 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 87,433.88</strong>        <small>          2026-08-08          to          2026-09-06        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>8,088,761</strong>        <small>          13,721,529 impressions          ·          1.70 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>584</strong>        <small>          0.81% CTR          ·          THB 0.79 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 29,144.63 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>13</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 6.37</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account delivery is strong for awareness and engagement, but weakly aligned to the business goal of profitable ticket sales and qualified leads. Spend was THB 87,433.88 with 13,721,529 impressions, 1,597,649 page engagements, 1,477,169 video views, 584 link clicks, 13 messaging conversations started, 1 lead, and no purchase actions reported. Because cost targets are unknown and lead volume is below the minimum_results_before_decision of 3, lead and purchase efficiency cannot be judged conclusively. The clearest opportunity is to reduce high-spend follower/like campaigns that are not producing traffic or leads, keep low-cost awareness/engagement campaigns in their proper role, and rebuild budget toward dedicated lead, messaging, or purchase campaigns.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild for the actual business goal            </h3>            <p>              <strong>Why:</strong>              The account is mostly spending on followers, likes, page visibility, and post engagement while the stated goal is ticket sales and qualified leads. Across THB 87,433.88 spend, only 1 lead and no purchase actions were reported.            </p>            <p>              <strong>Do this:</strong>              Create separate campaigns for Lead, Messaging, and Purchase objectives instead of expecting follower/engagement campaigns to drive ticket sales. Keep engagement campaigns only as awareness/remarketing feeders.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on the highest-spend Broad Destination follower campaign            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination spent THB 30,305.32, produced only 4 link clicks, 1 lead, and 9 messaging conversations started. Lead volume is below the 3-result decision threshold, but traffic efficiency is clearly weak at THB 7,576.33 per link click.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign materially and rebuild it into a dedicated lead or messaging campaign using the same audience only as a test, not as the main spend driver.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale New post engagement campaign            </h3>            <p>              <strong>Why:</strong>              New post engagement campaign produced 320,145 page engagements from only THB 2,302.48 spend and generated 400 of the account&amp;#039;s 584 link clicks at THB 5.76 per link click.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually and duplicate the strongest post into a traffic, lead, or message test to see if engagement quality converts.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate awareness evaluation from traffic and lead evaluation            </h3>            <p>              <strong>Why:</strong>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers drove 10,177,037 impressions, 6,435,836 reach, 532,668 page engagements, and 525,635 video views at THB 7,193.90 spend, but only 1 link click.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign only if the goal is cheap awareness or video/page engagement. Do not fund it from lead or ticket-sales budget.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking before judging purchase performance            </h3>            <p>              <strong>Why:</strong>              No purchase actions or ROAS are reported, and only 1 lead is present despite THB 87,433.88 spend. The account also shows 111,181 total clicks but only 584 inline link clicks, indicating most clicks are engagement clicks rather than site traffic.            </p>            <p>              <strong>Do this:</strong>              Verify pixel/CAPI events, purchase event firing, lead deduplication, URL parameters, and whether campaigns are optimized to the correct conversion event.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best low-cost engagement and strongest link-click contributor in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,302.48 spend, 320,145 page engagements, 301,884 video views, 400 link clicks, THB 5.76 per link click, CPM THB 2.37.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use the winning post as the creative base for a traffic, lead, or messaging conversion test.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower/page-like and engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 29,003.69 spend, 518,576 page engagements, 26,288 likes, 438,529 video views, CTR 4.30%, THB 1.10 per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for follower and engagement objectives, but monitor frequency at 4.02 and avoid treating it as a lead or purchase campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very efficient reach, impressions, video views, and page engagement for awareness.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 7,193.90 spend, 10,177,037 impressions, 6,435,836 reach, CPM THB 0.71, 532,668 page engagements, 525,635 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as an awareness campaign if visibility is desired. Do not scale for traffic, leads, or ticket sales because it produced only 1 link click.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Largest source of messaging activity, but not yet efficient enough to scale as-is.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 30,305.32 spend, 9 messaging conversations started, 9 first replies, and 1 lead. This is 9 of the account&amp;#039;s 13 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use its audience or creative learnings for a dedicated click-to-message qualification test, but reduce current follower/like spend.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              High spend is not translating into traffic or enough lead volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 30,305.32 spend, 648,318 impressions, only 4 link clicks, 1 lead, THB 7,576.33 per link click, and lead count below the minimum decision threshold of 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild into Lead, Messaging, or Purchase objective campaigns. Do not make a final lead-performance decision until at least 3 leads are recorded.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Not suitable for traffic or lead generation despite strong awareness delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              10,177,037 impressions and 532,668 page engagements but only 1 link click and no leads or purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only in the awareness bucket with a capped budget. Remove from any traffic, lead, or ticket-sale budget allocation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Expensive delivery and weak site traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,380.13 spend, CPM THB 204.34, 6,243 page engagements, 1,570 likes, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild with cleaner campaign setup and lower-cost placements/audiences. Do not pause based only on traffic because the campaign is a follows/likes campaign, but do not scale it.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Follower/engagement cost is weaker than the top engagement campaigns and it produced no site traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,304.20 spend, 19,292 page engagements, 762 likes, 0 link clicks, no leads, no purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and consolidate into the better-performing follower/engagement structure instead of running as a separate quarantined duplicate.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data for a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Several duplicate entries spent only THB 4.26 to THB 7.06 with 29 to 58 impressions each.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on this tiny sample. Either allow enough delivery to reach meaningful volume or remove as part of account cleanup if these are unintended duplicate/quarantined campaigns.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New Lead, Messaging, or Purchase objective campaign              </strong>            </div>            <p>              This campaign consumed THB 30,305.32 but generated only 4 link clicks, 1 lead, and no purchases. Reallocate part of this budget to campaigns optimized for the actual business goal.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate ERROR QUARANTINED Broad Destination follower/like campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN or a consolidated follower/engagement campaign              </strong>            </div>            <p>              AQ_MU2025_Followers_IN generated 26,288 likes at about THB 1.10 per like, while several duplicate Broad Destination campaigns show weaker engagement/like efficiency or too little data.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Traffic/lead budget currently sitting in awareness-style campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign as a creative feeder and separate conversion test              </strong>            </div>            <p>              New post engagement campaign generated 400 link clicks from THB 2,302.48, far more traffic than larger campaigns. It should receive careful incremental budget and be tested under a conversion-oriented objective.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Keep only a capped awareness allocation              </strong>            </div>            <p>              The campaign is efficient for awareness with CPM THB 0.71 and 6,435,836 reach, but it produced only 1 link click, so it should not receive lead or ticket-sales budget.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Dedicated lead generation campaign            </h3>            <p>              <strong>Setup:</strong>              Launch a new campaign optimized for leads using Meta lead form or website lead event. Test audiences from post engagers, video viewers, page engagers, and Broad Destination. Use clear ticket/offer lead qualification questions.            </p>            <p>              <strong>Success metric:</strong>              Wait for at least 3 leads before deciding. Then compare cost per lead and lead quality by audience; do not compare to a target because no CPL target was supplied.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Click-to-message qualification test            </h3>            <p>              <strong>Setup:</strong>              Use learnings from Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination because it produced 9 of 13 messaging conversations. Run a dedicated messaging campaign with automated FAQs, ticket intent prompts, and qualification questions.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, and qualified conversations. Make decisions only after each test cell has at least 3 conversations.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Top engagement creative into traffic or conversion objective            </h3>            <p>              <strong>Setup:</strong>              Duplicate the best-performing post from New post engagement campaign into a traffic, lead, or purchase campaign with the same creative and a stronger ticket-sales CTA.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, leads, purchases if tracked, and cost per result. Use New post engagement campaign&amp;#039;s 400 link clicks at THB 5.76 per link click as the current traffic reference point.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Awareness audience split            </h3>            <p>              <strong>Setup:</strong>              Run a controlled test between Young Adult Travellers and Broad Destination audiences using the same creative and equal budget under an awareness or engagement objective.            </p>            <p>              <strong>Success metric:</strong>              Cost per page engagement, cost per video view, CPM, and frequency. Keep the winner only for awareness or remarketing pool growth.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Follower campaign consolidation test            </h3>            <p>              <strong>Setup:</strong>              Consolidate duplicate follower/like campaigns into one clean campaign structure and compare against AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Success metric:</strong>              Cost per like, page engagement volume, frequency, and negative actions such as post unlikes.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase actions are reported, so purchase CPA, ROAS, and ticket-sales profitability cannot be evaluated.</li><li>Only 1 lead is reported across THB 87,433.88 spend, which is below the minimum_results_before_decision of 3; lead performance is directionally weak but statistically limited.</li><li>The account shows 111,181 total clicks but only 584 inline link clicks, indicating most clicks are engagement clicks rather than website traffic.</li><li>Lead-related actions appear under multiple labels including onsite_conversion.lead, onsite_web_lead, lead, and onsite_conversion.lead_grouped with value 1; verify deduplication and event mapping.</li><li>Many campaigns include ERROR QUARANTINED in the name, which suggests setup, naming, or delivery hygiene issues that should be cleaned up before scaling.</li><li>Multiple campaigns share the exact same name, especially Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination and ERROR QUARANTINED Broad Destination variants, making budget and result analysis harder.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep New post engagement campaign and AQ_MU2025_Followers_IN for engagement/follower growth, keep Young Adult Travellers only as capped awareness, and reduce the high-spend Broad Destination and duplicate quarantined follower campaigns. Reallocate budget into dedicated Lead, Messaging, and Purchase objective tests, but do not make final lead or purchase decisions until tracking is verified and each test reaches at least 3 meaningful results.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout campaigns    </h2>    <div class=&quot;insights&quot;>                <div class=&quot;insight&quot;>            <span>Highest C
