pan>        <strong>THB 18,986.33</strong>        <small>          2026-09-11          to          2026-10-10        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>750,375</strong>        <small>          1,633,358 impressions          ·          2.18 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>3,667</strong>        <small>          2.82% CTR          ·          THB 0.41 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 11.62</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account generated large upper-funnel volume but very limited business-goal evidence. Spend was THB 18,986.33 for 1,633,358 impressions, 46,081 clicks, 3,667 inline link clicks, 77 landing page views, 4 total messaging connections, and no reported leads or purchases. Performance is strongest for follower/engagement objectives, especially AQ_MU2025_Followers_IN and AQ Operator CBO | IN | Instagram Followers. However, current spend is not aligned tightly enough to profitable ticket sales or qualified leads, and tracking/landing-page continuity is a major issue.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix conversion and landing page tracking before judging sales performance            </h3>            <p>              <strong>Why:</strong>              No purchase or lead actions are reported, and only 77 landing page views came from 3,667 inline link clicks, a 2.1% click-to-LPV rate.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, landing page view event firing, UTMs, in-app browser loading, and ticket/lead form events. Confirm Purchase, Lead, and Landing Page View fire correctly before scaling sales or lead campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce business-goal reliance on follower campaigns            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN spent THB 12,517.91, 65.9% of total spend, and delivered strong engagement but only 35 inline link clicks and no leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep AQ_MU2025_Followers_IN only as an awareness/follower engine. Move a portion of budget into dedicated traffic, lead, or purchase campaigns once tracking is fixed.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Carefully scale AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              <strong>Why:</strong>              Despite only THB 190.60 spend, it produced 137 inline link clicks and 29 landing page views, giving the strongest click-to-LPV rate at 21.2% and lowest cost per LPV at THB 6.57.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually and monitor whether LPV rate holds above the account average. Do not make aggressive decisions yet because spend volume is still small.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              <strong>Why:</strong>              It has the highest CPM at THB 98.16, higher CPC at THB 1.09, 0 inline link clicks, and weaker cost per page engagement than AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Do this:</strong>              Do not scale this campaign. Rebuild with new creative/audience structure or shift budget to the stronger follower and landing-page-view performers.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strongest awareness and engagement engine.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 12,517.91 spend generated 180,363 page engagements, 168,166 post engagements, 12,197 likes, and 146,365 video views. Cost per page engagement was approximately THB 0.07.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for follower/engagement objectives, but do not judge or scale it for ticket sales because it produced only 35 inline link clicks and no purchase or lead actions.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Best campaign for cheap reach and link-click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,035.41 spend produced 905,720 impressions, CPM THB 5.56, 3,495 inline link clicks, and reported CPC of THB 0.29.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active as a traffic/follower test, but optimize landing-page continuity because only 48 landing page views came from 3,495 inline link clicks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best landing page view quality from available data.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 190.60 spend produced 137 inline link clicks and 29 landing page views, with a 21.2% link-click-to-LPV rate and THB 6.57 cost per LPV.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale and use it as the model for traffic-quality testing, while respecting the small spend sample.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Large link-click volume is not translating into landing page views or meaningful messaging outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              3,495 inline link clicks produced only 48 landing page views, a 1.37% click-to-LPV rate. It also recorded 421 messaging blocks and only 4 total messaging connections.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit destination, page load, tracking, and placements. Reduce scaling until the click-to-LPV gap is fixed.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Not suitable as the main campaign for ticket sales or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              It consumed THB 12,517.91 and generated 180,363 page engagements but only 35 inline link clicks, no landing page views, no leads, and no purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only for awareness/followers. Shift performance budget toward traffic, lead, messaging, or purchase campaigns after tracking is validated.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Least efficient follower/engagement campaign among meaningful spend campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,242.41 spend, CPM THB 98.16, CPC THB 1.09, 0 inline link clicks, and approximately THB 0.34 cost per page engagement versus THB 0.07 for AQ_MU2025_Followers_IN.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Do not scale in its current form.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              All campaigns            </h3>            <p>              No purchase or lead performance can be evaluated.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The account reports 0 purchases and 0 lead actions during the period, while business goal is profitable ticket sales and qualified leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Set up and validate purchase and lead tracking, then launch dedicated sales/lead campaigns instead of relying mainly on follower campaigns.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated ticket sales or lead campaign after tracking validation              </strong>            </div>            <p>              AQ_MU2025_Followers_IN used 65.9% of spend and is efficient for engagement, but it did not produce leads, purchases, or meaningful traffic volume.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              Daily Follows Likes has high CPM, higher CPC, and 0 inline link clicks, while AQ Operator CBO has the strongest LPV efficiency with THB 6.57 cost per LPV.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Hold partial budget until tracking and landing-page-view loss is resolved              </strong>            </div>            <p>              It generates cheap reach and many inline link clicks, but only 48 landing page views from 3,495 inline link clicks indicates traffic quality or tracking leakage.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing page view quality test            </h3>            <p>              <strong>Setup:</strong>              Duplicate AQ Operator CBO | IN | Instagram Followers structure and compare it against Aquaverse India | Instagram Followers | 2026-09-27 using the same destination URL and UTMs.            </p>            <p>              <strong>Success metric:</strong>              Higher link-click-to-landing-page-view rate and lower cost per landing page view.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket sales or lead objective test            </h3>            <p>              <strong>Setup:</strong>              After Pixel/CAPI and events are validated, launch a dedicated campaign optimized for Purchase or Lead instead of followers.            </p>            <p>              <strong>Success metric:</strong>              At least 3 purchases or leads before making scale/pause decisions, per the minimum_results_before_decision rule.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Follower campaign consolidation test            </h3>            <p>              <strong>Setup:</strong>              Run AQ_MU2025_Followers_IN against a rebuilt version of Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination with refreshed creative and audience structure.            </p>            <p>              <strong>Success metric:</strong>              Cost per page engagement, cost per like, CPM, and frequency.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging flow test            </h3>            <p>              <strong>Setup:</strong>              Test a simplified message entry flow with clear CTA, automated first reply, and qualification question.            </p>            <p>              <strong>Success metric:</strong>              Total messaging connections and qualified replies, but only evaluate after at least 3 meaningful results.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase or lead actions are reported, so profitable ticket sales and qualified lead performance cannot be assessed.</li><li>Landing page view tracking or traffic quality is problematic: 3,667 inline link clicks produced only 77 landing page views account-wide.</li><li>Aquaverse India | Instagram Followers | 2026-09-27 shows the biggest mismatch: 3,495 inline link clicks but only 48 landing page views.</li><li>Messaging quality needs review: the account reports 468 messaging blocks versus only 4 total messaging connections.</li><li>Targets for CPL, CPA, and ROAS are 0, so no comparison to target performance is possible.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&qu
