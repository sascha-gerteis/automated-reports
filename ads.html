t-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-30        →        2026-10-29      </span>      <span class=&quot;pill&quot;>        6 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 18,513.35</strong>        <small>          2026-09-30          to          2026-10-29        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,226,869</strong>        <small>          2,414,656 impressions          ·          1.97 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>14,008</strong>        <small>          2.18% CTR          ·          THB 0.35 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>8</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.67</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated strong reach and engagement with 2,414,656 impressions, 1,226,869 reach, 52,553 clicks, 14,008 link clicks, 4,245 landing page views, THB 18,513.35 spend, THB 0.35 CPC, THB 7.67 CPM, and 2.18% CTR. Traffic quality improved sharply late in the period, driven primarily by India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy, which produced 3,349 of 4,245 total landing page views at only THB 0.22 per landing page view. However, there are no reported purchases, leads, revenue, or ROAS, so profitability cannot be assessed. Messaging performance is weak with only 8 conversations started versus 1,212 messaging blocks.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Scale the best traffic campaign carefully            </h3>            <p>              <strong>Why:</strong>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy produced 3,349 landing page views from THB 751.89 spend, equal to THB 0.22 per landing page view, far better than the account average of THB 4.36.            </p>            <p>              <strong>Do this:</strong>              Increase budget on India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy gradually and monitor landing page view cost, link click volume, and downstream ticket or lead events once tracking is fixed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix purchase and lead tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              The business goal is profitable ticket sales and qualified leads, but the supplied data contains no purchase, lead, purchase value, or ROAS events.            </p>            <p>              <strong>Do this:</strong>              Audit Meta Pixel/CAPI, purchase event, lead event, ticket checkout events, event match quality, and attribution setup before making profitability decisions.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend from low-traffic follower/like campaigns            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN spent THB 4,284.41 but generated only 16 link clicks and 1 landing page view. Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination and its Copy spent THB 1,536.94 combined with 1 total link click and 0 landing page views.            </p>            <p>              <strong>Do this:</strong>              Keep these only if the objective is page likes or social engagement; otherwise reduce budgets and move spend into the Claude rebuild traffic campaign and a rebuilt conversion/lead campaign.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild messaging strategy            </h3>            <p>              <strong>Why:</strong>              The account recorded only 8 messaging conversations started and 7 first replies from THB 18,513.35 spend, while messaging blocks reached 1,212.            </p>            <p>              <strong>Do this:</strong>              Stop using current follower/engagement campaigns as a proxy for messaging demand; test a dedicated messaging campaign with clearer offer, pre-qualifying copy, and audience exclusions for users who blocked or negatively engaged.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              Best traffic and landing page view efficiency in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 751.89 spend, 5,415 link clicks, 3,349 landing page views, THB 0.14 per link click, THB 0.22 per landing page view, 10.93% CTR, and 61.85% landing-page-view-to-link-click rate.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this as the current traffic control campaign and duplicate its strongest creative/landing path into lead or purchase-optimized tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Strong awareness and video distribution with acceptable traffic volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 6,040.57 spend, 1,204,807 impressions, THB 5.01 CPM, 168,617 video views, 4,914 link clicks, 853 landing page views, and THB 7.08 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an awareness/upper-funnel campaign, but do not treat it as the main ticket-sales driver unless purchase or lead events begin appearing.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Effective for page engagement and follower-style activity, not traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,284.41 spend generated 60,817 page engagements, 55,146 post engagements, 5,671 likes, 9,211 post reactions, and 825 comments, but only 16 link clicks and 1 landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the goal is social proof, followers, or engagement. Reduce if the priority is ticket sales, leads, or site traffic.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient reach and link click delivery, but poor landing page continuation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,899.54 spend, 1,008,873 impressions, THB 5.85 CPM, 3,662 link clicks, and THB 1.61 per link click, but only 42 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only for cheap reach/link-click generation. Rebuild the destination or optimization if the intended outcome is qualified traffic.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Link clicks are not converting into landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              3,662 link clicks produced only 42 landing page views, a 1.15% landing-page-view-to-link-click rate, with THB 140.46 cost per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Check destination URL, in-app browser load speed, landing page tracking, and campaign optimization. Rebuild as a landing page view, lead, or purchase campaign rather than relying on link clicks.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Very weak for traffic despite high spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,284.41 spend, 11,782 clicks, but only 16 link clicks and 1 landing page view. CPM is also high at THB 31.85 versus the account average THB 7.67.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale for traffic or sales. Keep only a small engagement/social-proof budget if page growth is valuable.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              High CPM and no measurable site traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 633.92 spend, THB 96.06 CPM, 569 clicks, 0 link clicks, and 0 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause solely from traffic data if the intent is likes, because it generated 469 likes. Reduce or rebuild if the campaign is expected to support ticket sales or leads.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy            </h3>            <p>              High CPM and almost no traffic output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 903.02 spend, THB 81.58 CPM, 966 clicks, 1 link click, and 0 landing page views. It generated 850 likes, so it is only useful for like acquisition.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only if page likes are a priority. Otherwise reduce and rebuild with a traffic, lead, or purchase objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Messaging quality appears weak despite scale.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4 messaging conversations started and 3 first replies from THB 6,040.57 spend, while messaging blocks reached 769.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Exclude negative engagers where possible, refresh copy to set clearer expectations, and avoid using this campaign as a messaging acquisition engine.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy              </strong>            </div>            <p>              AQ_MU2025_Followers_IN spent THB 4,284.41 for only 1 landing page view, while the Claude rebuild produced 3,349 landing page views at THB 0.22 each.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination and Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy or a new lead/purchase test              </strong>            </div>            <p>              The two Broad Destination campaigns spent THB 1,536.94 combined and produced only 1 link click and 0 landing page views, while carrying very high CPMs of THB 96.06 and THB 81.58.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27 traffic allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers for awareness or Claude rebuild for traffic              </strong>            </div>            <p>              Aquaverse India | Instagram Followers | 2026-09-27 has cheap CPM at THB 5.85 and link clicks at THB 1.61, but only 42 landing page views from 3,662 link clicks, making it inefficient for site traffic.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower/like-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead or purchase campaign once tracking is verified              </strong>            </div>            <p>              The account objective is ticket sales and qualified leads, but current spend is concentrated in followers, likes, engagement, and traffic campaigns with no reported purchase or lead events.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Claude rebuild scale test            </h3>            <p>              <strong>Setup:</strong>              Duplicate India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy into a controlled scale test with incremental budget increases and the same destination.            </p>            <p>              <strong>Success metric:</strong>              Maintain efficient landing page view cost near current performance while increasing volume; current baseline is THB 0.22 per landing page view.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Landing page view versus link click optimization            </h3>            <p>              <strong>Setup:</strong>              Run the same best-performing creative and audience from the Claude rebuild with landing page view optimization against the current setup.            </p>            <p>              <strong>Success metric:</strong>              Higher landing page views and stronger landing-page-view-to-link-click rate than the account average of 30.3%.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Lead or ticket intent campaign            </h3>            <p>              <strong>Setup:</strong>              After confirming tracking, launch a dedicated lead or purchase campaign using the best Claude rebuild creative and a clear ticket/offer CTA.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads or purchases before making a decision, respecting the minimum_results_before_decision rule.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated messaging campaign with pre-qualifying copy, ticket/visit intent qu
