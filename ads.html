column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-27        →        2026-08-25      </span>      <span class=&quot;pill&quot;>        16 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 129,266.58</strong>        <small>          2026-07-27          to          2026-08-25        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>15,469,887</strong>        <small>          29,395,580 impressions          ·          1.90 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,519</strong>        <small>          0.53% CTR          ·          THB 0.83 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 43,088.86 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>34</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 4.40</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement volume is strong: 29,395,580 impressions, 15,469,887 reach, 3,023,457 page engagements, and 2,834,490 video views from THB 129,266.58. However, the account is not yet proving the business goal of profitable ticket sales or qualified leads: only 1 lead was reported, no purchases were reported, and only 137 landing page views were tracked from 1,519 inline link clicks. Engagement campaigns are absorbing most spend, while lead and purchase data is insufficient for conversion decisions.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix purchase, lead, and landing page tracking before scaling conversion spend            </h3>            <p>              <strong>Why:</strong>              The account spent THB 129,266.58 but reported only 1 lead, 0 purchases, and 137 landing page views from 1,519 inline link clicks. Lead volume is below the minimum_results_before_decision of 3, so CPL decisions are not reliable.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI events for ViewContent, Lead, InitiateCheckout, and Purchase; verify landing page view tracking on all destination URLs; confirm events are mapped to the correct ad account and domain.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on duplicate Broad Destination follower campaigns            </h3>            <p>              <strong>Why:</strong>              The Broad Destination cluster spent THB 63,494.65 and produced only 8 link clicks, 1 lead, and 13 messaging conversation starts. It also delivered page likes at a much higher cost than AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Do this:</strong>              Cut the combined Broad Destination allocation materially and consolidate into one clean campaign if follower growth is still required.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild ERROR QUARANTINED campaigns            </h3>            <p>              <strong>Why:</strong>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers spent THB 16,053.95 and reached 12,482,068 people, but produced only 3 link clicks, 1 messaging conversation start, 5 messaging blocks, and 5,989 post unlikes. ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily also has an ERROR QUARANTINED label and a very high CPM of THB 180.60.            </p>            <p>              <strong>Do this:</strong>              Create clean replacement campaigns with corrected setup, naming, objective, and destination; pause the quarantined versions only after replacements are live.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep New post engagement campaign and use it as the engagement/messaging benchmark            </h3>            <p>              <strong>Why:</strong>              New post engagement campaign spent only THB 5,461.89 but generated 772,033 page engagements, 1,057 link clicks, 14 messaging conversation starts, and 722,875 video views.            </p>            <p>              <strong>Do this:</strong>              Maintain this campaign and test its best-performing creative/audience in a dedicated messaging or lead objective campaign.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Carefully scale Claude traffic campaigns            </h3>            <p>              <strong>Why:</strong>              The three Claude campaigns together spent only THB 35.97 but generated 212 link clicks and 137 landing page views. Results are promising for traffic, but spend is too small to judge lead or purchase performance.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually and monitor landing page views, lead volume, and purchase tracking before making conversion decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best engagement and link-click efficiency in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,461.89 spend, 772,033 page engagements, 1,057 link clicks, 14 messaging conversation starts, 722,875 video views, CPM THB 2.20.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active. Use its winning creative/audience as the control for engagement and messaging tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower/page-like performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 31,083.68 spend, 29,275 page likes, 564,995 page engagements, 468,908 video views. Approximate cost per page like is THB 1.06.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if follower growth remains a priority, but monitor frequency because it is already 3.61, the highest major campaign frequency in the account.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19; Claude | IN | Corporates | 6 Languages | 2026-06-19; Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Promising traffic quality from a very small budget.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Combined THB 35.97 spend, 212 link clicks, 137 landing page views. Individual CTRs were 5.78%, 7.44%, and 9.47%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale as traffic tests, but do not judge lead or purchase performance yet because no leads or purchases were reported from these campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Cheap awareness reach, but poor downstream quality.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              23,858,980 impressions, 12,482,068 reach, CPM THB 0.67, and 1,331,596 page engagements from THB 16,053.95.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not scale the quarantined version. Rebuild it cleanly if the objective is low-cost awareness.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Duplicate Broad Destination campaigns are absorbing too much budget for weak traffic, messaging, and follower efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The Broad Destination cluster spent THB 63,494.65 and produced only 8 link clicks, 1 lead, and 13 messaging conversation starts. Approximate cost per page like was THB 9.38 versus THB 1.06 for AQ_MU2025_Followers_IN.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and consolidate duplicates into one rebuilt campaign with clearer objective separation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Poor link and messaging quality despite large reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,053.95 spend, 23,858,980 impressions, only 3 link clicks, 1 messaging conversation start, 5 messaging blocks, and 5,989 post unlikes.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild and replace. Keep only if awareness is the goal and negative engagement is acceptable.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families            </h3>            <p>              Follower and engagement costs are weaker than the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 7,867.50 spend, 2,418 page likes, 47,109 page engagements. Approximate cost per page like is THB 3.25 versus THB 1.06 for AQ_MU2025_Followers_IN.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild with stronger creative/audience segmentation before adding budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Higher follower cost than the best follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,067.55 spend, 225 page likes, 3,383 page engagements, CPM THB 76.81. Approximate cost per page like is THB 4.74.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce unless Thailand follower growth is a confirmed priority.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Setup issue and expensive delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,201.39 spend, CPM THB 180.60, 1,847 page likes, 8,378 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild cleanly and verify market targeting before continuing spend.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination duplicate cluster              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign and Claude traffic campaigns              </strong>            </div>            <p>              Broad Destination spent THB 63,494.65 for only 8 link clicks, 1 lead, and 13 messaging starts, while New post engagement produced 1,057 link clicks and 14 messaging starts from THB 5,461.89, and Claude campaigns produced 137 landing page views from THB 35.97.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Clean rebuilt awareness campaign or traffic campaign              </strong>            </div>            <p>              The campaign has cheap CPM at THB 0.67 but only 3 link clicks and 1 messaging start from THB 16,053.95, plus the ERROR QUARANTINED label indicates setup risk.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN if follower growth remains a priority              </strong>            </div>            <p>              AQ_MU2025_Followers_IN delivered page likes at approximately THB 1.06 each, while Families delivered page likes at approximately THB 3.25 each.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Follower/likes-only budget allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead, messaging, and purchase-tracking tests              </strong>            </div>            <p>              The business goal is ticket sales and qualified leads, but the account has only 1 tracked lead and 0 purchases. Current spend is heavily weighted toward engagement and followers.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Claude traffic scale test            </h3>            <p>              <strong>Setup:</strong>              Run the three Claude campaigns with controlled budget increases and keep traffic objective consistent. Track link clicks, landing page views, leads, and purchases separately.            </p>            <p>              <strong>Success metric:</strong>              Do not judge leads or purchases until at least 3 results are recorded. For traffic, compare landing page view rate and cost per landing page view against the current combined result of 137 landing page views from THB 35.97.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Messaging objective test from New post engagement learnings            </h3>            <p>              <strong>Setup:</strong>
