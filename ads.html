space-between;    align-items: center;  }  .action-number {    display: flex;    align-items: center;    justify-content: center;    width: 28px;    height: 28px;    border-radius: 50%;    background: #eef3ff;    color: #284db7;    font-weight: 800;    font-size: 12px;  }  .priority-badge {    padding: 5px 8px;    border-radius: 999px;    background: #edf1f7;    color: #5f6d84;    font-size: 10px;    font-weight: 700;    text-transform: uppercase;  }  .priority-high {    border-top: 4px solid #dc2626;  }  .priority-medium {    border-top: 4px solid #f59e0b;  }  .priority-low {    border-top: 4px solid #16a34a;  }  .finding-grid {    display: grid;    grid-template-columns: repeat(2, minmax(0, 1fr));    gap: 14px;  }  .finding {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .finding.positive {    border-left: 5px solid #16a34a;  }  .finding.negative {    border-left: 5px solid #dc2626;  }  .finding h3 {    margin: 0 0 8px;    font-size: 16px;  }  .finding p {    margin: 0 0 10px;    color: #526077;  }  .evidence,  .recommendation {    font-size: 13px;    margin-top: 7px;    color: #445168;  }  .budget-row {    display: grid;    grid-template-columns: 1fr 40px 1fr;    gap: 12px;    align-items: center;    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-08        →        2026-08-06      </span>      <span class=&quot;pill&quot;>        84 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 920,277.58</strong>        <small>          2026-07-08          to          2026-08-06        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>56,009,148</strong>        <small>          123,984,146 impressions          ·          2.21 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>2,907,551</strong>        <small>          2.85% CTR          ·          THB 0.26 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>195</strong>        <small>          THB 4,719.37 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>1</strong>        <small>          THB 920,277.58 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1,554</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.42</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large upper-funnel volume during 2026-07-08 to 2026-08-06: THB 920,277.58 spend, 123,984,146 impressions, 2,907,551 link clicks, and 1,189,671 landing page views. However, lower-funnel output is weak versus the business goal: 65 leads and only 1 purchase, with no CPL, CPA, or ROAS targets supplied. The account has clear winners for leads and messaging, but too much budget is concentrated in traffic, awareness, and follower/engagement campaigns that are not producing qualified leads or purchases.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reallocate budget toward proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              Only a few campaigns produced meaningful lead volume. Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot; generated 12 leads from THB 1,054.68, Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13 generated 20 leads from THB 2,733.88, and Claude | IN | English | India Show 2025 | Traffic | 2026-06-13 generated 15 leads from THB 2,756.75.            </p>            <p>              <strong>Do this:</strong>              Increase budgets cautiously on these three campaigns or duplicate their best ads into dedicated Leads or Messaging campaigns. Scale in small steps and monitor lead quality, messaging depth, and cost per lead.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce high-spend traffic campaigns with no lead output            </h3>            <p>              <strong>Why:</strong>              Large traffic campaigns absorbed major spend without reported leads or purchases, including Claude | IN | Corporates | 6 Languages | 2026-06-19 with THB 158,297.69 spend, 492,111 link clicks, 176,378 landing page views, and 0 leads.            </p>            <p>              <strong>Do this:</strong>              Reduce budgets on high-spend persona traffic campaigns that have 0 leads and rebuild them with clearer lead or message CTAs, lead forms, and retargeting paths.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking before making purchase-based decisions            </h3>            <p>              <strong>Why:</strong>              Only 1 purchase was reported account-wide, below the minimum_results_before_decision of 3, and daily data shows actions reported on 2026-07-17 to 2026-07-22 despite 0 impressions, 0 clicks, and 0 spend.            </p>            <p>              <strong>Do this:</strong>              Do not scale or pause campaigns based on purchase performance yet. Verify Pixel/CAPI, attribution windows, purchase event setup, and delayed attribution behavior.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Stop expanding duplicated Follows Likes campaigns until budget role is clarified            </h3>            <p>              <strong>Why:</strong>              Many Aquaverse India Daily Follows Likes campaigns generated page likes and engagement but very few link clicks, leads, or purchases. This supports awareness/follower growth, not the stated goal of profitable ticket sales and qualified leads.            </p>            <p>              <strong>Do this:</strong>              Hold new follower/likes launches and cap existing budgets unless follower growth is an explicit secondary KPI. Redirect freed budget to lead, messaging, and retargeting campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best observed lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,054.68 spend, 12 leads, 208 messaging conversations started, 202 first replies, 315 total messaging connections, 1,460 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Duplicate the post into a structured Leads or Messaging campaign and test similar creative formats.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging volume from a traffic campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,733.88 spend, 20 leads, 502 messaging conversations started, 483 first replies, 537 total messaging connections, 20,916 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Use Malayalam audience/creative as a control for new lead-form and messaging tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Consistent lead and messaging performance above the minimum decision threshold.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,756.75 spend, 15 leads, 342 messaging conversations started, 336 first replies, 385 total messaging connections, 20,034 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep. Test this creative and audience with a lead objective and a click-to-message objective.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Very efficient awareness and traffic generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 12,969.21 spend, 6,195,527 impressions, 453,327 link clicks, 227,484 landing page views, 7.45% CTR, THB 0.028 CPC.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an upper-funnel traffic source, but connect it to retargeting because it did not generate reported leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient traffic and landing page view campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 6,968.12 spend, 248,882 link clicks, 124,465 landing page views, 7.70% CTR, THB 0.027 CPC.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for traffic. Build retargeting audiences from landing page viewers and test lead/message conversion follow-up.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              High spend without reported lower-funnel output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 158,297.69 spend, 14,250,018 impressions, 492,111 link clicks, 176,378 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild. Keep only if corporate awareness is a separate KPI; otherwise move budget to lead and messaging winners.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Large traffic volume but no reported leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 45,133.98 spend, 124,233 link clicks, 60,916 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and test family-focused lead forms or message CTAs before scaling again.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              Traffic campaign is not converting into leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 42,699.69 spend, 151,551 link clicks, 64,843 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild with stronger offer, ticket intent messaging, and retargeting.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19            </h3>            <p>              High click and landing page volume but no reported leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 42,465.51 spend, 206,362 link clicks, 92,867 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale as-is. Test the audience with the proven Post: &amp;quot;💦 Start your day...&amp;quot; style messaging or lead objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Engagement is high, but lead efficiency is weak versus the best lead/messaging campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 11,617.86 spend, 1,564,894 post engagements, 2,358 link clicks, 3 leads, and 36 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Keep only a small engagement budget if social proof is needed; otherwise shift spend to stronger lead generators.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Strong reach/visibility but not aligned to leads or ticket sales.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,585.10 spend, 24,883,126 impressions, 13,698,488 reach, 2 link clicks, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce if the priority is qualified leads and ticket sales. Keep only as a low-budget awareness layer.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families            </h3>            <p>              Follower/engagement delivery did not translate into meaningful lower-funnel action.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 18,498.20 spend, 3,720 likes, 8 link clicks, 2 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause solely on leads because this appears to be a follower/likes campaign, but reduce if lead generation is the primary budget objective.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot; and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13              </strong>            </div>            <p>              Corporates spent THB 158,297.69 with 0 leads, while the proposed recipients generated 12 and 20 leads respectively on much smaller spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Families | 6 Languages | 2026-06-19, Claude | IN | Singles | 6 Languages | 2026-06-19, and Claude | IN | Couples | 6 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | IN | English | India Show 2025 | Traffic | 2026-06-13 and new lead/message tests              </strong>            </div>            <p>              These three campaigns spent THB 130,299.18 combined with 0 leads, while English India Show produced 15 leads and 342 conversations started.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Page Follow Visibility and duplicated Aquaverse India Daily Follows Likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaigns built from landing page viewers, video viewers, and messaging engagers              </strong>            </div>            <p>              Follower campaigns are producing page likes and engagement but very limited link clicks and leads; retargeting the large engaged audience is more aligned with qualified leads and ticket sales.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                High-CPM Broad Destination Follows Likes campaigns launched around 2026-08-02              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                IN_AWR_General_Image_Claude_2026-06-14 and Claude | IN | Daily 8 IMAGES MultiLang | 15Jun              </strong>            </div>            <p>              The August Broad Destination campaigns show CPMs around THB 50+ with near-zero inline link clicks, while the image traffic campaigns produced large landing page volume at very low CPCs.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead objective test using proven messaging creative            </h3>            <p>              <strong>Setup:</strong>              Duplicate Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot; into a Leads campaign and a Messaging campaign. Use the same creative, same offer, and separate ad sets for Malayalam, English India Show, and broad retargeting.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads per ad set before judging; compare cost per lead, messaging first replies, and messaging depth.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Retarget landing page viewers from top traffic campaigns            </h3>            <p>              <strong>Setup:</strong>              Create retargeting audiences from landing page viewers generated by IN_AWR_General_Image_Claude_2026-06-14 and Claude | IN | Daily 8 IMAGES MultiLang | 15Jun. Exclude existing leads where possible.            </p>            <p>              <strong>Success metric:</strong>              Leads, messaging conversations started, and purchase events once each reaches at least 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Traffic quality test: landing page view optimization versus link click optimization            </h3>            <p>              <strong>Setup:</strong>              Run a controlled test using the best image creatives. One ad set optimizes for link clicks and one for landing page views, with equal budgets.            </p>            <p>              <strong>Success metric:</strong>              Landing page view rate, cost per landing page view, and downstream leads after at least 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Rebuild persona campaigns with conversion intent            </h3>            <p>
