;>        2026-08-20        →        2026-09-18      </span>      <span class=&quot;pill&quot;>        16 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 37,088.39</strong>        <small>          2026-08-20          to          2026-09-18        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,345,805</strong>        <small>          2,686,643 impressions          ·          2.00 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>99</strong>        <small>          2.35% CTR          ·          THB 0.59 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 13.80</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account generated large awareness and engagement volume: 2,686,643 impressions, 1,345,805 reach, 508,505 post engagements, 24,268 page likes, and 465,654 video views from THB 37,088.39 spend. However, the business goal is ticket sales and qualified leads, and the data shows 0 purchases, 0 leads, only 99 inline link clicks, and 1 messaging conversation. Performance is therefore strong for followers/engagement but not yet measurable against sales or lead quality.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward lead and ticket-sale objectives            </h3>            <p>              <strong>Why:</strong>              Nearly all spend is going to follower, likes, visibility, and engagement campaigns, while the account recorded 0 leads and 0 purchases.            </p>            <p>              <strong>Do this:</strong>              Create dedicated lead and purchase campaigns before increasing total spend. Keep follower/engagement campaigns as support only.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce duplicate Broad Destination follower campaigns            </h3>            <p>              <strong>Why:</strong>              Multiple campaigns with the same or similar names are spending on page likes and engagement but not producing meaningful traffic, leads, or purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce spend from the duplicated &amp;#039;ERROR QUARANTINED | Aquaverse India Daily Follows Likes&amp;#039; Broad Destination campaigns and consolidate into fewer clean campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN but do not aggressively scale            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN is the strongest follower/engagement campaign, but it already takes THB 24,525.68, 66% of total spend, and has frequency 4.66.            </p>            <p>              <strong>Do this:</strong>              Keep active for follower growth, cap or scale carefully, and move incremental budget to lead/purchase testing.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix measurement before judging profitability            </h3>            <p>              <strong>Why:</strong>              Targets for cost per lead, cost per purchase, and ROAS are unknown, and no lead or purchase events are reported.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI events for Lead, InitiateCheckout, Purchase, and ticket-sale value tracking before making profitability decisions.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Audit reporting anomalies            </h3>            <p>              <strong>Why:</strong>              &amp;#039;New post engagement campaign&amp;#039; shows 1 messaging_welcome_message_view with 0 impressions, 0 reach, 0 clicks, and THB 0 spend.            </p>            <p>              <strong>Do this:</strong>              Check attribution windows, campaign status, and event mapping for this campaign before using the result in reporting.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best campaign for follower and engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 24,525.68 spend produced 22,075 page likes, 394,760 post engagements, 416,835 page engagements, 355,476 video views, CTR 3.61%, and 98 of the account&amp;#039;s 99 inline link clicks. Cost per page like was approximately THB 1.11.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active as the main follower/engagement campaign, but avoid aggressive scaling because frequency is already 4.66 and it is not producing tracked leads or purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient awareness and video distribution.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 686.11 spend delivered 968,307 impressions, 940,216 reach, frequency 1.03, CPM THB 0.71, 53,454 post engagements, and 52,765 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is low-cost reach/video visibility. Do not judge this campaign by traffic or leads because it produced 0 inline link clicks, 0 leads, and 0 purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Generated page likes from a small but valid result base.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 433.98 spend produced 229 page likes, 703 page engagements, CTR 14.39%, and cost per page like of approximately THB 1.90.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep at a small test budget only. Do not scale heavily yet because reach was only 1,262 and impressions were only 1,459.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Weak follower efficiency versus AQ_MU2025_Followers_IN and no meaningful traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,304.20 spend produced 762 page likes at approximately THB 5.65 per page like, 0 inline link clicks, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild with cleaner targeting/creative if follower growth remains a priority.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Duplicate campaigns are fragmenting spend and producing expensive page likes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Three campaigns with this exact name spent THB 1,487.24, THB 1,022.51, and THB 2,430.56. They produced 208, 200, and 354 page likes respectively, at approximately THB 7.15, THB 5.11, and THB 6.87 per page like. Combined inline link clicks were only 1.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild these into one clean campaign. Do not scale the duplicated structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Multiple duplicate campaigns are spending without traffic, lead, or purchase output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Five campaigns with this exact name spent a combined THB 2,173.60 and produced 430 page likes, 12,840 page engagements, 11,882 video views, 0 inline link clicks, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate and reduce. Keep only the best-performing variant if follower campaigns are still required.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient delivery to make a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Four campaigns with this exact name spent only THB 7.06, THB 4.26, THB 6.55, and THB 6.64, with very small impression volume of 58, 34, 29, and 57.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on performance. Diagnose why delivery is so low and consolidate if these are unintended duplicates.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              No delivery data but one messaging action appears.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              0 impressions, 0 reach, 0 clicks, THB 0 spend, but 1 messaging_welcome_message_view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make a performance decision. Audit attribution and event reporting.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN or new lead/purchase campaigns              </strong>            </div>            <p>              The Broad Destination campaign cost approximately THB 5.65 per page like versus approximately THB 1.11 for AQ_MU2025_Followers_IN, and it produced 0 inline link clicks.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination duplicate campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                One consolidated clean follower test plus lead/purchase campaigns              </strong>            </div>            <p>              The duplicate campaigns spent THB 4,940.31 combined with only 1 inline link click and page-like costs between approximately THB 5.11 and THB 7.15.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination duplicate campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Higher-performing follower campaign or conversion-focused testing              </strong>            </div>            <p>              The five duplicate campaigns spent THB 2,173.60 with 0 inline link clicks, 0 leads, and 0 purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower/engagement-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead generation and ticket-sale campaigns              </strong>            </div>            <p>              The account spent THB 37,088.39 but reported 0 leads and 0 purchases, so the media mix is not aligned with the stated business goal.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Awareness budget only              </strong>            </div>            <p>              This campaign is efficient for reach and video views but generated 0 inline link clicks, so it should not receive traffic or conversion budget.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead generation campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a Meta lead form or Messenger lead campaign targeting recent page engagers, video viewers, commenters, and followers generated by the current engagement campaigns.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 leads. Compare cost per lead and lead quality between form and Messenger routes.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket sales conversion campaign            </h3>            <p>              <strong>Setup:</strong>              After Purchase and value tracking are verified, launch a purchase-optimized campaign for ticket sales using retargeting audiences from page engagements, video views, and website visitors if available.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 purchases. Compare cost per purchase and ROAS once purchase value is tracked.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Follower campaign consolidation test            </h3>            <p>              <strong>Setup:</strong>              Run AQ_MU2025_Followers_IN against one rebuilt Broad Destination campaign with clean naming, no duplicate ad sets, and the same budget split.            </p>            <p>              <strong>Success metric:</strong>              Cost per page like, page engagement volume, and frequency after each variant reaches at least 3 page likes.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Traffic intent test            </h3>            <p>              <strong>Setup:</strong>              Create a traffic campaign optimized for landing page views or link clicks using ticket-focused creatives and clear calls to action, separate from follower campaigns.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks and landing page views. Current account baseline is 99 inline link clicks from THB 37,088.39 spend.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Retargeting creative test            </h3>            <p>              <strong>Setup:</strong>              Serve offer-led ticket creatives to audiences who engaged with posts, saved posts, commented, or watched videos during the period.            </p>            <p>              <strong>Success metric:</strong>              Lead or purchase volume after minimum 3 results, plus cost per result by creative.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No lead or purchase actions are reported, despite the business goal being profitable ticket sales and qualified leads.</li><li>Targets for cost per lead, cost per purchase, and ROAS are all 0, meaning they are unknown and cannot be used for performance judgment.</li><li>The account shows 63,101 clicks but only 99 inline link clicks, indicating most clicks are likely engagement clicks rather than website traffic.</li><li>&amp;#039;New post engagement campaign&amp;#039; shows 1 messaging_welcome_message_view despite 0 impressions, 0 reach, 0
