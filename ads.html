ommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-30        →        2026-08-28      </span>      <span class=&quot;pill&quot;>        18 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 139,505.32</strong>        <small>          2026-07-30          to          2026-08-28        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>15,491,656</strong>        <small>          29,706,820 impressions          ·          1.92 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,318</strong>        <small>          0.56% CTR          ·          THB 0.84 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 46,501.77 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>35</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 4.70</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated very large reach and engagement from 139,505.32 THB spend, but it is not yet proving the business goal of profitable ticket sales and qualified leads. Across 29,706,820 impressions and 15,491,656 reach, only 1 lead was reported and no purchase or ROAS data was supplied. Engagement and follower campaigns are working, but too much budget is going into duplicated Broad Destination and quarantined campaigns that are not driving meaningful link clicks, leads, or purchases.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from expensive Broad Destination follower campaigns            </h3>            <p>              <strong>Why:</strong>              The largest spend campaign, Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, spent 44,087.75 THB, produced only 1 lead, 6 inline link clicks, and 3,698 likes. Lead volume is below the minimum decision threshold of 3, but engagement efficiency is weaker than better campaigns.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign materially and consolidate the duplicate Broad Destination campaigns into fewer active campaigns with the best creatives/audiences before adding more spend.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Create dedicated lead and purchase campaigns            </h3>            <p>              <strong>Why:</strong>              Most current spend is in follows, likes, visibility, and post engagement campaigns. Account goal is ticket sales and qualified leads, but only 1 lead and no purchases were reported.            </p>            <p>              <strong>Do this:</strong>              Launch separate Lead objective and Sales/Purchase objective campaigns instead of relying on engagement/follower campaigns to produce sales outcomes.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep and carefully scale New post engagement campaign            </h3>            <p>              <strong>Why:</strong>              New post engagement campaign is the most efficient engagement and traffic campaign: 5,461.89 THB spend, 772,033 page engagements, 1,057 inline link clicks, 2.20 THB CPM, and 1.32 frequency.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually while monitoring whether inline link clicks and messaging actions hold, not just post engagement volume.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN but refresh creative            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN produced 31,369 likes from 33,566.04 THB, about 1.07 THB per like, but frequency is already 3.80.            </p>            <p>              <strong>Do this:</strong>              Keep active for follower growth, but rotate new creatives/audiences before scaling further to avoid fatigue.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Review tracking before judging sales performance            </h3>            <p>              <strong>Why:</strong>              No purchase events or ROAS were supplied, and only 1 lead was reported across multiple lead-related action labels.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI events, lead event deduplication, purchase tracking, and ticket checkout attribution before making sales efficiency decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Strongest campaign for low-cost engagement and link click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              5,461.89 THB spend generated 772,033 page engagements, 722,875 video views, 1,057 inline link clicks, 14 messaging conversations started, CPM 2.20 THB, frequency 1.32.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use it for engagement/remarketing audience building, and test its best post creative in traffic, lead, and purchase campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best follower/like generator at scale.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              33,566.04 THB spend generated 31,369 likes, 606,967 page engagements, 505,202 video views, CTR 4.89%, about 1.07 THB per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for follower growth. Scale carefully only with fresh creative because frequency is 3.80.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient awareness delivery, but not traffic or lead delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              16,053.95 THB spend produced 23,858,980 impressions, 12,482,068 reach, CPM 0.67 THB, and 1,331,596 post engagements, but only 3 inline link clicks and 1 messaging conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is low-cost reach/awareness. Do not use this as a traffic, lead, or purchase driver.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination - campaign_id 120250948421480402            </h3>            <p>              Best of the Broad Destination duplicates for page likes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              5,077.63 THB spend generated 1,290 likes, about 3.94 THB per like, 19,647 page engagements, and 123 comments.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              If Broad Destination must remain active, prioritize this version over the less efficient duplicate Broad Destination campaigns.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination - campaign_id 120250948392580402            </h3>            <p>              Highest-spend campaign is inefficient for traffic and weak for follower growth versus better options.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              44,087.75 THB spend, 6 inline link clicks, 3,698 likes, 210,987 page engagements, 10 messaging conversations started, and only 1 lead. Cost per like is about 11.92 THB versus AQ_MU2025_Followers_IN at about 1.07 THB per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild. Do not judge lead performance yet because only 1 lead is below the minimum_results_before_decision of 3, but stop relying on this structure for efficient traffic or follower growth.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination - campaign_id 120250948394960402            </h3>            <p>              Duplicate Broad Destination campaign has weak traffic output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,699.03 THB spend generated 1 inline link click, 505 likes, 21,925 page engagements, and 1 messaging conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or fold into the best-performing Broad Destination setup instead of running as a separate duplicate.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination - campaign_id 120250948398070402            </h3>            <p>              Duplicate Broad Destination campaign is not generating link clicks or messages.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              5,817.30 THB spend, 0 inline link clicks, 661 likes, 26,767 page engagements, and no reported messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and consolidate into a cleaner test structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              High delivery cost and no link click output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,201.39 THB spend, 23,263 impressions, CPM 180.60 THB, 0 inline link clicks, 1,847 likes, and 8,378 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. If Thailand is required, test a clean non-quarantined version with controlled budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Small but less efficient than the best follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,067.55 THB spend generated 225 likes, about 4.74 THB per like, 3,383 page engagements, CPM 76.81 THB, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale unless Thailand is a priority market. Rebuild creative/audience before increasing spend.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Too little data to evaluate.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The three 2026-08-28 Broad Destination campaigns spent only 0.43 THB, 0.28 THB, and 2.06 THB respectively, with 11, 3, and 12 impressions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause or judge performance yet. Let them reach meaningful spend and at least 3 relevant results before making a decision.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination - campaign_id 120250948392580402              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign and a new dedicated Lead/Sales campaign              </strong>            </div>            <p>              This campaign uses the largest budget at 44,087.75 THB but produced only 6 inline link clicks and 1 lead. New post engagement campaign produced 1,057 inline link clicks from only 5,461.89 THB.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate Broad Destination campaigns with weaker efficiency              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN and campaign_id 120250948421480402 if follower growth remains a priority              </strong>            </div>            <p>              AQ_MU2025_Followers_IN generated likes at about 1.07 THB per like, while several Broad Destination duplicates ranged from about 3.94 THB to 11.92 THB per like.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Clean Thailand test campaign or India lead/sales testing              </strong>            </div>            <p>              The quarantined Thailand campaign had CPM 180.60 THB and 0 inline link clicks. Rebuild before continuing spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting or conversion-focused campaigns after awareness audiences are built              </strong>            </div>            <p>              This campaign is strong for low-cost awareness, but with only 3 inline link clicks from 16,053.95 THB it should not absorb budget needed for leads or ticket sales.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead objective test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated Lead campaign using the best engagement creatives from New post engagement campaign and AQ_MU2025_Followers_IN. Split test instant forms versus website lead if both are available.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads before decision, then compare cost per lead and lead quality. No CPL target is supplied, so judge relative to other lead tests.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Purchase/ticket sales campaign            </h3>            <p>              <strong>Setup:</strong>              Launch a Sales/Purchase campaign optimized to the ticket purchase event once tracking is confirmed. Use warm audiences from video views, page engagements, and link clickers.            </p>            <p>              <strong>Success metric:</strong>              Purchase volume, cost per purchase, and ROAS once purchase tracking is present. No CPA or ROAS target is supplied, so do not compare to a fixed target.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engagement creative migration test            </h3>            <p>              <strong>Setup:</strong>              Take the highest-engagement posts from New post engagement campaign and test them in a traffic or lead campaign against new direct-response ticket/lead creatives.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, leads, and purchases rather than total clicks or post engagements.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Broad Destination consolidation test            </h3>            <p>              <strong>Setup:</strong>              Pause expansion of duplicate Broad Destination setups and run one clean consolidated campaign using the best-performing Broad Destination variant, especially campaign_id 120250948421480402, against AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Success metric:</strong>              Cost per like/page engagement for follower campaigns and downstream lead/purchase activity from retargeting audiences.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Messaging campaign test            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated messaging campaign with clear ticket inquiry or lead qualification prompts instead of relying on post engagement campaigns.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started and qualified replies. Use at least 3 conversations before deciding.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events, purchase value, or ROAS were supplied, so ticket sales profitability cannot be evaluated.</li><li>Only 1 lead was reported across the account, which is below the minimum_results_before_decision of 3. Lead performance is insufficient for a firm decision.</li><li>The same lead appears across multiple action labels including onsite_conversion.lead, onsite_web_lead, lead, lead_grouped, and offsite lead-related events. Review event mapping and deduplication.</li><li>There is a large gap between total clicks and inline link clicks: 166,374 clicks versus 1,318 inline link clicks. Many campaigns are driving engagement/profile clicks rather than website traffic.</li><li>Several active campaigns contain &amp;#039;ERROR QUARANTINED&amp;#039; in the campaign name. Rebuild clean versions before relying on them for stable optimization.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep the efficient engagement and follower winners, especially New post engagement campaign and AQ_MU2025_Followers_IN, but stop treating engagement/follow campaigns as proof of ticket sales performance. Reduce the high-spend Broad Destination duplicates, rebuild quarantined campaigns cleanly, and reallocate budget into properly tracked Lead and Purchase campaigns. Do not make hard lead-performance decisions until each lead or sales campaign reaches at least 3 results.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout campaigns    </h2>    <div class=&quot;
