timize traffic campaigns to landing page views instead of link clicks where possible.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the only purchase-proven campaign            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; has enough results for a purchase decision: 4 purchases, 7 leads, 37 messaging conversations started, 1,881.62 THB spend, 2,176 THB purchase value, 470.41 THB cost per purchase, and 268.80 THB cost per lead.            </p>            <p>              <strong>Do this:</strong>              Keep active and increase budget gradually by 20% every 2-3 days while monitoring purchases, leads, messaging starts, and purchase value. Duplicate the post into a structured sales/messages test rather than relying only on boosted-post delivery.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on follower campaigns that are not producing follower results            </h3>            <p>              <strong>Why:</strong>              FB Follow | Thailand | Aquaverse Lifestyle spent 49,745.52 THB for only 3 likes. FB Follow | Thailand | Lookalike Fans Scale spent 34,725.55 THB for only 10 likes and only 27 link clicks.            </p>            <p>              <strong>Do this:</strong>              Reduce or stop scaling both FB Follow campaigns. Rebuild follower acquisition with new creative and audience structure, or reallocate budget to ticket sales, qualified traffic, and retargeting.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild corporate lead generation instead of pushing current lead campaigns            </h3>            <p>              <strong>Why:</strong>              Aquaverse Corporate Groups - Leads - Test spent 11,305.31 THB with 0 leads and only 69 LPVs. TH | B2B Corporate | Video | Leads | 2026-06-18 spent 11,555.78 THB with 0 leads, 6,553 link clicks, 322 LPVs, and high frequency of 4.83.            </p>            <p>              <strong>Do this:</strong>              Do not scale current corporate lead campaigns. Rebuild using native Meta lead forms, clearer corporate offer, qualification questions, and separate remarketing to website/message engagers.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Shift traffic budget toward campaigns with stronger landing page view quality            </h3>            <p>              <strong>Why:</strong>              Claude | TH | Corporates | Thai | 2026-06-19 generated 3,202 LPVs from 5,443 link clicks at 1.25 THB per LPV. Claude | TH | Conversions Shopee | 12Jun generated 3,860 LPVs at 1.31 THB per LPV. TH | Traffic | Families [Claude build] generated 9,071 LPVs at 2.08 THB per LPV.            </p>            <p>              <strong>Do this:</strong>              Move budget away from campaigns with poor LPV pass-through and into the strongest LPV campaigns while using UTMs and downstream lead/purchase tracking to verify quality.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best purchase, lead, and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,881.62 THB spend, 7 leads, 4 purchases, 2,176 THB purchase value, 37 messaging conversations started, 268.80 THB cost per lead, 470.41 THB cost per purchase.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Build similar ticket-offer creatives and retarget message engagers and post engagers.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Corporates | Thai | 2026-06-19            </h3>            <p>              Strongest qualified traffic signal among corporate/traffic campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,011.79 THB spend, 5,443 link clicks, 3,202 LPVs, 58.8% link-click-to-LPV rate, 1.25 THB cost per LPV.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and test it as a lead-form or conversion campaign for corporate inquiries.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Conversions Sho         2026-08-03      </span>      <span class=&quot;pill&quot;>        83 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,131,863.67</strong>        <small>          2026-07-05          to          2026-08-03        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>63,626,730</strong>        <small>          149,900,979 impressions          ·          2.36 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>3,831,492</strong>        <small>          3.05% CTR          ·          THB 0.25 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>231</strong>        <small>          THB 4,899.84 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 565,931.84 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1,972</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.55</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent THB 1,131,863.67 and generated 149,900,979 impressions, 3,831,492 link clicks, 1,260,291 landing page views, 77 leads, 1,972 messaging conversations started, and 2 purchases. Account performance is mixed: traffic and engagement volume are strong, but qualified lead and purchase volume is concentrated in a small number of campaigns. Purchases are below the minimum_results_before_decision of 3, so purchase performance should not be judged yet.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              Most leads and qualified conversations are concentrated in a few campaigns with much lower cost per lead and cost per conversation than the account overall.            </p>            <p>              <strong>Do this:</strong>              Carefully scale Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13 by 20-30% at a time while monitoring lead volume and messaging depth.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce high-spend traffic campaigns with weak downstream results            </h3>            <p>              <strong>Why:</strong>              Several large traffic campaigns generated many clicks and landing page views but almost no leads, purchases, or messaging conversations.            </p>            <p>              <strong>Do this:</strong>              Reduce spend on Claude | IN | Corporates | 6 Languages | 2026-06-19, Claude | IN | Corporates | 5 Languages | 2026-06-19, Claude | IN | Families | 6 Languages | 2026-06-19, and Claude | IN | Singles | 6 Languages | 2026-06-19; rebuild them using the winning lead/messaging creatives and objectives.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Consolidate follower and likes campaigns            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN produced page likes much more efficiently than most Daily Follows Likes campaigns.            </p>            <p>              <strong>Do this:</strong>              Keep AQ_MU2025_Followers_IN for follower growth and reduce duplicated Aquaverse India Daily Follows Likes campaigns that are producing higher cost per like or minimal link activity.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix attribution and reporting inconsistencies before purchase scaling            </h3>            <p>              <strong>Why:</strong>              Daily reporting shows actions on 2026-07-17 to 2026-07-22 with zero impressions, zero clicks, and zero spend, and total purchases are only 2.            </p>            <p>              <strong>Do this:</strong>              Audit pixel/CAPI, event deduplication, attribution windows, and daily reporting before making purchase-budget decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best combined lead, messaging, and early purchase signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,656.41 spend, 15 leads, 284 messaging conversations started, 425 total messaging connections, 216 messaging replies, and 1 purchase. Cost per lead was THB 110.43 and cost per messaging conversation started was THB 5.83.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this post/creative as the primary template for new lead and messaging campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging performance from modest spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,465.32 spend, 20 leads, 478 messaging conversations started, 531 total messaging connections, 413 messaging replies, 26,187 link clicks, and 242 landing page views. Cost per lead was THB 173.27.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Reuse the creative and message angle in a dedicated lead or messaging objective test.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              High lead volume and strongest messaging volume among language campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,440.00 spend, 21 leads, 578 messaging conversations started, 619 total messaging connections, and 307 messaging replies. Cost per lead was THB 163.81 and cost per conversation started was THB 5.95.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Prioritize Malayalam creative and audience learnings in new lead/messaging builds.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13            </h3>            <p>              Meets the minimum result threshold for leads and has efficient traffic volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,243.93 spend, 3 leads, 73 messaging conversations started, 33,472 link clicks, CTR 2.31%, CPC THB 0.0648. Cost per lead was THB 747.98.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a secondary test, but do not scale faster than the English India Show or Malayalam campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Strong traffic and awareness efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 17,816.21 spend, 8,619,215 impressions, 626,463 link clicks, 235,819 landing page views, CTR 7.40%, CPC THB 0.0279, CPM THB 2.07.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for traffic/awareness. Test this image approach with a lead or messaging objective instead of only traffic.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient traffic campaign with high CTR and low CPC.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 9,588.93 spend, 343,352 link clicks, 129,330 landing page views, CTR 7.67%, CPC THB 0.0274, CPM THB 2.10.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for low-cost traffic. Use top images in conversion-oriented lead/messaging campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best follower-growth performer among supplied follower/likes campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 30,037.77 spend, 22,415 page likes, 61,417 post reactions, 4,622 comments, 574,817 page engagements. Cost per page like was THB 1.34.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if follower growth is a strategic objective. Do not judge this campaign by purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient awareness reach, but not a traffic or lead driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 17,019.21 spend, 25,173,274 impressions, 13,439,079 reach, frequency 1.87, CPM THB 0.676, but only 1 link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only for reach/visibility. Do not allocate performance lead or ticket-sales budget here.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Largest spend with weak downstream performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 197,447.74 spend, 620,879 link clicks, 184,985 landing page views, 8,266,119 video views, but only 5 messaging conversations started and 0 leads or purchases. Cost per landing page view was THB 1.07.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce heavily and rebuild with lead or messaging objective before adding more budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with limited qualified action.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 93,497.40 spend, 297,862 link clicks, 97,760 landing page views, but only 1 messaging conversation started and 0 leads or purchases. Cost per landing page view was THB 0.96.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and test corporate messaging with a clearer lead form or direct message CTA.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Traffic volume did not translate into leads or conversations.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 56,682.47 spend, 160,100 link clicks, 63,056 landing page views, only 1 messaging conversation started, 0 leads, and 0 purchases. Cost per landing page view was THB 0.90.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild using family-focused creative from campaigns that generated leads.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              Significant spend without lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 53,924.34 spend, 193,713 link clicks, 67,821 landing page views, 2 messaging conversations started, 0 leads, and 0 purchases. Cost per landing page view was THB 0.80.
