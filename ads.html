   .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-07        →        2026-09-05      </span>      <span class=&quot;pill&quot;>        22 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 94,632.65</strong>        <small>          2026-08-07          to          2026-09-05        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>8,906,762</strong>        <small>          15,203,052 impressions          ·          1.71 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>627</strong>        <small>          0.78% CTR          ·          THB 0.80 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 31,544.22 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>14</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 6.22</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account delivered very large awareness and engagement volume, but it is not currently structured to prove profitable ticket sales or qualified lead performance. Spend was THB 94,632.65 for 15,203,052 impressions, 8,906,762 reach, 1,725,825 page engagements, 1,598,311 video views, 627 inline link clicks, 14 messaging conversations started, 1 tracked lead, and 0 tracked purchases. Awareness/engagement is working; traffic, leads, messaging efficiency, and purchase attribution are weak or insufficient.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild budget around lead and ticket-sale objectives            </h3>            <p>              <strong>Why:</strong>              The business goal is ticket sales and qualified leads, but the account generated only 1 lead and 0 purchases from THB 94,632.65 spend. Lead volume is below the minimum_results_before_decision of 3, so CPL cannot be judged reliably.            </p>            <p>              <strong>Do this:</strong>              Launch dedicated lead and purchase/test campaigns instead of relying on follows/likes/post engagement campaigns. Keep awareness campaigns capped while new conversion-focused campaigns collect at least 3 leads or purchases before decisions.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on inefficient Broad Destination follows/likes activity            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, campaign_id 120250948392580402, spent THB 34,465.75, the largest campaign spend, but produced only 5 inline link clicks, 1 lead, 9 messaging conversations started, and 0 purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign materially and rebuild it as a clean lead, messaging, or ticket-sales campaign with direct response creative and proper conversion optimization.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep and carefully scale New post engagement campaign for low-cost engagement/traffic only            </h3>            <p>              <strong>Why:</strong>              New post engagement campaign produced 428 of the account’s 627 inline link clicks at THB 5.69 per inline link click, plus 341,638 page engagements from THB 2,437.01 spend.            </p>            <p>              <strong>Do this:</strong>              Increase budget carefully in small steps only if the goal is engagement or low-cost link-click traffic; do not treat it as a proven lead or purchase driver yet because it produced 0 leads and 0 purchases.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Consolidate duplicate and ERROR QUARANTINED campaigns            </h3>            <p>              <strong>Why:</strong>              Many campaigns share the same Broad Destination naming and several include ERROR QUARANTINED. Spend is fragmented across campaigns with overlapping naming, uneven CPMs, and minimal link/lead outcomes.            </p>            <p>              <strong>Do this:</strong>              Stop creating duplicate/error-labeled variants, consolidate winning creatives into fewer clean campaigns, and separate awareness, traffic, messaging, and lead objectives.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix purchase and lead tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              There are 0 purchase events, no revenue values, no ROAS data, and only 1 lead event across multiple lead action types.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, purchase event firing, lead event deduplication, URL parameters, and reporting columns before scaling conversion campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best traffic and engagement efficiency in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,437.01 spend, 1,041,096 impressions, 847,096 reach, 428 inline link clicks, THB 5.69 cost per inline link click, 341,638 page engagements, and 321,980 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale for engagement or traffic testing. Add direct lead/ticket CTA variants before increasing it as a business-outcome campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower/page-like and engagement producer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 29,564.30 spend, 26,951 likes, THB 1.10 cost per like, 530,919 page engagements, 4,120 comments, 1,148 saves, and 448,019 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if follower growth and engagement are strategic. Do not scale aggressively because frequency is already 3.99 and it produced 0 leads and 0 purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very cheap awareness reach, but not a traffic or conversion driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 8,067.32 spend delivered 11,469,135 impressions, 7,100,935 reach, THB 0.70 CPM, 603,996 page engagements, and 596,061 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as a capped awareness layer if reach is valuable. Rebuild or reduce if the budget is expected to drive ticket sales, leads, or site traffic.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Generated meaningful page likes for Thailand activity.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,714.59 spend, 1,677 likes, THB 2.21 cost per like, 6,915 page engagements, and 119 comments.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              If Thailand page-like growth is still needed, keep only after rebuilding under a clean non-error campaign name and monitor CPM, which was high at THB 199.01.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Largest spend concentration is not producing meaningful business outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              campaign_id 120250948392580402 spent THB 34,465.75, produced 721,432 impressions, 26,134 clicks, but only 5 inline link clicks, 1 lead, 9 messaging conversations started, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild around lead, messaging, or purchase optimization. Current engagement/follows setup is not aligned with profitable ticket sales or qualified leads.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Poor traffic quality despite massive reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              11,469,135 impressions and THB 8,067.32 spend produced only 1 inline link click, 0 leads, and 0 purchases. CTR was 0.0366%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not use this campaign for traffic, leads, or sales. Cap it for awareness only or rebuild with a traffic/conversion objective and direct CTA.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Higher cost for likes and impressions than stronger page-like campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 574.79 spend, 125 likes, THB 4.60 cost per like, THB 83.44 CPM, 0 inline link clicks, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. If Thailand likes are required, compare against the Thailand ERROR QUARANTINED campaign, which produced THB 2.21 cost per like, but rebuild under clean naming.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Spend is producing engagement but no measurable traffic, leads, or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,304.20 spend, 85,233 impressions, 3,163 clicks, 0 inline link clicks, 762 likes, 19,292 page engagements, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and consolidate into a cleaner Broad Destination test. Do not scale until it can generate qualified traffic or lead/messaging outcomes.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Multiple duplicate/error-labeled variants are fragmenting spend without lead or purchase output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Three visible variants spent THB 1,487.24, THB 1,022.51, and THB 2,430.56 respectively, with 0 leads and 0 purchases. Only one of the three generated 1 inline link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate these variants and move budget into one clean campaign with the best creative/ad set structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data to judge.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Several variants spent only THB 4.26 to THB 7.06 with 29 to 58 impressions each.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause or judge performance from this tiny sample. Either let a properly structured test run to meaningful spend/results or remove as part of consolidation.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, campaign_id 120250948392580402              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New dedicated lead and ticket-sales test campaigns              </strong>            </div>            <p>              This campaign consumed THB 34,465.75 but generated only 1 lead, 5 inline link clicks, 9 messaging conversations started, and 0 purchases. Shift budget toward objective-aligned lead/purchase testing.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Capped awareness budget plus retargeting/lead tests              </strong>            </div>            <p>              It is efficient for awareness with THB 0.70 CPM and 7,100,935 reach, but produced only 1 inline link click and no leads or purchases. Keep only a smaller awareness layer and move excess into conversion paths.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate ERROR QUARANTINED Broad Destination follows/likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Consolidated clean Broad Destination campaign and direct-response lead/messaging tests              </strong>            </div>            <p>              Several duplicate/error-labeled campaigns spent across similar names with little to no inline link clicks, leads, or purchases. Consolidation will reduce fragmentation and make results easier to optimize.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Clean rebuilt Thailand follows/likes test or lead/messaging test              </strong>            </div>            <p>              The non-error Thailand campaign had THB 4.60 cost per like and 0 inline link clicks, while another Thailand campaign produced THB 2.21 cost per like but has ERROR QUARANTINED naming and high CPM.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current broad engagement-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign              </strong>            </div>            <p>              New post engagement campaign generated 428 inline link clicks from THB 2,437.01 spend, far more efficient for traffic than most other campaigns. Scale carefully only as a traffic/engagement source.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead generation campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated Leads campaign using either Instant Forms or website lead optimization. Use clear ticket/offer messaging and separate retargeting audiences from page engagers, video viewers, and link clickers.            </p>            <p>              <strong>Success metric:</strong>              Wait for at least 3 leads before judging. Then evaluate cost per lead and lead quality; current lead volume is only 1.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket purchase tracking and sales campaign test            </h3>            <p>              <strong>Setup:</strong>              Confirm purchase event tracking first, then launch a small Sales campaign optimized to Purchase or highest available ticket-sale event. Use direct ticket CTA creative.            </p>            <p>              <strong>Success metric:</strong>              Purchases, cost per purchase, and ROAS after purchase events are confirmed. Current purchase volume is 0, so profitability cannot be judged.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Click-to-message qualification test            </h3>            <p>              <strong>Setup:</strong>              Create a Messages campaign with qualifying prompts such as visit date, ticket quantity, and location intent. Retarget engaged users from campaigns with high page engagement and video views.            </p>            <p>              <strong>Success metric:</strong>              Cost per messaging conversation started, reply rate, and qualified conversation rate. Current account produced 14 conversations started and 9 replied conversations.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Engagement creative to direct-response creative split            </h3>            <p>              <strong>Setup:</strong>              Take the strongest engagement assets from AQ_MU2025_Followers_IN and New post engagement campaign, then test versions with stronger ticket/lead CTAs against current engagement-style creative.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, leads, messaging conversations, and purchases after each test reaches at least 3 business-result events.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Clean campaign consolidation test            </h3>            <p>              <strong>Setup:</strong>              Rebuild duplicate Broad Destination and ERROR QUARANTINED campaigns into fewer clean campaigns segmented by objective: awareness, traffic, messaging, and leads.            </p>            <p>              <strong>Success metric:</strong>              Improved clarity of spend-to-result reporting, lower wasted spend on duplicate campaigns, and measurable lead/messaging/purchase outcomes.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events were reported, so ticket sales, cost per purchase, and ROAS cannot be evaluated.</li><li>Only 1 lead was reported, below the minimum_results_before_decision of 3, so CPL performance is insufficient for a confident decision.</li><li>Multiple lead-related action types appear with value 1, including onsite_conversion.lead, onsite_web_lead, lead, lead_grouped, and offsite lead-related actions. Audit deduplication and event mapping to confirm whether this is one lead counted
