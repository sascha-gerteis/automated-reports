,847,715 impressions          ·          1.81 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,767</strong>        <small>          0.52% CTR          ·          THB 0.87 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>12</strong>        <small>          THB 9,719.29 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>51</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 4.51</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large awareness and engagement volume, but the account is not yet proving the core goal of profitable ticket sales or qualified leads. Spend was THB 116,631.46 for 25,847,715 impressions, 14,268,177 reach, 1,767 inline link clicks, 282 landing page views, 51 messaging conversations started, and only 4 leads. No purchase, revenue, or ROAS data was supplied, so ticket-sale profitability cannot be assessed. Performance is mixed: awareness/follower activity is strong in specific campaigns, traffic quality is ages | 2026-06-19, and Claude | IN | Corporates | 5 Languages | 2026-06-19 spent only THB 86.13 combined but produced 507 inline link clicks and all 282 landing page views in the account.            </p>            <p>              <strong>Do this:</strong>              Increase these campaigns gradually by 20-30% per budget change, keep them separated by audience, and monitor landing page view rate and leads before making larger spend moves.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness/follows budget from lead and ticket-sale budget            </h3>            <p>              <strong>Why:</strong>              Most spend is currently in follows, visibility, and engagement campaigns. These are generating reach, likes, video views, and page engagement, but they are not designed or proven to drive leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Create a fixed budget split: capped awareness/follower spend for reach and social proof, plus a dedicated lead/ticket conversion or traffic-to-lead testing budget using the best traffic audiences.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix attribution and event reporting before judging ticket-sale profitability            </h3>            <p>              <strong>Why:</strong>              Several campaigns and days show actions with zero impressions and zero spend, including lead and messaging actions. No purchase events, purchase value, or ROAS data were supplied.            </p>            <p>              <strong>Do this:</strong>              Audit pixel/CAPI, lead event deduplication, purchase event firing, attribution windows, and campaign status mapping. Do not make purchase profitability decisions until purchase tracking is visible.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep strong awareness performers but cap them to their role            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN and New post engagement campaign are producing strong follower/engagement outcomes, but neither is proving ticket purchases or qualified leads.            </p>            <p>              <strong>Do this:</strong>              Keep these campaigns active for awareness/social proof, but do not reallocate conversion budget into them unless they are rebuilt with a lead, messaging, or purchase objective.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 23,406.56 spend, 22,676 likes, 428,507 page engagements, 405,831 post engagements, CTR 5.25%, and approximately THB 1.03 per like. Frequency is 3.12, which is higher than the account average of 1.81.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep, but monitor frequency and creative fatigue. Use this as the internal benchmark for follower campaigns. Do not judge it by purchases because it appears to be a follower/engagement campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Efficient broad engagement and the largest source of inline link clicks among active engagement campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,461.89 spend, 2,477,378 impressions, CPM THB 2.20, 772,033 page engagements, 1,057 inline link clicks, 15 messaging conversations started, and 15 first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an engagement and retargeting-audience builder. Test a messaging or lead version of the best post creative rather than simply increasing engagement spend.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very efficient awareness reach and video volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 13,880.83 spend, 20,750,560 impressions, 11,317,345 reach, CPM THB 0.67, 1,164,348 post engagements, and 1,150,055 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as capped awareness. Do not use this campaign for traffic or lead expectations because it produced only 3 inl
