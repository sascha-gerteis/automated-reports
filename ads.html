c, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-10-18        →        2026-11-16      </span>      <span class=&quot;pill&quot;>        6 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 32,897.15</strong>        <small>          2026-10-18          to          2026-11-16        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>3,080,661</strong>        <small>Estimated unique reach &amp;middot; 2.07 average frequency</small>      </div>      <div class=&quot;card&quot;>        <span>Impressions</span>        <strong>6,362,308</strong>        <small>Total ad displays in this reporting period</small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>51,560</strong>        <small>          0.81% Link CTR          ·          THB 0.64 Link CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>16</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 5.17</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>    <section class=&quot;section&quot; aria-label=&quot;Data quality check&quot;>    <div class=&quot;dq-panel dq-pass&quot;>      <div class=&quot;dq-heading&quot;>        <span class=&quot;dq-label&quot;>DATA QUALITY CHECK</span>        <span class=&quot;dq-status&quot;>Checks passed</span>      </div>      <p class=&quot;dq-overview&quot;>No anomalies detected by the selected checks. This does not verify Meta attribution accuracy.</p>      <details class=&quot;dq-details&quot;>        <summary>Review checks (12 passed, 0 warnings, 0 critical) · 6 campaigns · 30 daily rows</summary>        <ul class=&quot;dq-checks&quot;><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Report date range</strong><small>2026-10-18 to 2026-11-16 (30 calendar days).</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Account summary response</strong><small>Account spend and impressions are present and numeric.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Campaign response</strong><small>6 campaign rows received.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Campaign pagination</strong><small>No additional campaign page is indicated in this response.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Daily trend response</strong><small>30 daily rows received. Days without delivery may not have a row.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Daily pagination</strong><small>No additional daily page is indicated.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Duplicate campaign identifiers</strong><small>No duplicate non-empty campaign IDs in returned campaign rows.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Metric value integrity</strong><small>No invalid/negative core metrics or obvious reach/click inconsistencies found.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Daily date integrity</strong><small>30 unique reporting dates are inside the selected period. (Zero-delivery days may be omitted.)</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Account vs. campaign spend</strong><small>Account: 32,897.15, rows: 32,897.15, difference: 0 (0.00%). Allowed tolerance: max(5 currency units, 2% of account spend).</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>Account vs. daily spend</strong><small>Account: 32,897.15, rows: 32,897.15, difference: 0 (0.00%). Allowed tolerance: max(5 currency units, 2% of account spend).</small></span>  </li><li class=&quot;dq-check dq-check-info&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>i</span>    <span><strong>Conversion metric coverage</strong><small>Of 6 campaigns with spend: lead actions available for 0, purchase actions for 0, and purchase value for 0. Missing conversion actions are not proof of zero sales.</small></span>  </li><li class=&quot;dq-check dq-check-pass&quot;>    <span class=&quot;dq-icon&quot; aria-hidden=&quot;true&quot;>✓</span>    <span><strong>AI analysis structure</strong><small>AI recommendations were parsed, but must still be verified against Meta data.</small></span>  </li></ul>      </details>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Total spend of 32,897.15 THB generated 51,560 inline link clicks and 14,073 landing page views (LPVs). Campaign efficiency is highly uneven: &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; delivered 94.8% of all landing page views (13,347 LPVs) at an efficient 0.13 THB CPC and 9.57% CTR. However, substantial budget is allocated to high-frequency follower campaigns (frequency 3.60 in AQ_MU2025_Followers_IN) and campaigns with complete landing page tracking drop-offs (&amp;#039;party&amp;#039; generated 21,308 link clicks but 0 LPVs). Purchase and Lead conversion tracking are currently unconfigured.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Scale &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039;            </h3>            <p>              <strong>Why:</strong>              Drives 94.8% of account landing page views (13,347 LPVs) with strong efficiency (0.13 THB CPC, 9.57% CTR, ~0.20 THB/LPV).            </p>            <p>              <strong>Do this:</strong>              Increase daily budget by 30-50% incrementally while maintaining broad audience targeting.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit and Fix Tracking on &amp;#039;party&amp;#039; Campaign            </h3>            <p>              <strong>Why:</strong>              Generated 21,308 inline link clicks but 0 landing page views, indicating broken landing page redirects or uninstalled Meta Pixel code.            </p>            <p>              <strong>Do this:</strong>              Verify destination URLs, page load speeds, and Meta Pixel landing page view triggers before spending further.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce Budget and Refresh Creatives on &amp;#039;AQ_MU2025_Followers_IN&amp;#039;            </h3>            <p>              <strong>Why:</strong>              Largest budget campaign (12,315.18 THB spend) suffers severe audience fatigue with a 3.60 frequency, 21.13 THB CPM, and only 3 LPVs.            </p>            <p>              <strong>Do this:</strong>              Cut daily spend by 40% and introduce new ad creative variants to drop frequency.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Pause &amp;#039;Aquaverse India Daily Follows Likes...&amp;#039;            </h3>            <p>              <strong>Why:</strong>              Extremely inefficient CPM of 83.92 THB and CPC of 0.96 THB yielding only 1 inline link click from 1,241.62 THB spend.            </p>            <p>              <strong>Do this:</strong>              Pause campaign immediately and move remaining funds to traffic campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              Primary performance engine driving web traffic efficiently.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend: 2,701.27 THB, Inline Link Clicks: 20,798, Landing Page Views: 13,347 (94.8% of total account LPVs), CTR: 9.57%, CPC: 0.13 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Scale campaign budget and test additional creative formats using similar Miss Universe creative hooks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Low-cost awareness and video view generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend: 9,955.92 THB, Impressions: 2,522,235, CPM: 3.95 THB, Reach: 928,944, Video Views: 377,439, Landing Page Views: 707.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Maintain baseline spend for brand top-of-funnel reach while optimizing ad sets toward Landing Page Views.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              party            </h3>            <p>              100% loss of landing page traffic despite high outbound click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend: 3,685.12 THB, Inline Link Clicks: 21,308, Landing Page Views: 0, CTR: 0.85%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause traffic delivery until landing page tracking and URL destination links are fixed.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy            </h3>            <p>              Extreme CPM inflation and poor click output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend: 1,241.62 THB, Impressions: 14,795, CPM: 83.92 THB, CPC: 0.96 THB, Inline Link Clicks: 1.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause campaign permanently.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Creative fatigue leading to high CPM and minimal website traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend: 12,315.18 THB, Frequency: 3.60, CPM: 21.13 THB, Inline Link Clicks: 52, Landing Page Views: 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Cap frequency by expanding audience parameters and lowering spend by 40%.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy              </strong>            </div>            <p>              Shift budget away from saturated follower ads (3.60 frequency) to the highest-performing traffic campaign.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy              </strong>            </div>            <p>              Eliminate wasteful spend (83.92 THB CPM) and consolidate into proven high-CTR campaign (9.57%).            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                party              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New Direct Response / Conversion Campaign              </strong>            </div>            <p>              Reallocate budget from untracked click traffic to structured lead or purchase conversion campaigns once tracking is set up.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Meta Instant Lead Form vs Landing Page Destination            </h3>            <p>              <strong>Setup:</strong>              A/B test Meta Lead Generation forms against the winning Miss Universe landing page to generate direct ticket leads on-platform.            </p>            <p>              <strong>Success metric:</strong>              Cost per Lead (CPL) and Lead Form Completion Rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Creative Format Iterations on Miss Universe Angle            </h3>            <p>              <strong>Setup:</strong>              Test short-form video reels vs dynamic carousel ads using Miss Universe imagery targeting broader tourist and regional demographics.            </p>            <p>              <strong>Success metric:</strong>              CTR (&amp;gt;5.0%), CPC (&amp;lt;0.20 THB), and Cost per Landing Page View.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No downstream conversion events (Purchase, AddToCart, Lead) are tracked or reporting in Meta Ads Manager despite ticket sales and leads being
