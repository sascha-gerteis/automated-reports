, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-03        →        2026-10-02      </span>      <span class=&quot;pill&quot;>        3 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 21,512.13</strong>        <small>          2026-09-03          to          2026-10-02        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>568,811</strong>        <small>          1,519,183 impressions          ·          2.67 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,852</strong>        <small>          3.21% CTR          ·          THB 0.44 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 14.16</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated strong awareness and engagement, but the account is not currently proving progress toward profitable ticket sales or qualified leads. THB 21,512.13 was spent, with 1,519,183 impressions, 568,811 reach, 48,820 clicks, and 1,852 inline link clicks. However, only 32 landing page views, 1 messaging conversation started, and no reported lead or purchase actions were recorded. The main issue is budget concentration in follower/engagement campaigns rather than measurable sales or lead campaigns.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebalance budget away from follower-only activity            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN used THB 17,820.51, or about 83% of total spend, but produced only 57 inline link clicks and no reported leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce AQ_MU2025_Followers_IN and reserve budget for dedicated ticket sales and lead-generation campaigns once tracking is verified.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix landing page view tracking before scaling traffic            </h3>            <p>              <strong>Why:</strong>              The account recorded 1,852 inline link clicks but only 32 landing page views, a very large drop-off. Aquaverse India | Instagram Followers | 2026-09-27 alone produced 1,795 link clicks but only 32 landing page views.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI setup, landing page load speed, URL redirects, UTMs, and whether Meta can fire landing_page_view correctly from the destination page.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild the messaging path before judging messaging performance            </h3>            <p>              <strong>Why:</strong>              Aquaverse India | Instagram Followers | 2026-09-27 recorded 213 messaging blocks but only 1 messaging conversation started, 1 first reply, and 1 total messaging connection. Messaging results are below the minimum_results_before_decision of 3, so this should not be paused solely from conversion volume.            </p>            <p>              <strong>Do this:</strong>              Check the click-to-message destination, automated replies, opening prompt, and qualification flow. Relaunch with a clearer CTA and pre-filled intent question.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Create campaigns aligned to the business goal            </h3>            <p>              <strong>Why:</strong>              No purchase actions, ROAS, or lead actions are reported in the supplied data, so the account cannot currently prove profitable ticket sales or qualified leads.            </p>            <p>              <strong>Do this:</strong>              Build separate campaigns for ticket sales, lead forms, and messaging leads instead of relying mainly on follower campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness, engagement, video view, and follower/page-like delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 17,820.51 spend generated 1,056,803 impressions, 260,814 post engagements, 277,644 page engagements, 16,830 likes, and 231,722 video views. Cost per page engagement was approximately THB 0.06 and cost per like was approximately THB 1.06.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth and engagement remain a priority, but reduce its budget because it is not producing measurable ticket sales, leads, or meaningful site traffic.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient reach and low-cost link-click volume compared with the other campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,497.14 spend generated 450,482 impressions, 315,235 reach, 8,960 clicks, 1,795 inline link clicks, CPC of THB 0.278699, CPM of THB 5.543263, and frequency of 1.429035.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a controlled traffic/diagnostic campaign only after landing page tracking is fixed. Do not scale until link clicks translate into landing page views, leads, or purchases.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Budget is over-weighted toward engagement rather than ticket sales or lead outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The campaign spent THB 17,820.51, about 83% of total account spend, but generated only 57 inline link clicks and no reported landing page views, leads, or purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Carefully reduce budget and use savings to test conversion, lead, and messaging campaigns. Do not judge this campaign by purchases if its purpose is follower growth, but it should not dominate spend when the business goal is ticket sales and qualified leads.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Less efficient for engagement/follower activity than AQ_MU2025_Followers_IN and not useful for website traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,194.48 spend generated 3,445 page engagements at approximately THB 0.35 each versus AQ_MU2025_Followers_IN at approximately THB 0.06. It had CPM of THB 100.393343, CPC of THB 1.092845, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild this campaign. If follower/page-like growth remains a goal, shift this budget to the more efficient follower campaign or test new creative/audience structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality or tracking is weak after the click.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The campaign generated 1,795 inline link clicks but only 32 landing page views, a link-click to landing-page-view rate of about 1.8%. It also recorded 213 messaging blocks but only 1 conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale yet. Fix tracking and destination experience, then retest with landing page view, lead, purchase, or messaging optimization depending on the campaign objective.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New ticket sales and lead-generation campaigns              </strong>            </div>            <p>              This campaign uses most of the spend but is optimized around follower/engagement outcomes, not reported leads or purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN if follower growth is still required, or to a new lead/ticket-sales test              </strong>            </div>            <p>              Daily Follows Likes has higher CPM, higher CPC, higher cost per page engagement, and 0 inline link clicks.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Untracked traffic spend              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Tracking-verified landing page view, lead, or purchase campaigns              </strong>            </div>            <p>              The account has 1,852 inline link clicks but only 32 landing page views, so scaling traffic before tracking is fixed risks wasting budget.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Ticket sales conversion campaign            </h3>            <p>              <strong>Setup:</strong>              After Pixel/CAPI and purchase event tracking are verified, launch a dedicated ticket sales campaign optimized for the correct purchase or checkout event.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 purchases. Use cost per purchase and ROAS if revenue is passed back.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Qualified lead form campaign            </h3>            <p>              <strong>Setup:</strong>              Run Meta instant forms with qualification questions for group bookings, event enquiries, or ticket interest. Keep it separate from follower campaigns.            </p>            <p>              <strong>Success metric:</strong>              Cost per qualified lead after at least 3 leads, plus lead quality from follow-up.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Landing page view vs link click optimization            </h3>            <p>              <strong>Setup:</strong>              Use the same creative and audience, but compare landing page view optimization against link click optimization once tracking is working.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, and downstream lead or purchase actions.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging intent test            </h3>            <p>              <strong>Setup:</strong>              Relaunch messaging with a clear offer-led CTA and pre-filled questions such as ticket date, number of visitors, and enquiry type.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started and first replies after at least 3 conversations, plus reduction in messaging blocks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Follower campaign efficiency test            </h3>            <p>              <strong>Setup:</strong>              Test AQ_MU2025_Followers_IN against a rebuilt version of Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination with matched budgets.            </p>            <p>              <strong>Success metric:</strong>              Cost per like, cost per page engagement, CPM, and frequency.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No reported purchase actions, purchase value, or ROAS despite the business goal of profitable ticket sales.</li><li>No reported lead actions despite the business goal of qualified leads.</li><li>Only 32 landing page views from 1,852 inline link clicks at account level, indicating a tracking, page-load, redirect, or traffic-quality issue.</li><li>Aquaverse India | Instagram Followers | 2026-09-27 shows 213 messaging blocks but only 1 messaging conversation started; messaging volume is below the minimum_results_before_decision of 3, so performance cannot be conclusively judged yet.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep the account active, but shift the strategy from follower growth to measurable sales and lead acquisition. Maintain a reduced follower/engagement budget for awareness, rebuild or reduce the inefficient Daily Follows Likes campaign, fix landing page and event tracking immediately, and launch dedicated ticket sales, qualified lead, and messaging tests before scaling.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout campaigns    </h2>    <div class=&quot;insights&quot;>                <div class=&quot;insight&quot;>            <span>Highest CTR</span>            <strong>9.19% · Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination</strong>          </div>                  <div class=&quot;insight&quot;>            <span>Lowest CPC</span>            <strong>THB 0.28 · Aquaverse India | In
