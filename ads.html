  margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-13        →        2026-09-11      </span>      <span class=&quot;pill&quot;>        20 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 57,334.21</strong>        <small>          2026-08-13          to          2026-09-11        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>5,013,316</strong>        <small>          8,245,044 impressions          ·          1.64 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>310</strong>        <small>          0.98% CTR          ·          THB 0.71 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 19,111.40 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>4</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 6.95</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent THB 57,334.21 and generated strong upper-funnel volume: 8,245,044 impressions, 5,013,316 reach, 1,011,477 page engagements, and 920,765 video views. However, business-goal performance is not yet proven: only 310 inline link clicks, 1 reported lead, 4 messaging conversations started, and no purchase or ROAS data. Engagement campaigns are working, but ticket sales and qualified lead performance cannot be judged because lead volume is below the minimum decision threshold of 3 and purchase tracking is absent.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix tracking before judging ticket sales performance            </h3>            <p>              <strong>Why:</strong>              The account has 80,570 total clicks but only 310 inline link clicks, plus only 1 lead and no purchase events. Total clicks are mostly engagement clicks, not site traffic.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, purchase event, lead event, UTMs, and landing-page attribution. Report traffic using inline_link_clicks, not total clicks, until tracking is verified.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild quarantined campaigns into clean campaigns            </h3>            <p>              <strong>Why:</strong>              Multiple active campaigns contain &amp;#039;ERROR QUARANTINED&amp;#039; in the name. Some have meaningful spend but are not aligned to lead or purchase outcomes.            </p>            <p>              <strong>Do this:</strong>              Create clean replacement campaigns for the higher-spend quarantined campaigns, move the best creatives/audiences over, then reduce or stop the quarantined versions once replacements are delivering.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from inefficient broad follows/likes campaigns            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination spent THB 10,670.37 but produced only 1 inline link click, 555 likes, 3 messaging conversations started, and 1 lead, which is below the minimum lead decision threshold.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign and rebuild it as a dedicated lead, messaging, or purchase/traffic campaign using the best engagement creatives.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Carefully scale New post engagement campaign            </h3>            <p>              <strong>Why:</strong>              New post engagement campaign generated 169 of the account&amp;#039;s 310 inline link clicks while spending only THB 922.01.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually and test the same post/creative in a traffic or lead objective campaign to see if link-click efficiency converts into qualified leads.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Protect proven engagement volume but limit over-investment            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN produced 461,764 page engagements and 23,783 likes, but spent THB 26,663.39 and generated only 139 inline link clicks with no leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign for follower/page growth, but cap or reduce spend if the near-term priority is ticket sales or qualified leads.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best source of inline link clicks and very efficient engagement for a small spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 922.01 spend, 385,677 impressions, 127,821 page engagements, 119,127 video views, 169 inline link clicks, THB 5.46 cost per inline link click, and THB 0.007 cost per page engagement.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Also duplicate the winning creative into a traffic, lead, or messaging test.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower/page engagement driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 26,663.39 spend, 461,764 page engagements, 437,981 post engagements, 23,783 likes, 392,530 video views, CTR 4.01%, and THB 1.12 cost per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for awareness/follower growth, but do not judge it by purchases unless it is rebuilt with a purchase or lead objective and proper tracking.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient awareness reach and video volume despite the quarantined naming issue.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,228.25 spend, 5,877,675 impressions, 4,116,289 reach, CPM THB 0.72, 307,332 page engagements, and 303,324 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use learnings for awareness audiences, but rebuild into a clean non-quarantined campaign before scaling.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Only campaign with measurable lead and messaging activity, but data is still limited.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 10,670.37 spend, 1 lead, 3 messaging conversations started, 3 total messaging connections, and 3 messaging first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not pause based on lead data because it has only 1 lead, below the minimum of 3. Rebuild as a dedicated lead or messaging campaign and judge after at least 3 qualified results.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Inefficient for link traffic and follower growth relative to spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 10,670.37 spend, 215,550 impressions, only 1 inline link click, 555 likes, CPM THB 49.50, and THB 19.23 cost per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild with a clearer objective: lead generation, messaging, or ticket purchase traffic.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              High delivery cost versus other awareness and engagement campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,172.72 spend, only 9,662 impressions, CPM THB 224.87, 3,887 page engagements, and 1,057 likes.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild before scaling. Test Thailand creative/audience in a clean campaign with the same objective and compare cost per like/page engagement.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Good awareness volume but not driving traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              5,877,675 impressions and 307,332 page engagements, but 0 inline link clicks from THB 4,228.25 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only if the objective is awareness/video views. Do not use this setup for ticket sales or lead generation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Large spend concentration with limited site traffic and no reported lead or purchase outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 26,663.39 spend, 46.5% of account spend, 139 inline link clicks, frequency 4.15, 2,530 post unlikes, and no lead or purchase actions reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep for followers, but reduce if business priority is ticket sales. Use retargeting or separate conversion campaigns to monetize this engaged audience.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data for performance decisions on the tiny Aug 28 variants.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Several variants spent only THB 4.26 to THB 7.06 with 29 to 58 impressions each.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on performance. Consolidate or relaunch only to reduce account clutter and avoid budget fragmentation.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead, messaging, or ticket-sales test campaign              </strong>            </div>            <p>              This campaign spent THB 10,670.37 but produced only 1 inline link click and 1 lead, which is below the 3-result decision threshold.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Clean Thailand follows/likes or traffic test              </strong>            </div>            <p>              The campaign has high CPM at THB 224.87 and limited reach from THB 2,172.72 spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED campaigns with meaningful spend              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Clean rebuilt versions using the same best creatives/audiences              </strong>            </div>            <p>              Quarantined naming indicates structural/account hygiene issues, and several campaigns are fragmented across similar Broad Destination setups.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                A portion of AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting or lead/messaging campaign using engaged users              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is strong for engagement but generated no reported leads or purchases from THB 26,663.39 spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current small allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign              </strong>            </div>            <p>              It generated 169 inline link clicks from only THB 922.01, more than half of all account inline link clicks.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead generation campaign test            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated lead campaign using the strongest creatives from New post engagement campaign and AQ_MU2025_Followers_IN. Use a clear ticket/lead offer and lead form or landing page.            </p>            <p>              <strong>Success metric:</strong>              Do not decide until at least 3 leads are recorded. Then compare cost per qualified lead and lead quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Click-to-message qualification test            </h3>            <p>              <strong>Setup:</strong>              Rebuild from Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, which produced 3 messaging conversations started. Add qualifying questions for ticket interest, date, group size, and location.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, messaging first replies, and qualified conversations after at least 3 qualified results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Traffic objective test using New post creative            </h3>            <p>              <strong>Setup:</strong>              Duplicate the best post from New post engagement campaign into a traffic campaign optimized
