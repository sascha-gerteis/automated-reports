s: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-12        →        2026-08-10      </span>      <span class=&quot;pill&quot;>        76 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 593,174.86</strong>        <small>          2026-07-12          to          2026-08-10        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>44,074,825</strong>        <small>          82,911,164 impressions          ·          1.88 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,599,946</strong>        <small>          2.46% CTR          ·          THB 0.29 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>129</strong>        <small>          THB 4,598.25 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>970</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.15</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Aquaverse generated very large reach and traffic during the period: 82,911,164 impressions, 44,074,825 reach, 1,599,946 link clicks, 708,334 landing page views, and 593,174.86 THB spend. However, only 43 leads were recorded and no purchase events or ROAS data are present, so ticket-sales profitability cannot be evaluated. The strongest lead and messaging signals came from a small group of campaigns, while a large share of spend went to follower, engagement, awareness, and broad video/traffic campaigns that did not produce measurable leads.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reallocate budget toward proven lead and message producers            </h3>            <p>              <strong>Why:</strong>              The best lead-producing campaigns were much more efficient than high-spend traffic and follower campaigns. For example, &amp;quot;Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;&amp;quot; generated 5 leads from 606.41 THB, while &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot; generated 12 leads from 1,599 THB and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot; generated 11 leads from 1,627.03 THB.            </p>            <p>              <strong>Do this:</strong>              Move budget from high-spend campaigns with no or weak lead output into a dedicated lead or messaging campaign using the creatives from these three campaigns. Scale carefully because total lead volume is still low.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on high-cost traffic segments with no lead output            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;quot; spent 96,135.56 THB with 289,391 link clicks, 116,341 landing page views, 3 messaging conversations started, and 0 leads. &amp;quot;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;quot; spent 45,975.60 THB with 141,851 link clicks, 59,452 landing page views, 1 messaging conversation started, and 0 leads.            </p>            <p>              <strong>Do this:</strong>              Reduce or rebuild the Corporates 5-language and 6-language campaigns. Do not continue scaling them for lead generation until landing page and conversion tracking issues are resolved.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness, follower growth, traffic, messaging, and lead budgets            </h3>            <p>              <strong>Why:</strong>              Many campaigns are producing awareness or follower results but are not contributing to leads. For example, &amp;quot;Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers&amp;quot; produced 23,551,925 impressions at 15,614.76 THB spend and only 2 link clicks, while &amp;quot;AQ_MU2025_Followers_IN&amp;quot; produced 21,894 page likes and 480,421 page engagements.            </p>            <p>              <strong>Do this:</strong>              Create separate budget caps by objective: awareness/followers, traffic, messaging, and leads. Do not let follower or awareness campaigns consume budget intended for ticket sales or qualified leads.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate landing page view and attribution anomalies            </h3>            <p>              <strong>Why:</strong>              Several campaigns show very high link clicks but extremely low landing page views, such as &amp;quot;Claude | IN | English | Water Park &amp;amp; Interview | Traffic | 2026-06-13&amp;quot; with 10,092 link clicks but only 34 landing page views, and &amp;quot;Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13&amp;quot; with 14,474 link clicks but only 14 landing page views. Daily data also shows leads and messaging actions on days with 0 impressions, 0 clicks, and 0 spend.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, landing page load speed, destination URLs, UTMs, event deduplication, and attribution window behavior before making large budget decisions from lead data.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best lead and messaging efficiency in the account from a small but decisionable sample.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              606.41 THB spend, 5 leads, 891 link clicks, 123 messaging conversations started, 189 total messaging connections, 91 messaging replies, CTR 5.18%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this post as a lead/messaging creative in a dedicated lead or message campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging performer among language traffic campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,599 THB spend, 12 leads, 11,844 link clicks, 304 messaging conversations started, 330 total messaging connections, CTR 2.62%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Build a lead-focused version using the same creative/language angle.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong English-language lead and messaging signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,627.03 THB spend, 11 leads, 11,668 link clicks, 205 messaging conversations started, 236 total messaging connections, CTR 2.14%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this as a control creative for English lead and messaging tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Very efficient awareness and traffic delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              7,456.21 THB spend, 3,480,725 impressions, 254,544 link clicks, 131,944 landing page views, CTR 7.44%, CPC 0.0288 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for low-cost traffic and retargeting pool building, but do not judge it by leads because no leads were recorded.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient traffic generator with strong CTR.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              3,988.93 THB spend, 141,512 link clicks, 73,175 landing page views, CTR 7.73%, CPC 0.0276 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic/retargeting audience builder. Test a conversion-focused version if lead tracking is fixed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Working for follower/page engagement objective.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              25,572.21 THB spend, 21,894 page likes, 480,421 page engagements, 50,461 post reactions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth is a valid objective. Do not fund it from lead or ticket-sales budget.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Largest spend concentration with no recorded leads and very weak messaging output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              96,135.56 THB spend, 289,391 link clicks, 116,341 landing page views, 3 messaging conversations started, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Test a new corporate lead offer, stronger CTA, and lead-optimized objective before restoring budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with no lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              45,975.60 THB spend, 141,851 link clicks, 59,452 landing page views, 1 messaging conversation started, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Do not scale further for lead generation without a new offer and tracking validation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Traffic and video delivery are present, but no leads were recorded.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              25,016.16 THB spend, 66,906 link clicks, 37,196 landing page views, 557,458 video views, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce if the primary goal is leads or ticket sales. Retest only with clearer booking/lead CTA.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              Good click volume but no measurable lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              23,947.47 THB spend, 82,846 link clicks, 40,034 landing page views, 700,565 video views, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce for lead generation. Keep only if the goal is video engagement or retargeting pool creation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Follower campaign appears inefficient versus stronger follower activity.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              25,613.65 THB spend, 2,686 page likes, 5 link clicks, 121,246 page engagements, CPM 50.99 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild this specific follower version if follower growth remains a goal. Reallocate follower budget toward better-performing follower campaigns such as &amp;quot;AQ_MU2025_Followers_IN&amp;quot;.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient reach but not useful for traffic, leads, or ticket sales.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              15,614.76 THB spend, 23,551,925 impressions, 13,123,720 reach, 2 link clicks, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as low-cost awareness. Reduce if budget is needed for lead or messaging campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Post: &amp;quot;🌊 Your Ultimate Destination for Fun and Adventure! 💦&amp;quot;            </h3>            <p>              Works as engagement/video content but not as traffic or lead content.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              2,143.05 THB spend, 590,797 impressions, 265,986 post engagements, 264,993 video views, only 159 link clicks, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not use this post for lead generation. Keep only for engagement or rebuild the CTA.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13, and Claude | IN | English | India Show 2025 | Traffic | 2026-06-13              </strong>            </div>            <p>              Corporates 6 spent 96,135.56 THB with 0 leads, while the three recommended campaigns produced 28 combined leads from 3,832.44 THB spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 5 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead or messaging campaign using Malayalam, English India Show, and Start Your Day creatives              </strong>            </div>            <p>              Corporates 5 spent 45,975.60 THB with 0 leads and only 1 messaging conversation started.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                High-cost Broad Destination follower campaigns, especially Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN or a capped follower-growth budget              </strong>            </div>            <p>              The 2026-08-02 Broad Destination follower campaign spent 25,613.65 THB for 2,686 page likes, while AQ_MU2025_Followers_IN generated 21,894 page likes from 25,572.21 THB.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                General awareness/follow visibility budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                IN_AWR_General_Image_Claude_2026-06-14 and Claude | IN | Daily 8 IMAGES MultiLang | 15Jun              </strong>            </div>            <p>              These campaigns generated efficient traffic and landing page views: 131,944 LPVs from 7,456.21 THB and 73,175 LPVs from 3,988.93 THB respectively.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead-optimized campaign using proven creatives            </h3>            <p>              <strong>Setup:</strong>              Create a new campaign optimized for lead or qualified messaging actions using creatives from &amp;quot;Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;&amp;quot;, &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot;.            </p>            <p>              <strong>Success metric:</strong>              Leads and messaging conversations started. Wait for at least 3 leads per ad set before making decisions.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Image traffic vs video traffic for retargeting pool quality            </h3>            <p>              <strong>Setup:</strong>              Compare &amp;quot;IN_AWR_General_Image_Claude_2026-06-14&amp;quot; and &amp;quot;Claude | IN | Daily 8 IMAGES MultiLang | 15Jun&amp;quot; against &amp;quot;Claude | IN | Daily 8 Videos MultiLang | 12Jun&amp;quot; with landing page views as the primary traffic metric.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, and downstream leads or messages.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Retargeting from high-intent pools            </h3>            <p>              <strong>Setup:</strong>              Build retargeting audiences from 708,334 landing page views, 15,342,041 video views, and messaging engagers. Serve direct ticket/lead CTA ads using the winning lead creatives.            </p>            <p>              <strong>Success metric:</strong>              Leads, messaging conversations started, and eventually purchase events once tracking is available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Follower campaign consolidation            </h3>            <p>              <strong>Setup:</strong>              Test &amp;quot;AQ_MU2025_Followers_IN&amp;quot; against the best current Daily Follows Likes audience only. Exclude high-cost Broad Destination variants that produced very few link clicks and weaker page-like efficiency.            </p>            <p>              <strong>Success metric:</strong>              Page likes and cost per page like. Keep follower tests separate from lead-generation budget.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events or ROAS are present, so profitable ticket sales cannot be evaluated from this data.</li><li>Daily data shows actions on days with 0 impressions, 0 clicks, and 0 spend, including leads and messaging actions from 2026-07-17 to 2026-07-22. This may be attribution-window behavior or reporting inconsistency.</li><li>Some campaigns show actions despite 0 impressions and 0 spend, such as &amp;quot;Claude | IN | Daily 8 IMAGES Improved | 18Jun&amp;quot; and &amp;quo
