st-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-19        →        2026-10-18      </span>      <span class=&quot;pill&quot;>        4 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 16,613.07</strong>        <small>          2026-09-19          to          2026-10-18        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>977,646</strong>        <small>          1,776,997 impressions          ·          1.82 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>6,539</strong>        <small>          2.31% CTR          ·          THB 0.40 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>6</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 9.35</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account delivered strong awareness and engagement volume, but it is not yet measurable against the stated goal of profitable ticket sales and qualified leads. Total spend was 16,613.07 THB, generating 1,776,997 impressions, 977,646 reach, 41,118 clicks, 6,539 link clicks, and 553 landing page views. Purchase and lead events are not present, so profitability, cost per purchase, cost per lead, and ROAS cannot be evaluated. Traffic quality is highly uneven: AQ Operator CBO | IN | Instagram Followers produced 498 of 553 landing page views at the best landing page efficiency, while several follower/like campaigns consumed budget without meaningful site or lead outcomes.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix sales and lead measurement before judging profitability            </h3>            <p>              <strong>Why:</strong>              No purchase or lead actions are reported despite the business goal being ticket sales and qualified leads. Targets are unknown, so performance cannot be compared to CPL, CPA, or ROAS.            </p>            <p>              <strong>Do this:</strong>              Audit Meta Pixel/CAPI and event setup for Lead, Purchase, and ticket checkout events. Do not scale sales spend until events are visible in Ads Manager.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward the strongest landing page view producer            </h3>            <p>              <strong>Why:</strong>              AQ Operator CBO | IN | Instagram Followers generated 498 landing page views from 2,552 link clicks, a 19.5% link-click-to-LPV rate and 5.55 THB per landing page view.            </p>            <p>              <strong>Do this:</strong>              Carefully increase budget on AQ Operator CBO | IN | Instagram Followers while monitoring landing page views, frequency, and downstream lead or purchase events once tracking is fixed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce budget on low-quality traffic delivery            </h3>            <p>              <strong>Why:</strong>              Aquaverse India | Instagram Followers | 2026-09-27 generated 3,971 link clicks but only 54 landing page views, a 1.4% link-click-to-LPV rate, with 107.99 THB per landing page view.            </p>            <p>              <strong>Do this:</strong>              Reduce spend on Aquaverse India | Instagram Followers | 2026-09-27 and rebuild the destination, creative, or optimization event before scaling it again.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate follower growth from sales and lead generation            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN and Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination are generating likes and engagement, but little to no website traffic.            </p>            <p>              <strong>Do this:</strong>              Keep follower campaigns only if social growth is a valid objective. Create separate campaigns for ticket sales, lead generation, and messaging so each is judged by its correct result type.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Investigate messaging quality and block volume            </h3>            <p>              <strong>Why:</strong>              The account recorded only 6 messaging conversations started but 785 messaging blocks. Aquaverse India | Instagram Followers | 2026-09-27 alone had 469 messaging blocks.            </p>            <p>              <strong>Do this:</strong>              Audit click-to-message placements, automated replies, welcome prompts, and audience intent. Exclude placements or creatives that trigger blocks without conversations.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best campaign for traffic quality and landing page delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 2,765.68 THB, 2,552 link clicks, 498 landing page views, 5.55 THB per landing page view, and 19.5% link-click-to-LPV rate. It also delivered 64,717 post engagements and 61,042 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this campaign structure or its best ads as the starting point for a dedicated ticket-sales or lead campaign once tracking is fixed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness and follower/social engagement performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 6,773.78 THB, 85,030 page engagements, 78,069 post engagements, 6,961 likes, 10,510 post reactions, 904 comments, and 65,475 video views. Cost per like was approximately 0.97 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as an awareness/follower-growth campaign. Do not rely on it for ticket sales traffic because it produced only 16 link clicks and 1 landing page view.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient reach and link-click volume, but not quality traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 5,831.20 THB, 1,017,282 impressions, CPM 5.73 THB, 19,875 clicks, and 3,971 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use learnings from its low CPM and high link-click volume, but rebuild before scaling because landing page view quality is weak.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              High delivery cost and no meaningful traffic outcome.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 1,242.41 THB, CPM 98.16 THB, CPC 1.09 THB, 897 likes, 3,628 page engagements, but 0 link clicks and 0 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause this setup and rebuild with lower-cost audiences or creatives if follower growth is still needed. Do not allocate sales budget here.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Large link-click volume is not translating into landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              3,971 link clicks produced only 54 landing page views, a 1.4% link-click-to-LPV rate, with 107.99 THB per landing page view. It also recorded 469 messaging blocks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and audit destination speed, click intent, placement quality, and creative CTA. Rebuild with landing page view or conversion optimization instead of follower-oriented delivery.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Not suitable for traffic, lead, or purchase evaluation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              It spent the most budget at 6,773.78 THB but produced only 16 link clicks and 1 landing page view, despite strong engagement volume.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep capped for awareness only. Move ticket-sales and lead-generation budget into campaigns optimized for landing page views, leads, or purchases.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-level purchase and lead performance            </h3>            <p>              Sales and lead generation cannot be assessed from the supplied data.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              No lead, purchase, value, or ROAS actions are present. Only 553 landing page views and 6 messaging conversations started are reported across 16,613.07 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make profitability decisions until Lead and Purchase events are tracked and each campaign reaches at least 3 results, per the supplied minimum_results_before_decision.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              Daily Follows Likes had 0 link clicks and 0 landing page views, while AQ Operator CBO delivered 498 landing page views at 5.55 THB each.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              Aquaverse India | Instagram Followers generated cheap reach and link clicks but only 54 landing page views from 3,971 link clicks. AQ Operator CBO had far stronger landing page follow-through.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead or ticket-sales campaign after tracking is fixed              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is useful for awareness but spent 6,773.78 THB for only 1 landing page view. Sales-focused budget should move to a campaign optimized for leads or purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting pool from 553 landing page views, 128,575 video views, and high page engagement audiences              </strong>            </div>            <p>              The account has built awareness volume but is not using the supplied data to show qualified lead or ticket-sale retargeting outcomes.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Ticket sales or lead conversion tracking test            </h3>            <p>              <strong>Setup:</strong>              After Pixel/CAPI audit, launch a dedicated campaign optimized to Lead or Purchase using ticket-sales creative and clear CTA. Keep it separate from follower campaigns.            </p>            <p>              <strong>Success metric:</strong>              At least 3 lead or purchase results before making a decision, then compare cost per result and ROAS if value is tracked.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Landing page view quality test            </h3>            <p>              <strong>Setup:</strong>              Duplicate the best AQ Operator CBO | IN | Instagram Followers structure and test landing page view optimization against the current follower/link-click style setup.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, and link-click-to-LPV rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Creative intent test for ticket buyers            </h3>            <p>              <strong>Setup:</strong>              Run ticket-focused creatives against follower/social-proof creatives using the same audience and budget split.            </p>            <p>              <strong>Success metric:</strong>              Landing page view rate first, then leads or purchases once tracking is confirmed.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Create a small click-to-message test with a clear qualification prompt, ticket enquiry copy, and automated first reply. Compare against current campaigns that are producing messaging blocks.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, and block volume. Do not judge until each variant has at least 3 messaging starts.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Retargeting test            </h3>            <p>              <strong>Setup:</strong>              Retarget users from landing page views, video views, page engagement, and post engagement with a direct ticket or enquiry offer.            </p>            <p>              <strong>Success metric:</strong>              Leads or purchases if tracking is fixed; otherwise landing page views and cost per landing page view as interim metrics.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No lead, purchase, conversion value, or ROAS actio
