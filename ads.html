campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 380,657.88</strong>        <small>          2026-07-14          to          2026-08-12        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>31,908,248</strong>        <small>          56,715,290 impressions          ·          1.78 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>863,304</strong>        <small>          2.06% CTR          ·          THB 0.33 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>81</strong>        <small>          THB 4,699.48 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>551</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 6.71</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account delivered very large reach and cheap traffic/engagement: 56,715,290 impressions, 31,908,248 reach, 863,304 link clicks, 393,835 landing page views, THB 380,657.88 spend, CTR 2.06%, CPC THB 0.33 and CPM THB 6.71. However, only 27 leads were reported and no purchase, revenue or ROAS data is present, so ticket-sales profitability cannot be assessed. Performance is mixed: awareness and traffic are strong, but budget is heavily concentrated in campaigns that are not producing leads or purchases.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget from non-converting awareness/follows campaigns into proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              Large spend is going to campaigns with no purchases and few or no leads, while small-spend campaigns such as &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot; and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot; produced 17 of 27 total leads from only THB 1,745.66 spend.            </p>            <p>              <strong>Do this:</strong>              Reduce budgets on high-spend non-lead campaigns and reallocate incrementally to the Malayalam and India Show campaigns, plus a controlled messaging test using the &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot; creative.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep and carefully scale the two campaigns with enough lead data            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot; produced 10 leads from THB 859.61 spend and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot; produced 7 leads from THB 886.05 spend. Both exceed the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Increase budgets gradually on these two campaigns, monitor lead volume, landing page views, messaging starts and lead quality before further scaling.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking before making purchase-performance decisions            </h3>            <p>              <strong>Why:</strong>              No purchase actions, revenue or ROAS are supplied. Daily data also shows leads and messaging actions on 2026-07-17 to 2026-07-22 despite zero impressions, clicks and spend.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI purchase tracking, lead de-duplication, landing page view tracking and attribution settings before judging ticket-sale profitability.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild high-spend traffic campaigns that do not generate leads            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;quot; spent THB 52,015.57 with 153,835 link clicks and 65,903 landing page views but 0 leads. &amp;quot;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;quot; spent THB 26,015.81 with 80,709 link clicks and 36,384 landing page views but 0 leads.            </p>            <p>              <strong>Do this:</strong>              Do not scale these as lead or ticket-sales campaigns. Rebuild with clearer lead/ticket CTA, retargeting layer and conversion/messaging objective tests.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Best proven lead and messaging performer in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              10 leads from THB 859.61 spend, 6,303 link clicks, 54 landing page views, 197 total messaging connections and 179 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale. Use this language/creative angle as the main lead-generation control.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging performance with enough results to make decisions.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              7 leads from THB 886.05 spend, 6,148 link clicks, 57 landing page views, 135 total messaging connections and 113 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and scale carefully. Test this creative with lead and messaging objectives.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Very strong early messaging signal, but lead volume is below the minimum decision threshold.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 165.83 spend, 217 link clicks, 49 messaging conversations started, 92 total messaging connections and 2 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not pause or over-scale based on only 2 leads. Run a controlled messaging test with more budget until it reaches at least 3 leads and stable conversation quality.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Strong traffic efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              72,485 link clicks, 37,830 landing page views, THB 2,109.22 spend, CTR 7.68%, CPC THB 0.03 and CPM THB 2.19.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic/upper-funnel campaign, but add retargeting into lead or messaging campaigns because it produced no reported leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Efficient awareness-to-traffic driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              137,320 link clicks, 71,176 landing page views, THB 4,137.11 spend, CTR 7.44%, CPC THB 0.03 and CPM THB 2.20.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for awareness/traffic. Use landing page viewers from this campaign for retargeting rather than judging it by purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong page/follower growth campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              21,271 page likes, 46,274 post reactions, 3,999 comments and THB 23,732.25 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth remains a business priority. Do not use it as a lead or purchase driver because it produced 0 reported leads and only 185 link clicks.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              High spend and traffic volume without lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 52,015.57 spend, 153,835 link clicks, 65,903 landing page views, 2 total messaging connections and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild. Test a stronger lead/ticket CTA, separate corporate lead form, and retargeting instead of broad traffic optimization.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend without lead conversion.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 26,015.81 spend, 80,709 link clicks, 36,384 landing page views, 1 total messaging connection and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild before scaling further.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Large spend for social actions, but weak for traffic, leads and messaging.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 33,299.61 spend, 693,996 impressions, 28,441 clicks, only 5 inline link clicks, 3,129 page likes, 7 messaging conversations started and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce if the primary goal is ticket sales or qualified leads. Keep only a capped budget if page likes are specifically required.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very cheap reach, but not producing lead or sales intent.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              21,805,680 impressions, THB 14,406.96 spend, CPM THB 0.66, 1,232,975 post engagements, only 3 link clicks, 2 messaging conversations started and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as low-cost visibility. Reduce or cap budget if prioritizing leads and ticket sales.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Works for engagement/video views but not for traffic or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 7,328.58 spend, 988,209 post engagements, 926,737 video views, CTR 0.14%, 1,480 link clicks, 25 messaging conversations started and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Use only for engagement. Build retargeting audiences from viewers/engagers instead of scaling it for lead or purchase outcomes.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13            </h3>            <p>              Click volume is strong, but tracked landing page views and leads are weak.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              8,168 link clicks, only 8 landing page views, THB 592.24 spend, 25 messaging conversations started and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause from this alone; first check landing page view tracking and destination setup, then retest.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13 and Claude | IN | English | India Show 2025 | Traffic | 2026-06-13              </strong>            </div>            <p>              The follows campaign spent THB 33,299.61 with 0 leads, while Malayalam and India Show together produced 17 leads from THB 1,745.66.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19 and Claude | IN | Corporates | 5 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Lead/messaging retargeting campaigns using landing page viewers and engagers              </strong>            </div>            <p>              The two corporate campaigns spent THB 78,031.38 combined with 234,544 link clicks and 102,287 landing page views but 0 leads.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Warm retargeting from video viewers, page engagers and landing page viewers              </strong>            </div>            <p>              The campaign is efficient for reach but produced only 3 link clicks and 0 leads from THB 14,406.96 spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Low-performing duplicated Broad Destination follows/likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN if follower growth is still required              </strong>            </div>            <p>              &amp;quot;AQ_MU2025_Followers_IN&amp;quot; generated 21,271 page likes from THB 23,732.25, while multiple Broad Destination follows/likes campaigns produced low or zero inline link clicks and no reliable lead volume.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Pure traffic campaigns with high clicks but no leads              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Conversion or messaging tests using the best-performing Malayalam, India Show and Start Your Day creatives              </strong>            </div>            <p>              Traffic volume is strong, but the account goal is profitable ticket sales and qualified leads.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead objective test using proven creatives            </h3>            <p>              <strong>Setup:</strong>              Duplicate &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot; and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot; into campaigns optimized for leads instead of traffic.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads per test campaign, lead volume, cost per lead and lead quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Messaging conversion test            </h3>            <p>              <strong>Setup:</strong>              Use the &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot; creative in a messaging objective campaign, with separate ad sets for broad, page engagers and landing page viewers.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, total messaging connections, lead count after at least 3 leads and message quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Warm retargeting from traffic and engagement audiences            </h3>            <p>              <strong>Setup:</strong>              Create retargeting audiences from 393,835 landing page views, 9,204,086 video views and page/post engagers. Send them to lead form, messaging or ticket page.            </p>            <p>              <strong>Success metric:</strong>              Leads, messaging conversations started, purchases if tracking is fixed, and cost per result.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Corporate campaign rebuild            </h3>            <p>              <strong>Setup:</strong>              Rebuild the Corporate 5-language and 6-language campaigns with a dedicated corporate/group booking CTA and lead form instead of broad traffic optimization.            </p>            <p>              <strong>Success metric:</strong>              Leads after minimum 3 results, messaging connections and qualified inquiry quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Landing page view tracking and destination test            </h3>            <p>              <strong>Setup:</strong>              Run a small controlled test using campaigns with abnormal link-click-to-landing-page-view ratios, such as &amp;quot;Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13&amp;quot; and &amp;quot;Claude | IN | English | Water Park &amp;amp; Interview | Traffic | 2026-06-13&amp;quot;.            </p>            <p>              <strong>Success metric:</strong>              Stable landing page view reporting relative to link clicks, leads and messaging starts.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase actions, purchase value, revenue or ROAS are supplied, so ticket-sales profitability cannot be evaluated.</li><li>Daily data shows actions on 2026-07-17 to 2026-07-22 with zero impressions, clicks and spend, indicating attribution lag or reporting inconsistency.</li><li>Several campaigns show very high link clicks but extremely low landing page views, such as &amp;quot;Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13&amp;quot; with 8,168 link clicks and 8 landing page views, and &amp;quot;Claude | IN | English | Water Park &amp;amp; Interview | Traffic | 2026-06-13&amp;quot; with 5,317 link clicks and 16 landing page views.</li><li>&amp;quot;IN | Image | Aquaverse Traffic | Test 1000INR&amp;quot; reports 93,947 inline link clicks versus 90,651 clicks, which should be checked for reporting consistency.</li><li>Lead actions appear under multiple action types, including onsite_conversion.lead, onsite_web_lead, lead, lead_grouped and offsite lead-related actions. Confirm de-duplication before using total lead counts for optimization.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep the account active but rebalance it. Maintain low-cost awareness and traffic only where it supports retargeting, reduce high-spend follows/visibility/corporate campaigns that are not producing leads, and carefully scale the Malayalam and India Show lead performers. Before optimizing for ticket sales, fix purchase/revenue tracking and resolve landing page view and attribu
