  .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-05        →        2026-09-03      </span>      <span class=&quot;pill&quot;>        24 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 111,428.29</strong>        <small>          2026-08-05          to          2026-09-03        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>10,335,453</strong>        <small>          18,382,351 impressions          ·          1.78 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>688</strong>        <small>          0.74% CTR          ·          THB 0.82 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 37,142.76 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>17</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 6.06</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement delivery is very strong, with 18,382,351 impressions, 10,335,453 reach, 2,013,702 page engagements and 1,870,994 video views from THB 111,428.29 spend. However, traffic, lead and purchase performance do not yet support the business goal of profitable ticket sales and qualified leads: only 688 inline link clicks, 17 messaging conversations started and 1 lead were recorded. Purchase performance cannot be assessed because no purchase, purchase value or ROAS data is present. Lead volume is below the minimum_results_before_decision of 3, so CPL conclusions are directional only.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Move budget away from follow/like campaigns that are not producing link traffic or leads            </h3>            <p>              <strong>Why:</strong>              The account spent THB 111,428.29 but recorded only 688 inline link clicks and 1 lead. The largest Broad Destination campaign spent THB 41,812.76 for only 6 inline link clicks, 10 messaging starts and 1 lead.            </p>            <p>              <strong>Do this:</strong>              Reduce spend on &amp;#039;Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination&amp;#039; campaign ID 120250948392580402 and rebuild part of that budget into dedicated lead, messaging or purchase-oriented campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild or cap campaigns labelled ERROR QUARANTINED            </h3>            <p>              <strong>Why:</strong>              Several campaigns carrying &amp;#039;ERROR QUARANTINED&amp;#039; in the name are spending while producing limited business-goal actions. The largest example, &amp;#039;ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers&amp;#039;, spent THB 9,845.93 and delivered 14,238,479 impressions but only 2 inline link clicks, 0 leads and 0 messaging starts.            </p>            <p>              <strong>Do this:</strong>              Create clean replacement campaigns with clear objectives and naming. Keep only a small capped awareness budget for the Young Adult Travellers campaign if cheap reach/video views are intentionally needed; otherwise move its budget to lead/messaging tests.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep but carefully control AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Why:</strong>              &amp;#039;AQ_MU2025_Followers_IN&amp;#039; is the strongest follower/engagement driver with 28,389 likes, 530,675 post engagements, 470,370 video views, 4,450 comments and 1,219 saves from THB 30,891.42 spend. However, frequency is already 4.03 and it generated only 213 inline link clicks.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign for awareness/follower growth, refresh creatives, and avoid aggressive scaling unless engagement quality remains stable. Do not treat it as a ticket-sales or lead campaign.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Scale New post engagement campaign carefully for low-cost traffic/engagement            </h3>            <p>              <strong>Why:</strong>              &amp;#039;New post engagement campaign&amp;#039; generated 464 inline link clicks, which is 67% of all account inline link clicks, while using only THB 2,625.47 spend. It also delivered 371,404 post engagements and 349,259 video views.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually and monitor inline link clicks, messaging starts and lead quality. Use it as a traffic/engagement bridge, not as proof of purchase performance.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix measurement before judging ticket-sales profitability            </h3>            <p>              <strong>Why:</strong>              No purchase events, purchase value or ROAS are supplied, and only 1 lead is recorded. Multiple lead action labels appear to reference the same single lead, creating ambiguity.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, lead event deduplication, purchase event firing, ticket confirmation events and UTM tracking before making profitability decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best follower and engagement campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 30,891.42 spend delivered 28,389 likes, 530,675 post engagements, 470,370 video views, 4,450 comments and 1,219 saves. CTR was 4.49% and CPC was THB 0.41.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for awareness/follower growth. Refresh creatives because frequency is 4.03. Do not scale heavily unless engagement efficiency holds.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best source of inline link clicks and very efficient broad engagement.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,625.47 spend delivered 464 inline link clicks, 371,404 post engagements, 349,259 video views and 3 messaging conversations started. CPM was THB 2.31.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale and use learnings from its post/creative format in lead or ticket-focused campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very efficient awareness reach and video-view volume, but not traffic or lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 9,845.93 spend delivered 14,238,479 impressions, 8,491,379 reach, CPM of THB 0.69 and 757,655 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is low-cost awareness/video reach. Cap or rebuild if the objective is ticket sales, leads or website traffic.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, campaign ID 120250948421480402            </h3>            <p>              Produced comparatively strong page-like volume within the Broad Destination duplicates.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,742.15 spend delivered 961 likes, 85 comments, 8,526 page engagements and 1 messaging conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              If keeping a Broad Destination follow/like variant, retain this only as a small controlled engagement test and compare against AQ_MU2025_Followers_IN.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, campaign ID 120250948392580402            </h3>            <p>              Largest spend concentration is not translating into traffic, leads or enough messaging efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 41,812.76 spend, 871,077 impressions, 33,393 clicks, but only 6 inline link clicks, 10 messaging conversations started and 1 lead. This single campaign used about 37.5% of account spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild into dedicated lead/messaging/purchase campaigns. Do not make a final CPL decision yet because only 1 lead is below the minimum of 3.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Strong awareness but extremely weak traffic and no lead signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              14,238,479 impressions and 5,177 clicks produced only 2 inline link clicks, 0 leads and 0 messaging starts from THB 9,845.93 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not use this campaign for ticket or lead goals. Rebuild with a clear objective or cap as awareness only.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, campaign ID 120250948394960402            </h3>            <p>              Poor traffic and weak follower efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,424.72 spend produced only 1 inline link click, 183 likes, 1 messaging conversation started and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate or reduce. Move spend to stronger engagement assets or a lead/messaging test.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, campaign ID 120250948398070402            </h3>            <p>              No measurable traffic, messaging or lead output despite meaningful spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,486.49 spend delivered 0 inline link clicks, 0 messaging starts and 0 leads, with 323 likes and 16,320 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Use the budget for campaigns optimized to business-goal actions.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              High engagement clicks but no link traffic or lead signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,201.39 spend, CTR 10.22%, 1,847 likes and 8,378 page engagements, but 0 inline link clicks, 0 leads and 0 messaging starts.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only if Thailand page-like growth is a separate objective. Otherwise reduce and move budget to lead or messaging campaigns.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, campaign ID 120250948392580402              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead/messaging/ticket-sales test campaign              </strong>            </div>            <p>              This campaign consumed THB 41,812.76 but produced only 6 inline link clicks, 10 messaging starts and 1 lead. Lead volume is insufficient for a CPL decision, but current spend is too concentrated in a follow/like setup.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaign for page engagers/video viewers with lead or ticket CTA              </strong>            </div>            <p>              It generated 8,491,379 reach and 757,655 video views but only 2 inline link clicks. Use the awareness pool for lower-funnel follow-up instead of continuing traffic expectations from this campaign.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate Broad Destination and ERROR QUARANTINED Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN and New post engagement campaign, plus one clean lower-funnel test              </strong>            </div>            <p>              Spend is fragmented across many similar campaigns with repeated names. The strongest clear performers are AQ_MU2025_Followers_IN for follower/engagement volume and New post engagement campaign for inline link clicks.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Tiny 2026-08-28 ERROR QUARANTINED Broad Destination campaigns with THB 4.26 to THB 7.06 spend              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                No immediate performance decision              </strong>            </div>            <p>              These campaigns have too little spend and delivery to judge. Do not pause based on performance alone; instead clean up naming/setup if they were accidental duplicates.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead objective test            </h3>            <p>              <strong>Setup:</strong>              Create a clean Leads campaign using either instant form or website lead conversion. Use budget moved from Broad Destination campaigns. Separate audiences from existing broad/follow campaigns and use clear ticket/lead qualification copy.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads before decision, then compare cost per lead, lead quality and downstream ticket intent.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated messaging campaign using the best engagement creative themes from AQ_MU2025_Followers_IN and New post engagement campaign. Add qualifying prompts related to ticket interest.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies and qualified conversations. Current account baseline is 17 conversations started from THB 111,428.29.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engager and video-view retargeting test            </h3>            <p>              <strong>Setup:</strong>              Retarget people who engaged with posts or watched videos generated by AQ_MU2025_Followers_IN, New post engagement campaign and Young Adult Travellers. Use direct ticket/lead CTA creative.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, leads, messaging replies and purchases once purchase tracking is verified.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Creative objective split test            </h3>            <p>              <strong>Setup:</strong>              Run the same top-performing post/creative concept in two clean campaigns: one engagement objective and one lead or traffic objective. Keep naming clear and avoid duplicate Broad Destination setups.            </p>            <p>              <strong>Success metric:</strong>              Compare inline link clicks, messaging starts and leads after each variant reaches at least 3 primary results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Follower campaign consolidation test            </h3>            <p>              <strong>Setup:</strong>              Consolidate follow/like activity into the strongest follower campaign, AQ_MU2025_Followers_IN, and one challenger variant. Exclude tiny or accidental duplicate ERROR QUARANTINED campaigns from the test.            </p>            <p>              <strong>Success metric:</strong>              Likes, page engagements, comments, saves and frequency. Watch AQ_MU2025_Followers_IN frequency, currently 4.03.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase actions, purchase value or ROAS are present, so profitable ticket sales cannot be evaluated from this dataset.</li><li>Only 1 lead was recorded across the account, below the minimum_results_before_decision of 3. Do not make a final CPL decision yet.</li><li>Lead actions appear under multiple labels, including onsite_conversion.lead, onsite_web_lead, lead, lead_grouped and offsite lead-related events. These may represent the same single lead and should be audited for deduplication.</li><li>There is a major gap between total clicks and inline link clicks: 136,225 clicks versus 688 inline link clicks. Most clicks are likely engagement/profile interactions rather than website traffic.</li><li>Multiple campaigns contain &amp;#039;ERROR QUARANTINED&amp;#039; in the campaign name and several campaigns share identical Broad Destination names, which creates setup and reporting ambiguity.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep AQ_MU2025_Followers_IN for awareness/follower growth and carefully scale New post engagement campaign for traffic/engagement learnings. Reduce and rebuild the largest Broad Destination and ERROR QUARANTINED campaigns into clean lead, messaging and ticket-sales tests. Do not judge CPL or purchase profitability until tracking is fixed and at least 3 leads or purchase events are recorded.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout
