    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 441,976.09</strong>        <small>          2026-07-02          to          2026-07-31        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>10,068,064</strong>        <small>          30,567,115 impressions          ·          3.04 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>508,880</strong>        <small>          2.61% CTR          ·          THB 0.55 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>33</strong>        <small>          THB 13,393.21 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>8</strong>        <small>          THB 55,247.01 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 3,476.00        </strong>        <small>          0.01× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>191</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 14.46</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated very large reach and traffic: 30,567,115 impressions, 508,880 link clicks, and 68,349 landing page views from THB 441,976.09 spend. However, bottom-funnel output was very limited: 11 leads and 8 purchases with THB 3,476 purchase value. The strongest conversion signal came from Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;, which produced 8 leads, 4 purchases, and 43 messaging conversations from only THB 2,216.80 spend. Budget is currently spread across many awareness, follower, traffic, corporate, and test campaigns, while several high-spend campaigns are driving clicks or engagement without leads or purchases.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward the only proven lead and purchase asset            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; is the only campaign above the minimum_results_before_decision threshold for both leads and purchases, with 8 leads, 4 purchases, 43 messaging conversations, and THB 2,176 purchase value from THB 2,216.80 spend.            </p>            <p>              <strong>Do this:</strong>              Carefully scale this campaign or rebuild it into structured Lead, Messaging, and Purchase campaigns using the same creative and offer. Increase budget gradually rather than making a large jump.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce follower and low-intent engagement budget            </h3>            <p>              <strong>Why:</strong>              FB Follow | Thailand | Aquaverse Lifestyle spent THB 53,508.19 and recorded only 3 likes, while FB Follow | Thailand | Lookalike Fans Scale spent THB 37,616.89 and recorded only 10 likes. These campaigns consumed THB 91,125.08 without meaningful lead or purchase contribution.            </p>            <p>              <strong>Do this:</strong>              Reduce these follower campaigns and reallocate budget to proven conversion, messaging, and high-quality traffic campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix traffic quality and landing page view leakage            </h3>            <p>              <strong>Why:</strong>              The account recorded 508,880 link clicks but only 68,349 omni landing page views, meaning most clicks did not become tracked landing page visits. Several campaigns show extreme gaps, including Claude | TH | Traffic IMAGES | 18Jun with 122,415 link clicks but 10,033 landing page views.            </p>            <p>              <strong>Do this:</strong>              Optimize traffic campaigns to landing page views instead of link clicks where possible, review destination load speed, UTMs, browser/app handoff, and pixel/CAPI event firing.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild corporate lead campaigns before spending more            </h3>            <p>              <strong>Why:</strong>              Aquaverse Corporate Groups - Leads - Test spent THB 12,830.22 with 0 leads, and TH | B2B Corporate | Video | Leads | 2026-06-18 spent THB 14,570.07 with 0 leads and frequency of 5.51.            </p>            <p>              <strong>Do this:</strong>              Reduce spend on these campaigns and rebuild with a clearer lead form, stronger corporate offer, and retargeting of users who clicked or watched videos.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best bottom-funnel campaign in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 2,216.80, 8 leads, 4 purchases, 43 messaging conversations started, 43 replies, and THB 2,176 purchase value. Cost per lead was THB 277.10 and cost per purchase was THB 554.20.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this creative and offer as the base for new Lead, Messaging, and Purchase tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Conversions Shopee | 12Jun            </h3>            <p>              Strong traffic quality for marketplace traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 4,130.24, 5,728 link clicks, 3,225 landing page views, and CTR 8.43%. Cost per landing page view was approximately THB 1.28.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for marketplace traffic, but do not judge by purchases unless Shopee purchase tracking is confirmed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Corporates | Thai | 2026-06-19            </h3>            <p>              Efficient corporate traffic quality.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 4,467.15, 6,043 link clicks, 3,287 landing page views, CTR 7.97%, and cost per landing page view approximately THB 1.36.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic source and retarget visitors with a dedicated corporate lead campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026            </h3>            <p>              Strong click and landing page view efficiency for ticket traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 1,834.77, 7,209 link clicks, 1,774 landing page views, CTR 12.88%, and cost per landing page view approximately THB 1.03.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale as a traffic/retargeting source, but pair with purchase retargeting because no purchases were recorded.            </div>          </div> 6a34a;  }  .finding-grid {    display: grid;    grid-template-columns: repeat(2, minmax(0, 1fr));    gap: 14px;  }  .finding {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .finding.positive {    border-left: 5px solid #16a34a;  }  .finding.negative {    border-left: 5px solid #dc2626;  }  .finding h3 {    margin: 0 0 8px;    font-size: 16px;  }  .finding p {    margin: 0 0 10px;    color: #526077;  }  .evidence,  .recommendation {    font-size: 13px;    margin-top: 7px;    color: #445168;  }  .budget-row {    display: grid;    grid-template-columns: 1fr 40px 1fr;    gap: 12px;    align-items: center;    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-02        →        2026-07-31      </span>      <span class=&quot;pill&quot;>        83 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,322,561.09</strong>        <small>          2026-07-02          to          2026-07-31        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>68,492,716</strong>        <small>          169,079,542 impressions          ·          2.47 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>4,594,462</strong>        <small>          3.22% CTR          ·          THB 0.24 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>276</strong>        <small>          THB 4,791.89 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 661,280.55 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2,299</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.82</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large reach and traffic in July: 169,079,542 impressions, 4,594,462 link clicks, 1,323,215 landing page views and THB 1,322,561.09 spend. Lead volume was measurable at 92 leads, but purchases were only 2, which is below the minimum_results_before_decision of 3, so purchase performance is insufficient for a firm decision. The account is mixed: several small-to-medium spend campaigns are producing leads and messaging efficiently, while a large share of budget is tied up in awareness, traffic, follower/like, and video campaigns that are not producing leads or purchases.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              The strongest lead producers are much more efficient than the account average CPL of THB 14,375.66.            </p>            <p>              <strong>Do this:</strong>              Carefully scale Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13 by 15-25% budget increments while monitoring lead quality and messaging depth.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce high-spend traffic/video campaigns with no leads            </h3>            <p>              <strong>Why:</strong>              Claude | IN | Corporates | 6 Languages | 2026-06-19 spent THB 232,448.63 with 742,187 link clicks and 194,359 landing page views but 0 leads and 0 purchases. Claude | IN | Corporates | 5 Languages | 2026-06-19 spent THB 107,677.87 with 347,842 link clicks and 102,192 landing page views but 0 leads and 0 purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce these Corporates campaigns materially and rebuild them with lead or messaging objectives, stronger ticket/lead CTAs, and retargeting from landing page viewers instead of continuing broad traffic delivery.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness/follower activity from lead generation budget            </h3>            <p>              <strong>Why:</strong>              Follows/Likes campaigns generated likes, comments and video views, but most produced very few inline link clicks and little lead volume. Example: Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers spent THB 15,983.60, reached 11,909,100 people, had 0 inline link clicks, and no leads.            </p>            <p>              <strong>Do this:</strong>              Create a fixed awareness/follower budget cap and stop allowing these campaigns to compete with lead/ticket-sale campaigns for performance budget.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking and attribution before judging purchase performance            </h3>            <p>              <strong>Why:</strong>              There are 2 purchases in the account, below the decision threshold of 3, and several reporting anomalies exist, including actions on days with 0 spend/impressions and campaigns with leads despite extremely low landing page views.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI purchase and lead events, attribution windows, landing page view tracking, and campaign-to-event mapping before making purchase scaling decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best observed lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,121.34 spend, 17 leads, estimated CPL THB 124.78, 336 messaging conversations started, 500 total messaging connections, and 1 purchase. Purchase count is below the minimum threshold, but lead volume is sufficient.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Duplicate into a controlled lead/messaging campaign and test 2-3 new creatives based on the same message angle.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging performance from low spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,071.81 spend, 26 leads, estimated CPL THB 156.61, 584 messaging conversations started, 651 total messaging connections, CTR 2.10%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Use this campaign as a source for lead-form, messaging, and retargeting tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong qualified-action volume relative to spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,050.31 spend, 24 leads, estimated CPL THB 168.76, 625 messaging conversations started, 670 total messaging connections.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Prioritize Malayalam creative and audience learnings in new lead-generation tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Efficient top-of-funnel traffic and landing page volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 21,801.75 spend, 775,535 link clicks, 243,513 landing page views, CTR 7.37%, CPC THB 0.03, estimated cost per landing page view THB 0.09.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for traffic/retargeting pool building, but do not judge it by purchases. Build retargeting audiences from its landing page viewers.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Very efficient traffic campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 11,708.87 spend, 425,720 link clicks, 133,757 landing page views, CTR 7.68%, CPC THB 0.03, estimated cost per landing page view THB 0.09.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a low-cost traffic source, then retarget landing page viewers with lead/ticket-sale messaging.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;Let’s have fun together and make every moment...&amp;quot;            </h3>            <p>              High click engagement from a small budget.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,342.24 spend, CTR 12.92%, 11,173 link clicks, 4,775 landing page views, estimated cost per landing page view THB 0.28.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not scale aggressively yet because there are no leads reported. Test this creative in a lead or messaging campaign.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              High spend is not translating into leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 232,448.63 spend, 742,187 link clicks, 194,359 landing page views, 9,947,061 video views, but 0 leads and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild. Use a lead/messaging objective, corporate group-offer creative, and retargeting instead of broad traffic/video optimization.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Large traffic volume with no lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 107,677.87 spend, 347,842 link clicks, 102,192 landing page views, 4,332,667 video views, but 0 leads and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild before further scaling. Move budget to proven lead campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              High spend and landing page volume with no leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 63,912.41 spend, 183,226 link clicks, 64,680 landing page views, 1,831,514 video views, but 0 leads and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce. Test family-specific lead creatives and offers before restoring spend.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              Traffic is not converting to leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 61,054.41 spend, 221,960 link clicks, 70,188 landing page views, 2,297,127 video views, but 0 leads and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and move budget into campaigns that have proven lead volume.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19            </h3>            <p>              Good traffic volume but no lower-funnel result.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 61,282.33 spend, 299,758 link clicks, 103,022 landing page views, 2,895,543 video views, but 0 leads and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce unless the objective is purely awareness. Rebuild with a lead or ticket-sale CTA.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-28 | 4. Young Adult Travellers            </h3>            <p>              Follower/engagement delivery is not contributing meaningfully to traffic or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 24,369.00 spend, 2,864 likes, 207 comments, 418,049 video views, only 24 inline link clicks and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only inside a capped awareness/follower budget. Do not fund from performance budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-27 | 4. Young Adult Travellers            </h3>            <p>              High engagement but minimal site traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 23,165.10 spend, 2,225 likes, 643 comments, 267,755
