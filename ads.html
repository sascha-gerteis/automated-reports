     <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 13.25</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness/follower activity is generating large engagement volume: 261,903 page engagements, 212,397 video views, 16,796 likes, and 49,640 total clicks from 21,487.08 THB spend. However, business-goal signals are weak or missing: only 2,472 inline link clicks, 36 landing page views, 1 messaging conversation started, and no supplied lead or purchase actions. Budget is heavily concentrated in AQ_MU2025_Followers_IN, which is strong for engagement but not currently supporting ticket sales or qualified leads.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix website and conversion tracking before judging ticket sales performance            </h3>            <p>              <strong>Why:</strong>              The account recorded 2,472 inline link clicks but only 36 landing page views, and no supplied purchase or lead actions. Purchase and lead performance cannot be evaluated yet.            </p>            <p>              <strong>Do this:</strong>              Audit pixel, events, domain, URL parameters, landing page load, redirects, and event mapping. Confirm landing_page_view, lead, and purchase events fire correctly before increasing ticket-sales budget.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce reliance on AQ_MU2025_Followers_IN for business outcomes            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN spent 16,720.84 THB, or about 78% of account spend, but generated only 56 inline link clicks and no supplied lead or purchase events.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign only as an awareness/follower layer at a reduced budget. Move freed budget into tracked ticket-sales, lead, and retargeting tests once tracking is verified.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale Aquaverse India | Instagram Followers | 2026-09-27 only after resolving landing page view loss            </h3>            <p>              <strong>Why:</strong>              This campaign is the strongest traffic source with 2,418 inline link clicks from 3,523.83 THB spend, 5.55 THB CPM, and 421,181 reach, but only 36 landing page views were recorded.            </p>            <p>              <strong>Do this:</strong>              Do not aggressively scale yet. First check destination quality and tracking, then increase budget gradually if landing page views and downstream events improve.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild the high-CPM follow/like campaign            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination has the highest CPM at 98.16 THB, spent 1,242.41 THB, and produced 0 inline link clicks.            </p>            <p>              <strong>Do this:</strong>              Reduce budget and rebuild with new creative, broader placements, and clearer follower objective. Compare against AQ_MU2025_Followers_IN on cost per like/follow and engagement quality.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness and engagement rm. Use learnings from high CTR, but rebuild to lower CPM and improve efficiency.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Account overall            </h3>            <p>              Business-goal tracking is insufficient for profitable ticket sales or qualified lead decisions.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across 21,487.08 THB spend there were no supplied purchase actions, no supplied lead actions, only 36 landing page views, and only 1 messaging conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make ROAS, CPA, or lead-quality decisions yet. Fix tracking and run dedicated purchase/lead campaigns until each has at least 3 results.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Overfunded relative to traffic and business outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 16,720.84 THB and generated only 56 inline link clicks, equal to about 298.59 THB per inline link click. Frequency is also the highest campaign frequency at 4.02.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget, refresh creative, and use this campaign mainly for awareness or audience building rather than ticket sales.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              High CPM and no outbound/link-click contribution.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CPM was 98.16 THB, much higher than the account CPM of 13.25 THB. The campaign recorded 0 inline link clicks from 12,657 impressions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild rather than scale. Test new creative, placements, and audience structure before assigning more budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Post-click performance or tracking is weak.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The campaign produced 2,418 inline link clicks but only 36 landing page views, a very low click-to-landing-page-view count. It also recorded 269 messaging_block actions but only 1 messaging conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep the campaign active at controlled budget, but audit destination, tracking, and messaging setup before scaling.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Tracked ticket-sales, lead, and retargeting tests              </strong>            </div>            <p>              This campaign used about 78% of spend and is strong for engagement, but produced only 56 inline link clicks and no supplied lead or purchase actions.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <p>              Aquaverse India | Instagram Followers | 2026-09-27 has much lower CPM at 5.55 THB and generated 2,418 inline link clicks, while the Daily Follows Likes campaign had 98.16 THB CPM and 0 inline link clicks.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current awareness-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Smaller awareness layer plus new conversion/lead campaigns              </strong>            </div>            <p>              Awareness metrics are strong, but there are no supplied purchases or leads. Budget should be reserved for campaigns optimized to measurable business outcomes once tracking is fixed.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Website purchase tracking test            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated ticket-sales campaign optimized for purchase only after confirming purchase and landing_page_view events fire correctly. Use clean UTM parameters and one verified ticket destination.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 purchase results. Use attributed purchases, cost per purchase, and landing page view to purchase flow.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Lead form vs website lead test            </h3>            <p>              <strong>Setup:</strong>              Run one instant form lead campaign against one website lead campaign using the same offer and audience structure.            </p>            <p>              <strong>Success metric:</strong>              Compare cost per lead and lead volume only after each route has at least 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Retargeting from engagers and video viewers            </h3>            <p>              <strong>Setup:</strong>              Build retargeting audiences from page engagers, post engagers, and video viewers generated by AQ_MU2025_Followers_IN and show ticket or inquiry creative.            </p>            <p>              <strong>Success metric:</strong>              Judge by leads, purchases, or messaging conversations after at least 3 results, not by engagement alone.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Creative test for Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              <strong>Setup:</strong>              Test 3-5 creatives with clear ticket or inquiry calls to action while keeping audience and budget stable.            </p>            <p>              <strong>Success metric:</strong>              Primary: landing page views and downstream leads or purchases. Secondary: inline link clicks and CPM.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Messaging campaign rebuild            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated click-to-message campaign with qualifying questions and a clear ticket/inquiry prompt. Exclude users who already blocked messaging if possible.            </p>            <p>              <strong>Success metric:</strong>              Evaluate after at least 3 messaging conversations started. Track conversation started, first reply, and qualified inquiry count.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>Only 36 landing page views were recorded from 2,472 inline link clicks across the account. This suggests a landing page, redirect, event, or attribution setup issue.</li><li>No supplied purchase actions and no supplied lead actions are present, so profitable ticket sales and qualified lead performance cannot be evaluated.</li><li>Aquaverse India | Instagram Followers | 2026-09-27 recorded 269 messaging_block actions
