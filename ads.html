.ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-25        →        2026-09-23      </span>      <span class=&quot;pill&quot;>        14 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 33,896.30</strong>        <small>          2026-08-25          to          2026-09-23        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>435,084</strong>        <small>          1,672,194 impressions          ·          3.84 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>80</strong>        <small>          3.49% CTR          ·          THB 0.58 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 20.27</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement volume is strong, led by AQ_MU2025_Followers_IN, which generated most impressions, likes, video views, and engagement at the lowest internal costs. However, the account is not currently proving progress toward the stated business goal of profitable ticket sales and qualified leads: no purchases or leads are reported, only 80 inline link clicks were recorded from 33,896.30 THB spend, and only 1 messaging conversation was started. Traffic, lead, messaging, and purchase performance cannot be judged as profitable from the supplied data.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from duplicated ERROR QUARANTINED follower campaigns            </h3>            <p>              <strong>Why:</strong>              The ERROR QUARANTINED campaigns spent 11,147.31 THB combined and produced only 1 inline link click and 1 messaging conversation, while their cost per like was materially worse than AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Do this:</strong>              Reduce or pause the higher-spend ERROR QUARANTINED campaigns with sufficient engagement volume, especially the 2026-08-23 and 2026-08-25 variants, and reallocate that spend into a clean lead or ticket-sales campaign structure.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN but do not rely on it for ticket sales            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN is the strongest awareness/follower campaign, with 20,680 likes, 359,456 post engagements, 323,855 video views, 79 inline link clicks, 22,748.99 THB spend, 16.03 THB CPM, and approximately 1.10 THB cost per like.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign active for awareness and retargeting pool growth. Scale carefully only if cost per like and engagement efficiency remain close to current levels, but cap it as a support campaign rather than the main ticket-sales driver.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Launch dedicated lead and ticket-sales campaigns            </h3>            <p>              <strong>Why:</strong>              The current campaign mix is dominated by followers/likes. No lead actions and no purchase actions are reported, so spend is not being directed toward the stated business goal.            </p>            <p>              <strong>Do this:</strong>              Create separate campaigns for lead generation and ticket sales using clear conversion-focused creative, ticket/offer messaging, and retargeting audiences built from the 380,136 page engagements and 323,855 video views generated by AQ_MU2025_Followers_IN.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix reporting and attribution before judging profitability            </h3>            <p>              <strong>Why:</strong>              The account shows 58,382 clicks but only 80 inline link clicks, no purchase events, no lead events, and only 1 messaging conversation. This prevents a reliable assessment of ticket sales or qualified leads.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel, Conversions API, purchase event, lead event, landing page view tracking, UTMs, and CRM/offline lead capture before scaling sales or lead campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best-performing awareness and follower campaign in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 22,748.99 THB and generated 1,419,356 impressions, 309,503 reach, 20,680 likes, 359,456 post engagements, 323,855 video views, 79 inline link clicks, 3.43% CTR, 0.467 THB CPC, and 16.03 THB CPM. Approximate cost per like is 1.10 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale for awareness, but use the audience it creates for retargeting rather than expecting it alone to drive ticket sales.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong retargeting audience creation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              This campaign produced 380,136 page engagements, 359,456 post engagements, 323,855 video views, 2,692 comments, 2,235 shares/posts, and 921 saves.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Build retargeting audiences from video viewers, post engagers, page engagers, commenters, and savers, then run lead or ticket-sales ads to those warmer users.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Media buying efficiency is stronger than the quarantined campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              AQ_MU2025_Followers_IN delivered 16.03 THB CPM and approximately 1.10 THB cost per like, while the combined ERROR QUARANTINED campaigns delivered approximately 5.88 THB cost per like and higher CPMs across most larger-spend variants.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use AQ_MU2025_Followers_IN as the control campaign for awareness efficiency and benchmark new follower/engagement tests against it.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Inefficient follower/engagement delivery versus AQ_MU2025_Followers_IN.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 4,008.89 THB, generated 695 likes, 17,326 post engagements, 16,395 video views, 0 inline link clicks, 50.25 THB CPM, and approximately 5.77 THB cost per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild this campaign if it is still active. Move budget into AQ_MU2025_Followers_IN or a new lead/ticket-sales campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Multiple duplicated variants are spending inefficiently and creating fragmentation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The three 2026-08-25 variants spent 4,940.31 THB combined and generated 762 likes, only 1 inline link click, and only 1 messaging conversation. Individual CPMs were 29.04 THB, 47.16 THB, and 58.67 THB, all above AQ_MU2025_Followers_IN at 16.03 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate or pause the duplicated 2026-08-25 ERROR QUARANTINED variants with sufficient engagement data and rebuild as one clean campaign if follower growth is still needed.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              The variant with 2,430.56 THB spend is particularly weak for traffic and messaging.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 2,430.56 THB, generated 354 likes, 9,936 post engagements, 1 inline link click, and 1 messaging conversation. Messaging result volume is below the minimum_results_before_decision of 3, so messaging performance is inconclusive, but traffic output is very limited.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale this setup. Rebuild with a clear messaging or lead objective if conversations are desired.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Five fragmented variants are producing engagement but no meaningful traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The five 2026-08-30 variants spent 2,173.60 THB combined, generated 430 likes, 12,410 post engagements, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and consolidate these variants. If awareness is needed, route budget to AQ_MU2025_Followers_IN; if sales or leads are needed, rebuild under lead or sales objectives.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data for a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The four 2026-08-28 variants spent only 24.51 THB combined, with individual spends between 4.26 THB and 7.06 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on performance from this tiny sample alone. If these are inactive quarantine remnants, clean them up operationally; otherwise allow a controlled test before judging.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED campaigns combined              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead generation and ticket-sales campaigns              </strong>            </div>            <p>              They spent 11,147.31 THB and produced only 1 inline link click and 1 messaging conversation, with no reported leads or purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN or retargeting campaigns              </strong>            </div>            <p>              The 2026-08-23 campaign had approximately 5.77 THB cost per like and 50.25 THB CPM, while AQ_MU2025_Followers_IN had approximately 1.10 THB cost per like and 16.03 THB CPM.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicated 2026-08-25 and 2026-08-30 ERROR QUARANTINED variants              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Consolidated campaign structure              </strong>            </div>            <p>              Budget is split across many campaigns with the same naming pattern, creating fragmentation and weaker delivery. These variants generated follower/engagement activity but almost no inline link clicks.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Pure follower/like allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting of AQ_MU2025_Followers_IN engagers and video viewers              </strong>            </div>            <p>              AQ_MU2025_Followers_IN created large warm audiences: 380,136 page engagements, 359,456 post engagements, and 323,855 video views. These audiences should now be tested for leads or ticket sales.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead generation campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated Meta lead form campaign using ticket inquiry, group booking, birthday/event, or travel-intent messaging. Exclude existing low-quality engagers if lead quality is poor. Run until at least 3 leads are recorded before making a decision.            </p>            <p>              <strong>Success metric:</strong>              Cost per qualified lead and lead quality from CRM or manual follow-up.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket-sales retargeting test            </h3>            <p>              <strong>Setup:</strong>              Create retargeting ad sets from AQ_MU2025_Followers_IN page engagers, post engagers, video viewers, commenters, and savers. Use direct ticket offer creative with price, urgency, location, and booking CTA.            </p>            <p>              <strong>Success metric:</strong>              Purchases, cost per purchase, and ROAS if purchase tracking is active; otherwise landing page views and downstream ticket inquiries as interim metrics.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Traffic quality test using landing page views            </h3>            <p>              <strong>Setup:</strong>              Run a small traffic campaign optimized for landing page views rather than broad clicks. Compare ticket-focused creative against generic attraction creative.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, and subsequent lead or purchase events once tracking is confirmed.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Creative intent test            </h3>            <p>              <strong>Setup:</strong>              Test at least two creative angles: one focused on entertainment/experience and one focused on ticket offer or booking urgency. Use the same audience and budget split to isolate creative impact.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, landing page views, leads, purchases, and engagement quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Clean follower campaign rebuild            </h3>            <p>              <strong>Setup:</strong>              If follower growth remains a secondary goal, rebuild the ERROR QUARANTINED follower campaigns into one clean campaign and compare it directly against AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Success metric:</strong>              Cost per like, CPM, post engagement cost, and audience quality versus AQ_MU2025_Followers_IN.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase actions are reported, so ticket-sales performance and ROAS cannot be assessed.</li><li>No lead actions are reported, so cost per lead and lead quality cannot be assessed.</
