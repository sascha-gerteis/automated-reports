    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-10-02        →        2026-10-31      </span>      <span class=&quot;pill&quot;>        6 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 18,164.10</strong>        <small>          2026-10-02          to          2026-10-31        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,272,788</strong>        <small>          2,446,263 impressions          ·          1.92 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>16,134</strong>        <small>          2.16% CTR          ·          THB 0.34 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>8</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.43</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated large awareness and engagement volume with 2,446,263 impressions, 304,804 page engagements, 263,706 video views, 16,134 link clicks, and 5,640 landing page views from THB 18,164.10 spend. However, no purchases, purchase value, ROAS, or lead actions are reported, so profitable ticket sales and qualified lead performance cannot be judged. Traffic performance is heavily concentrated in one campaign: India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy produced 4,732 of 5,640 landing page views from only THB 1,043.37 spend.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward the strongest traffic campaign            </h3>            <p>              <strong>Why:</strong>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy generated 7,725 link clicks and 4,732 landing page views at THB 0.14 per link click and THB 0.22 per landing page view, far better than the rest of the account.            </p>            <p>              <strong>Do this:</strong>              Carefully scale India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy by 20-30% budget increments while monitoring landing page view cost, link click volume, and downstream leads or purchases if tracking is added.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on low-quality follower traffic            </h3>            <p>              <strong>Why:</strong>              Aquaverse India | Instagram Followers | 2026-09-27 spent THB 5,109.59 and produced 3,098 link clicks but only 30 landing page views, a 0.97% landing-page-view-to-link-click rate and THB 170.32 per landing page view.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign and rebuild it if traffic or leads are required. Use landing page view, lead, or purchase optimization instead of follower-focused delivery.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate follower growth from ticket sales and lead generation            </h3>            <p>              <strong>Why:</strong>              Several campaigns are follower or engagement oriented and should not be judged by purchases, but the business goal is ticket sales and qualified leads.            </p>            <p>              <strong>Do this:</strong>              Keep follower campaigns only for audience building. Create separate lead or purchase campaigns with proper conversion tracking before allocating major budget to the business goal.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit conversion and event tracking immediately            </h3>            <p>              <strong>Why:</strong>              The account reports 5,640 landing page views but no purchases, leads, ROAS, or conversion value. Targets are unknown because all target values are 0.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI events for ViewContent, Lead, InitiateCheckout, and Purchase, and confirm ticket purchase value is being passed back to Meta.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Investigate messaging quality issues            </h3>            <p>              <strong>Why:</strong>              The account recorded only 8 messaging conversations started and 7 first replies, but 1,245 messaging blocks. This indicates poor message flow quality, audience mismatch, or tracking/configuration issues.            </p>            <p>              <strong>Do this:</strong>              Review click-to-message setup, automated replies, welcome messages, and audience exclusions before scaling messaging activity.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              Best traffic and landing page view performer by a wide margin.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,043.37 and generated 7,725 link clicks, 4,732 landing page views, 73,748 impressions, 10.46% CTR, THB 0.14 CPC, and THB 0.22 per landing page view. It produced 83.9% of all account landing page views from only 5.7% of spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. This is the clearest budget winner, but add lead or purchase tracking before judging ticket sales quality.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Strong awareness and video engagement volume at low delivery cost.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 1,359,745 impressions, 201,677 post engagements, 193,075 video views, and 877 landing page views from THB 6,605.85 spend. CPM was THB 4.86 and cost per post engagement was approximately THB 0.03.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an awareness or retargeting-audience builder, but do not treat it as a proven lead or purchase driver.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Efficient for page-like and engagement growth, not traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 5,456 likes, 8,858 post reactions, 792 comments, and 58,343 page engagements from THB 3,935.23 spend. Cost per like was approximately THB 0.72.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower/community growth is a valid objective. Limit budget if ticket sales or leads are the main priority.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Daily account performance from 2026-10-25 to 2026-10-31            </h3>            <p>              Traffic quality improved sharply late in the period.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The final 7 days generated 9,436 link clicks and 4,868 landing page views from THB 5,795.29 spend, representing 86.3% of all landing page views with 31.9% of total spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use this period as the current optimization baseline and identify which ads, placements, and audiences drove the improvement.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality is very weak despite large spend and click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 5,109.59, generated 3,098 link clicks, but only 30 landing page views. Cost per landing page view was THB 170.32, compared with THB 0.22 in India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild around landing page views, leads, or purchases. Check destination URL, placement quality, and accidental click sources.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Good awareness performance but weak for qualified traffic or messaging outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent the most in the account at THB 6,605.85 and generated 877 landing page views at THB 7.53 each, plus only 4 messaging conversations started at THB 1,651.46 each.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale for sales or leads yet. Keep only controlled awareness budget or rebuild into a conversion-focused structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy            </h3>            <p>              Expensive delivery and weak traffic output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,239.29 with CPM of THB 84.20, CPC of THB 0.96, only 1 link click, and no landing page views. It generated 1,134 likes, but cost per like was approximately THB 1.09, worse than AQ_MU2025_Followers_IN at approximately THB 0.72.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause as a follower campaign and move budget to AQ_MU2025_Followers_IN if follower growth is needed, or to India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy if traffic is needed.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Small campaign with high delivery cost and no link traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 230.77, CPM was THB 64.05, CPC was THB 0.93, and inline link clicks were 0. It generated 175 likes at approximately THB 1.32 per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale. Rebuild creative/audience or consolidate budget into better-performing follower campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-level lead and purchase performance            </h3>            <p>              No measurable lead or purchase performance is available.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across THB 18,164.10 spend, the data shows 0 reported leads, 0 purchases, 0 purchase value, and no ROAS.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make profitability decisions until lead and purchase tracking is implemented and each campaign has at least 3 results.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy              </strong>            </div>            <p>              Aquaverse India | Instagram Followers | 2026-09-27 spent THB 5,109.59 for only 30 landing page views, while India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy produced 4,732 landing page views from THB 1,043.37.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <p>              If follower growth is required, AQ_MU2025_Followers_IN is more efficient with approximately THB 0.72 per like versus approximately THB 1.09 per like for the copy campaign.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead or purchase campaign after tracking is fixed              </strong>            </div>            <p>              AQ Operator CBO is useful for awareness but has only 4 messaging conversations started and no reported leads or purchases from THB 6,605.85 spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Broad follower/engagement allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Traffic and conversion allocation              </strong>            </div>            <p>              Follower and engagement campaigns produced large engagement volume, but the business goal is profitable ticket sales and qualified leads, which are not currently measured.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Scale test for India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              <strong>Setup:</strong>              Increase budget by 20-30% and duplicate the best-performing ads into a controlled test campaign. Keep the same landing page and compare performance over several days.            </p>            <p>              <strong>Success metric:</strong>              Maintain low cost per landing page view near the current THB 0.22 level while increasing total landing page views.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Landing page view objective versus link click objective            </h3>            <p>              <strong>Setup:</strong>              Run the same creative and audience in two campaigns or ad sets: one optimized for link clicks and one optimized for landing page views.            </p>            <p>              <strong>Success metric:</strong>              Lower cost per landing page view and higher landing-page-view-to-link-click rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Lead generation campaign            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated Meta lead form campaign for ticket inquiries or qualified visitor intent. Use clear qualifying questions and exclude recent leads if available.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads before making a decision, then compare cost per lead and lead quality. Target cost is unknown, so judge relative to other tests.            </p>
