  .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-06        →        2026-09-04      </span>      <span class=&quot;pill&quot;>        22 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 102,415.30</strong>        <small>          2026-08-06          to          2026-09-04        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>9,472,112</strong>        <small>          16,757,926 impressions          ·          1.77 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>659</strong>        <small>          0.76% CTR          ·          THB 0.81 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 34,138.43 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>14</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 6.11</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement volume is strong: 16,757,926 impressions, 9,472,112 reach, 1,865,408 page engagements and 1,730,270 video views from THB 102,415.30 spend. However, the account is not yet proving the business goal of profitable ticket sales and qualified leads: only 1 lead is reported, 14 messaging conversations started, and no purchase or ROAS data is present. Most spend is concentrated in followers, likes, visibility, and engagement campaigns rather than lead or purchase optimization.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild the account around lead and ticket-sale outcomes            </h3>            <p>              <strong>Why:</strong>              The business goal is ticket sales and qualified leads, but the account generated only 1 reported lead and no purchase data from THB 102,415.30 spend.            </p>            <p>              <strong>Do this:</strong>              Create dedicated lead and purchase/conversion campaigns instead of relying on followers, likes, visibility, and post engagement campaigns to produce downstream results.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend from the largest low-intent campaign            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination spent THB 38,050.17, the highest campaign spend, but produced only 1 lead, 5 inline link clicks, and 9 messaging conversations started.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign and move budget into a clean lead or purchase test. Do not make a final CPL decision yet because the campaign has only 1 lead, below the minimum_results_before_decision of 3.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Pause new spend into ERROR QUARANTINED campaign structures and rebuild clean versions            </h3>            <p>              <strong>Why:</strong>              Multiple campaigns contain ERROR QUARANTINED in the name and are fragmented across similar audiences. The largest, ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers, spent THB 8,956.06 and delivered 12,821,812 impressions but only 1 inline link click and no leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Stop launching additional quarantined duplicates. Rebuild clean campaigns with clear objectives, naming, budget ownership, and conversion tracking. Do not judge the tiny 2026-08-28 variants because they spent only THB 4.26 to THB 7.06.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN for follower acquisition but do not scale aggressively            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN is the strongest follower campaign with 27,772 likes from THB 30,347.87 spend, but frequency is already 4.01 and it produced no leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep as a capped awareness/follower campaign, refresh creatives, and prevent it from taking budget needed for lead or ticket-sale campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix purchase and lead attribution visibility            </h3>            <p>              <strong>Why:</strong>              No purchase actions, purchase value, or ROAS are reported. Lead actions appear duplicated across several event types but total lead volume is only 1.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, purchase event firing, lead event deduplication, booking/ticket confirmation tracking, and UTM consistency before judging profitability.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 30,347.87 spend delivered 27,772 likes, 547,624 page engagements, 519,852 post engagements, 461,420 video views, 4.43% CTR, and THB 0.41 reported CPC.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep, but cap budget and refresh creative because frequency is 4.01 and there are no reported leads or purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Efficient engagement and strongest source of inline link clicks.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,539.88 spend delivered 357,269 post engagements, 444 inline link clicks, 336,461 video views, and 3 messaging conversations started. It generated 444 of the account&amp;#039;s 659 inline link clicks while using a small share of total spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a low-budget engagement and retargeting-seed campaign. Carefully scale only if downstream tracking shows these users later convert.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very efficient pure reach and video-view delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 8,956.06 spend delivered 12,821,812 impressions, 7,727,121 reach, THB 0.70 CPM, and 673,482 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use only if the objective is broad awareness. Do not use this structure for traffic, leads, or ticket sales because it generated only 1 inline link click.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Generated page likes despite high delivery cost.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,054.99 spend delivered 1,798 likes, 7,920 page engagements, 138 comments, and 10.45% reported CTR.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              If Thailand follower growth is required, rebuild a clean non-quarantined version and test against the existing Thailand Daily campaign.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Largest spend is not translating into meaningful business outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 38,050.17 spend produced 793,394 impressions, 29,592 clicks, only 5 inline link clicks, 1 lead, and 9 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild toward lead or purchase optimization. Do not fully judge lead efficiency yet because only 1 lead is below the minimum decision threshold of 3.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Excellent reach but almost no traffic or business-intent action.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              12,821,812 impressions and 682,368 page engagements, but only 1 inline link click, no leads, no messaging conversations started, and no purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause for performance objectives. Keep only a small awareness allocation if low-cost reach is strategically needed.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Duplicate campaign structure is fragmented and inefficient.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Multiple campaigns share the same name. One spent THB 1,412.04 with 1 inline link click and 102 likes; another spent THB 2,457.18 with 0 inline link clicks and 163 likes; another spent THB 2,232.39 with 1 inline link click, 870 likes, and 1 messaging conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate duplicate campaigns into fewer controlled tests so budget and learning are not split across repeated structures.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Spend is going to follower/engagement activity without downstream results.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,304.20 spend delivered 762 likes and 19,292 page engagements, but 0 inline link clicks, 0 leads, 0 messaging conversations, and no purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild as a clean campaign with a clearer objective. Do not allocate more budget unless the goal is only page engagement or follower growth.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data to judge performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Several 2026-08-28 variants spent only THB 4.26 to THB 7.06 with 29 to 58 impressions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on performance. Exclude from decision-making until they have meaningful delivery, or clean up only for structural/naming reasons.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead or ticket-sale conversion campaign              </strong>            </div>            <p>              This campaign spent THB 38,050.17 but generated only 1 lead, 5 inline link clicks, and 9 messaging conversations started. Budget should move closer to the business goal.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaign built from video viewers, page engagers, and website visitors              </strong>            </div>            <p>              The campaign created a very large awareness pool with 673,482 video views and 682,368 page engagements, but only 1 inline link click. Use the audience for warmer lead or purchase follow-up.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                One consolidated India follower/engagement control campaign plus one conversion-focused test              </strong>            </div>            <p>              Repeated campaigns with the same name split spend across similar objectives and audiences, making optimization harder.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED campaign variants              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Clean rebuilt campaigns with clear objectives              </strong>            </div>            <p>              Quarantined naming and duplicated structures create account clutter. Larger quarantined campaigns have delivered awareness and engagement, but not leads, purchases, or meaningful link traffic.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN incremental scale budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Lead, messaging, or purchase tests              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is efficient for likes, but it has no reported leads or purchases and frequency is already 4.01.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated lead campaign using Instant Forms or website lead conversion. Test broad India, engaged audience retargeting, and lookalike/engager-based audiences if available. Use clear ticket/booking lead qualification questions.            </p>            <p>              <strong>Success metric:</strong>              Evaluate cost per qualified lead only after at least 3 leads, respecting the minimum_results_before_decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket-sale purchase campaign            </h3>            <p>              <strong>Setup:</strong>              Once purchase tracking is confirmed, launch a purchase-optimized campaign sending users to the ticket purchase flow. Separate prospecting from retargeting.            </p>            <p>              <strong>Success metric:</strong>              Reported purchases, cost per purchase, and ROAS after purchase event and value tracking are verified.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engager retargeting from New post engagement campaign and AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong>              Build retargeting audiences from video viewers, page engagers, post engagers, and followers. Serve direct ticket/lead offers instead of more follower content.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations, leads, purchases, and downstream conversion rate from warm audiences.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging qualification campaign            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated Click-to-Message campaign with automated FAQs for ticket pricing, opening hours, location, and booking intent. Exclude users who already messaged recently.            </p>            <p>              <strong>Success metric:</strong>              Cost per messaging conversation started and percentage of conversations that become qualified leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative intent test            </h3>            <p>              <strong>Setup:</strong>              Test ticket-focused creatives against current engagement-style posts: offer-led creative, visitor experience creative, family/traveller creative, and urgency/date-specific creative.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, leads, messaging starts, and purchases rather than total clicks or post reactions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase actions, purchase value, or ROAS are present, so profitable ticket-sale performance cannot be assessed.</li><li>Only 1 lead is reported account-wide, below the minimum_results_before_decision of 3, so CPL decisions are not statistically reliable.</li><li>Lead actions appear across multiple event names, including onsite_conversion.lead, onsite_web_lead, lead, and lead_grouped, each with value 1. Confirm whether these are duplicate representations of the same lead or separate events.</li><li>There is a major gap between total clicks and inline link clicks: 126,685 clicks versus only 659 inline link clicks account-wide. This suggests most clicks are engagement/page actions, not website traffic.</li><li>Several campaigns appear duplicated with identical names, making performance interpretation and budget control difficult.</li><li>Multiple campaigns contain ERROR QUARANTINED in the campaign name, indicating structural or delivery-quality issues that should be cleaned up.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep AQ_MU2025_Followers_IN and New post engagement campaign as controlled top-of-funnel assets, but stop letting follower, likes, and quarantined visibility campaigns dominate spend. Rebuild the account with clean lead, messaging, retargeting, and purchase campaigns; reduce the largest low-intent India Broad spend; consolidate duplicates; and fix purchase/lead tracking before making profitability decisions.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;sect
