{    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-12        →        2026-10-11      </span>      <span class=&quot;pill&quot;>        4 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 18,507.18</strong>        <small>          2026-09-12          to          2026-10-11        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>785,665</strong>        <small>          1,634,523 impressions          ·          2.08 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>3,886</strong>        <small>          2.74% CTR          ·          THB 0.41 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>3</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 11.32</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account is generating large awareness and engagement volume, but it is not currently proving progress toward profitable ticket sales or qualified leads. Spend was THB 18,507.18 for 1,634,523 impressions, 785,665 reach, 44,765 clicks, 3,886 inline link clicks, 109 landing page views, 3 messaging conversations started, and no reported leads or purchases. The strongest awareness/follower performer is AQ_MU2025_Followers_IN, while AQ Operator CBO | IN | Instagram Followers is the strongest landing page view generator from a small spend base. The main issue is that most budget is concentrated in follower/engagement campaigns rather than measurable lead or purchase campaigns.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from pure follower volume toward measurable lead or ticket-sale campaigns            </h3>            <p>              <strong>Why:</strong>              The account spent THB 18,507.18 but recorded no lead or purchase actions. AQ_MU2025_Followers_IN alone used THB 11,615.85, or about 63% of total spend, while generating only 30 inline link clicks and no landing page views, leads, or purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce AQ_MU2025_Followers_IN budget and use the freed budget to launch dedicated Lead or Purchase objective campaigns once tracking is confirmed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit landing page and pixel tracking before scaling traffic            </h3>            <p>              <strong>Why:</strong>              The account generated 3,886 inline link clicks but only 109 landing page views, a very low click-to-LPV flow. Aquaverse India | Instagram Followers | 2026-09-27 generated 3,562 link clicks but only 49 landing page views.            </p>            <p>              <strong>Do this:</strong>              Check pixel installation, landing page load speed, URL redirects, UTMs, and whether the landing page view event fires correctly on the ticket or lead page.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Carefully scale AQ Operator CBO | IN | Instagram Followers as a traffic-quality test            </h3>            <p>              <strong>Why:</strong>              This campaign spent only THB 506.65 but generated 60 landing page views from 294 link clicks, making it the best LPV producer in the account. It also produced 7,353 post engagements and 6,897 video views from a small budget.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually only after verifying LPV tracking, and monitor whether landing page views turn into leads, messages, or purchases.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Stop judging follower campaigns by purchases, but limit their role            </h3>            <p>              <strong>Why:</strong>              The current campaigns are mostly follower, likes, and engagement campaigns. They are producing page engagement, likes, comments, and video views, but not the business goal of ticket sales and qualified leads.            </p>            <p>              <strong>Do this:</strong>              Keep follower campaigns as upper-funnel support only, with a capped budget, and separate reporting for awareness, traffic, messaging, and purchase/lead performance.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness, engagement, and follower-style performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 11,615.85 and generated 640,163 impressions, 188,051 reach, 154,262 post engagements, 165,616 page engagements, 134,220 video views, 11,354 likes, 1,609 comments, and CTR of 3.97%. Cost per like was about THB 1.02.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for awareness/follower growth, but reduce budget share because it is not producing traffic, leads, or purchases. Watch frequency, which is already 3.40.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient reach and link-click volume at low CPM.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 5,142.27 for 918,920 impressions, 538,622 reach, 3,562 inline link clicks, CPM of THB 5.60, and all-click CPC of THB 0.30.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as a low-cost reach/link-click source, but rebuild or adjust optimization because only 49 landing page views were recorded from 3,562 link clicks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best landing page view quality from the available traffic data.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 506.65 and produced 294 inline link clicks, 60 landing page views, 7,353 post engagements, 6,897 video views, and CPM of THB 8.07. It generated more landing page views than the higher-spend Aquaverse India | Instagram Followers | 2026-09-27 campaign.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale after tracking checks. Use it as the starting point for a landing page view, lead, or ticket intent test.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Account overall            </h3>            <p>              No measurable lead or purchase outcome is reported.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across THB 18,507.18 spend, the account shows 0 reported leads, 0 purchases, 109 landing page views, 3 messaging conversations started, and 5 total messaging connections.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Set up and prioritize campaigns optimized for Lead or Purchase events, and confirm that those events are firing before making profitability decisions.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Large gap between link clicks and landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              3,562 inline link clicks but only 49 landing page views from THB 5,142.27 spend. This is much weaker LPV capture than AQ Operator CBO | IN | Instagram Followers, which produced 60 landing page views from only 294 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale this in its current form. Rebuild with landing page view optimization, check destination URLs, and test a ticket/lead-focused landing page.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Expensive delivery relative to the rest of the account and no link-click output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,242.41 with CPM of THB 98.16, all-click CPC of THB 1.09, 897 likes, 3,628 page engagements, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. If the goal is followers/likes, AQ_MU2025_Followers_IN is producing likes at a lower cost. If the goal is ticket sales or leads, this campaign should not receive growth budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              High spend is not contributing to traffic or bottom-funnel goals.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 11,615.85 spend produced only 30 inline link clicks, no landing page views, no leads, and no purchases, despite strong engagement volume.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as an awareness/follower layer. Reduce budget and reallocate to traffic, lead, or purchase campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Messaging performance overall            </h3>            <p>              Messaging volume is too low to support qualified lead decisions.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The account recorded 554 messaging blocks, 5 total messaging connections, and 3 messaging conversations started. Campaign-level conversation starts are below the minimum decision threshold of 3 for Aquaverse India | Instagram Followers | 2026-09-27 and AQ Operator CBO | IN | Instagram Followers.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause messaging-related campaigns purely from this small sample. Instead, test clearer message CTAs, pre-filled questions, and lead qualification flows.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New Lead or Purchase objective campaign              </strong>            </div>            <p>              This campaign consumed THB 11,615.85, about 63% of total spend, but generated only 30 inline link clicks and no reported leads or purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers or a rebuilt landing page view campaign              </strong>            </div>            <p>              Aquaverse India | Instagram Followers | 2026-09-27 spent THB 5,142.27 for 49 landing page views, while AQ Operator CBO | IN | Instagram Followers spent THB 506.65 for 60 landing page views.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN only if follower growth remains a priority, otherwise lead/purchase testing              </strong>            </div>            <p>              The broad destination campaign has CPM of THB 98.16, all-click CPC of THB 1.09, and 0 inline link clicks. For follower-style activity, AQ_MU2025_Followers_IN has stronger scale and lower cost per like.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current allocation concentrated in follower campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated traffic, lead, messaging, and purchase testing structure              </strong>            </div>            <p>              Current spend is producing awareness and engagement, but the business goal is profitable ticket sales and qualified leads. No purchase or lead actions are reported.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead objective campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated Lead campaign using instant forms or website lead event tracking. Use clear ticket inquiry or booking lead questions to qualify intent.            </p>            <p>              <strong>Success metric:</strong>              Qualified leads and cost per qualified lead. Do not make a final decision until at least 3 lead results are recorded, per the supplied minimum_results_before_decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Purchase or ticket-sale conversion campaign test            </h3>            <p>              <strong>Setup:</strong>              After confirming Purchase event tracking, launch a campaign optimized for purchases or ticket checkout completion instead of followers or engagement.            </p>            <p>              <strong>Success metric:</strong>              Purchases, cost per purchase, and ROAS if revenue is passed back. No target comparison should be made because cost per purchase and ROAS targets are unknown.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Landing page view optimization test            </h3>            <p>              <strong>Setup:</strong>              Rebuild Aquaverse India | Instagram Followers | 2026-09-27 as a landing page view or traffic-quality campaign using the same or similar audience, and compare against AQ Operator CBO | IN | Instagram Followers.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, and link-click-to-LPV rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging qualification flow test            </h3>            <p>              <strong>Setup:</strong>              Run a messaging campaign with a direct ticket inquiry CTA and automated qualification prompts such as date, group size, and ticket type.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, total messaging connections, and qualified message leads. Wait for at least 3 results before making a pause or scale decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Follower budget cap test            </h3>            <p>              <
