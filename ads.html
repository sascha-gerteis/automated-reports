at(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-07        →        2026-10-06      </span>      <span class=&quot;pill&quot;>        3 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 20,870.78</strong>        <small>          2026-09-07          to          2026-10-06        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>702,051</strong>        <small>          1,673,089 impressions          ·          2.38 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>2,948</strong>        <small>          2.93% CTR          ·          THB 0.43 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 12.47</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account generated strong awareness and engagement volume, but performance is misaligned with the business goal of profitable ticket sales and qualified leads. Total spend was THB 20,870.78, producing 1,673,089 impressions, 702,051 reach, 237,728 page engagements, 15,612 likes, 2,948 link clicks, and only 41 landing page views. No purchases, purchase value, leads, CPL, CPA, or ROAS are reported, so sales profitability cannot be evaluated. The largest spend is going to follower/like campaigns rather than ticket sales or qualified lead generation.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebalance budget away from follower volume and toward ticket or lead intent            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN used THB 15,413.48, about 74% of total spend, but produced only 51 inline link clicks and no reported leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep a reduced always-on follower budget only if follower growth is still required, and move freed budget into a dedicated ticket sales or lead campaign with website conversion, lead form, or landing page view optimization.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix the link click to landing page view gap            </h3>            <p>              <strong>Why:</strong>              The account recorded 2,948 link clicks but only 41 landing page views, a very low LPV-to-link-click rate. Aquaverse India | Instagram Followers | 2026-09-27 drove 2,897 inline link clicks but only 41 landing page views.            </p>            <p>              <strong>Do this:</strong>              Audit landing page load speed, destination URLs, Meta Pixel/CAPI setup, UTMs, mobile redirects, and in-app browser behavior before scaling traffic or sales campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate campaigns by objective            </h3>            <p>              <strong>Why:</strong>              Current campaigns are named around followers/likes, but the business goal is ticket sales and qualified leads. Awareness metrics are strong, but no lead or purchase outcomes are visible.            </p>            <p>              <strong>Do this:</strong>              Use separate campaign structures for awareness/followers, traffic/landing page views, leads, messaging, and purchases so each is judged by the correct result type.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Reduce or rebuild the high-cost Broad Destination follower campaign            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination spent THB 1,242.41 with CPM of THB 98.16, much higher than the account CPM of THB 12.47, and produced 0 inline link clicks.            </p>            <p>              <strong>Do this:</strong>              Reduce spend and rebuild with new creative, broader placement delivery, and a clear follower/engagement KPI before adding more budget.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Do not make a final decision on messaging performance yet            </h3>            <p>              <strong>Why:</strong>              Messaging outcomes are below the minimum_results_before_decision of 3: only 2 messaging conversations/connections were reported.            </p>            <p>              <strong>Do this:</strong>              Treat messaging data as directional only. Continue testing only after fixing message flow and measuring at least 3 qualified conversations.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness, engagement, and follower-like volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 15,413.48 spend generated 887,864 impressions, 226,561 reach, 228,617 page engagements, 14,715 likes, 188,289 video views, 21,107 post reactions, and CTR of 3.76%. Cost per like was approximately THB 1.05.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as an awareness/follower campaign if follower growth is an active goal. Do not treat it as a ticket sales or lead campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Best campaign for low-cost reach, low CPM, and website click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,214.89 spend generated 772,568 impressions, 476,393 reach, CPM of THB 5.46, CPC of THB 0.29, and 2,897 inline link clicks at approximately THB 1.46 per inline link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active at controlled spend while the landing page and tracking issue is fixed. Consider using this audience/creative learning for a dedicated landing page view, lead, or ticket campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Generated follower/engagement actions despite small spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,242.41 spend generated 897 likes, 3,628 page engagements, 511 post reactions, and CTR of 9.00%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use learnings cautiously. High CTR appears to be engagement-based because inline link clicks were 0.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Account overall            </h3>            <p>              No measurable sales or lead performance is available.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across THB 20,870.78 spend, no purchase, purchase value, lead, cost per purchase, CPL, or ROAS data is reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Set up and verify purchase, lead, and value tracking before judging profitability or scaling toward ticket sales.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              High spend is not producing traffic or lower-funnel outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 15,413.48 spend produced only 51 inline link clicks and no reported landing page views, leads, or purchases. Frequency is also the highest of the campaigns at 3.92.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget if the priority is ticket sales/leads. Refresh creative, exclude existing followers/engagers, and cap this campaign as upper-funnel only.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Expensive delivery and no website traffic signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CPM was THB 98.16 versus account CPM of THB 12.47. The campaign produced 1,139 clicks but 0 inline link clicks, meaning clicks were not website/link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild rather than scale. Test new creative and placements, and judge it only on follower/engagement outcomes unless the objective is changed.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality or tracking is weak after the click.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              2,897 inline link clicks produced only 41 landing page views. It also recorded 348 messaging blocks but only 2 messaging connections/conversations.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale aggressively until landing page view tracking and message flow are fixed. Use this campaign as a diagnostic traffic source, not as proof of lead quality.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated ticket sales or lead generation campaign              </strong>            </div>            <p>              This campaign consumed THB 15,413.48 and delivered strong follower/engagement volume, but only 51 inline link clicks and no reported leads or purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27 or a rebuilt lead/traffic test              </strong>            </div>            <p>              Broad Destination had the highest CPM at THB 98.16 and 0 inline link clicks, while Aquaverse India | Instagram Followers | 2026-09-27 had CPM of THB 5.46 and 2,897 inline link clicks.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Separate awareness, traffic, lead, messaging, and purchase campaigns              </strong>            </div>            <p>              The current structure produces awareness metrics but does not provide enough lower-funnel data to optimize toward profitable ticket sales or qualified leads.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Ticket sales or lead conversion campaign            </h3>            <p>              <strong>Setup:</strong>              Launch a separate campaign optimized for the most relevant tracked lower-funnel event available: purchase, lead, or landing page view. Use the best-performing creative themes from the current follower campaigns but send traffic to the ticket or lead destination.            </p>            <p>              <strong>Success metric:</strong>              Primary: purchases or leads once tracking is verified. Secondary: landing page views and landing page view rate from link clicks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Landing page view quality test            </h3>            <p>              <strong>Setup:</strong>              Run a controlled test using the Aquaverse India | Instagram Followers | 2026-09-27 audience/creative direction, but optimize one ad set for link clicks and one for landing page views.            </p>            <p>              <strong>Success metric:</strong>              Higher landing page views, better LPV-to-link-click rate, and any downstream lead or purchase actions.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engager retargeting test            </h3>            <p>              <strong>Setup:</strong>              Create retargeting audiences from page/Instagram engagers, video viewers, and recent link clickers from this period. Serve ticket or lead-focused ads instead of follower ads.            </p>            <p>              <strong>Success metric:</strong>              Tracked leads, purchases, landing page views, or qualified message conversations.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Run a small click-to-message test with clear ticket/lead intent in the ad and automated opening questions to qualify users before handoff.            </p>            <p>              <strong>Success metric:</strong>              At least 3 messaging conversations before making a decision, then judge by qualified conversation rate and cost per qualified conversation.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Follower campaign creative refresh            </h3>            <p>
