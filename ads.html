B and generated strong upper-funnel volume: 37,365,289 impressions, 627,756 link clicks, 126,701 landing page views, 177 messaging replies, 11 leads, and 6 purchases. Purchase and lead volume is very low relative to spend, with account-level cost per purchase of 83,564.63 THB and cost per lead of 45,580.71 THB. Targets are unknown, so performance cannot be judged against a CPA or ROAS goal, but budget is currently weighted heavily toward awareness, traffic, follower, and corporate tests that are not converting. The clearest conversion winner is Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;, which produced 8 leads and 4 purchases from 3,017.18 THB.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward the only campaign with enough purchase and lead data            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; exceeded the minimum_results_before_decision threshold with 8 leads and 4 purchases from 3,017.18 THB.            </p>            <p>              <strong>Do this:</strong>              Carefully scale this campaign or rebuild it as a dedicated ticket sales and messaging campaign using the same post/creative angle, while monitoring cost per purchase, cost per lead, and messaging depth.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce corporate lead campaigns that spent heavily with zero leads            </h3>            <p>              <strong>Why:</strong>              TH | B2B Corporate | Video | Leads | 2026-06-18 spent 25,419.90 THB with 13,838 link clicks and 2,258 landing page views but 0 leads. Aquaverse Corporate Groups - Leads - Test spent 11,518.98 THB with 0 leads.            </p>            <p>              <strong>Do this:</strong>              Pause or reduce these current versions and rebuild the lead flow before adding more spend.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix traffic quality before scaling high-click campaigns            </h3>            <p>              <strong>Why:</strong>              Account generated 627,756 link clicks but only 126,701 landing page views, meaning most clicks are not becoming tracked page visits.            </p>            <p>              <strong>Do this:</strong>              Prioritize campaigns with stronger landing page view volume and reduce campaigns with severe click-to-LPV drop-off until tracking, landing speed, and click destination quality are checked.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate reporting by objective            </h3>            <p>              <strong>Why:</ ansform: uppercase;  }  .priority-high {    border-top: 4px solid #dc2626;  }  .priority-medium {    border-top: 4px solid #f59e0b;  }  .priority-low {    border-top: 4px solid #16a34a;  }  .finding-grid {    display: grid;    grid-template-columns: repeat(2, minmax(0, 1fr));    gap: 14px;  }  .finding {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .finding.positive {    border-left: 5px solid #16a34a;  }  .finding.negative {    border-left: 5px solid #dc2626;  }  .finding h3 {    margin: 0 0 8px;    font-size: 16px;  }  .finding p {    margin: 0 0 10px;    color: #526077;  }  .evidence,  .recommendation {    font-size: 13px;    margin-top: 7px;    color: #445168;  }  .budget-row {    display: grid;    grid-template-columns: 1fr 40px 1fr;    gap: 12px;    align-items: center;    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-06-21        →        2026-07-20      </span>      <span class=&quot;pill&quot;>        95 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,754,906.79</strong>        <small>          2026-06-21          to          2026-07-20        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>92,903,215</strong>        <small>          243,995,375 impressions          ·          2.63 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>6,914,929</strong>        <small>          3.29% CTR          ·          THB 0.22 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>384</strong>        <small>          THB 4,570.07 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 877,453.40 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>3,572</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.19</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent 1,754,906.79 THB and generated very large reach and traffic: 243,995,375 impressions, 92,903,215 reach, 6,914,929 link clicks, 1,543,160 landing page views, 128 leads, 2 purchases, and 3,572 messaging conversations started. Traffic volume is strong, but lead and purchase efficiency is mixed because most spend is concentrated in awareness/follow/traffic campaigns that are not producing leads. Purchase data is below the minimum_results_before_decision of 3, so purchase performance should not be used for pause/scale decisions yet.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              The strongest lead volume comes from a small group of campaigns: &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot; produced 47 leads from 5,539.46 THB, &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot; produced 26 leads from 5,509.29 THB, and &amp;quot;Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;&amp;quot; produced 17 leads from 2,488.72 THB.            </p>            <p>              <strong>Do this:</strong>              Carefully increase budgets on these campaigns by 15-20% increments and monitor lead volume, messaging depth, and landing page view quality before further increases.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce high-spend traffic campaigns that are not producing leads            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;quot; spent 307,936.63 THB for 1 lead, and &amp;quot;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;quot; spent 126,271.11 THB with 0 leads despite 109,419 landing page views.            </p>            <p>              <strong>Do this:</strong>              Cut budget materially on corporate traffic campaigns and rebuild them with the winning lead/messaging creative angles before scaling again.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness/follow budgets from lead and ticket-sales budgets            </h3>            <p>              <strong>Why:</strong>              Many follow/visibility campaigns generate engagement, likes, and video views but almost no link traffic or leads. For example, &amp;quot;Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers&amp;quot; spent 20,257.10 THB with 27,743,913 impressions but 0 inline link clicks.            </p>            <p>              <strong>Do this:</strong>              Set a fixed awareness/follower budget cap and protect a separate conversion/lead budget for campaigns with proven lead or messaging outcomes.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix tracking inconsistencies before making aggressive conversion decisions            </h3>            <p>              <strong>Why:</strong>              Several campaigns report very high link clicks but almost no landing page views, such as &amp;quot;Claude | IN | Marathi | 06 Urgent IN | Traffic | 2026-06-13&amp;quot; with 62,597 link clicks and 1 landing page view, and &amp;quot;Automation Test Campaign&amp;quot; with 1,826 link clicks and 1 landing page view.            </p>            <p>              <strong>Do this:</strong>              Audit pixel, landing page view event firing, destination URLs, UTM parameters, in-app browser behavior, and whether campaigns are sending users to website, app, or messaging destinations.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Do not optimize around purchases yet            </h3>            <p>              <strong>Why:</strong>              The account has only 2 purchases in the period, below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Treat purchases as directional only until at least 3 purchases are recorded, and prioritize lead and messaging signals in the short term.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Best lead-producing campaign with strong messaging engagement.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              47 leads from 5,539.46 THB spend, 45,155 link clicks, 425 landing page views, 1,005 messaging conversations started, 988 messaging first replies, and 52 depth-5 message sends.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this creative/message angle as the control for new lead and messaging tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong secondary lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              26 leads from 5,509.29 THB spend, 45,730 link clicks, 353 landing page views, 849 messaging conversations started, and 823 messaging first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale gradually. Test additional Malayalam variations using the same urgent angle.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best combined lead, messaging, and purchase signal from a small but valid lead sample.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              17 leads from 2,488.72 THB spend, 381 messaging conversations started, 372 messaging first replies, 39 depth-5 message sends, and 1 purchase. Purchase volume is below the decision threshold but lead volume is sufficient.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Duplicate into a structured lead/messaging campaign with controlled budget and audience tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13            </h3>            <p>              Produces leads with very high click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              6 leads from 4,000.42 THB spend, 65,867 link clicks, 132 messaging conversations started, and 128 messaging first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep, but investigate landing page tracking because only 27 landing page views were recorded from 65,867 link clicks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Strong traffic and awareness driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,216,864 link clicks, 267,271 landing page views, 7.44% CTR, 1.99 THB CPM, and 33,136.51 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for traffic/awareness only. Do not judge it by purchases because it produced no recorded leads or purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient large-scale traffic campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              781,504 link clicks, 153,425 landing page views, 7.83% CTR, 2.05 THB CPM, and 20,788.93 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic source and use retargeting audiences from landing page viewers.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Works for page-like/follower-style engagement.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              39,095 likes, 805,495 page engagements, 97,575 post reactions, 51,655.30 THB spend, and 5.00% CTR.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower/page growth is a current goal. Watch frequency, which is 3.83.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Very high spend with almost no lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              307,936.63 THB spend, 1,037,513 link clicks, 218,076 landing page views, but only 1 lead.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild before scaling. Test the winning English India Show and Malayalam lead angles against corporate audiences.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Large traffic volume but no recorded leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              126,271.11 THB spend, 432,520 link clicks, 109,419 landing page views, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and relaunch with clearer lead capture or messaging CTA.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              High spend traffic campaign without lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              83,539.68 THB spend, 253,896 link clicks, 72,049 landing page views, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce unless the objective is purely traffic/video views. Rebuild with lead-form or messaging objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              High traffic but no recorded leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              81,075.87 THB spend, 308,143 link clicks, 80,092 landing page views, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and test stronger offer-led creative before increasing spend again.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19            </h3>            <p>              Large traffic and video volume but no leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              81,633.18 THB spend, 405,565 link clicks, 118,378 landing page views, 3,996,519 video views, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as traffic/video if needed; reduce for lead or ticket-sales objectives.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Awareness reach is strong, but it does not drive site traffic or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              20,257.10 THB spend, 27,743,913 impressions, 12,833,826 reach, 0 inline link clicks, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as a low-cost visibility layer; do not fund from the lead/ticket-sales budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Automation Test Campaign            </h3>            <p>              Poor traffic quality or broken landing page tracking.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              3,872.62 THB spend, 1,826 link clicks, 1 landing page view, 0 leads, and CTR of 0.07%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild or stop using the current setup after verifying tracking and destination configuration.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Lead volume meets the minimum decision threshold but efficiency is weak versus top lead campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              15,985.48 THB spend, 3 leads, 3,109 link clicks, 2,175,666 post engagements, and 50 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild with the creative and CTA from stronger lead campaigns.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19 and Claude | IN | Corporates | 5 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13, and Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;              </strong>            </div>            <p>              Corporate campaigns spent 434,207.74 THB combined for 1 lead, while the three recommended campaigns produced 90 leads from 13,537.47 THB combined.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                High-spend follower/likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead and messaging campaigns              </strong>            </div>            <p>
