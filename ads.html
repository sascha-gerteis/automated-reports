ze: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-14        →        2026-10-13      </span>      <span class=&quot;pill&quot;>        4 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 17,794.53</strong>        <small>          2026-09-14          to          2026-10-13        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>863,197</strong>        <small>          1,700,833 impressions          ·          1.97 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>4,586</strong>        <small>          2.54% CTR          ·          THB 0.41 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>3</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 10.46</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness/engagement volume is strong with 1,700,833 impressions, 863,197 reach, 175,404 page engagements, and 138,122 video views from THB 17,794.53 spend. However, the business goal is profitable ticket sales and qualified leads, and the data shows no purchase events, no lead events, no ROAS, and only 198 landing page views from 4,586 link clicks. Current spend is heavily weighted toward follower/engagement activity rather than measurable ticket or lead outcomes.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce budget concentration in AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Why:</strong>              This campaign used THB 10,033.95, which is the largest spend share, but produced only 26 inline link clicks and no landing page views or lead/purchase events. It is working for engagement, not traffic or sales.            </p>            <p>              <strong>Do this:</strong>              Reduce AQ_MU2025_Followers_IN to a smaller awareness-only budget and reallocate spend toward campaigns/ad sets optimized for landing page views, leads, messaging, or purchases once tracking is verified.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              <strong>Why:</strong>              This campaign produced the strongest traffic quality: 860 inline link clicks, 147 landing page views, THB 1.35 cost per link click, THB 7.93 cost per landing page view, and a 17.1% landing-page-view-to-link-click rate.            </p>            <p>              <strong>Do this:</strong>              Increase budget carefully in 20% increments while monitoring landing page views, cost per landing page view, and downstream lead/purchase tracking.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix the link click to landing page view drop-off            </h3>            <p>              <strong>Why:</strong>              Account-wide, 4,586 inline link clicks produced only 198 landing page views, a 4.3% landing-page-view-to-link-click rate. Aquaverse India | Instagram Followers | 2026-09-27 is especially weak with 3,703 link clicks but only 51 landing page views.            </p>            <p>              <strong>Do this:</strong>              Audit landing page load speed, destination URLs, pixel/event setup, in-app browser behavior, and campaign objectives. Do not scale traffic-heavy campaigns until the landing page view loss is understood.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate follower growth from ticket sales and lead generation            </h3>            <p>              <strong>Why:</strong>              Most campaign names and results indicate follower/engagement objectives, while the stated business goal is profitable ticket sales and qualified leads. No purchase or lead results are present.            </p>            <p>              <strong>Do this:</strong>              Create dedicated campaign structures by objective: awareness/followers, traffic/landing page views, messaging leads, lead forms, and purchase conversion campaigns. Judge each only by its intended objective.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Do not make purchase or lead optimization decisions yet            </h3>            <p>              <strong>Why:</strong>              There are zero purchase events and zero lead events reported. The minimum_results_before_decision is 3, so there is insufficient purchase/lead data to judge profitability.            </p>            <p>              <strong>Do this:</strong>              Verify purchase and lead tracking first, then wait for at least 3 purchases or leads per campaign/ad set before making keep/pause decisions on conversion performance.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best campaign for landing page traffic quality.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,165.09 spend, 860 inline link clicks, 147 landing page views, THB 1.35 cost per inline link click, THB 7.93 cost per landing page view, 17.1% LPV-to-link-click rate, CPM THB 5.62.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use it as the base for traffic or conversion testing, but confirm tracking before judging sales or leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness and engagement delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 10,033.95 spend generated 532,114 impressions, 138,995 page engagements, 129,138 post engagements, 111,865 video views, 9,857 likes, CTR 4.08%, and frequency 3.17.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if awareness, engagement, or follower growth is a valid KPI. Reduce if the near-term priority is ticket sales or qualified leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Effective at generating page likes/follower-style engagement, but not traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,242.41 spend produced 897 likes, 3,628 page engagements, CTR 9.00%, and frequency 1.32, but 0 inline link clicks and 0 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as a small follower/likes campaign. Do not use it for ticket sales, landing page traffic, or lead generation.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Lowest click cost and very efficient reach, but weak landing page completion.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,353.08 spend generated 948,594 impressions, 551,566 reach, 18,180 clicks, 3,703 inline link clicks, CPC THB 0.29, CPM THB 5.64, but only 51 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only for low-cost reach/click testing. Rebuild or adjust before scaling for qualified traffic.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Not supporting traffic, lead, or purchase goals despite high spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 10,033.95 spend produced only 26 inline link clicks, no landing page views, no leads, and no purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild into a separate traffic, lead, or purchase campaign if the goal is ticket sales or qualified leads.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Large link click volume is not turning into landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              3,703 inline link clicks produced only 51 landing page views, a 1.4% LPV-to-link-click rate. Spend was THB 5,353.08.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale for traffic until URL, pixel, landing page speed, and placement quality are reviewed. Test landing-page-view optimization against the current setup.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Not useful for site traffic or conversion measurement.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              0 inline link clicks, 0 landing page views, no leads, and no purchases from THB 1,242.41 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce to a small awareness/follower budget or stop using it for performance objectives.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide messaging activity            </h3>            <p>              Messaging volume is too low to judge as a qualified lead channel.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Only 3 messaging conversations started and 5 total messaging connections account-wide. At campaign level, AQ Operator CBO | IN | Instagram Followers has 1 conversation started, and Aquaverse India | Instagram Followers | 2026-09-27 has 2 conversations started, which is below the minimum decision threshold of 3 for each campaign.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause campaigns based on messaging yet. Run a dedicated messaging lead test and wait for at least 3 qualified messaging outcomes per campaign/ad set before deciding.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Purchase and lead performance            </h3>            <p>              Cannot evaluate profitability or qualified lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              No purchase events, no lead events, no purchase value, and no ROAS are reported in the supplied data.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Set up or verify purchase and lead tracking before shifting the account toward profitability decisions.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers and a new landing-page-view or conversion campaign              </strong>            </div>            <p>              AQ_MU2025_Followers_IN spent THB 10,033.95 but generated only 26 inline link clicks and no landing page views. AQ Operator CBO produced 147 landing page views at THB 7.93 per landing page view.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Awareness/follower budget cap or traffic/lead testing budget              </strong>            </div>            <p>              This campaign generated 897 likes but 0 inline link clicks and 0 landing page views. It should not receive performance budget if ticket sales or leads are the priority.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Rebuilt traffic campaign optimized for landing page views              </strong>            </div>            <p>              It delivered cheap clicks at THB 0.29 CPC and 3,703 inline link clicks, but only 51 landing page views. Budget should be partially redirected into a cleaner LPV-optimized test.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated purchase, lead, and messaging tests after tracking verification              </strong>            </div>            <p>              The business goal is ticket sales and qualified leads, but current reporting contains no purchases and no leads.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing Page View Optimization Test            </h3>            <p>              <strong>Setup:</strong>              Run AQ Operator CBO | IN | Instagram Followers against a rebuilt version of Aquaverse India | Instagram Followers | 2026-09-27 using the same destination URL and similar budget. Optimize for landing page views instead of general clicks/followers.            </p>            <p>              <strong>Success metric:</strong>              Cost per landing page view and LPV-to-link-click rate. Beat AQ Operator CBO&amp;#039;s current THB 7.93 cost per landing page view and 17.1% LPV-to-link-click rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Purchase or Lead Conversion Tracking Test            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated purchase or lead campaign only after pixel/CAPI and event setup are verified. Use clear ticket or enquiry creative and send traffic to the correct booking or lead destination.            </p>            <p>              <strong>Success metric:</strong>              At least 3 purchases or leads before making a decision, in line with the minimum_results_before_decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Messaging Lead Quality Test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated click-to-message campaign with a clear ticket/lead qualification prompt, automated first response, and quick follow-up process.            </p>            <p>              <strong>Success metric:</strong>
