align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-22        →        2026-09-20      </span>      <span class=&quot;pill&quot;>        14 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 36,604.62</strong>        <small>          2026-08-22          to          2026-09-20        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>454,885</strong>        <small>          1,806,267 impressions          ·          3.97 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>97</strong>        <small>          3.52% CTR          ·          THB 0.58 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 20.27</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Performance is mixed. Awareness and engagement delivery is strong, led by AQ_MU2025_Followers_IN, but the account is not currently structured to prove ticket sales or qualified leads. Across THB 36,604.62 spend, the account generated 1,806,267 impressions, 454,885 reach, 485,683 page engagements, 24,605 likes, 97 link clicks, 1 messaging conversation, and no reported leads or purchases. Traffic, lead, messaging, and purchase performance cannot be judged as profitable because conversion volume and tracking are insufficient.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild the account around ticket sales and qualified leads            </h3>            <p>              <strong>Why:</strong>              Current spend is mostly producing followers, likes, video views, and engagement, not reported leads or purchases. The account has only 97 link clicks and 1 messaging conversation from THB 36,604.62 spend, with no lead or purchase actions reported.            </p>            <p>              <strong>Do this:</strong>              Create separate lower-funnel campaigns for ticket sales, lead generation, and messaging. Keep awareness separate from lead/purchase campaigns so follower performance is not judged by purchases.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on meaningful-spend ERROR QUARANTINED campaigns            </h3>            <p>              <strong>Why:</strong>              Multiple ERROR QUARANTINED campaigns spent materially but produced 0 or 1 inline link click and higher cost per like than AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Do this:</strong>              Reduce or pause the ERROR QUARANTINED campaigns with meaningful spend and rebuild them into clean campaigns. Do not make performance decisions on the tiny THB 4.26-7.06 spend campaigns yet.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN for awareness, but do not treat it as a sales campaign            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN generated 22,641 likes, 401,261 post engagements, and 361,772 video views from THB 25,162 spend, but only 96 link clicks and no reported leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign only as an awareness/follower campaign. Refresh creative and monitor frequency before scaling, as frequency is already 4.63.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix measurement before judging profitability            </h3>            <p>              <strong>Why:</strong>              The account reports 63,644 clicks but only 97 inline link clicks, and no lead or purchase events. CPC and CTR are mostly reflecting engagement clicks, not site traffic or ticket sales.            </p>            <p>              <strong>Do this:</strong>              Audit pixel, Conversion API, purchase event, lead event, messaging tracking, UTMs, and landing-page attribution before shifting large budget into purchase optimization.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strongest awareness and follower-growth campaign in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 25,162 and generated 1,547,978 impressions, 334,397 reach, 22,641 likes, 401,261 post engagements, 361,772 video views, CPC THB 0.468, CPM THB 16.25, and CTR 3.47%. Cost per like is approximately THB 1.11.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for awareness/follower growth. Refresh creative and audiences before increasing budget because frequency is 4.63.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              This campaign is also responsible for nearly all recorded link clicks.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 96 of the account’s 97 inline link clicks while using THB 25,162 of THB 36,604.62 total spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use engaged users and video viewers from this campaign for retargeting, but do not rely on it alone for ticket sales or leads.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Inefficient compared with the main follower campaign and produced no inline link traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 4,304.20, generated 85,233 impressions, 762 likes, 18,530 post engagements, 3,163 clicks, but 0 inline link clicks. Cost per like is approximately THB 5.65 versus THB 1.11 for AQ_MU2025_Followers_IN.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause this campaign and rebuild only if the goal is clearly follower growth or engagement.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Multiple duplicate campaigns are fragmented and materially less efficient than AQ_MU2025_Followers_IN.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign IDs 120251495841180402, 120251495843190402, and 120251495845220402 spent THB 1,487.24, THB 1,022.51, and THB 2,430.56 respectively. They generated 208, 200, and 354 likes, with cost per like of approximately THB 7.15, THB 5.11, and THB 6.87. Combined inline link clicks were only 1.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Stop duplicating these follower/likes campaigns. Consolidate budget into either AQ_MU2025_Followers_IN for awareness or new lead/purchase campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Fragmented duplicate campaigns are producing engagement but no meaningful traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign IDs 120251570553680402, 120251570556340402, 120251570557960402, 120251570562550402, and 120251570564580402 spent a combined THB 2,173.60 and generated 430 likes, 12,410 post engagements, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause these duplicates and consolidate learning into one clean campaign if awareness is still needed.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient delivery to make a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Four campaigns spent only THB 7.06, THB 4.26, THB 6.55, and THB 6.64, with 29-58 impressions each.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause due to performance from this tiny sample. Instead, audit why these campaigns barely delivered and why they are labeled ERROR QUARANTINED.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide traffic, lead, messaging, and purchase performance            </h3>            <p>              Traffic and conversion outcomes are not sufficient for the business goal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The account generated 63,644 clicks but only 97 inline link clicks, 1 messaging conversation, no reported leads, and no reported purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Separate traffic, lead, messaging, and purchase campaigns from awareness campaigns, and judge each by its own result type only after at least 3 results.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED campaigns with meaningful spend              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead, messaging, and ticket-sales campaigns              </strong>            </div>            <p>              Meaningful-spend ERROR QUARANTINED campaigns used approximately THB 11,418.11 and generated very limited link or messaging outcomes. Reallocate this budget to campaigns designed to produce qualified leads and ticket sales.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED follower/likes duplicates              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN if awareness/follower growth remains a priority              </strong>            </div>            <p>              AQ_MU2025_Followers_IN has the strongest internal follower efficiency at approximately THB 1.11 per like, while ERROR QUARANTINED campaigns with meaningful spend range roughly from THB 4.01 to THB 7.15 per like.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting audiences built from engagers and video viewers              </strong>            </div>            <p>              The campaign produced 401,261 post engagements and 361,772 video views, which can support lower-funnel retargeting, but it did not report leads or purchases.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead generation campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated lead campaign using Meta instant forms or a landing page form. Keep it separate from follower/likes campaigns and track lead quality after submission.            </p>            <p>              <strong>Success metric:</strong>              Cost per qualified lead after at least 3 leads. Do not judge before the minimum 3-result threshold.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Messaging campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated click-to-message campaign using Messenger or WhatsApp-style inquiry flow for ticket questions and group bookings.            </p>            <p>              <strong>Success metric:</strong>              Cost per qualified messaging conversation after at least 3 conversations. Current account volume is only 1 conversation, so messaging performance is insufficient to judge.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Ticket-sales conversion campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a purchase-focused campaign only after purchase tracking is confirmed. Use clear ticket-sales creative and send traffic to the ticket purchase flow.            </p>            <p>              <strong>Success metric:</strong>              Cost per purchase and reported purchase volume after at least 3 purchases. Do not compare to ROAS because no revenue or ROAS data is supplied.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Retargeting from AQ_MU2025_Followers_IN engagers            </h3>            <p>              <strong>Setup:</strong>              Create audiences from page engagers, video viewers, and post engagers generated by AQ_MU2025_Followers_IN. Retarget them with lead or ticket-sale messaging.            </p>            <p>              <strong>Success metric:</strong>              Lead, messaging conversation, or purchase volume after at least 3 results, depending on the campaign objective.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative refresh for AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong>              Test new creative angles inside the awareness/follower structure while monitoring frequency, likes, engagement, and video views.            </p>            <p>              <strong>Success metric:</strong>              Maintain or improve cost per like versus the current approximate THB 1.11 and avoid further frequency buildup above the current 4.63.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No lead actions are reported, so cost per lead cannot be evaluated.</li><li>No purchase actions or revenue are reported, so ticket-sales profitability and ROAS cannot be evaluated.</li><li>Only 1 messaging conversation is reported, below the mini
