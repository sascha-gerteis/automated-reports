 Aquaverse spent THB 518,245.46 and generated very large traffic volume: 631,795 link clicks, 125,105 omni landing page views, 285 messaging conversations started, 12 leads, and 7 purchases. Purchase and lead volume is too low to judge most sales campaigns against profitability, especially because targets are unknown. The clearest winner is Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;, which produced 8 leads, 4 purchases, and 47 messaging conversations from THB 2,929.97. Several traffic campaigns produce cheap landing page views, but many high-spend campaigns generate clicks that do not translate into landing page views, leads, or purchases.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the only proven purchase and lead campaign            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; is the only campaign above the minimum_results_before_decision threshold for both leads and purchases, with 8 leads, 4 purchases, 47 messaging conversations, and THB 2,929.97 spend.            </p>            <p>              <strong>Do this:</strong>              Keep active and increase budget gradually by 15-20%. Duplicate its winning post/offer into a structured sales or messaging campaign rather than relying only on boosted post delivery.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on campaigns generating clicks but weak landing page depth            </h3>            <p>              <strong>Why:</strong>              Several campaigns have high click volume but very low landing page view rates, indicating low-quality clicks, tracking gaps, or slow/off-platform landing experiences.            </p>            <p>              <strong>Do this:</strong>              Reduce budgets on TH | Image | Aquaverse Traffic | Test 100THB, Claude | TH | Traffic IMAGES | 18Jun, Aquaverse Corporate Groups - Leads - Test, and Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-25 until landing page view quality improves.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild B2B lead generation campaigns            </h3>            <p>              <strong>Why:</strong>              Corporate lead campaigns spent meaningful budget but generated no reported leads. Aquaverse Corporate Groups - Leads - Test spent THB 12,643.74 with 0 leads, and TH | B2B Corporate | Video | Leads | 2026-06-18 spent THB 24,813.80 with 0 leads.            </p>            <p>              <strong>Do this:</strong>              Rebuild B2B using instant lead forms or a dedicated conversion event, shorter form path, clearer corporate CTA, and retargeting from Claude | TH | Corporates | Thai | 2026-06-19, which generated 4,300 landing page views.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;> gative&quot;>            <h3>              Aquaverse Corporate Groups - Leads - Test            </h3>            <p>              Lead objective is not producing leads and traffic quality is weak.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 12,643.74 spend, 0 leads, 1,833 link clicks, only 113 landing page views, landing page view rate about 6.2%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild before further scaling. Test instant forms, clearer corporate offer, and retargeting from higher-quality corporate traffic.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              TH | B2B Corporate | Video | Leads | 2026-06-18            </h3>            <p>              High spend and high frequency with no reported leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 24,813.80 spend, 0 leads, frequency 6.73, 13,740 link clicks, 2,213 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild the lead path. Frequency suggests the audience is being hit repeatedly without lead conversion.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-25            </h3>            <p>              Ticket sales traffic is not converting into landing page depth.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 8,342.60 spend, 10,912 link clicks, only 363 landing page views, landing page view rate about 3.3%, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild this variant. Compare landing page, placement, and URL setup against the 20 Jun Hot Weather campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              TH | Image | Aquaverse Traffic | Test 100THB            </h3>            <p>              Cheap clicks but weak landing page quality.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 8,866.97 spend, 20,897 link clicks, only 1,749 landing page views, landing page view rate about 8.4%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale as-is. Switch optimization to landing page views or rebuild creative/CTA to reduce low-intent clicks.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | TH | Traffic IMAGES | 18Jun            </h3>            <p>              Largest click driver but low landing page completion rate.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 24,899.84 spend, 126,769 link clicks, 11,400 landing page views, landing page view rate about 9.0%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce if the objective is qualified traffic. Keep only if cheap click volume is intentionally required, then retest with landing page view optimization.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              FB Follow | Thailand | Aquaverse Lifestyle            </h3>            <p>              Follower/page-like objective appears inefficient relative to spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 52,102.39 spend, 3 reported likes, 2,411 link clicks, 1 landing page view, 1,107,143 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild if the objective is actual followers/page likes. If the objective is engagement, rename and measure against engagement instead.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              FB Follow | Thailand | Lookalike Fans Scale            </h3>            <p>              High spend with very few reported likes and almost no link traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 36,313.52 spend, 8 reported likes, 27 link clicks, 1,026,747 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild the follower objective. Use engagement audiences for retargeting instead of scaling this as a follower campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | TH | Conversions Lazada | 12Jun            </h3>            <p>              Conversion campaign has not produced reported purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,839.42 spend, 6,093 link clicks, 1,154 landing page views, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale until tracking and marketplace purchase attribution are confirmed.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | TH | Conversions Shopee | 026-06-19 plus a new B2B instant lead form campaign              </strong>            </div>            <p>              The two B2B lead campaigns spent THB 37,457.54 with 0 leads, while Claude | TH | Corporates | Thai generated 4,300 landing page views from THB 7,740.22.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-25              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026              </strong>            </div>            <p>              The 06-25 version produced only 363 landing page views from THB 8,342.60, while the 20 Jun version produced 7,311 landing page views from THB 4,897.42.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                TH | Image | Aquaverse Traffic | Test 100THB and Claude | TH | Traffic IMAGES | 18Jun              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                TH | Traffic | Audiences (Family/Couple/Group) [Claude build] and Hot Weather 20 Jun              </strong>            </div>            <p>              The image traffic campaigns have low landing page view rates of about 8.4% and 9.0%, while the audience campaign generated 17,228 landing page views and Hot Weather 20 Jun generated 7,311 landing page views.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current broad traffic budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting pool from landing page viewers, messaging starters, and video viewers              </strong>            </div>            <p>              The account generated 125,105 landing page views, 285 messaging conversations, and 6,219,858 video views, but only 7 purchases. More budget should move to warmer audiences.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Winning post scale test            </h3>            <p>              <strong>Setup:</strong>              Duplicate Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; into a dedicated campaign with the same creative and offer. Test Sales objective versus Messaging objective with equal budgets.            </p>            <p>              <strong>Success metric:</strong>              Judge after at least 3 purchases or 3 leads. Compare cost per purchase, cost per lead, and messaging conversation quality against the current post results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Landing page view optimization versus link click optimization            </h3>            <p>              <strong>Setup:</strong>              Run the best Hot Weather creative in two ad sets: one optimized for link clicks and one optimized for landing page views.            </p>            <p>              <strong>Success metric:</strong>              Primary metric is cost per landing page view and landing page view rate. Secondary metric is leads or purchases after each variant reaches at least 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              B2B instant lead form test            </h3>            <p>              <strong>Setup:</strong>              Use Claude | TH | Corporates | Thai | 2026-06-19 audiences and creative angles, but send users to an instant form instead of the current landing path.            </p>            <p>              <strong>Success metric:</strong>              Judge on lead volume and cost per lead after at least 3 leads, then manually qualify leads before scaling.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Shopee versus Lazada marketplace test            </h3>            <p>              <strong>Setup:</strong>              Run equal-budget campaigns for Shopee and Lazada using the same creative and audience. Include UTM tracking and check app/site visit events.            </p>            <p>              <strong>Success metric:</strong>              Compare landing page view rate, app/site visits, and purchases if at least 3 purchases are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Messaging retargeting test            </h3>            <p>              <strong>Setup:</strong>              Retarget people who started conversations, viewed landing pages, or engaged with winning posts. Use direct ticket offer and FAQ-style message flow.            </p>            <p>              <strong>Success metric:</strong>              Cost per messaging conversation started, depth 2/3/5 message sends, leads, and purchases after minimum result thresholds are met.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 6            </span>            <h3>              Awareness-to-retargeting funnel            </h3>            <p>              <strong>Setup:</strong>              Use Claude | TH | Awareness | Videos | 17Jun and Indian Market : Awareness for reach/video views, then retarget video viewers with Hot Weather or ticket offer ads.            </p>            <p>              <strong>Success metric:</strong>              Measure retargeting cost per landing page view, lead, and purchase, not purchases from the awareness campaigns themselves.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>{&amp;quot;issue&amp;quot;:&amp;quot;Purchase value reporting appears incomplete.&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;Account reports 7 purchases but only THB 2,176 purchase value. Post: \&amp;quot;🎉หยุดยาวนี้...\&amp;quot; reports 4 purchases with THB 2,176 value, while other campaigns with 1 purchase show no value.&amp;quot;,&amp;quot;action&amp;quot;:&amp;quot;Audit purchase value parameter, Pixel/CAPI deduplication, and whether all purchase sources pass value consistently.&amp;quot;}</li><li>{&amp;quot;issue&amp;quot;:&amp;quot;Large gap between link clicks and landing page views.&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;Account has 631,795 link clicks but only 125,105 omni landing page views, about 19.8% of link clicks. Some campaigns are much lower, including Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-25 with 10,912 link clicks and 363 landing page views.&amp;quot;,&amp;quot;action&amp;quot;:&amp;quot;Check page speed, redirects, marketplace deep links, browser compatibility, and landing page view event firing.&amp;quot;}</li><li>{&amp;quot;issue&amp;quot;:&amp;quot;Some campaigns show inline link clicks greater than total clicks.&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;Aquaverse Corporate Groups - Image Ads - Test shows 3,730 inline link clicks versus 3,524 clicks. claude campagin test 1 image shows 5,738 inline link clicks versus 5,499 clicks.&amp;quot;,&amp;quot;action&amp;quot;:&amp;quot;Verify reporting definitions and export consistency before using click metrics for optimization decisions.&amp;quot;}</li><li>{&amp;quot;issue&amp;quot;:&amp;quot;Marketplace attribution may be incomplete.&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;Claude | TH | Conversions Shopee | 12Jun generated 2,796 landing page views and 0 purchases. Claude | TH | Conversions Lazada | 12Jun generated 1,154 landing page views and 0 purchases.&amp;quot;,&amp;quot;action&amp;quot;:&amp;quot;Confirm whether Shopee/Lazada purchases can be tracked back into Meta or whether marketplace reporting must be joined separately.&amp;quot;}</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep awareness campaigns for reach, keep the strongest traffic campaigns for retargeting, and carefully scale only the proven post that generated 8 leads and 4 purchases. Reduce or rebuild high-spend campaigns with poor landing page depth or no leads, especially follower and B2B lead campaigns. Before aggressive purchase scaling, fix purchase value tracking and the link-click-to-landing-page-view drop-off.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Stan r: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-06-23        →        2026-07-22      </span>      <span class=&quot;pill&quot;>        95 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,701,317.35</strong>        <small>          2026-06-23          to          2026-07-22        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>89,993,551</strong>        <small>          231,264,092 impressions          ·          2.57 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>6,544,998</strong>        <small>          3.29% CTR          ·          THB 0.22 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>372</strong>        <small>          THB 4,573.43 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 850,658.68 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>3,357</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.36</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large reach and traffic in India: 231,264,092 impressions, 6,544,998 link clicks, 1,496,540 landing page views and THB 1,701,317.35 spend. However, sales and lead outcomes are weak relative to spend: 124 leads, 2 purchases, account CPL of THB 13,720.30 and purchase volume below the minimum decision threshold of 3. Traffic and awareness delivery is strong, but budget is heavily concentrated in campaigns producing clicks, video views, likes, and engagement rather than qualified leads or ticket sales. Account performance is mixed because a few campaigns show very strong lead/message efficiency while many high-spend campaigns have little or no conversion signal.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget from high-spend traffic/engagement campaigns into proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              The account spent THB 1,701,317.35 for only 124 leads and 2 purchases, while a small group of campaigns produced most of the qualified lead/message volume at much lower cost.            </p>            <p>              <strong>Do this:</strong>              Increase budget carefully on &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot;, &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;; reduce budgets on large traffic/follows campaigns with no lead output.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix tracking before scaling purchase optimization            </h3>            <p>              <strong>Why:</strong>              Only 2 purchases were reported, below the minimum_results_before_decision of 3, and daily data shows 0 impressions/clicks/spend on 2026-07-17 to 2026-07-22 while still reporting leads and messaging actions.            </p>            <p>              <strong>Do this:</strong>              Audit pixel, CAPI, landing page view event, purchase event, attribution windows, and reporting breakdowns before making purchase-level decisions.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild the high-spend corporate and segment campaigns for leads, not traffic            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;quot; spent THB 304,934.89 for only 1 lead, while &amp;quot;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;quot; spent THB 125,270.05 with 0 reported leads.            </p>            <p>              <strong>Do this:</strong>              Cut these campaigns sharply and relaunch using lead, messaging, or purchase objectives with the best-performing creative angles from the lead-producing campaigns.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate awareness, traffic, lead, messaging, and purchase budgets            </h3>            <p>              <strong>Why:</strong>              Many campaigns are delivering awareness or engagement efficiently but are consuming budget that is needed for profitable ticket sales and qualified leads.            </p>            <p>              <strong>Do this:</strong>              Create separate budget pools: awareness/follow campaigns capped, traffic campaigns capped, and the majority of growth budget assigned to lead/messaging/sales campaigns.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Consolidate fragmented daily follow/like campaigns            </h3>            <p>              <strong>Why:</strong>              There are many near-duplicate &amp;quot;Aquaverse India Daily Follows Likes&amp;quot; campaigns with small or overlapping audiences, low link click volume, and limited lead impact.            </p>            <p>              <strong>Do this:</strong>              Consolidate daily follow/like campaigns into fewer always-on campaigns by audience theme, then cap spend unless the objective is specifically follower or engagement growth.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best lead and messaging performer with meaningful lead volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,488.72 spend, 17 leads, CPL THB 146.40, 381 messaging conversations started, cost per conversation started THB 6.53, and 1 purchase reported. Purchase volume is below the minimum threshold of 3, so treat purchase performance as directional only.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale by 20-30% at a time; duplicate the creative into dedicated Leads, Messages, and Purchase test campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strongest scalable lead and messaging campaign by volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,325.23 spend, 46 leads, CPL THB 115.77, 962 messaging conversations started, cost per conversation started THB 5.54.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale; duplicate into a lead-optimized campaign and a messaging-optimized campaign using the same creative and audience.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Efficient lead and messaging producer with more than the minimum result threshold.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,295.49 spend, 26 leads, CPL THB 203.67, 802 messaging conversations started, cost per conversation started THB 6.60.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale gradually; test more Malayalam variants with the same urgency angle.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13            </h3>            <p>              Produces leads above the minimum decision threshold but with higher CPL than the top campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,792.38 spend, 4 leads, CPL THB 948.10, 125 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep at controlled budget; test improved landing page/message flow before scaling.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient traffic generator but not currently converting into reported leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 18,951.94 spend, 705,206 link clicks, 149,142 landing page views, cost per landing page view THB 0.13, 0 reported leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as capped upper-funnel traffic; retarget its landing page viewers with lead/message/purchase campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Efficient awareness/traffic delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 30,930.09 spend, 15,502,833 impressions, 1,131,718 link clicks, 262,367 landing page views, cost per landing page view THB 0.12.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as awareness/traffic only if top-of-funnel volume is needed; do not scale for leads until retargeting proves conversion.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower/page engagement campaign if the objective is audience growth.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 48,229.08 spend, 35,782 page likes, cost per page like THB 1.35, 7,244 comments, 774,314 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth is a separate objective; cap budget because it did not report leads or purchases.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Major budget drain for lead/sales goals.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 304,934.89 spend, 1,022,481 link clicks, 214,721 landing page views, but only 1 lead and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce heavily and rebuild with lead/messaging/purchase objective; do not continue large traffic spend without conversion signal.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with no reported lead or purchase outcome.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 125,270.05 spend, 426,625 link clicks, 108,632 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause after confirming tracking; rebuild with a stronger corporate offer and lead form/message qualification.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Traffic volume is high, but it is not producing reported leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 80,298.65 spend, 242,099 link clicks, 69,799 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and move budget to the proven lead/message campaigns; retarget its landing page viewers.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              High traffic spend without lead or purchase signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 78,353.98 spend, 296,324 link clicks, 77,497 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce; test this audience only with proven lead creatives before scaling again.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19            </h3>            <p>              Good traffic volume but no reported lead or purchase conversion.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 78,499.01 spend, 389,622 link clicks, 114,576 landing page views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as capped traffic if needed; otherwise shift budget into retargeting and lead campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              IN | Image | Aquaverse Traffic | Test 1000INR            </h3>            <p>              Large traffic volume but very weak lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 41,341.37 spend, 541,144 link clicks, 1
