 <span>Amount spent</span>        <strong>THB 15,982.92</strong>        <small>          2026-09-20          to          2026-10-19        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>966,305</strong>        <small>          1,745,211 impressions          ·          1.81 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>6,765</strong>        <small>          2.30% CTR          ·          THB 0.40 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>6</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 9.16</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement volume is strong with 1,745,211 impressions, 966,305 reach, 143,684 post engagements, 119,855 video views, and 7,223 likes from THB 15,982.92 spend. However, the stated business goal is profitable ticket sales and qualified leads, and the data shows no purchase events, no lead events, and only 6 messaging conversations started. Traffic quality is uneven: the account generated 6,765 link clicks but only 592 landing page views, an 8.8% LPV-to-link-click rate. AQ Operator CBO | IN | Instagram Followers is the clearest campaign to scale carefully because it produced 538 of 592 landing page views at the best cost per LPV.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              <strong>Why:</strong>              It produced the strongest traffic quality and engagement efficiency: 538 landing page views from THB 3,001.39 spend, cost per LPV of THB 5.58, 2,722 link clicks, and 65,224 video views.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually while monitoring landing page views, link-click-to-LPV rate, and any downstream lead or purchase tracking once available.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              <strong>Why:</strong>              This campaign has the highest CPM at THB 98.16, highest CPC at THB 1.09, only 12,657 impressions, and 0 inline link clicks despite THB 1,242.41 spend.            </p>            <p>              <strong>Do this:</strong>              Do not scale. Reduce budget and rebuild with a clearer objective and audience/creative structure if follower or engagement growth is still required.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Do not use Aquaverse India | Instagram Followers | 2026-09-27 as a lead or ticket-sales driver in its current form            </h3>            <p>              <strong>Why:</strong>              It generated cheap reach and clicks, but only 54 landing page views from 4,022 link clicks, a 1.3% LPV-to-link-click rate, with THB 110.06 cost per LPV.            </p>            <p>              <strong>Do this:</strong>              Keep only if the goal is cheap reach/click volume. For traffic or sales, rebuild with landing page views, leads, or purchases as the optimization event after tracking is confirmed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix measurement before judging profitability            </h3>            <p>              <strong>Why:</strong>              There are no purchase events, no lead events, no ROAS, and no revenue data. Targets are also unknown, so profitability cannot be evaluated.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI, purchase event, lead event, landing page view event, and UTMs before making final sales or lead-quality decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best campaign for traffic quality and landing page activity.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,001.39 spend, 2,722 inline link clicks, 538 landing page views, THB 5.58 cost per LPV, and 19.8% LPV-to-link-click rate.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this campaign structure as the base for future traffic, lead, or ticket-sales tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Strong awareness and video engagement efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              65,224 video views and 69,143 post engagements from THB 3,001.39 spend, with CPM of THB 6.13.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an efficient upper-funnel campaign and retarget engagers/video viewers once lead or purchase tracking is active.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower/page engagement output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              6,326 likes, 63,947 post engagements, 70,273 page engagements, 9,538 post reactions, and 858 comments from THB 5,795.96 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if the objective is awareness, followers, and social proof, but do not treat it as a traffic or sales campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient reach and click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,031,247 impressions, 591,593 reach, CPM of THB 5.76, CPC of THB 0.29, and 4,022 link clicks from THB 5,943.16 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only for cheap reach/click acquisition. Rebuild if the desired outcome is landing page traffic, leads, or ticket sales.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Least efficient delivery and no inline link-click output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,242.41 spend, CPM of THB 98.16, CPC of THB 1.09, 12,657 impressions, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget or rebuild. If the campaign is intended for follower growth, test new creatives/audiences against AQ_MU2025_Followers_IN before scaling.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Low-quality traffic after the click.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,022 link clicks but only 54 landing page views, giving a 1.3% LPV-to-link-click rate and THB 110.06 cost per LPV.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit destination, click type, landing page load, and event firing. Rebuild as a landing-page-view or conversion campaign if traffic quality is required.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Good engagement, but not effective for website traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Only 18 inline link clicks and 1 landing page view from THB 5,795.96 spend, while CPM is THB 27.34.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep for followers/social proof only. Do not allocate ticket-sales or lead-generation budget here unless the objective changes and tracking proves downstream value.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              All campaigns            </h3>            <p>              Lead, messaging, and purchase performance cannot be properly judged.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              No lead actions, no purchase actions, no revenue, only 6 messaging conversations started, and only 1 messaging conversation replied across the account.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Set up dedicated lead/purchase campaigns and confirm event tracking before evaluating business-goal performance.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              Daily Follows Likes has the highest CPM at THB 98.16 and 0 inline link clicks, while AQ Operator produced the best cost per LPV at THB 5.58.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27 traffic allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers or a rebuilt LPV/lead campaign              </strong>            </div>            <p>              Aquaverse India | Instagram Followers generated 4,022 link clicks but only 54 LPVs, while AQ Operator generated 538 LPVs from fewer link clicks.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN if the priority is ticket sales/leads              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead, landing page view, or purchase tracking test              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is strong for followers and engagement but produced only 1 landing page view and no tracked leads or purchases.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing page view optimization test            </h3>            <p>              <strong>Setup:</strong>              Duplicate the best elements from AQ Operator CBO | IN | Instagram Followers into a campaign optimized for landing page views, using the same destination and creatives where possible.            </p>            <p>              <strong>Success metric:</strong>              Cost per landing page view and LPV-to-link-click rate versus AQ Operator’s current THB 5.58 cost per LPV and 19.8% LPV-to-link-click rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Lead capture test            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated lead campaign using Instant Forms or a tracked website lead event. Include qualifying questions related to ticket interest or visit intent.            </p>            <p>              <strong>Success metric:</strong>              Number of leads and cost per qualified lead. Do not make a decision until at least 3 lead results are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Retargeting test from engaged audiences            </h3>            <p>              <strong>Setup:</strong>              Build retargeting audiences from video viewers, page engagers, link clickers, and landing page viewers. Send them to a ticket or inquiry offer once tracking is confirmed.            </p>            <p>              <strong>Success metric:</strong>              Tracked leads, purchases, or landing page views depending on the campaign objective.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Follower creative efficiency test            </h3>            <p>              <strong>Setup:</strong>              Test new follower/engagement creatives against AQ_MU2025_Followers_IN using the same objective and comparable budget.            </p>            <p>              <strong>Success metric:</strong>              Cost per like, cost per page engagement, and comment/save quality versus AQ_MU2025_Followers_IN.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>{&amp;quot;issue&amp;quot;:&amp;quot;No purchase or revenue data supplied&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;Account da
