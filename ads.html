t;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from follower-only delivery into sales or lead infrastructure            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN spent THB 16,191.40, 75.9% of total spend, but produced only 55 inline link clicks and no reported landing page views, leads, purchases, or messaging conversations.            </p>            <p>              <strong>Do this:</strong>              Reduce AQ_MU2025_Followers_IN to a smaller awareness role and reallocate budget to a properly tracked ticket sales or qualified lead campaign once purchase/lead events are confirmed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix the landing page view drop-off before scaling traffic            </h3>            <p>              <strong>Why:</strong>              The account generated 2,761 link clicks but only 39 landing page views, a 1.4% link-click-to-LPV rate. Aquaverse India | Instagram Followers | 2026-09-27 drove 2,706 link clicks but only 39 LPVs.            </p>            <p>              <strong>Do this:</strong>              Audit destination URL, page load speed, pixel/event setup, UTMs, in-app browser behavior, and whether clicks are going to Instagram/profile actions instead of the ticket/lead landing page.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild campaign structure around business outcomes            </h3>            <p>              <strong>Why:</strong>              Current campaign names and results show follower/like activity, while the business goal is ticket sales and qualified leads. No lead or purchase events are present in the data.            </p>            <p>              <strong>Do this:</strong>              Create separate campaigns for awareness, traffic, leads/messaging, and purchases instead of expecting follower campaigns to deliver ticket sales.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Do not make hard decisions on messaging yet            </h3>            <p>              <strong>Why:</strong>              Only 2 messaging conversations/connections were reported, below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Keep messaging conclusions provisional, but investigate the high 306 messaging_block actions before increasing message campaign budget.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness, engagement, video view, and follower-like delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,191.40 spend generated 227,185 post engagements, 200,457 video views, 15,396 likes, CTR 3.74%, and cost per like of about THB 1.05.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an awareness/follower campaign only, but reduce budget concentration because it is not generating traffic, leads, or purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Best traffic/reach efficiency among the supplied campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,899.27 spend generated 2,706 inline link clicks, 455,854 reach, CPM THB 5.48, frequency 1.56, and estimated cost per inline link click of about THB 1.44.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep carefully for low-cost reach and click generation, but do not scale until the 39 LPVs from 2,706 link clicks issue is fixed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Can generate page/follower-style engagement with low frequency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,242.41 spend generated 897 likes, 2,731 post engagements, CTR 9.00%, and frequency 1.32.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth is a secondary objective; otherwise reduce because it generated 0 inline link clicks and no lead or purchase events.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Poor fit for ticket sales or qualified lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              75.9% of account spend produced only 55 inline link clicks, no landing page views, no leads, no purchases, and frequency reached 3.96.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild separate sales/lead campaigns. Refresh creative or audience if keeping it active for awareness due to elevated frequency.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality or tracking appears weak after the click.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              2,706 inline link clicks produced only 39 landing page views, and messaging produced only 2 conversations/connections with 306 messaging_block actions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit tracking and destination experience before increasing spend. Use this campaign as a diagnostic traffic source, not as proof of qualified demand yet.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Expensive delivery and no website traffic signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CPM was THB 98.16, much higher than AQ_MU2025_Followers_IN at THB 17.32 and Aquaverse India | Instagram Followers | 2026-09-27 at THB 5.48. It also generated 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild unless the only goal is follower/like growth. Do not use this campaign to evaluate sales or lead performance.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New ticket sales or qualified lead campaign              </strong>            </div>            <p>              It consumed THB 16,191.40 of THB 21,333.08 total spend but produced only 55 inline link clicks and no reported LPVs, leads, or purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27 or a rebuilt traffic/lead test              </strong>            </div>            <p>              Daily Follows Likes had 0 inline link clicks and CPM THB 98.16, while Aquaverse India | Instagram Followers | 2026-09-27 delivered 2,706 inline link clicks at about THB 1.44 per inline link click and CPM THB 5.48.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Split budget by funnel: smaller awareness allocation, diagnostic traffic allocation, and dedicated lead/purchase allocation              </strong>            </div>            <p>              The current setup is producing engagement volume but does not show measurable ticket sales or qualified lead outcomes.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Tracked ticket sales or lead campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a new campaign optimized for the correct confirmed event, such as purchase, initiate checkout, or lead, only after event tracking is verified. Keep it separate from follower campaigns.            </p>            <p>              <strong>Success metric:</strong>              At least 3 lead or purchase results before making a decision, then evaluate cost per result without comparing to unknown targets.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Landing page view diagnostic test            </h3>            <p>              <strong>Setup:</strong>              Run the same creative to a verified website landing page with UTMs and pixel events checked, then compare link clicks to landing page views.            </p>            <p>              <strong>Success metric:</strong>              Material improvement from the current 39 LPVs from 2,761 link clicks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Warm retargeting from engagement and video viewers            </h3>            <p>              <strong>Setup:</strong>              Build audiences from AQ_MU2025_Followers_IN engagers and video viewers, then serve ticket or lead-focused creative with a clear call to action.            </p>            <p>              <strong>Success metric:</strong>              Lead, purchase, or landing page view results once at least 3 outcomes are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Traffic creative vs follower creative            </h3>            <p>              <strong>Setup:</strong>              Test ticket/offer-led ads against follower/community-led ads using the same audience and destination.            </p>            <p>              <strong>Success metric:</strong>              Higher landing page views and qualified actions, not just clicks, likes, or post engagements.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No lead actions are reported, so qualified lead performance cannot
