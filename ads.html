lex;    align-items: center;    justify-content: space-between;    gap: 16px;    margin-bottom: 12px;  }  .ai-header h2 {    margin: 0;    font-size: 22px;  }  .health {    padding: 7px 11px;    border-radius: 999px;    font-size: 12px;    font-weight: 700;    text-transform: uppercase;    letter-spacing: 0.05em;  }  .health-good {    background: #dcfce7;    color: #166534;  }  .health-mixed {    background: #fef3c7;    color: #92400e;  }  .health-poor {    background: #fee2e2;    color: #991b1b;  }  .health-insufficient_data {    background: #e5e7eb;    color: #4b5563;  }  .ai-summary {    font-size: 15px;    color: #334155;    margin: 0;  }  .action-grid {    display: grid;    grid-template-columns: repeat(2, minmax(0, 1fr));    gap: 14px;  }  .action-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;    box-shadow: 0 7px 20px rgba(26, 45, 86, 0.05);  }  .action-card h3 {    margin: 12px 0 8px;    font-size: 16px;  }  .action-card p {    margin: 7px 0;    color: #526077;    font-size: 13px;  }  .action-top {    display: flex;    justify-content: space-between;    align-items: center;  }  .action-number {    display: flex;    align-items: center;    justify-content: center;    width: 28px;    height: 28px;    border-radius: 50%;    background: #eef3ff;    color: #284db7;    font-weight: 800;    font-size: 12px;  }  .priority-badge {    padding: 5px 8px;    border-radius: 999px;    background: #edf1f7;    color: #5f6d84;    font-size: 10px;    font-weight: 700;    text-transform: uppercase;  }  .priority-high {    border-top: 4px solid #dc2626;  }  .priority-medium {    border-top: 4px solid #f59e0b;  }  .priority-low {    border-top: 4px solid #16a34a;  }  .finding-grid {    display: grid;    grid-template-columns: repeat(2, minmax(0, 1fr));    gap: 14px;  }  .finding {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .finding.positive {    border-left: 5px solid #16a34a;  }  .finding.negative {    border-left: 5px solid #dc2626;  }  .finding h3 {    margin: 0 0 8px;    font-size: 16px;  }  .finding p {    margin: 0 0 10px;    color: #526077;  }  .evidence,  .recommendation {    font-size: 13px;    margin-top: 7px;    color: #445168;  }  .budget-row {    display: grid;    grid-template-columns: 1fr 40px 1fr;    gap: 12px;    align-items: center;    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-23        →        2026-08-21      </span>      <span class=&quot;pill&quot;>        14 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 124,442.74</strong>        <small>          2026-07-23          to          2026-08-21        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>15,451,793</strong>        <small>          29,174,806 impressions          ·          1.89 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,795</strong>        <small>          0.50% CTR          ·          THB 0.85 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 41,480.91 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>34</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 4.27</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Aquaverse generated very large awareness and engagement volume from THB 124,442.74 spend, with 29,174,806 impressions, 15,451,793 reach, 2,919,910 post engagements, 2,776,813 video views, and 37,457 page likes. However, the business goal is profitable ticket sales and qualified leads, and the data shows only 1 lead, 34 messaging conversations started, 282 landing page views, and no purchase or ROAS data. Current spend is heavily concentrated in follower/engagement campaigns, not clearly in purchase or lead-generation campaigns.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild direct-response structure for leads and ticket sales            </h3>            <p>              <strong>Why:</strong>              The account spent THB 124,442.74 but recorded only 1 lead and no purchase events. Most spend is going to followers, likes, visibility, or post engagement campaigns rather than campaigns optimized for leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Create dedicated Lead and Purchase campaigns with clear conversion events. Do not judge current follower and engagement campaigns by purchases, but stop relying on them to drive qualified leads or ticket sales.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce duplicated Broad Destination spend            </h3>            <p>              <strong>Why:</strong>              Five campaigns named &amp;#039;Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination&amp;#039; spent a combined THB 62,048.20 and produced only 8 inline link clicks, 13 messaging conversations started, and 1 lead. Cost per page like was also weaker than other follower campaigns at approximately THB 9.57 per like.            </p>            <p>              <strong>Do this:</strong>              Consolidate the duplicate Broad Destination campaigns into one rebuilt campaign or ad set structure, reduce current spend materially, and reallocate budget to higher-intent traffic, lead, and purchase tests.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Scale Claude traffic campaigns carefully            </h3>            <p>              <strong>Why:</strong>              The Claude traffic campaigns have very small spend but strong traffic indicators: 507 inline link clicks, 282 landing page views, and only THB 86.13 total spend. &amp;#039;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;#039; had the strongest traffic efficiency with 154 link clicks, 97 landing page views, 13.10% CTR, and THB 0.17 cost per landing page view.            </p>            <p>              <strong>Do this:</strong>              Increase budgets gradually on the Claude campaigns, especially &amp;#039;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;#039;, while monitoring landing page views and downstream lead or purchase events.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking before making purchase-performance decisions            </h3>            <p>              <strong>Why:</strong>              No purchase events or ROAS are present, and only 1 lead is recorded. The supplied minimum_results_before_decision is 3, so lead performance is insufficient for a final lead-generation decision.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI purchase, lead, landing page view, and ticket checkout events before scaling conversion campaigns. Confirm whether the 1 lead action is duplicated across multiple action types or represents one real lead.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 27,657.67 spend produced 26,485 page likes, 503,409 page engagements, 476,924 post engagements, 52,093 post reactions, and 4,592 comments. Approximate cost per page like was THB 1.04.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an awareness/follower campaign, but do not treat it as a lead or purchase driver. Monitor frequency, which is the highest major campaign at 3.35.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Efficient engagement and video-view volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,461.89 spend generated 772,033 post engagements, 722,875 video views, 47,377 post reactions, and 1,057 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and use engaged users/video viewers for retargeting. If scaling, scale carefully because messaging quality is mixed: 14 conversations started but 7 messaging blocks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Best small-sample traffic efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16.24 spend generated 154 inline link clicks, 97 landing page views, 13.10% CTR, and approximately THB 0.17 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale budget and use this as the first traffic test to connect with lead or purchase tracking.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Efficient traffic with strong landing page view rate.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 28.05 spend generated 172 inline link clicks, 94 landing page views, 8.96% CTR, and approximately THB 0.30 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale cautiously alongside the 5-language corporate version.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Efficient early traffic performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 41.84 spend generated 181 inline link clicks, 91 landing page views, 5.70% CTR, and approximately THB 0.46 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic test, but require more spend and downstream conversion data before deciding if families should receive larger budget.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very cheap awareness delivery, but not useful for traffic or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,053.95 spend produced 23,858,978 impressions at THB 0.67 CPM, 1,331,595 post engagements, and 1,315,148 video views, but only 3 link clicks and 1 messaging conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is low-cost awareness/video reach. Reduce or rebuild if the objective is website traffic, leads, messaging, or ticket sales.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Largest spend area is weak for direct response and fragmented across duplicate campaign names.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Five campaigns with this exact name spent approximately THB 62,048.20 combined, generated 8 inline link clicks, 13 messaging conversations started, and only 1 lead. Combined page likes were 6,482, or approximately THB 9.57 per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild. Consolidate duplicate campaigns, clarify whether the objective is follows, leads, messaging, or traffic, and reallocate budget to Claude traffic tests and new lead/purchase campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              One Broad Destination campaign consumed heavy spend for minimal lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign ID 120250948392580402 spent THB 44,087.75 and recorded 1 lead, 10 messaging conversations started, and only 6 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause solely because of lead count because minimum_results_before_decision is 3 and only 1 lead was recorded. However, reduce spend and rebuild the campaign for a clear lead or purchase objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              High delivery cost for a follower/engagement campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,199.85 spend produced 1,847 likes and 8,377 page engagements, but CPM was THB 180.58 and cost per page engagement was approximately THB 0.50.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild or pause after moving learnings into a clean non-quarantined campaign. The sample is sufficient for follower/engagement evaluation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Small
