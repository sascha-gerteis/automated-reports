    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 510,208.61</strong>        <small>          2026-06-26          to          2026-07-25        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>11,151,993</strong>        <small>          37,335,278 impressions          ·          3.35 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>595,599</strong>        <small>          2.52% CTR          ·          THB 0.54 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>36</strong>        <small>          THB 14,172.46 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>7</strong>        <small>          THB 72,886.94 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 2,176.00        </strong>        <small>          0.00× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>264</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 13.67</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account health is mixed. Aquaverse spent THB 510,208.61 and generated very large reach, traffic and engagement: 37,335,278 impressions, 595,599 link clicks, 105,904 omni landing page views, 264 messaging conversations started, 12 leads and 7 purchases. Traffic volume is strong, but business outcomes are weak and highly concentrated: the only campaign with enough purchase data to make a decision is Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;, which produced 4 purchases and 8 leads from THB 2,791.17 spend. Most purchase, lead and corporate campaigns do not have enough conversion results for confident decisions, and many high-spend traffic campaigns show poor click-to-landing-page conversion.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven ticket-sale and landing-page performers            </h3>            <p>              <strong>Why:</strong>              Most spend is producing awareness, clicks or engagement, while only 7 purchases and 12 leads were recorded account-wide. The strongest conversion signal is concentrated in one post campaign with 4 purchases and 8 leads.            </p>            <p>              <strong>Do this:</strong>              Carefully increase budget on Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; and use its creative/message as the base for new purchase, lead and messaging tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on campaigns with high clicks but weak landing-page delivery            </h3>            <p>              <strong>Why:</strong>              Account-wide, 595,599 link clicks produced only 105,904 omni landing page views, a 17.8% click-to-LPV rate. Several campaigns have severe drop-off.            </p>            <p>              <strong>Do this:</strong>              Reduce or rebuild campaigns such as Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-25, Aquaverse Corporate Groups - Leads - Test, and Aquaverse Corporate Groups - Video - TEST where LPV volume is low relative to clicks.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild corporate lead generation instead of continuing current lead campaigns            </h3>            <p>              <strong>Why:</strong>              Corporate lead campaigns spent meaningful budget but recorded no lead actions. TH | B2B Corporate | Video | Leads | 2026-06-18 spent THB 21,561.18 with 0 leads, and Aquaverse Corporate Groups - Leads - Test spent THB 13,058.99 with 0 leads.            </p>            <p>              <strong>Do this:</strong>              Launch a new corporate lead structure using instant forms or a verified landing page, qualified questions, and retargeting from Claude | TH | Corporates | Thai | 2026-06-19 traffic.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate reporting by objective before making pause decisions            </h3>            <p>              <strong>Why:</strong>              Awareness, traffic, engagement, messaging, lead and purchase campaigns are currently mixed together. Most campaigns have fewer than the minimum 3 leads or purchases required for a conversion decision.            </p>            <p>              <strong>Do this:</strong>              Evaluate awareness by reach, CPM and video views; traffic by landing page views and LPV rate; messaging by conversations; leads by lead volume; and purchases only where at least 3 purchases are recorded.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best purchase and lead performer with enough results to act on.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 2,791.17, 4 purchases, 8 leads, 47 messaging conversations started, 235 link clicks, 8 landing page views. Cost per purchase was THB 697.79 and cost per lead was THB 348.90.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Duplicate the post into a structured purchase or lead campaign and increase budget gradually while monitoring whether it continues to generate at least 3 purchases or leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026            </h3>            <p>              Strong traffic quality and landing-page efficiency for ticket-sales traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 3,970.85, 16,108 link clicks, 5,323 landing page views, CTR 13.60%, CPC THB 0.19, estimated cost per LPV THB 0.75.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale as a traffic driver. Test the same creative in a purchase or lead-optimized campaign because LPV volume is strong.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-19            </h3>            <p>              One version of this campaign produced efficient landing-page traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The version with spend THB 2,373.26 generated 8,681 link clicks, 2,504 landing page views, CTR 10.28%, CPC THB 0.23 and estimated cost per LPV THB 0.95.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep this version active as a traffic benchmark and use its creative/landing destination as the control for new purchase tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Corporates | Thai | 2026-06-19            </h3>            <p>              Best corporate traffic source by landing-page delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 6,739.71, 9,347 link clicks, 4,075 landing page views, CTR 8.38%, estimated cost per LPV THB 1.65 and 43.6% &quot;>            <h3>              Aquaverse Corporate Groups - Leads - Test            </h3>            <p>              Lead campaign is not generating leads and has poor landing-page delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 13,058.99, 0 leads, 1,871 link clicks, only 113 landing page views, estimated cost per LPV THB 115.57, link-click-to-LPV rate 6.0%. Most activity came from 48,963 post reactions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild rather than scale. Use a lead form or verified landing page, clearer corporate offer, and optimize for leads instead of engagement-like behavior.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              TH | B2B Corporate | Video | Leads | 2026-06-18            </h3>            <p>              High spend and high frequency with no lead results.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 21,561.18, 0 leads, frequency 6.39, CTR 0.89%, 12,295 link clicks and 1,784 landing page views. Estimated cost per LPV was THB 12.09.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild. Refresh creative, narrow the corporate offer, and move budget into a new lead-form test before spending further at this frequency.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-25            </h3>            <p>              Traffic campaign generated clicks but very few landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Sp quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; and purchase/lead tests based on that post              </strong>            </div>            <p>              The two follow campaigns spent THB 100,241.88 combined with only 15 recorded like actions, while the post campaign produced 4 purchases and 8 leads from THB 2,791.17.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                TH | B2B Corporate | Video | Leads | 2026-06-18 and Aquaverse Corporate Groups - Leads - Test              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | TH | Corporates | Thai | 2026-06-19 plus a rebuilt corporate instant-form lead campaign              </strong>            </div>            <p>              The lead campaigns spent THB 34,620.17 combined with 0 leads, while Claude | TH | Corporates | Thai | 2026-06-19 produced 4,075 landing page views at an estimated THB 1.65 per LPV.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-25              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026 and the THB 2,373.26 version of Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-19              </strong>            </div>            <p>              The 2026-06-25 version had only 363 LPVs from THB 8,342.60 spend, while the 20 Jun version delivered 5,323 LPVs at about THB 0.75 per LPV and the stronger 19 Jun version delivered 2,504 LPVs at about THB 0.95 per LPV.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | TH | Conversions Lazada | 12Jun              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | TH | Conversions Shopee | 12Jun and TH | Traffic | Shopee Store [Claude build]              </strong>            </div>            <p>              Shopee conversion traffic delivered 2,470 LPVs at about THB 1.74 per LPV and 48.3% link-click-to-LPV rate, while Lazada conversion traffic delivered 444 LPVs at about THB 6.12 per LPV.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                High-frequency awareness allocation in Claude | TH | Awareness | Videos | 17Jun              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting audiences built from video viewers, landing page viewers and messaging engagers              </strong>            </div>            <p>              The campaign reached 1,923,207 people at frequency 4.27 and generated 950,276 video views, but direct leads and purchases were not recorded. Use the audience pool for lower-funnel tests.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Winning post purchase/lead scale test            </h3>            <p>              <strong>Setup:</strong>              Duplicate Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; into a structured campaign with purchase and lead ad sets. Start with controlled budget increases and keep the original post ID/social proof where possible.            </p>            <p>              <strong>Success metric:</strong>              At least 3 purchases or 3 leads before decision; compare cost per purchase, cost per lead, messaging conversations and reported purchase value.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Corporate instant-form lead test            </h3>            <p>              <strong>Setup:</strong>              Use Claude | TH | Corporates | Thai | 2026-06-19 as the traffic/creative benchmark and launch a new lead campaign with instant forms, qualifying questions, company size, event date and contact details.            </p>            <p>              <strong>Success metric:</strong>              Minimum 3 leads before decision; judge by cost per lead and qualified lead quality, not by purchases.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Landing page view optimization vs link-click optimization            </h3>            <p>              <strong>Setup:</strong>              Run the strongest Hot Weather creatives in two traffic ad sets: one optimized for landing page views and one optimized for link clicks, using the same audience and destination.            </p>            <p>              <strong>Success metric:</strong>              Higher landing page views, better link-click-to-LPV rate and lower cost per LPV. Secondary metric: leads or purchases if at least 3 are generated.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Shopee vs Lazada marketplace path            </h3>            <p>              <strong>Setup:</strong>              Run equal-budget marketplace campaigns using Shopee and Lazada destinations with similar creative and audience settings.            </p>            <p>              <strong>Success metric:</strong>              Compare landing page views, app/site visits, click-to-LPV rate and any attributed purchases. Do not decide on purchases until each path reaches at least 3 purchases.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Messaging retargeting test            </h3>            <p>              <strong>Setup:</strong>              Retarget people who engaged with the winning posts, video viewers and landing page viewers using click-to-message ads with ticket and group-booking offers.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, messaging depth events and downstream leads/purchases where available.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>Account-wide click-to-landing-page tracking is weak: 595,599 link clicks but only 105,904 omni landing page views, a 17.8% rate. This suggests destination load, marketplace handoff, placement quality or tracking gaps.</li><li>Several campaigns show extreme click-to-LPV gaps, such as Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-25 with 10,912 link clicks and 363 LPVs, and Aquaverse Corporate Groups - Leads - Test with 1,871 link clicks and 113 LPVs.</li><li>Some rows show inline link clicks higher than total clicks, such as Aquaverse Corporate Groups - Image Ads - Test with 3,386 inline link clicks versus 3,209 clicks, which should be checked before relying on click metrics.</li><li>Purchase action types appear repeated across onsite, web, app and omni purchase fields. Do not sum these together; use one consistent purchase metric.</li><li>Purchase value is only reported on one campaign and at account level. Profitability cannot be evaluated because target CPA, target ROAS and complete revenue data are not supplied.</li><li>Most campaigns have fewer than 3 purchases or 3 leads, so conversion decisions are limited by insufficient data.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep awareness and traffic campaigns only where they are efficient for their own objective, but rebalance the account toward conversion learning. Carefully scale the one proven post campaign, rebuild corporate lead generation, reduce high-spend campaigns with poor landing-page delivery, and launch structured purchase, lead, marketplace and messaging tests. Do not pause small-sample campaigns solely for lack of purchases; require at least 3 relevant results before making conversion-based decisions.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout campaigns    </h2>    <div class=&quot;insights&quot;>                <div class=&quot;insight&quot;>            <span>Highest CTR</span>            <strong>18.59% · Aquaverse Corporate Groups eta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-06-26        →        2026-07-25      </span>      <span class=&quot;pill&quot;>        94 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,628,441.88</strong>        <small>          2026-06-26          to          2026-07-25        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>85,987,870</strong>        <small>          216,150,767 impressions          ·          2.51 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>6,005,399</strong>        <small>          3.25% CTR          ·          THB 0.23 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>342</strong>        <small>          THB 4,761.53 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 814,220.94 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>3,101</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.53</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large reach, traffic, engagement and messaging volume, but down-funnel sales data is weak. Spend was THB 1,628,441.88 for 216,150,767 impressions, 6,005,399 link clicks, 1,445,589 landing page views, 3,101 messaging conversations started, 114 leads and only 2 purchases. Traffic efficiency is strong at account level, but purchase volume is below the minimum_results_before_decision of 3, so purchase-level decisions are not statistically reliable. The clearest lead/messaging winners are Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13. Budget is heavily concentrated in broad traffic, corporates, and follow/like campaigns that are not producing proportional qualified leads or purchases.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              The account CPL is THB 14,284.58 from 114 leads, but Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot; generated 17 leads from THB 2,488.72 spend, and Claude | IN | English | India Show 2025 | Traffic | 2026-06-13 generated 41 leads from THB 4,999.42 spend.            </p>            <p>              <strong>Do this:</strong>              Increase budget carefully on Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13 while monitoring CPL, messaging quality, and purchase volume.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce large-spend corporates traffic campaigns            </h3>            <p>              <strong>Why:</strong>              Claude | IN | Corporates | 6 Languages | 2026-06-19 spent THB 300,608.84 for 1 lead and no purchase; Claude | IN | Corporates | 5 Languages | 2026-06-19 spent THB 122,468.71 with 0 leads and 0 purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce budgets on both Corporates campaigns and rebuild them as lead or purchase-focused campaigns with clearer corporate/group booking intent instead of broad traffic delivery.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Limit follow/like spend unless follower growth is a separate goal            </h3>            <p>              <strong>Why:</strong>              Follow/like campaigns generated page likes and engagement but very little qualified traffic. Example: Aquaverse India Daily Follows Likes 2026-06-28 | 5. Special Interest Mix spent THB 18,720.92 for 1 lead and 1 purchase, while many similar follow/like campaigns had only 0-33 link clicks despite thousands of clicks.            </p>            <p>              <strong>Do this:</strong>              Cap follow/like campaigns to awareness-only budget and move excess spend into retargeting, lead generation, and purchase tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix attribution and landing page tracking before scaling purchase campaigns            </h3>            <p>              <strong>Why:</strong>              Daily rows from 2026-07-17 to 2026-07-22 show 0 impressions, 0 clicks, and 0 spend while still reporting leads, landing page views, and messaging events. Several campaigns also show very high link clicks but extremely low landing page views.            </p>            <p>              <strong>Do this:</strong>              Audit pixel, app events, landing page view firing, UTM tagging, and Meta attribution settings before making aggressive purchase optimization decisions.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Build retargeting from existing high-intent pools            </h3>            <p>              <strong>Why:</strong>              The account produced 1,445,589 landing page views, 3,101 messaging conversations started, and 56,367,782 page engagements, but only 2 purchases.            </p>            <p>              <strong>Do this:</strong>              Create retargeting campaigns for landing page viewers, message starters, video viewers, and engagers with ticket purchase and qualified lead offers.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best all-around down-funnel performer with leads, messaging depth, and 1 purchase from low spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 2,488.72, 17 leads, 1 purchase, 381 messaging conversations started, 372 first replies, 2,716 link clicks, CTR 4.93%. CPL was THB 146.40 and cost per messaging conversation started was THB 6.53.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Duplicate into a structured lead or purchase campaign and test variants of the same creative/message.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strongest lead volume among named traffic campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 4,999.42, 41 leads, 885 messaging conversations started, 869 first replies, 39,946 link clicks, CTR 2.16%. CPL was THB 121.94 and cost per messaging conversation started was THB 5.65.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Use this creative/language angle in a dedicated lead or purchase objective test.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong qualified action volume for leads and messaging.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 4,970.24, 25 leads, 743 messaging conversations started, 719 first replies, 40,516 link clicks, CTR 2.28%. CPL was THB 198.81 and cost per messaging conversation started was THB 6.69.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Prioritize Malayalam in the next lead-generation test.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Efficient awareness and traffic driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 27,903.84, 13,914,548 impressions, 1,011,092 link clicks, 256,077 landing page views, CTR 7.39%. Cost per landing page view was about THB 0.11.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for top-of-funnel traffic, but connect it to retargeting rather than judging it by purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient traffic generation at scale.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 16,588.87, 610,208 link clicks, 144,075 landing page views, CTR 7.77%. Cost per landing page view was about THB 0.12.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as traffic feeder if retargeting is active. Do not scale further until downstream conversion tracking is fixed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;Let’s have fun together and make every moment...&amp;quot;            </h3>            <p>              Very strong click and landing page response, but no reported leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 3,125.55, 25,834 link clicks, 11,348 landing page views, CTR 13.29%. Cost per landing page view was about THB 0.28.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use as traffic creative and retarget its visitors; test a stronger lead or ticket CTA before scaling.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-27 | 5. Special Interest Mix            </h3>            <p>              Efficient for page-like objective, not proven for sales.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 20,600.54, 3,697 page likes, 800 comments, 9,164 post reactions, 6 messaging conversations started, but only 10 link clicks and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth is a valid secondary KPI; otherwise reduce and reallocate.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Very high spend with weak qualified outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 300,608.84, 1,000,339 link clicks, 212,578 landing page views, 1 lead, 0 purchases, 7 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce substantially and rebuild around corporate/group booking lead forms or purchase intent. Do not continue broad traffic scaling in current form.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Large traffic volume but no reported leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 122,468.71, 411,759 link clicks, 107,280 landing page views, 0 leads, 0 purchases, 2 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild. Test corporate-specific creative and lead objective instead of traffic objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              High spend and traffic, but no leads or purchases reported.            </p>
