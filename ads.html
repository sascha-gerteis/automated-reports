ckground: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-15        →        2026-08-13      </span>      <span class=&quot;pill&quot;>        75 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 282,424.22</strong>        <small>          2026-07-15          to          2026-08-13        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>25,815,178</strong>        <small>          44,477,427 impressions          ·          1.72 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>526,133</strong>        <small>          1.73% CTR          ·          THB 0.37 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>57</strong>        <small>          THB 4,954.81 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>356</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 6.35</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated very large reach and traffic at low media costs: 44,477,427 impressions, 25,815,178 reach, 526,133 link clicks, 243,953 landing page views and THB 282,424.22 spend. However, only 19 leads were recorded and no purchase or revenue data is supplied, so profitability cannot be assessed. Traffic and awareness campaigns are driving volume efficiently, but lead generation is concentrated in only two low-spend campaigns. A large share of spend is going to page-follow/engagement and high-spend traffic campaigns that are not producing leads or measurable purchase outcomes.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead-producing campaigns            </h3>            <p>              <strong>Why:</strong>              Only two campaigns have enough lead volume to evaluate and both are very efficient: &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot; generated 6 leads from THB 545.83 and &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot; generated 6 leads from THB 522.21.            </p>            <p>              <strong>Do this:</strong>              Increase budgets on these two campaigns carefully by 20-30%, monitor lead volume and lead quality, and duplicate their winning creative/language setup into a dedicated lead or messaging campaign.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce inefficient high-spend traffic allocations            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;quot; spent THB 32,080.47 with 40,432 landing page views and no leads, while &amp;quot;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;quot; spent THB 16,469.77 with 23,366 landing page views and no leads.            </p>            <p>              <strong>Do this:</strong>              Reduce both Corporates campaign budgets by 30-40% and reallocate to the lead winners plus the most efficient landing-page-view campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness/page-follow budgets from lead and ticket-sales budgets            </h3>            <p>              <strong>Why:</strong>              Many page-follow campaigns are delivering engagement or likes, but almost no link clicks or leads. For example, &amp;quot;Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination&amp;quot; spent THB 37,249.83, generated 3,363 likes and 182,779 page engagements, but only 5 link clicks and no leads.            </p>            <p>              <strong>Do this:</strong>              Cap page-follow/engagement spend and create a separate conversion-focused budget for leads, messaging conversations, landing page views, and eventual purchase tracking.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix tracking inconsistencies before making purchase-profitability decisions            </h3>            <p>              <strong>Why:</strong>              There are actions recorded on zero-spend and zero-impression days, and some campaigns show extremely low landing page views despite thousands of link clicks.            </p>            <p>              <strong>Do this:</strong>              Audit Meta Pixel, landing page view firing, attribution settings, campaign objective setup, URL parameters, and whether leads/messages are being attributed after delivery stopped.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Best proven lead performer with enough results to evaluate.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              6 leads from THB 545.83 spend, implied CPL THB 90.97, 3,710 link clicks, 75 messaging conversations started, 75 first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale by 20-30%. Rebuild this concept into a dedicated lead or messaging campaign using the same creative/language angle.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strongest messaging and lead campaign among supplied data.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              6 leads from THB 522.21 spend, implied CPL THB 87.04, 3,791 link clicks, 111 messaging conversations started, 109 first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale by 20-30%. Prioritize this language/creative angle for new lead and messaging tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Highly efficient traffic and landing page view campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,546.55 spend, 80,011 link clicks, 41,872 landing page views, CTR 7.28%, CPM THB 2.28, implied cost per landing page view THB 0.06.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a top-of-funnel traffic source. Use this audience/creative to build retargeting pools for lead and ticket-sales campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Very efficient image-led traffic campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,293.27 spend, 42,772 link clicks, 22,456 landing page views, CTR 7.54%, implied cost per landing page view THB 0.06.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and test scaling. Use its best images in lead-focused campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Most efficient page-like/follower campaign among campaigns with like volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 23,031.78 spend, 21,147 likes, implied cost per like THB 1.09, 422,850 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if follower growth is still a priority, but do not treat it as a ticket-sales or lead campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Strong awareness delivery at very low CPM.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              21,018,714 impressions, 11,830,807 reach, CPM THB 0.66, frequency 1.78.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as an awareness layer with a capped budget. Do not judge it by leads or purchases because its delivery is awareness/visibility-oriented.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Couples | 5 Languages | 2026-06-19            </h3>            <p>              Efficient segment traffic compared with other persona campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,014.33 spend, 8,999 link clicks, 5,294 landing page views, CTR 7.68%, implied cost per landing page view THB 0.38.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic test and retarget its landing page visitors.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Party Goers | 5 Languages | 2026-06-19            </h3>            <p>              Efficient traffic within the persona campaign group.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,081.44 spend, 9,492 link clicks, 5,326 landing page views, implied cost per landing page view THB 0.39.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and test this audience with lead/messaging objectives.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              High spend with weaker landing page efficiency and no recorded leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 32,080.47 spend, 92,667 link clicks, 40,432 landing page views, implied cost per landing page view THB 0.79, no leads recorded.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget by 30-40%. Rebuild with a clearer corporate lead offer if corporate bookings are a priority.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with no lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,469.77 spend, 51,387 link clicks, 23,366 landing page views, implied cost per landing page view THB 0.70, no leads recorded.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and test a dedicated corporate lead form or WhatsApp/message objective instead of broad traffic.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Less efficient traffic than Couples and Party Goers persona campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 8,710.94 spend, 22,753 link clicks, 13,542 landing page views, implied cost per landing page view THB 0.64, no leads recorded.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and refresh family-specific creative/offer before scaling.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Very large spend for page engagement but weak for traffic or lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 37,249.83 spend, 779,260 impressions, 3,363 likes, 182,779 page engagements, only 5 link clicks, no leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or cap this campaign unless page likes are the primary objective. Reallocate excess budget to lead and landing-page-view campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Duplicate campaign structure appears fragmented and inefficient.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Multiple campaigns share the same name/date/audience with separate spend, including THB 37,249.83, THB 4,699.03, THB 5,460.46, THB 4,613.57 and THB 2,366.49 spend lines.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate duplicate Broad Destination page-like campaigns into fewer campaigns/ad sets to reduce budget fragmentation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | English | Water Park &amp;amp; Interview | Traffic | 2026-06-13            </h3>            <p>              Too few leads to make a final decision, but traffic-to-landing-page tracking looks weak.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1 lead, below the minimum decision threshold of 3; 3,213 link clicks but only 11 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on lead volume yet. Audit landing page view tracking and retest with the same budget only after tracking is verified.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Kannada | 05 Urgent IN | Traffic | 2026-06-13            </h3>            <p>              Lead volume is below the minimum decision threshold.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              2 leads from THB 530.45 spend, below the minimum_results_before_decision of 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on leads yet. Continue only with controlled spend until it reaches at least 3 leads, then compare against other language campaigns.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13 and Claude | IN | English | India Show 2025 | Traffic | 2026-06-13              </strong>            </div>            <p>              Corporates 6 Languages spent THB 32,080.47 with no leads, while Malayalam and India Show each produced 6 leads with under THB 550 spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 5 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                IN_AWR_General_Image_Claude_2026-06-14 and Claude | IN | Daily 8 IMAGES MultiLang | 15Jun              </strong>            </div>            <p>              Corporates 5 Languages has implied cost per landing page view THB 0.70 with no leads; IN_AWR and Daily 8 Images both show implied cost per landing page view around THB 0.06.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead/messaging tests using India Show and Malayalam creatives              </strong>            </div>            <p>              This page-like campaign spent THB 37,249.83 and generated only 5 link clicks and no leads. It may support engagement, but it is not aligned with the stated goal of profitable ticket sales and qualified leads.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Fragmented duplicate Daily Follows Likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                One capped awareness/page-like campaign plus separate conversion-focused campaigns              </strong>            </div>            <p>              Many duplicate Broad Destination and audience variants are spending separately with very low link click volume. Consolidation will simplify learning and free budget for lead generation.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Families | 6 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | IN | Couples | 5 Languages | 2026-06-19 and Claude | IN | Party Goers | 5 Languages | 2026-06-19              </strong>            </div>            <p>              Families 6 Languages has implied cost per landing page view THB 0.64, while Couples 5 Languages is THB 0.38 and Party Goers 5 Languages is THB 0.39.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead objective test using winning language creatives            </h3>            <p>              <strong>Setup:</strong>              Create a new lead or messaging campaign using the creative/language angles from &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot; and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot;. Split Malayalam and English into separate ad sets.            </p>            <p>              <strong>Success metric:</strong>              Leads and messaging conversations started after each ad set reaches at least 3 leads; also review lead quality manually.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Landing page view retargeting            </h3>            <p>              <strong>Setup:</strong>              Retarget users who generated landing page views from &amp;quot;IN_AWR_General_Image_Claude_2026-06-14&amp;quot;, &amp;quot;Claude | IN | Daily 8 IMAGES MultiLang | 15Jun&amp;quot;, Couples 5 Languages and Party Goers 5 Languages.            </p>            <p>              <strong>Success metric:</strong>              Lead volume, cost per lead and messaging conversations started, with decisions only after at least 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Image vs video traffic-to-lead test            </h3>            <p>              <strong>Setup:</strong>              Test image creatives from &amp;quot;Claude | IN | Daily 8 IMAGES MultiLang | 15Jun&amp;quot; against video creatives from &amp;quot;Claude | IN | Daily 8 Videos MultiLang | 12Jun&amp;quot; inside the same objective and audience structure.            </p>            <p>              <strong>Success metric:</strong>              Cost per landing page view first, then leads once each variation reaches at least 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Persona traffic quality test            </h3>            <p>              <strong>Setup:</strong>              Run Couples 5 Languages, Party Goers 5 Languages, Families 6 Languages and Corporates 5 Languages under equal budgets with the same optimization event.            </p>            <p>              <strong>Success metric:</strong>              Cost per landing page view, messaging conversations and leads. Do not make lead-based decisions until each persona reaches at least 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Page-like campaign consolidation test            </h3>            <p>              <strong>Setup:</strong>              Consolidate duplicate Daily Follow
