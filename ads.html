 margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-15        →        2026-09-13      </span>      <span class=&quot;pill&quot;>        20 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 45,669.02</strong>        <small>          2026-08-15          to          2026-09-13        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>3,882,792</strong>        <small>          6,430,945 impressions          ·          1.66 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>152</strong>        <small>          1.11% CTR          ·          THB 0.64 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.10</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated very large awareness and engagement volume: 6,430,945 impressions, 3,882,792 reach, 790,045 page engagements, 710,998 video views, and 26,256 likes from THB 45,669.02 spend. However, the business goal is ticket sales and qualified leads, and the data shows no purchase actions, no lead actions, only 152 link clicks, and only 1 messaging conversation started. Current spend is heavily weighted toward followers, engagement, and awareness rather than measurable sales or lead generation.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget from engagement-only activity into lead or sales campaigns            </h3>            <p>              <strong>Why:</strong>              The account spent THB 45,669.02 but recorded no leads, no purchases, and only 152 link clicks. Most volume is page engagement, likes, reactions, and video views.            </p>            <p>              <strong>Do this:</strong>              Create dedicated Lead or Sales campaigns and fund them from underperforming follower/engagement campaigns. Do not judge these campaigns by purchases until purchase and lead tracking is confirmed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN but scale carefully            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN is the strongest follower campaign at scale, generating 23,185 likes and 445,275 page engagements from THB 25,882.71, with cost per like of about THB 1.12. However, frequency is 4.37 versus account frequency of 1.66.            </p>            <p>              <strong>Do this:</strong>              Keep active for follower growth, but cap further budget increases and refresh creative/audience before scaling due to higher frequency.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild weak Broad Destination follower campaigns            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination spent THB 2,678.02 for only 117 likes, about THB 22.89 per like, and generated 0 link clicks.            </p>            <p>              <strong>Do this:</strong>              Reduce budget on campaign ID 120250948392580402 and rebuild with learnings from lower-cost follower campaigns such as AQ_MU2025_Followers_IN and the better Aug 30 variants.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Clean up quarantined and duplicate campaign structure            </h3>            <p>              <strong>Why:</strong>              Multiple campaigns have identical names or begin with ERROR QUARANTINED, making performance decisions and budget allocation unclear.            </p>            <p>              <strong>Do this:</strong>              Consolidate duplicate Broad Destination campaigns, rename campaigns clearly by objective/audience/date, and rebuild quarantined campaigns only if they are still needed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix conversion and lead tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              There are no purchase, ROAS, or lead events in the supplied data, so profitable ticket sales and qualified leads cannot be evaluated.            </p>            <p>              <strong>Do this:</strong>              Verify Meta Pixel, Conversions API, lead event, purchase event, and event deduplication before launching or scaling sales/lead campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strongest scaled follower and engagement driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 25,882.71 spend, 1,458,409 impressions, 57,178 clicks, 120 link clicks, 445,275 page engagements, 23,185 likes, 378,392 video views, CTR 3.92%, cost per like about THB 1.12.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active for follower growth. Scale carefully only after refreshing creative/audience because frequency is 4.37, the highest major campaign frequency in the account.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Efficient low-spend engagement and link-click campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 215.65 spend, 29,276 page engagements, 26,867 video views, 31 link clicks, CPM THB 2.34, cost per link click about THB 6.96.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully test more budget. Use the best-performing post/creative as the basis for traffic, lead, or retargeting tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient awareness reach and video-view delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,276.58 spend, 4,560,112 impressions, 3,366,848 reach, CPM THB 0.72, 239,055 page engagements, 235,925 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is awareness or reach. Do not use it as a traffic or sales driver because it generated 0 link clicks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Generated follower volume from a small reach base.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,793.41 spend, 890 likes, 3,201 page engagements, CTR 12.48%, cost per like about THB 2.02.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if Thailand follower growth is intentional. Monitor closely because CPM is THB 227.62, much higher than most other campaigns in the data.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Several Aug 30 variants produced moderate follower efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign IDs 120251570556340402 and 120251570562550402 generated 88 likes from THB 352.60 and 99 likes from THB 462.26, about THB 4.01 and THB 4.67 per like respectively.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as secondary follower campaigns if follower growth remains a goal, but consolidate duplicate variants before scaling.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Weak follower efficiency at meaningful spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign ID 120250948392580402 spent THB 2,678.02 for 117 likes, about THB 22.89 per like, with 0 link clicks and CPM THB 54.02.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget or rebuild. Reallocate spend to AQ_MU2025_Followers_IN, better Aug 30 follower variants, or new lead/sales tests.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Not suitable for traffic or conversion goals.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Despite 4,560,112 impressions and THB 3,276.58 spend, it generated 0 link clicks and CTR was 0.0367%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Use only for awareness. If the goal is ticket sales or leads, move part of this budget into traffic, lead, messaging, or purchase campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Mixed follower performance and almost no lower-funnel activity.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign ID 120251495845220402 spent THB 2,430.56 for 354 likes, 1 link click, and 1 messaging conversation started. Cost per like was about THB 6.87 and messaging result volume is below the minimum decision threshold of 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause solely based on messaging because there is only 1 conversation. Reduce if the objective is efficient follower growth, or rebuild as a dedicated messaging/lead campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data for performance decisions.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The Aug 28 variants spent only THB 7.06, THB 4.26, THB 6.55, and THB 6.64, with 1 to 4 likes each.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on this tiny sample. Either give the test enough budget to reach at least 3 meaningful results per decision metric or remove as part of account cleanup if it is an inactive/quarantined duplicate.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide traffic performance            </h3>            <p>              Very low true outbound traffic relative to spend and clicks.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The account recorded 71,657 total clicks but only 152 link clicks from THB 45,669.02 spend, about THB 300.45 per link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Stop using total clicks as the main traffic KPI. Optimize and report on link clicks, landing page views, leads, messages, and purchases depending on campaign objective.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, campaign ID 120250948392580402              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN or new Lead/Sales campaign              </strong>            </div>            <p>              This campaign spent THB 2,678.02 for only 117 likes, about THB 22.89 per like, while AQ_MU2025_Followers_IN produced likes at about THB 1.12.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated traffic, lead, messaging, or purchase test              </strong>            </div>            <p>              The campaign is efficient for awareness with CPM THB 0.72 but generated 0 link clicks, so it should not carry budget meant for ticket sales or leads.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate Broad Destination follower campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Consolidated best-performing follower campaigns and structured lead/sales tests              </strong>            </div>            <p>              Multiple campaigns share the same or near-identical names, fragmenting spend and making optimization unclear. Better Aug 30 variants delivered likes around THB 4.01 to THB 4.67, while weaker variants were much higher.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current engagement-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaign built from page engagements, video views, saves, comments, and followers              </strong>            </div>            <p>              The account has 790,045 page engagements, 710,998 video views, 1,067 saves, and 3,643 comments, but there is no evidence that this engaged audience is being converted into leads or ticket sales.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead objective test for qualified enquiries            </h3>            <p>              <strong>Setup:</strong>              Launch a Meta Lead campaign with instant form. Test one broad India ad set against one retargeting ad set built from page engagers, video viewers, commenters, savers, and followers from this period.            </p>            <p>              <strong>Success metric:</strong>              Wait for at least 3 leads per ad set before making decisions. Compare cost per lead and lead quality; target CPL is unknown, so do not compare against a target.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket sales conversion tracking test            </h3>            <p>              <strong>Setup:</strong>              After confirming purchase event tracking, launch a small Sales campaign optimized for purchase or initiate checkout, using clear ticket-purchase creative and landing page CTA.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 purchase events. Compare cost per purchase and ROAS once purchase value is available; targets are currently unknown.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engagement-to-traffic retargeting test            </h3>            <p>              <strong>Setup:</strong>              Retarget users who engaged with posts, watched videos, saved posts, commented, or liked the page. Use ticket-focused creative and optimize for link clicks or landing page views.            </p>            <p>              <strong>Success metric:</strong>              Primary metric should be link clicks or landing page views, not total clicks. Compare against current account link-click cost of about THB 300.45.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Best-post creative adaptation test            </h3>            <p>              <strong>Setup:</strong>              Take creative themes from New post engagement campaign and test versions with direct ticket-sales or lead-generation CTAs.            </p>            <p>              <strong>Success metric:</strong>              Judge by link clicks, leads, messages, or purchases depending on objective. Require at least 3 meaningful results before decisions.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Follower campaign consolidation test            </h3>            <p>              <strong>Setup:</strong>              Run a clean follower-growth test using one AQ_MU2025_Followers_IN-style ad set and one Aug 30 Broad Destination-style ad set, with duplicated/quarantined versions removed.            </p>            <p>              <strong>Success metric:</strong>              Compare cost per like and frequency. AQ_MU2025_Followers_IN baseline is about THB 1.12 per like, while selected Aug 30 variants ranged around THB 4.01 to THB 4.67 per like.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase actions, purchase value, ROAS, or lead actions are present, so profitable ticket sales and qualified leads cannot be evaluated.</li><li>Targets for cost per lead, cost per purchase, and ROAS are all 0, meaning they are unknown and should not be used for performance comparison.</li><li>There is a major gap between 71,657 total clicks and 152 link clicks, indicating most clicks are engagement clicks rather than traffic to a ticket or lead destination.</li><li>Messaging data is below the minimum decision threshold: only 1 messaging conversation started, 1 first reply, and 1 total messaging connection.</li><li>Multiple campaigns are labeled ERROR QUARANTINED and several campaigns have duplicate names, which creates reporting and optimization ambiguity.</li><li>A Thailand campaign is running inside the India Ad Account; verify whether this is intentional geo/account structure.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep AQ_MU2025_Followers_IN for follower grow
