.ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-26        →        2026-09-24      </span>      <span class=&quot;pill&quot;>        14 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 32,295.08</strong>        <small>          2026-08-26          to          2026-09-24        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>423,640</strong>        <small>          1,606,550 impressions          ·          3.79 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>80</strong>        <small>          3.52% CTR          ·          THB 0.57 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 20.10</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account spent 32,295.08 THB and generated strong awareness/engagement activity: 1,606,550 impressions, 423,640 reach, 424,062 page engagements, 364,700 video views, and 22,058 page likes. However, performance is not aligned with the stated goal of profitable ticket sales and qualified leads because no purchase events and no lead events are reported. Traffic quality is also weak: only 80 inline link clicks from 32,295.08 THB spend, or 403.69 THB per inline link click. Messaging data is insufficient with only 1 conversation started, below the minimum_results_before_decision of 3.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN but limit it to awareness/follower growth            </h3>            <p>              <strong>Why:</strong>              This campaign produced the majority of efficient engagement: 20,389 page likes from 22,354.08 THB, or 1.10 THB per page like, plus 368,695 page engagements and 313,446 video views.            </p>            <p>              <strong>Do this:</strong>              Keep AQ_MU2025_Followers_IN active, but do not judge it by ticket sales unless purchase tracking and a sales objective are added. Scale carefully only if page-like efficiency remains stable and frequency does not rise materially above the current 4.53.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or pause high-spend ERROR QUARANTINED follower/like duplicates            </h3>            <p>              <strong>Why:</strong>              The non-AQ campaigns spent 9,941.00 THB and generated only 1,669 page likes, about 5.96 THB per page like, compared with 1.10 THB per page like from AQ_MU2025_Followers_IN. They also produced only 1 inline link click and 1 messaging conversation.            </p>            <p>              <strong>Do this:</strong>              Reduce budget sharply or pause the high-spend ERROR QUARANTINED duplicates with more than 3 results, especially the 2026-08-23 and 2026-08-25 campaigns, and consolidate testing into fewer campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Build campaigns specifically for ticket sales and qualified leads            </h3>            <p>              <strong>Why:</strong>              Current spend is concentrated in followers/likes activity. There are no reported purchases or leads, so the account cannot yet prove contribution to profitable ticket sales or qualified lead volume.            </p>            <p>              <strong>Do this:</strong>              Create separate purchase, lead, and messaging campaigns with the correct optimization event instead of relying on follower/like campaigns to drive business outcomes.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix conversion and lead tracking before scaling sales budget            </h3>            <p>              <strong>Why:</strong>              The dataset reports 0 purchases, 0 leads, and only 1 messaging conversation. Inline link clicks are only 80 while total clicks are 56,510, indicating most clicks are engagement clicks rather than site traffic.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI, purchase event, lead event, UTMs, ticket checkout tracking, and CRM lead capture before making profitability decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strongest awareness and follower-growth performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 22,354.08 THB, delivered 1,377,977 impressions, 304,414 reach, 368,695 page engagements, 313,446 video views, and 20,389 page likes. Cost per page like was 1.10 THB, much stronger than the non-AQ campaign average of about 5.96 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active for awareness/follower growth. Scale carefully in small budget increases only while cost per page like and engagement volume remain stable.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Efficient delivery cost versus the rest of the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CPM was 16.22 THB and CPC was 0.47 THB, both lower than several ERROR QUARANTINED campaigns such as 2026-08-23 with 50.38 THB CPM and 1.31 THB CPC.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use this campaign’s best-performing creatives/audiences as the starting point for retargeting and lead/sales tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Account-level engagement pool            </h3>            <p>              Large retargeting pool is being built.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The account generated 424,062 page engagements, 402,004 post engagements, 364,700 video views, 31,078 post reactions, 2,920 comments, and 936 saves.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Create retargeting audiences from page engagers, video viewers, savers, and commenters, then test ticket and lead offers against those audiences.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Inefficient compared with AQ_MU2025_Followers_IN and not producing traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 2,902.10 THB, generated 485 page likes at 5.98 THB per page like, CPM of 50.38 THB, CPC of 1.31 THB, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause this campaign and move budget to AQ_MU2025_Followers_IN or new lead/sales campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Multiple duplicate campaigns are spending inefficiently.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              One duplicate spent 1,487.24 THB for 208 page likes, or 7.15 THB per page like, with 0 inline link clicks. Another spent 1,022.51 THB for 200 page likes, or 5.11 THB per page like, with 0 inline link clicks. Another spent 2,331.04 THB for 336 page likes, or 6.94 THB per page like, with only 1 inline link click and 1 messaging conversation.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate these duplicates. Keep only one controlled test if needed; otherwise reallocate spend to the stronger AQ campaign and to business-goal campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Lower-cost than the 08-23 and 08-25 quarantined campaigns, but still weaker than AQ_MU2025_Followers_IN.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The 08-30 duplicates spent between 352.60 THB and 462.26 THB each, with page-like costs ranging from 4.01 THB to 6.07 THB and 0 inline link clicks across the listed 08-30 campaigns.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale these. If testing continues, cap budget and compare only against engagement/follower metrics, not purchases.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data for a hard performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The 08-28 campaigns spent only 4.26 THB to 7.06 THB each and generated between 1 and 4 page likes, with tiny impression volumes of 29 to 58.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based only on this tiny sample. Either allow a controlled minimum test or remove these from reporting noise if they were accidental launches.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-level traffic performance            </h3>            <p>              Traffic performance is weak despite high total click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The account reported 56,510 total clicks but only 80 inline link clicks from 32,295.08 THB spend, or 403.69 THB per inline link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Separate engagement campaigns from traffic/sales campaigns. Launch dedicated traffic or sales campaigns only after tracking is verified.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-level lead, messaging, and purchase performance            </h3>            <p>              No measurable lead or purchase performance is available.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              No lead actions and no purchase actions are reported. Only 1 messaging conversation started was reported, which is below the minimum_results_before_decision of 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make profitability decisions yet. Fix tracking and launch campaigns optimized for leads, messaging, and purchases.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED campaigns as a group              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <p>              The ERROR QUARANTINED campaigns spent 9,941.00 THB for 1,669 page likes, about 5.96 THB per page like, while AQ_MU2025_Followers_IN generated page likes at 1.10 THB each.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                High-spend duplicate ERROR QUARANTINED campaigns from 2026-08-23 and 2026-08-25              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New purchase campaign for ticket sales              </strong>            </div>            <p>              These campaigns are optimized around follows/likes and produced no meaningful ticket-sale signal. A dedicated purchase campaign is required to evaluate ticket sales.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Follower/like campaign testing budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead generation campaign              </strong>            </div>            <p>              The business goal includes qualified leads, but no lead events are reported. Budget needs to be assigned to a lead objective or verified lead event.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Broad engagement-only campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaign using page engagers and video viewers              </strong>            </div>            <p>              The account has large warm audiences from 424,062 page engagements and 364,700 video views that can be tested with ticket or inquiry offers.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Ticket sales purchase campaign            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated sales campaign optimized for the purchase event once Pixel/CAPI and checkout tracking are verified. Use ticket-focused creative and compare broad targeting against warm retargeting from page engagers and video viewers.            </p>            <p>              <strong>Success metric:</strong>              Reported purchases, cost per purchase, and ROAS once purchase value tracking is confirmed.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Instant form qualified lead campaign            </h3>            <p>              <strong>Setup:</strong>              Run a lead objective campaign using an instant form with qualifying questions for group bookings, events, or ticket inquiries. Retarget page engagers, commenters, savers, and video viewers.            </p>            <p>              <strong>Success metric:</strong>              Qualified lead volume and cost per qualified lead after at least 3 leads are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Messaging lead test            </h3>            <p>              <strong>Setup:</strong>              Run a click-to-message campaign with pre-filled questions for ticket inquiries. Keep it separate from follower/like campaigns.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started and qualified conversations after reaching at least 3 messaging results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Retargeting offer test            </h3>            <p>              <strong>Setup:</strong>              Create audiences from the 364,700 video views and 424,062 page engagements, then test ticket offer creatives against these warm audiences.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, leads, purchases, and cost per result by audience.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative migration test from AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong>              Take the strongest engagement creatives from AQ_MU2025_Followers_IN and test them in traffic, lead, and purchase objectives.            </p>            <p>              <strong>Success metric:</strong>              Whether the same creative can generate business-goal actions, not just likes and engagement.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events are reported, so ticket sales performance and ROAS cannot be evaluated.</li><li>No lead events are reported, so q
