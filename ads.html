>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 16.59</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account delivery is strong for awareness and engagement, but weak for the stated goal of profitable ticket sales and qualified leads. Spend was THB 23,352.53, generating 1,407,881 impressions, 339,516 page engagements, 19,333 likes, and 286,010 video views. However, only 644 link clicks, 11 landing page views, 1 messaging conversation started, and no purchase or lead actions were reported. Most spend is concentrated in follower/like campaigns, so the account is currently optimized for audience growth rather than sales or qualified lead generation.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Realign spend from follower growth to sales and lead generation            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN spent THB 20,092.08, or most of total spend, but produced only 67 link clicks and no reported leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep AQ_MU2025_Followers_IN as a reduced awareness/follower layer, but move budget into dedicated sales, lead, and messaging campaigns built around ticket purchase and inquiry actions.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix tracking before judging purchase or lead performance            </h3>            <p>              <strong>Why:</strong>              Across THB 23,352.53 spend, there are no reported purchase or lead actions, only 11 landing page views and 1 messaging conversation started.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI events for ViewContent, Lead, InitiateCheckout, and Purchase, confirm event prioritization, and use UTMs on all ticket and lead links.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Pause or rebuild quarantined duplicate follower campaigns            </h3>            <p>              <strong>Why:</strong>              The five ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination campaigns spent THB 2,173.60 combined, had 58,551 impressions, 0 inline link clicks, and much higher CPMs around THB 35.51-39.38 versus THB 16.59 account CPM.            </p>            <p>              <strong>Do this:</strong>              Stop using the quarantined campaign set and rebuild into one clean campaign/ad set structure if follower growth is still needed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate Instagram Followers traffic quality            </h3>            <p>              <strong>Why:</strong>              Aquaverse India | Instagram Followers | 2026-09-27 produced 577 link clicks at THB 1.19 per link click, but only 11 landing page views, a very large drop-off from click to landing page view.            </p>            <p>              <strong>Do this:</strong>              Check destination URL, page load speed, placement behavior, in-app browser compatibility, and LPV tracking before scaling this campaign.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness and engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 20,092.08 spend generated 1,215,330 impressions, 324,306 page engagements, 18,632 likes, and 273,511 video views. Cost per page engagement was approximately THB 0.06.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a smaller top-of-funnel audience-building campaign, but do not rely on it for ticket sales or leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient reach and link-click generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 687.67 spend generated 130,058 impressions at THB 5.29 CPM, 577 link clicks, and THB 1.19 cost per link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep testing, but scale carefully only after the landing page view drop-off is resolved.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              High interaction rate from a small spend base.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 399.18 spend generated 379 clicks, 271 likes, 49 comments, and 1,137 page engagements with 9.61% CTR.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a limited creative/audience test, but avoid scaling until CPM improves and the campaign proves it can drive meaningful link or lead actions.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Not supporting traffic, lead, or purchase objectives.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Despite THB 20,092.08 spend, the campaign produced only 67 link clicks and no reported leads or purchases. Frequency is also high at 4.27.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and refresh creative/audiences if retained for awareness. Use engagement audiences from this campaign for retargeting into lead or sales campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Inefficient and structurally problematic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Five duplicate quarantined campaigns spent THB 2,173.60 combined with 0 inline link clicks, CPMs between THB 35.51 and THB 39.38, and only 430 likes combined.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause the quarantined duplicates and rebuild only one clean follower/engagement test if this objective remains useful.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Engagement exists, but media cost is expensive for reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CPM is THB 101.26, much higher than the account CPM of THB 16.59, and the campaign generated 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep budget capped while testing creative and audience changes. Do not scale based only on CTR.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Click quality or tracking appears weak.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              577 link clicks produced only 11 landing page views, and the campaign also recorded 109 messaging blocks versus only 1 messaging conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit the destination and tracking setup before adding more budget.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New ticket sales, lead, or messaging campaigns              </strong>            </div>            <p>              This campaign consumed THB 20,092.08 but delivered mainly engagement, likes, and video views rather than reported leads or purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Clean rebuilt follower/engagement test or conversion-focused campaign              </strong>            </div>            <p>              The quarantined duplicates spent THB 2,173.60 combined with 0 inline link clicks and materially higher CPMs than the main account average.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaign using engagers, video viewers, and Instagram profile visitors              </strong>            </div>            <p>              The account generated large engagement pools, including 339,516 page engagements and 286,010 video views, but does not yet have a clear conversion layer.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Incremental scale budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27 only after LPV issue is fixed              </strong>            </div>            <p>              The campaign has efficient CPM and link-click cost, but 11 landing page views from 577 link clicks indicates the traffic path is not yet reliable.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Ticket sales conversion campaign            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated sales campaign to the ticket purchase page using verified Pixel/CAPI events. Start with broad targeting and a retargeting ad set built from page engagers, video viewers, and link clickers.            </p>            <p>              <strong>Success metric:</strong>              Judge only after at least 3 purchase events. If purchases are not firing, use landing page views and checkout events only as interim diagnostics.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Qualified lead instant form campaign            </h3>            <p>              <strong>Setup:</strong>              Create a lead campaign with an instant form for group bookings, event inquiries, or ticket assistance. Add qualifying questions to filter low-intent users.            </p>            <p>              <strong>Success metric:</strong>              Evaluate cost per qualified lead after at least 3 leads are generated.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Click-to-message lead campaign            </h3>            <p>              <strong>Setup:</strong>              Run a messaging campaign with automated questions for visit date, ticket quantity, group size, and contact details.            </p>            <p>              <strong>Success metric:</strong>              Evaluate messaging conversations started and first replies after at least 3 messaging results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Landing page view diagnostic test            </h3>            <p>              <strong>Setup:</strong>              Use the same creative from Aquaverse India | Instagram Followers | 2026-09-27 in a traffic campaign optimized for landing page views with UTMs enabled.            </p>            <p>              <strong>Success metric:</strong>              Compare link clicks to landing page views and continue only if LPVs track consistently.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative refresh for AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong>              Test new creatives focused on ticket value, attractions, pricing, urgency, and social proof while limiting the follower objective budget.            </p>            <p>              <strong>Success metric:</strong>              Compare engagement quality, link clicks, and retargeting audience growth rather than purchases.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase or lead actions are reported, so purchase and lead performance cannot be evaluated from this data.</li><li>Only 11 landing page views were reported from 644 link cl
