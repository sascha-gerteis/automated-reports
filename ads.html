       ·          THB 0.85 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 41,136.74 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>35</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 4.28</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account delivered large reach and engagement efficiently, with 28,854,000 impressions, 15,331,945 reach, THB 123,410.21 spend, CPM THB 4.28, and 2,928,767 page engagements. However, it is not yet proving the business goal of profitable ticket sales or qualified leads: only 1 lead was recorded, no purchase events were supplied, and lead volume is below the minimum_results_before_decision of 3. Budget is heavily concentrated in follower/engagement campaigns, especially the Broad Destination cluster, which generated weak link and lead outcomes relative to spend.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce the Broad Destination follower cluster and rebuild it            </h3>            <p>              <strong>Why:</strong>              The five campaigns named Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination spent a combined THB 62,048.20, over half of total spend, but produced only 8 inline link clicks, 1 lead, and 13 messaging conversations started. The lead count is below the decision threshold, but the traffic and engagement efficiency are clearly weak versus other campaigns.            </p>            <p>              <strong>Do this:</strong>              Cut combined Broad Destination budgets by 50-60%, consolidate duplicate campaigns into one rebuilt campaign, and test new creatives/audiences before scaling again.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix sales and lead measurement before judging profitability            </h3>            <p>              <strong>Why:</strong>              The account goal is ticket sales and qualified leads, but no purchase events or ROAS data were supplied, and only 1 lead was recorded from THB 123,410.21 spend.            </p>            <p>              <strong>Do this:</strong>              Verify Meta Pixel/CAPI purchase, lead, and landing page events; confirm ticket checkout fires purchase events; add UTMs to all website traffic campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the Claude traffic campaigns            </h3>            <p>              <strong>Why:</strong>              The Claude traffic campaigns have very small spend but strong traffic efficiency: Claude | IN | Corporates | 5 Languages | 2026-06-19 delivered 154 link clicks and 97 landing page views from THB 16.24; Claude | IN | Corporates | 6 Languages | 2026-06-19 delivered 172 link clicks and 94 landing page views from THB 28.05; Claude | IN | Families | 6 Languages | 2026-06-19 delivered 181 link clicks and 91 landing page views from THB 41.84.            </p>            <p>              <strong>Do this:</strong>              Increase these campaigns gradually by 20-30% and monitor landing page views, leads, and purchases. Do not judge lead or purchase performance until each has at least 3 downstream results.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep awareness spend separate from conversion expectations            </h3>            <p>              <strong>Why:</strong>              Campaigns like Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers produced very low-cost reach and engagement, but almost no link traffic.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign only as an awareness layer with a defined capped budget; do not rely on it to drive ticket sales or leads.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Strong awareness and reach efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              23,570,113 impressions, 12,306,685 reach, frequency 1.92, CPM THB 0.67, 1,314,585 page engagements, 1,298,363 video views, THB 15,848.23 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a low-cost visibility campaign, but cap budget and do not judge it by purchases or leads because it generated only 3 link clicks and 1 messaging conversation started.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 26,992.36 spend, 25,914 likes, 491,994 page engagements, 51,071 post reactions, 4,525 comments, CTR 5.21%, and 405,743 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep, but scale carefully because frequency is 3.32, the highest among major campaigns. Refresh creatives before increasing spend materially.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Efficient engagement and the best messaging contributor.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,461.89 spend, 772,033 page engagements, 1,057 link clicks, 15 messaging conversations started, and 8 conversation replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and test a messaging or lead-focused version using the same strongest post/creative. Watch quality because it also recorded 7 messaging blocks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Best small-sample traffic efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16.24 spend, 154 link clicks, 97 landing page views, CTR 13.10%, CPC THB 0.10, and approximately 63% landing-page-view-to-link-click rate.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale as a traffic test, but do not make lead or purchase decisions yet because no leads or purchases were recorded.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Strong small-sample traffic quality.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 28.05 spend, 172 link clicks, 94 landing page views, CTR 8.96%, CPC THB 0.16.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale alongside the 5-language corporate variant and compare landing page views and downstream leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Efficient traffic at small spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 41.84 spend, 181 link clicks, 91 landing page views, CTR 5.70%, CPC THB 0.22.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep testing, but avoid large budget increases until lead or purchase tracking confirms downstream quality.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              The duplicated Broad Destination cluster is absorbing too much budget with weak link and lead outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across five campaigns, combined spend was THB 62,048.20 with only 8 inline link clicks, 1 lead, 13 messaging conversations started, and 6,482 likes. The largest version alone spent THB 44,087.75 for 6 inline link clicks, 1 lead, and 10 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce combined spend by 50-60%, consolidate duplicates, rebuild creative/audience structure, and only re-scale after improved link clicks, landing page views, and at least 3 leads or purchases are recorded.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Follower efficiency is weak versus AQ_MU2025_Followers_IN.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The largest Broad Destination campaign generated 3,698 likes from THB 44,087.75, while AQ_MU2025_Followers_IN generated 25,914 likes from THB 26,992.36.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Move follower growth budget away from Broad Destination and into AQ_MU2025_Followers_IN or a rebuilt follower campaign using stronger creatives.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families            </h3>            <p>              Follower performance is weaker than the best follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 7,867.50 spend generated 2,418 likes, 47,109 page engagements, 6 messaging conversations started, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget unless family audience quality is strategically important. Test new family-specific creative before scaling.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Two campaigns with the same name are fragmented and expensive on CPM.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              One version spent THB 1,06
