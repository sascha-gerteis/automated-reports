 font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-18        →        2026-10-17      </span>      <span class=&quot;pill&quot;>        4 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 16,715.76</strong>        <small>          2026-09-18          to          2026-10-17        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>959,089</strong>        <small>          1,768,909 impressions          ·          1.84 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>6,043</strong>        <small>          2.32% CTR          ·          THB 0.41 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>6</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 9.45</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated strong awareness and engagement volume: 1,768,909 impressions, 959,089 reach, 162,331 page engagements, 129,404 video views, and 6,043 link clicks from 16,715.76 THB spend. However, the stated goal is profitable ticket sales and qualified leads, and no purchase, lead, ROAS, or cost-per-purchase data is present. Traffic quality is uneven: only 458 landing page views from 6,043 link clicks, while messaging volume is very low with only 6 conversations started and 755 messaging blocks.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward the campaign producing landing page views            </h3>            <p>              <strong>Why:</strong>              AQ Operator CBO | IN | Instagram Followers produced 404 of the account&amp;#039;s 458 landing page views with only 2,409.25 THB spend, giving the strongest traffic quality in the account.            </p>            <p>              <strong>Do this:</strong>              Carefully increase budget on AQ Operator CBO | IN | Instagram Followers by 15-25% and monitor landing page views, landing-page-view rate, and cost per landing page view daily.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on follower/engagement campaigns that are not supporting sales or leads            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN spent 7,333.63 THB, the largest campaign spend, but produced only 17 inline link clicks, no landing page views, and 1 messaging conversation started.            </p>            <p>              <strong>Do this:</strong>              Reduce AQ_MU2025_Followers_IN budget unless follower growth is a separate priority; move part of that spend into AQ Operator CBO | IN | Instagram Followers and new lead or ticket-sale tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild the high-CPM Broad Destination campaign            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination has the highest CPM at 98.16 THB, spent 1,242.41 THB, and produced 0 inline link clicks and 0 landing page views.            </p>            <p>              <strong>Do this:</strong>              Do not scale this campaign. Rebuild it with different audience, placements, and creative before assigning meaningful budget.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix measurement for sales and lead outcomes            </h3>            <p>              <strong>Why:</strong>              The business goal is ticket sales and qualified leads, but the dataset contains no purchase, lead, ROAS, or revenue events.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI events for Lead, Purchase, InitiateCheckout, and ViewContent; confirm events are assigned to campaigns and visible in Ads Manager before judging profitability.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Investigate link click to landing page view drop-off            </h3>            <p>              <strong>Why:</strong>              The account recorded 6,043 link clicks but only 458 landing page views, meaning most link clicks did not become landing page views.            </p>            <p>              <strong>Do this:</strong>              Check landing page load speed, URL correctness, mobile experience, redirects, UTM consistency, and Pixel firing on the destination page.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best traffic-quality campaign in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 404 landing page views from 2,113 inline link clicks and 2,409.25 THB spend. Cost per landing page view is approximately 5.96 THB, and it produced 88% of all account landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale by 15-25%. Use it as the base campaign for traffic, lead, and ticket-sale testing.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Strong low-cost reach and link-click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Delivered 1,003,158 impressions, 575,771 reach, 3,913 inline link clicks, and the lowest CPM among high-spend campaigns at 5.71 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is low-cost reach or top-of-funnel growth. Do not treat it as a lead or sales campaign without improving landing page view rate.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strongest follower and engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 93,351 page engagements, 72,689 video views, 11,025 post reactions, and 7,441 likes from 7,333.63 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep at a controlled budget if follower growth and engagement are valuable. Reduce if the main priority is ticket sales or qualified leads.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Large spend is not translating into traffic, leads, or sales signals.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 7,333.63 THB but produced only 17 inline link clicks, 0 landing page views, and 1 messaging conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and separate this campaign from performance budgets. Use it only for awareness/follower growth.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Inefficient delivery versus the rest of the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Highest CPM at 98.16 THB, 1,242.41 THB spend, 12,657 impressions, 0 inline link clicks, and 0 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild before further scaling. Test new creative, broader lower-cost placements, and a clearer objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Cheap clicks are not becoming landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Produced 3,913 inline link clicks but only 54 landing page views from 5,730.47 THB spend. It also generated 463 messaging blocks versus only 3 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce performance budget unless the goal is reach/followers. Audit destination and creative promise, then retest with landing-page-view optimization.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              All campaigns            </h3>            <p>              No lead or purchase performance can be judged.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The dataset shows 0 reported leads, 0 purchases, 0 revenue, and no ROAS. Targets are also unknown because cost_per_lead, cost_per_purchase, and roas targets are set to 0.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make profitability decisions until lead and purchase tracking is active and each campaign reaches at least 3 result events.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              AQ_MU2025_Followers_IN consumed 7,333.63 THB but produced only 17 inline link clicks and 0 landing page views, while AQ Operator CBO | IN | Instagram Followers produced 404 landing page views from 2,409.25 THB spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead or ticket-sale test campaign              </strong>            </div>            <p>              This campaign has the highest CPM at 98.16 THB and no inline link clicks or landing page views, so budget is better used testing objectives aligned with qualified leads or ticket sales.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Landing-page-view optimized traffic test or retargeting test              </strong>            </div>            <p>              The campaign is efficient for reach and link clicks but weak for landing page views, with only 54 landing page views from 3,913 inline link clicks.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing page view optimization test            </h3>            <p>              <strong>Setup:</strong>              Duplicate the best-performing traffic setup from AQ Operator CBO | IN | Instagram Followers and run a campaign optimized specifically for landing page views using the same destination URL and UTMs.            </p>            <p>              <strong>Success metric:</strong>              Compare cost per landing page view and landing page views per link click after at least 3 landing page view results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Lead generation campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated lead campaign using Meta instant forms or website lead event tracking. Test one broad India ad set and one engaged-audience ad set built from page engagers, video viewers, and link clickers.            </p>            <p>              <strong>Success metric:</strong>              Judge by cost per lead and lead volume only after each ad set reaches at least 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Ticket-sale tracking test            </h3>            <p>              <strong>Setup:</strong>              Create a purchase-focused campaign only after Purchase and InitiateCheckout events are verified. Use UTM-tagged ads and compare campaign-reported purchases with backend ticket-sale records.            </p>            <p>              <strong>Success metric:</strong>              Purchases, cost per purchase, and ROAS once at least 3 purchase events are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging quality test            </h3>            <p>              <strong>Setup:</strong>              Run a small click-to-message test with pre-qualifying copy, clear ticket or enquiry CTA, and automated opening questions to reduce low-intent messaging activity.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, and messaging blocks after at least 3 conversations started.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&qu
