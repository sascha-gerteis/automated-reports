tion>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 17,197.84</strong>        <small>          2026-09-25          to          2026-10-24        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,104,878</strong>        <small>          2,076,790 impressions          ·          1.88 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>8,183</strong>        <small>          2.17% CTR          ·          THB 0.38 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>6</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 8.28</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent THB 17,197.84 and generated strong top-of-funnel volume: 2,076,790 impressions, 1,104,878 reach, 45,011 clicks, 8,183 link clicks, 802 landing page views, 190,959 page engagements, and 157,843 video views. However, performance is not yet aligned with the business goal of profitable ticket sales and qualified leads because no purchase or lead actions are reported. Current activity is mostly follower, engagement, traffic, and messaging-adjacent performance. The strongest traffic-quality campaign is AQ Operator CBO | IN | Instagram Followers, while Aquaverse India | Instagram Followers | 2026-09-27 drives cheap reach and link clicks but very weak landing page view conversion. Follower/likes campaigns are creating engagement but should not absorb the majority of spend if sales and leads are the priority.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward landing page view and lead/sales intent            </h3>            <p>              <strong>Why:</strong>              The account has 8,183 link clicks but only 802 landing page views and no reported leads or purchases. AQ Operator CBO | IN | Instagram Followers produced 743 of 802 landing page views at THB 6.22 per LPV, making it the best traffic-quality campaign.            </p>            <p>              <strong>Do this:</strong>              Carefully increase budget to AQ Operator CBO | IN | Instagram Followers and/or duplicate it into a traffic campaign optimized for landing page views. Reduce spend from pure follower/likes campaigns while lead and purchase tracking is fixed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix lead and purchase tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              The business goal is ticket sales and qualified leads, but no lead, purchase, ROAS, or revenue actions are present in the data.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, purchase event, lead event, booking/ticket confirmation event, and UTMs. Do not optimize for ROAS or cost per purchase until these events are firing.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              <strong>Why:</strong>              This campaign spent THB 1,242.41 with the highest CPM at THB 98.16, highest CPC at THB 1.09, 0 link clicks, and 0 landing page views. It has enough engagement volume to judge for its objective, including 897 likes and 3,628 page engagements.            </p>            <p>              <strong>Do this:</strong>              Pause if the goal is traffic/leads/sales, or rebuild with a clearer traffic/lead objective. Reallocate its budget to AQ Operator CBO | IN | Instagram Followers or a new lead/sales test.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate click-to-landing-page loss            </h3>            <p>              <strong>Why:</strong>              The account generated 8,183 link clicks but only 802 landing page views. Aquaverse India | Instagram Followers | 2026-09-27 is the main issue with 4,253 link clicks but only 58 landing page views.            </p>            <p>              <strong>Do this:</strong>              Check destination URL, page load speed, mobile experience, in-app browser behavior, UTMs, and whether clicks are going to Instagram/profile actions instead of the ticket/lead landing page.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Review messaging quality and block events            </h3>            <p>              <strong>Why:</strong>              The account recorded 1,144 messaging blocks versus only 6 messaging conversations started and 9 total messaging connections. Campaigns with the highest blocks are AQ Operator CBO | IN | Instagram Followers with 623 and Aquaverse India | Instagram Followers | 2026-09-27 with 520.            </p>            <p>              <strong>Do this:</strong>              If messaging is an intended lead path, rebuild messaging ads with clearer pre-click expectations, qualification copy, and quick replies. Monitor conversation started, first reply, and block volume together.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best campaign for landing page traffic quality and scalable top-of-funnel reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 4,624.77, delivered 821,710 impressions, 3914 link clicks, 743 landing page views, THB 6.22 cost per landing page view, 19.0% LPV-to-link-click rate, CPM THB 5.63, and 112,324 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this as the base for a landing page view, lead, or purchase-intent test once tracking is confirmed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Strong low-cost reach and link-click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 6,429.54, delivered 1,108,801 impressions, 619,468 reach, 4,253 link clicks, THB 1.51 cost per link click, CPM THB 5.80, and 3 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep with caution for awareness and cheap click volume, but do not scale until the landing page view issue is fixed because only 58 landing page views came from 4,253 link clicks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower/engagement generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 4,901.12 and generated 5,859 likes, 9,546 post reactions, 867 comments, 54,987 post engagements, 43,461 video views, CTR 9.07%, and cost per like of about THB 0.84.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth/social proof is a secondary objective. Reduce if the primary goal is ticket sales or qualified leads.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Least efficient campaign and not supporting traffic, leads, or sales.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,242.41 with CPM THB 98.16, CPC THB 1.09, 12,657 impressions, 1,139 clicks, 0 link clicks, 0 landing page views, and no messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild. Reallocate this budget to AQ Operator CBO | IN | Instagram Followers or a new lead/sales campaign after tracking is validated.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              High click volume is not converting into landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,253 link clicks produced only 58 landing page views, a 1.4% LPV-to-link-click rate. It also recorded 520 messaging blocks versus 3 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale until destination, tracking, and click quality are reviewed. Test a landing-page-view optimized version using the same strongest audience/creative inputs.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Engagement-heavy but poor for website traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 4,901.12 and generated only 16 link clicks and 1 landing page view despite 12,122 clicks and 60,846 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce if business priority is leads or ticket sales. Keep a smaller budget only for follower growth and engagement.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide            </h3>            <p>              No measurable purchase or lead performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across THB 17,197.84 spend, the data shows 0 reported purchases, 0 reported leads, and no ROAS or revenue actions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Set up and validate lead and purchase tracking before making profitability decisions.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers or a new LPV/lead test              </strong>            </div>            <p>              Daily Follows Likes has the highest CPM at THB 98.16 and generated 0 link clicks and 0 landing page views, while AQ Operator CBO generated 743 landing page views at THB 6.22 per LPV.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Lead or purchase-intent campaign once tracking is fixed              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is strong for likes and engagement but generated only 16 link clicks and 1 landing page view from THB 4,901.12 spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Keep capped until LPV issue is solved; move incremental budget to AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              Aquaverse India | Instagram Followers drove cheap link clicks but only 58 LPVs from 4,253 link clicks, while AQ Operator CBO converted link clicks to LPVs much more effectively.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower/engagement-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead/sales tracking and conversion test              </strong>            </div>            <p>              The account goal is ticket sales and qualified leads, but current campaigns are mostly follower and engagement campaigns with no lead or purchase actions reported.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing Page View optimization test            </h3>            <p>              <strong>Setup:</strong>              Duplicate AQ Operator CBO | IN | Instagram Followers into a traffic campaign optimized for landing page views and send traffic to the ticket or lead landing page with UTMs.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, and LPV-to-link-click rate versus the current AQ Operator CBO result of 743 LPVs at THB 6.22 per LPV.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Lead or purchase event validation test            </h3>            <p>
