    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 486,891.99</strong>        <small>          2026-06-29          to          2026-07-28        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>10,939,748</strong>        <small>          34,500,167 impressions          ·          3.15 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>562,019</strong>        <small>          2.56% CTR          ·          THB 0.55 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>33</strong>        <small>          THB 14,754.30 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>8</strong>        <small>          THB 60,861.50 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 3,476.00        </strong>        <small>          0.01× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>228</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 14.11</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large top-of-funnel volume with 34,500,167 impressions, 562,019 link clicks, and 88,509 landing page views from THB 486,891.99 spend, but commercial outcomes were weak: only 11 leads, 8 purchases, and THB 3,476 tracked purchase value. Traffic, awareness, and messaging pockets are working, but most spend is not converting into qualified leads or ticket sales. The strongest conversion signal came from one boosted post campaign, while several high-spend follower, B2B lead, and ticket/marketplace traffic campaigns produced no tracked purchases or leads.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Protect and carefully scale the strongest conversion post            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; produced 8 leads, 4 purchases, 46 messaging conversations, and THB 2,176 purchase value from only THB 2,458.56 spend.            </p>            <p>              <strong>Do this:</strong>              Duplicate this post into a controlled sales and messaging test. Increase budget gradually, not aggressively, and monitor cost per lead, purchase count, and messaging depth before further scaling.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on follower campaigns that are not producing follows efficiently            </h3>            <p>              <strong>Why:</strong>              FB Follow | Thailand | Aquaverse Lifestyle spent THB 57,986.35 for only 3 likes, while FB Follow | Thailand | Lookalike Fans Scale spent THB 40,730.93 for 13 likes.            </p>            <p>              <strong>Do this:</strong>              Cut these follower campaigns materially and rebuild the objective/creative if page growth remains required. Reallocate part of this budget to the proven post and higher-quality traffic campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild B2B lead generation campaigns            </h3>            <p>              <strong>Why:</strong>              Aquaverse Corporate Groups - Leads - Test spent THB 13,058.99 with 0 leads, and TH | B2B Corporate | Video | Leads | 2026-06-18 spent THB 17,417.88 with 0 leads.            </p>            <p>              <strong>Do this:</strong>              Stop scaling the current B2B lead setup. Rebuild with a clearer lead offer, shorter form or click-to-message flow, and use Claude | TH | Corporates | Thai | 2026-06-19 as the traffic-quality creative reference.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate traffic success from purchase success            </h3>            <p>              <strong>Why:</strong>              Several campaigns are generating cheap clicks or landing page views but no purchases, including Claude | TH | Traffic IMAGES | 18Jun and Hot Weather Escape Ticket Sales variants.            </p>            <p>              <strong>Do this:</strong>              Keep the best traffic campaigns only as prospecting or retargeting-pool builders. Do not judge them as purchase winners unless they generate at least 3 purchases.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking before making large purchase-scaling decisions            </h3>            <p>              <strong>Why:</strong>              The account shows 562,019 link clicks but only 88,509 landing page views, and several campaigns show very low landing page view rates. Purchase and lead action types also appear duplicated across onsite, web, app, and omni events.            </p>            <p>              <strong>Do this:</strong>              Verify pixel/CAPI deduplication, landing page load speed, UTMs, marketplace tracking, and whether omni_purchase is the correct decision metric.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best commercial performer and the only campaign with enough purchase results to judge against the minimum result threshold.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,458.56 spend, 8 leads, 4 purchases, 46 messaging conversations started, THB 2,176 purchase value, cost per lead THB 307.32, cost per purchase THB 614.64.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Rebuild this into dedicated purchase, lead, and message campaigns to test whether the performance holds outside the boosted-post structure.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Traffic IMAGES | 18Jun            </h3>            <p>              Strong traffic-volume engine.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 24,899.84 spend, 126,769 link clicks, 11,400 landing page views, 5.37% CTR, approximately THB 2.18 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for traffic and retargeting-pool creation, but do not scale for purchases until it generates at least 3 tracked purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026            </h3>            <p>              Very efficient landing page traffic for a ticket-sales message.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,916.74 spend, 11,560 link clicks, 3,371 landing page views, 13.32% CTR, approximately THB 0.87 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic creative winner and test it in a purchase-optimized or retargeting setup.            </div>          </div>                  <div class=&q rder-radius: 16px;    padding: 18px;  }  .finding.positive {    border-left: 5px solid #16a34a;  }  .finding.negative {    border-left: 5px solid #dc2626;  }  .finding h3 {    margin: 0 0 8px;    font-size: 16px;  }  .finding p {    margin: 0 0 10px;    color: #526077;  }  .evidence,  .recommendation {    font-size: 13px;    margin-top: 7px;    color: #445168;  }  .budget-row {    display: grid;    grid-template-columns: 1fr 40px 1fr;    gap: 12px;    align-items: center;    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-06-29        →        2026-07-28      </span>      <span class=&quot;pill&quot;>        87 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,507,504.94</strong>        <small>          2026-06-29          to          2026-07-28        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>77,299,723</strong>        <small>          192,986,749 impressions          ·          2.50 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>5,367,940</strong>        <small>          3.28% CTR          ·          THB 0.24 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>315</strong>        <small>          THB 4,785.73 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 753,752.47 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2,716</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.81</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large reach and traffic: 192,986,749 impressions, 5,367,940 link clicks, 1,389,251 landing page views, and 105 leads from 1,507,504.94 THB spend. Traffic volume is strong, but business outcomes are concentrated in a few campaigns. Purchases are not yet decision-ready because the account has only 2 purchases, below the minimum_results_before_decision of 3.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Scale the proven lead and messaging winners carefully            </h3>            <p>              <strong>Why:</strong>              A small group of campaigns produced most qualified outcomes at far lower CPL than the rest of the account.            </p>            <p>              <strong>Do this:</strong>              Increase budgets by 15-20% on &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot;, &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot; while monitoring lead volume, messaging depth, and CPL.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce high-spend traffic campaigns with no lead output            </h3>            <p>              <strong>Why:</strong>              Several campaigns drove large click and LPV volume but did not generate leads or purchases, consuming a large share of spend.            </p>            <p>              <strong>Do this:</strong>              Reduce spend on &amp;quot;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;quot; and &amp;quot;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;quot; and rebuild them with lead or messaging conversion paths instead of pure traffic.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Consolidate duplicate Follows/Likes campaigns            </h3>            <p>              <strong>Why:</strong>              Many daily Follows/Likes campaigns are generating engagement and page likes but very little site traffic, leads, or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep only the best audience/creative combinations for awareness, cap their budget, and reallocate excess budget into lead, messaging, and retargeting campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix click-to-landing-page tracking and funnel loss            </h3>            <p>              <strong>Why:</strong>              Some campaigns show very high link clicks but extremely low landing page views, suggesting tracking, page-load, or click-quality issues.            </p>            <p>              <strong>Do this:</strong>              Audit pixel/CAPI, landing page load speed, UTMs, destination URLs, and LPV event firing before scaling campaigns with abnormal click-to-LPV drop-off.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Do not optimize around purchases yet            </h3>            <p>              <strong>Why:</strong>              The account recorded only 2 purchases, below the required minimum of 3 results for a purchase decision.            </p>            <p>              <strong>Do this:</strong>              Use leads, qualified messaging conversations, and landing page views as interim optimization signals until purchase volume reaches at least 3 per campaign or funnel test.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Best proven lead generator in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              34 leads from 4,547.05 THB spend, CPL 133.74 THB; 35,948 link clicks; 327 landing page views; 741 messaging conversations started; 726 first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this creative/message as the main reference for new lead and messaging tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging performance with enough lead volume to make a decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              25 leads from 4,519.62 THB spend, CPL 180.78 THB; 36,641 link clicks; 268 landing page views; 678 messaging conversations started; 655 first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale gradually. Test similar Malayalam creatives and landing/messaging flows.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Very strong lead and messaging campaign with the highest-quality business signal in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              17 leads from 2,488.72 THB spend, CPL 146.40 THB; 381 messaging conversations started; 559 total messaging connections; 1 purchase, but purchase volume is below the 3-result minimum.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Build retargeting and lookalike tests from users who engaged with this post or started conversations.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Excellent traffic and awareness efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              898,786 link clicks and 250,589 landing page views from 25,018.12 THB spend; cost per landing page view about 0.10 THB; CTR 7.35%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as top-of-funnel traffic, but connect it to retargeting because it produced traffic, not reported leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient large-scale traffic source.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              523,158 link clicks and 139,379 landing page views from 14,291.24 THB spend; cost per landing page view about 0.10 THB; CTR 7.70%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for traffic generation and retarget LPV audiences with lead and ticket-focused messaging.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;Let’s have fun together and make every moment...&amp;quot;            </h3>            <p>              Strong click and landing page engagement from a smaller spend base.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              18,908 link clicks, 8,013 landing page views, 13.32% CTR, and 2,210.73 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a creative candidate for retargeting or lead-form adaptation.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Very high spend without reported leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              269,679.43 THB spend, 883,366 link clicks, 203,929 landing page views, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild around lead capture, messaging qualification, or retargeting instead of broad traffic.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Large traffic volume but no reported business outcome.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              115,890.51 THB spend, 382,287 link clicks, 104,812 landing page views, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce spend and test a corporate-specific lead form or messaging flow before scaling again.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              High spend and landing page volume without reported leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              71,736.23 THB spend, 209,692 link clicks, 66,611 landing page views, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale further as-is. Rebuild with the lead/messaging structure used by the winning post and India Show campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              Traffic delivery is strong, but business outcome tracking shows no leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              69,199.02 THB spend, 256,127 link clicks, 73,101 landing page views, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and move audience budget into retargeting or proven lead creatives.            </div>          </div>                  <div st 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              LPV objective versus link-click objective            </h3>            <p>              <strong>Setup:</strong>              For campaigns with high clicks but weak LPV rates, duplicate into a landing-page-view optimized setup and compare against current traffic delivery.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, and lead volume after sufficient spend and at least 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging qualification flow            </h3>            <p>              <strong>Setup:</strong>              Run a messaging campaign using the Start Your Day post angle with scripted qualification questions for ticket intent, group size, and visit timing.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, depth-3/depth-5 message sends, and qualified leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Follows/Likes budget cap test            </h3>            <p>              <strong>Setup:</strong>              Keep only the best-performing Follows/Likes audiences as a small awareness layer and cap spend, while moving the rest to conversion-focused campaigns.            </p>            <p>              <strong>Success metric:</strong>              Page likes and engagement for the awareness layer, plus incremental leads from retargeting those engagers.            </p
