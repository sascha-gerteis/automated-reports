rgin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-14        →        2026-09-12      </span>      <span class=&quot;pill&quot;>        20 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 51,679.99</strong>        <small>          2026-08-14          to          2026-09-12        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>4,503,266</strong>        <small>          7,362,691 impressions          ·          1.63 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>258</strong>        <small>          1.03% CTR          ·          THB 0.68 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 17,226.66 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.02</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large upper-funnel volume: 7,362,691 impressions, 4,503,266 reach, 914,140 page engagements, and 828,020 video views from THB 51,679.99 spend. However, the account produced only 1 reported lead, 2 messaging conversations started, and no reported purchases, so performance against the business goal of profitable ticket sales and qualified leads cannot be validated. Current spend is heavily weighted toward followers/page engagement rather than lead or purchase outcomes.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from inefficient follower/like duplicates            </h3>            <p>              <strong>Why:</strong>              Several Broad Destination and ERROR QUARANTINED follower campaigns are spending materially while producing expensive engagement compared with the best campaigns.            </p>            <p>              <strong>Do this:</strong>              Reduce budget first from &amp;#039;Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination&amp;#039; with THB 6,688.29 spend, 26,749 page engagements, THB 0.25 per page engagement, and only 322 likes at THB 20.77 per like. Also reduce &amp;#039;ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination&amp;#039; with THB 4,304.20 spend and THB 0.22 per page engagement.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep and protect the strongest engagement campaigns            </h3>            <p>              <strong>Why:</strong>              &amp;#039;New post engagement campaign&amp;#039; and &amp;#039;AQ_MU2025_Followers_IN&amp;#039; are the clearest upper-funnel performers, but they serve different roles.            </p>            <p>              <strong>Do this:</strong>              Keep &amp;#039;New post engagement campaign&amp;#039; active and test increased budget carefully because it delivered 94,081 post engagements from only THB 686.10, about THB 0.007 per post engagement. Keep &amp;#039;AQ_MU2025_Followers_IN&amp;#039; active but refresh creative and avoid aggressive scaling because frequency is already 4.25.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Create dedicated lead and purchase campaigns            </h3>            <p>              <strong>Why:</strong>              The current campaign mix is not built around the stated goal. Across THB 51,679.99 spend, only 1 lead and 0 purchases were reported, and the 1 lead is below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Launch separate campaigns for qualified leads and ticket sales instead of relying on follower/engagement campaigns. Use Lead or Purchase optimization only after confirming the correct events fire.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix traffic measurement before judging website intent            </h3>            <p>              <strong>Why:</strong>              The account shows 76,136 total clicks but only 258 inline link clicks. Multiple campaigns have thousands of clicks but 0 inline link clicks, meaning most clicks are not website traffic.            </p>            <p>              <strong>Do this:</strong>              Audit ad destinations, CTA setup, link placement, pixel/CAPI events, and UTMs. For traffic tests, optimize to landing page views or link clicks and report inline link clicks separately from all clicks.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Consolidate duplicate campaign structures            </h3>            <p>              <strong>Why:</strong>              Multiple campaigns share the same name, especially &amp;#039;Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination&amp;#039; and several &amp;#039;ERROR QUARANTINED&amp;#039; Broad Destination versions, fragmenting spend and making decisions harder.            </p>            <p>              <strong>Do this:</strong>              Rebuild into fewer clean campaigns by objective: awareness/video, engagement/followers, traffic, leads, and purchases. Use unique names with market, objective, audience, and date.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best efficiency for engagement and link-click volume among campaigns with meaningful data.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 686.10 spend, 288,433 impressions, CPM THB 2.38, 94,081 post engagements, 87,327 video views, 124 link clicks, about THB 0.007 per post engagement and THB 5.53 per link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale in small budget steps while monitoring whether incremental spend maintains low cost per engagement and link click.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower/page engagement engine and the largest contributor to social proof.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 26,333.35 spend, 453,870 page engagements, 430,347 post engagements, 23,523 likes, 3,318 comments, 1,006 saves, CTR 3.97%, and about THB 1.12 per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep, but do not aggressively scale until creative is refreshed because frequency is 4.25, the highest major campaign frequency in the account.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient reach, video views, and page engagement for awareness, but not for traffic or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,746.80 spend, 5,196,433 impressions, 3,727,027 reach, CPM THB 0.72, 271,708 post engagements, 268,152 video views, and frequency 1.39. Inline link clicks were 0.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as a low-cost awareness/video layer. Rebuild under a clean campaign name and do not use it as evidence of purchase or lead performance.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              One version delivered relatively cheaper engagement than other Broad Destination variants.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The version with THB 1,487.24 spend delivered 14,109 page engagements and 13,901 post engagements, about THB 0.105 per page engagement.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              If keeping a Broad Destination follower test, prioritize this version over the more expensive Broad Destination variants, but rebuild cleanly because the campaign name includes ERROR QUARANTINED.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Inefficient for follower/page engagement and not proven for leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The largest version spent THB 6,688.29 for 26,749 page engagements, 322 likes, 0 inline link clicks, and only 1 reported lead. Cost per like was about THB 20.77. The 1 lead is below the minimum decision threshold of 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild. Do not judge lead quality yet, but stop using this structure as a main follower/lead driver until it proves at least 3 leads or materially better engagement efficiency.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Expensive delivery and weak page engagement efficiency compared with other engagement campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,978.26 spend, only 8,831 impressions, CPM THB 224.01, 3,547 page engagements, and about THB 0.56 per page engagement.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild before adding budget. Confirm whether Thailand is a required market for the current business goal before continuing spend.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Higher-cost engagement with no reported link clicks, leads, messages, or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,304.20 spend, 19,292 page engagements, 17,520 video views, 762 likes, 0 inline link clicks, and about THB 0.22 per page engagement.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild into a cleaner follower or engagement test. Reallocate spend to &amp;#039;New post engagement campaign&amp;#039; and a dedicated lead/purchase test.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              The higher-spend version is inefficient for traffic and has insufficient messaging results.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The version with THB 2,430.56 spend produced 10,290 page engagements, only 1 inline link click, and 1 messaging conversation started. Messaging result count is below the minimum threshold of 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and do not judge messaging performance yet. If messaging is a goal, rebuild as a dedicated messaging campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data for a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Four versions spent only THB 7.06, THB 4.26, THB 6.55, and THB 6.64 respectively, each with fewer than 60 impressions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on performance from this tiny sample. Either give the test enough budget/data or remove it as part of campaign-structure cleanup.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign              </strong>            </div>            <p>              The largest Broad Destination version spent THB 6,688.29 at about THB 0.25 per page engagement and THB 20.77 per like, while &amp;#039;New post engagement campaign&amp;#039; delivered about THB 0.007 per post engagement and THB 5.53 per link click.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead campaign              </strong>            </div>            <p>              This campaign spent THB 4,304.20 with 0 inline link clicks and no reported leads or purchases. The account needs a clean lead objective test because current lead volume is only 1 total lead.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Confirmed priority market campaigns              </strong>            </div>            <p>              This campaign had CPM THB 224.01 and about THB 0.56 per page engagement. Reallocate unless Thailand is confirmed as a current priority market.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Fragmented duplicate Broad Destination and ERROR QUARANTINED campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Consolidated clean campaigns by objective              </strong>            </div>            <p>              Multiple duplicate names and small overlapping campaign versions are fragmenting learning and making budget allocation unclear.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Awareness-only campaigns with 0 inline link clicks              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Purchase or traffic test after tracking verification              </strong>            </div>            <p>              The business goal includes ticket sales, but there are 0 reported purchases and no clear purchase-optimized campaign performance in the supplied data.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Dedicated ticket sales conversion test            </h3>            <p>              <strong>Setup:</strong>              Create a clean purchase-focused campaign only after confirming the Purchase event is firing. Use ticket-focused creative and landing-page destination. Separate it from follower and engagement campaigns.            </p>            <p>              <strong>Success metric:</strong>              Reported purchases and cost per purchase once at least 3 purchases are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Qualified lead generation test            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated lead campaign using either instant forms or website lead events. Ask qualifying questions relevant to ticket interest or group booking intent.            </p>            <p>              <strong>Success metric:</strong>              Cost per qualified lead and lead count once at least 3 leads are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engagement scale test for New post engagement campaign            </h3>            <p>              <strong>Setup:</strong>              Increase budget carefully from the current low-spend base and keep the same objective while testing 2-3 new creative variants.            </p>            <p>              <strong>Success metric:</strong>              Post engagement cost, link click cost, and whether performance stays close to the current THB 0.007 per post engagement and THB 5.53 per link click.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Follower creative refresh for AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong>              Add new creative angles to the existing follower campaign and separate fresh creative from current winners.            </p>            <p>              <strong>Success metric:</strong>              Cost per like, page engagement cost, and frequency. Current reference points are THB 1.12 per like and frequency 4.25.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Traffic quality test            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated traffic campaign optimized for landing page views or link clicks, with clear CTA and UTMs. Do not mix with engagement objectives.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, landing page views if available, and downstream leads or purchases after at least 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 6            </span>            <h3>              Awareness retargeting pool test            </h3>            <p>              <strong>Setup:</strong>              Use low-cost awareness/video audiences from &amp;#039;ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers&amp;#039; and retarget video viewers or engagers with ticket/lead offers.            </p>            <p>              <strong>Success metric:</strong>              Lead or purchase results from retargeting once at least 3 results are recorded.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2
