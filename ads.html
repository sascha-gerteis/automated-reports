 <span>Amount spent</span>        <strong>THB 16,077.41</strong>        <small>          2026-09-22          to          2026-10-21        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,011,921</strong>        <small>          1,815,835 impressions          ·          1.79 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>7,366</strong>        <small>          2.27% CTR          ·          THB 0.39 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>6</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 8.85</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement volume is strong with 1,815,835 impressions, 1,011,921 reach, 156,561 page engagements, 125,719 video views, and 6,530 likes from THB 16,077.41 spend. Traffic quality is concentrated in one campaign: AQ Operator CBO | IN | Instagram Followers generated 632 of 689 total landing page views at THB 5.94 per landing page view. Lead and purchase performance cannot be judged because no lead or purchase actions are reported. Messaging performance is weak, with only 6 messaging conversations started and 5 first replies account-wide versus 968 messaging blocks.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift traffic budget toward AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              <strong>Why:</strong>              This campaign produced 632 landing page views from THB 3,753.10 spend, accounting for 91.7% of all account landing page views at THB 5.94 per landing page view.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign active and carefully scale budget by 10-20% at a time while monitoring landing page view cost and landing page view rate.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild or pause Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              <strong>Why:</strong>              It spent THB 1,242.41 with 0 inline link clicks, 0 landing page views, the highest CPM at THB 98.16, and higher cost per like than AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Do this:</strong>              Pause this campaign after confirming no required follower objective remains, or rebuild it using the stronger audience/creative approach from AQ_MU2025_Followers_IN.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce Aquaverse India | Instagram Followers | 2026-09-27 until traffic quality improves            </h3>            <p>              <strong>Why:</strong>              It generated 4,122 link clicks but only 56 landing page views, a 1.36% landing-page-view-to-link-click rate, with THB 110.03 cost per landing page view.            </p>            <p>              <strong>Do this:</strong>              Cut future spend materially and rebuild the campaign around landing page views or conversions instead of follower/click behavior.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate follower/awareness campaigns from ticket sales and lead generation            </h3>            <p>              <strong>Why:</strong>              Current campaign names and results are follower/engagement focused, while the business goal is profitable ticket sales and qualified leads. No purchase or lead actions are reported.            </p>            <p>              <strong>Do this:</strong>              Create dedicated website conversion or lead campaigns with Purchase, Lead, or qualified lead events tracked separately from follower campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit landing page and event tracking            </h3>            <p>              <strong>Why:</strong>              The account has 7,366 link clicks but only 689 landing page views, and no purchase or lead events. Some campaigns have severe drop-off, especially Aquaverse India | Instagram Followers | 2026-09-27.            </p>            <p>              <strong>Do this:</strong>              Verify destination URLs, pixel/CAPI setup, landing page speed, Meta event firing, UTMs, and whether clicks are going to Instagram profile destinations instead of the ticket/lead page.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best traffic and engagement quality in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,753.10 spend, 3,228 inline link clicks, 632 landing page views, THB 5.94 per landing page view, 19.58% landing-page-view-to-link-click rate, 87,353 post engagements, and 82,613 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale by 10-20% increments. Use its creatives, placements, and audience setup as the benchmark for future traffic tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness and follower-style engagement, but not traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,920 spend generated 5,633 likes, 57,624 page engagements, 51,991 post engagements, 861 comments, and 41,048 video views. Cost per like was approximately THB 0.87.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower or social proof growth is a required objective. Cap budget and do not judge this campaign by purchases because it is functioning as awareness/engagement.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient reach and cheap click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Lowest CPM among campaigns at THB 5.79, lowest reported CPC at THB 0.29, 1,063,926 impressions, 607,465 reach, and 21,267 clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use only as upper-funnel reach/click traffic unless landing page view quality is fixed. Do not scale for sales or leads in its current form.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Underperforming versus the other awareness/follower campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,242.41 spend, 0 inline link clicks, 0 landing page views, highest CPM at THB 98.16, THB 1.09 CPC, and approximately THB 1.38 per like versus THB 0.87 per like for AQ_MU2025_Followers_IN.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild. If follower growth is still needed, relaunch with the stronger setup from AQ_MU2025_Followers_IN rather than continuing this version.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality is poor despite high click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,122 link clicks produced only 56 landing page views, a 1.36% landing-page-view-to-link-click rate, with THB 110.03 cost per landing page view. It also recorded 498 messaging blocks and only 3 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild using landing page view or conversion optimization. Check whether the destination is an Instagram profile or another low-intent path.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Not suitable for traffic or lead generation in current form.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,920 spend generated only 16 inline link clicks and 1 landing page view, despite strong engagement and 5,633 likes.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep as awareness only. Do not allocate performance budget here unless the objective and destination are rebuilt for landing page views, leads, or purchases.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide purchase and lead performance            </h3>            <p>              Insufficient purchase and lead data to evaluate profitability.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              No purchase actions, no lead actions, no ROAS, and no purchase value are reported during the period.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make purchase-efficiency decisions until Purchase, Lead, or qualified lead events are correctly tracked and each campaign reaches at least 3 results.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide messaging performance            </h3>            <p>              Messaging is not yet a reliable lead channel from the current campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Only 6 messaging conversations started, 5 first replies, 8 total messaging connections, and 968 messaging blocks account-wide.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale messaging based on this setup. If messaging leads matter, launch a dedicated click-to-message lead qualification campaign and track qualified outcomes.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              Daily Follows spent THB 1,242.41 with 0 landing page views and the highest CPM, while AQ Operator CBO delivered 632 landing page views at THB 5.94 each.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers and a new conversion/lead campaign              </strong>            </div>            <p>              Aquaverse India | Instagram Followers spent the most at THB 6,161.90 but delivered only 56 landing page views at THB 110.03 each. Budget should move toward the campaign proving landing page view volume and toward a campaign built for sales/leads.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated ticket sales or lead campaign              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is effective for likes and engagement, but it generated only 1 landing page view from THB 4,920 spend. Keep a capped awareness budget only if social proof is required.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing page view optimization test            </h3>            <p>              <strong>Setup:</strong>              Duplicate the strongest AQ Operator CBO | IN | Instagram Followers assets into a campaign optimized for landing page views or website conversions. Run against the current follower/click setup with separate budgets.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, and landing-page-view-to-link-click rate after each variant reaches at least 3 landing page views.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket sales conversion tracking test            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated purchase campaign once Pixel/CAPI Purchase events are verified. Use ticket-focused creative and send traffic directly to the ticket purchase page.            </p>            <p>              <strong>Success metric:</strong>              Purchase events and cost per purchase after the campaign reaches at least 3 purchases. Do not compare to ROAS target because no ROAS target is supplied.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Qualified lead campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a Meta lead form or website lead campaign with qualifying questions for intent, visit date, group size, and contact details.            </p>            <p>              <strong>Success metric:</strong>              Lead volume, cost per lead, and downstream qualified lead rate once at least 3 leads are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Click-to-message qualification test            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated messaging campaign with automated FAQs, ticket pricing prompts, visit-date questions, and clear handoff to sales/support.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, and qualified conversations. Judge only after each ad set reaches at least 3 conversations.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative CTA test for traffic quality            </h3>            <p>              <strong>Setup:</strong>              In AQ Operator CBO or a new traffic/conversion campaign, test entertainment-led creative versus direct ticket CTA creative with price, location, and urgency messaging.            </p>            <p>              <strong>Success metric:</strong>              Landing page view rate, cost per landing page view, and eventual lead or purchase events if tracking is fix
