l-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-28        →        2026-08-26      </span>      <span class=&quot;pill&quot;>        13 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 132,460.38</strong>        <small>          2026-07-28          to          2026-08-26        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>15,468,680</strong>        <small>          29,485,783 impressions          ·          1.91 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,312</strong>        <small>          0.54% CTR          ·          THB 0.84 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 44,153.46 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>34</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 4.49</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent 132,460.38 THB and generated very large awareness/engagement volume: 29,485,783 impressions, 15,468,680 reach, 3,047,144 page engagements and 2,855,428 video views. However, the account is not yet proving the business goal of profitable ticket sales and qualified leads: only 1 lead was recorded, no purchases or ROAS were reported, and only 1,312 inline link clicks were generated from 158,027 total clicks. Awareness and engagement campaigns are working, but sales/lead performance is insufficient to judge because purchase data is absent and lead volume is below the minimum decision threshold of 3.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from high-spend follow campaigns that are not driving traffic or leads            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination spent 44,087.75 THB, the largest campaign spend, but produced only 6 inline link clicks, 10 messaging conversations started and 1 lead.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign materially and reallocate budget into dedicated lead, messaging, retargeting, and the stronger traffic/engagement campaign: New post engagement campaign.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Create dedicated conversion-focused campaigns for ticket sales and qualified leads            </h3>            <p>              <strong>Why:</strong>              Most active campaigns are follow/like/page engagement campaigns, while the business goal is ticket sales and leads. Account-wide purchase count is 0 and lead count is only 1.            </p>            <p>              <strong>Do this:</strong>              Build separate campaigns for leads, messaging inquiries, and ticket purchase traffic instead of relying on follows/likes campaigns to generate sales outcomes.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep and carefully scale New post engagement campaign            </h3>            <p>              <strong>Why:</strong>              This campaign produced 1,057 of the account’s 1,312 inline link clicks at only 5,461.89 THB spend, equal to about 5.17 THB per inline link click. It also generated 772,033 page engagements and 722,875 video views.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually while monitoring inline link clicks, messaging starts, replies and blocks. Use this campaign’s engaged audience for retargeting.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN for follower growth, but do not scale aggressively            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN generated 30,020 likes at about 1.06 THB per like and strong CTR of 4.97%, but frequency is the highest in the account at 3.69 and it also recorded 4,083 post unlikes.            </p>            <p>              <strong>Do this:</strong>              Maintain or scale carefully with fresh creatives, exclude existing followers where possible, and watch frequency and unlike volume before increasing spend.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild ERROR QUARANTINED campaigns instead of expanding them            </h3>            <p>              <strong>Why:</strong>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers delivered cheap awareness with 23,858,980 impressions at 0.67 THB CPM, but produced only 3 inline link clicks and 1 messaging conversation started from 16,053.95 THB spend. ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily had very high CPM of 180.60 THB.            </p>            <p>              <strong>Do this:</strong>              Rebuild clean versions of these campaigns with clear objectives. Keep the India version only for awareness/video reach if needed; do not use it for traffic, leads, or messaging.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>6</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix measurement before judging profitability            </h3>            <p>              <strong>Why:</strong>              The account shows no purchase events, no revenue and no ROAS. Lead volume is only 1, below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Confirm purchase, lead, and qualified lead events are firing correctly, define one primary lead event, and use inline link clicks instead of total clicks when evaluating site traffic.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best traffic and engagement driver in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 5,461.89 THB, generated 1,057 inline link clicks, 772,033 page engagements, 722,875 video views, 14 messaging conversations started and 8 messaging replies. Cost per inline link click was about 5.17 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use engaged users, video viewers and link clickers from this campaign for retargeting into lead, messaging and ticket purchase campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 31,950.60 THB, generated 30,020 likes, 549,651 post engagements, 481,565 video views and CTR of 4.97%. Cost per like was about 1.06 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for audience building, but refresh creatives and monitor frequency because frequency is 3.69 and post unlikes are 4,083.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient awareness reach and video volume only.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 16,053.95 THB and delivered 23,858,980 impressions, 12,482,068 reach, 1,331,596 post engagements and 1,315,149 video views at 0.67 THB CPM.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use only as an awareness/video-view source if that objective is needed. Do not scale it for traffic, lead generation or messaging.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families            </h3>            <p>              Produces page likes and some messaging activity.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 7,867.50 THB, generated 2,418 likes, 47,109 page engagements, 6 messaging conversations started and 3 messaging conversation replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep at a controlled budget if family audience growth is valuable, but test stronger lead or message CTAs before scaling.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Largest spend concentration with weak business-goal output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              One version spent 44,087.75 THB and produced only 6 inline link clicks, 10 messaging conversations started and 1 lead. Cost per inline link click was about 7,347.96 THB and cost per recorded lead was 44,087.75 THB, though lead volume is below the 3-result decision threshold.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild as a dedicated lead, messaging, or ticket sales campaign. Do not fully pause based only on 1 lead result, but stop treating it as the primary growth driver.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very poor traffic and messaging performance despite huge reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Delivered 23,858,980 impressions but only 3 inline link clicks and 1 messaging conversation started from 16,053.95 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild with a clean objective and naming. Keep only if the KPI is low-cost awareness/video views.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Operationally risky and expensive reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 4,201.39 THB with CPM of 180.60 THB, 23,263 impressions, 1,847 likes and no inline link clicks or messaging starts.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild before adding budget. Do not scale the quarantined version.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Small campaign with limited downstream actions.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 1,067.55 THB, generated 225 likes, 3,383 page engagements, no inline link clicks and no messaging conversations.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make a hard pause decision from this smaller sample, but keep budget limited until it produces qualified traffic or messages.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Duplicate Broad Destination campaigns            </h3>            <p>              Budget is fragmented across multiple campaigns with the same name and little site traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Multiple campaigns named Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination spent 4,699.03 THB, 5,817.30 THB, 5,077.63 THB and 2,366.49 THB with only 2 combined inline link clicks across those four versions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate duplicate Broad Destination campaigns into fewer clean tests with distinct names, objectives and success metrics.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign and new lead/messaging campaigns              </strong>            </div>            <p>              The largest Broad Destination version spent 44,087.75 THB but generated only 6 inline link clicks, 10 messaging starts and 1 lead. New post engagement campaign produced 1,057 inline link clicks from only 5,461.89 THB spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                One consolidated Broad Destination test with clear objective and unique naming              </strong>            </div>            <p>              Several campaigns share the same name and have very low inline link click output, making budget allocation and learning unclear.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Clean rebuilt Thailand campaign              </strong>            </div>            <p>              The quarantined Thailand campaign has CPM of 180.60 THB and no inline link clicks or messaging starts.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting pool and conversion-focused campaigns              </strong>            </div>            <p>              The campaign is useful for low-cost reach and video views, but it produced only 3 inline link clicks and 1 messaging conversation started, so it should feed retargeting rather than receive traffic/lead budget.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current engagement-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead and purchase tracking campaigns              </strong>            </div>            <p>              The account has strong engagement volume but only 1 lead and 0 purchases reported, so more budget should be assigned to campaigns built for the actual business goal.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </ ualified messaging outcomes before making a decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Creative CTA test from winning engagement assets            </h3>            <p>              <strong>Setup:</strong>              Take the best-performing engagement creatives from AQ_MU2025_Followers_IN and New post engagement campaign and create variants with stronger ticket purchase, family visit and traveller visit CTAs.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, messaging starts and leads, not total clicks or post engagements.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Family audience vs broad destination lead test            </h3>            <p>              <strong>Setup:</strong>              Run a controlled test between Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families audience and a rebuilt Broad Destination audience using the same lead or messaging objective.            </p>            <p>              <strong>Success metric:</strong>              Qualified leads or qualified messages after each audience reaches at least 3 results.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events, revenue or ROAS are present, so profitable ticket sales cannot be evaluated.</li><li>Only 1 lead is recorded account-wide, below the minimum_results_before_decision of 3, so lead performance is directionally weak but statistically insufficient for a final CPA dec
