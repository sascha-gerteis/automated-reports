nd: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-24        →        2026-08-22      </span>      <span class=&quot;pill&quot;>        14 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 125,480.50</strong>        <small>          2026-07-24          to          2026-08-22        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>15,451,793</strong>        <small>          29,223,278 impressions          ·          1.89 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,803</strong>        <small>          0.51% CTR          ·          THB 0.84 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 41,826.83 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>34</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 4.29</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account delivered very large reach and engagement: 29,223,278 impressions, 15,451,793 reach, 2,974,194 page engagements, and 2,791,179 video views from THB 125,480.50 spend. However, direct business-goal performance is weak or not measurable: only 1 lead was recorded, no purchase events were recorded, and only 282 landing page views were tracked from 1,803 link clicks. Awareness and engagement campaigns are working, but traffic, lead, messaging, and purchase performance need a rebuild and tracking audit before profitability can be assessed.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from duplicated Broad Destination follows campaigns            </h3>            <p>              <strong>Why:</strong>              The five campaigns named Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination spent THB 62,048.20 combined, generated only 8 link clicks, 13 messaging conversations started, and 1 lead. The lead volume is below the minimum_results_before_decision of 3, but the campaigns are clearly not efficient traffic or messaging drivers.            </p>            <p>              <strong>Do this:</strong>              Reduce the combined Broad Destination budget materially and rebuild into separate campaigns by objective: one page-follow/engagement campaign, one traffic campaign optimized for landing page views, and one lead or purchase campaign once tracking is confirmed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Scale the Claude traffic campaigns carefully            </h3>            <p>              <strong>Why:</strong>              The Claude campaigns produced the best traffic quality in the account: 507 link clicks, 282 landing page views, and very low spend of THB 86.13. Landing page view rates were 50.3% to 63.0%, much stronger than the account overall.            </p>            <p>              <strong>Do this:</strong>              Keep all three Claude campaigns active and carefully increase budget in small increments while monitoring landing page views, link CTR, and cost per landing page view.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit purchase, lead, and landing page tracking            </h3>            <p>              <strong>Why:</strong>              The account recorded no purchase events, only 1 lead, and landing page views appear only on the Claude traffic campaigns despite 1,803 total link clicks account-wide.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI purchase, lead, content view, and landing page view events before making purchase or lead profitability decisions.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild or quarantine campaigns with ERROR QUARANTINED in the name            </h3>            <p>              <strong>Why:</strong>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers spent THB 16,053.95 and delivered 23,858,980 impressions but only 3 link clicks. ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily had a very high CPM of THB 180.60.            </p>            <p>              <strong>Do this:</strong>              Do not use these campaigns for traffic, lead, or purchase goals. Audit why they are marked ERROR QUARANTINED, then rebuild clean versions if the audiences or creatives are still needed.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Best traffic efficiency among campaigns with landing page view tracking.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16.24 spend, 154 link clicks, 97 landing page views, 13.10% CTR, THB 0.11 cost per link click, THB 0.17 cost per landing page view, and 63.0% landing page view rate from link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale. Use this campaign as the first traffic benchmark.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Strong traffic quality from a small sample.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 28.05 spend, 172 link clicks, 94 landing page views, 8.96% CTR, THB 0.16 cost per link click, THB 0.30 cost per landing page view, and 54.7% landing page view rate.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and increase budget carefully rather than making a large jump from the current small spend.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Efficient family-audience traffic with measurable landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 41.84 spend, 181 link clicks, 91 landing page views, 5.70% CTR, THB 0.23 cost per link click, and THB 0.46 cost per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully as a traffic test. Compare against the Corporates Claude campaigns as spend increases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong page-follow and engagement driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 28,693.89 spend, 27,312 page likes, 520,234 page engagements, 492,922 post engagements, 429,788 video views, and THB 1.05 cost per page like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for follower growth, but do not judge it by purchases. Watch frequency, currently 3.41, and refresh creatives if engagement quality declines.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Very efficient engagement and the best messaging-adjacent performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,461.89 spend, 772,033 post engagements, 722,875 video views, 1,057 link clicks, and 14 messaging conversations started at THB 390.14 per started conversation.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an engagement and warm-audience builder. Retarget engagers and video viewers with lead or ticket-sale campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very low-cost awareness reach and video volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,053.95 spend delivered 23,858,980 impressions, CPM of THB 0.67, 1,331,596 post engagements, and 1,315,149 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use only if the objective is low-cost awareness. Do not use this campaign for traffic, leads, or purchases without rebuilding.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Duplicated campaigns are absorbing almost half of spend without meaningful traffic or lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Five campaigns with this same name spent THB 62,048.20 combined and produced only 8 link clicks, 13 messaging conversations started, and 1 lead. The largest version alone spent THB 44,087.75 for 6 link clicks and 1 lead.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild. Consolidate duplicate naming, separate objectives, and stop using follows/likes structure to evaluate lead or ticket-sale outcomes.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Poor traffic quality despite massive reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              23,858,980 impressions and THB 16,053.95 spend generated only 3 link clicks, a 0.036% CTR, and THB 5,351.32 per link click. It also recorded 5,989 post unlikes.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild if the goal is traffic, leads, or sales. If kept, cap it as a pure awareness campaign and exclude it from performance-budget decisions.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families            </h3>            <p>              Follower acquisition is less efficient than AQ_MU2025_Followers_IN.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 7,867.50 spend, 2,418 page likes, THB 3.25 cost per page like, compared with AQ_MU2025_Followers_IN at THB 1.05 cost per page like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or refresh creative/audience. Keep only if family-audience quality is strategically important.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              High cost for page-follow output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,067.55 spend, 225 page likes, THB 4.74 cost per page like, CPM of THB 76.81, and no link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce unless Thailand follower growth is a separate priority. Compare against the quarantined Thailand version before keeping budget here.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Page-like volume is decent, but delivery cost is very high and campaign status/name suggests hygiene issues.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,201.39 spend, 1,847 page likes, THB 2.27 cost per page like, but CPM is THB 180.60 and there are no link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild cleanly before scaling. Keep only if the goal is Thailand page likes and the ERROR QUARANTINED issue is resolved.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Five duplicated Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | IN | Corporates | 5 Languages | 2026-06-19, Claude | IN | Corporates | 6 Languages | 2026-06-19, and Claude | IN | Families | 6 Languages | 2026-06-19              </strong>            </div>            <p>              Broad Destination spent THB 62,048.20 for only 8 link clicks and 1 lead, while the Claude campaigns generated 507 link clicks and 282 landing page views from only THB 86.13.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                A clean lead or ticket-sale retargeting campaign using video viewers, page engagers, and link clickers              </strong>            </div>            <p>              The campaign created a large warm pool with 1,315,149 video views and 1,331,596 post engagements, but generated only 3 link clicks. Retargeting this engagement is more aligned with qualified leads and ticket sales.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families and Thailand follows campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN for follower growth, or a new conversion/lead campaign if business-goal budget is prioritized              </strong>            </div>            <p>              AQ_MU2025_Followers_IN has a lower page-like cost at THB 1.05, while Families is THB 3.25, Thailand Daily is THB 4.74, and the quarantined Thailand campaign has very high CPM.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Claude traffic scale test            </h3>            <p>              <strong>Setup:</strong>              Increase spend gradually across the three Claude campaigns while keeping them separate by audience and language setup. Do not merge until each has more data at higher spend.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, link CTR, and landing page view rate from link clicks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Lead generation campaign rebuild            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated lead campaign using the best-performing traffic audiences: Corporates 5 Languages, Corporates 6 Languages, Families 6 Languages, plus retargeting of video viewers and page engagers.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 leads, per the supplied minimum_results_before_decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Ticket-sale or purchase tracking test            </h3>            <p>              <strong>Setup:</strong>              Create a small purchase-optimized or sales-objective campaign only after the purchase event is confirmed firing correctly. Use retargeting audiences first because the account has 2,791,179 video views and 2,974,194 page engagements.            </p>            <p>              <strong>Success metric:</strong>              Purchase event volume, cost per purchase, and ROAS once purchase value is available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Build a dedicated messaging campaign using learnings from New post engagement campaign, which produced 14 conversations started from THB 5,461.89. Add qualifying questions for group size, visit date, and ticket intent.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, depth-2 message sends, and qualified-lead rate from chat follow-up.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative and CTA split test for Broad Destination rebuild            </h3>            <p>              <strong>Setup:</strong>              Rebuild the Broad Destination campaign with unique campaign names and separate ad sets for clear tracking. Test direct ticket/lead CTA against follower-style creative.            </p>            <p>              <strong>Success metric:</strong>              Link clicks, landing page views, leads, and messaging conversations started. Do not judge lead cost until at least 3 leads are recorded.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events were recorded, so ticket-sale performance, cost per purchase, and ROAS cannot be evaluated.</li><li>Only 1 lead was recorded across THB 125,480.50 spend, which is below the minimum_results_before_decision of 3. Lead performance is insufficient for a final CPL decision.</li><li>Only 282 landing page views were recorded from 1,803 link clicks, and all landing page views appear to come from the three Claude campaigns. This suggests landing page view tracking may not be firing consistently across campaigns or destinations.</li><li>Account-level clicks are 149,114
