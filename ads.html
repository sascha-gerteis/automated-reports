 .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-23        →        2026-10-22      </span>      <span class=&quot;pill&quot;>        4 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 16,578.51</strong>        <small>          2026-09-23          to          2026-10-22        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,039,648</strong>        <small>          1,899,232 impressions          ·          1.83 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>7,622</strong>        <small>          2.25% CTR          ·          THB 0.39 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>6</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 8.73</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent THB 16,578.51 and generated strong upper-funnel volume: 1,899,232 impressions, 1,039,648 reach, 42,677 clicks, 7,622 link clicks, 730 landing page views, 168,023 page engagements, and 136,164 video views. However, the current setup is mostly followers/engagement focused, while the stated business goal is profitable ticket sales and qualified leads. No purchases or lead actions were recorded, so sales/lead efficiency cannot be judged. Best traffic-quality performance came from AQ Operator CBO | IN | Instagram Followers, while AQ_MU2025_Followers_IN was strongest for likes/follower-type engagement. Budget should be moved away from the highest-cost and lowest-quality follower campaigns into the best LPV performer and a properly tracked lead/sales test.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              <strong>Why:</strong>              This campaign produced 672 of the account&amp;#039;s 730 landing page views, with 3,452 link clicks and the best landing page view efficiency at about THB 6.03 per LPV.            </p>            <p>              <strong>Do this:</strong>              Carefully increase AQ Operator CBO | IN | Instagram Followers budget by 15-20% while monitoring LPVs, CTR, CPC, and messaging blocks.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              <strong>Why:</strong>              It has the highest CPM at THB 98.16, highest CPC at THB 1.09, zero link clicks, zero landing page views, and weaker cost per like than AQ_MU2025_Followers_IN.            </p>            <p>              <strong>Do this:</strong>              Reduce spend sharply or pause only after launching a replacement follower/likes test with lower-cost audiences and creatives.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix lead and purchase tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              No lead, purchase, purchase value, or ROAS data was recorded, despite the stated goal of ticket sales and qualified leads.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI, lead events, purchase events, thank-you pages, UTM parameters, and ticketing checkout tracking before scaling sales budgets.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate follower campaigns from sales/lead campaigns            </h3>            <p>              <strong>Why:</strong>              Current campaigns are named and behaving like follower/engagement campaigns, not lead or purchase campaigns.            </p>            <p>              <strong>Do this:</strong>              Keep follower campaigns for awareness only, and launch separate lead/sales campaigns with conversion or lead objectives once tracking is confirmed.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best campaign for traffic quality and landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 4,048.68, generated 3,452 link clicks, 672 landing page views, 91,522 video views, and 96,672 page engagements. Cost per LPV was about THB 6.03, far better than Aquaverse India | Instagram Followers | 2026-09-27 at about THB 109.62 per LPV.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale if the near-term goal is landing page traffic or retargetable engagement. Use it as the base campaign for ticket page traffic testing.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strongest follower/like-style engagement campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 5,039.09 and generated 5,825 likes, 59,704 page engagements, 9,321 post reactions, 42,584 video views, 9.08% CTR, and cost per like of about THB 0.87.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for follower growth and engagement only. Do not judge it by purchases or traffic because it generated only 16 link clicks and 1 landing page view.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient reach and low-cost clicking, but weak post-click quality.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 6,248.33, reached 612,578 people, had the lowest CPC at THB 0.29, lowest CPM at THB 5.79, and generated 4,154 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only at reduced budget for reach/follower testing unless landing page view quality improves.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Least efficient campaign in the current mix.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,242.41 with CPM of THB 98.16, CPC of THB 1.09, zero link clicks, zero landing page views, and 897 likes at about THB 1.38 per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild with new audience/creative. If a replacement performs better after at least 3 meaningful results, pause this campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              High click volume is not translating into landing page visits.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 4,154 link clicks but only 57 landing page views, a very low click-to-LPV rate of about 1.37%. It also recorded 506 messaging blocks and 660 post unlikes.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and audit destination, placement quality, landing page load speed, and tracking. Rebuild if the objective is traffic, leads, or ticket sales.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Good engagement but not useful for traffic or sales evaluation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Despite THB 5,039.09 spend and 11,976 clicks, it produced only 16 link clicks and 1 landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only for follower/engagement objectives. Do not allocate sales or traffic budget here unless the campaign objective and destination are rebuilt.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              All campaigns            </h3>            <p>              Lead and purchase performance cannot be evaluated.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across THB 16,578.51 spend, there were no reported leads, purchases, purchase values, or ROAS.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make profitability decisions until lead and purchase tracking is implemented and each sales/lead campaign reaches at least 3 results.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              Broad Destination has the highest CPM and CPC with zero link clicks or LPVs, while AQ Operator CBO produced 672 LPVs at about THB 6.03 per LPV.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              Aquaverse India | Instagram Followers produced cheap clicks but only 57 LPVs from 4,154 link clicks. Move a portion of spend to the campaign producing materially better LPV volume and quality.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Follower/likes budget not tied to sales measurement              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New properly tracked lead or ticket-sales campaign              </strong>            </div>            <p>              The business goal is ticket sales and qualified leads, but no lead or purchase events are currently being captured.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Keep as engagement/follower budget only              </strong>            </div>            <p>              It is efficient for likes and engagement but produced only 1 landing page view, so it should not receive traffic or sales budget.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Tracked ticket sales or lead campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a separate campaign optimized for leads or purchases after confirming Pixel/CAPI and event tracking. Use ticket or lead-focused creative instead of follower creative.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 leads or purchases. Track cost per lead, cost per purchase, and ROAS once values are available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              AQ Operator CBO traffic quality scale test            </h3>            <p>              <strong>Setup:</strong>              Increase AQ Operator CBO | IN | Instagram Followers by 15-20% and send traffic to the intended ticket or lead destination with UTMs.            </p>            <p>              <strong>Success metric:</strong>              Maintain or improve landing page views, cost per LPV, and click-to-LPV rate versus current 672 LPVs at about THB 6.03 per LPV.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Follower efficiency test against AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong>              Create a new follower/likes test using AQ_MU2025_Followers_IN as the control and test new creative or audience against it.            </p>            <p>              <strong>Success metric:</strong>              Beat AQ_MU2025_Followers_IN cost per like of about THB 0.87 while maintaining engagement quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Landing page click-to-LPV diagnostic            </h3>            <p>              <strong>Setup:</strong>              Run the same landing page URL and UTM setup across AQ Operator CBO | IN | Instagram Followers and Aquaverse India | Instagram Followers | 2026-09-27.            </p>            <p>              <strong>Success metric:</strong>              Identify why Aquaverse India | Instagram Followers generated only 57 LPVs from 4,154 link clicks while AQ Operator CBO generated 672 LPVs from 3,452 link clicks.
