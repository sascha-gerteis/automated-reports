ent Families campaign.            </p>            <p>              <strong>Success metric:</strong>              Cost per page like, page engagement volume, and negative feedback such as post unlikes.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Awareness-to-retargeting funnel            </h3>            <p>              <strong>Setup:</strong>              Keep Young Adult Travellers as a low-cost awareness/video-view campaign, then retarget video viewers with traffic or lead ads.            </p>            <p>              <strong>Success metric:</strong>              Retargeting landing page views, messaging starts, and leads, not awareness campaign purchases.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Lead form versus website lead            </h3>            <p>              <strong>Setup:</strong>              Run one Meta lead form ad set and one website lead ad set using the same audience and creative after tracking is verified.            </p>            <p>              <strong>Success metric:</strong>              Qualified leads and cost per lead after each reaches at least 3 leads.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events, purchase value, or ROAS were supplied, so ticket-sale profitability cannot be assessed.</li><li>Only 1 lead was recorded across THB 121,978.27 spend, which is below the minimum_results_before_decision of 3.</li><li>Several zero-spend, zero-impression campaigns and days still show messagi
