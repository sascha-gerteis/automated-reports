    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 424,424.04</strong>        <small>          2026-07-03          to          2026-08-01        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>9,752,563</strong>        <small>          28,564,481 impressions          ·          2.93 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>482,483</strong>        <small>          2.65% CTR          ·          THB 0.56 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>33</strong>        <small>          THB 12,861.33 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>8</strong>        <small>          THB 53,053.01 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 3,476.00        </strong>        <small>          0.01× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>184</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 14.86</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent THB 424,424.04, generating 28,564,481 impressions, 482,483 link clicks, 61,094 omni landing page views, 11 leads, and 8 reported purchases with THB 3,476 purchase value. Awareness and traffic volume are strong, but measurable ticket sales and lead output are concentrated in very few campaigns. The strongest conversion signal is from Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;, which produced 8 leads and 4 purchases from THB 2,084.79. Many campaigns have only 0–1 purchases or leads, so purchase-level decisions are limited by insufficient result volume.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Scale the only campaign with enough conversion volume            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; is the only campaign above the minimum_results_before_decision threshold for purchases, with 4 purchases and 8 leads.            </p>            <p>              <strong>Do this:</strong>              Carefully increase budget on this campaign or rebuild it into a dedicated Sales/Leads structure using the same post/creative. Scale in small steps and monitor purchase, lead, and messaging volume.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce low-value follower spend            </h3>            <p>              <strong>Why:</strong>              FB Follow | Thailand | Aquaverse Lifestyle spent THB 52,169.87 for 3 likes, while FB Follow | Thailand | Lookalike Fans Scale spent THB 36,707.33 for 10 likes and only 28 link clicks.            </p>            <p>              <strong>Do this:</strong>              Cut budget materially from both follower campaigns. Pause or rebuild FB Follow | Thailand | Lookalike Fans Scale because it has more than 3 follower results and weak output for its objective.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reallocate toward campaigns with stronger landing page quality            </h3>            <p>              <strong>Why:</strong>              Several traffic campaigns produce many clicks but weak landing page delivery, while Claude | TH | Corporates | Thai | 2026-06-19, Claude | TH | Conversions Shopee | 12Jun, and Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026 show stronger click-to-LPV efficiency.            </p>            <p>              <strong>Do this:</strong>              Move budget from low-LPV campaigns into the strongest LPV campaigns, then retest them with purchase/lead objectives instead of only traffic.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix tracking and click-to-landing-page drop-off before scaling traffic            </h3>            <p>              <strong>Why:</strong>              Account-level link clicks are 482,483 but omni landing page views are only 61,094. Some campaigns show extreme gaps, such as Claude | TH | Traffic IMAGES | 18Jun with 115,392 link clicks but 8,103 LPVs.            </p>            <p>              <strong>Do this:</strong>              Audit destination URLs, load speed, Meta pixel/CAPI events, UTMs, app/deep-link behavior, and marketplace handoff before increasing traffic budgets.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best conversion performer and the only campaign with enough purchase results for a decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,084.79 spend, 8 leads, 4 purchases, THB 2,176 purchase value, 42 messaging conversations started, 42 messaging replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Rebuild the same creative/post into a dedicated Sales or Leads campaign and test higher budget gradually.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Corporates | Thai | 2026-06-19            </h3>            <p>              Strong landing page quality for a corporate-focused campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,088.17 spend, 5,540 link clicks, 3,216 landing page views, CTR 8.06%. Click-to-LPV rate is much stronger than most traffic campaigns.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and test as a lead-generation campaign with a corporate inquiry form or messaging CTA.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Conversions Shopee | 12Jun            </h3>            <p>              Good marketplace traffic quality.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,528.40 spend, 6,282 link clicks, 3,496 landing page views, CTR 8.30%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale traffic if marketplace tracking is confirmed. Test purchase-optimized or LPV-optimized variants.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026            </h3>            <p>              Efficient traffic with strong landing page delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,468.38 spend, 5,781 link clicks, 1,517 landing page views, CTR 13.04%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and rebuild into a Sales objective test using the same angle and destination.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Indian Market : Awareness            </h3>            <p>              Very efficient awareness reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 595.15 spend, 887,143 reach, 893,882 impressions, CPM T rid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-03        →        2026-08-01      </span>      <span class=&quot;pill&quot;>        79 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,261,503.92</strong>        <small>          2026-07-03          to          2026-08-01        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>68,120,415</strong>        <small>          163,770,327 impressions          ·          2.40 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>4,340,549</strong>        <small>          3.15% CTR          ·          THB 0.24 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>261</strong>        <small>          THB 4,833.35 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 630,751.96 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2,191</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.70</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Aquaverse spent 1,261,503.92 THB, generating very large reach and traffic volume: 163,770,327 impressions, 68,120,415 reach, 4,340,549 link clicks, and 1,302,395 landing page views. However, lower-funnel output is concentrated in a few small campaigns: 87 leads and only 2 purchases account-wide. Purchase volume is below the minimum_results_before_decision of 3, so purchase performance is insufficient for firm decisions. The strongest lead and messaging performance came from &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot;, &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;. A large share of spend is sitting in traffic, awareness, and follow/engagement campaigns that are producing cheap reach or clicks but little measurable lead or purchase output.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the proven lead and messaging winners            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot; generated 17 leads from 1,903.30 THB, while &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot; generated 24 leads from 3,882.96 THB and &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot; generated 23 leads from 3,861.08 THB.            </p>            <p>              <strong>Do this:</strong>              Increase budgets on these three campaigns gradually by 20-30% at a time, or duplicate them into a dedicated lead/messaging campaign while keeping the original campaigns stable.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce budget concentration in high-spend traffic campaigns with no lead volume            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;quot; spent 221,116.80 THB with 700,562 link clicks and 191,507 landing page views but no leads or purchases reported. &amp;quot;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;quot; spent 103,846.56 THB with 332,321 link clicks and 101,005 landing page views but no leads or purchases reported.            </p>            <p>              <strong>Do this:</strong>              Reduce these corporate traffic budgets and move part of the spend into lead/messaging winners and retargeting. Keep a smaller traffic budget only if these audiences are needed for remarketing pools.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate sales budget from awareness, follow, and engagement budget            </h3>            <p>              <strong>Why:</strong>              Follower and engagement campaigns are producing page engagement and likes, but they should not be judged as ticket-sales campaigns. For example, &amp;quot;AQ_MU2025_Followers_IN&amp;quot; produced 22,643 likes and 594,914 page engagements from 31,231.82 THB, while many &amp;quot;Aquaverse India Daily Follows Likes&amp;quot; campaigns produced likes and comments but very few link clicks or leads.            </p>            <p>              <strong>Do this:</strong>              Create separate budget caps for awareness/follow objectives and lower-funnel lead/sales objectives. Do not allow follower campaigns to consume budget intended for ticket sales or qualified leads.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate tracking and attribution inconsistencies before scaling purchase optimization            </h3>            <p>              <strong>Why:</strong>              The account reports 2 purchases, below the minimum decision threshold of 3. Several days from 2026-07-17 to 2026-07-22 show 0 spend, 0 impressions, and 0 clicks but still report leads, landing page views, and messaging events.            </p>            <p>              <strong>Do this:</strong>              Audit pixel/CAPI, event deduplication, attribution windows, and delayed conversion reporting before making purchase-based scaling decisions.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild weak traffic creatives instead of adding more spend            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Post: \&amp;quot;🌊 Your Ultimate Destination for Fun and Adventure! 💦\&amp;quot;&amp;quot; spent 6,102.44 THB with only 485 link clicks, 0 leads, and 3 messaging conversation starts. &amp;quot;Automation Test Campaign&amp;quot; had 3,093,299 impressions but only 1,070 link clicks and 0.075% CTR.            </p>            <p>              <strong>Do this:</strong>              Do not scale these creatives. Rebuild them using hooks, offers, and CTAs from the best-performing post and Claude English/Malayalam campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best lower-funnel performer for leads and messaging.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 1,903.30 THB, 17 leads, 322 messaging conversations started, 476 total messaging connections, 2,285 link clicks, and 1 purchase. CPL was 111.96 THB and cost per messaging conversation started was 5.91 THB. Purchase count is only 1, so purchase performance is not yet decision-ready.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Duplicate this post into a dedicated lead or messaging campaign and test broader but controlled audiences.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging performance from a low spend base.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 3,882.96 THB, 24 leads, 539 messaging conversations started, 603 total messaging connections, 29,756 link clicks, and 2.088% CTR. CPL was 161.79 THB and cost per messaging conversation started was 7.20 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Use this creative/message as a control for new English lead and messaging tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong regional language lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 3,861.08 THB, 23 leads, 610 messaging conversations started, 654 total messaging connections, 30,609 link clicks, and 2.345% CTR. CPL was 167.87 THB and cost per messaging conversation started was 6.33 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Build a Malayalam-specific lead/messaging ad set using the same core offer and CTA.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Very strong awareness/traffic efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 20,754.28 THB, 10,130,057 impressions, 7,269,627 reach, 733,993 link clicks, 241,300 landing page views, 7.372% CTR, and 2.049 THB CPM.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as top-of-funnel traffic only. Retarget landing page viewers and engagers with lead or ticket-sale offers instead of expecting this campaign alone to drive purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient traffic generator with strong CTR.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 10,903.69 THB, 393,857 link clicks, 132,030 landing page views, 7.677% CTR, 0.027 THB CPC, and 2.086 THB CPM.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep with a controlled budget as a traffic pool builder. Add retargeting from its landing page views into lead/messaging campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Working for page/follower-style engagement, not lower-funnel sales.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 31,231.82 THB, 22,643 likes, 594,914 page engagements, 64,032 post reactions, and 4.294% CTR.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if page growth is a separate objective. Do not treat it as a ticket-sales campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19            </h3>            <p>              Efficient traffic within the high-spend audience-segment campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 58,609.75 THB, 285,119 link clicks, 101,305 landing page views, 5.980% CTR, and 0.203 THB CPC.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as traffic if remarketing volume is needed, but cap budget until it proves lead or purchase contribution.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Largest spend allocation is producing traffic but no reported leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 221,116.80 THB, 700,562 link clicks, 191,507 landing page views, 3.784% CTR, 5 messaging conversations started, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild the corporate offer/CTA. Retain only a smaller traffic budget if corporate remarketing is strategically needed.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with traffic volume but no measurable lower-funnel output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 103,846.56 THB, 332,321 link clicks, 101,005 landing page views, 3.801% CTR, 2 messaging conversations started, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild. Test a corporate-specific lead form or enquiry CTA instead of sending broad traffic.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Traffic volume is present, but lower-funnel output is absent.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 61,332.15 THB, 174,531 link clicks, 64,073 landing page views, 2 messaging conversations started, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce until a lead or ticket-sales follow-up funnel is added. Test family-specific offers in a lead campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              High spend with no reported leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 58,515.06 THB, 211,207 link clicks, 69,288 landing page views, 2 messaging conversations started, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and use this audience mainly for retargeting unless new creative proves lead generation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Strong engagement campaign, weak lead efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 14,563.19 THB, 1,987,928 post engagements, 121,416 post reactions, 49 messaging conversations started, and 3 leads. CPL was 4,854.40 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only for engagement objectives. Do not scale for leads; retarget engagers with the proven lead/messaging creatives.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Post: &amp;quot;🌊 Your Ultimate Destination for Fun and Adventure! 💦&amp;quot;            </h3>            <p>              Weak traffic and lower-funnel response.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 6,102.44 THB, 1,591,539 impressions, 485 link clicks, 0.278% CTR, 3 messaging conversations started, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild this creative for performance use. Replace with messaging and CTA structure from the best-performing post.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Automation Test Campaign            </h3>            <p>              Very low traffic engagement despite large reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 2,046.20 THB, 3,093,299 impressions, 1,070 link clicks, and 0.075% CTR.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale. Rebuild the creative or keep only as a low-cost awareness experiment.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19 and Claude | IN | Corporates | 5 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13              </strong>            </div>            <p>              The corporate campaigns spent a combined 324,963.36 THB with 0 leads, while the three winner campaigns generated 64 leads from 9,647.34 THB.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                High-spend audience traffic campaigns: Families, Singles, Couples, Party Goers, and Corporates 5/6 Languages              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated retargeting campaign for landing page viewers, link clickers, page engagers, and messaging starters              </strong>            </div>            <p>              These campaigns generated large traffic pools, including hundreds of thousands of landing page views, but most did not generate leads directly.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate Aquaverse India Daily Follows Likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                A capped awareness/follower budget separate from sales budget              </strong>            </div>            <p>              These campaigns are producing likes, comments, and page engagement, but link clicks and leads are very low because the objective is not lower-funnel conversion.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Post: &amp;quot;🌊 Your Ultimate Destination for Fun and Adventure! 💦&amp;quot; and Automation Test Campaign              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New creative tests based on the best-performing post and Claude English/Malayalam formats              </strong>            </div>            <p>              Both campaigns show weak traffic or lead response relative to the proven lead/messaging creatives.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Dedicated lead campaign using proven creatives            </h3>            <p>              <strong>Setup:</strong>              Create a new lead objective campaign using &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot;, &amp;quot;Claude | IN | English | India Show 2025&amp;quot;, and &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent&amp;quot; as separate ad sets or ads. Keep budgets controlled and scale only after each ad set reaches at least 3 leads.            </p>            <p>              <strong>Success metric:</strong>              Lead volume and cost per lead, with minimum 3 leads before deciding.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Messaging funnel test            </h3>            <p>              <strong>Setup:</strong>              Run a messaging campaign using the best post creative and the Claude English/Malayalam hooks. Test two conversation flows: ticket enquiry first vs offer/discount first.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, depth 2/3/5 message sends, leads, and block rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Traffic-to-retargeting conversion test            </h3
