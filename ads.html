-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-16        →        2026-10-15      </span>      <span class=&quot;pill&quot;>        4 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 17,169.59</strong>        <small>          2026-09-16          to          2026-10-15        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>931,319</strong>        <small>          1,755,266 impressions          ·          1.88 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>5,228</strong>        <small>          2.38% CTR          ·          THB 0.41 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>4</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 9.78</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account delivered large awareness volume from THB 17,169.59 spend, 1,755,266 impressions, 931,319 reach, 158,836 post engagements, 133,450 video views, and 5,228 link clicks. However, the business goal is profitable ticket sales and qualified leads, and there are no reported purchases, no reported leads, and only 6 total messaging connections. Most spend is concentrated in follower/engagement campaigns, so current activity is building attention but is not yet proving ticket-sales or lead performance.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from follower-only delivery into landing-page and lead/purchase-intent campaigns            </h3>            <p>              <strong>Why:</strong>              The account spent THB 17,169.59 but has no reported purchases or leads. THB 8,598.54 was spent on AQ_MU2025_Followers_IN, which generated 105,412 post engagements and 8,563 likes but only 20 inline link clicks.            </p>            <p>              <strong>Do this:</strong>              Reduce AQ_MU2025_Followers_IN and Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination budgets, then reallocate to AQ Operator CBO | IN | Instagram Followers and a new ticket-sales/lead campaign optimized for landing page views, leads, messages, or purchases depending on available tracking.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              <strong>Why:</strong>              This campaign has the strongest landing-page quality: 235 landing page views from 1,377 link clicks, a 17.1% LPV-to-link-click rate, and THB 7.55 cost per landing page view. It also has the lowest CPM at THB 5.22.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually while monitoring landing page views, LPV-to-link-click rate, and any downstream lead or purchase events. Do not judge it on purchases until purchase tracking records at least 3 results.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix or audit tracking before making sales-performance decisions            </h3>            <p>              <strong>Why:</strong>              The account shows 5,228 link clicks but only 288 landing page views, a 5.5% LPV-to-link-click rate. There are no purchases, no leads, and only 6 messaging connections, so sales and lead performance cannot be properly evaluated.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI events, purchase and lead events, landing page view firing, UTMs, and message conversion tracking. Confirm that ticket sales and lead submissions are being passed back to Meta.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild the weakest follower/likes campaign            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination spent THB 1,242.41 with 0 inline link clicks, CPM of THB 98.16, and THB 1.38 per like. It is more expensive than AQ_MU2025_Followers_IN on cost per like and does not support traffic or lead goals.            </p>            <p>              <strong>Do this:</strong>              Do not scale this campaign. Rebuild it with new audience/creative or move the budget into better-performing landing-page traffic and lead tests.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best campaign for landing-page traffic quality.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,773.53 spend, 1,377 link clicks, 235 landing page views, THB 1.29 per link click, THB 7.55 per landing page view, 17.1% LPV-to-link-click rate, CPM THB 5.22.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Prioritize this structure for traffic, retargeting, and future lead/purchase tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Strong low-cost reach and link-click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,555.11 spend, 978,587 impressions, 563,921 reach, 3,831 link clicks, THB 1.45 per link click, CPM THB 5.68, and 4 total messaging connections.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep with controls, but do not scale aggressively until landing-page quality improves because it generated only 53 landing page views from 3,831 link clicks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness and engagement generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 8,598.54 spend, 113,975 page engagements, 105,412 post engagements, 90,324 video views, 8,563 likes, THB 0.08 per post engagement, and THB 1.00 per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth and engagement remain a strategic objective. Reduce its share of spend if the priority is ticket sales or qualified leads.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              High spend is not translating into traffic or measurable business outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              It used THB 8,598.54, about half of total account spend, but produced only 20 inline link clicks and no reported leads or purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and use it mainly as an awareness/engagement pool. Retarget engagers and video viewers with ticket or lead-focused campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Weak efficiency versus other follower/engagement campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,242.41 spend, 0 inline link clicks, CPM THB 98.16, 897 likes at THB 1.38 per like, and 3,628 page engagements at THB 0.34 per page engagement.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Test new creative/audience setup before adding more budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Cheap clicks but poor landing-page continuation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              3,831 link clicks but only 53 landing page views, a 1.4% LPV-to-link-click rate. Cost per landing page view is THB 104.81.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Check landing page load speed, tracking, placements, and click quality. Keep budget limited until LPV rate improves.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide messaging performance            </h3>            <p>              Messaging volume is too low for reliable lead optimization.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Only 6 total messaging connections and 4 messaging conversations started from THB 17,169.59 spend. Account-level cost per messaging connection is THB 2,861.60.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Run a dedicated message or lead qualification test. Do not make campaign-level pause decisions where campaigns have fewer than 3 messaging results.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Purchase and lead performance            </h3>            <p>              No measurable purchase or lead performance is available.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The dataset includes no purchase events, no lead events, no revenue, and no ROAS.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not judge campaigns by cost per purchase or ROAS yet. First confirm tracking and generate at least 3 purchases or leads before optimization decisions.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is efficient for engagement but produced only 20 inline link clicks from THB 8,598.54. AQ Operator CBO | IN | Instagram Followers produced 235 landing page views at THB 7.55 each.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead or ticket-sales test campaign              </strong>            </div>            <p>              The campaign has 0 inline link clicks and the highest CPM at THB 98.16, while the business goal is ticket sales and qualified leads.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Unrestricted follower/likes allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting pool built from AQ_MU2025_Followers_IN engagers and video viewers              </strong>            </div>            <p>              AQ_MU2025_Followers_IN generated 105,412 post engagements and 90,324 video views, creating a large warm audience that can be retargeted with ticket or lead offers.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27 scale budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers or LPV-optimized traffic test              </strong>            </div>            <p>              Aquaverse India | Instagram Followers | 2026-09-27 has low-cost link clicks but only 53 landing page views from 3,831 link clicks, while AQ Operator CBO achieved a much stronger 17.1% LPV-to-link-click rate.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing-page quality test            </h3>            <p>              <strong>Setup:</strong>              Run a traffic or conversion campaign optimized for landing page views using the best-performing AQ Operator CBO | IN | Instagram Followers structure and compare it against Aquaverse India | Instagram Followers | 2026-09-27.            </p>            <p>              <strong>Success metric:</strong>              Cost per landing page view and LPV-to-link-click rate. Current best reference is AQ Operator CBO | IN | Instagram Followers at THB 7.55 per LPV and 17.1% LPV-to-link-click rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket-sales or lead conversion tracking test            </h3>            <p>              <strong>Setup:</strong>              Launch a small dedicated campaign using ticket/lead-focused creative and ensure lead or purchase events fire correctly in Meta.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads or purchases recorded before making optimization decisions. Do not compare to CPL, CPA, or ROAS targets because supplied targets are unknown.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>
