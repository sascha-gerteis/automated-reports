r;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-06        →        2026-08-04      </span>      <span class=&quot;pill&quot;>        83 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,060,415.34</strong>        <small>          2026-07-06          to          2026-08-04        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>61,028,259</strong>        <small>          141,478,279 impressions          ·          2.32 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>3,528,644</strong>        <small>          2.99% CTR          ·          THB 0.25 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>222</strong>        <small>          THB 4,776.65 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 530,207.67 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1,830</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.50</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated very large reach and traffic: THB 1,060,415.34 spend, 141,478,279 impressions, 3,528,644 link clicks, 1,237,471 landing page views, 74 leads, and 2 purchases. Lead and purchase volume is extremely concentrated: &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot;, &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot; produced 53 of 74 leads from only THB 7,842.46 spend. Purchase data is below the minimum decision threshold of 3 purchases, so purchase performance and profitability cannot be judged yet.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead and messaging winners            </h3>            <p>              <strong>Why:</strong>              Three campaigns produced 53 leads from THB 7,842.46 spend, while many high-spend traffic/video campaigns generated zero leads.            </p>            <p>              <strong>Do this:</strong>              Increase budgets carefully on &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot;, &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot; by small controlled increments, and monitor lead volume, messaging depth, and block rate.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild high-spend zero-lead video audience campaigns            </h3>            <p>              <strong>Why:</strong>              &amp;quot;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;quot; spent THB 183,920.59 with 576,459 link clicks, 182,071 landing page views, and 0 leads. &amp;quot;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;quot; spent THB 87,426.18 with 277,172 link clicks, 96,177 landing page views, and 0 leads.            </p>            <p>              <strong>Do this:</strong>              Stop using these as lead/ticket acquisition campaigns in their current form. Rebuild them with lead or messaging optimization, stronger ticket/offer CTAs, and retargeting exclusions before adding more scale.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness, follower, traffic, lead, messaging, and purchase budgets            </h3>            <p>              <strong>Why:</strong>              Many campaigns are strong for reach, video views, or followers but are not producing leads or purchases. They should not compete with lead/ticket campaigns for the same budget.            </p>            <p>              <strong>Do this:</strong>              Create separate budget pools: awareness/follower campaigns capped for reach and page growth; traffic campaigns judged by landing page views; lead/messaging campaigns judged by leads and qualified conversations; purchase campaigns judged only after at least 3 purchases.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking before making purchase decisions            </h3>            <p>              <strong>Why:</strong>              Only 2 purchases were recorded, below the minimum_results_before_decision of 3. There are also days with 0 spend/impressions but recorded leads and messaging actions.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI purchase, lead, landing page view, and messaging event setup. Do not pause or scale based on purchase data until at least 3 attributed purchases are available.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best lead and messaging performer in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,432.26 spend, 14 leads, 257 messaging conversations started, 196 messaging conversation replies, 31 depth-5 message sends, and 1 purchase. Cost per lead was THB 102.30. Purchase count is below the 3-result decision threshold.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale. Duplicate into a dedicated lead/messaging campaign and test the same creative with lead form and Messenger qualification flows.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong qualified lead and messaging signal from a traffic campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,193.89 spend, 21 leads, 552 messaging conversations started, 288 messaging replies, 53 depth-3 sends, and 13 depth-5 sends. Cost per lead was THB 152.09.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Build a dedicated Malayalam lead/messaging version rather than relying only on traffic optimization.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,216.31 spend, 18 leads, 423 messaging conversations started, 369 messaging replies, 103 depth-3 sends, and 27 depth-5 sends. Cost per lead was THB 178.68.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this creative/message angle as a template for new English and multilingual lead tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Efficient traffic and landing page view driver for awareness/traffic objectives.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,151.82 spend, 566,335 link clicks, 232,870 landing page views, CTR 7.39%, CPC THB 0.028, and CPM THB 2.07.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for top-of-funnel traffic, but do not judge it by purchases. Use its landing page viewers for retargeting into lead or purchase campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient traffic campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 8,683.54 spend, 310,689 link clicks, 127,556 landing page views, CTR 7.67%, CPC THB 0.027, and CPM THB 2.10.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic/remarketing audience builder. Retarget landing page viewers with lead and ticket-sales offers.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Works for follower/page growth rather than ticket sales.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 29,219.90 spend, 22,284 page likes, 562,502 page engagements, 59,509 post reactions, and CTR 4.31%. It generated only 209 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if page growth is a separate goal. Cap budget if the current priority is profitable ticket sales and qualified leads.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              High spend and high traffic but no lead outcome.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 183,920.59 spend, 16,422,559 impressions, 576,459 link clicks, 182,071 landing page views, 7,578,539 video views, 5 messaging conversations started, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or pause as a lead/ticket acquisition campaign. Rebuild with lead or messaging optimization, stronger corporate offer, and retargeting before scaling again.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with no lead conversion.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 87,426.18 spend, 8,153,420 impressions, 277,172 link clicks, 96,177 landing page views, 3,392,363 video views, 1 messaging conversation started, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce heavily or rebuild. Do not continue scaling for lead generation without a new conversion-focused setup.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19, Claude | IN | Families | 6 Languages | 2026-06-19, Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              Large traffic volume but no leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Combined spend was THB 155,866.92 with 581,158 link clicks and 226,545 landing page views across the three campaigns, but 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild as lead/messaging tests. Keep only limited traffic budget if these audiences are needed for retargeting pools.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 5 Languages | 2026-06-19, Claude | IN | Families | 5 Languages | 2026-06-19, Claude | IN | Singles | 5 Languages | 2026-06-19, Claude | IN | Party Goers | 5 Languages | 2026-06-19            </h3>            <p>              Traffic performance exists, but lower-funnel performance is absent.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Combined spend was THB 51,763.02 with 210,135 link clicks and 86,369 landing page views, but 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale in current form. Test the same audiences with lead forms, Messenger qualification, and ticket-specific creative.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Good engagement volume but weak as a lead campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 12,829.96 spend, 1,738,303 post engagements, 107,376 post reactions, but only 3 leads and 44 messaging conversations started. CTR was 0.15%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only for engagement if needed. Do not use as a primary lead driver unless rebuilt with the winning lead creative and conversion objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Strong visibility but not useful for traffic or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,863.42 spend, 25,110,732 impressions, CPM THB 0.67, but only 1 link click, 3 messaging conversations started, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as a low-cost awareness layer. Cap or reduce if the main goal is ticket sales and qualified leads.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19 and Claude | IN | Corporates | 5 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13, and Claude | IN | English | India Show 2025 | Traffic | 2026-06-13              </strong>            </div>            <p>              The two Corporates campaigns spent THB 271,346.77 with 0 leads, while the three recommended campaigns generated 53 leads from THB 7,842.46 spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Couples/Families/Singles/Party Goers | 5 and 6 Languages | 2026-06-19 campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead and messaging tests using the Malayalam, English India Show, and Start Your Day creative angles              </strong>            </div>            <p>              The broader 5-language and 6-language audience cluster drove high link-click and landing-page-view volume but produced no meaningful lead volume.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Repeated Aquaverse India Daily Follows Likes / Broad Destination clones              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                A smaller capped follower budget plus lead/messaging campaigns              </strong>            </div>            <p>              These campaigns generated likes and engagement, but many had very low inline link clicks and limited lead volume. They should not absorb budget intended for ticket sales or qualified leads.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Traffic campaigns with strong landing page view volume              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Warm retargeting campaign for leads or purchases              </strong>            </div>            <p>              The account recorded 1,237,471 landing page views. Retargeting these users is the most practical next step for ticket sales and lead capture.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Winning creative lead-form test            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated lead campaign using the creative/message angles from &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot;, &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot;. Split by language/creative and optimize for leads.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads per ad set, then compare cost per lead and lead quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Messenger qualification flow test            </h3>            <p>              <strong>Setup:</strong>              Run a messaging campaign using the Start Your Day, Malayalam, and English India Show creatives. Test two flows: short ticket inquiry flow versus longer qualification flow.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, depth-3 and depth-5 sends, leads, and messaging block rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Landing page viewer retargeting            </h3>            <p>              <strong>Setup:</strong>              Build warm audiences from landing page viewers generated by &amp;quot;IN_AWR_General_Image_Claude_2026-06-14&amp;quot;, &amp;quot;Claude | IN | Daily 8 IMAGES MultiLang | 15Jun&amp;quot;, and other high-LPV campaigns. Serve ticket offer or lead capture ads.            </p>            <p>              <strong>Success metric:</strong>              Leads and purchases after reaching at least 3 results; do not judge purchase performance before 3 purchases.            </p>          </div>
