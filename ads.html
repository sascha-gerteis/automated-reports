 <span>Amount spent</span>        <strong>THB 15,734.84</strong>        <small>          2026-09-21          to          2026-10-20        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>988,400</strong>        <small>          1,747,044 impressions          ·          1.77 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>7,098</strong>        <small>          2.29% CTR          ·          THB 0.39 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>6</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 9.01</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account delivery is strong for awareness and engagement, with THB 15,734.84 spent generating 1,747,044 impressions, 988,400 reach, 148,286 page engagements, 118,052 video views, and 7,098 link clicks. However, the business goal is profitable ticket sales and qualified leads, and the supplied data shows no purchase events, no lead events, no revenue, and no ROAS. Traffic quality is uneven: only 651 landing page views from 7,098 link clicks, a 9.2% link-click-to-LPV rate. The strongest campaign for traffic quality is AQ Operator CBO | IN | Instagram Followers, while the account is currently over-weighted toward follower/engagement campaigns that cannot be judged on ticket sales.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Set up and prioritize sales or lead tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              The account goal is ticket sales and qualified leads, but there are 0 reported purchases, 0 reported leads, 0 conversion value, and 0 ROAS in the supplied data.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI and event setup for Lead, Purchase, and conversion value. Do not make profitability decisions until each key event has at least 3 results, per the minimum_results_before_decision.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              <strong>Why:</strong>              This is the strongest traffic-quality campaign: THB 3,395 spend, 3,011 link clicks, 595 landing page views, THB 1.13 per link click, THB 5.71 per landing page view, and a 19.8% link-click-to-LPV rate.            </p>            <p>              <strong>Do this:</strong>              Increase budget by 15-20% at a time and monitor landing page views, LPV cost, and link-click-to-LPV rate. Use this campaign&amp;#039;s best-performing ads as the base for a ticket sales or lead test.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              <strong>Why:</strong>              It spent THB 1,242.41 with the highest CPM at THB 98.16, highest CPC at THB 1.09, 0 inline link clicks, and 0 landing page views. For awareness/follower activity, its THB 1.38 cost per like is also worse than AQ_MU2025_Followers_IN at THB 0.89 per like.            </p>            <p>              <strong>Do this:</strong>              Pause the current version or rebuild it with a lower-cost audience/creative structure. Reallocate its budget to AQ Operator CBO or a new lead/purchase test.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Reduce traffic expectations from Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              <strong>Why:</strong>              It delivered cheap reach and clicks, but poor landing page quality: THB 6,058.26 spend, 4,070 link clicks, only 55 landing page views, THB 110.15 per LPV, and a 1.35% link-click-to-LPV rate.            </p>            <p>              <strong>Do this:</strong>              Keep only if the objective is low-cost reach/clicks/follower growth. Move 25-40% of its budget into AQ Operator CBO and a dedicated lead/purchase campaign.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN only as an awareness/follower campaign            </h3>            <p>              <strong>Why:</strong>              It generated strong engagement and follower-type activity with 58,969 page engagements, 5,666 likes, 42,505 video views, and THB 0.89 per like, but only 17 inline link clicks and 1 landing page view from THB 5,039.17 spend.            </p>            <p>              <strong>Do this:</strong>              Maintain or cap this campaign for community growth, but do not allocate sales-focused budget to it unless it is rebuilt with a traffic, lead, or purchase objective.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best traffic quality and strongest landing page delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,395 spend, 3,011 link clicks, 595 landing page views, THB 1.13 per link click, THB 5.71 per LPV, and 19.8% link-click-to-LPV rate. It also produced 73,527 video views at about THB 0.05 per video view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use its ads, placements, and audience setup as the starting point for ticket sales and lead generation campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness, engagement, and follower-type performance.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,039.17 spend generated 58,969 page engagements, 53,303 post engagements, 8,903 post reactions, 5,666 likes, 847 comments, and 42,505 video views. Cost per like is about THB 0.89.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only for awareness/community growth. Cap spend if the main priority is ticket sales or qualified leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient reach, impressions, and low-cost click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 6,058.26 spend delivered 1,047,072 impressions, 599,308 reach, THB 5.79 CPM, 20,776 clicks, and THB 0.29 CPC.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use for upper-funnel reach only. Do not rely on it for landing page traffic without rebuilding the objective, destination, or creative.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Weak efficiency versus other follower/awareness campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,242.41 spend, THB 98.16 CPM, THB 1.09 CPC, 0 inline link clicks, 0 landing page views, and 897 likes at about THB 1.38 per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild because the sample is not tiny and the campaign has enough follower results to judge awareness efficiency.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Large drop-off from link clicks to landing page views.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,070 link clicks produced only 55 landing page views, a 1.35% link-click-to-LPV rate, with THB 110.15 cost per LPV.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit destination URL, landing page load speed, placement quality, and whether the campaign objective is attracting low-intent clicks. Shift budget away until LPV quality improves.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Not suitable for traffic or sales evaluation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,039.17 spend produced only 17 inline link clicks and 1 landing page view, while most performance came from page engagement, likes, comments, and video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as an awareness/follower campaign. Rebuild separately if the goal is ticket sales or leads.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account overall            </h3>            <p>              Lead, messaging, and purchase performance cannot support sales decisions yet.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              0 lead events, 0 purchase events, 6 messaging conversations started, 5 messaging first replies, and 908 messaging blocks across THB 15,734.84 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not optimize the full account toward purchases or CPL until tracking is fixed and campaigns generate at least 3 purchase or lead results.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              Daily Follows has the highest CPM at THB 98.16 and 0 landing page views, while AQ Operator CBO has the best LPV cost at THB 5.71 and 595 landing page views.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                25-40% of Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers and a new dedicated lead/purchase campaign              </strong>            </div>            <p>              Aquaverse India | Instagram Followers drives cheap clicks but weak landing page quality, with only 55 LPVs from 4,070 link clicks. AQ Operator CBO converts clicks to LPVs much more efficiently.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Sales-focused budget currently sitting in AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New ticket sales or qualified lead campaign              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is working for followers and engagement, but produced only 1 landing page view and no leads or purchases.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Dedicated ticket sales or lead generation campaign            </h3>            <p>              <strong>Setup:</strong>              Launch a new campaign optimized for Purchase or Lead, not followers. Use the strongest creative/audience learnings from AQ Operator CBO | IN | Instagram Followers. Send traffic directly to the ticket or lead destination.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 leads or purchases. Track cost per lead, cost per purchase, and conversion rate from landing page view to lead/purchase.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Landing Page View optimization vs current follower/click delivery            </h3>            <p>              <strong>Setup:</strong>              Run the same creative and audience against a Landing Page View or traffic-quality objective, compared with the current follower-style setup.            </p>            <p>              <strong>Success metric:</strong>              Beat AQ Operator CBO&amp;#039;s current THB 5.71 cost per LPV or improve the account&amp;#039;s 9.2% link-click-to-LPV rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Messaging quality test            </h3>            <p>              <strong>Setup:</strong>              Create a click-to-message or instant-form test with qualifying questions, clear ticket/lead intent in the ad copy, and exclusions for users who block or do not reply.            </p>            <p>              <strong>Success metric:</strong>              At least 3 messaging conversations started, higher first-reply volume, and lower messaging blocks versus the account&amp;#039;s current 908 bloc
