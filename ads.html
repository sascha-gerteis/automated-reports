.cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-03        →        2026-09-01      </span>      <span class=&quot;pill&quot;>        24 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 127,335.87</strong>        <small>          2026-08-03          to          2026-09-01        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>11,911,478</strong>        <small>          21,827,458 impressions          ·          1.83 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>752</strong>        <small>          0.69% CTR          ·          THB 0.84 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 42,445.29 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>21</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 5.83</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent 127,335.87 THB and generated very large top-of-funnel reach and engagement: 21,827,458 impressions, 11,911,478 reach, 2,305,145 page engagements, and 2,147,281 video views. However, the account is not currently proving the stated business goal of profitable ticket sales and qualified leads: only 1 lead is reported, 21 messaging conversations started, and no purchase, revenue, or ROAS data is supplied. Performance is strongest for awareness, followers, and engagement; traffic, lead, messaging, and purchase performance need structural and tracking fixes before scaling.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild the lower-funnel structure for ticket sales and leads            </h3>            <p>              <strong>Why:</strong>              Nearly all spend is in followers, likes, visibility, and post engagement campaigns. Account-level purchase data is absent and only 1 lead is reported, which is below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Create dedicated lead and purchase campaigns instead of relying on Follows/Likes campaigns. Use ticket sales or qualified lead events as the optimization event, and do not make CPL or CPA decisions until each campaign has at least 3 results.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce the largest Broad Destination followers campaign            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination spent 44,079.68 THB, the largest campaign spend, but produced only 6 inline link clicks, 1 reported lead, 10 messaging starts, and a high cost per page like of 11.92 THB.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign materially and move budget into a dedicated lead or purchase test. Keep only a small maintenance budget if page likes remain a secondary objective.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep and carefully scale the strongest engagement assets            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN and New post engagement campaign are the clearest top-funnel performers, but neither proves purchase performance.            </p>            <p>              <strong>Do this:</strong>              Keep AQ_MU2025_Followers_IN for followers/engagement and test the winning post from New post engagement campaign in a traffic, lead, or purchase campaign.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Clean up duplicate and quarantined campaign structure            </h3>            <p>              <strong>Why:</strong>              Multiple campaigns share the same Broad Destination naming and several are marked ERROR QUARANTINED. This fragments budget and makes optimization decisions harder.            </p>            <p>              <strong>Do this:</strong>              Consolidate duplicate Broad Destination campaigns into one clean campaign per objective and rebuild active quarantined campaigns with clean names and clear objectives.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix conversion tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              No purchase, revenue, or ROAS data is supplied, and the same single lead appears under multiple lead-related action types.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI events, deduplicate lead events, confirm purchase tracking, and report outbound clicks or landing page views alongside Meta clicks.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strongest large-scale follower and engagement campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              31,583.91 THB spend generated 573,136 page engagements, 29,558 likes, 53,832 post reactions, 480,197 video views, 78,953 clicks, 4.63% CTR, and 0.40 THB CPC. Cost per page like was 1.07 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep. Carefully scale only if follower/page engagement remains a goal. Frequency is 4.11, so refresh creatives before increasing spend aggressively.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best efficient traffic-like and engagement performer among active campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              2,841.29 THB spend generated 512 inline link clicks, 406,149 page engagements, 380,417 video views, 24,857 post reactions, and 981,335 reach. Cost per inline link click was 5.55 THB and CPM was 2.27 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Reuse the winning post/creative in a dedicated traffic, lead, or purchase test instead of scaling only post engagement.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very efficient awareness and reach, but not traffic or lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              11,749.28 THB spend generated 17,310,877 impressions, 9,963,029 reach, 950,307 page engagements, and 938,302 video views at 0.68 THB CPM.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use only as an awareness or retargeting-pool builder. Do not rely on it for site traffic or leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families            </h3>            <p>              Small but valid engagement and messaging signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              2,790.63 THB spend generated 813 likes, 15,711 page engagements, 111 comments, 3 messaging conversations started, 5.06% CTR, and 3.43 THB cost per page like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep at controlled budget if Families is strategically important. Test this audience in a dedicated lead or messaging campaign before scaling.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Largest spend concentration is inefficient for followers, traffic, and lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign ID 120250948392580402 spent 44,079.68 THB but produced only 6 inline link clicks, 1 reported lead, 10 messaging conversations started, and 3,698 likes. Cost per inline link click was 7,346.61 THB and cost per page like was 11.92 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild. Do not judge the 1 lead yet because it is below the minimum of 3, but the follower and traffic metrics are weak enough to reallocate budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Duplicate campaign structure is fragmenting spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Multiple campaigns with the same name spent 61,996.81 THB combined across the 2026-08-02 Broad Destination variants, with only 8 inline link clicks combined and no reliable purchase data.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate duplicate Broad Destination campaigns into one clean followers/engagement campaign if needed, and move excess budget into lead or purchase testing.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Not suitable for traffic, lead, or sales objectives.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Despite 17,310,877 impressions and 11,749.28 THB spend, it generated only 2 inline link clicks and no reported leads or purchases. CTR was 0.036%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause this from any traffic or lead budget allocation. Keep only if the explicit goal is low-cost awareness.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Limited business-goal signal and higher delivery cost than stronger engagement campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,067.55 THB spend generated 13,899 impressions, 225 likes, 3,383 page engagements, 0 inline link clicks, and 0 messaging conversations. CPM was 76.81 THB and cost per page like was 4.74 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce unless Thailand awareness is a priority. If Thailand matters, rebuild as a clean test with clear lead, message, or ticket-sales objective.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New dedicated lead or purchase campaign              </strong>            </div>            <p>              The largest campaign spent 44,079.68 THB but generated only 6 inline link clicks and 1 lead, which is below the 3-result decision threshold.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate Broad Destination followers/likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                One consolidated Broad Destination engagement campaign plus lower-funnel tests              </strong>            </div>            <p>              The 2026-08-02 Broad Destination duplicates spent 61,996.81 THB combined and produced only 8 inline link clicks, indicating budget fragmentation and weak traffic output.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting audience creation or lower-funnel retargeting              </strong>            </div>            <p>              It is strong for cheap reach at 0.68 THB CPM but produced only 2 inline link clicks, so budget should not be treated as traffic or lead spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current low-performing follows/likes allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign              </strong>            </div>            <p>              New post engagement campaign produced 512 inline link clicks at 5.55 THB per inline link click and 406,149 page engagements from only 2,841.29 THB spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current awareness-only allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN with creative refresh              </strong>            </div>            <p>              AQ_MU2025_Followers_IN has proven scale for followers and engagement with 29,558 likes at 1.07 THB per page like, but frequency is already 4.11.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Dedicated ticket sales or lead conversion test            </h3>            <p>              <strong>Setup:</strong>              Launch a clean campaign optimized for purchase or lead events using budget reduced from Broad Destination followers campaigns. Use clear ticket or lead creative and send traffic to the ticket/lead destination.            </p>            <p>              <strong>Success metric:</strong>              Evaluate cost per purchase or cost per lead only after each campaign or ad set reaches at least 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Winning post engagement creative as traffic or conversion creative            </h3>            <p>              <strong>Setup:</strong>              Take the best-performing post from New post engagement campaign and test it in a traffic, lead, or purchase campaign instead of only post engagement.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, landing page views if available, leads, and purchases. Do not decide lead or purchase performance before 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Families audience lead or messaging test            </h3>            <p>              <strong>Setup:</strong>              Use Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families as the audience hypothesis and run a dedicated lead or click-to-message campaign with qualification questions.            </p>            <p>              <strong>Success metric:</strong>              Qualified messaging conversations, replies, leads, and cost per result after at least 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Retargeting from video viewers and engagers            </h3>            <p>              <strong>Setup:</strong>              Build retargeting audiences from AQ_MU2025_Followers_IN, New post engagement campaign, and the high-reach Young Adult Travellers campaign, then serve ticket/lead offers.            </p>            <p>              <strong>Success metric:</strong>              Leads or purchases from retargeting after at least 3 results, plus cost per result.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Consolidated followers campaign test            </h3>            <p>              <strong>Setup:</strong>              Combine duplicate Broad Destination followers campaigns into one clean campaign and test against AQ_MU2025_Followers_IN with separate budgets.            </p>            <p>              <strong>Success metric:</strong>              Cost per page like, page engagement, frequency, and video view volume.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase actions, purchase value, revenue, or ROAS data is supplied, so profitable ticket sales cannot be evaluated.</li><li>Only 1 lead is reported account-wide, below the minimum_results_before_decision of 3, so CPL decisions are not statistically supported.</li><li>The same single lead appears under multiple lead-related action types, including onsite_conversion.lead, lead, onsite_web_lead, onsite_conversion.lead_grouped, and offsite lead-related events. Lead event deduplication should be audited.</li><li>Account reports 151,615 total clicks but only 752 inline link clicks. Many campaigns show thousands of clicks with 0 inline link clicks, meaning reported CTR/CPC are mostly engagement clicks rather than site traffic.</li><li>Landing page views, outbound clicks, qualified leads, purchases, and ticket revenue are missing, limiting funnel diagnosis.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep AQ_MU2025_Followers_IN and New post engagement campaign for top-of-funnel, but do not continue scaling followers/likes as the main path to ticket sales. Reduce and rebuild the high-spend Broad Destination campaigns, clean up quarantined and duplicate structures, fix purchase and lead tracking, and reallocate budget into dedicated lead, messaging, retargeting, and purchase campaigns. Make lead or purchase decisions only after at least 3 results per campaign or ad set.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout campaigns    </h2>    <div class=&quot;insights&quot;>                <div class=&quot;insight&quot;>            <span>Highest CTR</span>            <strong>10.22% · ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily</strong>          </div>                  <div class=&quot;insight&quot;>            <span>Lowest CPC</span>            <strong>THB 0.40 · AQ_MU2025_Followers_IN</strong>          </div>                  <div class=&quot;insight&quot;>            <span>Most leads</span>            <strong>3 · Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination</strong>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Daily spend trend    </h2>    <div class=&quot;panel&quot;>            <div class=&quot;trend-row&quot;>        <div class=&quot;trend-date&quot;>          2026-08-03        <
