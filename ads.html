gin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-11        →        2026-08-09      </span>      <span class=&quot;pill&quot;>        79 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 678,233.49</strong>        <small>          2026-07-11          to          2026-08-09        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>47,338,235</strong>        <small>          93,195,709 impressions          ·          1.97 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,895,833</strong>        <small>          2.56% CTR          ·          THB 0.28 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>156</strong>        <small>          THB 4,347.65 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>1</strong>        <small>          THB 678,233.49 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1,119</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.28</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account delivered very large upper-funnel volume: THB 678,233.49 spend, 93,195,709 impressions, 1,895,833 link clicks, 828,924 landing page views, 52 leads, 1 purchase, and 1,119 messaging conversations started. Traffic and awareness are strong, but the account is heavily weighted toward clicks, engagement, follows, and visibility rather than ticket purchases or qualified leads. Purchase performance is insufficient to judge because only 1 purchase was recorded, below the minimum decision threshold of 3.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              Only a few campaigns produced 3+ leads, while large spend is concentrated in awareness, traffic, and follows campaigns with no lead or purchase volume.            </p>            <p>              <strong>Do this:</strong>              Increase budget carefully on &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot;, &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot;. Scale in small steps while monitoring leads and messaging quality.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce lower-funnel expectations from awareness and follows campaigns            </h3>            <p>              <strong>Why:</strong>              Many campaigns are driving reach, engagement, video views, or page likes, but not purchases or qualified leads.            </p>            <p>              <strong>Do this:</strong>              Keep awareness/follows campaigns only if their objective is brand visibility or follower growth. Do not evaluate them by purchases. Cap their share of budget until a separate lead or purchase funnel is built.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix attribution and landing page tracking before scaling purchase campaigns            </h3>            <p>              <strong>Why:</strong>              Daily data shows leads and messaging actions on 2026-07-17 to 2026-07-22 despite 0 spend, 0 impressions, and 0 clicks. Several campaigns also show very high link clicks but extremely low landing page views.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI events, landing page view firing, UTM consistency, attribution settings, and whether link clicks are going to website, Messenger, or another destination.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Consolidate duplicate follows campaigns            </h3>            <p>              <strong>Why:</strong>              There are many similar &amp;quot;Aquaverse India Daily Follows Likes&amp;quot; campaigns with overlapping naming, high CPMs, and very low inline link clicks.            </p>            <p>              <strong>Do this:</strong>              Group the best-performing follows audiences into fewer campaigns and reduce or stop duplicating Broad Destination variants unless follower growth is the specific goal.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best lower-funnel performer for leads and messaging.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 681.46 spend, 8 leads, 139 messaging conversations started, 104 messaging conversation replies, 986 link clicks. Cost per lead was THB 85.18 and cost per messaging conversation started was THB 4.90.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale. Test similar creative and post format with the same message flow.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging volume from a low spend base.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,893.12 spend, 16 leads, 351 messaging conversations started, 130 conversation replies, 14,204 link clicks. Cost per lead was THB 118.32.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Use Malayalam as a priority language for new lead and messaging tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong English-language lead and messaging campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,923.63 spend, 11 leads, 247 messaging conversations started, 223 conversation replies, 13,878 link clicks. Cost per lead was THB 174.88.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and increase budget gradually. Reuse the angle in new English creative variants.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Excellent traffic and landing page volume for an awareness/traffic role.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 8,531.70 spend, 294,162 link clicks, 152,677 landing page views, CTR 7.48%, CPC THB 0.028, CPM THB 2.13.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for traffic generation and retargeting pool building. Do not judge it by purchases because it is functioning as upper-funnel traffic.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Very efficient image traffic campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,670.76 spend, 166,091 link clicks, 85,971 landing page views, CTR 7.78%, CPC THB 0.028, CPM THB 2.14.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and use as a source audience for retargeting. Test lead-focused CTA versions of the best images.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Effective follower growth campaign if followers are a valid objective.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 26,042.41 spend, 21,884 page likes, 491,859 page engagements, CTR 4.60%. Cost per page like was THB 1.19.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as a follower-growth campaign. Do not allocate sales budget here unless followers are a required business KPI.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Large spend is producing traffic and video views but no recorded leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 113,691.97 spend, 346,361 link clicks, 136,374 landing page views, 4,384,509 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget if the goal is leads or ticket sales. Keep only a controlled awareness/traffic budget or rebuild with lead/purchase objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with no lower-funnel results recorded.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 54,499.93 spend, 169,803 link clicks, 70,261 landing page views, 2,017,761 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and reallocate part of the spend to campaigns with 3+ leads. Retest corporates with a direct lead form or enquiry CTA.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Good engagement volume but weak lead efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 9,790.74 spend, 1,322,594 post engagements, 1,237,897 video views, 3 leads. Cost per lead was THB 3,263.58.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only if engagement is the objective. If leads are the goal, rebuild using the best engaged post as a lead or messaging campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Automation Test Campaign            </h3>            <p>              Very weak traffic response.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 863.44 spend, 1,342,340 impressions, 543 link clicks, CTR 0.079%, CPC THB 0.816, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild or stop using it as a traffic/lead campaign. If it is only an internal test, exclude it from performance budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Hindi | 01 Splash to Stage | Traffic | 2026-06-13            </h3>            <p>              Underperforming traffic and messaging compared with other language campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 938.27 spend, 621 link clicks, CTR 0.72%, 2 messaging conversations started, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale. Replace the creative or test Hindi versions of the Malayalam and English India Show angles.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Hindi | 02 Squad Party Mode | Traffic | 2026-06-13            </h3>            <p>              Low lead output and expensive traffic relative to stronger campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,235.24 spend, 681 link clicks, CTR 1.06%, 7 messaging conversations started, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild creative and CTA before adding budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Follower activity is being bought at high CPM with almost no website traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 21,953.81 spend, CPM THB 51.54, 2,466 page likes, 4 inline link clicks, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce if the current goal is ticket sales or leads. If follower growth remains required, compare against cheaper follower campaigns before continuing.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19 and Claude | IN | Corporates | 5 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13, and Claude | IN | English | India Show 2025 | Traffic | 2026-06-13              </strong>            </div>            <p>              The two Corporates campaigns spent THB 168,191.90 with 0 leads and 0 purchases, while the three recommended campaigns produced 35 leads from THB 4,498.21 spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate Aquaverse India Daily Follows Likes Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN or a consolidated follows test              </strong>            </div>            <p>              AQ_MU2025_Followers_IN generated 21,884 page likes at THB 1.19 per like, while several Broad Destination follows campaigns show high CPMs and minimal link activity.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Hindi | 01 Splash to Stage | Traffic | 2026-06-13, Claude | IN | Hindi | 02 Squad Party Mode | Traffic | 2026-06-13, and Claude | IN | Hindi | 01 Splash to Stage | VIDEO Traffic | 13Jun              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | IN | Daily 8 IMAGES MultiLang | 15Jun and IN_AWR_General_Image_Claude_2026-06-14              </strong>            </div>            <p>              The image traffic campaigns delivered much stronger CTR and landing page volume, while the Hindi campaigns produced low lead volume and weaker traffic response.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                General awareness and visibility budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaigns built from 828,924 landing page views, 1,895,833 link clicks, and 1,119 messaging conversations started              </strong>            </div>            <p>              The account has a large engaged audience pool but only 52 leads and 1 purchase recorded. Retargeting is needed to convert upper-funnel volume into leads or sales.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead and messaging scale test            </h3>            <p>              <strong>Setup:</strong>              Duplicate or increase budgets gradually on &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot;, &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot;. Keep creative and audience changes controlled.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads per test cell, stable cost per lead versus current results, and sustained messaging replies.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Retargeting from traffic and engagement pools            </h3>            <p>              <strong>Setup:</strong>              Create retargeting audiences from landing page viewers, link clickers, video viewers, page engagers, and messaging starters. Test lead or purchase objective separately from awareness campaigns.            </p>            <p>              <strong>Success metric:</strong>              Minimum 3 leads or 3 purchases before making decisions. Judge lead campaigns by cost per lead and purchase campaigns by purchase volume.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Language creative replication test            </h3>            <p>              <strong>Setup:</strong>              Recreate the Malayalam and English India Show winning angles in Hindi, Tamil, Kannada, and Marathi with the same CTA and landing destination.            </p>            <p>              <strong>Success metric:</strong>              Compare leads, messaging conversations started, and landing page view rate after each language variant reaches at least 3 leads or sufficient traffic volume.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Landing page view optimization vs link click optimization            </h3>            <p>              <strong>Setup:</strong>              Run a controlled test using &amp;quot;IN_AWR_General_Image_Claude_2026-06-14&amp;quot; and &amp;quot;Claude | IN | Daily 8 IMAGES MultiLang | 15Jun&amp;quot; creatives, with one version optimized for link clicks and one for landing page views.            </p>            <p>              <strong>Success metric:</strong>              Higher landing page views and better landing page view to link click ratio.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Follower campaign consolidation test            </h3>            <p>              <strong>Setup:</strong>              Test &amp;quot;AQ_MU2025_Followers_IN&amp;quot; against one or two best foll
