: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-28        →        2026-10-27      </span>      <span class=&quot;pill&quot;>        6 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 18,668.86</strong>        <small>          2026-09-28          to          2026-10-27        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,201,926</strong>        <small>          2,321,646 impressions          ·          1.93 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>12,078</strong>        <small>          2.22% CTR          ·          THB 0.36 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>7</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 8.04</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated strong reach, engagement, video views, link clicks, and landing page views, but there are no reported purchases, ticket sales, leads, ROAS, or lead events, so profitability cannot be judged. Spend was 18,668.86 THB, producing 2,321,646 impressions, 51,553 clicks, 12,078 inline link clicks, and 2,949 landing page views. Traffic quality is uneven: &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; is the strongest traffic driver, while several follower/likes campaigns spend heavily without meaningful landing page traffic.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Protect and scale the best traffic campaign            </h3>            <p>              <strong>Why:</strong>              &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; generated 2,093 landing page views from only 483.08 THB spend, with 3,316 inline link clicks, 11.40% CTR, and 0.149 THB CPC.            </p>            <p>              <strong>Do this:</strong>              Carefully increase budget on &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; in small steps and monitor landing page views, cost per landing page view, and downstream ticket/lead actions.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on campaigns that are optimized for followers/likes but not ticket or lead intent            </h3>            <p>              <strong>Why:</strong>              &amp;#039;AQ_MU2025_Followers_IN&amp;#039; spent 4,612.23 THB but produced only 17 inline link clicks and 1 landing page view. &amp;#039;Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination&amp;#039; spent 1,066.56 THB with 0 inline link clicks.            </p>            <p>              <strong>Do this:</strong>              Reduce budgets on follower/likes campaigns unless follower growth is a separate business priority. Reallocate budget toward campaigns producing landing page views.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix conversion tracking before judging profitable ticket sales            </h3>            <p>              <strong>Why:</strong>              No purchases, purchase value, leads, cost per purchase, cost per lead, or ROAS are reported. The business goal is profitable ticket sales and qualified leads, but the data only shows traffic, engagement, page likes, video views, and limited messaging activity.            </p>            <p>              <strong>Do this:</strong>              Implement or verify Pixel/CAPI events for ticket purchase, initiate checkout, lead, and qualified lead. Add UTMs to all ads and confirm landing page view to purchase/lead tracking.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate awareness, traffic, and lead/messaging campaigns            </h3>            <p>              <strong>Why:</strong>              Most spend is in Instagram followers or likes campaigns, but the business goal is ticket sales and qualified leads. Current campaign objectives appear misaligned with final outcomes.            </p>            <p>              <strong>Do this:</strong>              Keep follower/engagement campaigns on limited awareness budgets and create dedicated traffic, lead, messaging, and purchase campaigns with separate budgets and KPIs.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              Best traffic and landing page view performance in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              483.08 THB spend, 28,387 impressions, 3,237 clicks, 3,316 inline link clicks, 2,093 landing page views, 11.40% CTR, 0.149 THB CPC, and approximately 0.23 THB per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this campaign as the benchmark for traffic quality and test its creative, audience, and landing page setup in a conversion-focused structure.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Strong awareness, video view, engagement, and decent landing page volume at scale.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              5,402.16 THB spend, 1,019,701 impressions, 494,831 reach, 139,964 video views, 146,959 post engagements, 4,479 inline link clicks, 809 landing page views, 5.30 THB CPM, and approximately 6.68 THB per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for awareness and retargeting pool building. Do not judge it by purchases because no purchase data is reported. Consider testing a traffic or conversion version using the same best-performing assets.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Effective for follower/page-like style engagement, but not for traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,612.23 THB spend, 61,898 page engagements, 5,840 likes, 9,512 post reactions, and 848 comments, but only 17 inline link clicks and 1 landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower/page growth is a defined secondary goal. Cap budget and do not use this campaign as a ticket sales or lead generation driver.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Produces low-cost reach and clicks, but landing page quality is weak.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              6,557.10 THB spend, 1,119,049 impressions, 617,616 reach, 23,459 clicks, 4,250 inline link clicks, 0.280 THB CPC, and 5.86 THB CPM, but only 58 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as a low-cost reach/clicks source if needed, but rebuild destination and objective before allocating serious ticket or lead budget.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Poor traffic quality despite strong engagement.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,612.23 THB spend produced 17 inline link clicks and 1 landing page view. Cost per landing page view is 4,612.23 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget if the goal is ticket sales or qualified leads. Rebuild with a traffic, lead, or purchase objective rather than relying on follower engagement.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              High delivery cost and no link traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,066.56 THB spend, 10,718 impressions, 99.51 THB CPM, 1.114 THB CPC, 957 clicks, 0 inline link clicks, and 0 landing page views reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. If the objective is page likes, compare only against page-like performance; if the objective is traffic, this setup is not working.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy            </h3>            <p>              High CPM/CPC and almost no traffic outcome.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              548.10 THB spend, 6,862 impressions, 79.87 THB CPM, 0.880 THB CPC, 623 clicks, only 1 inline link click, and no landing page views reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild before further scaling. Do not use this campaign for ticket or lead goals in its current form.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Large spend with weak landing page view rate.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              6,557.10 THB spend, 4,250 inline link clicks, but only 58 landing page views. This is a very large drop-off from link click to landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit destination, load speed, click quality, placement mix, and objective. Rebuild a traffic/landing page view version before increasing spend.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Messaging quality appears weak despite strong awareness volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              713 messaging blocks, 3 messaging conversations started, and 2 messaging first replies from 5,402.16 THB spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not optimize this campaign for messaging. If messaging leads are important, build a dedicated messaging campaign with qualifying prompts and exclude users who block or do not reply.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy              </strong>            </div>            <p>              &amp;#039;AQ_MU2025_Followers_IN&amp;#039; spent 4,612.23 THB for only 1 landing page view, while &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; produced 2,093 landing page views from 483.08 THB.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination and Broad Destination - Copy              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Traffic or landing-page-view campaigns using the best-performing &amp;#039;World&amp;#039;s Beauties&amp;#039; setup              </strong>            </div>            <p>              The two Daily Follows Likes campaigns spent 1,614.66 THB combined and produced only 1 inline link click and no meaningful landing page traffic.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers and new conversion/traffic test              </strong>            </div>            <p>              &amp;#039;Aquaverse India | Instagram Followers | 2026-09-27&amp;#039; has cheap reach and clicks but only 58 landing page views from 4,250 inline link clicks. &amp;#039;AQ Operator CBO | IN | Instagram Followers&amp;#039; has 809 landing page views and strong awareness scale.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated purchase, lead, and traffic campaigns              </strong>            </div>            <p>              The account goal is profitable ticket sales and qualified leads, but current spend is concentrated in follower/likes campaigns with no reported purchase or lead events.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing Page View scale test for World&amp;#039;s Beauties            </h3>            <p>              <strong>Setup:</strong>              Duplicate &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; into a controlled traffic campaign optimized for landing page views. Increase budget gradually and keep the original campaign active as the control.            </p>            <p>              <strong>Success metric:</strong>              Maintain strong landing page view volume and cost per landing page view while increasing spend; also monitor whether tracked leads or purchases appear once tracking is fixed.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Purchase or ticket sales conversion campaign            </h3>            <p>              <strong>Setup:</strong>              Create a new campaign optimized for the ticket purchase event once Pixel/CAPI purchase tracking is confirmed. Use the best creative/destination from &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; and retarget users from landing page views, video views, and engagers.            </p>            <p>              <strong>Success metric:</strong>              At least 3 purchase results before making budget decisions, per the supplied minimum_results_before_decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Lead generation campaign            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated lead campaign using instant forms or website lead forms. Include qualifying questions related to ticket intent or visit timing.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads before deciding. Judge by cost per qualified lead once lead quality data is available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Launch a separate messaging campaign with a structured opening question and quick replies. Exclude users who previously blocked messages where possible.            </p>            <p>              <strong>Success metric:</strong>              At least 3 messaging conversations started and first replies before optimization decisions; monitor blocks because the account recorded 1,224 messaging blocks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Follower campaign budget cap test            </h3>            <p>              <strong>Setup:</strong>              Keep &amp;#039;AQ_MU2025_Followers_IN&amp;#039; at a capped awareness/follower budget and compare it against &amp;#039;Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination&amp;#039; for cost per like and page engagement.            </p>            <p>              <strong>Success metric:</strong>              Use cost per like and cost per page engagement only, not purchases, because these campaigns are not currently producing purchase data.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events, purchase value, ROAS, leads, qualified leads, or ticket sales are reported, so profitability cannot be evaluated.</li><li>Targets for cost per lead, cost per purchase, and ROAS are all 0, meaning targets are unknown and should not be used for comparison.</li><li>There is a major link click to landing page view gap in some campaigns, especially &amp;#039;Aquaverse India | Instagram Followers | 2026-09-27&amp;#039; with 4,250 inline link clicks but only 58 landing page views.</li><li>Messaging data shows 1,224 messaging blocks but only 7 messaging conversations started and 6 first replies at account level, indicating either poor message intent, poor setup, or a tracking/objective mismatch.</li><li>The campaign data does not show revenue or conversion value, so budget recommendations are based on traffic, engagement, landing page views, and messaging actions only.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Shift the account away from follower/likes-heavy spending and toward measurable ticket sales and lead generation. Keep &amp;#039;India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy&amp;#039; as the main traffic winner and carefully scale it. Keep &amp;#039;AQ Operator CBO | IN | Instagram Followers&amp;#039; for awareness and retargeting pool building. Reduce or rebuild &amp;#039;AQ_MU2025_Followers_IN&amp;#039;, &amp;#039;Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination&amp;#039;, and its copy if the primary objective is ticket sales or leads. Before judging profitability, fix purchase, lead, and value tracking.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout campaigns    </h2>    <div class=&quot;insights&
