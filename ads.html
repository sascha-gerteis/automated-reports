border-top: 4px solid #f59e0b;  }  .priority-low {    border-top: 4px solid #16a34a;  }  .finding-grid {    display: grid;    grid-template-columns: repeat(2, minmax(0, 1fr));    gap: 14px;  }  .finding {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .finding.positive {    border-left: 5px solid #16a34a;  }  .finding.negative {    border-left: 5px solid #dc2626;  }  .finding h3 {    margin: 0 0 8px;    font-size: 16px;  }  .finding p {    margin: 0 0 10px;    color: #526077;  }  .evidence,  .recommendation {    font-size: 13px;    margin-top: 7px;    color: #445168;  }  .budget-row {    display: grid;    grid-template-columns: 1fr 40px 1fr;    gap: 12px;    align-items: center;    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-09        →        2026-08-07      </span>      <span class=&quot;pill&quot;>        84 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 847,098.02</strong>        <small>          2026-07-09          to          2026-08-07        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>53,535,434</strong>        <small>          114,566,101 impressions          ·          2.14 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>2,577,352</strong>        <small>          2.76% CTR          ·          THB 0.27 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>186</strong>        <small>          THB 4,554.29 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>1</strong>        <small>          THB 847,098.02 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1,447</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.39</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated very large reach and traffic: 114,566,101 impressions, 2,577,352 link clicks, 1,094,874 landing page views, and THB 847,098.02 spend. However, bottom-funnel output is limited: 62 leads and only 1 purchase. Because cost-per-lead, cost-per-purchase, and ROAS targets are unknown, performance cannot be judged against profitability targets. The clearest opportunity is to reduce spend from high-volume traffic/follow campaigns that produced no leads and rebuild budget around the campaigns and posts that actually generated leads or meaningful messaging conversations.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead and messaging drivers            </h3>            <p>              <strong>Why:</strong>              A small group of campaigns produced most qualified actions at much lower cost than the account average. For example, &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot; generated 9 leads from THB 1,054.68 spend, while &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot; generated 20 leads from THB 2,505.93.            </p>            <p>              <strong>Do this:</strong>              Create a dedicated lead or messaging campaign using the winning post/creative from &amp;quot;Post: \&amp;quot;💦 Start your day with excitement and end it with...\&amp;quot;&amp;quot;, &amp;quot;Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13&amp;quot;, and &amp;quot;Claude | IN | English | India Show 2025 | Traffic | 2026-06-13&amp;quot;. Start with controlled budget increases of 20-30% and judge after each campaign reaches at least 3 leads.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce high-spend traffic campaigns that produced no leads            </h3>            <p>              <strong>Why:</strong>              Several campaigns consumed large budget and generated high link-click/LPV volume but no leads or purchases. The biggest examples are &amp;quot;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;quot; with THB 146,688.36 spend, 452,813 link clicks, 169,122 landing page views, and 0 leads, and &amp;quot;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;quot; with THB 70,749.68 spend, 222,455 link clicks, 89,391 landing page views, and 0 leads.            </p>            <p>              <strong>Do this:</strong>              Reduce these high-spend traffic campaigns to a limited top-funnel/retargeting role and reallocate budget into lead/messaging campaigns. Do not judge them by purchases alone, but do not keep them at current budget if the goal is ticket sales and qualified leads.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate follower/engagement budget from lead and sales budget            </h3>            <p>              <strong>Why:</strong>              Follower campaigns are creating engagement and page likes, but they are not driving meaningful link clicks or leads. For example, &amp;quot;Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers&amp;quot; spent THB 16,466.76 and reached 13,712,143 people at CPM 0.666179, but generated only 2 link clicks and 0 leads.            </p>            <p>              <strong>Do this:</strong>              Keep follower campaigns only if page growth is a separate KPI. If the priority is leads/ticket sales, cap or reduce follower/visibility campaigns and move budget into lead, messaging, and retargeting campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix attribution and reporting inconsistencies before scaling            </h3>            <p>              <strong>Why:</strong>              Daily data shows reported leads, messaging actions, and landing page views on 2026-07-17 to 2026-07-22 despite 0 impressions, 0 clicks, and 0 spend. Some campaigns also show very high link clicks but extremely low landing page views, such as &amp;quot;Claude | IN | English | Water Park &amp;amp; Interview | Traffic | 2026-06-13&amp;quot; with 15,311 link clicks but only 55 landing page views.            </p>            <p>              <strong>Do this:</strong>              Audit pixel/CAPI deduplication, event timing, UTMs, landing page load tracking, and reporting windows. Confirm whether leads are being attributed after spend stopped or from offline/CRM uploads.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best clear lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,054.68 spend, 9 leads, 201 messaging conversations started, 159 messaging replies, 1,460 link clicks, CTR 5.215728.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use the same post/creative in a dedicated lead or messaging campaign and increase budget gradually after each 3+ lead sample.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strongest campaign-level lead volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,505.93 spend, 20 leads, 466 messaging conversations started, 218 messaging replies, 19,049 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Prioritize Malayalam creative and audience structure in the next lead/messaging test.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong qualified action performer across leads and messaging.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,531.36 spend, 15 leads, 310 messaging conversations started, 277 messaging replies, 18,270 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Test this angle as a conversion-focused lead or messaging campaign instead of only traffic.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Very efficient awareness/traffic generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 11,464.43 spend, 5,426,616 impressions, 398,904 link clicks, 207,050 landing page views, CTR 7.48214, CPC 0.028236.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for top-funnel traffic and retargeting pool creation, but pair it with a retargeting campaign because it produced no leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Very efficient traffic and landing page view campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 6,129.07 spend, 218,354 link clicks, 113,428 landing page views, CTR 7.739889, CPC 0.02752.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a low-cost traffic source if retargeting is active. Do not scale for leads until downstream lead conversion improves.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Effective follower/page engagement campaign when judged by follower-type outcomes, not purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 27,075.60 spend, 21,809 page likes, 54,266 post reactions, 520,819 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth is a defined KPI. Do not use it as a primary ticket-sales or lead campaign.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Large budget is generating traffic and video engagement but no leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 146,688.36 spend, 452,813 link clicks, 169,122 landing page views, 5,846,859 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget materially and rebuild as either a dedicated lead/messaging campaign or a lower-budget retargeting/audience-building campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with no lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 70,749.68 spend, 222,455 link clicks, 89,391 landing page views, 2,684,363 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Keep only a small traffic budget if corporates are strategically important, and test a lead form or messaging CTA.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Traffic volume did not translate into leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 39,911.22 spend, 108,406 link clicks, 54,845 landing page views, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and replace with a lead/messaging test using the winning Malayalam and English India Show creative approach.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              Traffic volume did not translate into leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 37,649.04 spend, 132,451 link clicks, 58,864 landing page views, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce current traffic budget and retest this segment with a stronger lead or ticket-sales CTA.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19            </h3>            <p>              High traffic but no lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 37,298.40 spend, 180,876 link clicks, 85,988 landing page views, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as top-funnel if needed; otherwise reallocate budget to proven lead-producing campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Works for engagement but is inefficient for leads compared with the best campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 11,059.62 spend, 1,486,983 post engagements, 3 leads, CTR 0.149101.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only if post engagement is the objective. For lead generation, rebuild using lead/messaging optimization and stronger CTA.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Follower/engagement activity is not translating into link traffic or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 13,619.38 spend, 261,102 impressions, 1,751 page likes, only 2 link clicks, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce if the goal is ticket sales or leads. Keep only if page-like growth is explicitly required.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Strong cheap reach but not a traffic or lead driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,466.76 spend, 24,718,237 impressions, reach 13,712,143, CPM 0.666179, only 2 link clicks, 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Use as awareness only. Do not allocate performance budget here unless the KPI is reach/visibility.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Corporates | 6 Languages | 2026-06-19 and Claude | IN | Corporates | 5 Languages | 2026-06-19              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Lead/messaging campaign using Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13, and Claude | IN | English | India Show 2025 | Traffic | 2026-06-13              </strong>            </div>            <p>              The two Corporates campaigns spent THB 217,438.04 combined with 0 leads, while the recommended lead/messaging assets produced 44 combined leads from THB 6,091.97 spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | IN | Couples/Families/Singles/Party Goers | 6 Languages | 2026-06-19 traffic campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaign for landing page viewers and engaged users from IN_AWR_General_Image_Claude_2026-06-14 and Claude | IN | Daily 8 IMAGES MultiLang | 15Jun              </strong>            </div>            <p>              The 6-language audience campaigns spent heavily and produced strong traffic but no leads; traffic winners created large landing-page-view pools that should be pushed to lead or ticket intent.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes and Pa
