t;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from follower-only delivery into lead or purchase-focused testing            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN spent THB 18,891.88, 83% of total spend, but produced only 61 inline link clicks and no tracked leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce AQ_MU2025_Followers_IN to a maintenance budget and launch dedicated Lead or Sales campaigns once tracking is confirmed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix conversion and lead tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              There are no purchase or lead actions in the supplied data, and targets are unknown. Profitability cannot be assessed.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI, standard Lead and Purchase events, ticket checkout events, UTMs, and attribution before scaling lower-funnel campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Pause or rebuild the ERROR QUARANTINED duplicate campaigns            </h3>            <p>              <strong>Why:</strong>              The five ERROR QUARANTINED campaigns spent THB 1,475.23 combined with 0 inline link clicks, higher CPCs between THB 0.88 and THB 1.10, and higher CPMs between THB 32.27 and THB 36.73.            </p>            <p>              <strong>Do this:</strong>              Stop these duplicate quarantined campaigns and rebuild into one clean campaign if follower growth is still required.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate landing page and messaging quality from Instagram Followers campaign            </h3>            <p>              <strong>Why:</strong>              Aquaverse India | Instagram Followers | 2026-09-27 generated 1,149 inline link clicks but only 23 landing page views, plus 158 messaging blocks and only 1 messaging conversation.            </p>            <p>              <strong>Do this:</strong>              Check destination URL, page load speed, in-app browser behavior, CTA accuracy, and messaging automation before increasing spend.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness and engagement delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 18,891.88 spend produced 1,132,416 impressions, 272,699 reach, 300,243 page engagements, 17,710 likes, 25,276 post reactions, 2,411 comments, and 252,021 video views. CPC was THB 0.46 and CTR was 3.61%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an awareness/follower campaign only, but reduce budget if ticket sales and qualified leads are the priority.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Best campaign for traffic volume and low media cost.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,540.35 spend produced 275,439 impressions, 210,145 reach, 5,428 clicks, 1,149 inline link clicks, CPC of THB 0.28, and CPM of THB 5.59.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully keep testing for traffic, but do not scale until the landing page view gap is fixed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              High click engagement from a small but sufficient sample.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 800.14 spend produced 714 clicks, 567 likes, 348 post reactions, 90 comments, 2,224 page engagements, and CTR of 9.29%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep capped or carefully scale only if CPM improves; CPM is high at THB 104.12.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Not suitable as the main budget holder for ticket sales or lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              It consumed THB 18,891.88 of THB 22,707.60 total spend but produced only 61 inline link clicks and no tracked leads or purchases. Frequency was also the highest major campaign at 4.15.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and reallocate spend toward campaigns optimized for Lead, Landing Page View, or Purchase once tracking is verified.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Duplicate quarantined campaigns are inefficient versus the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across five duplicate entries, combined spend was THB 1,475.23 with 0 inline link clicks, 9,441 page engagements, 274 likes, and higher CPMs around THB 32.27 to THB 36.73 versus THB 16.68 for AQ_MU2025_Followers_IN.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild these campaigns into one clean structure; do not keep fragmented quarantined duplicates active.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality or tracking appears weak.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong> nals, not tracked sales or leads.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN or a rebuilt single follower campaign              </strong>            </div>            <p>              The quarantined duplicates produced 0 inline link clicks and higher CPM/CPC than the main follower campaign.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27 or a landing-page-view test              </strong>            </div>            <p>              The 2026-09-26 campaign has strong CTR at 9.29% but very high CPM at THB 104.12, while the Instagram Followers campaign has much lower CPM at THB 5.59 and lower CPC at THB 0.28.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated Lead eative and audience setup.            </p>            <p>              <strong>Success metric:</strong>              Compare cost per like, CPM, CPC, and page engagement volume against AQ_MU2025_Followers_IN.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Messaging quality test            </h3>            <p>              <strong>Setup:</strong>              Run a small messaging campaign with corrected CTA, welcome message, and qualification prompts.            </p>            <p>              <strong>Success metric:</strong>              Evaluate conversation starts and first replies only after at least 3 messaging conversations.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase or lead actions are present, so profitable ticket sales and qualified lead performance cannot be assessed.</li><li>Aquaverse India | Instagram Followers | 2026-09-27 shows 1,149 inline link clicks but only 23 landing page views, indicating a destination, loading, tracking, or click-quality issue.</li><li>Messaging data is not decision-ready: 158 messaging blocks but only 1 messaging conversation started and 1 first reply.</li><li>Daily data has no rows for 2026-09-22 and 2026-09-23; confirm whether delivery was intentionally off or reporting is incomplete.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep awareness activity but reduce its share of budget. Pause or rebuild the ERROR QUARANTINED duplicates, keep AQ_MU202
