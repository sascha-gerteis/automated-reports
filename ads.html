    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-10        →        2026-10-09      </span>      <span class=&quot;pill&quot;>        3 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 19,487.95</strong>        <small>          2026-09-10          to          2026-10-09        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>729,359</strong>        <small>          1,654,919 impressions          ·          2.27 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>3,463</strong>        <small>          2.85% CTR          ·          THB 0.41 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 11.78</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement volume is strong, with THB 19,487.95 generating 1,654,919 impressions, 729,359 reach, 188,961 post engagements, 158,624 video views, and 13,804 page likes. However, the account is not currently proving progress toward profitable ticket sales or qualified leads: no leads, purchases, ROAS, or purchase value are reported. Traffic quality/tracking is also a major issue, with only 48 landing page views from 3,463 inline link clicks.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix ticket-sale and lead tracking before scaling lower-funnel spend            </h3>            <p>              <strong>Why:</strong>              The account reports no leads or purchases, and only 48 landing page views from 3,463 inline link clicks, which prevents reliable lead, purchase, or ROAS evaluation.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI events, confirm PageView, Landing Page View, Lead, InitiateCheckout, and Purchase events fire correctly, and add UTMs to all ads before judging ticket-sales performance.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce reliance on follower/likes campaigns for the main business goal            </h3>            <p>              <strong>Why:</strong>              Most spend is going to follower/engagement activity, especially AQ_MU2025_Followers_IN with THB 13,299.68 spend, but the account has no reported leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep follower campaigns active at a reduced awareness budget, and reallocate part of spend into a dedicated lead or sales campaign once tracking is verified.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate poor click-to-landing-page conversion            </h3>            <p>              <strong>Why:</strong>              Aquaverse India | Instagram Followers | 2026-09-27 generated 3,425 inline link clicks but only 48 landing page views, a very low click-to-LPV rate.            </p>            <p>              <strong>Do this:</strong>              Check destination URL speed, in-app browser behavior, broken redirects, pixel placement, consent settings, and whether clicks are going to Instagram/profile actions instead of the website.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild messaging flow before investing more in message outcomes            </h3>            <p>              <strong>Why:</strong>              The account recorded 409 messaging blocks, only 4 total messaging connections, and 2 messaging conversations started. Conversation-started volume is below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Review the message CTA, automated greeting, qualification questions, and audience intent. Run a clean click-to-message test only after fixing the block-to-connection issue.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Limit high-CPM follower test spend            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination has CPM THB 98.16 versus account CPM THB 11.78 and produced 0 inline link clicks.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign unless its sole objective is page likes. Rebuild with new creative/audience structure if continued.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness and engagement delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 13,299.68 spend produced 179,664 post engagements, 156,566 video views, 12,907 likes, 18,995 post reactions, and 1,893 comments. Cost per page like is approximately THB 1.03 and cost per post engagement is approximately THB 0.07.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for awareness/follower growth, but do not treat it as a ticket-sales campaign. Monitor frequency, which is 3.65, and refresh creative before scaling.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Best campaign for low-cost reach and link-click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,945.86 spend generated 523,071 reach, 894,160 impressions, CPM THB 5.53, CPC THB 0.29, 16,785 clicks, and 3,425 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep cautiously if the objective is reach or traffic, but do not scale until the landing page view issue is fixed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Can generate page likes, but at a higher media cost than the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,242.41 spend produced 897 likes, 3,628 page engagements, and 511 post reactions. Cost per like is approximately THB 1.38.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as a small follower-growth test if follower quality is valuable; otherwise reduce and rebuild.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Account-wide            </h3>            <p>              Lead and purchase performance cannot be validated.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              No lead actions, purchase actions, purchase value, or ROAS are reported during the period despite THB 19,487.95 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make profitability claims from this data. Fix tracking and launch dedicated lead/sales campaigns separate from follower campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality or tracking is weak.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              3,425 inline link clicks generated only 48 landing page views. The campaign also recorded 409 messaging blocks, 4 total messaging connections, and 2 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit destination and event tracking before increasing spend. If tracking is correct, rebuild the landing experience and traffic intent.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Too much budget is concentrated in an upper-funnel campaign relative to the business goal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              This campaign spent THB 13,299.68, about 68% of total account spend, but generated only 38 inline link clicks and no reported leads or purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and keep it as an awareness/follower campaign only. Move incremental budget toward verified lead or sales campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Expensive delivery with no traffic output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CPM is THB 98.16, CPC is THB 1.09, spend is THB 1,242.41, and inline link clicks are 0.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Do not scale this structure unless page likes are the only objective.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New verified lead or sales campaign              </strong>            </div>            <p>              AQ_MU2025_Followers_IN uses the largest budget share at THB 13,299.68 and performs well for awareness, but it produced only 38 inline link clicks and no reported leads or purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN only if follower growth remains a priority, or to a rebuilt conversion/lead test              </strong>            </div>            <p>              The Broad Destination campaign has the highest CPM at THB 98.16 and 0 inline link clicks, while AQ_MU2025_Followers_IN has stronger engagement efficiency.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Split budget by funnel: awareness/followers, traffic validation, lead/sales conversion              </strong>            </div>            <p>              Current results show strong awareness but insufficient lower-funnel measurement. Separate campaigns are needed so awareness, traffic, messaging, leads, and purchases are judged by the correct metrics.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing page view validation test            </h3>            <p>              <strong>Setup:</strong>              Run a small traffic campaign using the same destination URL with UTMs and confirmed Pixel/CAPI events. Compare inline link clicks to landing page views daily.            </p>            <p>              <strong>Success metric:</strong>              Landing page views should track consistently against link clicks; if LPVs remain very low, the issue is destination quality or event tracking.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Lead campaign test            </h3>            <p>              <strong>Setup:</strong>              After tracking is fixed, launch a dedicated lead campaign separate from follower campaigns using a simple inquiry form or qualified lead event.            </p>            <p>              <strong>Success metric:</strong>              Judge only after at least 3 leads, respecting the minimum_results_before_decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Ticket-sales campaign test            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated sales campaign optimized to Purchase if purchase tracking works, or to a higher-volume event such as InitiateCheckout if Purchase has insufficient volume.            </p>            <p>              <strong>Success metric:</strong>              Evaluate cost per purchase or cost per checkout only after at least 3 tracked results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Run a click-to-message campaign with revised opening copy, clear ticket/lead intent, and a short automated qualification flow.            </p>            <p>              <strong>Success metric:</strong>              Use total messaging connections and qualified replies as the primary metrics; do not judge conversation-started performance until at least 3 results are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot
