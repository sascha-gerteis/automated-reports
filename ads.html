tion>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 17,120.25</strong>        <small>          2026-09-24          to          2026-10-23        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,085,773</strong>        <small>          2,005,995 impressions          ·          1.85 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>7,963</strong>        <small>          2.21% CTR          ·          THB 0.39 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>6</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 8.53</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated broad reach and engagement with THB 17,120.25 spend, 2,005,995 impressions, 1,085,773 reach, 7,963 link clicks, and 774 landing page views. However, no lead, purchase, purchase value, or ROAS actions were reported, so profitability cannot be evaluated. The strongest traffic quality is from AQ Operator CBO | IN | Instagram Followers, which produced 716 of 774 landing page views from only THB 4,366.80 spend. Most other spend is concentrated in follower/engagement campaigns that are not directly proving ticket sales or qualified leads.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift traffic-focused budget toward AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              <strong>Why:</strong>              This campaign produced 716 landing page views, representing 92.5% of all account landing page views, at THB 6.10 per landing page view.            </p>            <p>              <strong>Do this:</strong>              Carefully increase budget on AQ Operator CBO | IN | Instagram Followers by 15-20% and monitor landing page view cost, link click volume, and frequency before further increases.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              <strong>Why:</strong>              It generated the most link clicks at 4,199, but only 57 landing page views, meaning only 1.36% of link clicks became landing page views.            </p>            <p>              <strong>Do this:</strong>              Do not scale this campaign for ticket or lead goals. Rebuild it as a landing page view, lead, or purchase campaign once tracking is confirmed, using the same audience only as a test.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Limit AQ_MU2025_Followers_IN to follower or page-growth objectives only            </h3>            <p>              <strong>Why:</strong>              It spent THB 5,157.69 and produced 6,017 page likes and 61,822 page engagements, but only 16 link clicks and 1 landing page view.            </p>            <p>              <strong>Do this:</strong>              Keep only if page growth is a priority. If the current goal is ticket sales or qualified leads, reduce its allocation and move budget to landing-page or conversion-focused activity.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              <strong>Why:</strong>              This campaign has the highest CPM at THB 98.16, spent THB 1,242.41, generated 897 likes, and produced 0 inline link clicks.            </p>            <p>              <strong>Do this:</strong>              Reduce or pause after a replacement is live. Relaunch with clearer follow/page-like objective or move the budget to AQ Operator CBO | IN | Instagram Followers if traffic is the priority.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix lead and purchase tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              The supplied data contains no leads, purchases, purchase value, or ROAS despite the business goal being profitable ticket sales and qualified leads.            </p>            <p>              <strong>Do this:</strong>              Verify Meta Pixel/CAPI events for Lead, Purchase, InitiateCheckout, and value tracking before making profitability decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best campaign for traffic quality and on-site visits.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,366.80 spend, 3,748 link clicks, 716 landing page views, THB 1.17 per link click, THB 6.10 per landing page view, and 19.10% landing page view rate from link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this campaign&amp;#039;s audience, creative, and placement mix as the base for dedicated ticket-sale or lead-generation testing.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Strong awareness and engagement efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              109,135 post engagements and 103,496 video views from THB 4,366.80 spend, with CPM of THB 5.75.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Retarget video viewers and post engagers with a ticket or lead offer once tracking is working.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong for page growth and social engagement.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              6,017 page likes, 61,822 page engagements, 9,603 post reactions, and 908 comments from THB 5,157.69 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as an awareness or follower-growth campaign. Do not judge it by purchases because it is not generating meaningful website traffic.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient at generating link clicks.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,199 link clicks from THB 6,353.35 spend, equal to THB 1.51 per link click, with low CPM of THB 5.79.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use learnings cautiously, but rebuild for landing page views or conversions because post-click quality is weak.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              High link-click volume is not translating into landing page visits.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,199 link clicks but only 57 landing page views, with THB 111.46 cost per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild with a landing page view, lead, or purchase objective; check destination URL, load speed, placement quality, and accidental click sources.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Poor fit for ticket-sales or lead-generation goals.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,157.69 spend produced only 16 link clicks and 1 landing page view, despite strong page engagement.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce if the main objective is sales or leads. Keep only if page likes and community engagement are a separate KPI.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Most expensive reach and weak traffic contribution.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Highest CPM at THB 98.16, THB 1.09 CPC, 897 likes, and 0 inline link clicks from THB 1,242.41 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild or reduce. Do not allocate more budget unless the sole goal is page-like growth.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide messaging performance            </h3>            <p>              Messaging is not currently proving qualified lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Only 6 messaging conversations started, 1 conversation replied, and 1,106 messaging blocks across THB 17,120.25 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale messaging until the flow, destination, and qualification process are reviewed. Campaign-level messaging data is also limited, with only Aquaverse India | Instagram Followers | 2026-09-27 reaching the minimum decision threshold of 3 conversations started.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide purchase and lead performance            </h3>            <p>              No measurable sales or lead outcomes are available.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The dataset contains 0 reported lead actions, 0 purchase actions, 0 purchase value, and no ROAS.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make profitability decisions until lead and purchase tracking is active and collecting data.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              Daily Follows Likes spent THB 1,242.41 with 0 inline link clicks and CPM of THB 98.16, while AQ Operator generated 716 landing page views at THB 6.10 each.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers or a rebuilt landing-page/conversion campaign              </strong>            </div>            <p>              Aquaverse India | Instagram Followers generated 4,199 link clicks but only 57 landing page views, while AQ Operator generated fewer link clicks but 716 landing page views.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead or ticket-sales campaign after tracking is fixed              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is strong for page likes but weak for website actions, with only 16 link clicks and 1 landing page view from THB 5,157.69 spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting pool built from 149,720 video views and 175,788 post engagements              </strong>            </div>            <p>              The account has created large engagement audiences but has not yet used the data to prove leads or ticket sales.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Dedicated ticket-sales or lead campaign from AQ Operator learnings            </h3>            <p>              <strong>Setup:</strong>              Create a new campaign using the strongest AQ Operator audience and creatives, but optimize for Lead, Purchase, or Landing Page View depending on which events are confirmed working.            </p>            <p>              <strong>Success metric:</strong>              Primary: leads or purchases once tracking is active. Interim: cost per landing page view compared with AQ Operator&amp;#039;s THB 6.10.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Landing page view quality test            </h3>            <p>              <strong>Setup:</strong>              Duplicate Aquaverse India | Instagram Followers | 2026-09-27 into a traffic campaign optimized for landing page views, using the same destination URL and UTMs.            </p>            <p>              <strong>Success metric:</strong>              Improve landing page view rate from the current 1.36% of link clicks and reduce cost per landing page view from THB 111.46.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engagement retargeting to ticket or lead offer            </h3>            <p>              <strong>Setup:</strong>              Build retargeting audiences from 149,720 video views and 175,788 post engagements, then show direct ticket or lead-form creative.            </p>            <p>              <strong>Success metric:</strong>              Track leads, purchases, cost per result, and landing page views. Do not judge until at least 3 results are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Click-to-message qualification test            </h3>            <p>              <strong>Setup:</strong>              Run a small messaging campaign with clear qualifying prompts such as ticket date, group size, and contact details, using warm audiences first.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversatio
