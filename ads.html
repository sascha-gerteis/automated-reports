ter;    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-25        →        2026-08-23      </span>      <span class=&quot;pill&quot;>        14 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 126,231.36</strong>        <small>          2026-07-25          to          2026-08-23        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>15,462,645</strong>        <small>          29,269,604 impressions          ·          1.89 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,807</strong>        <small>          0.52% CTR          ·          THB 0.84 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 42,077.12 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>34</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 4.31</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large reach and engagement during 2026-07-25 to 2026-08-23: THB 126,231.36 spend, 29,269,604 impressions, 15,462,645 reach, 2,988,958 page engagements and 2,804,105 video views. However, performance is mixed against the business goal because only 1 lead was reported, no purchase events were reported, and most spend is concentrated in follower/engagement campaigns rather than lead, messaging, traffic, or purchase campaigns. Traffic quality is strongest in the Claude campaigns, but spend there is extremely small.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from broad follower campaigns that are not producing leads or traffic            </h3>            <p>              <strong>Why:</strong>              The five duplicated &amp;#039;Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination&amp;#039; campaigns spent THB 62,048.20 combined and produced only 1 lead, 8 total inline link clicks, and limited messaging results. The largest version alone spent THB 44,087.75 for 1 lead and 6 link clicks.            </p>            <p>              <strong>Do this:</strong>              Reduce the combined Broad Destination allocation and consolidate into one clean campaign only if follower growth remains a goal. Move freed budget into dedicated traffic, lead, messaging, and purchase-tracking tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the Claude traffic campaigns            </h3>            <p>              <strong>Why:</strong>              The Claude campaigns are the clearest traffic performers: &amp;#039;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;#039; generated 154 link clicks and 97 landing page views from THB 16.24 spend; &amp;#039;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;#039; generated 172 link clicks and 94 landing page views from THB 28.05; &amp;#039;Claude | IN | Families | 6 Languages | 2026-06-19&amp;#039; generated 181 link clicks and 91 landing page views from THB 41.84.            </p>            <p>              <strong>Do this:</strong>              Increase Claude campaign budgets gradually rather than aggressively because spend is still very small. Prioritize the Corporates 5 Languages version first, then Corporates 6 Languages, then Families 6 Languages, while monitoring landing page views and downstream leads.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix purchase and lead tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              The account reports no purchase events, no revenue, no ROAS, and only 1 lead. The target cost per lead, cost per purchase, and ROAS are all unknown, so profitability cannot be evaluated from the supplied data.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI events for ticket purchase, initiate checkout, lead, and landing page view. Confirm that ticket-sale events fire and are passed back to Meta before scaling purchase campaigns.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild quarantined campaigns into clean campaign structures            </h3>            <p>              <strong>Why:</strong>              Two campaigns contain &amp;#039;ERROR QUARANTINED&amp;#039; in the name. &amp;#039;ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers&amp;#039; spent THB 16,053.95 and produced 23,858,980 impressions, but only 3 link clicks and 1 messaging conversation started. The Thailand quarantined campaign spent THB 4,201.39 with very high CPM of THB 180.60.            </p>            <p>              <strong>Do this:</strong>              Duplicate useful creatives into clean campaigns with clear objectives. Keep the quarantined versions only until the rebuild is live, then turn them off if the rebuilt campaign delivers stable engagement or traffic.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Best traffic efficiency in the account based on supplied data.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16.24 spend, 154 inline link clicks, 97 landing page views, 13.10% CTR, THB 0.11 per link click, and THB 0.17 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale this campaign first for traffic. Do not judge lead or purchase performance yet because no leads or purchases were reported from it.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Strong traffic campaign with efficient landing page volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 28.05 spend, 172 inline link clicks, 94 landing page views, 8.96% CTR, THB 0.16 per link click, and THB 0.30 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale cautiously alongside the 5 Languages version. Monitor whether landing page views convert into leads once tracking and lead capture are confirmed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Efficient family-audience traffic despite very low spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 41.84 spend, 181 inline link clicks, 91 landing page views, 5.70% CTR, THB 0.23 per link click, and THB 0.46 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic test. Scale more cautiously than the Corporate versions because cost per landing page view is higher than both Corporate campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 29,444.75 spend, 27,946 page likes, 534,998 page engagements, 507,052 post engagements, 442,714 video views, and 5.12% CTR.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth and engagement are active objectives. Do not rely on it for ticket sales or leads because it produced no reported leads, purchases, or landing page views.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Efficient top-of-funnel engagement and video distribution.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,461.89 spend, 772,033 page engagements, 722,875 video views, 1,057 link clicks, 14 messaging conversations started, and 8 conversations replied.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a low-cost engagement asset. Use engagers and video viewers for retargeting, but watch message quality because it also generated 7 messaging blocks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very cheap reach and video scale.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,053.95 spend, 23,858,980 impressions, THB 0.67 CPM, 1,331,596 page engagements, and 1,315,149 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use only as awareness evidence, not a lead or traffic driver. Rebuild into a clean awareness campaign because downstream actions are weak.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Largest spend concentration is not aligned with ticket sales or qualified lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The largest version spent THB 44,087.75 and produced 1 lead, 6 inline link clicks, 10 messaging conversations started, and 3,698 page likes. Across five duplicated versions, combined spend was THB 62,048.20 with only 1 reported lead and 8 total inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and consolidate. Keep only the best-performing variant for follower growth if needed, and move budget into dedicated traffic, lead, messaging, and purchase campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Massive awareness volume but almost no traffic or lead intent.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              23,858,980 impressions and THB 16,053.95 spend produced only 3 inline link clicks, 1 messaging conversation started, 5 messaging blocks, and no leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild the campaign. If awareness remains useful, cap it to awareness-only budget; otherwise reallocate spend to Claude traffic and lead-generation tests.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families            </h3>            <p>              Follower campaign is producing engagement but limited deeper actions.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 7,867.50 spend produced 2,418 page likes, 47,109 page engagements, 6 messaging conversations started, 3 conversations replied, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only if family follower growth is important. Do not scale for leads or ticket sales without changing objective and destination.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Messaging quality may be weak despite conversation volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              14 messaging conversations started and 8 replied, but also 7 messaging blocks from THB 5,461.89 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale as a messaging lead campaign until the message flow, audience, and opening prompt are improved.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Follower volume exists, but delivery cost is unusually high within the supplied account data.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,201.39 spend, 1,847 page likes, 8,378 page engagements, 10.22% CTR, but THB 180.60 CPM.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild into a clean Thailand follower or engagement campaign and compare against &amp;#039;Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily&amp;#039; before scaling.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | IN | Corporates | 5 Languages | 2026-06-19 and Claude | IN | Corporates | 6 Languages | 2026-06-19              </strong>            </div>            <p>              Broad Destination absorbed THB 62,048.20 across duplicated campaigns with only 1 lead and 8 total inline link clicks, while the Claude Corporate campaigns produced 326 link clicks and 191 landing page views from only THB 44.29 combined spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Clean awareness retargeting pool plus dedicated lead or ticket-sale campaign              </strong>            </div>            <p>              The quarantined India campaign is efficient for reach and video views, but produced only 3 link clicks and 1 messaging conversation started from THB 16,053.95 spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Follower campaigns used for lead expectations              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead-generation and messaging campaigns              </strong>            </div>            <p>              The account generated only 1 lead in total. Follower and engagement campaigns are creating page likes, post engagement, and video views, but are not generating enough lead data to support the business goal.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicated Broad Destination campaign structure              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                One consolidated Broad Destination campaign or one best-performing variant              </strong>            </div>            <p>              Five campaigns share the same name and are splitting budget. Consolidation will make performance easier to read and reduce overlap while keeping spend focused on the strongest variant for the selected objective.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Claude traffic scale test            </h3>            <p>              <strong>Setup:</strong>              Create a controlled scale test for the three Claude campaigns. Increase budget gradually, prioritizing &amp;#039;Claude | IN | Corporates | 5 Languages | 2026-06-19&amp;#039;, then &amp;#039;Claude | IN | Corporates | 6 Languages | 2026-06-19&amp;#039;, then &amp;#039;Claude | IN | Families | 6 Languages | 2026-06-19&amp;#039;.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, and landing page view rate from link clicks. Current reference points are THB 0.17, THB 0.30, and THB 0.46 per landing page view respectively.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Lead form campaign for Families and Corporates            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated Meta lead campaign using the strongest Claude audience angles: Corporates 5 Languages, Corporates 6 Languages, and Families 6 Languages. Use a qualification question to separate ticket buyers from low-intent leads.            </p>            <p>              <strong>Success metric:</strong>              Do not make a budget decision until each ad set reaches at least 3 leads, per the supplied minimum_results_before_decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Build a dedicated messaging campaign using ticket-specific prompts, pricing or package questions, and automated quick replies. Test against the audience that produced conversations in &amp;#039;New post engagement campaign&amp;#039; and the Broad Destination audience.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, conversations replied, block count, and qualified conversation count. Current reference: &amp;#039;New post engagement campaign&amp;#039; produced 14 starts, 8 replies, and 7 blocks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Engagement retargeting test            </h3>            <p>              <strong>Setup:</strong>              Create retargeting audiences from 2,988,958 page engagements, 2,804,105 video views, and 282 landing page views. Send retargeted users to the ticket or lead destination.            </p>            <p>              <strong>Success metric:</strong>              Leads or purchases after at least 3 results. If purchase tracking is not available, judge only lead volume and cost after minimum data is reached.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Clean rebuild test for quarantined campaigns            </h3>            <p>              <strong>Setup:</strong>              Duplicate creatives from &amp;#039;ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers&amp;#039; and &amp;#039;ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily&amp;#039; into clean campaigns with clear objectives.            </p>            <p>              <strong>Success metric:</strong>              Compare CPM, page engagement cost, link clicks, messaging starts, and negative actions against the quarantined originals before moving full budget.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events, purchase value, revenue, or ROAS are reported, so ticket-sale profitability cannot be evaluated.</li><li>Only 1 lead was reported across THB 126,231.36 spend. This is below the minimum_results_before_decision of 3, so lead performance cannot be judged reliably yet.</li><li>The account shows 150,779 clicks but only 1,807 inline link clicks. Many campaigns are generating engagement clicks rather than destination traffic, so click volume should not be treated as website traffic.</li><li>Only 282 landing page views were reported from 1,807 inline link clicks at account level. This suggests either weak landing page continuation, non-website click destinations,
