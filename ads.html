 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-29        →        2026-10-28      </span>      <span class=&quot;pill&quot;>        6 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 18,540.63</strong>        <small>          2026-09-29          to          2026-10-28        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,190,324</strong>        <small>          2,351,653 impressions          ·          1.98 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>13,135</strong>        <small>          2.21% CTR          ·          THB 0.36 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>6</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.88</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent THB 18,540.63 from 2026-09-29 to 2026-10-28, generating 2,351,653 impressions, 1,190,324 reach, 13,135 link clicks, 3,720 landing page views, 7,061 page likes, and 211,288 video views. Traffic improved materially from 2026-10-25 to 2026-10-28, but no lead, purchase, or ROAS data is present, so profitability cannot be assessed. The account is producing awareness, engagement, and some traffic, but the current spend mix is not aligned tightly enough to ticket sales or qualified leads.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              <strong>Why:</strong>              This campaign used only THB 649.47 spend but generated 2,838 landing page views, which is 76.3% of all account landing page views. It also had the strongest traffic efficiency with THB 0.14 CPC, 11.02% CTR, and approximately THB 0.23 per landing page view.            </p>            <p>              <strong>Do this:</strong>              Increase budget by 20-30% at a time and monitor landing page views, cost per landing page view, and downstream ticket/lead events once tracking is fixed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix purchase and lead tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              The account goal is profitable ticket sales and qualified leads, but the supplied data shows no lead actions, no purchase actions, and no ROAS. Targets are unknown, so no cost-per-lead, cost-per-purchase, or ROAS comparison is possible.            </p>            <p>              <strong>Do this:</strong>              Verify Meta Pixel/CAPI events for Lead, Purchase, Initiate Checkout, and ticket page events. Confirm events appear at campaign level before shifting large budget into sales campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce inefficient follower/engagement budget            </h3>            <p>              <strong>Why:</strong>              Aquaverse India | Instagram Followers | 2026-09-27 spent THB 6,165.50 but produced only 48 landing page views from 3,854 link clicks, while India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy spent THB 649.47 and produced 2,838 landing page views.            </p>            <p>              <strong>Do this:</strong>              Reduce Aquaverse India | Instagram Followers | 2026-09-27 and move part of that budget into the Claude rebuild traffic winner and a properly tracked lead/ticket sales campaign.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Audit messaging behavior and blocks            </h3>            <p>              <strong>Why:</strong>              The account recorded 1,205 messaging blocks but only 6 messaging conversations started. AQ Operator CBO | IN | Instagram Followers had 749 messaging blocks and Aquaverse India | Instagram Followers | 2026-09-27 had 455 blocks.            </p>            <p>              <strong>Do this:</strong>              Check whether placements, CTA, automated replies, or message routing are unintentionally driving low-quality messaging interactions. Exclude message placements or rebuild message flows if messaging is not a qualified lead objective.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate campaign objectives by funnel stage            </h3>            <p>              <strong>Why:</strong>              Follower, engagement, traffic, messaging, and purchase/lead performance are currently mixed together. AQ_MU2025_Followers_IN is strong for likes and engagement, while Claude rebuild is strong for landing page traffic.            </p>            <p>              <strong>Do this:</strong>              Keep follower campaigns only if follower growth is an active KPI. Build separate campaigns for ticket sales/leads, landing page traffic, and retargeting so budget decisions are based on the correct objective.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy            </h3>            <p>              Best traffic and landing page view driver in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 649.47 spend, 4,592 link clicks, 2,838 landing page views, 11.02% CTR, THB 0.14 CPC, and approximately THB 0.23 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale this campaign and use it as the main source of traffic testing while tracking is fixed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Strong awareness, video, and engagement volume at scale.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,709.54 spend, 1,107,883 impressions, 160,097 post engagements/page engagements, 152,717 video views, 4,670 link clicks, and 833 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an upper-funnel campaign if awareness and engagement are desired, but do not treat it as a proven sales or lead campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement performance, but not a traffic campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,449.64 spend, 5,744 page likes, 61,240 page engagements, 9,319 post reactions, 838 comments, and approximately THB 0.77 per page like. However, it produced only 18 inline link clicks and 1 landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth and page engagement remain important. Cap budget if the priority is ticket sales or qualified leads.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              High spend with weak landing page quality and very low click-to-landing-page conversion.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 6,165.50 spend, 3,854 link clicks, only 48 landing page views, approximately THB 128.45 per landing page view, and 455 messaging blocks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild with a clear traffic, lead, or ticket-sales objective. Do not scale this version for sales.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Follower campaign is less efficient than AQ_MU2025_Followers_IN and delivers no inline link traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 836.43 spend, 618 page likes, 2,461 page engagements, 0 inline link clicks, THB 96.49 CPM, and approximately THB 1.35 per page like versus AQ_MU2025_Followers_IN at approximately THB 0.77 per page like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. If follower growth is required, shift follower budget toward the more efficient AQ_MU2025_Followers_IN.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination - Copy            </h3>            <p>              Duplicate follower campaign has limited traffic value and weaker engagement efficiency than AQ_MU2025_Followers_IN.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 730.05 spend, 699 page likes, 2,348 page engagements, only 1 inline link click, THB 89.66 CPM, and approximately THB 0.31 per page engagement versus AQ_MU2025_Followers_IN at approximately THB 0.07 per page engagement.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or consolidate into the stronger follower campaign. Do not use this campaign for ticket sales traffic.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide purchase and lead performance            </h3>            <p>              Sales and lead performance cannot be evaluated.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across THB 18,540.63 spend, the supplied data shows 0 purchase actions, 0 lead actions, and no ROAS data.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make profitability decisions until Lead and Purchase tracking is confirmed. Build dedicated lead/ticket campaigns once events are firing.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy              </strong>            </div>            <p>              Aquaverse India | Instagram Followers | 2026-09-27 spent THB 6,165.50 for only 48 landing page views, while the Claude rebuild spent THB 649.47 for 2,838 landing page views.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination and Broad Destination - Copy              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN if follower growth remains a KPI              </strong>            </div>            <p>              The two Broad Destination campaigns generated page likes at approximately THB 1.35 and THB 1.04 per like, while AQ_MU2025_Followers_IN generated page likes at approximately THB 0.77 per like.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current heavy follower/engagement allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New dedicated lead or ticket-sales campaign after tracking validation              </strong>            </div>            <p>              The business goal is profitable ticket sales and qualified leads, but most spend is currently going to follower and engagement campaigns with no lead or purchase reporting.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaign using video viewers, engagers, and landing page visitors              </strong>            </div>            <p>              AQ Operator CBO generated 152,717 video views and 160,097 page engagements, creating a large retargeting pool, but it has not proven lead or purchase outcomes.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing page traffic scale test for Claude rebuild            </h3>            <p>              <strong>Setup:</strong>              Duplicate India | World&amp;#039;s Beauties | Miss Universe [Claude rebuild] - Copy or increase budget by 20-30%. Keep creative and audience stable for a clean scale read.            </p>            <p>              <strong>Success metric:</strong>              Maintain low cost per landing page view and strong click-to-landing-page rate; then judge by Lead or Purchase once tracking is active.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket sale
