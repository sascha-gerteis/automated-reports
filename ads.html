       2026-08-19        →        2026-09-17      </span>      <span class=&quot;pill&quot;>        16 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 38,060.40</strong>        <small>          2026-08-19          to          2026-09-17        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>1,922,474</strong>        <small>          3,363,202 impressions          ·          1.75 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>105</strong>        <small>          1.91% CTR          ·          THB 0.59 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 11.32</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account generated large awareness and engagement volume but is not yet proving progress toward profitable ticket sales or qualified leads. Total spend was THB 38,060.40, producing 3,363,202 impressions, 1,922,474 reach, 574,327 page engagements, 24,514 likes, and 105 link clicks. No purchases, purchase value, leads, ROAS, or cost-per-purchase data were reported, and only 1 messaging conversation was recorded, which is below the minimum_results_before_decision of 3. Performance is strongest for follower/page engagement activity, especially AQ_MU2025_Followers_IN, but the current campaign mix is not aligned enough to ticket sales or qualified lead generation.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild the account around lead and ticket-sale objectives            </h3>            <p>              <strong>Why:</strong>              The business goal is ticket sales and qualified leads, but the data shows no purchase actions, no leads, and only 1 messaging conversation from THB 38,060.40 spend.            </p>            <p>              <strong>Do this:</strong>              Create dedicated purchase and lead/messaging campaigns once tracking is verified; fund them by reducing weaker ERROR QUARANTINED follower campaigns instead of continuing to spend mainly on engagement and follows.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Protect but do not aggressively scale AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN produced most efficient follower/engagement volume: 22,178 likes, 421,071 page engagements, 104 link clicks, THB 24,746.39 spend, THB 1.12 per like, and THB 0.06 per page engagement. However, frequency is 4.57, the highest major campaign in the data.            </p>            <p>              <strong>Do this:</strong>              Keep the campaign active, refresh creatives, and scale cautiously only in small increments while monitoring frequency, engagement rate, and link-click volume.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Consolidate duplicated ERROR QUARANTINED India Follows Likes campaigns            </h3>            <p>              <strong>Why:</strong>              Multiple campaigns have the same or near-identical name and objective, fragmenting spend and learning. Several are materially less efficient than AQ_MU2025_Followers_IN for likes and engagement.            </p>            <p>              <strong>Do this:</strong>              Rebuild the duplicated India Follows Likes activity into fewer clean campaigns/ad sets, keep only the strongest variants, and move excess budget into lead/purchase tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate tracking and attribution before judging sales performance            </h3>            <p>              <strong>Why:</strong>              There are no purchase, lead, revenue, or ROAS actions reported. Also, the account shows 64,338 total clicks but only 105 link clicks, and New post engagement campaign shows 1 messaging welcome message view with 0 impressions and 0 spend.            </p>            <p>              <strong>Do this:</strong>              Audit pixel/CAPI, purchase event, lead event, UTMs, domain setup, event prioritization, and messaging attribution before making sales-efficiency decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best-performing follower and engagement campaign in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 24,746.39 and generated 22,178 likes, 421,071 page engagements, 398,893 post engagements, 358,715 video views, 104 link clicks, CTR 3.68%, CPC THB 0.46, THB 1.12 per like, and THB 0.06 per page engagement.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale. Refresh creative because frequency is 4.57, which is much higher than the account frequency of 1.75.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Strong awareness reach at very low media cost, but not a traffic or conversion driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,161.15 for 1,649,471 impressions, 1,553,059 reach, frequency 1.06, CPM THB 0.70, 90,273 page engagements, and 89,141 video views. However, CTR was only 0.04% and inline link clicks were 0.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is low-cost awareness. Do not use this campaign to judge traffic, leads, or ticket sales.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Generated likes efficiently from a small sample, but reach scale is limited and CPM is high.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 710.24, generated 372 likes, 1,202 page engagements, CTR 14.31%, and THB 1.91 per like. Impressions were only 2,564 and CPM was THB 277.00.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a small controlled follower test only. Do not scale aggressively until it proves performance at higher impression volume.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Account overall            </h3>            <p>              The account is not yet proving ticket sales or qualified lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across THB 38,060.40 spend, no purchases, no purchase value, no ROAS, and no lead actions were reported. Only 1 messaging conversation was recorded, below the minimum_results_before_decision of 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not judge profitability yet. First fix/confirm conversion tracking and launch dedicated purchase and lead campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong for followers and engagement, weak as a ticket-sales traffic source.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The campaign generated 22,178 likes and 421,071 page engagements, but only 104 link clicks from THB 24,746.39 spend, equal to about THB 237.95 per link click. No leads or purchases were reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep for audience building, but separate it from sales evaluation. Add dedicated ticket-sale creatives and a conversion/traffic test rather than relying on this follower campaign for purchases.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Underperforming for follower acquisition versus the account’s strongest follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 4,304.20 and generated 762 likes, equal to about THB 5.65 per like, compared with AQ_MU2025_Followers_IN at about THB 1.12 per like. CPM was THB 50.50 and page engagement cost was about THB 0.22.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and rebuild this audience/creative structure before further scale.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Duplicated campaign naming and inconsistent efficiency are fragmenting budget.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Three campaigns with the same name spent THB 1,487.24, THB 1,022.51, and THB 2,430.56. They generated 208, 200, and 354 likes respectively, equal to about THB 7.15, THB 5.11, and THB 6.87 per like. Only one of the three recorded 1 link click and 1 messaging conversation.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate these duplicated campaigns. Keep learnings from the best variant but rebuild into one clean structure with clearer objective separation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Not suitable for traffic, lead, messaging, or purchase goals based on current data.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Despite 1,649,471 impressions and 1,553,059 reach, it produced 0 inline link clicks, 0 leads, 0 purchases, and 0 messaging conversations.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as an awareness campaign at controlled budget. If the goal is ticket sales or qualified leads, move budget elsewhere.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Insufficient delivery data and a possible attribution anomaly.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Reported 0 impressions, 0 reach, 0 clicks, and THB 0 spend, but recorded 1 messaging welcome message view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on performance. Investigate attribution/reporting setup and confirm whether the action belongs to this campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data for a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The four 2026-08-28 variants spent only THB 7.06, THB 4.26, THB 6.55, and THB 6.64, with very low impression volume.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause or scale from this tiny sample. Either give the test enough budget to reach meaningful results or fold it into the consolidated rebuild.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 and 2026-08-25 Broad Destination variants              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New purchase and lead/messaging test campaigns              </strong>            </div>            <p>              These variants spent about THB 9,244.51 combined and were less efficient for likes than AQ_MU2025_Followers_IN, while generating no purchases or leads.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicated ERROR QUARANTINED India Follows Likes 2026-08-30 variants              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                A consolidated India follower/engagement campaign plus lead retargeting              </strong>            </div>            <p>              The five 2026-08-30 variants spent about THB 2,173.60 across fragmented campaigns with similar names. Consolidation should reduce learning fragmentation and free budget for lower-funnel tests.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retain only a small awareness allocation; move any sales-focused budget to lead or purchase campaigns              </strong>            </div>            <p>              It is efficient for reach with CPM THB 0.70, but produced 0 inline link clicks, 0 leads, 0 purchases, and 0 messaging conversations.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Maintain core budget, with only cautious incremental increases              </strong>            </div>            <p>              It is the strongest engagement/follower campaign, but frequency is already 4.57 and it has not proven lead or purchase output.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Ticket sales conversion campaign            </h3>            <p>              <strong>Setup:</strong>              After confirming purchase tracking, launch a dedicated purchase campaign using ticket-sale creative and clear booking CTA. Fund it from reduced ERROR QUARANTINED India Follows Likes budgets.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 purchase results. Track purchases, cost per purchase, and ROAS once revenue is available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Qualified lead form versus messaging test            </h3>            <p>              <strong>Setup:</strong>              Run one instant lead form campaign against one click-to-message campaign using the same offer and audience. Include qualification questions in the lead form and track messaging conversation quality manually if needed.            </p>            <p>              <strong>Success metric:</strong>              Evaluate after each path reaches at least 3 leads or messaging conversations. Compare cost per qualified lead or qualified conversation.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Follower audience retargeting to ticket intent            </h3>            <p>              <strong>Setup:</strong>              Retarget people who engaged with AQ_MU2025_Followers_IN using ticket-focused creative and a link or conversion objective.            </p>            <p>              <strong>Success metric:</strong>              Primary metric should be leads or purchases if tracking is active; secondary metric is inline link clicks. Do not make a decision before 3 lower-funnel results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Consolidated Broad Destination rebuild            </h3>            <p>              <strong>Setup:</strong>              Combine the duplicated India Broad Destination follower campaigns into one clean campaign with separate ad sets or creatives, rather than multiple identical ERROR QUARANTINED campaigns.            </p>            <p>              <strong>Success metric:</strong>              Compare cost per like, cost per page engagement, CTR, and CPM against current Broad Destination variants after meani
