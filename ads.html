at(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-08        →        2026-10-07      </span>      <span class=&quot;pill&quot;>        3 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 20,502.36</strong>        <small>          2026-09-08          to          2026-10-07        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>716,655</strong>        <small>          1,684,824 impressions          ·          2.35 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>3,190</strong>        <small>          2.89% CTR          ·          THB 0.42 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 12.17</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent THB 20,502.36 and generated strong upper-funnel volume: 1,684,824 impressions, 716,655 reach, 48,635 clicks, 225,909 page engagements, and 179,522 video views. However, performance is not yet aligned with the business goal of profitable ticket sales and qualified leads: there are 0 purchase events, 0 lead events, only 43 landing page views from 3,190 link clicks, and only 2 messaging conversations started. The account is currently functioning mainly as a follower/engagement account, not a sales or lead generation account.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix conversion and landing page tracking before judging sales performance            </h3>            <p>              <strong>Why:</strong>              The account shows 3,190 inline link clicks but only 43 landing page views, a 1.35% link-click-to-LPV rate. No purchase or lead events are reported, so ticket sales and lead quality cannot be evaluated.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel, Conversions API, event setup, UTMs, landing page load speed, and destination URLs. Confirm ViewContent, Lead, InitiateCheckout, and Purchase events fire correctly before scaling sales campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce dependency on follower campaigns for business growth            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN used THB 14,713.60, about 71.8% of total spend, but produced only 46 inline link clicks and no landing page views, leads, or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep AQ_MU2025_Followers_IN only as a low-budget awareness/follower campaign and shift a portion of spend into lead, messaging, and ticket-sales campaigns once tracking is fixed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild the acquisition structure around lead and ticket intent            </h3>            <p>              <strong>Why:</strong>              Current campaigns are follower/likes campaigns. The only campaign producing meaningful link traffic is Aquaverse India | Instagram Followers | 2026-09-27, but it still produced only 43 landing page views from 3,147 link clicks.            </p>            <p>              <strong>Do this:</strong>              Create separate campaigns for ticket sales, qualified leads, and messaging instead of relying on follower campaigns to generate downstream business outcomes.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Carefully scale the lowest-cost reach and click source only after QA            </h3>            <p>              <strong>Why:</strong>              Aquaverse India | Instagram Followers | 2026-09-27 has the lowest CPM at THB 5.48, lowest CPC at THB 0.29, and produced 3,147 of the account&amp;#039;s 3,190 inline link clicks.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign active, but do not materially scale until the landing page view issue is resolved. After QA, test 10-20% budget increases while monitoring landing page views, messaging starts, and downstream conversions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness and engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 14,713.60 spend generated 842,091 impressions, 216,348 page engagements, 177,464 video views, 20,359 post reactions, 2,008 comments, 656 saves, and 14,152 likes.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep, but reduce its role to awareness/follower growth. Do not treat this campaign as a ticket-sales or lead-generation driver because it produced only 46 inline link clicks and no landing page views, leads, or purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Best traffic and reach efficiency among current campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,546.35 spend generated 830,076 impressions, 499,189 reach, THB 5.48 CPM, THB 0.29 CPC, and 3,147 inline link clicks. It drove nearly all account link traffic.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale only after tracking and destination QA. This is the strongest candidate to evolve into a traffic, lead, or sales test.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Generated page likes and engagement from a small reach pool.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,242.41 spend produced 897 likes, 3,628 page engagements, 511 post reactions, and 135 comments at frequency 1.32.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if page-like growth is a priority. For ticket sales and leads, reduce budget because it produced 0 inline link clicks, 0 landing page views, 0 leads, and 0 purchases.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Large spend is not translating into business-intent actions.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              It spent THB 14,713.60, representing the majority of account spend, but generated only 46 inline link clicks, 0 landing page views, 0 messaging conversations, 0 leads, and 0 purchases. Frequency is also the highest at 3.84.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and refresh creative/audiences if continuing for awareness. Reallocate part of the spend to lead, messaging, or ticket-sales campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Expensive delivery relative to the other campaigns and no site traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CPM is THB 98.16 versus THB 17.47 for AQ_MU2025_Followers_IN and THB 5.48 for Aquaverse India | Instagram Followers | 2026-09-27. CPC is THB 1.09, the highest in the account, with 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget materially unless page-like growth is the only objective. Do not pause purely from a sales lens until a dedicated sales/lead structure exists, but it should not receive growth budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality or tracking appears weak despite high link-click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The campaign generated 3,147 inline link clicks but only 43 landing page views, plus only 2 messaging conversations started and 3 total messaging connections. This is not enough to make a confident lead-quality decision beyond the minimum result threshold issue.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Investigate destination URL, load speed, tracking, and click quality before scaling. Test landing page view or conversion optimization instead of follower optimization.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New ticket-sales or lead-generation campaign              </strong>            </div>            <p>              This campaign consumed THB 14,713.60 but produced no landing page views, leads, or purchases. Move a portion of its budget into campaigns optimized for business outcomes after tracking is fixed.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27 or a new lead/messaging test              </strong>            </div>            <p>              Daily Follows Likes has the highest CPM at THB 98.16 and highest CPC at THB 1.09, while Aquaverse India | Instagram Followers | 2026-09-27 has the lowest CPM at THB 5.48 and produced 3,147 inline link clicks.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Separate budget pools for awareness, traffic, leads, messaging, and purchase campaigns              </strong>            </div>            <p>              Current spend is concentrated in follower campaigns, but the business goal is ticket sales and qualified leads. Separate budgets are needed so awareness campaigns are not judged by purchases and acquisition campaigns are not optimized for followers.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Dedicated lead campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a separate lead campaign using Meta instant forms or the verified website lead event. Use clear qualification questions and keep it separate from follower campaigns.            </p>            <p>              <strong>Success metric:</strong>              Qualified leads and cost per qualified lead once at least 3 lead results are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket-sales conversion campaign test            </h3>            <p>              <strong>Setup:</strong>              After Pixel/CAPI QA, launch a campaign optimized for the deepest reliable ticket event available, such as Purchase or InitiateCheckout. Use UTMs to verify traffic and conversions in analytics.            </p>            <p>              <strong>Success metric:</strong>              Purchases or checkout events and cost per result once at least 3 results are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Landing page view versus link click optimization            </h3>            <p>              <strong>Setup:</strong>              Use the same audience and creative from Aquaverse India | Instagram Followers | 2026-09-27, but test landing page view or conversion optimization against the current follower/link behavior.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, link-click-to-LPV rate, and downstream lead or purchase events.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging lead test            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated click-to-message campaign instead of relying on incidental messaging from follower campaigns. Use automated qualifying questions for ticket or group-visit intent.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, total messaging connections, and qualified conversations once at least 3 conversations are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Awareness creative refresh test            </h3>            <p>              <strong>Setup:</strong>              Within AQ_MU2025_Followers_IN, test new creatives against the current engagement winner and monitor frequency, reactions, comments, saves, and cost per engagement.            </p>            <p>              <strong>Success metric:</strong>              Page engagement volume, saves, comments, and reduced frequency pressure compared with the current 3.84 frequency.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events are reported, so ticket-sales performance cannot be evaluated.</li><li>No lead events are reported, so qualified lead performance cannot be evaluated.</li><li>Only 43 landing page views were recorded from 3,190 inline link clicks, indicating a likely landing page, tracking,
