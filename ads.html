orm: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-16        →        2026-09-14      </span>      <span class=&quot;pill&quot;>        17 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 41,318.70</strong>        <small>          2026-08-16          to          2026-09-14        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>3,344,915</strong>        <small>          5,576,632 impressions          ·          1.67 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>116</strong>        <small>          1.22% CTR          ·          THB 0.61 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.41</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement volume is strong: 5,576,632 impressions, 3,344,915 reach, 707,156 page engagements, 632,887 video views, and 25,678 likes from 41,318.70 THB. However, the account is not currently proving the business goal of profitable ticket sales or qualified leads: no lead events, no purchase events, no purchase value, and only 116 inline link clicks were recorded. Most spend is going to follower, visibility, and engagement activity rather than measurable sales or lead outcomes.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix sales and lead measurement before scaling            </h3>            <p>              <strong>Why:</strong>              The business goal is ticket sales and qualified leads, but the data shows 0 lead events, 0 purchase events, and 0 ROAS data. Targets are unknown, so profitability cannot be judged.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI, Lead, Purchase, value tracking, UTMs, and CRM/offline lead capture before increasing spend on conversion activity.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate upper-funnel campaigns from lead and purchase campaigns            </h3>            <p>              <strong>Why:</strong>              Current performance is mostly engagement/follower driven. Account generated 68,268 clicks but only 116 inline link clicks, showing most clicks are not website traffic.            </p>            <p>              <strong>Do this:</strong>              Keep awareness/follower campaigns for reach and audience building, but create separate campaigns optimized specifically for leads and ticket purchases once tracking is confirmed.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN, but scale carefully only for follower growth            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN produced the strongest follower volume: 22,884 likes from 25,482.56 THB, approximately 1.11 THB per like, plus 437,611 page engagements.            </p>            <p>              <strong>Do this:</strong>              Maintain as the primary follower campaign. If more followers are needed, increase budget gradually and refresh creatives because frequency is already 4.47 and the campaign also generated 2,321 unlikes.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild duplicated ERROR QUARANTINED Broad Destination follower campaigns            </h3>            <p>              <strong>Why:</strong>              Several duplicated Broad Destination campaigns spent materially but produced weaker cost per like than AQ_MU2025_Followers_IN and almost no traffic.            </p>            <p>              <strong>Do this:</strong>              Consolidate the duplicated ERROR QUARANTINED Broad Destination campaigns into fewer clean campaigns/ad sets, keep only the best variants, and move excess budget to lead/purchase testing.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Use the visibility campaign only for awareness, not traffic or sales            </h3>            <p>              <strong>Why:</strong>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers delivered very cheap reach with 3,862,308 impressions at 0.71 THB CPM, but had 0 inline link clicks and CTR of only 0.0368%.            </p>            <p>              <strong>Do this:</strong>              Keep only if the objective is low-cost awareness/video reach. Do not rely on it for leads, ticket sales, or site traffic.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best campaign for follower and engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              25,482.56 THB spend, 22,884 likes, 437,611 page engagements, 414,727 post engagements, 371,987 video views, 3.87% CTR, and approximately 1.11 THB per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active. Carefully scale if follower growth remains a goal, but refresh creatives and monitor frequency 4.47 plus 2,321 unlikes.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Strong awareness efficiency and very low-cost reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              2,742.50 THB spend generated 3,862,308 impressions, 2,933,489 reach, 202,196 video views, 204,882 post engagements, and CPM of 0.71 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as an awareness or video reach layer. Do not judge it by purchases unless conversion tracking and retargeting are added.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Generated followers at a reasonable cost, but with expensive delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,633.97 THB spend, 821 likes, approximately 1.99 THB per like, 12.82% CTR, but CPM was very high at 243.04 THB from only 6,723 impressions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if Thailand is a required market. If India is the priority, reduce or separate this from India-focused budget.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              All active campaigns            </h3>            <p>              Lead and purchase performance cannot be assessed because no lead or purchase events are recorded.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Account spend was 41,318.70 THB with 0 reported leads, 0 purchases, 0 purchase value, and 0 ROAS.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make profitability decisions until tracking is fixed and at least 3 lead or purchase results are recorded, per the supplied minimum_results_before_decision.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              All active campaigns            </h3>            <p>              Traffic quality/reporting is weak relative to total click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              68,268 total clicks but only 116 inline link clicks. Account cost per inline link click is approximately 356.20 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Report and optimize to inline link clicks, landing page views, leads, or purchases instead of total clicks.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Weaker follower efficiency than the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              4,304.20 THB spend, 762 likes, approximately 5.65 THB per like, 1.36 THB CPC, 50.50 THB CPM, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild. Move budget toward AQ_MU2025_Followers_IN or a new tracked lead/purchase test.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Duplicated campaigns are fragmenting spend and underperforming on follower cost.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The 120251495841180402 version spent 1,487.24 THB for 208 likes, approximately 7.15 THB per like. The 120251495843190402 version spent 1,022.51 THB for 200 likes, approximately 5.11 THB per like. The 120251495845220402 version spent 2,430.56 THB for 354 likes, approximately 6.87 THB per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate these duplicated campaigns and rebuild with clearer audience, creative, and objective separation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              No delivery data is available, but messaging activity is attributed.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              0 impressions, 0 reach, 0 spend, and 0 clicks, but 5 messaging welcome message views are reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Investigate attribution/event mapping before using this campaign for performance decisions.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <p>              AQ_MU2025_Followers_IN delivered likes at approximately 1.11 THB each versus approximately 5.65 THB per like for the 2026-08-23 Broad Destination campaign.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicated ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                A rebuilt lead or purchase test campaign after tracking is fixed              </strong>            </div>            <p>              The 08-25 duplicated campaigns spent 4,940.31 THB combined with weaker follower costs and only 1 inline link click, while no lead or purchase campaign is currently measurable.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting test using video/page engagers              </strong>            </div>            <p>              This campaign generated large awareness volume, including 202,196 video views and 204,882 post engagements, but 0 inline link clicks. Its audience should be used for retargeting rather than expecting direct sales.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India-focused campaigns if India is the priority market              </strong>            </div>            <p>              The campaign is Thailand-specific inside the India Ad Account and has a very high CPM of 243.04 THB. Keep only if Thailand is strategically required.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Tracked lead generation test            </h3>            <p>              <strong>Setup:</strong>              After Lead tracking is verified, launch a dedicated lead campaign using ticket/enquiry creative and a clear form or landing page CTA. Do not mix with follower or engagement objectives.            </p>            <p>              <strong>Success metric:</strong>              At least 3 tracked leads, cost per qualified lead, and lead quality from CRM or manual review.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Tracked ticket purchase test            </h3>            <p>              <strong>Setup:</strong>              After Purchase and value tracking are verified, launch a dedicated purchase campaign for ticket sales with UTMs and purchase value passing correctly.            </p>            <p>              <strong>Success metric:</strong>              At least 3 tracked purchases, cost per purchase, purchase value, and ROAS.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engagement retargeting test            </h3>            <p>              <strong>Setup:</strong>              Retarget users who engaged with AQ_MU2025_Followers_IN and video viewers from the visibility campaign using a ticket offer or lead CTA.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, leads, purchases, and cost per result once tracking is active.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Creative refresh test for AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong>              Test new creatives against the current follower creative to reduce fatigue from frequency 4.47 and 2,321 unlikes.            </p>            <p>              <strong>Success metric:</strong>              Cost per like, page engagement volume, unlike volume, and frequency.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Clean campaign structure test            </h3>            <p>              <strong>Setup:</strong>              Rebuild the duplicated ERROR QUARANTINED Broad Destination campaigns into fewer campaigns with clear objectives: awareness, followers, traffic, leads, and purchase.            </p>            <p>              <strong>Success metric:</strong>              Lower cost per like for follower campaigns and measurable lead/purchase results for conversion campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No lead events, purchase events, purchase value, or ROAS are present, so profitable ticket sales cannot be evaluated.</li><li>Total clicks are much higher than inline link clicks: 68,268 clicks versus 116 inline link clicks. Total CPC is not a reliable traffic metric here.</li><li>New post engagement campaign shows 5 messaging welcome message views despite 0 impressions, 0 reach, 0 spend, and 0 clicks, indicating a possible attr
