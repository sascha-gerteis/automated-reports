    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 496,293.47</strong>        <small>          2026-06-28          to          2026-07-27        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>10,935,975</strong>        <small>          35,450,175 impressions          ·          3.24 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>572,050</strong>        <small>          2.54% CTR          ·          THB 0.55 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>36</strong>        <small>          THB 13,785.93 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>8</strong>        <small>          THB 62,036.68 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 3,476.00        </strong>        <small>          0.01× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>242</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 14.00</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account delivery is strong for reach, engagement, video views and traffic, but reported business outcomes are weak. Spend was 496,293.47 THB for 572,050 inline link clicks, 93,207 landing page views, 12 leads and 8 purchases with 3,476 THB reported purchase value. Purchase and lead volume is too low across most campaigns to make confident sales decisions, except for the boosted post &amp;quot;🎉หยุดยาวนี้...&amp;quot; which is the only campaign with at least 3 purchases and 3 leads. The biggest opportunity is to reduce spend from low-intent engagement/follower/corporate lead campaigns, fix tracking quality, and reallocate controlled budget into the campaigns and creatives producing landing page views, messages, leads and purchases.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit purchase, lead and landing page tracking before scaling sales campaigns            </h3>            <p>              <strong>Why:</strong>              Account shows 572,050 inline link clicks but only 93,207 landing page views, 12 leads and 8 purchases. Several campaigns report purchases or leads with only 1 to 6 landing page views, which suggests attribution or event quality issues.            </p>            <p>              <strong>Do this:</strong>              Check Pixel/CAPI event setup, deduplication, purchase value passing, lead event firing, marketplace tracking, and URL redirects. Do not scale purchase campaigns aggressively until purchase and lead attribution is verified.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the only proven purchase and lead campaign            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; generated 8 leads and 4 purchases from 2,579.01 THB spend, meeting the minimum 3-result rule.            </p>            <p>              <strong>Do this:</strong>              Increase budget on this post or duplicate it into a controlled sales/messages test by 15-20% at a time. Keep the original active while testing new audience and placement splits.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild corporate lead generation instead of continuing broad lead spend            </h3>            <p>              <strong>Why:</strong>              Aquaverse Corporate Groups - Leads - Test spent 13,058.99 THB with 0 leads, while TH | B2B Corporate | Video | Leads | 2026-06-18 spent 18,553.03 THB with 0 leads and frequency 6.09.            </p>            <p>              <strong>Do this:</strong>              Reduce these campaigns and rebuild with Instant Forms or a shorter lead flow, stronger corporate offer, qualification questions, and retargeting from corporate landing page visitors.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Shift traffic budget toward campaigns with stronger landing page delivery            </h3>            <p>              <strong>Why:</strong>              Some campaigns drive cheap clicks but poor landing page volume. Better traffic quality appears in Hot Weather Escape and Shopee/Corporate Thai campaigns.            </p>            <p>              <strong>Do this:</strong>              Prioritize TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026, Claude | TH | Corporates | Thai | 2026-06-19, Claude | TH | Conversions Shopee | 12Jun, and TH | Traffic | Shopee Store [Claude build] for traffic testing.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Cap or refresh high-frequency awareness campaigns            </h3>            <p>              <strong>Why:</strong>              Claude | TH | Awareness | Videos | 17Jun reached 1,874,400 people at 4.42 frequency with 3,187 post unlikes and only 0.68% CTR.            </p>            <p>              <strong>Do this:</strong>              Reduce budget, refresh creative, or rotate audiences before increasing spend. Keep awareness spend focused on low-frequency, low-CPM campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best reported sales, lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 2,579.01 THB, 8 leads, 4 purchases, 2,176 THB purchase value, 46 messaging conversations started. CPL 322.38 THB, cost per purchase 644.75 THB, cost per message start 56.07 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Duplicate into a structured campaign with separate sales, lead and messaging ad sets to learn which objective is driving the result.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026            </h3>            <p>              Strong traffic quality relative to spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 3,261.82 THB, 12,995 inline link clicks, 3,973 landing page views, 13.20% CTR, cost per landing page view about 0.82 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic/landing page view driver and test a conversion-optimized version using the same creative and offer.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Corporates | Thai | 2026-06-19            </h3>            <p>              Good corporate traffic delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 5,915.69 THB, 8,114 inline link clicks, 3,728 landing page views, 8.19% CTR, cost per landing page view about 1.59 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for corporate traffic retargeting. Build der-top: 4px solid #f59e0b;  }  .priority-low {    border-top: 4px solid #16a34a;  }  .finding-grid {    display: grid;    grid-template-columns: repeat(2, minmax(0, 1fr));    gap: 14px;  }  .finding {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .finding.positive {    border-left: 5px solid #16a34a;  }  .finding.negative {    border-left: 5px solid #dc2626;  }  .finding h3 {    margin: 0 0 8px;    font-size: 16px;  }  .finding p {    margin: 0 0 10px;    color: #526077;  }  .evidence,  .recommendation {    font-size: 13px;    margin-top: 7px;    color: #445168;  }  .budget-row {    display: grid;    grid-template-columns: 1fr 40px 1fr;    gap: 12px;    align-items: center;    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-06-28        →        2026-07-27      </span>      <span class=&quot;pill&quot;>        87 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,554,930.32</strong>        <small>          2026-06-28          to          2026-07-27        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>80,880,099</strong>        <small>          202,430,134 impressions          ·          2.50 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>5,612,911</strong>        <small>          3.26% CTR          ·          THB 0.24 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>324</strong>        <small>          THB 4,799.17 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 777,465.16 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2,863</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.68</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large reach and traffic during 2026-06-28 to 2026-07-27: 202,430,134 impressions, 5,612,911 link clicks, 1,411,129 landing page views, 108 leads, and 2 purchases from THB 1,554,930.32 spend. Account health is mixed: traffic and engagement volume are strong, but spend is heavily concentrated in campaigns that generated no leads or purchases, while the best lead and messaging results came from a small group of low-spend campaigns. Purchase data is insufficient for decisions because only 2 purchases were recorded, below the minimum_results_before_decision of 3.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reallocate budget toward proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              The strongest lead campaigns produced materially more leads from much lower spend than the highest-spend traffic and awareness campaigns.            </p>            <p>              <strong>Do this:</strong>              Increase budget carefully on Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13 in small staged increases while monitoring lead volume and message quality.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce high-spend campaigns with no lead output            </h3>            <p>              <strong>Why:</strong>              Several large traffic/video campaigns consumed substantial budget without producing leads or purchases, despite high click and landing page view volume.            </p>            <p>              <strong>Do this:</strong>              Reduce or rebuild Claude | IN | Corporates | 6 Languages | 2026-06-19, Claude | IN | Corporates | 5 Languages | 2026-06-19, Claude | IN | Families | 6 Languages | 2026-06-19, Claude | IN | Singles | 6 Languages | 2026-06-19, and Claude | IN | Couples | 6 Languages | 2026-06-19 unless their purpose is strictly awareness or traffic.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix landing page view and attribution tracking before scaling traffic            </h3>            <p>              <strong>Why:</strong>              Account-level landing page views were only 1,411,129 from 5,612,911 link clicks, and several campaigns show extreme click-to-LPV gaps or inconsistent click data.            </p>            <p>              <strong>Do this:</strong>              Audit pixel/CAPI setup, landing page load speed, URL redirects, UTM continuity, and event firing for Landing Page View, Lead, and Purchase before increasing spend on traffic campaigns.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Consolidate fragmented follow/like campaigns            </h3>            <p>              <strong>Why:</strong>              Many Aquaverse India Daily Follows Likes campaigns are split by date and audience with similar names, small or duplicated delivery, and limited lead or purchase contribution.            </p>            <p>              <strong>Do this:</strong>              Consolidate active follow/like activity into fewer campaigns by objective and audience group; keep only audiences with meaningful results and separate follower growth from lead generation budgets.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Best qualified lead generator among traffic campaigns with strong messaging depth.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,718.69 spend, 37 leads, 37,524 link clicks, 792 messaging conversations started, 776 messaging first replies, and 651 messaging conversation replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Test the same creative/message in a dedicated lead or messaging objective campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging performance from modest spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,689.03 spend, 25 leads, 38,114 link clicks, 281 landing page views, 696 messaging conversations started, and 672 messaging first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Build a Malayalam-specific lead/messaging test using this creative angle.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Strongest combined lead, messaging, and purchase signal, although purchase volume is still below decision threshold.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,488.72 spend, 17 leads, 1 purchase, 2,716 link clicks, 381 messaging conversations started, 559 total messaging connections, and 372 messaging first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Do not judge purchase performance yet because only 1 purchase is below the minimum of 3 results.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13            </h3>            <p>              Generated enough lead volume for evaluation and produced efficient click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,277.12 spend, 4 leads, 51,900 link clicks, 110 messaging conversations started, and 106 messaging first replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a secondary lead/messaging test, but investigate why only 26 landing page views were recorded from 51,900 link clicks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Very strong traffic and reach campaign, but not a lead generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 26,136.51 spend, 13,016,415 impressions, 941,862 link clicks, 252,948 landing page views, and 7.36% CTR, with no recorded leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is awareness or top-of-funnel traffic. Add retargeting from its landing page views instead of scaling it for leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient traffic campaign with high click and landing page view volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 15,188.93 spend, 556,075 link clicks, 141,244 landing page views, and 7.71% CTR, with no recorded leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as top-of-funnel traffic only. Use its engaged traffic for retargeting rather than expecting direct leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Effective follower/page engagement campaign for its own objective.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 37,661.56 spend, 27,954 likes, 689,603 page engagements, 572,471 video views, and 4.54% CTR.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth remains a separate objective. Do not fund it from the lead or ticket-sales budget.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Major budget concentration with no recorded leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 281,960.68 spend, 930,257 link clicks, 207,080 landing page views, 12,136,552 video views, 6 messaging conversations started, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce significantly or rebuild. If corporates are important, relaunch with a lead objective, corporate-specific offer, and form or message qualification.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend and high traffic volume but no lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 117,898.89 spend, 391,415 link clicks, 105,526 landing page views, 4,767,798 video views, 2 messaging conversations started, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild before adding budget. Use a conversion or lead objective rather than pure traffic/video delivery.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Large spend with no leads despite meaningful traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 73,419.68 spend, 215,860 link clicks, 67,150 landing page views, 2,189,872 video views, 3 messaging conversations started, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and test a family-specific lead or ticket intent offer.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              Large spend with traffic but no lead or purchase output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 71,222.11 spend, 264,785 link clicks, 73,922 landing page views, 2,742,681 video views, 3 messaging conversations started, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild with stronger conversion intent and retargeting.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19            </h3>            <p>              High traffic and video engagement but no lead capture.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 71,515.63 spend, 353,742 link clicks, 109,385 landing page views, 3,442,223 video views, 5 messaging conversations started, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only as awareness/traffic if needed; otherwise move budget into campaigns with proven leads.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Automation Test Campaign            </h3>            <p>              Very weak traffic quality and tracking signal.            </p>            <div
