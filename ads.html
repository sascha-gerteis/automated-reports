 repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-31        →        2026-09-29      </span>      <span class=&quot;pill&quot;>        8 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 23,227.32</strong>        <small>          2026-08-31          to          2026-09-29        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>479,015</strong>        <small>          1,423,903 impressions          ·          2.97 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>878</strong>        <small>          3.38% CTR          ·          THB 0.48 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 16.31</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated strong awareness and follower/engagement volume, but the account is not currently proving progress toward profitable ticket sales or qualified leads. Spend was 23,227.32 THB, producing 1,423,903 impressions, 479,015 reach, 878 link clicks, 17 landing page views, 1 messaging conversation started, and no reported leads, purchases, purchase value, or ROAS. Awareness performance is strongest in AQ_MU2025_Followers_IN, while lower-funnel traffic, messaging, and sales tracking are weak or incomplete.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix lower-funnel tracking before scaling sales or lead spend            </h3>            <p>              <strong>Why:</strong>              The account reports 878 link clicks but only 17 landing page views, a very low click-to-landing-page-view continuation rate. No leads, purchases, purchase value, or ROAS are reported.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, landing page load, URL parameters, purchase event, lead event, and messaging event setup before increasing ticket-sale or lead-generation budget.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Pause or heavily reduce the duplicated ERROR QUARANTINED campaigns            </h3>            <p>              <strong>Why:</strong>              The five duplicated ERROR QUARANTINED campaigns spent 2,173.60 THB combined, generated 430 likes, 12,410 post engagements, 0 inline link clicks, and had much higher CPMs around 35.51-39.38 THB versus AQ_MU2025_Followers_IN at 16.59 THB.            </p>            <p>              <strong>Do this:</strong>              Pause the five campaigns named ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination and consolidate budget into one clean follower/engagement campaign or a controlled traffic/lead test after tracking is fixed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN for awareness, but do not treat it as a sales driver            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN drove the bulk of awareness volume with 292,338 post engagements, 18,110 likes, and 261,217 video views, but it spent 19,394.56 THB and produced only 65 inline link clicks with no landing page views, leads, or purchases reported.            </p>            <p>              <strong>Do this:</strong>              Keep it as a capped awareness/follower campaign, but shift incremental budget away from it until lower-funnel campaigns can record leads or purchases.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Repair the Instagram Followers traffic and messaging path            </h3>            <p>              <strong>Why:</strong>              Aquaverse India | Instagram Followers | 2026-09-27 produced 813 link clicks and 17 landing page views, but also 131 messaging blocks and only 1 messaging conversation started.            </p>            <p>              <strong>Do this:</strong>              Review the destination, page load speed, message entry flow, and automated replies. Do not scale this campaign until landing page views and qualified message starts improve.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strongest awareness and engagement engine in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 19,394.56 THB and generated 1,168,897 impressions, 278,532 reach, 292,338 post engagements, 18,110 likes, 2,437 comments, 799 saves, and 261,217 video views. Cost per like was approximately 1.07 THB and cost per post engagement was approximately 0.07 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active for awareness/follower growth, but cap budget because it is not producing measurable leads, purchases, or meaningful site traffic.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Best campaign for low-cost reach and link-click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 1,058.25 THB, reached 160,564 people, delivered 190,622 impressions at 5.55 THB CPM, and generated 813 link clicks at approximately 1.30 THB per link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a controlled traffic test, but only scale after landing page view tracking and messaging quality are fixed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Generated high click engagement and reasonable follower/like volume from a smaller spend base.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent 600.91 THB, generated 562 clicks, 422 likes, 70 comments, and 901 video views. CTR was 9.63%, the highest campaign CTR in the data.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Continue monitoring, but do not scale aggressively because CPM was 103.02 THB and there were 0 inline link clicks.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Duplicated quarantined campaigns are inefficient versus the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across the five duplicated campaigns, spend was 2,173.60 THB for 430 likes, 12,410 post engagements, and 0 inline link clicks. Weighted CPM was approximately 37.12 THB, more than double AQ_MU2025_Followers_IN at 16.59 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or heavily reduce these duplicate quarantined campaigns and consolidate delivery into one clean campaign structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Not working as a traffic, lead, or purchase campaign despite strong awareness output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              It consumed 83.5% of total spend and generated only 65 inline link clicks, with no landing page views, leads, purchases, purchase value, or ROAS reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep for awareness only. Move incremental sales/lead budget into a dedicated lower-funnel campaign after tracking is validated.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality or tracking is weak after the click.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              813 link clicks produced only 17 landing page views, and messaging results were 131 blocks versus only 1 messaging conversation started and 1 first reply.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit destination loading, Meta Pixel/CAPI, UTMs, messaging automation, and audience intent before increasing spend.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              High engagement CTR but expensive delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CTR was 9.63%, but CPM was 103.02 THB and spend of 600.91 THB produced 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only if the objective is followers/engagement. Do not use it for ticket sales or lead generation without rebuilding the objective and destination.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Tracking-fixed lower-funnel traffic, lead, messaging, or purchase test              </strong>            </div>            <p>              The duplicated quarantined campaigns spent 2,173.60 THB with 0 inline link clicks and higher CPMs than AQ_MU2025_Followers_IN.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Incremental budget currently going to AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                A dedicated ticket sales or qualified lead campaign after Pixel/CAPI and event tracking are verified              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is efficient for engagement, but it used 83.5% of spend and did not report leads, purchases, landing page views, or ROAS.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN for awareness or a new controlled lower-funnel test              </strong>            </div>            <p>              The campaign had strong CTR but a very high 103.02 THB CPM and 0 inline link clicks, making it unsuitable for lower-funnel goals in its current form.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current broad follower/like-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Limited-budget landing page view, lead, message, and purchase tracking validation tests              </strong>            </div>            <p>              The account goal is ticket sales and qualified leads, but current delivery is concentrated in follower/engagement campaigns with no reported lead or purchase outcomes.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing page view tracking validation test            </h3>            <p>              <strong>Setup:</strong>              Run a small traffic test using the same destination from Aquaverse India | Instagram Followers | 2026-09-27. Compare Meta link clicks, landing page views, Pixel events, and analytics sessions by UTM.            </p>            <p>              <strong>Success metric:</strong>              Landing page views should record consistently after link clicks; make no final decision until at least 3 landing page views are recorded per test variant.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Qualified messaging flow test            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated messaging campaign or ad set with clear qualification copy, a direct message CTA, and reviewed automated replies. Exclude users who already blocked messaging if possible.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, and block rate. Do not judge performance until at least 3 messaging conversations are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Follower campaign consolidation test            </h3>            <p>              <strong>Setup:</strong>              Run one clean follower/engagement campaign against AQ_MU2025_Followers_IN and exclude the ERROR QUARANTINED duplicates.            </p>            <p>              <strong>Success metric:</strong>              Cost per like, cost per post engagement, CPM, and frequency compared against AQ_MU2025_Followers_IN.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Ticket sales event test            </h3>            <p>              <strong>Setup:</strong>              After purchase tracking is confirmed, launch a small purchase-optimized ticket sales test with verified purchase event firing and UTMs.            </p>            <p>              <strong>Success metric:</strong>              Purchases, cost per purchase, and ROAS. Do not make a scale or pause decision until at least 3 purchases are recorded.            </p>          </div>            </div>
