t(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-04        →        2026-10-03      </span>      <span class=&quot;pill&quot;>        3 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 21,512.77</strong>        <small>          2026-09-04          to          2026-10-03        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>610,731</strong>        <small>          1,565,213 impressions          ·          2.56 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>2,119</strong>        <small>          3.14% CTR          ·          THB 0.44 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 13.74</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account spent 21,512.77 THB and generated strong upper-funnel volume: 1,565,213 impressions, 610,731 reach, 273,087 page engagements, 223,012 video views, and 2,119 inline link clicks. However, the business goal is profitable ticket sales and qualified leads, and the data shows no reported purchases, no reported lead events, only 33 landing page views, and only 1 messaging conversation started. Most spend is concentrated in follower/engagement campaigns, especially AQ_MU2025_Followers_IN, which drove large engagement volume but almost no traffic toward sales or lead outcomes.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from follower-only delivery toward traffic, lead, messaging, or purchase intent campaigns            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN used 17,294.86 THB, 80.4% of spend, but generated only 56 inline link clicks, no landing page views, no messaging conversations, no leads, and no purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce AQ_MU2025_Followers_IN to a smaller awareness/engagement support budget and reallocate freed spend into campaigns optimized for landing page views, leads, messaging conversations, or purchase events once tracking is verified.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix landing page view and conversion tracking before scaling sales activity            </h3>            <p>              <strong>Why:</strong>              The account generated 2,119 inline link clicks but only 33 landing page views, a 1.6% link-click-to-LPV rate. This is too large a drop-off to confidently judge traffic quality or sales performance.            </p>            <p>              <strong>Do this:</strong>              Audit Meta Pixel, landing page view event firing, domain setup, page load speed, UTM consistency, and whether clicks are going to an in-app destination instead of a tracked website page.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              <strong>Why:</strong>              This campaign spent 1,242.36 THB with 12,652 impressions, high CPM of 98.19 THB, CPC of 1.09 THB, and 0 inline link clicks. It is not supporting ticket sales or lead generation and is less efficient than the main follower campaign for engagement.            </p>            <p>              <strong>Do this:</strong>              Do not scale this setup. Rebuild with a clearer objective and destination: either engagement/follows only with lower budget, or a traffic/lead objective if the goal is ticket sales or enquiries.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Use Aquaverse India | Instagram Followers | 2026-09-27 as the current traffic learning source, but scale carefully            </h3>            <p>              <strong>Why:</strong>              This campaign produced 2,072 of the account&amp;#039;s 2,119 inline link clicks at 2,975.55 THB spend, with low CPM of 5.55 THB and low CPC of 0.28 THB. However, it only produced 33 landing page views and 1 messaging conversation.            </p>            <p>              <strong>Do this:</strong>              Keep active for controlled testing, but do not aggressively increase spend until the landing page view issue is solved and downstream lead or purchase events are visible.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness, engagement, and video-view volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              17,294.86 THB spend delivered 1,016,046 impressions, 247,348 reach, 265,670 page engagements, 249,274 post engagements, 220,954 video views, 16,396 likes, and 23,417 post reactions. Cost per page engagement was approximately 0.07 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as an awareness/follower growth layer. Reduce its share of total spend because it is not driving meaningful traffic, leads, or purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Best campaign for traffic volume and reach efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              2,975.55 THB spend generated 536,515 impressions, 361,827 reach, 2,072 inline link clicks, CPM of 5.55 THB, CPC of 0.28 THB, and frequency of 1.48.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as the primary traffic learning campaign, but optimize toward landing page views or lead/purchase events instead of only follower-oriented delivery.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Useful source of warm audiences for retargeting.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The campaign created 220,954 video views, 249,274 post engagements, 23,417 post reactions, 2,225 comments, and 737 post saves.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Build retargeting audiences from video viewers, post engagers, page engagers, and Instagram profile engagers, then test lead/ticket campaigns against these warm audiences.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              High spend is not translating into traffic, leads, messaging, or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              80.4% of account spend went to this campaign, but it generated only 56 inline link clicks from 17,294.86 THB spend, approximately 308.84 THB per inline link click. No landing page views, no messaging conversations, no leads, and no purchases were reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and reposition as awareness only. Do not use this campaign as the main engine for ticket sales or qualified leads.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Inefficient versus the other follower activity and not driving link traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,242.36 THB spend generated 0 inline link clicks, CPM of 98.19 THB, CPC of 1.09 THB, and only 12,652 impressions. Cost per page engagement was approximately 0.34 THB, compared with approximately 0.07 THB for AQ_MU2025_Followers_IN.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. If the objective is follows/likes, test new audience and creative. If the objective is sales/leads, replace with a traffic, lead, messaging, or purchase-focused campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic volume is strong, but landing page quality or tracking is weak.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The campaign generated 2,072 inline link clicks but only 33 landing page views, approximately 1.6% of inline link clicks becoming landing page views. It also recorded 228 messaging blocks but only 1 messaging conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Investigate destination, tracking, page load, and messaging setup before scaling. If confirmed accurate, improve landing page load speed and message flow quality.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Landing page view, lead, messaging, or purchase-intent campaigns              </strong>            </div>            <p>              This campaign consumed 17,294.86 THB but delivered only 56 inline link clicks and no reported leads or purchases. It should not hold 80.4% of budget when the business goal is ticket sales and qualified leads.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27 or a rebuilt traffic/lead test              </strong>            </div>            <p>              The Daily Follows Likes campaign has high CPM of 98.19 THB and 0 inline link clicks, while Aquaverse India | Instagram Followers | 2026-09-27 generated 2,072 inline link clicks, CPM of 5.55 THB, and CPC of 0.28 THB.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Warm-audience retargeting using AQ_MU2025_Followers_IN engagers and video viewers              </strong>            </div>            <p>              AQ_MU2025_Followers_IN created large warm pools: 220,954 video views, 249,274 post engagements, and 265,670 page engagements. These users should be tested for ticket sales or enquiries instead of continuing to only buy more engagement.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing page view optimization test            </h3>            <p>              <strong>Setup:</strong>              Create a traffic campaign optimized for landing page views using the best-performing creative from Aquaverse India | Instagram Followers | 2026-09-27. Run against the same India audience and compare to the current follower/traffic setup.            </p>            <p>              <strong>Success metric:</strong>              Cost per landing page view and landing-page-view-to-inline-link-click rate. Do not make a final decision until at least 3 landing page views are recorded per variant.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Warm retargeting ticket or lead campaign            </h3>            <p>              <strong>Setup:</strong>              Create retargeting ad sets for video viewers, post engagers, page engagers, and Instagram engagers from AQ_MU2025_Followers_IN. Send users to a tracked ticket or enquiry destination.            </p>            <p>              <strong>Success metric:</strong>              Reported leads, purchases, or messaging conversations. Respect the minimum of 3 results before judging a variant.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Messaging qualification flow test            </h3>            <p>              <strong>Setup:</strong>              Launch a click-to-message campaign with a clear ticket/enquiry CTA and structured quick replies. Exclude users who previously blocked messaging if possible.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, and block volume. Current data has only 1 conversation and 228 messaging blocks, so messaging quality must be validated.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Creative intent test            </h3>            <p>              <strong>Setup:</strong>              Test follower/brand creative against direct-response ticket/enquiry creative in separate ad sets with the same audience and budget.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, landing page views, leads, purchases, or qualified messaging conversations. Avoid judging purchase or lead performance until at least 3 results are recorded.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>{&amp;quot;issue&amp;quot;:&amp;quot;Very low landing page view volume versus link clicks&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;2,119 inline link clicks but only 33 landing page views account-wide, a 1.6% link-click-to-LPV rate.&amp;quot;,&amp;quot;recommended_fix&amp;quot;:&amp;quot;Audit Pixel installation, landing page view event firing, destination URLs, page load speed, Meta in-app browser behavior, redirects, and UTM setup.&amp;quot;}</li><li>{&amp;quot;issue&amp;quot;:&amp;q
