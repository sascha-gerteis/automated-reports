    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 391,430.58</strong>        <small>          2026-07-05          to          2026-08-03        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>8,935,857</strong>        <small>          25,119,867 impressions          ·          2.81 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>441,845</strong>        <small>          2.75% CTR          ·          THB 0.57 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>30</strong>        <small>          THB 13,047.69 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>8</strong>        <small>          THB 48,928.82 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 3,476.00        </strong>        <small>          0.01× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>158</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 15.58</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large reach and traffic, but bottom-funnel performance is weak and concentrated in one post. Total spend was THB 391,430.58 for 441,845 link clicks, 45,446 omni landing page views, 10 leads, 8 purchases, and THB 3,476 purchase value. Account-level cost per purchase was THB 48,928.82 and cost per lead was THB 39,143.06, but most campaigns do not have enough purchase or lead results to make confident conversion decisions. The strongest result is from Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;, which produced 7 leads, 4 purchases, and 37 messaging conversations from only THB 1,881.62 spend.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the only proven conversion and messaging winner            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; is the only campaign above the minimum decision threshold for purchases and leads, with 7 leads, 4 purchases, 37 messaging conversations, and THB 2,176 purchase value from THB 1,881.62 spend.            </p>            <p>              <strong>Do this:</strong>              Duplicate this post into a controlled campaign structure: one messaging campaign, one lead campaign, and one purchase/traffic retargeting campaign. Increase budget gradually and monitor lead quality, purchase count, and messaging conversation quality.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce budget from click-heavy campaigns with poor landing page delivery            </h3>            <p>              <strong>Why:</strong>              Several campaigns generate high link clicks but very low landing page views, indicating poor traffic quality or tracking issues. Example: Claude | TH | Traffic IMAGES | 18Jun had 104,412 link clicks but only 3,814 landing page views, a 3.7% LPV-to-link-click rate.            </p>            <p>              <strong>Do this:</strong>              Reduce spend on campaigns with weak LPV delivery and rebuild them to optimize for landing page views or higher-intent events instead of link clicks.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild B2B lead generation campaigns            </h3>            <p>              <strong>Why:</strong>              Aquaverse Corporate Groups - Leads - Test spent THB 11,305.31 with 0 leads and only 69 landing page views from 1,686 link clicks. TH | B2B Corporate | Video | Leads | 2026-06-18 spent THB 11,555.78 with 0 leads and frequency 4.83.            </p>            <p>              <strong>Do this:</strong>              Stop scaling the current B2B lead setup. Rebuild using clearer corporate offer copy, Instant Forms or Messenger qualification, and separate ad sets for corporate groups, HR/team building, schools, and event planners.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking before judging purchase campaigns            </h3>            <p>              <strong>Why:</strong>              The account recorded 441,845 link clicks but only 45,446 omni landing page views, and only 8 purchases. Some zero-impression campaigns still show messaging actions, and multiple campaigns show very large link-click-to-LPV drop-offs.            </p>            <p>              <strong>Do this:</strong>              Check pixel/CAPI setup, landing page load speed, UTM consistency, marketplace tracking, purchase event mapping, and whether app/site visits from Shopee/Lazada are being passed back correctly.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Reduce follower campaigns if the main goal is ticket sales and leads            </h3>            <p>              <strong>Why:</strong>              FB Follow | Thailand | Aquaverse Lifestyle and FB Follow | Thailand | Lookalike Fans Scale spent THB 84,472.04 combined and produced only 13 page likes, with no purchases or leads reported.            </p>            <p>              <strong>Do this:</strong>              Keep only a small awareness/community budget for follower growth. Reallocate the majority of this spend to proven messaging, lead, and high-quality traffic campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best full-funnel performer across leads, purchases, and messaging.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 1,881.62; 7 leads; 4 purchases; THB 2,176 purchase value; 37 messaging conversations started; 49 total messaging connections.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale. Use this post as the primary creative/control for new messaging, lead, and retargeting tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Conversions Shopee | 12Jun            </h3>            <p>              Strong traffic quality for a marketplace campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 5,055.10; 7,021 link clicks; 3,860 landing page views; CTR 8.01%; cost per landing page view about THB 1.31.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and test incremental budget, but do not judge by purchases unless Shopee purchase tracking is confirmed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Corporates | Thai | 2026-06-19            </h3>            <p>              Strong B2B traffic quality compared with other corporate campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 4,011.79; 5,443 link clicks; 3,202 landing page views; CTR 8.07%; cost per landing page view about THB 1.25.            </div x;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-05        →        2026-08-03      </span>      <span class=&quot;pill&quot;>        83 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,132,119.73</strong>        <small>          2026-07-05          to          2026-08-03        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>63,626,730</strong>        <small>          149,923,119 impressions          ·          2.36 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>3,831,493</strong>        <small>          3.05% CTR          ·          THB 0.25 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>231</strong>        <small>          THB 4,900.95 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 566,059.87 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1,972</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.55</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account delivery is strong for reach, clicks, landing page views, video views, engagement, and messaging, but weak for the stated business goal of profitable ticket sales and qualified leads. Spend was 1,132,119.73 THB, generating 3,831,493 link clicks, 1,260,291 landing page views, 1,972 messaging conversations started, 77 leads, and 2 purchases. Because purchase volume is below the minimum_results_before_decision of 3 and no revenue/ROAS target is provided, purchase performance cannot be judged reliably. Lead volume is concentrated in a few campaigns: Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13, and Claude | IN | English | India Show 2025 | Traffic | 2026-06-13.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead and messaging winners            </h3>            <p>              <strong>Why:</strong>              The best lead/messaging campaigns generated materially more qualified actions at much lower cost than the rest of the account.            </p>            <p>              <strong>Do this:</strong>              Carefully scale Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13, and Claude | IN | English | India Show 2025 | Traffic | 2026-06-13 by 20-30% budget increases, then reassess after each reaches at least 3 additional leads.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce large traffic/video campaigns that are not creating leads            </h3>            <p>              <strong>Why:</strong>              Several high-spend traffic/video campaigns delivered large click, LPV, and video volume but no leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce prospecting budget on Claude | IN | Corporates | 6 Languages | 2026-06-19, Claude | IN | Corporates | 5 Languages | 2026-06-19, Claude | IN | Families | 6 Languages | 2026-06-19, Claude | IN | Singles | 6 Languages | 2026-06-19, and Claude | IN | Couples | 6 Languages | 2026-06-19; rebuild them as lead, messaging, or retargeting campaigns instead of broad traffic/video campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness/follower budget from sales/lead budget            </h3>            <p>              <strong>Why:</strong>              Follower and engagement campaigns are producing page engagement and likes, but very little link traffic or qualified action.            </p>            <p>              <strong>Do this:</strong>              Keep follower campaigns only if page growth is a current objective. If ticket sales and qualified leads are the priority, cap awareness/follower spend and move incremental budget into lead/messaging and retargeting campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking before judging purchase performance            </h3>            <p>              <strong>Why:</strong>              Purchases total only 2, below the decision threshold of 3, and daily reporting shows actions on days with 0 impressions, 0 clicks, and 0 spend.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI event timing, attribution windows, landing page view firing, and event deduplication before making purchase-based budget decisions.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Build retargeting from high-volume traffic winners            </h3>            <p>              <strong>Why:</strong>              Several traffic campaigns generated very cheap clicks and landing page views but little direct lead volume.            </p>            <p>              <strong>Do this:</strong>              Create retargeting audiences from landing page viewers, link clickers, video viewers, messaging engagers, and post engagers; run lead/messaging/ticket-offer campaigns to these audiences.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best full-funnel performer in the data for leads and messaging, with one purchase also recorded.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 1,656.41 THB, 15 leads, 1 purchase, 284 messaging conversations started, 277 first replies, 425 total messaging connections, 2,070 link clicks. Cost per lead was approximately 110.43 THB and cost per messaging conversation started was approximately 5.83 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Duplicate the post into structured lead and messaging campaigns, test similar creative angles, and increase budget gradually rather than making a large jump.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging volume from a relatively small budget.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 3,440 THB, 21 leads, 578 messaging conversations started, 557 first replies, 619 total messaging connections, 26,926 link clicks. Cost per lead was approximately 163.81 THB and cost per messaging conversation started was approximately 5.95 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Use this language/creative combination as a template for new messaging and lead campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging campaign with meaningful volume above the decision threshold.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 3,465.32 THB, 20 leads, 478 messaging conversations started, 466 first replies, 531 total messaging connections, 26,187 link clicks. Cost per lead was approximately 173.27 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale carefully. Test additional English creatives based on the India Show 2025 message and route budget into this theme before lower-performing English traffic variants.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Excellent awareness/traffic efficiency and large retargeting pool creation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 17,816.21 THB, 8,619,215 impressions, 626,463 link clicks, 235,819 landing page views, CTR 7.396%, CPC 0.027948 THB, CPM 2.067034 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for awareness and traffic generation, but do not judge it by purchases. Use its landing page viewers and clickers for retargeting into lead/messaging/ticket campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              High-volume, low-cost traffic campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 9,588.93 THB, 343,352 link clicks, 129,330 landing page views, CTR 7.666304%, CPC 0.027401 THB, CPM 2.100669 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an upper-funnel traffic source and retarget the LPV audience. Test the best image formats from this campaign in lead and messaging objectives.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong page-follow/engagement performer when judged as a follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 30,056.19 THB, 22,450 likes, 575,893 page engagements, 61,510 post reactions, 4,628 comments. Approximate cost per like was 1.34 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth is a strategic objective. Do not rely on it for direct ticket sales or leads because it generated 215 link clicks and no leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;Let’s have fun together and make every moment...&amp;quot;            </h3>            <p>              Very strong traffic signal from a small spend base.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 411.01 THB, 3,422 link clicks, 1,318 landing page views, CTR 13.617611%, CPC 0.104636 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not over-scale yet because it has no leads. Re-test this creative in a lead or messaging objective and use it as a retargeting creative.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Large spend is generating traffic/video volume but no leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 197,447.74 THB, 620,879 link clicks, 184,985 landing page views, 8,266,119 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce prospecting budget and rebuild as a corporate lead/messaging campaign with clearer inquiry intent. Retarget its LPV and video-view audiences instead of continuing broad traffic delivery.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend with no lead outcome.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 93,497.40 THB, 297,862 link clicks, 97,760 landing page views, 3,676,948 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and consolidate with the 6-language corporate campaign rebuild. Test lead forms or click-to-message for corporate bookings.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Traffic and video delivery are present, but no lead or purchase outcome.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 56,682.47 THB, 160,100 link clicks, 63,056 landing page views, 1,576,849 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce current broad traffic spend. Rebuild a family-specific offer campaign optimized for lead or messaging actions.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              Good click volume but no lower-funnel result.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 53,924.34 THB, 193,713 link clicks, 67,821 landing page views, 1,942,005 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce as a direct-response prospecting campaign and keep only if needed for awareness/retargeting pool growth.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19            </h3>            <p>              Efficient traffic but no lead capture.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 54,166.15 THB, 262,183 link clicks, 98,580 landing page views, 2,446,348 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep a smaller traffic budget only if retargeting audiences are needed. Test a couples-specific lead/messaging offer before scaling again.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Engagement is high, but qualified outcome efficiency is weak versus the best lead/messaging campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 13,451.45 THB, 1,824,251 post engagements, 1,706,906 video views, 3 leads, 44 messaging conversations started. Cost per lead was appr ndex&quot;>              Test 1            </span>            <h3>              Winning post creative as lead objective            </h3>            <p>              <strong>Setup:</strong>              Duplicate Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot; into a lead campaign using the same creative and a short form. Run against broad, Malayalam, English, and retargeting audiences.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads per ad set, then compare cost per lead and messaging conversation quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Click-to-message version of top language creatives            </h3>            <p>              <strong>Setup:</strong>              Create messaging campaigns using the Malayalam and English India Show creatives. Use automated FAQs for ticket price, location, offers, and group booking.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, depth-3/depth-5 message sends, and leads after at least 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Retargeting ticket-offer funnel            </h3>            <p>              <strong>Setup:</strong>              Retarget landing page viewers from IN_AWR_General_Image_Claude_2026-06-14, Claude | IN | Daily 8 IMAGES MultiLang | 15Jun, and the persona video campaigns with a direct ticket/lead offer.            </p>            <p>              <strong>Success metric:</strong>              Leads, purchases, and cost per purchase once purchase volume reaches at least 3.            </p>          </div>
