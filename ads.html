     2026-08-18        →        2026-09-16      </span>      <span class=&quot;pill&quot;>        16 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 39,245.92</strong>        <small>          2026-08-18          to          2026-09-16        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>2,352,791</strong>        <small>          4,078,252 impressions          ·          1.73 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>112</strong>        <small>          1.62% CTR          ·          THB 0.59 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 9.62</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement volume are strong: 4,078,252 impressions, 2,352,791 reach, 621,890 page engagements, and 25,046 page likes from THB 39,245.92 spend. However, the business goal is profitable ticket sales and qualified leads, and the data shows no purchase events, no lead events, only 112 link clicks, and only 1 messaging conversation. The account is currently optimized mostly for followers/page engagement rather than measurable sales or lead generation.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward measurable lead or purchase campaigns            </h3>            <p>              <strong>Why:</strong>              THB 39,245.92 was spent with no reported leads or purchases and only 112 link clicks. Current campaigns are producing engagement, followers, and video views, not enough traffic or business-result data.            </p>            <p>              <strong>Do this:</strong>              Create dedicated lead, messaging, or purchase campaigns only after confirming tracking. Fund them by reducing spend from duplicated low-efficiency follower campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN, but do not aggressively scale it            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN is the strongest follower/engagement campaign with 22,551 page likes at approximately THB 1.11 per like and 430,722 page engagements at approximately THB 0.06 per engagement. However, it has frequency 4.45 and 2,232 post unlikes.            </p>            <p>              <strong>Do this:</strong>              Keep active for follower growth, refresh creatives/audiences, and cap or reduce budget if frequency continues rising. Do not use this as the primary sales or lead campaign.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce duplicated Broad Destination follower campaigns            </h3>            <p>              <strong>Why:</strong>              Multiple duplicated campaigns named ERROR QUARANTINED | Aquaverse India Daily Follows Likes | 1. Broad Destination are less efficient for page likes than AQ_MU2025_Followers_IN and generated almost no website traffic.            </p>            <p>              <strong>Do this:</strong>              Consolidate these campaigns into one rebuilt follower/engagement test or move their budget into lead/purchase testing. Prioritize only the best variants if follower volume is still needed.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking before judging sales performance            </h3>            <p>              <strong>Why:</strong>              No lead or purchase actions are present, ROAS cannot be calculated, and the account shows 66,129 clicks but only 112 inline link clicks, meaning most clicks are engagement clicks, not website visits.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI, purchase event, lead event, booking/ticket confirmation event, UTMs, and CRM/offline lead tracking before optimizing for profitability.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best-performing follower and engagement campaign by volume and efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 25,132.61, generated 22,551 page likes, 430,722 page engagements, 408,171 post engagements, CTR 3.73%, CPC THB 0.46, and approximately THB 1.11 per page like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active, but scale carefully. Refresh creative and audience to manage frequency 4.45 and 2,232 post unlikes.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Strong awareness delivery at very low CPM and broad reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,639.53 for 2,348,750 impressions, 1,995,498 reach, CPM THB 0.70, frequency 1.18, and 126,041 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as an awareness/top-of-funnel campaign. Do not judge it by purchases or leads because it is not generating traffic or conversion data.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Generated follower actions from a small audience.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,031.16, generated 529 page likes and 1,708 page engagements, approximately THB 1.95 per page like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if Thailand audience growth is strategically needed. Do not scale until CPM improves because CPM was THB 276.15 and reach was only 2,843.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong for followers, weak for traffic and business outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Despite THB 25,132.61 spend and 54,796 total clicks, it produced only 111 inline link clicks and no reported leads or purchases. Cost per inline link click was approximately THB 226.42.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not rely on this campaign for ticket sales or qualified leads. Use it for follower growth only and build separate conversion-focused campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Good awareness, but not useful for traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,639.53 with 2,348,750 impressions but 0 inline link clicks and CTR 0.04%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep small awareness budget only, or rebuild with a traffic/conversion objective if the goal is website visits, leads, or ticket purchases.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Follower acquisition is materially less efficient than AQ_MU2025_Followers_IN.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 4,304.20, generated 762 page likes, approximately THB 5.65 per page like, CPM THB 50.50, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Move budget to AQ_MU2025_Followers_IN or to a new lead/purchase test.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Duplicated campaign structure is inefficient and fragmented.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Three duplicate-name campaigns spent THB 1,487.24, THB 1,022.51, and THB 2,430.56. They generated page likes at approximately THB 7.15, THB 5.11, and THB 6.87 per like respectively, with only 1 total inline link click across the three.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate or pause further spend on these non-winning duplicates. Rebuild as one clear test if follower growth is still required.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Several duplicate campaigns are producing page likes but at weaker efficiency than the main follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Five duplicate-name campaigns spent THB 2,173.60 combined and generated 430 page likes, roughly THB 5.05 per like overall, with 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale this group. If keeping any, retain only the stronger variants such as the THB 352.60 spend version with 88 likes at approximately THB 4.01 per like.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead or purchase campaign              </strong>            </div>            <p>              This campaign spent THB 4,304.20 at approximately THB 5.65 per page like and generated 0 inline link clicks. Budget is better used testing business-goal campaigns.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN or a rebuilt conversion test              </strong>            </div>            <p>              The three duplicate campaigns spent THB 4,940.31 combined and were less efficient for page likes than AQ_MU2025_Followers_IN, while producing only 1 inline link click.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                One consolidated follower test or lead/purchase testing              </strong>            </div>            <p>              The group generated followers but at roughly THB 5.05 per page like overall versus AQ_MU2025_Followers_IN at approximately THB 1.11 per page like.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Maintain, but cap growth budget              </strong>            </div>            <p>              It is the best follower/engagement performer, but it already represents THB 25,132.61 of THB 39,245.92 total spend and has frequency 4.45. Keep it controlled while allocating incremental budget to lead or purchase testing.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Awareness-only allocation              </strong>            </div>            <p>              It is efficient for reach and video views but produced 0 inline link clicks. Keep only if awareness remains a goal.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead generation campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated lead campaign using ticket inquiry or group booking creative. Test at least two audiences: broad India travel audience and retargeting audience from page engagers/video viewers.            </p>            <p>              <strong>Success metric:</strong>              Judge only after at least 3 leads, per the minimum_results_before_decision. Compare cost per lead and lead quality once CRM qualification is available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Purchase/ticket sales tracking test            </h3>            <p>              <strong>Setup:</strong>              Run a small purchase-optimized campaign only after Pixel/CAPI purchase tracking is verified. Use ticket-sale landing page creative with clear price, offer, and CTA.            </p>            <p>              <strong>Success metric:</strong>              Judge only after at least 3 purchases. Track cost per purchase and ROAS once purchase value is available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engagement-to-conversion retargeting test            </h3>            <p>              <strong>Setup:</strong>              Retarget users who engaged with AQ_MU2025_Followers_IN, watched videos, saved posts, commented, or liked the page. Send them to lead, message, or purchase objective campaigns.            </p>            <p>              <strong>Success metric:</strong>              Primary metric should be qualified lead, message conversation, or purchase. Do not judge by post engagement.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Creative CTA test for traffic quality            </h3>            <p>              <strong>Setup:</strong>              Test follower-style creative against direct-response ticket creative. Include clear CTA such as Book Tickets, Plan Your Visit, or Enquire Now.            </p>            <p>              <strong>Success metric:</strong>              Compare inline link clicks, cost per inline link click, and downstream lead/purchase events once tracking is fixed.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No lead actions were reported, so cost per lead cannot be evaluated.</li><li>No purchase actions or purchase value were reported, so cost per purchase and ROAS cannot be evaluated.</li><li>Targets for CPL, CPA, and ROAS are all 0, so there is no profitability benchmark to compare against.</li><li>The account shows 66,129 total clicks but only 112 inline link clicks, indicating most clicks are engagement clicks rather than website visits.</li><li>New post engagement campaign shows 0 impressions, 0 reach, and 0 spend but 1 messaging_welcome_message_view, which should be checked for attribution or reporting inconsistency.</li><li>Messaging has only 1 conversation started, below the minimum_results_before_decision of 3, so messaging performance is insufficient to judge.</li><li>Several campaigns have tiny samples, such as the 2026-08-28 Broad Destination variants with THB 4.26 to THB 7.06 spend, so no pause decision should be made from those results.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep AQ_MU2025_Followers_IN for controlled follower growth, keep Young Adult Travellers only as awareness, reduce or co
