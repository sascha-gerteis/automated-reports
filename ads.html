    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 510,351.33</strong>        <small>          2026-06-22          to          2026-07-21        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>11,028,188</strong>        <small>          37,976,499 impressions          ·          3.44 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>631,633</strong>        <small>          2.59% CTR          ·          THB 0.52 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>33</strong>        <small>          THB 15,465.19 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>6</strong>        <small>          THB 85,058.56 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 2,176.00        </strong>        <small>          0.00× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>289</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 13.44</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Aquaverse spent 510,351.33 THB, generated 631,633 link clicks, 126,516 omni landing page views, 289 messaging conversations started, 11 leads, and 6 purchases with 2,176 THB purchase value. Traffic and engagement volume are strong, but purchase and lead volume are concentrated in a small number of boosted post campaigns. No CPL, CPA, or ROAS targets were supplied, so optimization should be based on relative performance and data quality.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix purchase, lead, and landing page tracking before scaling sales spend            </h3>            <p>              <strong>Why:</strong>              The account recorded 631,633 link clicks but only 126,516 omni landing page views. Purchases are concentrated in post campaigns with very low landing page views, such as Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; with 4 purchases from only 8 landing page views.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI events, purchase event source, lead event mapping, and landing page view firing. Confirm whether Shopee/Lazada purchases are trackable or only clicks can be measured.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the only purchase campaign with enough results            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; produced 4 purchases, 8 leads, 47 messaging conversations started, and 2,176 THB purchase value from 3,018.76 THB spend. It is the only campaign above the minimum 3-result threshold for purchases and leads.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign active and test a controlled budget increase. Duplicate the winning post into a structured sales or messaging campaign rather than scaling all campaigns broadly.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce follower campaigns if the goal is ticket sales and qualified leads            </h3>            <p>              <strong>Why:</strong>              FB Follow | Thailand | Aquaverse Lifestyle spent 50,047.90 THB for 3 likes, and FB Follow | Thailand | Lookalike Fans Scale spent 34,930.00 THB for 8 likes. Combined spend was 84,977.90 THB with only 11 page likes and no purchases or leads.            </p>            <p>              <strong>Do this:</strong>              Cut these campaigns materially or rebuild them with a clearer follower objective and success metric. Reallocate saved budget toward proven messaging, traffic, and conversion tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild corporate lead generation instead of continuing traffic-heavy lead campaigns            </h3>            <p>              <strong>Why:</strong>              TH | B2B Corporate | Video | Leads | 2026-06-18 spent 25,419.90 THB with 13,838 link clicks, 2,258 landing page views, frequency 6.73, and 0 leads. Aquaverse Corporate Groups - Leads - Test spent 12,022.69 THB with 0 leads and only 113 landing page views.            </p>            <p>              <strong>Do this:</strong>              Reduce current corporate lead campaigns and rebuild using Instant Forms or Click-to-Message with qualification questions. Separate B2B lead campaigns from engagement/video objectives.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Consolidate traffic budget into campaigns with stronger landing page efficiency            </h3>            <p>              <strong>Why:</strong>              Several traffic campaigns generate high clicks but weak landing page follow-through. Aquaverse TH | Hot Weather Escape | Ticket Sales | 2026-06-25 had 10,912 link clicks but only 363 landing page views.            </p>            <p>              <strong>Do this:</strong>              Move traffic budget away from weak click-to-LPV campaigns and into stronger variants such as Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026 and TH | Traffic | Audiences (Family/Couple/Group) [Claude build].            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best purchase, lead, and messaging performer with enough results to make a decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 3,018.76 THB; 4 purchases; 8 leads; 47 messaging conversations started; 253 link clicks; purchase value 2,176 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale. Reuse the creative and offer in a structured sales, lead, and message test.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;หมุนกันกี่รอบ...ก็สนุกไม่เปลี่ยน💦&amp;quot;            </h3>            <p>              Strong messaging response and early purchase/lead signal, but purchase and lead volume are below the 3-result decision threshold.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 846.05 THB; 55 messaging conversations started; 1 purchase; 1 lead; 136 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not pause. Continue testing at controlled spend and use it as a messaging creative benchmark.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Instagram post: หมุนกันกี่รอบ...ก็สนุกไม่เปลี่ยน💦...            </h3>            <p>              Efficient messaging campaign despite limited website traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 1,221.18 THB; 40 messaging conversations started; 75 link clicks; 1 landing page view.            </div>            < ackground: #edf1f7;    color: #5f6d84;    font-size: 10px;    font-weight: 700;    text-transform: uppercase;  }  .priority-high {    border-top: 4px solid #dc2626;  }  .priority-medium {    border-top: 4px solid #f59e0b;  }  .priority-low {    border-top: 4px solid #16a34a;  }  .finding-grid {    display: grid;    grid-template-columns: repeat(2, minmax(0, 1fr));    gap: 14px;  }  .finding {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .finding.positive {    border-left: 5px solid #16a34a;  }  .finding.negative {    border-left: 5px solid #dc2626;  }  .finding h3 {    margin: 0 0 8px;    font-size: 16px;  }  .finding p {    margin: 0 0 10px;    color: #526077;  }  .evidence,  .recommendation {    font-size: 13px;    margin-top: 7px;    color: #445168;  }  .budget-row {    display: grid;    grid-template-columns: 1fr 40px 1fr;    gap: 12px;    align-items: center;    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-06-22        →        2026-07-21      </span>      <span class=&quot;pill&quot;>        95 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 1,728,853.69</strong>        <small>          2026-06-22          to          2026-07-21        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>91,609,569</strong>        <small>          237,705,635 impressions          ·          2.59 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>6,734,636</strong>        <small>          3.29% CTR          ·          THB 0.22 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>381</strong>        <small>          THB 4,537.67 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 864,426.85 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>3,465</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.27</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Aquaverse spent THB 1,728,853.69 and generated very large upper-funnel volume: 237,705,635 impressions, 6,734,636 link clicks, 1,521,013 landing page views, 3,465 messaging conversations started, 127 leads, and 2 purchases. Lead generation is concentrated in a small number of campaigns, while a large share of spend is going to traffic, video, follower, and engagement campaigns that are not producing leads or purchases. Purchase data is insufficient because only 2 purchases were recorded versus the minimum decision threshold of 3.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking before scaling conversion campaigns            </h3>            <p>              <strong>Why:</strong>              Several campaigns show extreme link-click to landing-page-view gaps, and daily data shows attributed actions on 2026-07-17 to 2026-07-21 despite zero spend, impressions, clicks, and reach.            </p>            <p>              <strong>Do this:</strong>              Check Pixel/CAPI events, landing page view firing, app/web purchase event deduplication, UTMs, and destination URLs for campaigns with link clicks but almost no landing page views.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale proven lead and messaging campaigns            </h3>            <p>              <strong>Why:</strong>              Lead and messaging results are concentrated in a few campaigns with enough lead volume to evaluate.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually on Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13 by 20% to 30% at a time while monitoring leads and messaging depth.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on high-spend traffic/video campaigns with little or no lead output            </h3>            <p>              <strong>Why:</strong>              Several large campaigns generated hundreds of thousands of clicks and landing page views but almost no leads.            </p>            <p>              <strong>Do this:</strong>              Cut or cap budget on Claude | IN | Corporates | 6 Languages | 2026-06-19, Claude | IN | Corporates | 5 Languages | 2026-06-19, and the Couples/Families/Singles/Party Goers 5- and 6-language campaigns unless their role is strictly awareness.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Separate awareness, traffic, lead, messaging, and purchase budgets            </h3>            <p>              <strong>Why:</strong>              Follower and engagement campaigns are producing likes and engagement, but they should not consume budget intended for ticket sales or qualified leads.            </p>            <p>              <strong>Do this:</strong>              Create distinct budget pools: capped awareness/follower budget, traffic/retargeting budget, and primary lead/messaging budget. Do not evaluate awareness campaigns by purchases unless purchase optimization is the objective.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Do not make purchase scaling decisions yet            </h3>            <p>              <strong>Why:</strong>              Only 2 purchases were recorded across the account, below the minimum_results_before_decision of 3.            </p>            <p>              <strong>Do this:</strong>              Use leads, messaging conversations, and landing page views for near-term optimization. Wait for at least 3 purchase events before making purchase-based decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best lead and messaging performer in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,488.72 spend, 17 leads, 1 purchase, 381 messaging conversations started, 559 total messaging connections, 372 messaging first replies, 2,716 link clicks. CPL was THB 146.40. Purchase count is only 1, so do not judge purchase performance yet.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and carefully scale. Duplicate the creative into a structured lead or messaging campaign and test broader audiences and retargeting.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging volume from low spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,429.51 spend, 47 leads, 986 messaging conversations started, 1,079 total messaging connections, 969 messaging first replies, 44,064 link clicks. CPL was THB 115.52.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and scale cautiously. Use this creative/message angle as a control for new lead and messaging tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong regional-language lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,402.31 spend, 26 leads, 823 messaging conversations started, 886 total messaging connections, 798 messaging first replies, 44,669 link clicks. CPL was THB 207.78.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Test similar Malayalam creative variations and retarget engaged users.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Tamil | 03 India Urgent | Traffic | 2026-06-13            </h3>            <p>              Generated qualified lead volume at modest spend, but tracking looks inconsistent.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,899.96 spend, 6 leads, 131 messaging conversations started, 63,883 link clicks, but only 27 landing page views. CPL was THB 649.99.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep testing but fix tracking before scaling materially.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Strong traffic/awareness efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 32,106.28 spend, 16,122,437 impressions, 1,177,111 link clicks, 264,834 landing page views, CTR 7.42%, CPM THB 1.99, and CPC THB 0.03. No leads recorded.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as awareness/traffic or retargeting-pool builder. Do not treat it as a lead generator unless rebuilt for lead optimization.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Efficient traffic generator.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 19,819.36 spend, 741,494 link clicks, 151,101 landing page views, CTR 7.81%, CPC THB 0.03. No leads recorded.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as low-cost traffic if landing page visitors are being retargeted. Add retargeting from these visitors into lead/message campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower/page-like campaign relative to other follower campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 49,928.59 spend, 37,451 page likes, 790,392 page engagements, 94,899 post reactions, 643,548 video views. Cost per page like was THB 1.33.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if follower growth is a goal, but cap frequency because frequency is 3.83.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very cheap awareness reach, but not a traffic or lead driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 20,257.10 spend, 27,743,913 impressions, CPM THB 0.73, 1,610,421 video views, 1,631,691 post engagements, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if awareness is required. Do not allocate lead or ticket-sales budget here.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Very high spend with almost no lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 306,594.40 spend, 1 lead, 1,030,910 link clicks, 216,618 landing page views, 13,167,564 video views, and 14,228,896 post engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce sharply or pause conversion-budget allocation. Rebuild separately for corporate lead capture with a clear form/message CTA if corporate leads are the goal.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Large traffic volume without lead conversion.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 125,873.57 spend, 0 leads, 430,129 link clicks, 109,075 landing page views, 5,087,129 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Use its visitors for retargeting instead of continuing broad traffic spend.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 6 Languages | 2026-06-19; Claude | IN | Families | 6 Languages | 2026-06-19; Claude | IN | Singles | 6 Languages | 2026-06-19            </h3>            <p>              High-spend traffic/video campaigns are not producing leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Couples 6 Languages spent THB 80,213.01 with 0 leads and 116,819 landing page views. Families 6 Languages spent THB 81,947.37 with 0 leads and 71,021 landing page views. Singles 6 Languages spent THB 80,158.20 with 0 leads and 79,181 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce conversion-budget allocation. Keep only if their job is awareness or retargeting-pool growth.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Couples | 5 Languages | 2026-06-19; Claude | IN | Families | 5 Languages | 2026-06-19; Claude | IN | Singles | 5 Languages | 2026-06-19; Claude | IN | Party Goers | 5 Languages | 2026-06-19            </h3>            <p>              Traffic volume is present, but lead output is absent.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Combined spend was THB 86,364.26 across these four campaigns with 0 leads. They generated 281,477 landing page views combined.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale for leads. Retarget visitors and rebuild winning audience/creative combinations into lead or messaging campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Automation Test Campaign            </h3>            <p>              Poor traffic quality and likely tracking/destination issue.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,707.62 spend, 5,256,293 impressions, CTR 0.073%, 1,750 link clicks, only 1 landing page view, 0 leads, and 2 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild after verifying destination URL and event tracking.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              IG Follow | India | Lookalike Scale            </h3>            <p>              Not efficient as a lead or landing-page campaign despite some lead volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 25,606.72 spend, 4 leads, 2,670 link clicks, only 1 landing page view, 291 messaging conversations started, and 302 total messaging connections.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale until tracking is fixed. If the campaign goal is messaging/following, evaluate by messaging connections instead of landing page views.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-27 | 4. Young Adult Travellers; Aquaverse India Daily Follows Likes 2026-06-27 | 5. Special Interest Mix; Aquaverse India Daily Follows Likes 2026-06-27 | 2. Families; Aquaverse India Daily Follows Likes 2026-06-27 | 1. Broad Destination            </h3>            <p>              Follower campaigns produce likes but very little traffic or lead volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              These campaigns spent THB 70,855.50 combined and produced only 30 inline link clicks and 0 to 1 lead per campaign. Page likes were the main output: 2,844, 3,697, 2,304, and 1,262 respectively.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Cap follower budget and do not use these campaigns for ticket-sales or lead-generation budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              IN | Image | Aquaverse Traffic | Test 1000INR            </h3>            <p>              Good traffic volume but weak lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 42,425.21 spend, 553,051 link clicks, 143,214 landing page views, but only 1 lead.            </div>            <div class=& rsations started, messaging first replies, depth 3 and depth 5 sends, and qualified leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Language and audience split test            </h3>            <p>              <strong>Setup:</strong>              Run equal-budget ad sets for English, Malayalam, Tamil, Marathi, Kannada, and Hindi using the same offer and CTA.            </p>            <p>              <strong>Success metric:</strong>              Cost per lead and messaging depth after each language reaches at least 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Follower efficiency consolidation test            </h3>            <p>              <strong>Setup:</strong>              Compare AQ_MU2025_Followers_IN against the best Daily Follows Likes audience using the same follower objective and capped daily budget.            </p>            <p>              <strong>Success metric:</strong>              Cost per page like and frequency. Keep follower spend separate from lead and ticket-sales spend.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 6            </span>            <h3>              Tracking validation test            </h3>            <p>              <strong>Setup:</strong>              Run a small controlled traffic test with UTMs and verified destination URLs. Compare link clicks, landing page views, leads, and backend form submissions.            </p>            <p>              <strong>Success metric:</strong>              Consistent link-click to landing-page-view reporting and matching lead counts between Meta and backend records.
