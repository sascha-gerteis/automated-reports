 messaging depth, leads, or ticket-sale tracking.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce high-spend follows/likes campaigns that are not producing traffic or leads            </h3>            <p>              <strong>Why:</strong>              The largest spend concentration is in engagement/follows campaigns, especially Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, which spent THB 44,067.90 but produced only 6 inline link clicks, 10 messaging conversation starts and 1 lead.            </p>            <p>              <strong>Do this:</strong>              Cut budget materially on the duplicated Broad Destination follows/likes campaigns and reallocate budget into lead, messaging, traffic and retargeting tests. Do not judge the 1 lead alone because it is below the minimum decision threshold of 3 leads.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep but cap awareness-only spend            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers delivered very cheap awareness with 19,995,477 impressions, 11,042,906 reach and THB 0.67 CPM, but only 3 inline link clicks and 1 messaging conversation ed into lead or ticket-sale campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very efficient awareness delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 13,310.88 spend generated 19,995,477 impressions, 11,042,906 reach, THB 0.67 CPM, 1,126,160 post engagements and 1,112,406 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as an awareness layer. Do not evaluate it by purchases or leads, but also do not let it dominate budget if the goal is qualified leads and ticket sales.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Promising but tiny traffic sample.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Only THB 41.84 spend, but 181 inline link clicks, 117 landing page views, 5.70% CTR and THB 0.23 cost per inline link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not scale aggressively from this tiny spend. Re-test with controlled budget and clean tracking.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Promising click efficiency, but tracking looks inconsistent.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 28.05 spend, 172 inline link clicks, 8.96% CTR and THB 0.16 cost per click; however, 434 landing page views were reported from 172 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Re-test after tracking audit. Corporate audience may be worth testing for qualified lead generation.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Overall account            </h3>            <p>              Lead and purchase performance is not yet strong enough for the stated business goal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 114,705 spend produced only 6 reported leads and no purchase events or revenue. Blended cost per lead is THB 19,117.50. Purchase performance and ROAS cannot be assessed because no purchase value was supplied.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Shift budget mix away from pure engagement/follow delivery and rebuild a dedicated lead, messaging and purchase-tracking structure.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Largest spend campaign is not producing meaningful business actions.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 44,067.90 spend, 912,087 impressions, 35,162 all clicks, but only 6 inline link clicks, 10 messaging conversation starts and 1 lead. Inline link click cost is about THB 7,344.65.            </div> class=&quot;finding negative&quot;>            <h3>              Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Thailand spend is producing engagement/page likes but no link traffic or leads in this India ad account data.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Two campaigns with this name spent THB 3,633.55 combined and produced 0 inline link clicks and 0 leads. They generated page likes and engagement, including 225 likes in one campaign and 1,026 likes in the other.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              If Thailand is not part of the current India ticket-sales/lead goal, separate or reduce this spend. If Thailand is intentional, judge it as a page-like campaign, not a lead campaign.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign and new lead/messaging retargeting campaigns              </strong>            </div>            <p>              The Broad Destination campaign spent THB 44,067.90 with only 6 inline link clicks and 1 lead, while New post engagement campaign generated 1,057 inline link clicks and 15 messaging starts from THB 5,461.73.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting audiences built from video viewers, page engagers and link clickers              </strong>            </div>            <p>              Visibility delivered cheap reach, but only 3 inline link clicks. Its best use is to fill retargeting pools, not absorb sales-focused budget.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                A rebuilt Families traffic/lead test              </strong>            </div>            <p>              Families spent THB 7,867.50 with 0 inline link clicks, while Claude | IN | Families | 6 Languages | 2026-06-19 showed promising traffic with 181 inline link clicks and 117 landing page views from only THB 41.84.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate Broad Destination follows/likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                One consolidated testing structure              </strong>            </div>            <p>              Multiple campaigns with the same Broad Destination name split budget and produced very low inline link volume. Consolidation will make results easier to read and reduce learning fragmentation.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead objective test: Instant Form vs website lead            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated lead campaign using the best-engagement creatives from New post engagement campaign and AQ_MU2025_Followers_IN. Test one Instant Form ad set against one website lead ad set. Fund it from reduced Broad Destination follows/likes spend.            </p>            <p>              <strong>Success metric:</strong>              Judge only after at least 3 leads per ad set. Compare cost per lead, lead quality and downstream ticket inquiries.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Messaging conversion test from warm audiences            </h3>            <p>              <strong>Setup:</strong>              Retarget video viewers, page engagers, page likes and link clickers from AQ_MU2025_Followers_IN, New post engagement campaign and Page Follow Visibility. Use a ticket-offer or group-booking message CTA.            </p>            <p>              <strong>Success metric:</strong>              Cost per messaging conversation started, cost per conversation replied and lead quality after at least 3 conversations.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Traffic rebuild for Families and Corporates            </h3>            <p>              <strong>Setup:</strong>              Relaunch Claude | IN | Families | 6 Languages | 2026-06-19, Claude | IN | Corporates | 6 Languages | 2026-06-19 and Claude | IN | Corporates | 5 Languages | 2026-06-19 under a clean Landing Page View optimization setup with UTMs.            </p>            <p>              <strong>Success metric:</strong>              Cost per landing page view, inline link click to landing page view rate, and downstream leads/messages. Do not scale until tracking explains why landing page views exceed inline link clicks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Awareness-to-retargeting funnel            </h3>            <p>              <strong>Setup:</strong>              Keep a capped awareness budget on Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers, then retarget 25%-95% video viewers and page engagers with lead or messaging ads.            </p>            <p>              <strong>Success metric:</strong>              Retargeting cost per lead or messaging conversation compared with cold prospecting after at least 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative objective test using same post            </h3>            <p>              <strong>Setup:</strong>              Take the best-performing creative from New post engagement campaign and run it in three objectives: Engagement, Traffic/Landing Page View and Messaging.            </p>            <p>              <strong>Success metric:</strong>              Compare inline link clicks, landing page views, messaging starts and leads by objective, not just s/likes campaigns, then reallocate budget into dedicated lead, messaging, landing-page-view and retargeting tests. Do not make final pause decisions on campaigns with fewer than 3 leads or conversations, and fix tracking before judging purchase profitability.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout campaigns    </h2>    <div class=&quot;insights&quot;>                <div class=&quot;insight&quot;>            <span>Highest CTR</span>            <strong>13.10% · Claude | IN | Corporates | 5 Languages | 2026-06-19</strong>          </div>                  <div class=&quot;insight&quot;>            <span>Lowest CPC</span>            <strong>THB 0.10 · Claude | IN | Corporates | 5 Languages | 2026-06-19</strong>          </div>                  <div class=&quot;insight&quot;>            <span>Most leads</span>            <strong>3 · Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination</strong>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Daily spend trend    </h2>    <div class=&quot;panel&quot;>            <div class=&quot;trend-row&quot;>        <div class=&quot;trend-date&quot;>          2026-07-17        </div>        <div class=&quot;trend-track&quot;>          <div            class=&quot;trend-fill&quot;            style=&quot;width:2%&quot;          ></div>        </div>        <div class=&quot;trend-value&quot;>          THB 0.00        </div>      </div>          <div class=&quot;trend-row&quot;>        <div class=&quot;trend-date&quot;>          2026-07-18        </div>        <div class=&quot;trend-track&quot;>          <div            class=&quot;trend-fill&quot;            style=&quot;width:2%&quot;          ></div>        </div>        <div class=&quot;trend-value&quot;>          THB 0.00        </div>      </div>          <div class=&quot;trend-row&quot;>        <div
