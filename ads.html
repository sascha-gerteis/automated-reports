-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-29        →        2026-08-27      </span>      <span class=&quot;pill&quot;>        15 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 137,213.75</strong>        <small>          2026-07-29          to          2026-08-27        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>15,486,813</strong>        <small>          29,622,721 impressions          ·          1.91 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,313</strong>        <small>          0.55% CTR          ·          THB 0.84 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 45,737.92 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>35</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 4.63</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large upper-funnel volume: 29,622,721 impressions, 15,486,813 reach, 3,082,827 page engagements, and 2,887,726 video views from THB 137,213.75. However, the account is not yet proving the business goal of profitable ticket sales and qualified leads: only 1 lead was reported, no purchase actions or revenue were reported, and lead volume is below the minimum_results_before_decision of 3. Performance is strongest for awareness, followers, engagement, and low-cost link clicks from specific engagement campaigns, but current budget is heavily concentrated in follower/engagement campaigns rather than lead or purchase campaigns.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild the account around lead and ticket-sale objectives            </h3>            <p>              <strong>Why:</strong>              Account spend was THB 137,213.75 but only 1 lead and 0 purchases were reported. Current campaigns are mostly follows, likes, visibility, and engagement, so they are not optimized for the stated goal.            </p>            <p>              <strong>Do this:</strong>              Create dedicated Lead and Sales campaigns using verified lead/purchase events. Move budget from duplicate Broad Destination and ERROR QUARANTINED campaigns into these campaigns. Do not judge lead or purchase performance until each campaign has at least 3 primary results.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce duplicated Broad Destination follower campaigns            </h3>            <p>              <strong>Why:</strong>              The Broad Destination campaigns collectively spent about THB 69,819.87, generated only 10 inline link clicks, 1 lead, and high follower costs versus the stronger follower campaign.            </p>            <p>              <strong>Do this:</strong>              Cut Broad Destination duplicate campaign budgets by 50-70% immediately, consolidate learnings into one clean test structure, and stop launching multiple campaigns with the same name unless each has a distinct audience or creative test.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Carefully scale New post engagement campaign for traffic and retargeting            </h3>            <p>              <strong>Why:</strong>              New post engagement campaign produced 1,057 inline link clicks from THB 5,461.89, or about THB 5.17 per inline link click, with low CPM of THB 2.20 and 772,033 post engagements.            </p>            <p>              <strong>Do this:</strong>              Increase budget by 15-20% and use this campaign mainly to build warm audiences. Add clear ticket/lead CTAs and track downstream lead or purchase actions before scaling further.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild or replace ERROR QUARANTINED campaigns            </h3>            <p>              <strong>Why:</strong>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers delivered cheap reach but only 3 inline link clicks from THB 16,053.95. ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily has very high CPM of THB 180.60.            </p>            <p>              <strong>Do this:</strong>              Do not use quarantined/error campaigns for traffic, leads, or purchases. Recreate clean versions with proper objective, naming, tracking, and audience setup; keep only a capped awareness budget if cheap reach is still needed.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best traffic-style performer among current campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,461.89 spend, 1,057 inline link clicks, approximately THB 5.17 per inline link click, 772,033 post engagements, CPM THB 2.20, frequency 1.32.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale by 15-20%. Use it as a top-funnel and retargeting source, but add stronger lead/ticket CTAs and measure downstream results.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 32,755.22 spend, 30,685 likes, about THB 1.07 per like, 592,965 page engagements, 493,066 video views, CTR 4.93%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if follower growth remains a secondary KPI. Do not treat it as a ticket-sales campaign. Watch frequency at 3.76 and avoid aggressive scaling without fresh creative.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very efficient awareness reach, but only for upper funnel.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              23,858,980 impressions, 12,482,068 reach, CPM THB 0.67, 1,315,149 video views from THB 16,053.95.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Only keep capped awareness budget if broad visibility is required. Rebuild before using for traffic, leads, or sales because it generated only 3 inline link clicks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families            </h3>            <p>              Reasonable engagement and family-audience interaction.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 7,867.50 spend, 2,418 likes, about THB 3.25 per like, 351 comments, 47,109 page engagements, 6 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep at controlled budget as an engagement/audience-building campaign. Test this audience in a dedicated lead or ticket-sales campaign before scaling.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Largest Broad Destination version is consuming major budget without enough business-result signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign ID 120250948392580402 spent THB 44,087.75, generated only 6 inline link clicks, 1 lead, 10 messaging conversations started, and 3,698 likes. Cost per like was about THB 11.92.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget heavily and do not scale based on the single lead because it is below the minimum decision threshold of 3 results. Rebuild as a lead or sales campaign if the goal is tickets/leads.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Duplicate Broad Destination campaigns are fragmented and inefficient.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across the duplicated Broad Destination campaigns, spend was about THB 69,819.87 with only 10 inline link clicks and 1 lead. Several versions generated 0 inline link clicks despite spend, including campaign ID 120250948398070402 with THB 5,817.30 spend and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate duplicates, keep only one controlled test, and redirect saved budget to verified lead/sales campaigns and the stronger New post engagement campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Poor traffic and lead performance despite massive reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,053.95 spend, 23,858,980 impressions, but only 3 inline link clicks, 1 messaging conversation started, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause as a traffic/lead source. Rebuild cleanly if awareness is still required, and separate it from direct-response budget.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Technical/naming issue and expensive delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,201.39 spend, CPM THB 180.60, 0 inline link clicks, 0 leads, and 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild or replace after confirming why it is marked ERROR QUARANTINED. Do not scale this version.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide lead and purchase performance            </h3>            <p>              Insufficient direct-response data for sales or lead decisions.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Only 1 lead was reported across the account, below the minimum_results_before_decision of 3. No purchase actions, purchase value, or ROAS were reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not make lead/purchase winner decisions yet. Fix tracking and launch objective-aligned campaigns before judging profitability.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate Aquaverse India Daily Follows Likes 2026-08-02 / 2026-08-23 / 2026-08-25 Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated Lead and Sales campaigns              </strong>            </div>            <p>              These campaigns used about THB 69,819.87 while producing only 1 lead and 10 inline link clicks. Reallocation is needed to campaigns optimized for the actual goal.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Clean rebuilt awareness campaign or lead/sales retargeting              </strong>            </div>            <p>              It has excellent CPM of THB 0.67 but only 3 inline link clicks from THB 16,053.95, so it should not hold direct-response budget.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Broad Destination follower budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign              </strong>            </div>            <p>              New post engagement campaign generated 1,057 inline link clicks at about THB 5.17 each, while the Broad Destination group generated only 10 inline link clicks from much higher spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN marginal scaling budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Lead/purchase retargeting of engagers, video viewers, and page followers              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is strong for followers and engagement, but the account needs to convert that audience into leads or ticket sales.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead objective test from warm audiences            </h3>            <p>              <strong>Setup:</strong>              Create a lead campaign targeting recent page engagers, video viewers, messaging engagers, and followers generated by AQ_MU2025_Followers_IN and New post engagement campaign. Use ticket/offer-focused creative and a short qualification form.            </p>            <p>              <strong>Success metric:</strong>              Qualified leads and cost per lead after at least 3 leads are generated.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Ticket-sales tracking and sales campaign test            </h3>            <p>              <strong>Setup:</strong>              After purchase tracking is verified, run a Sales campaign optimized for the purchase event with ticket-focused ads. Keep it separate from follows/likes campaigns.            </p>            <p>              <strong>Success metric:</strong>              Purchases, cost per purchase, purchase value, and ROAS once purchase data is available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engagement creative vs ticket CTA creative            </h3>            <p>              <strong>Setup:</strong>              In New post engagement campaign or a clean traffic/lead test, compare current engagement-style creative against creative with explicit ticket/lead CTA.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, landing-page views if available, leads, and purchases. Do not judge lead outcome before 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Families audience direct-response test            </h3>            <p>              <strong>Setup:</strong>              Use Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families as the audience hypothesis and test it in a dedicated lead or sales campaign.            </p>            <p>              <strong>Success
