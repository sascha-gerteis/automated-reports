: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-13        →        2026-10-12      </span>      <span class=&quot;pill&quot;>        4 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 18,147.48</strong>        <small>          2026-09-13          to          2026-10-12        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>826,278</strong>        <small>          1,663,549 impressions          ·          2.01 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>4,280</strong>        <small>          2.64% CTR          ·          THB 0.41 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>3</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 10.91</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account generated large awareness and engagement volume, but it is not currently proving progress toward the stated goal of profitable ticket sales and qualified leads. Spend was THB 18,147.48 for 1,663,549 impressions, 43,945 clicks, 4,280 link clicks, 156 landing page views, 3 messaging conversations started, and no reported leads or purchases. Performance is mixed: follower/engagement campaigns are producing reach, reactions, likes, video views, and low-cost clicks, but purchase and lead outcomes are either not being generated or not being tracked.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from follower-only delivery toward lead, messaging, or purchase intent            </h3>            <p>              <strong>Why:</strong>              Most spend is concentrated in follower/engagement campaigns, while the business goal is ticket sales and qualified leads. No purchases or leads are reported, and only 3 messaging conversations started were recorded across the full account.            </p>            <p>              <strong>Do this:</strong>              Reduce follower-focused spend and launch dedicated conversion-path campaigns optimized for landing page views, leads, messaging conversations, or purchases depending on available tracking.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit tracking before judging ticket sales performance            </h3>            <p>              <strong>Why:</strong>              The account reports 4,280 link clicks but only 156 landing page views, a 3.6% link-click-to-LPV rate. No purchase or lead events are present, so ticket sales performance cannot be evaluated.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI, landing page view event firing, purchase event firing, lead event firing, URL destinations, page load speed, and whether Meta events are mapped correctly.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Protect the best landing page view producer            </h3>            <p>              <strong>Why:</strong>              AQ Operator CBO | IN | Instagram Followers produced 106 landing page views from only THB 852.74 spend, while Aquaverse India | Instagram Followers | 2026-09-27 produced only 50 landing page views from THB 5,261.87.            </p>            <p>              <strong>Do this:</strong>              Keep AQ Operator CBO | IN | Instagram Followers active and carefully increase budget only after confirming tracking and downstream lead or purchase quality.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Rebuild high-CPM follower campaign            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination has the highest CPM at THB 98.16, zero inline link clicks, and a higher cost per page engagement than other engagement campaigns.            </p>            <p>              <strong>Do this:</strong>              Reduce spend and rebuild with new creative, placements, or audience structure before allocating more budget.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness and engagement delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 10,790.46 and generated 586,580 impressions, 176,122 reach, 152,397 page engagements, 15,366 post reactions, 10,560 likes, and 123,230 video views. CTR was 4.01%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a capped social proof and awareness campaign, but do not let it dominate budget while ticket sales and leads are the main goal.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient reach, impressions, and link-click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 5,261.87 for 934,230 impressions, 544,638 reach, 3,645 link clicks, THB 5.63 CPM, and THB 0.29 CPC.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for low-cost top-of-funnel traffic, but fix the low landing page view rate before scaling.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best landing page view efficiency among the campaigns with reported LPVs.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 106 landing page views from THB 852.74 spend, compared with 50 landing page views from THB 5,261.87 in Aquaverse India | Instagram Followers | 2026-09-27. It also produced 15,904 page engagements and 14,938 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale in small increments after confirming landing page view and downstream conversion tracking.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              High spend is going to awareness/follower outcomes, not ticket sales or qualified leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              This campaign spent THB 10,790.46, which is the largest campaign spend, but reported only 27 inline link clicks and no landing page views, leads, purchases, or messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget allocation and keep only a controlled awareness budget unless the objective is explicitly follower growth.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Inefficient compared with the other follower/engagement campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,242.41 with THB 98.16 CPM, zero inline link clicks, 897 likes, and 3,628 page engagements. CPM is much higher than AQ_MU2025_Followers_IN at THB 18.40 and Aquaverse India | Instagram Followers | 2026-09-27 at THB 5.63.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild; do not scale until CPM and engagement efficiency improve.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality or tracking appears weak after the click.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 3,645 link clicks but only 50 landing page views, a 1.4% link-click-to-LPV rate. It also recorded 439 messaging blocks but only 4 total messaging connections and 2 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit destination and tracking, then retest with landing page view, lead, or messaging optimization instead of relying on follower traffic.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Good landing page view volume, but not enough lead or messaging results to make a final conversion decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Reported 106 landing page views but only 1 messaging conversation started and no leads or purchases. This is below the minimum_results_before_decision threshold of 3 for messaging conversations at the campaign level.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause. Continue testing while adding clearer lead or purchase tracking.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated lead, messaging, or purchase campaign              </strong>            </div>            <p>              AQ_MU2025_Followers_IN consumed THB 10,790.46 but did not report landing page views, leads, purchases, or messaging conversations started. Budget should support the stated business goal, not only engagement.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers or a new conversion-path test              </strong>            </div>            <p>              Daily Follows Likes has THB 98.16 CPM and zero inline link clicks, while AQ Operator CBO produced 106 landing page views from THB 852.74.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current follower-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting pool from page engagers, video viewers, link clickers, and landing page viewers              </strong>            </div>            <p>              The account generated 179,002 page engagements, 140,226 video views, 4,280 link clicks, and 156 landing page views, but there is no clear retargeting conversion layer shown in the data.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing page view optimization test            </h3>            <p>              <strong>Setup:</strong>              Create a traffic campaign optimized for landing page views using the best current creatives from AQ Operator CBO | IN | Instagram Followers and Aquaverse India | Instagram Followers | 2026-09-27.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, cost per landing page view, and link-click-to-LPV rate.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Qualified lead or messaging test            </h3>            <p>              <strong>Setup:</strong>              Run a lead form or click-to-message campaign with qualifying questions related to ticket interest, visit date, group size, or inquiry type.            </p>            <p>              <strong>Success metric:</strong>              Qualified leads or messaging conversations started after reaching at least 3 results per ad set or campaign.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Engagement retargeting test            </h3>            <p>              <strong>Setup:</strong>              Build retargeting audiences from video viewers, page engagers, link clickers, and landing page viewers generated during this period, then serve ticket-focused or inquiry-focused ads.            </p>            <p>              <strong>Success metric:</strong>              Leads, purchases, messaging conversations, and cost per result once at least 3 results are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Follower campaign creative refresh            </h3>            <p>              <strong>Setup:</strong>              Rebuild Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination with new creatives and compare against AQ_MU2025_Followers_IN using the same objective.            </p>            <p>              <strong>Success metric:</strong>              CPM, cost per page engagement, cost per like, and inline link clicks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Ticket sales tracking test            </h3>            <p>              <strong>Setup:</strong>              If online ticket purchase tracking is available, launch a small purchase-optimized campaign using a tracked purchase event.            </p>            <p>              <strong>Success metric:</strong
