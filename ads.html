, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-02        →        2026-10-01      </span>      <span class=&quot;pill&quot;>        8 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 21,660.54</strong>        <small>          2026-09-02          to          2026-10-01        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>533,489</strong>        <small>          1,477,428 impressions          ·          2.77 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,536</strong>        <small>          3.27% CTR          ·          THB 0.45 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 14.66</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement volume is strong, led by AQ_MU2025_Followers_IN, but the account is not currently proving progress toward profitable ticket sales or qualified leads because no purchases or leads are reported. Traffic quality is a major issue: Aquaverse India | Instagram Followers | 2026-09-27 generated 1,477 inline link clicks but only 30 landing page views, a 2.0% link-click-to-LPV rate. Messaging data is also weak, with only 1 messaging conversation started and 191 messaging blocks. Since cost per lead, cost per purchase, and ROAS targets are unknown, optimization should focus first on tracking quality, then rebuild campaigns around lead or purchase objectives.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix landing page and conversion tracking before scaling traffic            </h3>            <p>              <strong>Why:</strong>              The account generated 1,536 inline link clicks but only 30 landing page views. Aquaverse India | Instagram Followers | 2026-09-27 produced 1,477 inline link clicks and all 30 LPVs, showing a very large click-to-page-view drop-off.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, landing page load speed, URL redirects, UTMs, and event setup. Do not increase traffic budgets until LPV and downstream lead/purchase events are reliable.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebalance away from follower-only spend if the main goal is ticket sales and qualified leads            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN spent THB 18,364.41, 84.8% of account spend, and generated strong engagement but only 59 inline link clicks and no reported leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep AQ_MU2025_Followers_IN as a reduced awareness/engagement layer, but reallocate incremental budget into properly tracked lead, traffic-quality, and purchase tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild sales/lead acquisition structure            </h3>            <p>              <strong>Why:</strong>              There are no reported purchases and no lead actions across the account, so current campaigns cannot be judged against the business goal of ticket sales and qualified leads.            </p>            <p>              <strong>Do this:</strong>              Launch separate campaigns by objective: lead form or website lead campaign for qualified enquiries, purchase/conversion campaign for ticket sales once events are verified, and retargeting campaign for engagers/clickers.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Reduce inefficient follower/like variants            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination spent THB 1,004.94 with CPM THB 111.65 and cost per page engagement around THB 0.37, much less efficient than AQ_MU2025_Followers_IN at around THB 0.06 per page engagement.            </p>            <p>              <strong>Do this:</strong>              Reduce or rebuild this campaign before adding budget. Test its creative/audience setup against AQ_MU2025_Followers_IN rather than scaling it as-is.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness and engagement delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 18,364.41 spend, 1,096,399 impressions, 265,873 reach, 289,707 page engagements, 242,604 video views, 17,247 likes, CTR 3.64%, CPM THB 16.75, frequency 4.12.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as an awareness/engagement campaign, but cap or reduce budget because it is not generating measurable leads or purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Best traffic volume and lowest media cost among active campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,012.69 spend, 363,893 impressions, CPM THB 5.53, CPC THB 0.28, 7,273 clicks, 1,477 inline link clicks, cost per inline link click about THB 1.36.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep testing, but do not scale aggressively until the LPV gap is fixed and downstream lead/purchase events are visible.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Efficient engagement compared with newer follower/like campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Cost per page engagement is about THB 0.06 from 289,707 page engagements on THB 18,364.41 spend, compared with Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination at about THB 0.37 per page engagement.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use this campaign’s best-performing creative or audience learnings as the baseline for future awareness tests.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic quality or tracking is weak.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              1,477 inline link clicks produced only 30 landing page views, a 2.0% link-click-to-LPV rate. The campaign also recorded 191 messaging blocks and only 1 messaging conversation started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit destination experience and tracking. Exclude placements or creatives generating low-quality clicks after breakdown review. Do not optimize this campaign for sales until LPV and conversion events are fixed.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Not suitable as the main budget holder for ticket sales or lead generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              It used THB 18,364.41 of THB 21,660.54 total spend but produced only 59 inline link clicks and no reported leads or purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce its role to upper-funnel awareness. Move growth budget into campaigns designed and tracked for leads, purchase, or qualified traffic.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Engagement is more expensive and delivery cost is high.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,004.94 spend, 9,001 impressions, CPM THB 111.65, 2,701 page engagements, 718 likes, 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale as-is. Rebuild with lower-cost audiences/placements or shift budget to better-performing engagement or lead-generation tests.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Multiple duplicate/error-named campaigns are fragmenting spend and producing no link traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Five error/quarantined campaign rows spent a combined THB 278.50 with 0 inline link clicks. Individual spends are small, so performance decisions are limited.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not scale these. Clean up naming and consolidate testing into one controlled campaign once sufficient data is available.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              All campaigns            </h3>            <p>              Lead and purchase performance cannot be evaluated.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              No lead actions, purchases, purchase value, ROAS, or cost per purchase are reported during the period.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Implement lead and purchase tracking before making profitability decisions.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New tracked lead and purchase campaigns              </strong>            </div>            <p>              AQ_MU2025_Followers_IN consumed 84.8% of spend and delivered awareness/engagement, but no reported leads or purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN for awareness or new lead/traffic-quality tests              </strong>            </div>            <p>              The 2026-09-26 campaign has much higher CPM at THB 111.65 and higher cost per page engagement than AQ_MU2025_Followers_IN.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Consolidated test budget              </strong>            </div>            <p>              The duplicated error/quarantined campaigns have small spend, fragmented delivery, and 0 inline link clicks, so they should not receive incremental budget.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Untracked traffic spend              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27 only after tracking fixes              </strong>            </div>            <p>              This campaign has the lowest CPM at THB 5.53 and low cost per inline link click, but only 30 LPVs from 1,477 inline link clicks means scaling now may amplify low-quality or untracked traffic.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Website lead or instant form lead campaign            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated lead campaign with qualifying questions for ticket interest, visit date, group size, and contact details. Separate it from follower/engagement campaigns.            </p>            <p>              <strong>Success metric:</strong>              At least 3 qualified leads before making a decision, then compare cost per qualified lead and lead quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Purchase/conversion campaign after event verification            </h3>            <p>              <strong>Setup:</strong>              Once Pixel/CAPI and purchase events are confirmed, launch a ticket-sales campaign optimized for purchase or initiate checkout, not engagement.            </p>            <p>              <strong>Success metric:</strong>              At least 3 purchases before deciding whether to scale, reduce, or rebuild.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Retargeting warm audiences            </h3>            <p>              <strong>Setup:</strong>              Build retargeting audiences from video viewers, page engagers, Instagram engagers, inline link clickers, and landing page viewers. Use ticket/offer creative and clear booking CTA.            </p>            <p>              <strong>Success metric:</strong>              Purchases, leads, or landing page views depending on the campaign objective, with at least 3 result events before decisions.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Landing page vs instant form            </h3>            <p>              <strong>Setup:</strong>
