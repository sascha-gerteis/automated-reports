t-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-31        →        2026-08-29      </span>      <span class=&quot;pill&quot;>        19 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 140,280.10</strong>        <small>          2026-07-31          to          2026-08-29        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>15,500,138</strong>        <small>          29,745,385 impressions          ·          1.92 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,320</strong>        <small>          0.56% CTR          ·          THB 0.84 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 46,760.03 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>35</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 4.72</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-poor&quot;        >          Needs attention        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent THB 140,280.10 and generated very large awareness/engagement volume: 29,745,385 impressions, 15,500,138 reach, 3,118,907 page engagements, and 2,919,618 video views. However, performance against the stated business goal is weak: no purchase events were reported and only 1 lead was recorded, which is below the minimum_results_before_decision of 3. Traffic quality is concentrated in one campaign: New post engagement campaign drove 1,057 of the account’s 1,320 inline link clicks at THB 5.17 per inline link click, while several higher-spend follower/likes campaigns generated very few link clicks, leads, or messaging outcomes.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from high-spend follower/likes campaigns that are not driving business outcomes            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination spent THB 44,087.75, the largest single campaign spend, but produced only 6 inline link clicks, 10 messaging conversations started, and 1 lead. Lead volume is below the minimum decision threshold, but the campaign is clearly inefficient for traffic and messaging.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign materially and rebuild it around a lead, purchase, or qualified message objective instead of continuing to fund it as a follower/likes campaign.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep and carefully scale New post engagement campaign            </h3>            <p>              <strong>Why:</strong>              This campaign is the strongest traffic and messaging contributor: THB 5,461.89 spend, 1,057 inline link clicks, THB 5.17 per inline link click, 14 messaging conversations started, THB 390.14 per conversation started, CPM THB 2.20, and 772,033 post engagements.            </p>            <p>              <strong>Do this:</strong>              Keep active and increase budget cautiously in 15-20% steps while monitoring messaging quality, because it also generated 7 messaging blocks.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Stop using ERROR QUARANTINED visibility spend for traffic or lead goals            </h3>            <p>              <strong>Why:</strong>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers delivered very cheap awareness with CPM THB 0.67 and 23,858,980 impressions, but only 3 inline link clicks and 1 messaging conversation started from THB 16,053.95 spend.            </p>            <p>              <strong>Do this:</strong>              Keep only as a capped awareness campaign if reach is required; otherwise rebuild or remove it from business-goal budget allocation.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit purchase and lead tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              No purchase events or purchase value were reported, and only 1 lead was recorded across THB 140,280.10 spend. Multiple lead-related action types each show value 1, suggesting possible duplicate reporting of the same lead event.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI purchase event, lead event deduplication, event match quality, and reporting columns before scaling any sales or lead-generation campaign.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Consolidate duplicate Broad Destination campaigns            </h3>            <p>              <strong>Why:</strong>              Multiple campaigns share the same name, Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination, splitting THB 62,048.20 across overlapping follower/likes executions with only 8 total inline link clicks and 13 messaging conversations started.            </p>            <p>              <strong>Do this:</strong>              Consolidate into one clean structure with controlled audiences, exclude recent engagers where appropriate, and separate awareness, traffic, lead, and messaging objectives.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best campaign for traffic and messaging efficiency.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,461.89 spend, 1,057 inline link clicks, THB 5.17 per inline link click, 14 messaging conversations started, THB 390.14 per conversation started, 8 conversation replies, 772,033 post engagements, CPM THB 2.20.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active, carefully scale 15-20%, and use its engagers/link clickers as retargeting audiences for lead or ticket-sale offers.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement campaign, but not a business-outcome driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 34,311.31 spend, 31,973 likes, THB 1.07 per like, 618,701 page engagements, 515,250 video views, CTR 4.86%. However, it drove only 251 inline link clicks at THB 136.70 per inline link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if follower growth is a secondary KPI, but cap budget and do not scale for ticket sales or leads without retargeting layers.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient pure awareness reach, but not efficient for action.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              23,858,980 impressions, 12,482,068 reach, CPM THB 0.67, 1,315,149 video views, and 1,331,596 post engagements from THB 16,053.95 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use only as a low-cost awareness pool-builder. Retarget its video viewers and engagers rather than expecting direct leads or purchases from this campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination (campaign_id 120250948421480402)            </h3>            <p>              Best relative performer among the duplicate Broad Destination follower campaigns for likes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,077.63 spend, 1,290 likes, THB 3.94 per like, 2 messaging conversations started, and 19,647 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              If Broad Destination follower activity must continue, keep this variant over weaker Broad Destination duplicates, but do not scale until lead or purchase intent is proven.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination (campaign_id 120250948392580402)            </h3>            <p>              Largest spend concentration with weak traffic, messaging, and lead output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 44,087.75 spend, 912,492 impressions, 35,187 clicks but only 6 inline link clicks, 10 messaging conversations started, and 1 lead. Cost per inline link click was THB 7,347.96 and cost per messaging conversation started was THB 4,408.78.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. Do not make a final lead-performance decision from 1 lead because it is below the minimum threshold of 3, but stop treating this as a scalable business-goal campaign in its current form.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Poor for traffic and messaging despite strong awareness delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,053.95 spend produced only 3 inline link clicks and 1 messaging conversation started. CTR was 0.036% and there were 5,989 post unlikes.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not allocate conversion, lead, or traffic budget here. Rebuild with a clear objective or keep only as capped awareness.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families            </h3>            <p>              Follower and messaging costs are weaker than better-performing follower/engagement campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 7,867.50 spend, 2,418 likes at THB 3.25 per like, 47,109 page engagements at THB 0.17 per page engagement, 6 messaging conversations started at THB 1,311.25 per conversation started, and 3 conversation replies.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget and test new creative or offer angles before scaling further.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              High delivery cost relative to output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,201.39 spend, CPM THB 180.60, 8,378 page engagements at THB 0.50 per page engagement, 1,847 likes at THB 2.27 per like, and 0 inline link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild before adding budget. Keep only if Thailand follower growth is specifically required.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data for a decision on the four tiny 2026-08-28 variants.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Individual spends were only THB 7.06, THB 3.77, THB 6.33, and THB 6.64 with very small impression and click volumes.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause or judge these from this sample. Let them gather meaningful data or exclude them from performance decisions.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination duplicate group              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead or purchase-focused campaign after tracking verification              </strong>            </div>            <p>              The duplicate Broad Destination group spent THB 62,048.20 and generated only 8 inline link clicks, 13 messaging conversations started, and 1 lead. This is too much budget for a follower/likes structure when the business goal is ticket sales and qualified leads.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaign built from video viewers, page engagers, and link clickers              </strong>            </div>            <p>              The campaign produced massive low-cost reach but almost no direct action: 23,858,980 impressions but only 3 inline link clicks and 1 messaging conversation started.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN partial budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign and retargeting              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is efficient for likes at THB 1.07 per like, but New post engagement campaign is far stronger for inline link clicks at THB 5.17 per inline link click and messaging starts at THB 390.14.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Cleaner Thailand test campaign with one objective              </strong>            </div>            <p>              The current campaign had CPM THB 180.60 and 0 inline link clicks from THB 4,201.39 spend, so the structure should be rebuilt before further budget is added.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Purchase conversion campaign test            </h3>            <p>              <strong>Setup:</strong>              After verifying purchase tracking, launch a dedicated ticket-sales campaign optimized to Purchase with clear ticket-focused creative and landing page. Keep it separate from follower/likes campaigns.            </p>            <p>              <strong>Success metric:</strong>              Do not judge until at least 3 purchase events are recorded. Then evaluate cost per purchase and purchase value/ROAS if value is available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Instant form lead vs website lead test            </h3>            <p>              <strong>Setup:</strong>              Run two lead-generation ad sets with the same offer and audience: one using Meta Instant Forms and one sending users to the website lead form.            </p>            <p>              <strong>Success metric:</strong>              Compare cost per lead only after each variant reaches at least 3 leads. Also compare lead quality offline if available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Retargeting from New post engagement campaign            </h3>            <p>              <strong>Setup:</strong>              Create retargeting audiences from 1,057 inline link clickers, 772,033 post engagers, and 722,875 video viewers from New post engagement campaign. Serve ticket/lead offers instead of follower creative.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, leads, and purchases after reaching at least 3 results per outcome.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Click-to-message qualification flow            </h3>            <p>              <strong>Setup:</strong>              Use the strongest engagement sources and test a message campaign with qualifying questions such as travel dates, group size, location, and ticket interest.            </p>            <p>              <strong>Success metric:</strong>              Cost per qualified messaging conversation and conversation reply rate after at least 3 qualified conversations.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Consolidated Broad Destination rebuild            </h3>            <p>              <strong>Setup:</strong>              Replace the multiple Broad Destination duplicates with one campaign structure and 2-3 clearly separated audiences or creatives. Exclude existing page engagers if the goal is new reach.            </p>            <p>              <strong>Success metric:</strong>              Compare inline link click cost, messaging conversation cost, and lead volume against the current Broad Destination group.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events or purchase value were reported, so ticket-sale profitability and ROAS cannot be assessed from the supplied data.</li><li>Only 1 lead was reported across the account, which is below the minimum_results_before_decision of 3. Lead performance is directionally weak but statistically insufficient for final lead CPA decisions.</li><li>Multiple lead-related action types show value 1, including onsite_conversion.lead, lead, onsite_web_lead, and lead_grouped. Reporting should confirm whether these are the same lead counted in different fields.</li><li>Account clicks were 167,791 but inline link clicks were only 1,320. Use inline link clicks, not total clicks, when evaluating traffic intent.</li><li>Several campaigns are labeled ERROR QUARANTINED while still spending. Confirm campaign status, naming, and whether these are intended to remain active.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep New p
