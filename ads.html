header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-24        →        2026-09-22      </span>      <span class=&quot;pill&quot;>        14 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 35,081.07</strong>        <small>          2026-08-24          to          2026-09-22        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>442,584</strong>        <small>          1,730,899 impressions          ·          3.91 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>87</strong>        <small>          3.49% CTR          ·          THB 0.58 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>1</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 20.27</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness/engagement and follower growth are strong, driven mainly by AQ_MU2025_Followers_IN, which spent THB 23,638.45 and produced 21,403 likes, 374,933 post engagements, and 338,012 video views. However, the account goal is profitable ticket sales and qualified leads, and the data shows no purchases, no lead events, only 1 messaging conversation, and only 87 inline link clicks from THB 35,081.07 spend. Current spend is heavily weighted toward followers/likes rather than traffic, leads, messaging, or purchase outcomes.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Consolidate spend away from ERROR QUARANTINED follower campaigns            </h3>            <p>              <strong>Why:</strong>              The ERROR QUARANTINED campaigns spent THB 11,442.62, generated only 1 inline link click, and delivered weaker efficiency than AQ_MU2025_Followers_IN across follower and engagement metrics.            </p>            <p>              <strong>Do this:</strong>              Pause or rebuild the higher-spend ERROR QUARANTINED campaigns with sufficient data, especially the 2026-08-23, 2026-08-25, and 2026-08-30 Broad Destination campaigns. Do not scale these structures in their current form.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN but scale carefully            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN produced 91.6% of all page likes with 67.4% of spend and has much better cost efficiency than the quarantined campaigns.            </p>            <p>              <strong>Do this:</strong>              Keep AQ_MU2025_Followers_IN active for awareness/follower growth, but avoid aggressive scaling because frequency is already 4.66. Refresh creatives and monitor CTR, post unlikes, and cost per like.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Add lower-funnel lead, messaging, or ticket-sale campaigns            </h3>            <p>              <strong>Why:</strong>              The account goal is ticket sales and qualified leads, but current campaigns are mostly followers/likes. There are no reported purchases, no lead events, and only 1 messaging conversation started.            </p>            <p>              <strong>Do this:</strong>              Allocate part of the budget currently spent on ERROR QUARANTINED campaigns into a dedicated lead form, messaging, traffic, or purchase campaign depending on available tracking.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix reporting and tracking before judging sales performance            </h3>            <p>              <strong>Why:</strong>              Purchase, revenue, ROAS, and lead events are missing. Inline link clicks are only 87 while total clicks are 60,377, showing most clicks are engagement/profile clicks rather than website traffic.            </p>            <p>              <strong>Do this:</strong>              Confirm Pixel/CAPI events, purchase event setup, lead event setup, URL parameters, and whether inline link clicks are the intended traffic metric.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Reduce creative fatigue risk            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN has frequency 4.66, and daily CTR declined toward the end of the period, including 2.74% on 2026-09-19 and 2.42% on 2026-09-20.            </p>            <p>              <strong>Do this:</strong>              Launch new creative variations before increasing AQ_MU2025_Followers_IN budget. Rotate hooks, ticket CTA, offer messaging, and attraction visuals.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best-performing awareness/follower campaign in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 23,638.45, 1,472,610 impressions, 316,125 reach, CPM THB 16.05, CPC THB 0.47, CTR 3.43%, 21,403 likes, 374,933 post engagements, and 338,012 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active and use as the primary awareness/follower campaign. Scale carefully only with creative refreshes because frequency is already 4.66.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strongest efficiency for follower and engagement objectives.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Cost per like is approximately THB 1.10, cost per post engagement approximately THB 0.06, and cost per video view approximately THB 0.07. The remaining campaigns combined spent THB 11,442.62 for only 1,964 likes, approximately THB 5.83 per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use AQ_MU2025_Followers_IN as the benchmark for any rebuilt follower/engagement campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Account-wide awareness performance            </h3>            <p>              The account is generating large engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 35,081.07 spend generated 1,730,899 impressions, 442,584 reach, 434,750 post engagements, 23,367 likes, and 395,037 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Retarget engaged users and video viewers with lead, messaging, traffic, or ticket-sale campaigns instead of only continuing follower acquisition.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Underperforming versus AQ_MU2025_Followers_IN for follower/engagement efficiency and produced no inline link clicks.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend THB 4,304.20, CPM THB 50.50, CPC THB 1.36, CTR 3.71%, 0 inline link clicks, 762 likes, 18,530 post engagements, and 17,520 video views. Cost per like is approximately THB 5.65.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild. Move budget to AQ_MU2025_Followers_IN or a lower-funnel lead/messaging/ticket-sale test.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Multiple duplicate campaigns are spending inefficiently compared with AQ_MU2025_Followers_IN.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The three 2026-08-25 campaigns spent THB 1,487.24, THB 1,022.51, and THB 2,430.56. They generated 208, 200, and 354 likes respectively, with CPMs of THB 29.04, THB 47.16, and THB 58.67. Two had 0 inline link clicks and one had only 1 inline link click.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Stop splitting spend across duplicate quarantined campaigns. Rebuild as one clean campaign if follower growth is still needed, or redirect the spend to lead/messaging/ticket-sale campaigns.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination            </h3>            <p>              Five duplicate campaigns are delivering engagement but weaker efficiency than AQ_MU2025_Followers_IN and no inline link clicks.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The five 2026-08-30 campaigns spent approximately THB 2,173.60 combined, generated 430 likes and 0 inline link clicks. Individual CPCs ranged from THB 0.96 to THB 1.14 and CPMs ranged from THB 35.51 to THB 39.38.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate or pause these duplicates. Do not continue fragmented Broad Destination follower campaigns when AQ_MU2025_Followers_IN is more efficient.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data to make a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The four 2026-08-28 campaigns spent only THB 7.06, THB 4.26, THB 6.55, and THB 6.64, with very low impression volume.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on performance from this tiny sample. Exclude these from performance conclusions and avoid scaling until they have meaningful delivery.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account-wide traffic, lead, messaging, and purchase performance            </h3>            <p>              The account is not currently proving contribution to ticket sales or qualified leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Across THB 35,081.07 spend, there are 87 inline link clicks, 1 messaging conversation started, no reported leads, no reported purchases, no purchase value, and no ROAS.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not judge these follower campaigns by purchase performance, but do add dedicated lower-funnel campaigns and tracking before evaluating profitability.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Follows Likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <p>              The quarantined campaigns spent THB 11,442.62 for 1,964 likes, approximately THB 5.83 per like, while AQ_MU2025_Followers_IN delivered 21,403 likes at approximately THB 1.10 per like.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate 2026-08-25 and 2026-08-30 Broad Destination follower campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                One consolidated rebuilt follower/engagement campaign or AQ_MU2025_Followers_IN              </strong>            </div>            <p>              The duplicate campaigns fragment learning and show weaker CPM, CPC, and cost-per-like performance than AQ_MU2025_Followers_IN.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                A portion of follower/likes-only budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead, messaging, traffic, or ticket-sale campaign              </strong>            </div>            <p>              The business goal is ticket sales and qualified leads, but the current mix produced no purchases, no lead events, only 1 messaging conversation, and 87 inline link clicks.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                High-frequency AQ_MU2025_Followers_IN scaling budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Creative refresh and retargeting test budget              </strong>            </div>            <p>              AQ_MU2025_Followers_IN frequency is 4.66, so additional spend should be paired with new creatives or retargeting instead of simply increasing frequency.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Engaged audience retargeting for ticket intent            </h3>            <p>              <strong>Setup:</strong>              Create a retargeting campaign using page engagers, post engagers, and video viewers from the 395,037 video views and 434,750 post engagements. Use ticket-focused creative and a clear CTA.            </p>            <p>              <strong>Success metric:</strong>              Inline link clicks, messaging conversations, leads, or purchases depending on tracking setup. Do not make a final decision until at least 3 result events are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Lead form campaign for qualified enquiries            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated Meta lead form campaign with qualifying questions for visit date, group size, and ticket interest.            </p>            <p>              <strong>Success metric:</strong>              Cost per qualified lead and lead volume. Since no CPL target is provided, compare against other lead tests only after at least 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Messaging campaign for ticket questions            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated messaging campaign instead of relying on follower campaigns to generate messages. Use click-to-message ads with FAQs, price/ticket prompts, and location/visit planning angles.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started and qualified replies. Current account has only 1 messaging conversation, below the minimum_results_before_decision of 3.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Purchase or traffic campaign if tracking is available            </h3>            <p>              <strong>Setup:</strong>              If purchase tracking is confirmed, run a purchase-optimized ticket campaign. If purchase tracking is not ready, run a landing-page traffic campaign using ticket-specific creative.            </p>            <p>              <strong>Success metric:</strong>              Purchases and ROAS if purchase tracking works; otherwise inline link clicks and landing-page traffic quality.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative refresh for AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong>              Test new videos/images against the current follower creative: attraction highlights, family/group visit angles, urgency, ticket CTA, and social proof.            </p>            <p>              <strong>Success metric:</strong>              Cost per like, cost per post engagement, CTR, frequency, and post unlike volume.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 6            </span>            <h3>              Clean campaign rebuild versus quarantined structure            </h3>            <p>              <strong>Setup:</strong>              Duplicate the intended audience from the ERROR QUARANTINED Broad Destination campaigns into one clean, non-quarantined campaign with clear naming and no overlapping duplicates.            </p>            <p>              <strong>Success metric:</strong>              Compare CPM, CPC, cost per like, post engagement cost, and inline link clicks against AQ_MU2025_Followers_IN.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>{&amp;quot;issue&amp;quot;:&amp;quot;No purchase tracking visible&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;The data contains no purchase actions, no purchase value, and no ROAS despite the business goal of profitable ticket sales.&amp;quot;,&amp;quot;action&amp;quot;:&amp;quot;Verify Pixel/CAPI purchase events, event prioritization, checkout tracking, and URL parameters.&amp;quot;}</li><li>{&amp;quot;issue&amp;quot;:&amp;quot;No lead tracking visible&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;No lead actions are reported in the account data.&amp;quot;,&amp;quot;action&amp;quot;:&amp;quot;Set up and validate Meta lead events or instant form lead reporting before judging CPL.&amp;quot;}</li><li>{&amp;quot;issue&amp;quot;:&amp;quot;Messaging data is too small for a decision&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;Only 1 messaging conversation started, 1 messaging connection, and 1 first reply are reported, below the minimum_results_before_decision of 3.&amp;quot;,&amp;quot;action&amp;quot;:&amp;quot;Run a dedicated messaging test and wait for at least 3 messaging results before deciding.&amp;quot;}</li><li>{&amp;quot;issue&amp;quot;:&amp;quot;Total clicks and inline link clicks are highly inconsistent&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;The account reports 60,377 clicks but only 87 inline link clicks.&amp;quot;,&amp;quot;action&amp;quot;:&amp;quot;Use inline link clicks or landing page views for traffic analysis, not total clicks, because most clicks appear to be engagement/profile clicks.&amp;quot;}</li><li>{&amp;quot;issue&amp;quot;:&amp;quot;Duplicate quarantined campaign naming reduces clarity&amp;quot;,&amp;quot;evidence&amp;quot;:&amp;quot;Multiple campaigns share the exact same name: ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination and ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-30 | 1. Broad Destination.&amp;quot;,&amp;quot;action&amp;quot;:&amp;quot;Consolidate and rename campaigns so spend and learnings can be interpreted clearly.&amp;quot;}</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep AQ_MU2025_Followers_IN as the main awareness/follower campaign, but scale cautiously with new creative because frequency is 4.66. Pause or rebuild the higher-spend ERROR QUARANTINED duplicate follower campaigns that have enough engagement data and are materially less efficient. Reallocate that budget into a clean lower-funnel structure: retargeting, lead forms, messaging, and purchase or traffic campaigns once tracking is confirmed. Do not make purchase, ROAS, or CPL conclusions yet because those result types are missing or below the 3-result minimum.          </div>        </section>        <section class=&quot;section&quot;>    <h2
