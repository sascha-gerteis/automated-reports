.cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-04        →        2026-09-02      </span>      <span class=&quot;pill&quot;>        24 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 118,341.26</strong>        <small>          2026-08-04          to          2026-09-02        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>11,045,584</strong>        <small>          20,030,066 impressions          ·          1.81 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>724</strong>        <small>          0.71% CTR          ·          THB 0.83 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 39,447.09 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>20</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 5.91</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse spent THB 118,341.26 and generated very large reach and engagement: 20,030,066 impressions, 11,045,584 reach, 2,155,016 page engagements, 2,005,188 video views, 724 link clicks, 20 messaging conversations started, and only 1 reported lead. No purchases or revenue were reported, so profitable ticket sales cannot be evaluated. Because lead volume is below the minimum_results_before_decision of 3 and target CPL/CPA/ROAS are unknown, lead and purchase efficiency cannot be judged conclusively. The account is strong for awareness and engagement, mixed for messaging, and weak/unclear for lead and purchase outcomes.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebalance spend away from follower/engagement-only delivery toward lead, messaging, and purchase-intent campaigns            </h3>            <p>              <strong>Why:</strong>              Most spend is in follows/likes or engagement campaigns, while the account produced only 1 lead and no purchase actions from THB 118,341.26 spend.            </p>            <p>              <strong>Do this:</strong>              Reduce budget from high-spend follows/likes campaigns and fund dedicated lead or messaging campaigns using proven engagement audiences and retargeting pools.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep but cap the strongest engagement campaigns            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN produced 566,369 page engagements, 28,997 likes, and 537,372 post engagements from THB 31,304.18, but its frequency is already 4.09.            </p>            <p>              <strong>Do this:</strong>              Keep AQ_MU2025_Followers_IN active at a controlled budget, rotate creatives, and avoid aggressive scaling unless the goal is page growth or engagement.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale New post engagement campaign for link traffic            </h3>            <p>              <strong>Why:</strong>              New post engagement campaign produced 494 of the account&amp;#039;s 724 link clicks from only THB 2,743.05, equal to THB 5.55 per link click, the clearest traffic performer in the account.            </p>            <p>              <strong>Do this:</strong>              Increase budget gradually and monitor link clicks, messaging blocks, and downstream lead or purchase activity.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild ERROR QUARANTINED awareness spend            </h3>            <p>              <strong>Why:</strong>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers delivered 15,714,771 impressions and low CPM of THB 0.69, but only 2 link clicks and no leads or conversations started.            </p>            <p>              <strong>Do this:</strong>              Keep only a capped awareness budget if reach is required; otherwise rebuild it into a clean campaign focused on traffic, leads, or messaging.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix measurement before judging ticket sales profitability            </h3>            <p>              <strong>Why:</strong>              No purchase actions, revenue, ROAS, or ticket sale events were reported, and only 1 lead was recorded.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI purchase, lead, and registration events, then optimize using reported purchases/leads rather than clicks or engagement clicks.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strongest follower and engagement driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 31,304.18 spend, 566,369 page engagements, 537,372 post engagements, 28,997 likes, 4.55% CTR, THB 0.41 CPC, and 475,664 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep active for awareness/follower growth, but cap or scale carefully because frequency is 4.09 and there are no reported leads or purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best campaign for link traffic and efficient broad engagement.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,743.05 spend generated 494 link clicks, 390,640 post engagements, 366,531 video views, and 4 messaging conversations started. Cost per link click was THB 5.55.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Carefully scale this campaign if website traffic is a priority, and add UTM tracking to confirm whether these clicks lead to ticket or lead actions.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Efficient for pure awareness and video view volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 10,766.24 spend delivered 15,714,771 impressions, 9,140,019 reach, THB 0.69 CPM, 857,876 post engagements, and 847,028 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Use only as an upper-funnel awareness source. Do not use it as a primary sales or lead driver unless rebuilt with a conversion-focused objective.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Main source of reported lead and messaging volume, but not yet enough lead data to judge.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The largest version spent THB 42,703.50 and generated 10 messaging conversations started, 8 conversation replies, 10 total messaging connections, and the account&amp;#039;s only 1 reported lead.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not pause based on the single lead. Rebuild or duplicate into a dedicated lead/messaging objective and test whether it can generate at least 3 qualified leads before making a final lead-efficiency decision.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families            </h3>            <p>              Small but positive engagement and messaging signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,775.70 spend generated 525 likes, 70 comments, 10,159 page engagements, 3 total messaging connections, and 2 conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a small test audience, but do not scale until it produces at least 3 conversations or leads tied to business quality.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Largest spend concentration is not producing enough direct response output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The largest version spent THB 42,703.50, representing the biggest campaign spend, but generated only 6 link clicks, 10 messaging conversations started, and 1 lead. Lead volume is below the minimum decision threshold of 3.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce this campaign as a follows/likes campaign and rebuild it as a dedicated leads or messaging campaign with clearer conversion intent.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very weak downstream traffic despite massive reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              15,714,771 impressions and THB 10,766.24 spend produced only 2 link clicks and no reported leads or messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not judge it by purchases if it is an awareness campaign, but reduce it if the budget is needed for ticket sales or qualified leads.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              High delivery cost and no direct response output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,201.39 spend, THB 180.60 CPM, 23,263 impressions, 1,847 likes, 145 comments, but 0 link clicks, 0 leads, and 0 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild if the goal is leads, messages, or ticket sales. Keep only if Thailand page-like growth is a separate objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              No reported link, lead, or messaging output from a small sample.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,067.55 spend, 13,899 impressions, 225 likes, 27 comments, 0 link clicks, 0 leads, and 0 conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause solely from this sample, but keep budget limited until the campaign has a clearer role or produces measurable lead/message results.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Multiple duplicate campaigns named Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Budget and learning are fragmented across several campaigns with the same name.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Multiple separate campaign IDs share the same name, including spends of THB 42,703.50, THB 3,333.10, THB 4,395.82, THB 3,669.66, and THB 939.92, with very low link-click and lead output outside the largest campaign.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate duplicated structures, use clear naming, and separate campaigns by objective: awareness, engagement, traffic, leads, messaging, and purchases.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign and a new dedicated lead/messaging test              </strong>            </div>            <p>              The largest Broad Destination campaign spent THB 42,703.50 but produced only 6 link clicks, 10 conversations started, and 1 lead, while New post engagement produced 494 link clicks from THB 2,743.05.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting campaign for leads, messages, or ticket-sale intent              </strong>            </div>            <p>              The campaign is efficient for reach but produced only 2 link clicks and no reported leads or conversations from 15,714,771 impressions.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicate ERROR QUARANTINED and duplicate Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Consolidated campaigns split by objective              </strong>            </div>            <p>              Several campaigns with similar or identical names are creating fragmented spend and unclear learning across small-to-medium budgets.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Thailand follows/likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India lead/messaging tests, unless Thailand page growth is a separate priority              </strong>            </div>            <p>              Thailand campaigns generated likes and comments but no link clicks, leads, or messaging conversations in the supplied data.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead objective test from engaged audiences            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated lead campaign targeting recent engagers, video viewers, page engagers, and broad India audiences. Use the best engagement creatives from AQ_MU2025_Followers_IN and New post engagement campaign.            </p>            <p>              <strong>Success metric:</strong>              Reach at least 3 reported leads, then compare cost per lead and lead quality. Do not judge before 3 leads.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Build a messages campaign using audiences from Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination and New post engagement campaign. Add qualifying questions related to ticket interest or visit timing.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, conversation replies, and qualified lead rate after at least 3 qualified conversations.            </p>          </div> >          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase actions, purchase value, revenue, or ROAS were reported, so ticket sales profitability cannot be evaluated.</li><li>Only 1 lead was reported, below the minimum_results_before_decision of 3; CPL decisions are not statistically supported.</li><li>The account shows 142,679 clicks but only 724 inline link clicks, indicating most clicks are engagement clicks rather than website traffic.</li><li>The same lead appears under several lead-related action types on 2026-08-14, so lead-event deduplication should be checked.</li><li>Several campaigns include ERROR QUARANTINED in the name, which suggests campaign setup, approval, or naming hygiene should be reviewed.</li><li>Multiple campaigns share identical names, making campaign-level learning and budget decisions harder to interpret.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep AQ_MU2025_Followers_IN and New post engagement campaign for awareness, engagement, and traffic, but cap follower/engagement spend. Reduce or rebuild high-spend Broad Destination and ERROR QUARANTINED campaigns into clean lead, messaging, and purchase-intent tests. Do not make final lead or purchase efficiency decisions until tracking is verified and each test reaches at least 3 meaningful results.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout campaigns    </h2>    <div class=&quot;insights&quot;>                <div class=&quot;insight&quot;>            <span>Highest CTR</span>            <strong>10.22% · E
