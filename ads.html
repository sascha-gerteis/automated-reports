 font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-09-17        →        2026-10-16      </span>      <span class=&quot;pill&quot;>        4 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 16,903.19</strong>        <small>          2026-09-17          to          2026-10-16        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>942,483</strong>        <small>          1,761,667 impressions          ·          1.87 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>5,656</strong>        <small>          2.34% CTR          ·          THB 0.41 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>4</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 9.59</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement delivery is strong with 1,761,667 impressions, 942,483 reach, 163,572 page engagements, 130,005 video views, and 16,031 post reactions from THB 16,903.19 spend. Traffic quality is uneven: 5,656 link clicks produced only 362 landing page views, while no purchase or lead events were reported. The strongest campaign for usable traffic is AQ Operator CBO | IN | Instagram Followers, which generated 308 of 362 landing page views at THB 6.87 per LPV. Current spend is heavily weighted toward follower/engagement campaigns, so it is not yet aligned with the stated goal of profitable ticket sales and qualified leads.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              <strong>Why:</strong>              This campaign produced the best traffic quality: 308 landing page views from THB 2,116 spend, THB 6.87 cost per LPV, 17.5% link-click-to-LPV rate, and the lowest CPM among major campaigns at THB 5.45.            </p>            <p>              <strong>Do this:</strong>              Carefully increase budget on AQ Operator CBO | IN | Instagram Followers by 20-30% while monitoring LPV cost, CTR, frequency, and messaging results.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce budget from high-cost follower campaigns            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN spent THB 7,884.39, 46.6% of total spend, but generated only 17 link clicks and no landing page views. Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination had the highest CPM at THB 98.16 and zero inline link clicks.            </p>            <p>              <strong>Do this:</strong>              Cap or reduce AQ_MU2025_Followers_IN and Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination unless follower growth is the primary objective for that budget.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Create sales and lead campaigns separate from follower campaigns            </h3>            <p>              <strong>Why:</strong>              All supplied campaigns appear focused on followers/likes/engagement, while the business goal is ticket sales and qualified leads. No purchase or lead actions were reported.            </p>            <p>              <strong>Do this:</strong>              Launch separate ticket sales and lead-generation campaigns using the best audiences/creatives from AQ Operator CBO | IN | Instagram Followers, with optimization events tied to lead, purchase, or landing page view depending on tracking readiness.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit landing page and tracking quality            </h3>            <p>              <strong>Why:</strong>              The account recorded 5,656 link clicks but only 362 landing page views, a 6.4% LPV-to-link-click rate. Aquaverse India | Instagram Followers | 2026-09-27 had 3,884 link clicks but only 54 LPVs.            </p>            <p>              <strong>Do this:</strong>              Check pixel firing, destination URLs, mobile load speed, in-app browser behavior, and campaign click placement quality before scaling traffic-heavy campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best campaign for traffic quality and efficient engagement.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,116 spend generated 1,755 link clicks, 308 landing page views, THB 1.21 cost per link click, THB 6.87 cost per LPV, 51,138 page engagements, THB 0.04 cost per page engagement, and CPM of THB 5.45.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this campaign as the base for new traffic, lead, and ticket-sales tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong for awareness, page engagement, reactions, video views, and page likes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 101,306 page engagements, 79,500 video views, 11,581 post reactions, and 7,885 likes from THB 7,884.39 spend. Cost per page engagement was approximately THB 0.08 and cost per like was approximately THB 1.00.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only as an awareness/follower-growth campaign with a capped budget. Do not rely on it for ticket sales or lead generation.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Efficient reach and cheap link-click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Delivered 993,377 impressions, 571,243 reach, THB 5.70 CPM, 19,267 clicks, and 3,884 link clicks from THB 5,660.39 spend. Cost per link click was approximately THB 1.46.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for low-cost reach/click volume, but rebuild traffic flow before increasing budget because landing page views are weak.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Not suitable for traffic, leads, or ticket sales despite strong engagement.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 7,884.39 and generated only 17 link clicks, no landing page views, no leads, and no purchases. Frequency was also the highest at 2.85 and CPM was THB 21.48.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or cap budget and keep it only for follower/engagement objectives. Reallocate sales/lead budget elsewhere.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Most expensive delivery with no measurable traffic outcome.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 1,242.41 with CPM of THB 98.16, only 12,657 impressions, zero inline link clicks, and no landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce significantly or rebuild with broader inventory, different creative, and a clearer objective. Do not scale in current form.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              Traffic volume is high but landing page quality is poor.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Generated 3,884 link clicks but only 54 landing page views, a 1.4% LPV-to-link-click rate. It also had 457 messaging blocks, 4 total messaging connections, and only 2 messaging conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Audit destination and tracking, exclude poor placements if available, and test the same creative in a landing-page-view or lead objective campaign.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Account overall            </h3>            <p>              Purchase and lead performance cannot be evaluated.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              No purchase events and no lead events were reported in the supplied data. Messaging volume is very low with only 4 conversations started and 6 total messaging connections from THB 16,903.19 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Fix tracking and launch dedicated lead/sales campaigns before making profitability decisions.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                AQ_MU2025_Followers_IN              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              AQ_MU2025_Followers_IN used 46.6% of spend but produced only 17 link clicks and no LPVs, while AQ Operator CBO produced 308 LPVs at THB 6.87 per LPV.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New ticket sales or lead-generation campaign              </strong>            </div>            <p>              Daily Follows Likes had THB 98.16 CPM and zero inline link clicks. Budget is better used testing an objective aligned to tickets or qualified leads.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Split between AQ Operator CBO | IN | Instagram Followers and a landing-page-view test              </strong>            </div>            <p>              It has cheap CPM and link clicks but only 54 LPVs from 3,884 link clicks. Keep some budget for reach, but move incremental spend to higher-quality LPV sources.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Landing page view campaign using AQ Operator learnings            </h3>            <p>              <strong>Setup:</strong>              Duplicate the best-performing creative/audience structure from AQ Operator CBO | IN | Instagram Followers into a traffic campaign optimized for landing page views.            </p>            <p>              <strong>Success metric:</strong>              Cost per landing page view and LPV-to-link-click rate. Wait for at least 3 results before making decisions.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Lead form vs messaging lead test            </h3>            <p>              <strong>Setup:</strong>              Run one instant form campaign and one messaging campaign with the same offer and audience. Add qualifying questions to the form or chat flow.            </p>            <p>              <strong>Success metric:</strong>              Cost per qualified lead and total qualified leads. Do not judge until each test has at least 3 lead results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Ticket sales retargeting test            </h3>            <p>              <strong>Setup:</strong>              Retarget people who engaged with page content, watched videos, clicked links, or landed on the site during this period. Use ticket-focused creative and a direct ticket CTA.            </p>            <p>              <strong>Success metric:</strong>              Tracked purchases, cost per purchase, and ROAS once purchase tracking is active.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Creative intent test            </h3>            <p>              <strong>Setup:</strong>              Test follower-style content against direct ticket/offer creative inside the same audience structure.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, qualified leads, or purchases depending on the campaign objective.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events were reported, so ticket sales profitability cannot be evaluated.</li><li>No lead events were reported, so qualified lead performance cannot be evaluated.</li><li>Target CPL, cost per purchase, and ROAS are set to 0, so there is no supplied target to compare against.</li><li>Landing page tracking
