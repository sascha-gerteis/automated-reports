e reach and traffic in July: THB 461,569.15 spend, 32,491,418 impressions, 10,556,360 reach, 535,262 link clicks, 77,391 omni landing page views, 11 leads, and 8 tracked purchases. Traffic volume is strong, but qualified outcomes are concentrated in very few campaigns. The account is mixed: several traffic and awareness campaigns are efficient for their own objectives, while lead and purchase performance is too thin to make broad conversion scaling decisions. The clearest winner is Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;, which produced 8 leads and 4 purchases from only THB 2,216.80 spend.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward the only proven lead and purchase driver            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; generated 8 of 11 account leads and 4 of 8 purchases from THB 2,216.80 spend, meeting the minimum 3-result rule.            </p>            <p>              <strong>Do this:</strong>              Create a dedicated conversion or messaging campaign using this post/creative, then scale budget carefully in 20-30% increments while monitoring leads, purchases, messaging conversations, and landing page views.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce or rebuild B2B lead campaigns with spend but no leads            </h3>            <p>              <strong>Why:</strong>              Aquaverse Corporate Groups - Leads - Test spent THB 12,979.98 with 0 leads and only 112 landing page views. TH | B2B Corporate | Video | Leads | 2026-06-18 spent THB 15,389.42 with 0 leads and frequency 5.74.            </p>            <p>              <strong>Do this:</strong>              Stop scaling these versions. Rebuild with a clear lead form or conversion event, new corporate-specific offer, and exclude high-frequency audiences before adding more budget.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep efficient traffic campaigns but judge them by landing page quality, not clicks            </h3>            <p>              <strong>Why:</strong>              Some campaigns generate cheap link clicks but weak landing page depth. For example, Claude | TH | Traffic IMAGES | 18Jun produced 125,323 link clicks and 10,883 LPVs, while Claude | TH | Corporates | Thai | 2026-06-19 produced fewer clicks but a much stronger LPV rate: 3,426 LPVs from 6,636 link clicks.            </p>            <p>              <strong>Do this:</strong>              Prioritize campaigns with strong LPV volume and LPV-to-click ratios; reduce campaigns with many clicks but very low LPVs.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix tracking inconsistencies before aggressive purchase optimization            </h3>            <p>              <strong>Why:</strong>              There are zero-spend campaigns reporting landing page views, campaigns with inline link clicks higher than clicks, and purchases duplicated across omni, onsite, web, app, and web-app events.            </p>            <p>              <strong>Do this:</strong>              Audit pixel/CAPI, event deduplication, marketplace/app tracking, and click-to-LPV measurement before making ROAS-based decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best full-funnel performer and the only campaign with enough purchase and lead volume for a confident decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,216.80 spend, 8 leads, 4 purchases, 43 messaging conversations started, 56 messaging connections, tracked purchase value THB 2,176.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Build a dedicated campaign around this creative/post and test similar family/holiday messaging.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Corporates | Thai | 2026-06-19            </h3>            <p>              Strong traffic quality for a corporate audience.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,849.28 spend, 6,636 link clicks, 3,426 landing page views, 8.06% CTR, about 51.6% LPV-to-link-click rate.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic/consideration driver and test a lead-form version to see if strong LPV quality can convert into qualified B2B leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Conversions Shopee | 12Jun            </h3>            <p>              Efficient marketplace traffic even without tracked purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 3,921.74 spend, 5,454 link clicks, 3,098 landing page views, 8.46% CTR, about 56.8% LPV-to-link-click rate.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep at controlled budget, but do not scale as a purchase campaign until Shopee purchase tracking or downstream sales data is confirmed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026            </h3>            <p>              Strong landing page efficiency for ticket-sales traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,210.59 spend, 8,723 link clicks, 2,304 landing page views, 12.83% CTR, about THB 0.96 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and test this creative/message in a purchase or retargeting campaign.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              TH | Traffic | Families [Claude b ough.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,131.24 spend, 7,738 link clicks, only 61 landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild creative/destination before increasing spend; current traffic quality is too weak.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              FB Follow | Thailand | Aquaverse Lifestyle            </h3>            <p>              Large spend but weak page-like/follow outcome in supplied data.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 55,073.02 spend, 2,064,302 impressions, 1,121,861 page engagements, but only 3 likes reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce unless page engagement is the primary KPI. If the goal is followers, rebuild with follower/page-like optimization and clearer follow CTA.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              FB Follow | Thailand | Lookalike Fans Scale            </h3>            <p>              High spend with minimal reported follow-like action.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 38,714.79 spend, 1,832,504 impressions, 1,040,633 page engagements, but only 12 likes reported and only 30 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. The campaign may be creating engagement but is not showing strong follower growth in the supplied metrics.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | TH | Awareness | Videos | 17Jun            </h3>            <p>              Awareness volume is high, but frequency is elevated versus other awareness campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 41,519.83 spend, 7,678,849 impressions, 1,855,584 reach, frequency 4.14, 923,341 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only if frequency is intentional. Otherwise reduce budget and rotate fresh video creative to avoid over-serving.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | TH | Engagement | 12Jun            </h3>            <p>              Engagement campaign produced many clicks but weak landing page depth.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 19,616.74 spend, 23,845 link clicks, only 376 landing page views, 1 purchase.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not judge only by the 1 purchase because it is below the 3-result minimum. For engagement/traffic quality, reduce or rebuild because LPV follow-through is low.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                FB Follow | Thailand | Aquaverse Lifestyle and FB Follow | Thailand | Lookalike Fans Scale              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; and similar family/holiday messaging tests              </strong>            </div>            <p>              The two FB Follow campaigns spent THB 93,787.81 with only 15 reported likes, while the post campaign produced 8 leads and 4 purchases from THB 2,216.80.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse Corporate Groups - Leads - Test and TH | B2B Corporate | Video | Leads | 2026-06-18              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude | TH | Corporates | Thai | 2026-06-19 lead-form test              </strong>            </div>            <p>              The two lead campaigns spent THB 28,369.40 with 0 leads, while Claude | TH | Corporates | Thai generated 3,426 landing page views from THB 4,849.28.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Low-LPV corporate video/image tests, including Aquaverse Corporate Groups - Video - TEST and claude campagin test 1 image              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026 and Claude | TH | Conversions Shopee | 12Jun              </strong>            </div>            <p>              The low-LPV tests generated many clicks but poor site visits; Hot Weather 20 Jun and Shopee Conversions showed stronger LPV efficiency.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Claude | TH | Awareness | Videos | 17Jun if frequency continues rising              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Indian Market : Awareness and Claude | TH | Awareness | 18Jun              </strong>            </div>            <p>              Claude Awareness Videos reached frequency 4.14, while Indian Market Awareness and Claude Awareness 18Jun delivered lower-frequency, lower-cost reach.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Winning post scale test            </h3>            <p>              <strong>Setup:</strong>              Duplicate Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; into a dedicated campaign with the same post ID. Test messaging objective versus lead/conversion objective using the same creative.            </p>            <p>              <strong>Success metric:</strong>              At least 3 leads or 3 purchases per variant, then compare cost per lead, cost per purchase, messaging conversations started, and tracked purchase value.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Corporate lead-form test            </h3>            <p>              <strong>Setup:</strong>              Use Claude | TH | Corporates | Thai | 2026-06-19 audience/creative direction and launch a native lead form with qualifying fields for company name, group size, preferred date, and budget range.            </p>            <p>              <strong>Success metric:</strong>              Minimum 3 qualified leads before judging; compare lead volume and lead quality against existing corporate campaigns.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Traffic quality test: link click vs landing page view optimization            </h3>            <p>              <strong>Setup:</strong>              Run the same creative from Claude | TH | Traffic IMAGES | 18Jun and Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026 in two ad sets: one optimized for link clicks and one for landing page views.            </p>            <p>              <strong>Success metric:</strong>              Cost per landing page view and LPV-to-link-click rate, not just CTR.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Marketplace tracking test            </h3>            <p>              <strong>Setup:</strong>              Run separate controlled budgets for Claude | TH | Conversions Shopee | 12Jun, Claude | TH | Conversions Lazada | 12Jun, and Lazada 7.7 Campaign with consistent UTMs and marketplace reporting reconciliation.            </p>            <p>              <strong>Success metric:</strong>              Verified downstream marketplace sales or app/site visits tied back to campaign UTMs; do not scale only on Meta clicks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Retargeting from high-intent pools            </h3>            <p>              <strong>Setup:</strong>              Build retargeting audiences from landing page viewers, messaging engagers, and video viewers from the strongest traffic/awareness campaigns. Use the winning holiday/family offer as the retargeting creative.            </p>            <p>              <strong>Success metric:</strong>              At least 3 purchases or 3 leads before deciding; compare cost per result against cold campaigns.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>Purchases appear under multiple action types: omni_purchase, onsite_app_purchase, onsite_web_app_purchase, onsite_web_purchase, and onsite_conversion.purchase. These should not be summed; deduplication should be verified.</li><li>Some campaigns report landing page views with zero spend or zero impressions, such as TH | Traffic | Shopee Store [Claude build] reporting 7 LPVs with THB 0 spend.</li><li>Several campaigns have very large gaps between link clicks and landing page views, suggesting click-quality, load-speed, destination, or tracking issues. Example: Aquaverse Corporate Groups - Leads - Test had 1,868 link clicks but only 112 LPVs; claude campagin test 1 image had 7,738 link clicks but only 61 LPVs.</li><li>Some rows show inline link clicks higher than total clicks, such as Aquaverse Corporate Groups - Image Ads - Test with 3,019 inline link clicks versus 2,856 clicks. Click metric definitions or reporting extraction should be checked.</li><li>Marketplace campaigns may not have complete purchase tracking inside Meta. Shopee and Lazada campaigns show many landing page views/app site visits but few or no tracked purchases.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot span>Link clicks</span>        <strong>4,853,641</strong>        <small>          3.30% CTR          ·          THB 0.24 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>282</strong>        <small>          THB 4,896.50 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>2</strong>        <small>          THB 690,406.61 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>2,421</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 7.93</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Aquaverse generated very large reach and traffic in July: 174,224,944 impressions, 69,988,654 reach, 4,853,641 inline link clicks, 1,345,351 landing page views, 94 leads and 2 purchases from THB 1,380,813.22 spend. Top-funnel efficiency is strong in several image/awareness campaigns, and a few lead/messaging campaigns are clearly working. However, purchase data is insufficient for decisions because only 2 purchases were recorded versus the minimum decision threshold of 3, and several high-spend audience/video/follow campaigns consumed large budget without meaningful lead or purchase output. Account health is mixed due to strong traffic volume but weak bottom-funnel volume, tracking inconsistencies, and delivery stopping after July 16 except for attributed actions.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget toward proven lead and messaging winners            </h3>            <p>              <strong>Why:</strong>              The strongest lead/messaging campaigns produced materially better lead volume and cost efficiency than high-spend traffic/follow campaigns.            </p>            <p>              <strong>Do this:</strong>              Carefully scale Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;, Claude | IN | English | India Show 2025 | Traffic | 2026-06-13, and Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13 by increasing budgets gradually while monitoring leads, messaging conversations, and landing page views.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce high-spend audience/video campaigns with no leads            </h3>            <p>              <strong>Why:</strong>              Several campaigns spent significant budget and delivered traffic/video engagement but no recorded leads or purchases.            </p>            <p>              <strong>Do this:</strong>              Reduce or rebuild Claude | IN | Corporates | 6 Languages | 2026-06-19, Claude | IN | Corporates | 5 Languages | 2026-06-19, Claude | IN | Families | 6 Languages | 2026-06-19, Claude | IN | Singles | 6 Languages | 2026-06-19, and Claude | IN | Couples | 6 Languages | 2026-06-19 unless their only role is awareness.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness, follow, traffic, lead, and messaging objectives            </h3>            <p>              <strong>Why:</strong>              The account mixes objectives, so campaigns optimized for follows or engagement should not consume the same budget pool as lead or ticket-sale campaigns.            </p>            <p>              <strong>Do this:</strong>              Create separate budget caps by objective: awareness/engagement, traffic/LPV, messaging/lead generation, and purchase/retargeting. Do not optimize follow campaigns by purchases.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate tracking and attribution anomalies            </h3>            <p>              <strong>Why:</strong>              There are actions reported on zero-spend days and campaigns, and some campaigns show inconsistent click metrics.            </p>            <p>              <strong>Do this:</strong>              Audit Pixel/CAPI, event deduplication, attribution windows, campaign-status history, and reporting setup before making purchase-based decisions.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Do not make purchase scaling decisions yet            </h3>            <p>              <strong>Why:</strong>              Only 2 purchases were recorded account-wide, below the minimum_results_before_decision threshold of 3.            </p>            <p>              <strong>Do this:</strong>              Use leads, messaging conversations, landing page views, and click quality for near-term optimization until at least 3 purchase results are available per campaign or test.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;💦 Start your day with excitement and end it with...&amp;quot;            </h3>            <p>              Best bottom-funnel and messaging signal in the account.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,121.34 spend, 17 leads, 1 purchase, 351 messaging conversations started, 343 first replies, 522 total messaging connections, 2,392 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Rebuild this post into a dedicated lead/messaging campaign with similar creative and CTA.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | English | India Show 2025 | Traffic | 2026-06-13            </h3>            <p>              Strong lead and messaging performance from a small spend base.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,225.10 spend, 28 leads, 631 messaging conversations started, 618 first replies, 705 total messaging connections, 32,982 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Test the same concept as a dedicated lead or messaging objective rather than only traffic.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Malayalam | 04 Indian Urgent | Traffic | 2026-06-13            </h3>            <p>              Strong regional-language lead and messaging performer.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,199.89 spend, 24 leads, 647 messaging conversations started, 625 first replies, 695 total messaging connections, 33,746 link clicks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use Malayalam creative as a template for additional lead-focused language tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN_AWR_General_Image_Claude_2026-06-14            </h3>            <p>              Efficient awareness and traffic generation.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 22,856.24 spend, 11,293,716 impressions, 7,903,670 reach, 816,897 link clicks, 245,920 landing page views, CTR 7.36%, CPC THB 0.0275, CPM THB 2.02.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for awareness/traffic and use its engaged visitors for retargeting. Do not judge it by purchases unless rebuilt for conversion.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Daily 8 IMAGES MultiLang | 15Jun            </h3>            <p>              Very efficient traffic and landing page volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 12,553.05 spend, 458,282 link clicks, 135,706 landing page views, CTR 7.69%, CPC THB 0.0269, CPM THB 2.07.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as a traffic/retargeting seed campaign. Test best creatives from this campaign in lead and messaging objectives.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              IN | Image | Aquaverse Traffic | Test 1000INR            </h3>            <p>              High traffic and landing page volume at moderate cost.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 31,346.73 spend, 427,478 link clicks, 111,918 landing page views, CTR 4.45%, CPC THB 0.0774.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if traffic quality is confirmed. Rebuild top ads into a lead-focused test because no leads or purchases were recorded.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Most efficient page-like/follower-style campaign among the supplied follower campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 31,135.55 spend, 22,934 likes, 66,561 post reactions, 607,737 page engagements, frequency 3.49.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth is a defined objective. Cap frequency and avoid taking budget from lead campaigns.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Very high spend with no recorded leads or purchases.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 244,647.82 spend, 789,056 link clicks, 197,459 landing page views, 10,593,743 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce heavily or pause for lead/sales budget. Rebuild with a clearer corporate lead offer, form, or messaging CTA before spending at scale again.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              High spend without bottom-funnel results.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 110,389.99 spend, 358,830 link clicks, 103,177 landing page views, 4,444,795 video views, 0 leads, 0 purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild. If corporate is a priority segment, test a dedicated lead form or What
