  margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-12        →        2026-09-10      </span>      <span class=&quot;pill&quot;>        20 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 62,469.40</strong>        <small>          2026-08-12          to          2026-09-10        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>5,459,675</strong>        <small>          9,150,009 impressions          ·          1.68 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>349</strong>        <small>          0.93% CTR          ·          THB 0.73 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 20,823.13 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>6</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 6.83</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account generated strong awareness and engagement volume, but it is not currently proving progress toward profitable ticket sales or qualified leads. Spend was THB 62,469.40 for 9,150,009 impressions, 5,459,675 reach, 1,108,480 page engagements, 1,014,299 video views, 349 inline link clicks, 6 messaging conversation starts, 1 lead, and no reported purchases. Awareness/follower activity is working, especially AQ_MU2025_Followers_IN and New post engagement campaign, but lead, messaging, traffic, and purchase performance are insufficient or not being tracked clearly.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Separate awareness from sales and lead generation            </h3>            <p>              <strong>Why:</strong>              Most spend is going to follower, likes, visibility, and engagement campaigns. The account produced only 1 lead and no reported purchases from THB 62,469.40 spend.            </p>            <p>              <strong>Do this:</strong>              Keep awareness campaigns for reach and engagement, but launch or rebuild dedicated lead, messaging, and purchase/website conversion campaigns instead of expecting follower campaigns to drive ticket sales.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce budget from inefficient Broad Destination follower campaigns            </h3>            <p>              <strong>Why:</strong>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination spent THB 14,199.35 and produced only 1 inline link click, 1 lead, and 4 messaging conversation starts. Lead volume is below the minimum decision threshold of 3, but traffic and messaging output are weak for the spend.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign materially and move budget into a dedicated lead/purchase test plus stronger awareness campaigns. Do not judge the 1 lead as conclusive yet because it is below 3 results.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Audit all ERROR QUARANTINED campaigns            </h3>            <p>              <strong>Why:</strong>              Multiple active campaigns contain ERROR QUARANTINED in the name and spent meaningful budget, including ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers at THB 4,718.41 and ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination at THB 4,304.20.            </p>            <p>              <strong>Do this:</strong>              Check delivery status, naming, duplicate setup, placements, and objective settings. Consolidate valid campaigns and stop creating duplicate quarantined versions unless they are intentional tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix measurement before scaling sales spend            </h3>            <p>              <strong>Why:</strong>              The account reports 85,305 clicks but only 349 inline link clicks, 1 lead, and no purchase events. This makes sales attribution unreliable.            </p>            <p>              <strong>Do this:</strong>              Verify pixel/CAPI, purchase event firing, lead event deduplication, UTMs, landing page view tracking, and campaign objective alignment before increasing spend toward ticket sales.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement driver.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 26,901.23 and generated 468,520 page engagements, 444,486 post engagements, 24,034 likes, 39,052 post reactions, 3,338 comments, 1,012 saves, 398,342 video views, CTR 4.06%, CPC THB 0.45, frequency 4.12.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep, but scale carefully only with creative refreshes because frequency is already the highest major campaign at 4.12. Use this audience pool for retargeting rather than judging it by purchases.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Efficient low-cost awareness and engagement campaign with the best inline link click volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent only THB 1,204.21 and generated 477,795 impressions, 417,551 reach, 161,079 page engagements, 151,421 video views, and 201 inline link clicks. CPM was THB 2.52 and frequency was 1.14.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Test using its winning post/creative inside traffic, lead, and retargeting campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very efficient reach and video visibility despite no website traffic.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 4,718.41 for 6,593,965 impressions, 4,492,195 reach, CPM THB 0.72, 344,045 post engagements, and 339,590 video views. Inline link clicks were 0.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is awareness/video visibility and the quarantined status is not a delivery problem. Do not use it as a traffic, lead, or purchase driver.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              One duplicate version delivered relatively efficient engagement.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The version spending THB 1,487.24 generated 14,109 page engagements, 13,431 video views, 208 likes, CTR 3.95%, and CPC THB 0.74.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              If this campaign is intentionally live, consolidate it with other duplicate Broad Destination versions and keep only the strongest setup after checking naming/status.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Large spend is not translating into traffic, leads, or meaningful messaging volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 14,199.35 for 297,353 impressions, 9,517 clicks, only 1 inline link click, 1 lead, 4 messaging conversation starts, 764 likes, CPM THB 47.75, and CPC THB 1.49.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild. If the goal is leads or ticket sales, use a lead, messaging, traffic, or purchase objective instead of a follows/likes setup. Do not pause solely because of 1 lead, as lead volume is below the minimum result threshold of 3.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              High delivery cost for a small reach pool.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 2,362.29 for only 10,833 impressions and 7,589 reach, with CPM THB 218.06. It did generate 1,130 likes and CTR 11.85%, but no inline link clicks, leads, or purchases were reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild if Thailand is not a priority market for the current business goal. If kept for follower growth, cap budget and refresh audience/creative to address the high CPM.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-23 | 1. Broad Destination            </h3>            <p>              Meaningful spend with no traffic, leads, messaging, or purchases reported.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spent THB 4,304.20, generated 85,233 impressions, 3,163 clicks, 19,292 page engagements, 762 likes, 125 comments, but 0 inline link clicks and no lead, messaging conversation, or purchase actions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or consolidate into the best-performing Broad Destination version. Rebuild if the goal is traffic, leads, or ticket sales.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination            </h3>            <p>              Several duplicate versions are fragmenting budget and most are not generating traffic or leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Versions spent THB 1,487.24, THB 1,022.51, and THB 2,430.56. Combined, they generated only 1 inline link click and 1 messaging conversation start, with no leads or purchases reported.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate duplicates. Keep only the best engagement version if follower growth is the objective; otherwise rebuild under lead, messaging, or website conversion objectives.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Too little data to make a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Four versions spent only THB 7.06, THB 4.26, THB 6.55, and THB 6.64 respectively, with fewer than 60 impressions each.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause based on performance. Either allow a clean test budget to collect data or remove only if these are accidental duplicate/quarantined builds.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New dedicated lead or purchase/website conversion campaign              </strong>            </div>            <p>              This campaign consumed THB 14,199.35 but produced only 1 inline link click, 1 lead, and 4 messaging conversation starts. Lead results are below the 3-result decision threshold, but the campaign is clearly not structured for traffic or sales.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED duplicate Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Consolidated best-performing awareness campaign plus retargeting              </strong>            </div>            <p>              Multiple ERROR QUARANTINED Broad Destination campaigns spent budget separately while producing little to no inline link clicks, leads, or purchases. Consolidation will reduce fragmentation.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India-focused lead, messaging, or ticket-sales test if India is the current priority              </strong>            </div>            <p>              The Thailand campaign had very high CPM at THB 218.06 and no reported inline link clicks, leads, or purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Current awareness-heavy allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN and New post engagement campaign for top-of-funnel only              </strong>            </div>            <p>              AQ_MU2025_Followers_IN delivered 468,520 page engagements and 24,034 likes, while New post engagement campaign delivered 161,079 page engagements at only THB 1,204.21 spend. These should support retargeting, not carry the full sales goal.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead generation campaign test            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated Meta lead form campaign using audiences built from page engagers, video viewers, and broad India targeting. Use the strongest creative/post angles from AQ_MU2025_Followers_IN and New post engagement campaign.            </p>            <p>              <strong>Success metric:</strong>              Evaluate cost per lead and lead quality only after at least 3 leads, per the minimum_results_before_decision.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Website ticket-sales or landing-page traffic test            </h3>            <p>              <strong>Setup:</strong>              Run a campaign optimized for the most relevant available website event, such as landing page views, leads, or purchases if tracking is working. Use UTMs on all ads.            </p>            <p>              <strong>Success metric:</strong>              Judge by inline link clicks, landing page views, tracked leads, and purchases. Do not scale purchase optimization until purchase events are confirmed.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Retargeting from engaged audiences            </h3>            <p>              <strong>Setup:</strong>              Create retargeting ad sets for page engagers, video viewers, post savers, commenters, and messaging engagers from the reporting period. Use ticket or enquiry-focused creative.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversation starts, leads, and purchases, with decisions made only after at least 3 results per conversion type.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging objective campaign            </h3>            <p>              <strong>Setup:</strong>              Run a dedicated click-to-message campaign instead of relying on follower campaigns. Use qualifying questions around ticket interest, date, group size, and location.            </p>            <p>              <strong>Success metric:</strong>              Messaging conversations started, first replies, and qualified conversations. Current account total is only 6 conversation starts.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative refresh for AQ_MU2025_Followers_IN            </h3>            <p>              <strong>Setup:</strong>              Introduce new follower/engagement creatives while keeping the same campaign objective and audience structure.            </p>            <p>              <strong>Success metric:</strong>              Maintain engagement volume while preventing frequency from rising materially above the current 4.12.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase actions or ROAS are reported, so purchase performance cannot be assessed.</li><li>The account reports 85,305 clicks but only 349 inline link clicks, indicating most clicks are likely engagement clicks rather than website traffic or that link tracking/objectives are misaligned.</li><li>Lead actions appear under multiple labels, including onsite_conversion.lead, onsite_web_lead, lead, and lead_grouped, each showing value 1. Confirm whether these are duplicate reporting of the same lead event.</li><li>Several campaigns show thousands of clicks but 0 inline link clicks, including ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers with 2,387 clicks and 0 inline link clicks.</li><li>Multiple campaigns contain ERROR QUARANTINED in the campaign name, which requires setup/status validation before interpreting results or scaling.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep the strongest awareness engines, especially AQ_MU2025_Followers_IN and New post engagement campaign, but stop relying on follower/engagement campaigns to drive ticket sales and qualified leads. Reduce inefficient and duplicate Broad Destination and ERROR QUARANTINED spend, verify tracking, then reallocate budget into clean lead, messaging, retargeting, and website conversion tests. Do not make hard lead-performance decisions until each lead-focused test reaches at least 3 results.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout campaigns    </h2>    <div class=&quot;insights&quot;>                <div class=&quot;insight&quot;>            <span>Highest CTR</span>            <strong>11.85% · ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailan
