    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-08-11        →        2026-09-09      </span>      <span class=&quot;pill&quot;>        20 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 68,432.49</strong>        <small>          2026-08-11          to          2026-09-09        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>6,010,852</strong>        <small>          10,073,610 impressions          ·          1.68 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>389</strong>        <small>          0.92% CTR          ·          THB 0.74 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 22,810.83 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>8</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 6.79</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        The account delivered very large awareness and engagement volume: 10,073,610 impressions, 6,010,852 reach, 1,217,263 page engagements, and 1,118,975 video views from THB 68,432.49 spend. However, performance is weak against the business goal of ticket sales and qualified leads: only 1 lead, 8 messaging conversations started, and no purchase or ROAS data were reported. Most spend is going to follower, likes, visibility, and engagement campaigns rather than lead, messaging, or purchase campaigns.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Shift budget away from duplicated Follows/Likes campaigns into goal-based lead, messaging, and purchase campaigns            </h3>            <p>              <strong>Why:</strong>              The account generated only 1 lead and 8 messaging conversation starts from THB 68,432.49 spend, while most campaigns are optimized for followers, likes, visibility, or engagement.            </p>            <p>              <strong>Do this:</strong>              Reduce spend on duplicated &amp;#039;Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination&amp;#039; and &amp;#039;ERROR QUARANTINED | Aquaverse India Daily Follows Likes...&amp;#039; campaigns, and launch dedicated Lead, Messaging, and Purchase campaigns using the same high-engagement audiences.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Keep and carefully scale &amp;#039;New post engagement campaign&amp;#039;            </h3>            <p>              <strong>Why:</strong>              It produced 233 of 389 account inline link clicks while spending only THB 1,498.15, giving the strongest cost per inline link click at THB 6.43.            </p>            <p>              <strong>Do this:</strong>              Increase budget carefully in small steps and test traffic or lead-focused versions of the winning post creative.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild the largest Broad Destination campaign for leads/messages            </h3>            <p>              <strong>Why:</strong>              &amp;#039;Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination&amp;#039; spent THB 18,364.31 and produced only 1 inline link click, but did generate the only lead and 5 of 8 messaging conversation starts.            </p>            <p>              <strong>Do this:</strong>              Do not judge it only by the 1 lead because it is below the 3-result minimum for lead decisions. Rebuild it as a proper Lead or Messaging campaign and use qualified lead or conversation-start optimization instead of follows/likes.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix purchase and lead tracking before scaling sales spend            </h3>            <p>              <strong>Why:</strong>              No purchase, revenue, ROAS, or ticket-sale events are present, so profitable ticket-sale performance cannot be evaluated.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI purchase events, lead events, event deduplication, and checkout attribution before making sales scaling decisions.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Audit campaigns marked &amp;#039;ERROR QUARANTINED&amp;#039;            </h3>            <p>              <strong>Why:</strong>              Many active campaigns include &amp;#039;ERROR QUARANTINED&amp;#039; in the name and collectively spend meaningful budget, creating execution and reporting risk.            </p>            <p>              <strong>Do this:</strong>              Review delivery status, ad review status, campaign setup, and naming. Rebuild clean versions of any quarantined campaigns that should continue running.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best traffic-like performer in the account despite being an engagement campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,498.15 spend, 233 inline link clicks, THB 6.43 cost per inline link click, 196,251 page engagements, 185,965 video views, CPM THB 2.61.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use the winning post creative in a dedicated Traffic, Lead, or Messaging test.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 27,298 spend, 478,795 page engagements, 454,375 post engagements, 24,420 likes, 40,194 post reactions, CTR 4.10%.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for follower/engagement objectives, but do not scale aggressively for ticket sales or leads. Refresh creative because frequency is 4.10.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very efficient awareness reach.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,182.42 spend, 7,282,817 impressions, 4,856,398 reach, CPM THB 0.71, 379,613 page engagements, 374,673 video views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the objective is cheap awareness or visibility. Rebuild/rename because of the &amp;#039;ERROR QUARANTINED&amp;#039; status/name and do not use it for traffic or leads.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              Only campaign showing any lead signal and the strongest messaging signal.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 18,364.31 spend, 1 lead, 5 messaging conversation starts, 5 messaging first replies, 1,001 likes, 88,562 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not pause based on lead volume because 1 lead is below the 3-result minimum. Rebuild into Lead and Messaging campaigns and use the current audience as a starting point.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Account overall            </h3>            <p>              Spend is not aligned with the stated business goal of profitable ticket sales and qualified leads.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 68,432.49 spend generated 1 lead, 8 messaging conversation starts, 389 inline link clicks, and no purchase or ROAS data.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Create dedicated Lead, Messaging, and Purchase campaigns. Keep awareness/engagement campaigns on controlled budgets only.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination            </h3>            <p>              High spend with very weak site traffic output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 18,364.31 spend, 407,471 impressions, 14,110 clicks, but only 1 inline link click and 1 lead.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce current budget and rebuild objective/creative/CTA around leads, messages, or ticket sales.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              Expensive delivery compared with other awareness and engagement campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 2,541.80 spend, only 11,851 impressions, CPM THB 214.48, 0 inline link clicks, 4,643 page engagements.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce or rebuild before adding budget. Check targeting, placement, and campaign status.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Not suitable for traffic or conversion goals.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              7,282,817 impressions and 379,613 page engagements, but only 1 inline link click from THB 5,182.42 spend.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Use only as low-cost awareness. Exclude it from lead or sales performance evaluation.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Duplicated &amp;#039;ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-25 | 1. Broad Destination&amp;#039; campaigns            </h3>            <p>              Multiple similar campaigns are fragmenting spend with little direct lead or traffic output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The 08-25 variants spent THB 1,487.24, THB 1,022.51, and THB 2,430.56; together they produced only 1 inline link click, 1 messaging conversation start, and 0 leads.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate into fewer clean campaigns and retest with a clear Lead or Messaging objective.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Follows Likes 2026-08-28 | 1. Broad Destination            </h3>            <p>              Insufficient data for a performance decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              The 08-28 variants spent only THB 7.06, THB 4.26, THB 6.55, and THB 6.64 with extremely small reach and impressions.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not pause or scale based on this tiny sample. Either give the test enough budget to reach meaningful data or remove it as a setup duplicate.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Duplicated Broad Destination Follows/Likes campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Dedicated Lead and Messaging campaigns              </strong>            </div>            <p>              The account has enough engagement volume but only 1 lead and 8 messaging starts. Budget should move closer to the business goal.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Rebuilt Lead/Messaging version of the same audience              </strong>            </div>            <p>              It spent THB 18,364.31 and produced the only lead plus 5 messaging starts, but the current follows/likes setup produced only 1 inline link click.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign or a clean Thailand test campaign              </strong>            </div>            <p>              Thailand campaign CPM is THB 214.48 with 0 inline link clicks, while &amp;#039;New post engagement campaign&amp;#039; achieved CPM THB 2.61 and THB 6.43 per inline link click.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Low-volume 08-28 duplicated quarantined campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Consolidated campaign structure              </strong>            </div>            <p>              Each 08-28 campaign has only THB 4.26-THB 7.06 spend, which is too small for decisions and adds unnecessary account fragmentation.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Awareness-only visibility budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Retargeting audience built from video viewers, engagers, and page visitors              </strong>            </div>            <p>              &amp;#039;ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility...&amp;#039; generated 374,673 video views and 379,613 page engagements that can be used for lower-funnel retargeting.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Lead campaign test from high-engagement audiences            </h3>            <p>              <strong>Setup:</strong>              Create a dedicated Lead campaign targeting recent page engagers, video viewers, and broad India audiences. Use ticket/visit intent creatives and lead-form questions to qualify users.            </p>            <p>              <strong>Success metric:</strong>              Wait for at least 3 leads before judging. Compare cost per lead against the current lead signal from &amp;#039;Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination&amp;#039;.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Click-to-message ticket enquiry campaign            </h3>            <p>              <strong>Setup:</strong>              Launch a Messaging campaign using the best engagement creatives and quick replies such as ticket price, opening hours, group booking, and location.            </p>            <p>              <strong>Success metric:</strong>              At least 3 messaging conversation starts, then compare cost per conversation against the current best messaging campaign: &amp;#039;Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination&amp;#039; at approximately THB 3,672.86 per conversation start.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Traffic or landing page view version of &amp;#039;New post engagement campaign&amp;#039;            </h3>            <p>              <strong>Setup:</strong>              Duplicate the winning post into a Traffic or landing page view campaign with the same creative and a ticket-focused CTA.            </p>            <p>              <strong>Success metric:</strong>              Compare inline link click cost against the current &amp;#039;New post engagement campaign&amp;#039; result of THB 6.43 per inline link click.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Purchase tracking validation campaign            </h3>            <p>              <strong>Setup:</strong>              Run a small purchase-optimized or checkout traffic test only after purchase events are verified. Use UTM-tagged ads and confirm events in Events Manager.            </p>            <p>              <strong>Success metric:</strong>              Successful reporting of purchase events and revenue. Do not judge ROAS until purchase tracking is confirmed.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Creative split test: ticket offer vs destination experience            </h3>            <p>              <strong>Setup:</strong>              Test two creative angles in a clean campaign: direct ticket/offer messaging versus emotional Aquaverse experience content.            </p>            <p>              <strong>Success metric:</strong>              For lead campaigns, judge after at least 3 leads. For traffic campaigns, compare inline link click cost and click-to-lead rate.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Tracking and attribution checks    </h2>    <div class=&quot;panel&quot;>          <ul class=&quot;tracking-list&quot;>      <li>No purchase events, purchase value, or ROAS are present, so ticket-sale profitability cannot be evaluated.</li><li>Only 1 lead is reported across THB 68,432.49 spend, which is below the 3-result minimum for making lead-performance decisions.</li><li>There is a large gap between total clicks and inline link clicks: 92,367 clicks vs 389 inline link clicks. This suggests most clicks are engagement/page clicks rather than website traffic.</li><li>Multiple lead-related action types appear for the same small volume, including onsite_conversion.lead, onsite_web_lead, lead, and onsite_conversion.lead_grouped. Confirm event mapping and deduplication.</li><li>Many campaign names include &amp;#039;ERROR QUARANTINED&amp;#039;, which should be reviewed for delivery, review, or setup issues.</li>    </ul>
