    </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 513,980.81</strong>        <small>          2026-06-25          to          2026-07-24        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>11,204,090</strong>        <small>          37,824,446 impressions          ·          3.38 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>609,267</strong>        <small>          2.54% CTR          ·          THB 0.54 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>36</strong>        <small>          THB 14,277.24 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>7</strong>        <small>          THB 73,425.83 cost per purchase        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          THB 2,176.00        </strong>        <small>          0.00× reported ROAS        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>280</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 13.59</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. The account generated very large reach and traffic: 37,824,446 impressions, 11,204,090 reach, 609,267 link clicks, 112,655 landing page views, 12 leads, 280 messaging conversations started, and 7 purchases from 513,980.81 THB spend. Traffic volume is strong, but sales and lead capture are concentrated in very few campaigns. The clearest purchase and lead winner is Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; with 4 purchases, 8 leads, and 47 messaging conversations started from 2,914.22 THB spend. Several traffic campaigns are producing efficient landing page views, while multiple follower, corporate lead, and video test campaigns are spending heavily with weak or zero lead/purchase output.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the only campaign with enough purchase and lead volume            </h3>            <p>              <strong>Why:</strong>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot; reached the minimum decision threshold with 4 purchases and 8 leads from 2,914.22 THB spend. It is the strongest combined purchase, lead, and messaging performer.            </p>            <p>              <strong>Do this:</strong>              Increase budget on this post/campaign gradually by 15-20% at a time, keep the same creative and audience initially, and monitor purchase count, lead count, messaging conversations, and landing page views daily.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce spend on follower campaigns and rebuild them around the actual objective            </h3>            <p>              <strong>Why:</strong>              FB Follow | Thailand | Aquaverse Lifestyle spent 56,593.82 THB for only 3 likes, and FB Follow | Thailand | Lookalike Fans Scale spent 39,637.19 THB for only 10 likes. These campaigns are producing engagement/video views but very little follower-like output.            </p>            <p>              <strong>Do this:</strong>              Cut or pause current follower scaling budgets and rebuild with clearer page follow/page like optimization, stronger follow CTA creative, and separate tests for broad Thailand versus lookalike fans.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild corporate lead generation instead of continuing current lead campaigns            </h3>            <p>              <strong>Why:</strong>              Aquaverse Corporate Groups - Leads - Test spent 13,058.89 THB with 0 leads, and TH | B2B Corporate | Video | Leads | 2026-06-18 spent 22,964.66 THB with 0 leads and frequency 6.61. Current corporate lead campaigns are not converting despite traffic.            </p>            <p>              <strong>Do this:</strong>              Stop scaling the current corporate lead structure. Rebuild with instant forms or a dedicated lead landing page, tighter B2B offer messaging, and retarget users who clicked or watched corporate videos.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Shift traffic budget toward campaigns with strong landing page view efficiency            </h3>            <p>              <strong>Why:</strong>              Aquaverse TH | Hot Weather Escape | Ticket Sales | 20 Jun 2026 generated 6,029 landing page views from 4,327.02 THB spend, while Claude | TH | Corporates | Thai | 2026-06-19 generated 4,247 landing page views from 7,122.44 THB spend. These are stronger traffic-quality signals than campaigns with large click-to-LPV drop-offs.            </p>            <p>              <strong>Do this:</strong>              Increase budget on the best landing page view campaigns and reduce campaigns where link clicks do not turn into landing page views, especially Hot Weather Escape | 2026-06-25 and several corporate video tests.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix tracking gaps before making profitability decisions            </h3>            <p>              <strong>Why:</strong>              The account recorded 609,267 link clicks but only 112,655 landing page views, and purchase value is only reported on one purchase campaign despite 7 total purchases. Marketplace campaigns may not be passing back final sales.            </p>            <p>              <strong>Do this:</strong>              Audit pixel/CAPI, landing page view firing, purchase value mapping, marketplace tracking, and duplicated onsite_web/app purchase events before judging true profitability.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;🎉หยุดยาวนี้แอดชวนยกบ้านมาเที่ยวที่ 𝐂𝐨𝐥𝐮𝐦𝐛𝐢𝐚...&amp;quot;            </h3>            <p>              Best full-funnel performer with enough data for a purchase and lead decision.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 2,914.22 THB, 4 purchases, 8 leads, 47 messaging conversations started, 49 messaging replies, and purchase value 2,176 THB.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this creative/message as the control for new purchase, lead, and messaging tests.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Post: &amp;quot;หมุนกันกี่รอบ...ก็สนุกไม่เปลี่ยน💦&amp;quot;            </h3>            <p>              Strong messaging performer, but purchase and lead volume is below the minimum decision threshold.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 655.97 THB, 49 messaging conversations started, 48 messaging replies, 1 purchase, and 1 lead.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for messaging and retargeting. Do not make a purchase-scaling decision yet because it has only 1 purchase.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Instagram post:...            </h3>            <p> rong>Next step:</strong>              Keep the stronger variants active and use them as retargeting audience sources for purchase and messaging campaigns.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Corporates | Thai | 2026-06-19            </h3>            <p>              Best corporate traffic-quality campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 7,122.44 THB, 9,986 link clicks, 4,247 landing page views, CTR 8.50%, and roughly 42.5% of link clicks became landing page views.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for corporate traffic and build a lead-retargeting layer from landing page viewers.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Conversions Shopee | 12Jun            </h3>            <p>              Good marketplace traffic quality relative to other marketplace campaigns.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 4,726.38 THB, 5,630 link clicks, 2,481 landing page views, CTR 3.68%, and about 44.1% link-click-to-LPV rate.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep as Shopee traffic support, but do not judge by purchases unless marketplace purchase tracking is confirmed.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | TH | Engagement | Videos | 17Jun            </h3>            <p>              Strong engagement and traffic hybrid campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Spend 13,603.08 THB, ite_conversion.lead, onsite_web_lead, lead, and lead_grouped. Use one primary lead definition for reporting to avoid double counting.</li><li>Marketplace purchase attribution is likely incomplete. Shopee/Lazada traffic campaigns generate landing page views and app/site visits, but no purchase data is visible in the supplied campaign rows.</li><li>Targets for cost per lead, cost per purchase, and ROAS are unknown, so performance can be ranked internally but not judged against profitability targets.</li>    </ul>      </div>  </section>          <section class=&quot;section&quot;>          <h2 class=&quot;section-title&quot;>            Final recommendation          </h2>          <div class=&quot;final-recommendation&quot;>            Keep awareness and engagement campaigns only where they are clearly building cheap reach, video views, or retargeting pools. Carefully scale the proven Columbia family post because it is the only campaign above the minimum result threshold for both purchases and leads. Reallocate budget away from follower campaigns, weak corporate lead campaigns, and ticket-sales variants with poor landing page view quality. Rebuild corporate lead generation with instant forms and retargeting. Before making profitability decisions, fix purchase value tracking, marketplace attribution, and the large link-click-to-landing-page-view gap.          </div>        </section>        <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Standout campaigns    </h2>    <div class=&quot;insights&quot;>                <div class=&quot;insight&quot;>            <span>Highest CTR</span>            <strong>18.80% · Aquaverse Corporate Groups - Video - INDIA TEST</strong>          </div>                  <div class=&quot;insight&quot;>            <span>Lowest CPC</span>            <strong>THB 0.05 · Aquaverse Corporate Groups - Video - INDIA TEST</strong>          </div>                  <div class=&quot;insight&quot;>            <span>Most le
