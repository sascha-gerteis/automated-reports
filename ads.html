        <span>Amount spent</span>        <strong>THB 17,499.88</strong>        <small>          2026-09-15          to          2026-10-14        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>904,244</strong>        <small>          1,734,708 impressions          ·          1.92 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>4,875</strong>        <small>          2.45% CTR          ·          THB 0.41 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>0</strong>        <small>          No tracked leads returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>4</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 10.09</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Awareness and engagement delivery is strong, but the account is not yet proving the business goal of profitable ticket sales and qualified leads. Across THB 17,499.88 spend, the account generated 171,888 page engagements, 135,906 video views, 10,082 likes, and 4,875 link clicks, but no reported leads or purchases. Traffic quality is mixed: only 234 landing page views came from 4,875 link clicks. Messaging performance is weak at account level with 654 messaging blocks, 6 total messaging connections, and 4 conversations started.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Fix lead and purchase tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              No lead or purchase actions are reported, so ticket sales and qualified lead performance cannot be evaluated.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI events for Lead, Purchase, and ticket checkout steps; confirm events appear in Ads Manager before scaling sales or lead campaigns.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reallocate budget away from low-quality traffic            </h3>            <p>              <strong>Why:</strong>              Aquaverse India | Instagram Followers | 2026-09-27 spent THB 5,466.92 and generated 3,775 link clicks but only 52 landing page views, a 1.4% LPV-to-link-click rate.            </p>            <p>              <strong>Do this:</strong>              Reduce this campaign and move budget into AQ Operator CBO | IN | Instagram Followers and a new lead or ticket-sales test once tracking is verified.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Carefully scale the strongest traffic-quality campaign            </h3>            <p>              <strong>Why:</strong>              AQ Operator CBO | IN | Instagram Followers produced 182 landing page views from 1,078 link clicks, with THB 8.03 cost per landing page view and a 16.9% LPV-to-link-click rate.            </p>            <p>              <strong>Do this:</strong>              Keep this campaign active and increase budget gradually while monitoring landing page views, messaging quality, and eventual lead or purchase events.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Cap follower-only spend unless follower growth remains a priority            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN spent THB 9,329.51, over half of total spend, and generated strong awareness results but no landing page views, leads, or purchases.            </p>            <p>              <strong>Do this:</strong>              Keep it for follower and engagement growth, but cap or reduce budget if the immediate priority is ticket sales and qualified leads.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Investigate messaging quality and block volume            </h3>            <p>              <strong>Why:</strong>              The account recorded 654 messaging blocks versus only 6 total messaging connections and 4 conversations started.            </p>            <p>              <strong>Do this:</strong>              Review message destination, automated replies, opening message copy, and audience intent before increasing click-to-message spend.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Best campaign for follower and engagement volume.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 9,329.51 spend generated 9,185 likes, 117,819 post engagements, 127,004 page engagements, 101,679 video views, CTR 4.18%, and cost per like of THB 1.02.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep if awareness/follower growth is required, but do not treat it as a ticket-sales or lead driver based on the supplied data.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Best campaign for landing page visit quality and efficient engagement.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,461.04 spend generated 1,078 link clicks, 182 landing page views, 33,933 post engagements, CPM THB 5.32, and cost per landing page view of THB 8.03.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully scale. Use this structure as the base for traffic, lead, and ticket-sales testing.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Generates page likes, but mainly as an awareness/follow campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,242.41 spend generated 897 likes and 3,628 page engagements with 8.99% CTR.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if follower growth is needed; otherwise reduce because it does not contribute link clicks, landing page views, leads, or purchases.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India | Instagram Followers | 2026-09-27            </h3>            <p>              High click volume is not translating into landing page visits or quality messaging outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,466.92 spend produced 3,775 link clicks but only 52 landing page views, 450 messaging blocks, 4 total messaging connections, and 2 conversations started.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce and rebuild with a clearer destination, stronger ticket/lead CTA, and tracking validation before scaling again.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination            </h3>            <p>              Inefficient compared with the stronger follower campaign.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              CPM is THB 98.16, cost per like is THB 1.38, and inline link clicks are 0. AQ_MU2025_Followers_IN produced likes at THB 1.02 each.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget or rebuild targeting/creative rather than scaling in its current form.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong awareness performance but weak alignment with ticket sales and lead goals.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              It spent THB 9,329.51 and generated 9,185 likes, but only 24 link clicks and no reported landing page views, leads, or purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep for awareness only; move part of the budget into traffic, lead, messaging, or purchase campaigns once tracking is working.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              AQ Operator CBO | IN | Instagram Followers            </h3>            <p>              Messaging performance is not yet decision-ready at campaign level.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Only 2 total messaging connections and 2 conversations started are reported, below the minimum 3 results required for a firm decision.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Do not judge this campaign by messaging yet; continue measuring while optimizing primarily around landing page views.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India | Instagram Followers | 2026-09-27              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ Operator CBO | IN | Instagram Followers              </strong>            </div>            <p>              AQ Operator CBO has much stronger traffic quality: THB 8.03 cost per landing page view versus THB 105.13 for Aquaverse India | Instagram Followers | 2026-09-27.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-09-26 | 1. Broad Destination              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                AQ_MU2025_Followers_IN or a new ticket/lead test              </strong>            </div>            <p>              Daily Follows Likes has a higher cost per like at THB 1.38 and CPM of THB 98.16, while AQ_MU2025_Followers_IN produces likes at THB 1.02.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                A portion of AQ_MU2025_Followers_IN follower budget              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead or ticket-sales campaign after tracking verification              </strong>            </div>            <p>              AQ_MU2025_Followers_IN is consuming THB 9,329.51 with strong engagement, but it is not producing measurable leads, purchases, or landing page views.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Ticket sales or lead conversion campaign            </h3>            <p>              <strong>Setup:</strong>              After Lead and Purchase tracking is verified, launch a dedicated campaign using ticket-focused creative and direct booking/lead destinations.            </p>            <p>              <strong>Success metric:</strong>              Judge by reported leads, purchases, cost per result, and downstream quality once at least 3 results are recorded.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Retarget engaged users            </h3>            <p>              <strong>Setup:</strong>              Create retargeting audiences from 135,906 video views, 171,888 page engagements, 4,875 link clicks, and 234 landing page views; serve ticket or inquiry CTAs.            </p>            <p>              <strong>Success metric:</strong>              Landing page views, leads, purchases, and messaging connections once each reaches at least 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Landing page quality test            </h3>            <p>              <strong>Setup:</strong>              Run AQ Operator CBO | IN | Instagram Followers structure against the current destination and an improved ticket/lead landing page.            </p>            <p>              <strong>Success metric:</strong>              Higher landing page view rate from link clicks and lower cost per landing page view.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Messaging qualification test            </h3>            <p>              <strong>Setup:</strong>              Test a click-to-message flow with clear pricing, location, ticket availability, and lead qualification questions in the first reply.            </p>            <p>              <strong>Success metric:</strong>              More total messaging connections and conversations started, with fewer messaging blocks.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Follower creative vs ticket intent creative            </h3>            <p>              <strong>Setup:</strong>              Run current follower-style creative against ticket-focused creative using the same audience and budget split.            </p>            <p>              <strong>Success metric:</strong>              Compare link clicks, landin
