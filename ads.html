    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .finding.positive {    border-left: 5px solid #16a34a;  }  .finding.negative {    border-left: 5px solid #dc2626;  }  .finding h3 {    margin: 0 0 8px;    font-size: 16px;  }  .finding p {    margin: 0 0 10px;    color: #526077;  }  .evidence,  .recommendation {    font-size: 13px;    margin-top: 7px;    color: #445168;  }  .budget-row {    display: grid;    grid-template-columns: 1fr 40px 1fr;    gap: 12px;    align-items: center;    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 17px;    margin-bottom: 12px;  }  .budget-row span {    display: block;    color: #8490a3;    font-size: 11px;    text-transform: uppercase;    letter-spacing: 0.06em;  }  .budget-row strong {    display: block;    margin-top: 4px;  }  .budget-row p {    grid-column: 1 / -1;    margin: 2px 0 0;    color: #59677d;    font-size: 13px;  }  .budget-arrow {    text-align: center;    font-size: 22px;    color: #315fda;  }  .test-grid {    display: grid;    grid-template-columns: repeat(3, minmax(0, 1fr));    gap: 14px;  }  .test-card {    background: #fff;    border: 1px solid #e3e9f3;    border-radius: 16px;    padding: 18px;  }  .test-index {    font-size: 10px;    text-transform: uppercase;    letter-spacing: 0.08em;    color: #315fda;    font-weight: 800;  }  .test-card h3 {    margin: 7px 0 10px;    font-size: 16px;  }  .test-card p {    font-size: 13px;    color: #526077;    margin: 7px 0;  }  .tracking-list {    margin: 0;    padding-left: 20px;  }  .tracking-list li {    margin: 8px 0;    color: #526077;  }  .final-recommendation {    background: #101b3a;    color: #fff;    border-radius: 18px;    padding: 22px;    font-size: 15px;  }  .warning {    margin-top: 12px;    padding: 11px 13px;    border-radius: 10px;    background: #fff4e5;    color: #8a5200;    font-size: 12px;  }  @media (max-width: 850px) {    .cards {      grid-template-columns: repeat(2, minmax(0, 1fr));    }    .insights,    .action-grid,    .finding-grid {      grid-template-columns: 1fr;    }    .test-grid {      grid-template-columns: 1fr;    }    .hero h1 {      font-size: 27px;    }  }  @media (max-width: 520px) {    .cards {      grid-template-columns: 1fr;    }    .hero {      padding: 25px;    }    .trend-row {      grid-template-columns: 76px 1fr 82px;    }    .budget-row {      grid-template-columns: 1fr;    }    .budget-arrow {      transform: rotate(90deg);    }    .ai-header {      align-items: flex-start;      flex-direction: column;    }  }</style></head><body><div class=&quot;page&quot;>  <section class=&quot;hero&quot;>    <div class=&quot;eyebrow&quot;>      Nexus      · Meta Ads Performance    </div>    <h1>      Aquaverse    </h1>    <p>      A clear view of media spend, traffic, tracked      conversions and recommended next actions.    </p>    <div class=&quot;meta&quot;>      <span class=&quot;pill&quot;>        India Ad Account      </span>      <span class=&quot;pill&quot;>        2026-07-26        →        2026-08-24      </span>      <span class=&quot;pill&quot;>        15 campaigns with spend      </span>      <span class=&quot;pill&quot;>        Currency: THB      </span>    </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Performance summary    </h2>    <div class=&quot;cards&quot;>      <div class=&quot;card&quot;>        <span>Amount spent</span>        <strong>THB 127,374.53</strong>        <small>          2026-07-26          to          2026-08-24        </small>      </div>      <div class=&quot;card&quot;>        <span>Reach</span>        <strong>15,462,645</strong>        <small>          29,327,042 impressions          ·          1.90 frequency        </small>      </div>      <div class=&quot;card&quot;>        <span>Link clicks</span>        <strong>1,813</strong>        <small>          0.52% CTR          ·          THB 0.83 CPC        </small>      </div>      <div class=&quot;card&quot;>        <span>Tracked leads</span>        <strong>3</strong>        <small>          THB 42,458.18 cost per lead        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchases</span>        <strong>0</strong>        <small>          No tracked purchases returned        </small>      </div>      <div class=&quot;card&quot;>        <span>Purchase value</span>        <strong>          —        </strong>        <small>          Requires purchase value tracking        </small>      </div>      <div class=&quot;card&quot;>        <span>Messages started</span>        <strong>34</strong>        <small>Tracked messaging conversations</small>      </div>      <div class=&quot;card&quot;>        <span>CPM</span>        <strong>THB 4.34</strong>        <small>Cost per 1,000 impressions</small>      </div>    </div>  </section>  <section class=&quot;section&quot;>    <div class=&quot;ai-hero&quot;>      <div class=&quot;ai-header&quot;>        <h2>AI performance assessment</h2>        <span          class=&quot;health health-mixed&quot;        >          Mixed        </span>      </div>      <p class=&quot;ai-summary&quot;>        Account performance is mixed. Awareness and engagement volume is strong: 29,327,042 impressions, 15,462,645 reach, 2,818,620 video views, and 3,005,583 page engagements from THB 127,374.53. However, the business goal is profitable ticket sales and qualified leads, and the account reported only 1 lead, 34 messaging conversations started, 22 messaging replies, 282 landing page views, and no purchase or purchase value data. Purchase performance and ROAS cannot be evaluated. Lead volume is below the minimum_results_before_decision of 3, so CPL decisions are directionally useful but not statistically reliable.      </p>          </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Priority actions    </h2>    <div class=&quot;action-grid&quot;>                <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>1</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Rebuild budget around lead, messaging, and purchase intent instead of follows/likes            </h3>            <p>              <strong>Why:</strong>              Most spend is going to follower or engagement campaigns while only 1 lead and no purchases were reported from THB 127,374.53 spend.            </p>            <p>              <strong>Do this:</strong>              Create separate campaigns for ticket purchases, lead capture, and qualified messaging. Keep follower/engagement campaigns capped and do not let them consume the majority of spend.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>2</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Reduce duplicated Broad Destination follower campaigns            </h3>            <p>              <strong>Why:</strong>              The Broad Destination campaigns spent about THB 62,313.07 combined and produced only 1 lead, 13 messaging conversations started, and 8 link clicks. The largest one, campaign_id 120250948392580402, spent THB 44,087.75 for 1 lead, 10 conversations started, and 6 link clicks.            </p>            <p>              <strong>Do this:</strong>              Reduce budgets on the duplicated Broad Destination campaigns by 50-70%, consolidate learnings into one clean structure, and rebuild them only if the objective is clearly defined.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>3</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Pause or rebuild ERROR QUARANTINED campaigns if the goal is traffic, leads, or messages            </h3>            <p>              <strong>Why:</strong>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers delivered cheap reach but only 3 link clicks and 1 messaging conversation from THB 16,053.95. The Thailand quarantined campaign spent THB 4,201.39 with 0 link clicks and no leads.            </p>            <p>              <strong>Do this:</strong>              If these are not intentional awareness-only campaigns, pause and rebuild them with clean naming, correct objective, and proper destination or message CTA.            </p>          </div>                  <div class=&quot;action-card priority-medium&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>4</span>              <span class=&quot;priority-badge&quot;>                medium              </span>            </div>            <h3>              Keep AQ_MU2025_Followers_IN but cap scaling            </h3>            <p>              <strong>Why:</strong>              AQ_MU2025_Followers_IN generated 28,644 likes from THB 30,323.05, or about THB 1.06 per like, with 5.06% CTR. It is efficient for follower growth but not proven for ticket sales or leads.            </p>            <p>              <strong>Do this:</strong>              Keep as an always-on follower/engagement layer only if page growth is a priority. Cap budget and do not scale it as a lead or purchase driver.            </p>          </div>                  <div class=&quot;action-card priority-high&quot;>            <div class=&quot;action-top&quot;>              <span class=&quot;action-number&quot;>5</span>              <span class=&quot;priority-badge&quot;>                high              </span>            </div>            <h3>              Investigate purchase and lead tracking before judging profitability            </h3>            <p>              <strong>Why:</strong>              No purchase events, purchase value, or ROAS were supplied. Only 1 lead was reported, below the minimum decision threshold of 3.            </p>            <p>              <strong>Do this:</strong>              Verify Pixel/CAPI purchase, lead, landing page view, and value events before making profitability decisions.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What is working    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding positive&quot;>            <h3>              AQ_MU2025_Followers_IN            </h3>            <p>              Strong follower and engagement delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 30,323.05 spend, 28,644 likes, 550,544 page engagements, 521,900 post engagements, 5.06% CTR, about THB 1.06 per like.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep for follower growth, but cap budget because it produced no leads, no purchases, and only 238 link clicks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              New post engagement campaign            </h3>            <p>              Best engagement efficiency and strongest messaging signal among campaigns with meaningful spend.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 5,461.89 spend, 772,033 post engagements, 1,057 link clicks, 14 messaging conversations started, and 8 messaging replies. Cost per conversation started was about THB 390.14.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep and carefully test as a messaging/remarketing feeder. Add qualification prompts because it also generated 7 messaging blocks.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Corporates | 5 Languages | 2026-06-19            </h3>            <p>              Very efficient traffic quality on a tiny sample.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16.24 spend, 154 link clicks, 97 landing page views, 13.10% CTR, about THB 0.17 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Do not scale aggressively yet because spend is tiny and there are no leads or purchases. Use as a controlled traffic/lead test.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Corporates | 6 Languages | 2026-06-19            </h3>            <p>              Strong early traffic performance on a tiny sample.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 28.05 spend, 172 link clicks, 94 landing page views, 8.96% CTR, about THB 0.30 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Continue testing with enough budget to reach at least 3 leads or purchases before making a decision.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              Claude | IN | Families | 6 Languages | 2026-06-19            </h3>            <p>              Efficient traffic and landing page view delivery on a tiny sample.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 41.84 spend, 181 link clicks, 91 landing page views, 5.70% CTR, about THB 0.46 per landing page view.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep in testing, but do not declare it a winner until it produces lead or purchase volume.            </div>          </div>                  <div class=&quot;finding positive&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Extremely cheap awareness reach and video volume if awareness was the intended objective.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              23,858,980 impressions, THB 0.67 CPM, 1,315,149 video views, and 1,331,596 post engagements from THB 16,053.95.            </div>            <div class=&quot;recommendation&quot;>              <strong>Next step:</strong>              Keep only if the explicit goal is low-cost reach/video exposure. Do not use this setup for traffic, leads, messages, or ticket sales.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      What needs improvement    </h2>    <div class=&quot;finding-grid&quot;>                <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination (campaign_id 120250948392580402)            </h3>            <p>              Largest spend allocation is not aligned with lead or ticket sales outcomes.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 44,087.75 spend, 912,492 impressions, 35,187 clicks, but only 6 link clicks, 1 lead, 10 messaging conversations started, and no purchases. Cost per like was about THB 11.92.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce budget significantly and rebuild around a lead, message, or purchase objective. Do not judge final CPL yet because only 1 lead is below the minimum result threshold of 3.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination duplicate campaigns            </h3>            <p>              Budget is fragmented across duplicate campaigns with the same name and limited direct-response output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              Campaign_ids 120250948394960402, 120250948398070402, 120250948421480402, and 120250948426480402 spent THB 17,960.45 combined and produced only 2 link clicks, 3 messaging conversations started, no leads, and no purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Consolidate or rebuild. Keep only the strongest engagement variant if follower growth is still needed; otherwise reallocate to lead, traffic, or messaging tests.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers            </h3>            <p>              Very weak for traffic and messaging despite huge delivery.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 16,053.95 spend, 23,858,980 impressions, only 3 link clicks, 1 messaging conversation started, and 5 messaging blocks.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Pause or rebuild if this budget is expected to support leads, messages, or ticket sales.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families            </h3>            <p>              Follower cost and messaging cost are weaker than stronger alternatives.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 7,867.50 spend, 2,418 likes, about THB 3.25 per like, 6 messaging conversations started, and 3 messaging replies. Cost per conversation started was about THB 1,311.25.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Reduce unless the Families audience is strategically required. Shift budget toward New post engagement campaign or a rebuilt lead/messaging test.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              High CPM and no direct-response outcomes supplied.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 1,067.55 spend, THB 76.81 CPM, 225 likes, 0 link clicks, no leads, no messaging conversations, and no purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Keep only at a small awareness/follower budget if Thailand is a priority market. Otherwise reduce and reallocate to India lead or ticket-sales tests.            </div>          </div>                  <div class=&quot;finding negative&quot;>            <h3>              ERROR QUARANTINED | Aquaverse Thailand Daily Follows Likes 2026-08-02 | 1. Thailand Daily            </h3>            <p>              High delivery cost and no lead, link, or purchase output.            </p>            <div class=&quot;evidence&quot;>              <strong>Evidence:</strong>              THB 4,201.39 spend, THB 180.60 CPM, 1,847 likes, 0 link clicks, no leads, no messaging conversations, and no purchases.            </div>            <div class=&quot;recommendation&quot;>              <strong>Recommended change:</strong>              Rebuild or reduce. The quarantined setup should not receive incremental budget without a clear awareness-only purpose.            </div>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Budget recommendations    </h2>    <div>                <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-08-02 | 1. Broad Destination campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New lead, purchase, and messaging campaigns              </strong>            </div>            <p>              These Broad Destination campaigns consumed about THB 62,313.07 combined, nearly half of total spend, but produced only 1 lead, 13 messaging conversations started, 8 link clicks, and no purchases.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                ERROR QUARANTINED | Aquaverse India Daily Page Follow Visibility 2026-06-26 | 4. Young Adult Travellers              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Claude traffic/lead test campaigns and purchase-intent retargeting              </strong>            </div>            <p>              The quarantined India campaign is strong for cheap reach but weak for business outcomes: only 3 link clicks and 1 conversation from THB 16,053.95. Claude campaigns produced 282 landing page views from only THB 86.13 total spend.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Aquaverse India Daily Follows Likes 2026-06-29 | 2. Families              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                New post engagement campaign or a rebuilt click-to-message lead campaign              </strong>            </div>            <p>              Families produced 6 conversations started at about THB 1,311.25 each, while New post engagement campaign produced 14 conversations started at about THB 390.14 each.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Thailand follower campaigns              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                India campaigns focused on leads, messages, or ticket purchases              </strong>            </div>            <p>              The two Thailand campaigns spent THB 5,268.94 combined with 0 link clicks, no leads, no conversations, and no purchases. Keep only if Thailand is an active business priority.            </p>          </div>                  <div class=&quot;budget-row&quot;>            <div>              <span>Reduce or take from</span>              <strong>                Uncapped follower/engagement allocation              </strong>            </div>            <div class=&quot;budget-arrow&quot;>→</div>            <div>              <span>Move toward</span>              <strong>                Capped awareness layer plus separate conversion layer              </strong>            </div>            <p>              Follower and engagement campaigns are generating volume, but account-level direct-response output is only 1 lead and no purchases.            </p>          </div>            </div>  </section>  <section class=&quot;section&quot;>    <h2 class=&quot;section-title&quot;>      Recommended tests    </h2>    <div class=&quot;test-grid&quot;>                <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 1            </span>            <h3>              Tracked ticket purchase or lead campaign            </h3>            <p>              <strong>Setup:</strong>              Launch a dedicated campaign optimized for purchase or lead events using clean tracking. Use the strongest traffic creatives/audiences from Claude | IN | Corporates | 5 Languages, Claude | IN | Corporates | 6 Languages, and Claude | IN | Families | 6 Languages.            </p>            <p>              <strong>Success metric:</strong>              Evaluate only after at least 3 leads or purchases. Primary metrics: cost per lead or purchase, landing page view to lead rate, and purchase value if available.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 2            </span>            <h3>              Click-to-message qualification flow            </h3>            <p>              <strong>Setup:</strong>              Use New post engagement campaign learnings to create a message campaign with qualification questions for ticket intent, visit date, group size, and location.            </p>            <p>              <strong>Success metric:</strong>              Cost per messaging conversation started, cost per messaging reply, and number of qualified conversations. Compare against current New post engagement campaign: 14 conversations started and 8 replies from THB 5,461.89.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 3            </span>            <h3>              Claude traffic scale test            </h3>            <p>              <strong>Setup:</strong>              Run the three Claude campaigns with controlled equal budgets and UTM tracking to confirm whether low landing page view costs hold at higher spend.            </p>            <p>              <strong>Success metric:</strong>              Landing page view cost, landing page view rate, and downstream leads or purchases after reaching the minimum 3-result threshold.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 4            </span>            <h3>              Broad Destination consolidation test            </h3>            <p>              <strong>Setup:</strong>              Replace the duplicated Broad Destination follower campaigns with one consolidated campaign and one clear objective. Test either follows only or lead/message only, not both together.            </p>            <p>              <strong>Success metric:</strong>              For follows: cost per like and page engagement. For business outcomes: cost per lead, purchase, or qualified conversation after at least 3 results.            </p>          </div>                  <div class=&quot;test-card&quot;>            <span class=&quot;test-index&quot;>              Test 5            </span>            <h3>              Awareness-to-retargeting funnel            </h3>            <p>
